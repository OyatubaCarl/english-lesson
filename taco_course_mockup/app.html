<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Tacos English タコスパーティー</title>
<meta name="theme-color" content="#e8642a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="app_assets/icon-192.png">
<!-- iOS「ホーム画面に追加」用（スタンドアロン起動でマイク許可の毎回確認を回避）。Service Workerは使わない方針 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タコスパーティー">
<link rel="apple-touch-icon" sizes="180x180" href="app_assets/icon-180.png">
<link rel="apple-touch-icon" href="app_assets/icon-512.png">
</head><body>
<style>
  /* 本アプリの基調（index.html系・青×白・ライト/ダーク両対応）。※厨房ラッシュのみ暖色スキン(.krx/.kr-ovl) */
  :root{
    --bg:#fafafa;--card:#fff;--panel:#f3f6fb;--fg:#1f2937;--fg-soft:#374151;--muted:#6b7280;--faint:#9ca3af;
    --accent:#2563eb;--accent-dark:#1d4ed8;--accent-soft:#eff6ff;--border:#e5e7eb;--border-soft:#f3f4f6;
    --green:#10b981;--green-soft:#d1fae5;--green-ink:#065f46;--amber:#f59e0b;--amber-soft:#fef3c7;--amber-ink:#92400e;
    --red:#ef4444;--red-soft:#fee2e2;--red-ink:#991b1b;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
    --shadow:0 6px 18px rgba(15,23,42,.10);--shadow-lg:0 20px 48px rgba(15,23,42,.18);
    --radius:14px;--ui:"Hiragino Sans","Yu Gothic",Meiryo,system-ui,-apple-system,sans-serif;
    --serif:Georgia,"Times New Roman","Hiragino Mincho ProN",serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f172a;--card:#1e293b;--panel:#172033;--fg:#e5e9f0;--fg-soft:#cbd5e1;--muted:#94a3b8;--faint:#64748b;
    --accent:#3b82f6;--accent-dark:#60a5fa;--accent-soft:#1b2b47;--border:#334155;--border-soft:#263145;
    --green:#34d399;--green-soft:#0f3d31;--green-ink:#6ee7b7;--amber:#fbbf24;--amber-soft:#3b2f12;--amber-ink:#fcd34d;
    --red:#f87171;--red-soft:#3b1a1a;--red-ink:#fca5a5;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 6px 18px rgba(0,0,0,.4);--shadow-lg:0 22px 50px rgba(0,0,0,.55);
  }}
  :root[data-theme="light"]{--bg:#fafafa;--card:#fff;--panel:#f3f6fb;--fg:#1f2937;--fg-soft:#374151;--muted:#6b7280;--faint:#9ca3af;--accent:#2563eb;--accent-dark:#1d4ed8;--accent-soft:#eff6ff;--border:#e5e7eb;--border-soft:#f3f4f6;--green:#10b981;--green-soft:#d1fae5;--green-ink:#065f46;--amber:#f59e0b;--amber-soft:#fef3c7;--amber-ink:#92400e;--red:#ef4444;--red-soft:#fee2e2;--red-ink:#991b1b;--shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);--shadow:0 6px 18px rgba(15,23,42,.10);--shadow-lg:0 20px 48px rgba(15,23,42,.18);}
  :root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--panel:#172033;--fg:#e5e9f0;--fg-soft:#cbd5e1;--muted:#94a3b8;--faint:#64748b;--accent:#3b82f6;--accent-dark:#60a5fa;--accent-soft:#1b2b47;--border:#334155;--border-soft:#263145;--green:#34d399;--green-soft:#0f3d31;--green-ink:#6ee7b7;--amber:#fbbf24;--amber-soft:#3b2f12;--amber-ink:#fcd34d;--red:#f87171;--red-soft:#3b1a1a;--red-ink:#fca5a5;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 6px 18px rgba(0,0,0,.4);--shadow-lg:0 22px 50px rgba(0,0,0,.55);}
  /* 厨房ラッシュだけ WordTacos 暖色スキンをスコープ（他画面は上の青×白のまま） */
  .krx, .kr-ovl{
    --bg:#FFF8EE;--card:#FFFDF7;--panel:#F6EDDD;--fg:#2A1F14;--fg-soft:#4A3A28;--muted:#6B5A47;--faint:#9A8770;
    --accent:#C73E1D;--accent-dark:#A93318;--accent-soft:#FCEDE4;--border:#E6D5BC;--border-soft:#F0E5D2;
    --green:#4A7C59;--green-soft:#EAF4EC;--green-ink:#2F5E3E;--amber:#E8B647;--yellow:#E8B647;
    --red:#D2342B;--red-soft:#FCE4E0;--red-ink:#8E1D16;
    --wood:#B8845A;--wood-dark:#8B5E3C;
    --shadow-sm:0 2px 6px rgba(74,50,30,.08);--shadow:0 4px 16px rgba(74,50,30,.12);
    color:var(--fg);
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0} /* body既定margin 8pxが1画面(100dvh)からはみ出す原因だったため除去 */
  .ttf-wrap{font-family:var(--ui);color:var(--fg);background:var(--bg);min-height:100vh;display:flex;justify-content:center;
    padding:22px 14px;line-height:1.65;-webkit-font-smoothing:antialiased}
  /* デスクトップ=スマホ枠。ヘッダー(topbar)とフッター(tabs)は固定、本文(.view)だけスクロール */
  .device{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--border);border-radius:26px;
    box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;height:min(860px,92vh);position:relative}
  /* モバイルは実アプリのように全画面(枠なし)。安全域(ノッチ/ホームインジケータ)を尊重 */
  @media (max-width:480px){
    /* 非standalone(ブラウザ)でもヘッダーがアドレスバーに隠れないよう、body自体はスクロールさせず .view だけスクロール */
    html,body{overflow:hidden;overscroll-behavior:none}
    .ttf-wrap{padding:0;align-items:stretch;min-height:0;height:100dvh}
    .device{max-width:100%;height:100dvh;border-radius:0;border:none;box-shadow:none}
  }

  .topbar{flex:none;display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top,0px)) 15px 12px;border-bottom:1px solid var(--border-soft);background:var(--card);position:relative;z-index:5}
  .topbar .logo{font-weight:800;font-size:.95rem;letter-spacing:-.01em}
  .topbar .logo em{color:var(--accent);font-style:normal}
  .topbar .logo small{display:block;font-size:.52rem;letter-spacing:.06em;color:var(--faint);font-weight:700}
  .topbar .back{border:none;background:var(--panel);color:var(--fg);width:32px;height:32px;border-radius:9px;font-size:1rem;cursor:pointer;font-family:inherit}
  .topbar .sp{flex:1}
  .topbar .st{font-weight:800;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* BGMミュート（右上）。ゲーム内の音・単語の発音は止めない（タコビートの曲も止まらない） */
  .topbar .mute{flex:none;border:none;background:var(--panel);color:var(--fg);width:32px;height:32px;border-radius:9px;
    font-size:.95rem;cursor:pointer;font-family:inherit;margin-left:6px;transition:.12s}
  .topbar .mute:active{transform:scale(.92)}
  .topbar .mute.off{opacity:.5}

  .view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:15px calc(15px + env(safe-area-inset-right,0px)) calc(15px + env(safe-area-inset-bottom,0px)) calc(15px + env(safe-area-inset-left,0px));
    display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .view::-webkit-scrollbar{width:6px}.view::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .kicker{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--faint)}
  .levels{display:flex;gap:0;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:3px}
  .levels button{flex:1;text-align:center;font-size:.74rem;font-weight:800;padding:8px 4px;border-radius:8px;color:var(--muted);
    background:none;border:none;cursor:pointer;font-family:inherit}
  .levels button.on{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}

  .lcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;
    box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .lcard.tap:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .lcard.current{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .lcard.locked{opacity:.7;cursor:default}
  .lrow{display:flex;align-items:center;gap:11px}
  .lnum{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;font-size:.9rem;
    background:var(--panel);color:var(--muted);border:1px solid var(--border)}
  .lcard.current .lnum{background:var(--accent);color:#fff;border-color:var(--accent)}
  .lcard.done .lnum{background:var(--green);color:#fff;border-color:var(--green)}
  .ltitle{font-weight:800;font-size:.94rem}.lmeta{font-size:.72rem;color:var(--muted);margin-top:1px}
  .grab{margin-left:auto;font-size:1.05rem;color:var(--faint)}
  .pips{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .pip{width:15px;height:15px;border-radius:5px;background:var(--panel);border:1.5px solid var(--border)}
  .pip.done{background:var(--green);border-color:var(--green)}
  .pip.cur{border-color:var(--accent);background:var(--accent-soft)}
  .pips .lbl{font-size:.66rem;color:var(--faint);font-weight:800;margin-left:3px;font-variant-numeric:tabular-nums}
  .locknote{font-size:.72rem;color:var(--faint);font-weight:700}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:none;
    border-radius:11px;padding:13px;font-weight:800;font-size:.92rem;font-family:inherit;cursor:pointer;box-shadow:var(--shadow-sm);width:100%}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
  .btn.soft{background:var(--panel);color:var(--fg);border:1px solid var(--border);box-shadow:none}
  .btn.green{background:var(--green)}

  .textcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
  .en{font-family:var(--serif);color:var(--fg)}
  .passage .en{font-size:1.05rem;font-weight:600;line-height:1.55}
  .passage .jp{font-size:.82rem;color:var(--muted);margin-top:5px}
  .passage .ln{padding:9px 0;border-bottom:1px solid var(--border-soft)}
  .passage .ln:last-child{border:none}

  /* journey */
  .course-progress{display:flex;align-items:center;gap:9px}
  .course-progress .bar{flex:1;height:9px;border-radius:999px;background:var(--panel);overflow:hidden;border:1px solid var(--border)}
  .course-progress .bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s cubic-bezier(.16,1,.3,1)}
  .course-progress .n{font-size:.72rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .step{display:flex;gap:12px;padding:5px 0;align-items:flex-start}
  .rail{width:40px;flex:none;display:flex;flex-direction:column;align-items:center;position:relative}
  .node{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:1.05rem;z-index:2;
    border:1.5px solid var(--border);background:var(--card);color:var(--muted)}
  .rail .line{width:2px;flex:1;min-height:14px;background:var(--border);margin:2px 0}
  .step:last-child .line{display:none}
  .step.done .node{background:var(--green);border-color:var(--green);color:#fff}
  .step.done .line{background:var(--green)}
  .step.current .node{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
  .step.locked .node{background:var(--panel);color:var(--faint)}
  .sc{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-sm);
    display:flex;align-items:center;gap:8px;cursor:pointer;transition:transform .1s}
  .step.locked .sc{cursor:not-allowed;opacity:.65;box-shadow:none}
  .step.current .sc{border-color:var(--accent)}
  .sc.tap:hover{transform:translateX(2px)}
  .sc .sn{font-weight:800;font-size:.9rem}.sc .sd{font-size:.71rem;color:var(--muted);margin-top:1px}
  /* タコス厨房ラッシュ（昇進試験・必須。ロック中レッスンでは飛び級試験） */
  .rush-step .line{display:none}
  .rush-step .node.rush{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink)}
  .rush-step.done .node.rush{background:var(--green);border-color:var(--green);color:#fff}
  .rush-step .sc{border-style:solid;border-color:var(--amber)}
  .rush-step .sc .go{margin-left:auto;font-size:1.1rem}
  .ex-badge{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.02em;color:var(--amber-ink);
    background:var(--amber-soft);border:1px solid var(--amber);border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle}
  .sc .go{margin-left:auto;font-size:1.1rem;color:var(--accent);flex:none}
  .tag{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;flex:none;margin-left:auto}
  .tag.g{background:var(--green-soft);color:var(--green-ink)}.tag.lk{background:var(--panel);color:var(--faint)}

  /* quiz */
  .qhead{font-weight:800;font-size:1.05rem;line-height:1.5}
  .qhead .em{display:inline-block;background:var(--accent);color:#fff;font-family:var(--serif);font-weight:700;
    padding:1px 10px;border-radius:8px;margin:0 2px}
  .qhead .bl{display:inline-block;min-width:56px;border-bottom:2.5px dashed var(--accent);text-align:center;color:var(--accent);font-family:var(--serif)}
  .choices{display:flex;flex-direction:column;gap:9px}
  .choice{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:11px;
    padding:12px 14px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;color:var(--fg);transition:.1s}
  .choice .k{width:22px;height:22px;border-radius:6px;background:var(--panel);display:grid;place-items:center;font-size:.75rem;font-weight:800;color:var(--muted);flex:none}
  .choice.tap:hover{border-color:var(--accent);background:var(--accent-soft)}
  .choice.correct{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
  .choice.correct .k{background:var(--green);color:#fff}
  .choice.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
  .choice.wrong .k{background:var(--red);color:#fff}
  .choice:disabled{cursor:default}
  .qmeta{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .streak{display:flex;gap:5px;flex-wrap:wrap}
  .streak i{width:14px;height:14px;border-radius:50%;background:var(--panel);border:1.5px solid var(--border)}
  .streak i.on{background:var(--accent);border-color:var(--accent)}

  /* vocab card */
  .vcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow-sm)}
  .vcard .vw{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--accent)}
  .vcard .vs{font-size:.9rem;margin-top:6px;line-height:1.6}
  .vcard .vs .em{background:var(--accent);color:#fff;font-family:var(--serif);padding:1px 8px;border-radius:7px;font-weight:700}
  .vcard .vm{margin-top:8px;font-size:.85rem;font-weight:800;color:var(--green-ink);background:var(--green-soft);
    border-radius:8px;padding:7px 10px;display:none}
  .vcard.open .vm{display:block}
  .vcard .reveal{margin-top:8px;font-size:.78rem;color:var(--accent);font-weight:800;background:none;border:none;cursor:pointer;font-family:inherit;padding:0}
  .vcard.open .reveal{display:none}

  /* song */
  .player{background:linear-gradient(135deg,var(--accent),#4f46e5);border-radius:16px;padding:18px;color:#fff;text-align:center;box-shadow:var(--shadow)}
  .player .disc{font-size:2.4rem;transition:transform .3s}.player.playing .disc{animation:spin 3s linear infinite}
  .player .pt{font-weight:800;margin-top:6px}.player .pbar{height:6px;background:rgba(255,255,255,.3);border-radius:999px;margin-top:12px;overflow:hidden}
  .player .pbar>i{display:block;height:100%;width:0;background:#fff;border-radius:999px}
  .player .play{margin-top:12px;background:#fff;color:var(--accent);border:none;border-radius:999px;padding:9px 22px;font-weight:800;cursor:pointer;font-family:inherit}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* mic / shadow */
  .mic{display:flex;flex-direction:column;align-items:center;gap:10px}
  .mic .b{width:82px;height:82px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:grid;place-items:center;
    font-size:2rem;cursor:pointer;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent);position:relative}
  .mic .b.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 45%,transparent);animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(1.3);opacity:0}}
  .match{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow-sm)}
  .match .r{display:flex;justify-content:space-between;font-size:.74rem;font-weight:800;color:var(--muted)}
  .match .r b{font-size:1.2rem;color:var(--amber-ink)}
  .mbar{position:relative;height:9px;border-radius:999px;background:var(--panel);border:1px solid var(--border);margin:11px 0 6px}
  .mbar>i{display:block;height:100%;border-radius:999px;background:var(--amber);transition:width .4s}
  .mbar>s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--green)}
  .attempts{display:flex;gap:8px;justify-content:center;align-items:center}
  .attempts i{width:14px;height:14px;border-radius:50%;background:var(--panel);border:1.5px solid var(--border)}
  .attempts i.on{background:var(--accent);border-color:var(--accent)}
  .attempts .l{font-size:.68rem;font-weight:800;color:var(--muted);margin-left:3px}

  .banner{border-radius:12px;padding:11px 13px;font-size:.85rem;font-weight:800;display:flex;align-items:center;gap:8px}
  .banner.ok{background:var(--green-soft);color:var(--green-ink)}.banner.ng{background:var(--red-soft);color:var(--red-ink)}
  .banner.info{background:var(--accent-soft);color:var(--accent-dark)}
  .banner.listening{animation:barPulse 1s ease-in-out infinite alternate}
  .note{font-size:.75rem;color:var(--faint);text-align:center;line-height:1.5}
  .spacer{flex:1}

  /* overlay */
  .ovl{position:absolute;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:22px;z-index:20}
  .ovl .box{background:var(--card);border-radius:20px;padding:26px 22px;text-align:center;box-shadow:var(--shadow-lg);max-width:340px;width:100%}
  .ovl .big{font-size:3rem}.ovl h3{margin:8px 0 4px;font-size:1.3rem}.ovl p{margin:0 0 16px;color:var(--muted);font-size:.9rem}
  .confetti{font-size:1.6rem;letter-spacing:4px}
  /* youtube */
  .ytwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--border)}
  .ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  /* タコビート埋め込み(6品目) — 戻るヘッダー＋iframe＋極小キャプションで1画面(スクロールなし)に収める */
  .beat-step{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
  .beat-stage{position:relative;flex:1;min-height:0;display:flex}
  .beat-frame{display:block;flex:1;min-height:0;width:100%;height:100%;border:1px solid var(--border);border-radius:14px;background:#000;box-shadow:var(--shadow-sm)}
  /* 結果/準備中はiframeに重ねる(スクロール不要で視認)。バナーはクリックを透過し、ボタンだけ受ける */
  .beat-overlay{position:absolute;left:10px;right:10px;z-index:6;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .beat-overlay.top{top:10px}
  .beat-overlay.bot{bottom:10px}
  .beat-overlay .banner{box-shadow:var(--shadow)}
  .beat-overlay .btn{pointer-events:auto}
  .beat-cap{flex:none;font-size:11px;color:var(--faint);font-weight:700;text-align:center;line-height:1.3}
  /* in-passage clickable words */
  .jpmix{font-size:1.1rem;line-height:2.6;font-weight:500;color:var(--fg)}
  /* 熟したトマト・チップ（タップで収穫する英単語） */
  .vword{position:relative;display:inline-block;font-family:var(--serif);font-weight:800;color:#fff;background:radial-gradient(circle at 34% 28%,#fb7185,#dc2626 72%);border:none;border-radius:999px;padding:1px 11px 2px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 5px rgba(190,30,30,.35),inset 0 -2px 3px rgba(0,0,0,.14);transition:transform .12s}
  /* 🍅 ヘタ（緑のカルクス＝星型の葉＋短い茎）: チップ上辺中央に上品にのせる */
  .vword::after{content:"";position:absolute;left:50%;top:-9px;width:2.5px;height:6px;transform:translateX(-50%);background:linear-gradient(#34d399,#15803d);border-radius:2px;z-index:0;pointer-events:none}
  .vword::before{content:"";position:absolute;left:50%;top:-7px;width:13px;height:13px;transform:translateX(-50%);z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 32%,#6ee7a0,#16a34a 72%);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 1px 0 rgba(0,0,0,.12))}
  .vword:hover{transform:translateY(-1px) scale(1.04)}
  .vword.pop{animation:tomatoPop .3s}
  @keyframes tomatoPop{0%{transform:scale(1)}40%{transform:scale(1.24)}70%{transform:scale(.93)}100%{transform:scale(1)}}
  .vword.done{color:#7f1d1d;background:radial-gradient(circle at 34% 28%,#fecaca,#f87171 80%);cursor:default;box-shadow:inset 0 -1px 2px rgba(0,0,0,.1);padding:0 9px 1px}
  .vword.done::before{background:radial-gradient(circle at 50% 32%,#86efac,#22c55e 72%)}
  .vword.done ruby rt{font-size:.44em;color:#7f1d1d;font-weight:800;font-family:var(--ui)}
  /* bottom sheet popup */
  .vsheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.4);z-index:30;display:flex;align-items:flex-end}
  .vsheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px 16px 20px;box-shadow:0 -12px 34px rgba(0,0,0,.25);animation:sheetup .24s cubic-bezier(.16,1,.3,1)}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
  .vsheet .vh{display:flex;align-items:center;gap:10px}
  .vsheet .vh .w{font-family:var(--serif);font-size:1.55rem;font-weight:700;color:var(--accent)}
  .vsheet .vh .spk{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);border:none;font-size:1.15rem;cursor:pointer}
  .vsheet .vq{font-size:.76rem;color:var(--muted);font-weight:800;margin:12px 0 9px}
  .choice.shake{animation:shake .3s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  /* shadowing (本サイト方式: 単語単位マッチング) */
  .shline{font-family:var(--serif);font-size:1.12rem;line-height:2.3;color:var(--fg)}
  .sh-word{padding:1px 3px;border-radius:5px;transition:background .18s,color .18s}
  .sh-word.matched{background:var(--green-soft);color:var(--green-ink);font-weight:700}
  .sh-word.auto-matched{background:var(--green-soft);color:var(--green-ink);font-weight:700}
  /* 制限時間バー (WordTacos流) */
  .tbar-wrap{height:9px;background:var(--border);border-radius:999px;overflow:hidden;margin:2px 0 10px}
  .tbar{height:100%;width:100%;background:linear-gradient(90deg,var(--green) 0%,var(--amber) 55%,var(--red) 92%);transition:width .1s linear}
  .tbar.danger{animation:barPulse .45s ease-in-out infinite alternate}
  @keyframes barPulse{from{opacity:1}to{opacity:.35}}
  /* 文法テストの解説 */
  .expl{margin-top:10px;border-radius:12px;padding:11px 13px;font-size:.84rem;line-height:1.7;border:1px solid var(--border)}
  .expl.ok{background:var(--green-soft);color:var(--green-ink);border-color:var(--green)}
  .expl.ng{background:var(--amber-soft);color:var(--amber-ink);border-color:var(--amber)}
  .expl b{font-weight:800}
  /* 並べ替え問題（Duolingo風の語順ビルダー） */
  .ro-prompt{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-top:2px}
  .ro-prompt .lb{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--faint)}
  .ro-prompt .tx{font-size:1.05rem;font-weight:700;margin-top:2px}
  .ro-prompt.en .tx{font-family:var(--serif)}
  .ro-answer{min-height:52px;border:2px dashed var(--border);border-radius:12px;padding:8px;margin-top:10px;
    display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;background:var(--card)}
  .ro-answer.correct{border-style:solid;border-color:var(--green);background:var(--green-soft)}
  .ro-answer.wrong{border-style:solid;border-color:var(--red);background:var(--red-soft);animation:shake .3s}
  .ro-answer:empty::before{content:'ここに並べよう';color:var(--faint);font-size:.8rem;align-self:center;padding:6px}
  .ro-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:46px}
  .ro-tile{background:var(--card);border:1.5px solid var(--border);border-bottom-width:3px;border-radius:10px;
    padding:9px 13px;font-size:.96rem;font-weight:700;color:var(--fg);cursor:pointer;font-family:inherit;
    box-shadow:var(--shadow-sm);transition:transform .1s,opacity .15s,background .12s}
  .ro-tile.en{font-family:var(--serif)}
  .ro-tile:active{transform:translateY(1px)}
  .ro-tile.used{opacity:0;pointer-events:none}
  .ro-answer .ro-tile{border-bottom-width:2px;box-shadow:none}
  /* ドラッグ中の浮遊タイル＋挿入位置インジケータ */
  .ro-ghost{position:fixed;z-index:120;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);opacity:.96;
    box-shadow:0 10px 26px rgba(0,0,0,.3)!important;background:var(--card)}
  .ro-gap{display:inline-block;width:3px;align-self:stretch;min-height:38px;background:var(--accent);border-radius:2px;margin:0 2px;animation:gapPulse .6s ease-in-out infinite alternate}
  @keyframes gapPulse{from{opacity:.45}to{opacity:1}}
  /* 速度評価バッジ（時間制限つき単語テスト） */
  .spd-badge{margin-top:10px;border-radius:12px;padding:9px 13px;font-size:.9rem;font-weight:800;text-align:center;border:1px solid var(--border)}
  .spd-badge .t{font-weight:600;opacity:.7;font-size:.82em}
  .spd-badge.tacos{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent)}
  .spd-badge.excellent{background:var(--green-soft);color:var(--green-ink);border-color:var(--green)}
  .spd-badge.good{background:var(--amber-soft);color:var(--amber-ink);border-color:var(--amber)}
  /* 通過の◯フラッシュ (GAS success-mark流) */
  .okflash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;pointer-events:none;
    font-size:8rem;font-weight:900;color:var(--green);animation:okpop .9s ease-out forwards;
    text-shadow:0 0 32px rgba(16,185,129,.55),0 0 64px rgba(37,99,235,.35)}
  @keyframes okpop{0%{transform:scale(.4);opacity:0}18%{transform:scale(1.12);opacity:1}72%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
  /* 全画面 正解マーク（WordTacos overlay-mark 流: 虹色＋波打ち） */
  .vmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60;animation:vfade .78s ease forwards}
  .vmark span{font-weight:900;line-height:1;text-shadow:2px 2px 12px rgba(0,0,0,.28);animation:vrainbow 1.1s linear infinite,vwave 1.1s ease-in-out infinite}
  .vmark.sym span{font-size:150px}
  .vmark.txt span{font-size:2.6rem;letter-spacing:.01em;white-space:nowrap}
  .vmark.ng span{color:var(--red)!important;animation:vwave 1.1s ease-in-out infinite;text-shadow:2px 2px 12px rgba(210,52,43,.3)}
  @keyframes vfade{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.06)}76%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
  @keyframes vrainbow{0%,100%{color:#2563eb}14%{color:#f59e0b}28%{color:#eab308}42%{color:#10b981}57%{color:#06b6d4}71%{color:#8b5cf6}85%{color:#ec4899}}
  @keyframes vwave{0%,100%{transform:translateY(0)}20%{transform:translateY(-12px)}40%{transform:translateY(2px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
  /* 録音中インジケータ（赤・明確表示） */
  .recbtn{display:flex;align-items:center;justify-content:center;gap:9px;background:#ef4444;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;font-size:.92rem;margin-top:8px;box-shadow:0 6px 18px rgba(239,68,68,.42);width:100%}
  .recbtn .rdot{width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:recpulse 1s ease-out infinite}
  @keyframes recpulse{0%{opacity:1;transform:scale(.8);box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{opacity:.55;transform:scale(1.15);box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{opacity:1;transform:scale(.8);box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  .shline.reclive{box-shadow:0 0 0 2px #ef4444 inset;border-radius:10px;transition:box-shadow .2s}
  /* 楽しさ: ボタン押下の弾み・カードのポップイン */
  .btn:active,.choice:active,.sc.tap:active,.lcard.tap:active{transform:scale(.975)}
  .btn{transition:transform .1s,filter .15s,background .15s}
  .step,.lcard{animation:popIn .3s ease both}
  @keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* ==== マスコット (Teacher Tacos) — WordTacos と同一の重ね画像方式 ==== */
  .mascot{position:relative;pointer-events:none}
  .mascot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .15s;
    filter:drop-shadow(0 8px 14px rgba(74,50,30,.15))}
  .mascot img.active{opacity:1}
  .mascot.bounce{animation:mascotBounce 1.6s ease-in-out infinite}
  @keyframes mascotBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  /* ==== タイトル画面 (WordTacos hero 踏襲) ==== */
  .hero{text-align:center;padding:34px 0 10px}
  .hero h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.25}
  .hero h1 .taco{color:var(--accent)}
  .hero .tagline{font-size:.78rem;color:var(--muted);margin-top:5px}
  .hero .mascot{width:210px;height:260px;margin:22px auto 0}
  /* ==== 新タイトル (パーティーヒーロー): サンセット×ティール×ピンクのフィエスタ配色 ==== */
  .hero2{text-align:center;padding:8px 0 0}
  .hero2 .eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.16em;color:#b8622a}
  /* 切り抜き(ステッカー)ヒーロー: 枠なしでページに直置き→下のロゴと一体化 */
  .hero2-cut{position:relative;margin:6px 6px 0;filter:drop-shadow(0 16px 28px rgba(120,50,10,.24))}
  .hero2-cut img{width:100%;display:block}
  .hero2-logo{width:88%;max-width:356px;margin:-30px auto 0;position:relative;z-index:2;filter:drop-shadow(0 6px 14px rgba(120,50,10,.32))}
  .hero2-logo img{width:100%;display:block}
  .hero2 .jp{font-size:1.02rem;font-weight:900;color:#7c3f16;margin-top:2px;letter-spacing:.05em}
  .hero2 .jp small{display:block;font-size:.68rem;font-weight:700;color:#b8824f;letter-spacing:.1em;margin-top:2px}
  .hero2 .tagline2{font-size:.78rem;color:#a06a3a;margin-top:7px;font-weight:600}
  /* タイトルの中身を縦中央に寄せ、開始ボタンを中央揃え */
  .title-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:0}
  .btn-party{display:block;margin:18px auto 0;background:linear-gradient(135deg,#f5a623,#e8642a 52%,#d94f7e);color:#fff;font-weight:900;font-size:1.05rem;
    border:none;border-radius:999px;padding:14px 46px;box-shadow:0 8px 20px rgba(217,79,46,.4);cursor:pointer;font-family:inherit;letter-spacing:.06em}
  .btn-party:active{transform:scale(.96)}
  .credits{margin-top:20px;font-size:.66rem;color:var(--muted);text-align:center;line-height:1.7}
  .credits a{color:var(--muted)}
  /* ==== 設定画面 (WordTacos settings 踏襲) ==== */
  .settings-list{display:flex;flex-direction:column;margin-top:4px}
  .settings-row{background:var(--card);border:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom-width:0}
  .settings-row:first-of-type{border-radius:12px 12px 0 0}
  .settings-row:last-of-type{border-radius:0 0 12px 12px;border-bottom-width:1px}
  .settings-row>div:first-child{flex:1;min-width:0}
  .settings-row .set-label{font-size:.95rem;font-weight:700}
  .settings-row .set-desc{font-size:.75rem;color:var(--muted);margin-top:2px}
  .switch{position:relative;display:inline-block;width:50px;height:28px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:background .2s;cursor:pointer}
  .switch span::before{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch input:checked+span{background:var(--green)}
  .switch input:checked+span::before{transform:translateX(22px)}
  /* ==== フッタータブ (WordTacos 踏襲・2タブ) ==== */
  .footer-tabs{flex:none;display:flex;border-top:1px solid var(--border);background:var(--card)}
  .footer-tabs .tab-btn{flex:1;background:none;border:none;padding:9px 4px calc(9px + env(safe-area-inset-bottom,0px)/2);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;font-weight:700;color:var(--muted);font-family:inherit}
  .footer-tabs .tab-btn .tab-icon{font-size:1.15rem}
  .footer-tabs .tab-btn.on{color:var(--accent)}
  /* ==== タコス厨房ラッシュ — WordTacos kitchen_rush_prototype と同一の演出 ==== */
  .krx .hud{display:flex;align-items:center;gap:9px}
  .krx .hud .streakn{font-weight:800;color:var(--accent);font-size:1rem;white-space:nowrap}
  .krx .hud .streakn .sep{color:var(--muted);font-weight:700;font-size:.8rem}
  .krx .hud .streak-bar{flex:1;height:10px;background:var(--border);border-radius:999px;overflow:hidden}
  .krx .hud .streak-bar>div{height:100%;background:linear-gradient(90deg,var(--yellow,#E8B647),var(--accent));border-radius:999px;transition:width .35s cubic-bezier(.16,1,.3,1);width:0}
  .krx .hud .timer{font-weight:700;color:var(--muted);min-width:44px;text-align:right;font-size:.85rem;font-variant-numeric:tabular-nums}
  .krx .hud .timer.danger{color:var(--red);animation:krPulse .4s ease-in-out infinite alternate}
  .krx .fails{font-size:.8rem;letter-spacing:.5px;text-align:center;margin-top:4px}
  .krx .fails.danger{animation:krPulse .5s infinite alternate}
  .krx .customer-row{display:flex;align-items:flex-end;justify-content:space-between;height:60px;margin:4px 0 2px;padding:0 8px}
  .krx .customer{width:60px;height:60px;display:flex;align-items:flex-end;justify-content:center;transition:transform .4s}
  .krx .customer img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(74,50,30,.18));user-select:none;-webkit-user-drag:none}
  .krx .customer.happy{animation:happyBounce .8s ease}
  @keyframes happyBounce{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.1)}60%{transform:translateY(0) scale(1.05)}}
  .krx .customer.angry{animation:angryShake .5s ease}
  @keyframes angryShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px);filter:hue-rotate(-20deg)}40%,80%{transform:translateX(6px);filter:hue-rotate(-20deg)}}
  .krx .order{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);position:relative;margin-bottom:12px;transition:background .2s,border-color .2s,box-shadow .2s}
  .krx .order .direction{font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
  .krx .order .prompt{font-size:1.22rem;font-weight:800;line-height:1.3;color:var(--fg)}
  .krx .order::after{content:"";position:absolute;left:32px;bottom:-10px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:10px solid var(--border)}
  .krx .order.final-order{background:linear-gradient(135deg,#FFF1E5 0%,#FFE2D0 100%);border-color:#D2342B;box-shadow:0 0 0 4px rgba(210,52,43,.18),0 6px 18px rgba(210,52,43,.28);animation:finalPulse .9s ease-in-out infinite alternate}
  .krx .order.final-order .direction{color:#D2342B;font-weight:800;letter-spacing:.12em}
  .krx .order.final-order .prompt{color:#B72216}
  @keyframes finalPulse{from{box-shadow:0 0 0 4px rgba(210,52,43,.18),0 6px 18px rgba(210,52,43,.28)}to{box-shadow:0 0 0 7px rgba(210,52,43,.30),0 6px 22px rgba(210,52,43,.42)}}
  .krx .conveyor-wrap{position:relative;margin-bottom:12px;height:84px}
  .krx .conveyor{position:absolute;left:0;right:0;top:26px;height:34px;
    background:repeating-linear-gradient(90deg,var(--wood) 0 16px,var(--wood-dark) 16px 18px);
    border-radius:6px;box-shadow:inset 0 2px 4px rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.15);
    animation:conveyorRoll 1.2s linear infinite}
  @keyframes conveyorRoll{from{background-position:0 0}to{background-position:18px 0}}
  .krx .tortilla{position:absolute;top:2px;left:0;width:74px;height:74px;font-size:4rem;display:flex;align-items:center;justify-content:center;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(74,50,30,.3))}
  .krx .choices2{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:10px}
  .krx .choice2{background:#fff;border:2px solid var(--border);border-radius:12px;padding:13px 12px;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;color:var(--fg);font-family:inherit;min-height:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(74,50,30,.08);transition:transform .1s,border-color .15s}
  .krx .choice2:active{transform:scale(.97)}
  .krx .choice2:disabled{cursor:default;opacity:.55}
  .krx .choice2.correct{background:var(--green-soft);border-color:var(--green);color:var(--green);animation:correctPulse .3s ease}
  .krx .choice2.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);animation:wrongShake .25s ease}
  @keyframes correctPulse{from{transform:scale(.95)}to{transform:scale(1)}}
  @keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .krx .mascot-row{display:flex;align-items:center;gap:10px;padding:4px}
  .krx .mascot-row .mascot{width:62px;height:78px;flex-shrink:0}
  .krx .mascot-row .mascot img{filter:none}
  .krx .mascot.bounce img.active{animation:mascotBounce 1.4s ease-in-out infinite}
  .krx .bubble{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:6px 12px;font-size:.78rem;color:var(--muted);position:relative}
  .krx .bubble::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:8px solid var(--border)}
  .krx .fiesta-flash{position:absolute;inset:0;background:var(--accent);opacity:0;pointer-events:none;animation:fiestaFlash .5s ease;z-index:20}
  @keyframes fiestaFlash{0%{opacity:0}20%{opacity:.25}100%{opacity:0}}
  @keyframes krPulse{from{opacity:1}to{opacity:.5}}
  /* ラッシュ オーバーレイ(スタート/結果) — WordTacos overlay 踏襲 */
  .kr-ovl{position:absolute;inset:0;background:rgba(255,248,238,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:60;text-align:center;overflow-y:auto}
  .kr-ovl h1{font-size:1.7rem;font-weight:800;color:var(--accent);margin-bottom:8px}
  .kr-ovl p{color:var(--muted);margin-bottom:14px;font-size:.9rem;line-height:1.7}
  .kr-ovl .stats{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 18px;text-align:center;min-width:120px}
  .kr-ovl .stats .big{font-size:1.8rem;font-weight:800;color:var(--accent)}
  .kr-ovl .stats .label{font-size:.76rem;color:var(--muted)}
  .kr-ovl .stats-row{display:flex;gap:10px;margin-bottom:16px}
  .kr-ovl .kbtn{display:block;width:230px;background:var(--accent);color:#fff;border:none;padding:14px 24px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);margin:5px auto;font-family:inherit}
  .kr-ovl .kbtn:active{transform:scale(.97)}
  .kr-ovl .end-scene{position:relative;width:190px;height:190px;margin-bottom:4px}
  .kr-ovl .end-scene>img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(74,50,30,.18))}
  .kr-ovl.failed .end-scene>img{animation:failBob 2.4s ease-in-out infinite}
  @keyframes failBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
  .kr-ovl .end-spill{position:absolute;inset:0;pointer-events:none}
  .kr-ovl .end-spill .spill{position:absolute;font-size:1.5rem;opacity:0;display:inline-block}
  .kr-ovl.failed .end-spill .spill{animation:tumbleOut 1.4s ease-out forwards}
  .kr-ovl .spill-1{left:18%;bottom:6%;animation-delay:.05s}.kr-ovl .spill-2{left:35%;bottom:14%;animation-delay:.15s}
  .kr-ovl .spill-3{left:55%;bottom:4%;animation-delay:.25s}.kr-ovl .spill-4{left:72%;bottom:10%;animation-delay:.1s}
  .kr-ovl .spill-5{left:46%;bottom:22%;animation-delay:.3s}.kr-ovl .spill-6{left:88%;bottom:28%;animation-delay:.18s;font-size:1rem}
  @keyframes tumbleOut{0%{transform:translateY(-30px) rotate(0deg);opacity:0}40%{opacity:1}100%{transform:translateY(0) rotate(360deg);opacity:1}}
  .streak-badge{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) scale(0);background:var(--green);color:#fff;padding:13px 22px;border-radius:16px;font-size:1.3rem;font-weight:800;box-shadow:0 8px 32px rgba(74,124,89,.5);pointer-events:none;z-index:50}
  .streak-badge.show{animation:badgePop 1.4s ease forwards}
  @keyframes badgePop{0%{transform:translate(-50%,-50%) scale(0)}30%{transform:translate(-50%,-50%) scale(1.15)}60%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:0}}
  /* 歌カード（ジャーニー先頭・YouTubeリンク） */
  .songcard{background:linear-gradient(135deg,var(--accent-soft),var(--card));border:1px solid var(--accent);border-radius:var(--radius);
    padding:13px 14px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px}
  .songcard .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.3rem}
  .songcard .tx{flex:1;min-width:0}
  .songcard .tx .t{font-weight:800;font-size:.92rem}
  .songcard .tx .s{font-size:.72rem;color:var(--muted);margin-top:1px}
  .songcard .go{flex:none;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 13px;font-weight:800;font-size:.82rem;cursor:pointer;font-family:inherit;white-space:nowrap}
  /* シャドウ内 ハンズフリー切替チップ */
  .hf-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:9px 13px;margin-top:8px}
  .hf-chip .lb{font-size:.82rem;font-weight:700}
  .hf-chip .desc{font-size:.68rem;color:var(--muted)}

  /* ==== タコスパーティー 追加コンポーネント（party_mockup.html から移植・本体テーマに調整） ==== */
  /* 説明モーダル（初回のみ・1〜2文） */
  .intro-bg{position:absolute;inset:0;background:rgba(15,23,42,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
  .intro-box{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);padding:22px 20px 20px;max-width:320px;width:100%;text-align:center;animation:popIn .25s ease}
  .intro-box .ib-emoji{font-size:42px;line-height:1}
  .intro-box .ib-text{font-size:.92rem;font-weight:700;margin:12px 0 16px;line-height:1.75}
  .intro-box .ib-tip{margin:-6px auto 14px;font-size:.76rem;font-weight:600;color:var(--muted);background:var(--panel);border-radius:10px;padding:8px 10px;line-height:1.6;text-align:left}
  /* ミニトースト */
  .ttoast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%) translateY(14px);background:rgba(30,41,59,.92);color:#fff;padding:8px 16px;border-radius:999px;font-size:.8rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:75;max-width:86%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 要素間を飛ぶ演出クローン */
  .fly{position:fixed;z-index:97;pointer-events:none;font-size:18px;font-weight:800;transition:transform .65s cubic-bezier(.3,.7,.4,1),opacity .65s}
  /* ステージカードのタコス棚・レッスンカードの具材列 */
  .taco-shelf{display:flex;gap:5px;align-items:center;font-size:1.3rem}
  .taco-shelf .dim{opacity:.22;filter:grayscale(1)}
  .taco-shelf .lbl{font-size:.66rem;color:var(--faint);font-weight:800;margin-left:5px;font-variant-numeric:tabular-nums}
  .ing-line{display:flex;align-items:center;gap:7px}
  .ing-line .icons{display:flex;gap:3px;font-size:1.05rem}
  .ing-line .icons i{font-style:normal}
  .ing-line .icons i.dim{opacity:.2;filter:grayscale(1)}
  .ing-line .big{font-size:1.5rem}
  .ing-line .lbl{font-size:.66rem;color:var(--faint);font-weight:800;margin-left:auto;font-variant-numeric:tabular-nums}
  /* 🫓 ソング・トルティーヤ（動画上部固定＋焼きゲージ＋コマル＋畳んだ歌詞） */
  .yt-sticky{position:sticky;top:-15px;z-index:15;background:var(--bg);margin:-15px -15px 0;padding:15px 15px 6px;box-shadow:0 8px 12px -10px rgba(30,58,138,.25)}
  .bake-gauge{display:flex;align-items:center;gap:12px}
  .bg-track{position:relative;flex:1;height:12px;border-radius:99px;background:var(--panel);border:1px solid var(--border);overflow:hidden}
  .bg-track i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--amber),#f97316);transition:width .4s}
  .bg-label{flex-shrink:0;font-size:.74rem;font-weight:900;min-width:92px;text-align:right;color:var(--fg-soft)}
  .comal-mini{display:flex;justify-content:center}
  .comal-mini .comal{width:112px;height:112px;border-radius:50%;position:relative;background:radial-gradient(circle at 42% 36%,#5b6470,#2f3540 68%,#20242c);box-shadow:inset 0 4px 10px rgba(0,0,0,.5),0 6px 14px rgba(30,58,138,.22);display:flex;align-items:center;justify-content:center}
  .comal-mini .tortilla{width:74px;height:74px;position:relative}
  .comal-mini .tortilla.cooking{animation:puff 1.5s ease-in-out infinite alternate}
  @keyframes puff{from{transform:scale(1)}to{transform:scale(1.06,1.11)}}
  .comal-mini .t-inner{width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;background:#f8ecce;box-shadow:inset 0 -3px 6px rgba(160,110,40,.25),0 2px 5px rgba(0,0,0,.3);transition:background-color .5s,transform .4s}
  .comal-mini .spot{position:absolute;border-radius:50%;background:radial-gradient(#9a5a20,#b97a3a 70%,transparent);opacity:0;transition:opacity .6s}
  .comal-mini .steam{position:absolute;top:-14px;left:0;right:0;display:flex;justify-content:center;gap:10px;opacity:0;transition:.4s}
  .comal-mini .comal.hot .steam{opacity:1}
  .comal-mini .steam span{font-size:14px;animation:steamup 1.8s ease-in infinite}
  .comal-mini .steam span:nth-child(2){animation-delay:.6s}
  .comal-mini .steam span:nth-child(3){animation-delay:1.2s}
  @keyframes steamup{0%{transform:translateY(4px);opacity:0}30%{opacity:.9}100%{transform:translateY(-18px);opacity:0}}
  .lyrics-acc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
  .lyrics-acc summary{cursor:pointer;padding:11px 16px;font-size:.84rem;font-weight:900;color:var(--accent);list-style:none}
  .lyrics-acc summary::-webkit-details-marker{display:none}
  .lyrics-acc summary::before{content:"▸ "}
  .lyrics-acc[open] summary::before{content:"▾ "}
  .lyrics{list-style:none;padding:0 10px 12px;margin:0}
  .lyrics li{padding:5px 14px;border-radius:10px;font-size:.84rem;color:var(--muted);font-weight:600}
  .lyrics li .lj{display:block;font-size:.66rem;opacity:.75}
  /* 🥫 サルサグラマー（すり鉢・ボトル） */
  .salsa-stage{display:flex;flex-direction:column;align-items:center;gap:10px}
  .salsa-q{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px 18px;text-align:center;width:100%}
  .salsa-q .s-en{font-family:var(--serif);font-size:1.25rem;font-weight:900}
  .salsa-q .s-en .blank{display:inline-block;min-width:74px;border-bottom:3px solid var(--red);color:var(--red);font-weight:900;margin:0 4px;transition:.3s}
  .salsa-q .s-en .blank.filled{border-color:var(--green);color:var(--green)}
  .salsa-q .s-ja{font-size:.78rem;color:var(--muted);margin-top:6px;font-weight:600}
  .molca-zone{position:relative;width:180px;height:180px;flex:none}
  /* 石臼(モルカヘテ)は生成画像。液体は下の .molca(椀の内側の楕円)にクリップして重ねる */
  .molca-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;filter:drop-shadow(0 5px 9px rgba(60,40,20,.28))}
  .molca-img.grind{animation:mortarGrind .42s ease-in-out 2}
  @keyframes mortarGrind{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(-2.4deg) scale(1.015)}}
  /* 椀の内側(暗い楕円): 生成画像の内側開口に合わせてフィット(左18% 上14% 幅54% 高40%) */
  .molca{position:absolute;left:18%;top:14%;width:54%;height:40%;border-radius:50%;overflow:hidden;background:transparent;z-index:1}
  /* サルサ = 椀の底に溜まって上へ育つ「楕円プール」。量(--s 0〜1)で相似拡大＝常に楕円(裏側の弧が出ない)。
     フラットなマット塗り＋奥(上)にだけ椀壁の落ち影＝球に見えず液面として読める。 */
  .salsa-pool{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);
    width:calc(100% * var(--s,0));height:calc(90% * var(--s,0));border-radius:50%;
    transition:width .55s cubic-bezier(.3,1,.4,1),height .55s cubic-bezier(.3,1,.4,1);
    background:
      linear-gradient(180deg,rgba(255,235,225,.30) 0%,rgba(255,235,225,0) 26%),
      radial-gradient(130% 100% at 50% 42%,#d33a2c 0%,#c62d24 68%,#b0231d 100%);
    box-shadow:inset 0 7px 9px -2px rgba(96,14,11,.5),inset 0 -3px 6px rgba(255,180,168,.22),
      inset 0 0 0 1px rgba(110,18,14,.35),0 0 5px 1px rgba(60,8,6,.35)}
  /* サルサのチャンク粒(不規則・低コントラスト) */
  .salsa-pool::after{content:"";position:absolute;inset:8%;border-radius:50%;opacity:.28;mix-blend-mode:multiply;
    background:
      radial-gradient(circle at 30% 38%,#8f1713 0 2px,transparent 3px),
      radial-gradient(circle at 62% 30%,#8f1713 0 1.5px,transparent 2.5px),
      radial-gradient(circle at 48% 58%,#8f1713 0 2.5px,transparent 3.5px),
      radial-gradient(circle at 72% 62%,#8f1713 0 1.5px,transparent 2.5px),
      radial-gradient(circle at 22% 66%,#f0705f 0 1.5px,transparent 2.5px),
      radial-gradient(circle at 56% 74%,#f0705f 0 2px,transparent 3px),
      radial-gradient(circle at 40% 24%,#f0705f 0 1.5px,transparent 2.5px)}
  @media(prefers-reduced-motion:reduce){ .salsa-pool{transition:none} }
  .bottle-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
  .bottle{background:var(--card);border:2px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s;position:relative;cursor:pointer;font-family:inherit}
  .bottle:active{transform:scale(.94)}
  .bottle .b-cap{width:34px;height:9px;border-radius:4px 4px 0 0;background:#94a3b8;margin-bottom:4px}
  /* 選択肢は色のcap線ではなく野菜アイコン(トマト/ハバネロ/ハラペーニョ/紫玉ねぎ)を主役に */
  .bottle .b-veg{width:30px;height:30px;object-fit:contain;margin-bottom:3px;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 3px rgba(60,30,10,.28))}
  .bottle:active .b-veg{transform:scale(.92)}
  .bottle .b-word{font-family:var(--serif);font-size:1.05rem;font-weight:900;color:var(--fg)}
  .bottle.c0{border-color:#fca5a5}.bottle.c0 .b-cap{background:#ef4444}
  .bottle.c1{border-color:#fdba74}.bottle.c1 .b-cap{background:#f97316}
  .bottle.c2{border-color:#86efac}.bottle.c2 .b-cap{background:#16a34a}
  .bottle.c3{border-color:#c4b5fd}.bottle.c3 .b-cap{background:#8b5cf6}
  .bottle.refuse{animation:refuse .4s}
  @keyframes refuse{0%,100%{transform:none}20%,60%{transform:translateX(-7px) rotate(-4deg)}40%,80%{transform:translateX(7px) rotate(4deg)}}
  .bottle.poured{opacity:.25;pointer-events:none;filter:grayscale(1)}
  .salsa-dots{display:flex;gap:8px;justify-content:center}
  .salsa-dots i{width:14px;height:14px;border-radius:50%;background:var(--panel);border:1px solid var(--border);transition:.3s}
  .salsa-dots i.hit{background:var(--red);transform:scale(1.2)}
  .salsa-dots i.miss{background:var(--amber)}
  .salsa-stage .s-expl{display:block;margin-top:4px;color:var(--amber-ink);font-weight:700}
  .salsa-stage .s-expl b{font-weight:900}
  .salsa-q .salsa-mode{font-size:.7rem;font-weight:800;color:var(--accent);letter-spacing:.02em;margin-bottom:5px}
  .salsa-q .s-en .blank.sus{min-width:0;padding:0 4px;border-bottom-color:var(--amber);color:var(--amber-ink);cursor:pointer}
  /* サルサ: 臼へのドラッグ調合＋サルサ瓶 */
  .salsa-mix{display:flex;align-items:flex-end;gap:16px;width:100%;justify-content:center}
  .salsa-jar{width:46px;height:100px;border-radius:8px 8px 13px 13px;position:relative;overflow:hidden;flex:none;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(254,226,226,.4));box-shadow:inset 0 0 0 2.5px #fecaca,0 4px 10px rgba(180,30,30,.15)}
  .sj-fill{position:absolute;bottom:0;left:0;width:100%;height:0%;transition:height .5s;background:linear-gradient(180deg,#f87171,#dc2626 65%,#b91c1c)}
  .salsa-jar .sj-label{position:absolute;top:4px;width:100%;text-align:center;font-size:9px;color:#7f1d1d;font-weight:800;z-index:1}
  .molca.hot{box-shadow:0 0 0 4px rgba(220,38,38,.5),0 0 16px rgba(220,38,38,.45)}
  .bottle.dragging{opacity:.35}
  .bottle-ghost{position:fixed;z-index:130;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg);
    background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:8px 14px;font-family:var(--serif);font-weight:900;font-size:1.05rem;box-shadow:var(--shadow-lg)}
  .bottle-row.pulse .bottle{animation:refuse .4s}
  /* 文法フリップカード（読むだけ→思い出してめくる能動学習） */
  .flip-row{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
  .flip-card{perspective:900px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;width:100%;text-align:left}
  .fc-inner{position:relative;transition:transform .5s cubic-bezier(.3,1.1,.4,1);transform-style:preserve-3d;min-height:78px}
  .flip-card.flipped .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;box-sizing:border-box}
  .fc-front{background:var(--panel);border:1.5px dashed var(--border)}
  .fc-back{background:var(--accent-soft);border:1.5px solid var(--accent);transform:rotateY(180deg)}
  .fc-q{font-family:var(--serif);font-weight:700;font-size:.95rem}
  .fc-q .fc-blank{display:inline-block;min-width:38px;border-bottom:2.5px solid var(--accent);color:var(--accent);text-align:center;font-weight:900}
  .fc-q .fc-word{color:var(--accent-dark);font-weight:900}
  .fc-ja{font-size:.74rem;color:var(--muted)}
  .fc-hint{font-size:.66rem;color:var(--faint);font-weight:800;margin-top:1px}
  /* 並べ替え: 完成時に元の正書法(大文字・句読点)で表示 */
  .ro-final{display:inline-block;font-weight:800;color:var(--green-ink);font-size:1.05rem;padding:4px 2px;line-height:1.4}
  .ro-final.en{font-family:var(--serif)}
  /* 🍅 トマトマト: 収穫かご＋落下トマト＋候補のsquish */
  .harvest-crate{margin-top:14px;background:linear-gradient(180deg,#f4d9b5,#e7bd8a);border:2px solid #c99a63;border-radius:12px;padding:9px 12px;box-shadow:inset 0 2px 6px rgba(120,72,20,.18),0 3px 8px rgba(120,72,20,.15)}
  .harvest-crate .hc-label{font-size:.72rem;font-weight:800;color:#7c4a17;margin-bottom:6px}
  .harvest-crate .hc-label b{color:#b91c1c;font-size:.9rem}
  .hc-slots{display:flex;flex-wrap:wrap;gap:7px}
  .hc-slot{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.34);box-shadow:inset 0 0 0 2px rgba(170,115,58,.4);display:grid;place-items:center;font-size:16px;line-height:1}
  .hc-slot.filled{animation:tomatoLand .42s}
  @keyframes tomatoLand{0%{transform:scale(.2)}55%{transform:scale(1.28)}75%{transform:scale(.9)}100%{transform:scale(1)}}
  .tomato-drop{position:fixed;z-index:130;pointer-events:none;font-size:22px;line-height:1}
  .choice.squish{animation:squish .34s}
  @keyframes squish{0%,100%{transform:scale(1)}35%{transform:scale(.84,1.12)}65%{transform:scale(1.06,.92)}}
  /* 🥫 サルサ: すり鉢へ吸い込む／縁で跳ね返す飛翔要素 */
  .salsa-fly{position:fixed;z-index:130;pointer-events:none;background:var(--card);border:2px solid var(--red);border-radius:12px;padding:5px 12px;font-family:var(--serif);font-weight:900;font-size:1rem;color:var(--fg);box-shadow:var(--shadow)}
  .salsa-fly.ng{border-color:var(--amber)}
  .molca.reject{animation:molcaReject .3s}
  @keyframes molcaReject{0%,100%{transform:none}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
  @media(prefers-reduced-motion:reduce){ .fc-inner{transition:none} }
  /* 🥬 レタス・スラッシュ（水槽ゲーム） */
  .lettuce-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
  .lettuce-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .lq{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);padding:10px 14px;text-align:center;font-size:1.1rem;font-weight:900}
  .lq small{display:block;font-size:.64rem;color:var(--muted);font-weight:700}
  .combo-badge{min-width:80px;text-align:center;background:var(--green-soft);border-radius:12px;padding:7px 8px;font-size:.66rem;font-weight:900;color:var(--green-ink);box-shadow:var(--shadow-sm)}
  .combo-badge b{display:block;font-size:1rem}
  .lettuce-field{position:relative;flex:1;min-height:260px;border-radius:var(--radius);overflow:hidden;background:linear-gradient(180deg,#dbeafe 0%,#eff6ff 60%,#dcfce7 100%);box-shadow:inset 0 0 0 2px #bfdbfe;touch-action:manipulation}
  .lettuce{position:absolute;left:0;top:0;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 34% 30%,#bef264,#65a30d 72%,#4d7c0f);box-shadow:inset -4px -6px 10px rgba(0,0,0,.18),0 4px 10px rgba(77,124,15,.35);will-change:transform;cursor:pointer}
  .lettuce::before{content:"";position:absolute;inset:6px;border-radius:50%;border:3px dashed rgba(255,255,255,.4)}
  .lettuce .lw{background:rgba(255,255,255,.92);border-radius:8px;padding:2px 7px;font-size:.8rem;font-weight:900;color:#3f6212;z-index:1;max-width:74px;text-align:center;word-break:break-all;line-height:1.2}

<script>
(function(){
  const BUILD_VER='v2026-07-17b'; // ⚙️設定最下部に表示（ホーム画面アプリのキャッシュ古さ診断用）
  const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
  const view=document.getElementById('ttf-view');
  const backBtn=document.getElementById('ttf-back');
  const titleEl=document.getElementById('ttf-title');
  const logoEl=document.getElementById('ttf-logo');
  const tabsEl=document.getElementById('ttf-tabs');

  // ---------- アセット（WordTacos と同一素材。無い環境=Artifact では絵文字にフォールバック） ----------
  const A='app_assets';
  // タコス完成演出のトム画像を先読み（初回のカクつき回避）
  const CELEBRATE_IMGS=['celebrate/tom_cheer.png','celebrate/tom_bite.png'];
  CELEBRATE_IMGS.forEach(p=>{ try{ const im=new Image(); im.src=A+'/'+p; }catch(e){} });
  const mascotHTML=(cls,emotions,fallback)=>{
    const imgs=emotions.map((e,i)=>`<img data-emotion="${e}" src="${A}/mascot/${e}.png" ${i===0?'class="active"':''} onerror="this.dataset.dead='1';this.style.display='none';this.parentElement.dataset.fb='1'">`).join('');
    return `<div class="mascot ${cls||''}" data-fallback="${fallback||'👨‍🍳'}">${imgs}<span class="mfb" style="font-size:2.6rem;position:absolute;inset:0;display:none;align-items:center;justify-content:center"></span></div>`;
  };
  function setEmotion(mEl,emotion){ if(!mEl)return;
    const imgs=[...mEl.querySelectorAll('img')];
    const ok=imgs.some(im=>im.dataset.emotion===emotion&&!im.dataset.dead);
    imgs.forEach(im=>im.classList.toggle('active',im.dataset.emotion===emotion&&!im.dataset.dead));
    const fb=mEl.querySelector('.mfb');
    if(fb){ const anyAlive=imgs.some(im=>!im.dataset.dead);
      fb.style.display=anyAlive?'none':'flex'; if(!anyAlive)fb.textContent=mEl.dataset.fallback||'👨‍🍳'; }
  }
  // ---------- 設定（WordTacos 踏襲: localStorage） ----------
  const SET={
    get bgm(){return localStorage.getItem('ttf_bgm_muted')!=='1';},   set bgm(v){localStorage.setItem('ttf_bgm_muted',v?'0':'1');},
    get sfx(){return localStorage.getItem('ttf_sfx_muted')!=='1';},   set sfx(v){localStorage.setItem('ttf_sfx_muted',v?'0':'1');},
    get timer(){return localStorage.getItem('ttf_no_timer')!=='1';},  set timer(v){localStorage.setItem('ttf_no_timer',v?'0':'1');},
    get handsfree(){return localStorage.getItem('ttf_handsfree')==='1';}, set handsfree(v){localStorage.setItem('ttf_handsfree',v?'1':'0');},
  };
  // ---------- BGM マネージャ（場面別。ファイルが無ければ静かに何もしない） ----------
  // 新曲は app_assets/bgm/*.mp3 に置くだけで鳴る。厨房ラッシュのみ WordTacos と同一の kitchen_bgm.mp3。
  // 選択/ナビ画面(title/home/journey)は落ち着いた設定BGM=menu.mp3。各ゲームは専用曲。
  const BGM_SRC={ title:`${A}/bgm/menu.mp3`, home:`${A}/bgm/menu.mp3`, journey:`${A}/bgm/menu.mp3`,
    salsa:`${A}/bgm/salsa.mp3`,
    rush:`${A}/sounds/kitchen_bgm.mp3` };   // サルサのみ専用BGM。トマト/シャドウ/ライム/ビートはBGMなし（単語音声等が主役）
  let _bgmEl=null,_bgmScene=null,_bgmGen=0,_bgmCurSrc=null; const _bgmAvail={};
  function bgmPlay(scene){
    // 常駐歌プレイヤーは廃止。各画面で場面BGMが常に鳴ってよい。
    if(_bgmScene===scene && _bgmEl && !_bgmEl.paused) return;
    const nextSrc=BGM_SRC[scene];
    // 同じ曲(src)へ移るだけなら止めずに継続再生（title/home/journey は同じ menu.mp3 ＝連続再生）
    if(nextSrc && nextSrc===_bgmCurSrc && _bgmEl && !_bgmEl.paused){ _bgmScene=scene; return; }
    const gen=++_bgmGen;                          // 世代トークン: 読込(HEAD)中に再入しても最新のgoだけが鳴る
    bgmStop(); _bgmScene=scene;
    const src=nextSrc; if(!src||!SET.bgm)return;
    const go=()=>{ if(gen!==_bgmGen||_bgmScene!==scene||!SET.bgm)return;
      if(_bgmEl){try{_bgmEl.pause();}catch(e){}}  // 生成直前に既存を必ず停止（孤児Audioを残さない）
      try{ _bgmEl=new Audio(src); _bgmCurSrc=src; _bgmEl.loop=true; _bgmEl.volume=(scene==='rush')?0.35:(scene==='salsa')?0.26:0.4; // ゲーム中は声/効果音の下に敷くため小さめ
        _bgmEl.play().catch(()=>{}); }catch(e){_bgmEl=null;_bgmCurSrc=null;} };
    if(_bgmAvail[src]===false)return;            // 未配置の曲は静かにスキップ(404ノイズを出さない)
    if(_bgmAvail[src]===true){ go(); return; }
    fetch(src,{method:'HEAD'}).then(r=>{ _bgmAvail[src]=r.ok; if(r.ok)go(); }).catch(()=>{ _bgmAvail[src]=false; });
  }
  function bgmStop(){ if(_bgmEl){try{_bgmEl.pause();}catch(e){}} _bgmEl=null; _bgmScene=null; _bgmCurSrc=null; }
  // 検証・デバッグ用フック（UI非依存）: 現在のBGMシーン/再生中Audioのsrc
  window.__ttfBgm={ get scene(){return _bgmScene;}, get gen(){return _bgmGen;},
    get playing(){return !!(_bgmEl && !_bgmEl.paused);}, get src(){return _bgmEl?_bgmEl.src:'';} };
  function bgmSync(){ if(!SET.bgm){bgmStop();} }
  // 右上のBGMミュートボタン。止めるのは「場面BGM」だけで、単語の発音・効果音・タコビートの曲は鳴り続ける
  //（タコビートは別オリジンのiframeで曲が主役のため、ここでは止めない）
  function syncMuteBtn(){ const b=document.getElementById('ttf-mute'); if(!b)return;
    const on=SET.bgm; b.textContent=on?'🔊':'🔇'; b.classList.toggle('off',!on);
    b.setAttribute('aria-pressed',String(!on));
    b.title=on?'BGMをミュート（発音・効果音・タコビートの曲は鳴ります）':'BGMのミュートを解除'; }
  (function initMuteBtn(){ const b=document.getElementById('ttf-mute'); if(!b)return;
    b.onclick=()=>{ SET.bgm=!SET.bgm; syncMuteBtn();
      if(!SET.bgm) bgmStop();
      else if(_bgmScene){ const s=_bgmScene; _bgmScene=null; bgmPlay(s); }   // 解除したらその場面のBGMを鳴らし直す
      else bgmPlay('home'); };
    syncMuteBtn(); })();
  // 初回タップで再生開始(モバイル自動再生制限対策・WordTacos と同じ)
  document.addEventListener('pointerdown',()=>{ if(_bgmScene && SET.bgm && (!_bgmEl||_bgmEl.paused)) {const s=_bgmScene;_bgmScene=null;bgmPlay(s);} },{passive:true});

  // ---------- 歌はレッスンの YouTube リンクで視聴（常駐ミニ歌プレイヤーは廃止） ----------
  // アプリ全体で場面BGMが鳴るため、常駐の歌ながら再生は不要になった。
  // レッスンの歌カードは YouTube 動画への外部リンクに置き換え済み（下 lesson() 参照）。
  function releaseSong(){}  // 旧・常駐プレイヤーの後始末フック。廃止済みのため no-op（呼び出し互換のため残置）
  // ---------- SFX（WordTacos と同一の音源ファイル。無ければ WebAudio 代替） ----------
  const _sfxCache={};
  const SFX_MP3_VOL=0.65; // mp3効果音の音量（実mp3ファンファーレがリッチに聞こえ、かつナレ/BGMより突出しない範囲）
  function sfx(name,fallbackFn){
    if(!SET.sfx)return;
    try{ const src=`${A}/sounds/${name}.mp3`;
      let a=_sfxCache[name]; if(!a){a=new Audio(src);_sfxCache[name]=a;}
      a.currentTime=0; a.volume=SFX_MP3_VOL;
      a.play().catch(()=>{ if(fallbackFn)fallbackFn(); });
      a.onerror=()=>{ if(fallbackFn)fallbackFn(); };
    }catch(e){ if(fallbackFn)fallbackFn(); }
  }
  // 大きな節目（タコス完成・厨房ラッシュ合格・飛び級）はリッチな実mp3ファンファーレ、細かい正解は軽い合成chime。

      e:`空所には <b>${c.word}</b> が入ります。`}));
    const grammarfill=ownCloze.map(c=>({pre:c.pre,post:c.post,choices:buildChoices(c.word),ans:0,ja:c.ja||'',
      e:`空所には <b>${c.word}</b> が入ります。`}));
    // --- ③新出単語: 新出語すべてを対象（上限固定なし）。文脈文は ①jp_mixedの該当文(著者作) ②vocab_sentences.json(生成) の順 ---
    const vsent=(typeof VOCAB_SENT!=='undefined'&&VOCAB_SENT)?(VOCAB_SENT[String(ls.b)]||{}):{};
    const vocab=[]; const usedSent=new Set();
    for(const v of (ls.vocab||[])){
      if(isProperNoun(v.w,v.ja))continue;                    // 固有名詞(人名・ペット名)はトマトに出さない
      let mi=(ls.jp_mixed||[]).findIndex((m,k)=>!usedSent.has(k)&&(m.words||[]).some(w=>w.w&&w.w.toLowerCase()===v.w.toLowerCase()));
      if(mi<0)mi=(ls.jp_mixed||[]).findIndex((m)=>(m.words||[]).some(w=>w.w&&w.w.toLowerCase()===v.w.toLowerCase())); // 未使用が無ければ再利用
      if(mi>=0){ usedSent.add(mi);
        vocab.push({w:v.w,m:v.ja,ruby:rubyOf(v.ja),s:stripMarkersExcept(ls.jp_mixed[mi].text,v.w)}); continue; }
      const gs=vsent[v.w]||vsent[(v.w||'').toLowerCase()];    // 生成した日本語混じり文（<word> 入り）で補完
      if(gs){ vocab.push({w:v.w,m:v.ja,ruby:rubyOf(v.ja),s:stripMarkersExcept(gs,v.w)}); }
    }
    if(!vocab.length){ // 保険: どの新出語も文脈が作れない場合はマーカー語(機能語含む)をそのまま使う
      for(const m of (ls.jp_mixed||[])){ if(vocab.length>=8)break;
        const wd=(m.words||[]).find(w=>w.w&&w.ja); if(!wd)continue;
        vocab.push({w:wd.w,m:wd.ja,ruby:rubyOf(wd.ja),s:stripMarkersExcept(m.text,wd.w)});}}
    const testVocab=(ls.vocab||[]).filter(v=>!isProperNoun(v.w,v.ja)).map(v=>({w:v.w,m:v.ja})); // ④単語テスト(固有名詞は除外)
    // --- ⑦内容理解: 「本文にあった文はどれ？」×3 ＋ 並べ替え×2 ---
    const sents=(ls.sentences||[]).filter(s=>s&&s.en);
    const otherSents=[]; others.forEach(o=>(o.sentences||[]).forEach(s=>{if(s&&s.en)otherSents.push(s.en);}));
    const picks=seededShuffle(sents,rnd).slice(0,3);
    const reading=picks.map(p=>({q:'本文にあった文はどれ？',
      choices:[p.en].concat(seededShuffle(otherSents.filter(x=>x!==p.en),rnd).slice(0,3)),ans:0}));
    // 並べ替えは概ね10本（本文＋文法例文からプール。3〜9語の短〜中文を優先し、足りなければ長文で補完）
    const RO_TARGET=10;
    const roSeen=new Set(); const roSrc=[];
    sents.concat(exs.map(ex=>({en:ex.en,ja:ex.ja}))).forEach(s=>{ if(!s||!s.en)return;
      const k=s.en.toLowerCase(); if(roSeen.has(k))return; roSeen.add(k); roSrc.push(s); });
    const byLen=roSrc.slice().sort((a,b)=>tokenizeEn(a.en).length-tokenizeEn(b.en).length);
    const roGood=byLen.filter(s=>{const n=tokenizeEn(s.en).length;return n>=3&&n<=9;});
    const roRest=byLen.filter(s=>tokenizeEn(s.en).length>9||tokenizeEn(s.en).length<3);
    const ros=roGood.concat(roRest).slice(0,RO_TARGET);            // 3〜9語優先→不足分補完→最大10本
    const reorder=ros.map(s=>{
      const answer=s.en.split(/\s+/).filter(Boolean);
      const lower=new Set(answer.map(w=>w.toLowerCase().replace(/[^a-z']/g,'')));
      const dpool=[]; const dseen=new Set();
      roSrc.forEach(x=>{if(x===s)return;x.en.split(/\s+/).forEach(w=>{const k=w.toLowerCase().replace(/[^a-z']/g,'');
        if(!k||lower.has(k)||dseen.has(k))return;dseen.add(k);dpool.push(w.replace(/[.!?,]+$/,''));});});
      return {lang:'en',prompt:s.ja||'',answer,dummies:seededShuffle(dpool,rnd).slice(0,2)};});
    return {
      youtube:ls.video||'',
      songCandidate:'https://taco-beat.pages.dev/songs/b'+ls.b+'.mp3',
      songTitle:'B'+ls.b+' '+(ls.title||'')+'（歌）',
      gTitle:g.target||'', gDesc:g.desc||'', gExamples:exs,
      passage:sents.map(s=>({en:s.en,jp:s.ja||''})),
      vocab, testVocab,
      grammarQ, grammarfill, reading, reorder,
    };
  }
  function fillMissing(dst,src,keys){keys.forEach(k=>{if(dst[k]===undefined&&src[k]!==undefined)dst[k]=src[k];});}
  // lessons.json → LESSONS を20件に組み直す（Lesson1は手作りL12を優先・不足のみ補完）
  function buildLessons(data){
    const list=(Array.isArray(data)?data:[]).filter(x=>x&&x.b>=1&&x.b<=20).sort((a,b)=>a.b-b.b);
    if(!list.length)return false;
    const byB={}; list.forEach(x=>{byB[x.b]=x;});
    const items=[];
    for(let n=1;n<=20;n++){
      const src=byB[n];
      if(n===1){
        const auto1=src?buildAutoLesson(src,list):null;
        if(auto1)fillMissing(L12,auto1,
          ['youtube','songCandidate','songTitle','passage','vocab','testVocab','grammarQ','grammarfill','reading','reorder']);
        // ライムを概ね10問に: 手作りreorderに自動生成分を重複なく補う（最大10）
        if(auto1&&Array.isArray(L12.reorder)&&L12.reorder.length<10){
          const seen=new Set(L12.reorder.map(r=>(r.answer||[]).join(' ').toLowerCase()));
          (auto1.reorder||[]).forEach(r=>{ if(L12.reorder.length>=10)return;
            const k=(r.answer||[]).join(' ').toLowerCase(); if(seen.has(k))return; seen.add(k); L12.reorder.push(r); });
        }
        items.push({id:1,title:src?src.title:'Tom at the Gate',g:'be動詞 I am 〜 / You are 〜',data:L12});
      }else{
        items.push({id:n,title:src?src.title:('Lesson '+n),
          g:src&&src.grammar?(src.grammar.target||''):'',
          data:src?buildAutoLesson(src,list):null});
      }
    }
    LESSONS.length=0; items.forEach(x=>LESSONS.push(x));
    return true;
  }
  // ==== [ttf-gen-end] ====

  // ==== 中学生編（middle_lessons.json）→ タコスの5具材へマッピング ====
  //  トマト=vocabSentences（1文に複数トマト）／チーズ=enSentences音読／サルサ=文法（middle_grammar.json、無ければ例文cloze）／
  //  レタス=文法例文の並べ替え／ビート=動画未整備のため準備中（本文リスニングで代替）
  const MID_TOMATO_MAX=8;   // 1レッスンのトマト文の上限（プレイ時間の目安。データはそのまま、出題文数だけ抑える）
  function buildMiddleLesson(ml){
    const g=ml.grammar||{}; const exs=(g.examples||[]).filter(e=>e&&e.en);
    const rnd=mulberry32(hashStr('ttf-m'+ml.b));
    // 🥫サルサ フォールバック（middle_grammar.json が無い時）: 文法ターゲット語を空所化した cloze
    const gset=grammarTokens(g.target);
    const cnt={}; exs.forEach(ex=>{const seen=new Set(tokenizeEn(ex.en).map(w=>w.toLowerCase()));seen.forEach(w=>{cnt[w]=(cnt[w]||0)+1;});});
    const common=new Set(Object.keys(cnt).filter(w=>cnt[w]>=2));
    const ownCloze=exs.map(ex=>clozeOf(ex,gset,common));
    const pool=ownCloze.map(c=>c.word);
    const FILLER=['am','are','is','was','were','do','does','the','a'];
    function buildChoices(ans){const out=[ans];const seen=new Set([ans.toLowerCase()]);
      for(const w of seededShuffle(pool,rnd)){if(out.length>=4)break;const k=w.toLowerCase();if(seen.has(k))continue;seen.add(k);out.push(w);}
      for(const w of FILLER){if(out.length>=4)break;if(seen.has(w))continue;seen.add(w);out.push(w);}
      return out;}
    const grammarQ=ownCloze.map(c=>({pre:c.pre,post:c.post,choices:buildChoices(c.word),ans:0,ja:c.ja||'',
      e:`空所には <b>${c.word}</b> が入ります。`}));
    // 🥬レタス（並べ替え）: ここでは文法例文（en+ja）だけを入れる。
    //   10問への補充は stepLettuce 側で行う（①ここ→②サルサ完成文→③本文の優先順。
    //   サルサ完成文の元データ COURSE_GRAMMAR は非同期読込で、ビルド時にはまだ無いことがある）
    const roSrc=exs.map(ex=>({en:ex.en,ja:ex.ja}));
    const byLen=roSrc.slice().sort((a,b)=>tokenizeEn(a.en).length-tokenizeEn(b.en).length);
    const ros=byLen.slice(0,10);
    const reorder=ros.map(s=>{
      const answer=s.en.split(/\s+/).filter(Boolean);
      const lower=new Set(answer.map(w=>w.toLowerCase().replace(/[^a-z']/g,'')));
      const dpool=[]; const dseen=new Set();
      roSrc.forEach(x=>{if(x===s)return;x.en.split(/\s+/).forEach(w=>{const k=w.toLowerCase().replace(/[^a-z']/g,'');
        if(!k||lower.has(k)||dseen.has(k))return;dseen.add(k);dpool.push(w.replace(/[.!?,]+$/,''));});});
      return {lang:'en',prompt:s.ja||'',answer,dummies:seededShuffle(dpool,rnd).slice(0,2)};});
    // 🧀チーズ（シャドウイング）: enSentences を本文に
    const passage=(ml.enSentences||[]).filter(Boolean).map(en=>({en:String(en).trim(),jp:''})).filter(p=>p.en);
    // 🍅トマト（複数）: vocabSentences。固有名詞(Ken/Pochi/Tom/Mt. Fuji)は学習対象外なので
    //   マーカーを外して素の語として表示し、トマト(出題)にはしない。
    const vocabSentences=(ml.vocabSentences||[]).map(s=>{
      const src=(s.words||[]).filter(w=>w.w&&w.ja);
      let i=0; const kept=[];
      const text=String(s.text||'').replace(/<([^>]+)>/g,(m,w)=>{
        const wd=src[i++]; if(!wd)return w;
        if(isProperNoun(wd.w,wd.ja))return wd.w;       // 固有名詞: マーカーを外す＝トマトにしない
        kept.push({w:wd.w,ja:wd.ja}); return m; });
      return {text, words:kept};
    }).filter(s=>s.words.length);
    // 昇級試験プール用: レッスンの新出語（意味つき。固有名詞は除外済み）
    const testVocab=[]; const tvSeen=new Set();
    vocabSentences.forEach(s=>s.words.forEach(w=>{const k=(w.w||'').toLowerCase();if(!k||tvSeen.has(k))return;tvSeen.add(k);testVocab.push({w:w.w,m:w.ja});}));
    return {
      youtube:(ml.video||''), songTitle:(ml.title||'')+'（レッスン動画）',
      gTitle:g.target||'', gDesc:g.desc||'', gExamples:exs,
      passage: passage.length?passage:[{en:(ml.title||''),jp:''}],
      vocab:[], testVocab,
      grammarQ, grammarfill:grammarQ.slice(), reading:[], reorder,
      vocabSentences,
      isMiddle:true,
    };
  }
  function buildMiddleLessons(data,course){
    const list=(Array.isArray(data)?data:[]).filter(x=>x&&x.b>=1).sort((a,b)=>a.b-b.b);
    if(!list.length)return false;
    const items=list.map(ml=>({id:ml.b, title:ml.title||('Lesson '+ml.b),
      g:(ml.grammar&&ml.grammar.target)||'', data:Object.assign(buildMiddleLesson(ml),{course:course||'middle'})}));
    LESSONS.length=0; items.forEach(x=>LESSONS.push(x));
    return true;
  }
  // ---- コース定義（小学生編＝lessons.json / 中学・高校＝共通スキーマのJSON） ----
  //  chartMax: タコビートの譜面がある最終レッスン番号。ここを超える課は譜面が無いので、
  //            ビート具材を「レッスン動画＋本文リスニング」(stepBeatMiddle)で代替する。
  //            高校は160課あるが、レッスン動画があるのは序盤の45課だけ。
  const COURSES={
    beginner:{icon:'📒',label:'小学生編',sub:'Funnics・B1〜20',prefix:'b',chartMax:20,
      progKey:'prog',doneKey:'tacoDone',examKey:'exam',skipKey:'skip'},
    middle:{icon:'📘',label:'中学生編',sub:'家族の物語・L1〜45',prefix:'m',chartMax:45,
      json:'middle_lessons.json',grammar:'middle_grammar.json',
      progKey:'progM',doneKey:'tacoDoneM',examKey:'examM',skipKey:'skipM'},
    high:{icon:'📕',label:'高校生編',sub:'高1〜高3・160課',prefix:'h',chartMax:45,
      json:'high_lessons.json',grammar:'high_grammar.json',
      progKey:'progH',doneKey:'tacoDoneH',examKey:'examH',skipKey:'skipH'},
  };
  const hasChart=(courseKey,lessonNo)=>Number(lessonNo)<=((COURSES[courseKey]||{}).chartMax||0);
  const CS=()=>COURSES[STATE.course]||COURSES.beginner;              // 現在のコース定義
  let BEGINNER_DATA=null;
  const COURSE_DATA={middle:null,high:null};                          // 各コースのレッスンJSON
  const COURSE_GRAMMAR={middle:null,high:null};                       // 各コースのサルサ問題JSON
  function rebuildActiveCourse(){
    const c=STATE.course;
    if(c!=='beginner'){ if(COURSE_DATA[c])return buildMiddleLessons(COURSE_DATA[c],c); STATE.course='beginner'; }
    if(BEGINNER_DATA)return buildLessons(BEGINNER_DATA);
    return false;
  }

  // 歌mp3の有無確認(HEAD→CORS等で失敗したらAudioメタデータで再確認)。結果はレッスンデータにキャッシュ
  function checkSong(d,cb){
    if(!d){cb(false);return;}
    if(d.song){cb(true);return;}
    if(!d.songCandidate||d._songDone){cb(!!d.song);return;}
    if(d._songCbs){d._songCbs.push(cb);return;}
    d._songCbs=[cb];
    const finish=(ok)=>{const cbs=d._songCbs||[];d._songCbs=null;d._songDone=true;
      if(ok)d.song=d.songCandidate;
      cbs.forEach(f=>{try{f(ok);}catch(e){}});};
    const audioProbe=()=>{try{const a=new Audio();let done=false;
        const fin=(ok)=>{if(done)return;done=true;a.onloadedmetadata=null;a.onerror=null;finish(ok);};
        a.preload='metadata';a.onloadedmetadata=()=>fin(true);a.onerror=()=>fin(false);
        setTimeout(()=>fin(false),8000);a.src=d.songCandidate;
      }catch(e){finish(false);}};
    try{fetch(d.songCandidate,{method:'HEAD'}).then(r=>finish(!!r.ok)).catch(audioProbe);}
    catch(e){audioProbe();}
  }
  // 厨房ラッシュの出題プール: 基本プール＋解放済みレッスンのvocab（直近解放ほど重み大）
  function buildRushPool(){
    const pool=RUSH_POOL.map(x=>({w:x.w,m:x.m,wt:x.wt}));
    const seen=new Set(pool.map(x=>x.w));
    const opened=LESSONS.filter(l=>l.data&&isUnlocked(l.id));
    opened.forEach((l,k)=>{
      const wt=2+Math.round(3*(k+1)/Math.max(1,opened.length)); // 2〜5
      const vs=(l.data.testVocab&&l.data.testVocab.length?l.data.testVocab:l.data.vocab)||[];
      vs.forEach(v=>{if(!v.w||!v.m||seen.has(v.w))return;seen.add(v.w);pool.push({w:v.w,m:v.m,wt});});
    });
    return pool;
  }

  let STATE={level:1,prog:{}}; // prog[lessonId]=[STEP_COUNT bools]
  try{const s=localStorage.getItem('ttf');if(s)STATE=JSON.parse(s);}catch(e){}
  if(STATE.course!=='middle'&&STATE.course!=='high')STATE.course='beginner'; // 'beginner'/'middle'/'high'
  function save(){try{localStorage.setItem('ttf',JSON.stringify(STATE));}catch(e){}
    try{ if(window.gasflare)window.gasflare.pushLater(); }catch(e){}}   // 先生のURL経由なら記録も送る
  const isMiddleCourse=()=>STATE.course!=='beginner';   // JSONベースのコース(中学・高校)

  // ---------- GASflare（先生のスプレッドシートへ記録） ----------
  // 生徒が「先生が配ったURL」を踏むと ?tt=<署名トークン> 付きでここへ来る。
  // 以降、進捗が動くたびに**その先生のGAS**へ送られ、先生のシートにだけ溜まる。
  // 進捗の正本はあくまで localStorage。GASが落ちていてもゲームは止まらない。
  const GF_SIG='ttf_gf_sig';                                   // 送信済みの内容（変わっていない課は送らない）
  function courseRaw(ck,id){
    const arr = ck==='beginner' ? BEGINNER_DATA : COURSE_DATA[ck];
    return Array.isArray(arr) ? arr.find(o=>Number(o.b)===Number(id)) : null;
  }
  function courseTitle(ck,id){ const x=courseRaw(ck,id); return (x&&x.title)||''; }
  // そのレッスンの新出語数。固有名詞(Ken/Pochi等)は出題対象外なので数えない。
  //   小学=vocab[{w,ja}] / 中学・高校=vocabSentences[].words[{w,ja}]
  const TOMATO_IDX=STEPS.findIndex(x=>x.key==='tomato');
  function courseWordCount(ck,id){
    const x=courseRaw(ck,id); if(!x)return 0;
    const list = ck==='beginner'
      ? (x.vocab||[])
      : (x.vocabSentences||[]).reduce((a,v)=>a.concat(v.words||[]),[]);
    const seen=new Set();
    list.forEach(w=>{ const k=String(w&&w.w||'').trim(); if(!k||isProperNoun(k,w.ja))return; seen.add(k.toLowerCase()); });
    return seen.size;
  }
  // 1レッスン = 1項目。セルには「具材n/5」「🌮 完成」「★昇級」を出す
  function gfEntries(all){
    let prev={}; try{ prev=JSON.parse(localStorage.getItem(GF_SIG)||'{}'); }catch(e){}
    const out=[];
    Object.keys(COURSES).forEach(ck=>{
      const C=COURSES[ck];
      const P=STATE[C.progKey]||{}, D=STATE[C.doneKey]||{}, E=STATE[C.examKey]||{}, S=STATE[C.skipKey]||{};
      const ids={}; [P,D,E,S].forEach(o=>Object.keys(o).forEach(k=>{ids[k]=1;}));
      Object.keys(ids).forEach(id=>{
        const p=Array.isArray(P[id])?P[id]:[];
        const n=p.filter(Boolean).length;
        const done=!!D[id], exam=!!(E[id]||S[id]);
        if(!n && !done && !exam)return;
        const bits=STEPS.map((_,k)=>p[k]?'1':'0').join('');    // 具材ごとの達成（復元用の原本）
        const sig='v2|'+bits+'|'+(done?1:0)+'|'+(exam?1:0);   // v2 = 集計値(stats)を含む世代
        const item=C.prefix+id;
        if(!all && prev[item]===sig)return;                    // 前回から変わっていない → 送らない
        const t=courseTitle(ck,id);
        // 集計値。単語ごとの記録は持っていないので、トマトマト(新出単語)を終えたレッスンの
        // 新出語数を「学習済み単語」として数える。
        const words=(TOMATO_IDX>=0&&p[TOMATO_IDX])?courseWordCount(ck,id):0;
        out.push({
          item:item,
          label:C.prefix.toUpperCase()+id+(t?' '+t.slice(0,18):''),
          cell:(done?'🌮 完成':'具材 '+n+'/'+STEP_COUNT)+(words?'\n単語 '+words:'')+(exam?'\n★昇級試験':''),
          detail:bits,
          plays:n, clears:done?1:0, perfect:exam,
          stats:{ words:words, tacos:done?1:0, exams:exam?1:0 },
          _sig:sig,
        });
      });
    });
    return out;
  }
  function gfCommit(entries){                                   // 送れた分を「送信済み」として覚える
    let prev={}; try{ prev=JSON.parse(localStorage.getItem(GF_SIG)||'{}'); }catch(e){}
    entries.forEach(e=>{ if(e._sig)prev[e.item]=e._sig; });
    try{ localStorage.setItem(GF_SIG,JSON.stringify(prev)); }catch(e){}
  }
  // クラウドの記録をローカルへ反映（別端末の続きを引き継ぐ。「消さない方向」でのみ結合）
  function gfApply(progress){
    if(!progress||typeof progress!=='object')return;
    let changed=false;
    Object.keys(progress).forEach(item=>{
      const m=/^([bmh])(\d+)$/.exec(item); if(!m)return;
      const ck=Object.keys(COURSES).find(k=>COURSES[k].prefix===m[1]); if(!ck)return;
      const C=COURSES[ck], id=m[2], d=progress[item]||{};
      const bits=String(d.detail||'');
      if(bits){                                                  // 具材ごとにORで結合
        const P=STATE[C.progKey]||(STATE[C.progKey]={});
        const a=Array.isArray(P[id])?P[id].slice():STEPS.map(()=>false);
        STEPS.forEach((_,k)=>{ if(bits[k]==='1'&&!a[k]){a[k]=true;changed=true;} });
        P[id]=a;
      }
      if(d.clears>0){ const D=STATE[C.doneKey]||(STATE[C.doneKey]={}); if(!D[id]){D[id]=true;changed=true;} }
      if(d.perfect){ const E=STATE[C.examKey]||(STATE[C.examKey]={}); if(!E[id]){E[id]=true;changed=true;} }
