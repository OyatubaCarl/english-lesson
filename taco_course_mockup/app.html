    segRows.forEach(r=>{
      const row=$(`<div class="settings-row" style="flex-direction:column;align-items:stretch;gap:8px" data-set="${r.key}">
        <div><div class="set-label">${r.label}</div><div class="set-desc">${r.desc}</div></div></div>`);
      const seg=$('<div class="levels"></div>');
      r.opts.forEach((n,k)=>{ const b=$(`<button type="button" class="${k===r.val?'on':''}">${n}</button>`);
        b.onclick=()=>{ STATE[r.key]=k; save();
          [...seg.children].forEach((x,q)=>x.classList.toggle('on',q===k)); };
        seg.appendChild(b); });
      row.appendChild(seg); list.appendChild(row);
    });
    // 🌮 タコビートの「タイミング調整（ズレ）」はここ（全体設定）だけで調整する。
    //    速さ・判定・モードはタコビートのスタート画面でもその場で変えられる（変更はここに同期される）。
    (function offsetRow(){
      const row=$(`<div class="settings-row" style="flex-direction:column;align-items:stretch;gap:8px">
        <div><div class="set-label">🌮 ビートのタイミング調整</div>
        <div class="set-desc">音とノーツがズレて感じるときに。＋でノーツが遅くなる</div></div></div>`);
      const seg=$('<div class="levels"></div>');
      const minus=$('<button type="button">−20ms</button>');
      const val=$(`<button type="button" class="on" style="pointer-events:none;min-width:78px">${beatOff()>0?'+':''}${beatOff()}ms</button>`);
      const plus=$('<button type="button">＋20ms</button>');
      const upd=()=>{ val.textContent=(beatOff()>0?'+':'')+beatOff()+'ms'; };
      minus.onclick=()=>{ STATE.beatOff=Math.max(-200,beatOff()-20); save(); upd(); };
      plus.onclick =()=>{ STATE.beatOff=Math.min(200, beatOff()+20); save(); upd(); };
      seg.append(minus,val,plus); row.appendChild(seg); list.appendChild(row);
    })();
    wrap.appendChild(list);
    if(showA2HSTip())wrap.appendChild($(`<div class="note" style="margin-top:10px;background:var(--panel);border-radius:10px;padding:9px 11px;line-height:1.6">${A2HS_TIP}</div>`)); // iOS Safariのみ常設
    const reset=$('<button class="btn ghost" style="margin-top:14px">🗑️ 進捗をすべてリセット</button>');
    reset.onclick=()=>{ if(confirm('すべての進捗（完成タコス・飛び級）をリセットしますか?')){ localStorage.removeItem('ttf'); STATE={level:1,prog:{}}; alert('リセットしました'); home(); } };
    wrap.appendChild(reset);
    wrap.appendChild($(`<div class="note" style="text-align:center;margin-top:14px;opacity:.72">タコスパーティー ${BUILD_VER}</div>`)); // キャッシュ古さ診断用
    render(wrap);
  }

  // ---------- HOME = ステージ選択（WordTacos踏襲の3階層: ステージ → レッスン → 具材ジャーニー） ----------
  // レッスンを5個ずつステージに束ねる（ステージ1=L1-5, 2=L6-10, 3=L11-15, 4=L16-20）。
  // ステージは常時アクセス可（下 stageUnlocked=true）。レッスン単位の解放は isUnlocked が管理。
  const SGROUP=5;
  function stageLessons(si){ return LESSONS.slice(si*SGROUP,si*SGROUP+SGROUP); }
  function stageOf(id){ const idx=LESSONS.findIndex(x=>x.id===id); return Math.floor(Math.max(0,idx)/SGROUP); }
  function stageUnlocked(si){ return true; } // 全ステージ常時アクセス可（簡単な人がまどろっこしくないように）
  // 小学生編／中学生編の切替タブ（home 上部）
  function courseSwitcher(){
    const box=$('<div class="course-tabs"></div>');
    Object.keys(COURSES).forEach(key=>{
      const c=COURSES[key];
      const ready=(key==='beginner')||!!COURSE_DATA[key];         // データ未読込のコースは押せない
      const on=STATE.course===key;
      const b=$(`<button class="ctab ${on?'on':''} ${ready?'':'off'}"><span class="ci">${c.icon}</span><span class="cl">${c.label}</span><span class="cs">${ready?c.sub:'準備中'}</span></button>`);
      b.onclick=()=>{ if(!ready||STATE.course===key)return; STATE.course=key; save(); if(rebuildActiveCourse()){ curStage=0; home(); } };
      box.appendChild(b);
    });
    return box;
  }
  function home(){
    setTop('',false); showTabs('home'); bgmPlay('home');
    const wrap=$('<div></div>');
    wrap.appendChild(courseSwitcher());
    wrap.appendChild($(`<div class="kicker">${STATE.course==='beginner'?'ステージを選ぶ — 1レッスン＝タコス1個':CS().label+'：'+CS().sub}</div>`));
    const nStages=Math.max(1,Math.ceil(LESSONS.length/SGROUP));
    for(let si=0;si<nStages;si++){
      const ls=stageLessons(si);
      const done=ls.filter(l=>lessonDone(l.id)).length;
      const unlocked=stageUnlocked(si);
      const allDone=ls.length>0&&done===ls.length;
      const cur=unlocked&&!allDone;
      const first=ls.length?ls[0].id:0, last=ls.length?ls[ls.length-1].id:0;
      const card=$(`<div class="lcard ${allDone?'done':''} ${cur?'current':''} ${unlocked?'tap':'locked'}" style="margin-top:9px"></div>`);
      card.appendChild($(`<div class="lrow"><div class="lnum">${si+1}</div><div><div class="ltitle">ステージ ${si+1}</div><div class="lmeta">Lesson ${first}〜${last}</div></div><div class="grab">${allDone?'✓':(unlocked?'›':'🔒')}</div></div>`));
      const shelf=$('<div class="taco-shelf"></div>');
      ls.forEach(l=>shelf.appendChild($(`<span class="${lessonDone(l.id)?'':'dim'}">🌮</span>`)));
      shelf.appendChild($(`<span class="lbl">完成タコス ${done}/${ls.length}</span>`));
      card.appendChild(shelf);
      if(unlocked){ card.onclick=()=>stageScreen(si); }
      else card.appendChild($('<div class="locknote">🔒 前のステージのタコスをすべて完成させると解放</div>'));
      wrap.appendChild(card);
    }
    render(wrap);
  }

  // ---------- レッスン選択（パーティーテーブル） ----------
  let curStage=0;
  function stageScreen(si){
    curStage=si;
    setTop(`ステージ ${si+1} — パーティーテーブル`,true); backBtn.onclick=home;
    showTabs('home'); bgmPlay('home');
    const wrap=$('<div></div>');
    wrap.appendChild($(`<div class="kicker">${STEP_COUNT}つの具材を集めて タコスを完成させよう</div>`));
    stageLessons(si).forEach(l=>{
      const p=prog(l.id),done=lessonDone(l.id),unlocked=isUnlocked(l.id);
      const cur=unlocked&&!done;
      const cnt=p.filter(Boolean).length;
      const card=$(`<div class="lcard ${done?'done':''} ${cur?'current':''} ${!unlocked?'locked':'tap'}" style="margin-top:9px"></div>`);
      card.appendChild($(`<div class="lrow"><div class="lnum">${l.id}</div><div><div class="ltitle">${l.title}</div><div class="lmeta">${l.g||''}</div></div><div class="grab">${done?'🌮':(unlocked?'›':'🔒')}</div></div>`));
      if(unlocked){
        const ing=$('<div class="ing-line"></div>');
        if(done) ing.innerHTML=`<span class="big">🌮</span><span class="lbl">タコス完成！</span>`;
        else ing.innerHTML=`<span class="icons">${STEPS.map((s,k)=>`<i class="${p[k]?'':'dim'}">${s.icon}</i>`).join('')}</span><span class="lbl">具材 ${cnt}/${STEP_COUNT}</span>`;
        card.appendChild(ing);
        const b=$(`<button class="btn" style="margin-top:2px">${done?'もう一度食べる':(cnt>0?'続きから作る':'タコスを作る')} ›</button>`);
        b.onclick=(e)=>{e.stopPropagation();lesson(l.id);};card.appendChild(b);
        card.onclick=()=>lesson(l.id);
      }else{
        card.appendChild($('<div class="locknote">🔒 前のレッスンのタコスを完成、または 🌶️ 厨房ラッシュ合格で飛び級</div>'));
        const b=$('<button class="btn ghost" style="margin-top:2px">🌶️ タコス厨房ラッシュで飛び級（10問連続）</button>');
        b.onclick=(e)=>{e.stopPropagation();rush(l.id,()=>stageScreen(si),()=>stageScreen(si));};card.appendChild(b);
      }
      wrap.appendChild(card);
    });
    render(wrap);
  }

  // ---------- 具材ジャーニー（レッスン内・6具材を順にクリア。先頭=タコビート） ----------
  let curLesson=1;
  function lesson(id){
    curLesson=id;const l=LESSONS.find(x=>x.id===id);
    const si=stageOf(id);
    showTabs(null); bgmPlay('journey');
    if(!l.data){setTop('Lesson '+id+' — '+l.title,true);backBtn.onclick=()=>stageScreen(si);
      render($(`<div class="textcard"><div class="kicker">準備中</div><div style="margin-top:6px;line-height:1.75">このレッスンの中身は、本実装で各Bレッスンのデータを差し込みます。<br>プロトタイプでは <b>Lesson 1「Tom at the Gate」</b> をフル体験できます。</div></div>`));return;}
    const p=prog(id);
    setTop('Lesson '+id+' — '+l.title,true);backBtn.onclick=()=>stageScreen(si);
    const wrap=$('<div></div>');
    const pc=$(`<div class="textcard"><div class="kicker">今日のタコス（原文）</div>
      <div class="en" style="font-size:1.02rem;font-weight:600;line-height:1.5;margin-top:4px">${l.data.passage[0].en}</div>
      <div class="jp" style="font-size:.78rem;color:var(--muted);margin-top:4px">${l.data.passage[0].jp} … 全${l.data.passage.length}文</div></div>`);
    wrap.appendChild(pc);
    // レッスンの歌は YouTube 動画で視聴（常駐ミニ歌プレイヤーは廃止）。動画IDが無ければカードを出さない
    const ytId=(l.youtube||(l.data&&l.data.youtube)||'').trim();
    if(ytId){
      const ytUrl='https://www.youtube.com/watch?v='+encodeURIComponent(ytId);
      const mid=!!(l.data&&l.data.course&&l.data.course!=='beginner');   // 中学・高校は歌ではなくレッスン動画
      const sc=$(`<div class="songcard"><div class="ic">${mid?'🎬':'🎵'}</div>
        <div class="tx"><div class="t">${mid?'この動画で本文を覚えよう':'この歌で本文を覚えよう'}</div><div class="s">${l.data.songTitle||'レッスンソング'}・YouTubeで視聴</div></div>
        <a class="go" href="${ytUrl}" target="_blank" rel="noopener" style="text-decoration:none">▶ YouTubeで${mid?'動画':'歌'}を見る</a></div>`);
      wrap.appendChild(sc);
      // 歌詞（＝本文）を折りたたみで表示するボタン
      const psg=(l.data&&l.data.passage)||[];
      if(psg.length){
        wrap.appendChild($(`<details class="lyrics-acc"><summary>歌詞（本文）を見る</summary><ul class="lyrics">${
          psg.map(p=>`<li>${p.en}<span class="lj">${p.jp||''}</span></li>`).join('')}</ul></details>`));
      }
    }
    const cnt=p.filter(Boolean).length;
    wrap.appendChild($(`<div class="course-progress"><span style="font-size:1.1rem">🌮</span><div class="bar"><i style="width:${cnt/STEP_COUNT*100}%"></i></div><span class="n">具材 ${cnt} / ${STEP_COUNT}</span></div>`));
    // レッスン内は任意順: どの具材からでも開始できる（全具材を常に開放。逐次ロックはしない）
    const firstUndone=p.findIndex(x=>!x);        // 最初の未完了だけ current ハイライト（他も開放）
    STEPS.forEach((s,i)=>{
      const sdone=p[i],current=i===firstUndone;
      const st=$(`<div class="step ${sdone?'done':''} ${current?'current':''}"></div>`);
      st.appendChild($(`<div class="rail"><div class="node">${sdone?'✓':s.icon}</div><div class="line"></div></div>`));
      const sc=$(`<div class="sc tap"><div><div class="sn">${s.name}</div><div class="sd">${s.key==='salsa'&&l.g?l.g:s.desc}</div></div>${sdone?'<span class="tag g">ゲット</span>':'<span class="go">▶</span>'}</div>`);
      sc.onclick=()=>doStep(i);                  // 完了・未完了を問わずタップ可
      st.appendChild(sc);
      wrap.appendChild(st);
    });
    // 流れ: 5具材でタコス完成 → つづけて昇級試験（厨房ラッシュ）へ。未完成でも飛び級試験として挑戦できる（いつでも可）。
    const allDone=p.every(Boolean);
    const examOK=examPassed(id);
    const rst=$(`<div class="step rush-step ${examOK?'done':''} ${(allDone&&!examOK)?'current':''} last"></div>`);
    rst.appendChild($(`<div class="rail"><div class="node rush">${examOK?'✓':'🌶️'}</div></div>`));
    const rsc=$(`<div class="sc tap"><div><div class="sn">タコス厨房ラッシュ <span class="ex-badge">昇級試験</span></div>
      <div class="sd">${examOK?'昇級試験クリア済み！ もう一度挑戦もOK':(allDone?'🌮 タコス完成！ つづけて昇級試験に挑戦しよう（10問連続で合格→昇級）':'10問連続で合格すると昇級。タコス未完成でも飛び級試験として挑戦できます')}</div></div><span class="go">🌶️</span></div>`);
    rsc.onclick=()=>rush(id,()=>lesson(id),()=>lesson(id));
    rst.appendChild(rsc);
    wrap.appendChild(rst);
    render(wrap);
  }
  function completeStep(i){const p=prog(curLesson);p[i]=true;save();
    // 5具材が揃った瞬間にタコス完成（ただし演出は一度だけ。既に完成済みならレッスンへ戻るだけ）
    if(canComplete(curLesson)&&!tacoIsDone(curLesson)){ markTacoDone(curLesson); tacoComplete(); }
    else lesson(curLesson);}

  // 🥩 中学ビート: レッスン動画(YouTube)で本文をまるごと聞く → 具材ゲット。
  //    リズム譜面(タコビート本体)は中学曲ぶんが未生成のため、いまは動画＋本文リスニング。譜面が出来たら stepBeat に切替える。
  function stepBeatMiddle(d,i){
    bgmStop();
    resetAudioSession('beat-open'); audioBeforePlay(); // 動画音声が小音量で始まらないように
    const vid=(d.youtube||'').trim();
    const wrap=$('<div></div>');
    if(vid){
      const sticky=$('<div class="yt-sticky"></div>');
      const box=$('<div class="ytwrap"></div>');
      box.appendChild($(`<iframe src="https://www.youtube.com/embed/${vid}?playsinline=1&rel=0" title="レッスン動画" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>`));
      sticky.appendChild(box); wrap.appendChild(sticky);
      wrap.appendChild($('<div class="note" style="text-align:center;margin-top:8px">🥩 レッスン動画で本文をまるごと聞こう（リズム譜面は準備中）</div>'));
    }else{
      wrap.appendChild($('<div class="textcard"><div class="kicker">🥩 タコビート（準備中）</div><div style="margin-top:6px;line-height:1.7;font-size:.92rem">このレッスンの動画は準備中です。本文を声に出して読んで次へ進みましょう。</div></div>'));
    }
    const list=$('<div class="mid-read"></div>');
    (d.passage||[]).slice(0,6).forEach(p=>{ if(!p.en)return;
      const row=$(`<div class="mid-row"><span class="en">${p.en}</span><button class="spk2" aria-label="発音">🔊</button></div>`);
      row.querySelector('.spk2').onclick=()=>sayEn(p.en); list.appendChild(row); });
    wrap.appendChild(list);
    const nb=$('<button class="btn green" style="margin-top:16px">🥩 具材ゲット！ 次へ →</button>');
    nb.onclick=()=>completeStep(i); wrap.appendChild(nb);
    render(wrap);
  }

  // 🍅 中学トマトマト（複数トマト）: 1文に複数の英単語トマト → 全部収穫したら次の文へ
  function stepVocabMulti(d,i){
    const SENTS=(d.vocabSentences||[]).filter(s=>s.words&&s.words.length).slice(0,MID_TOMATO_MAX);
    if(!SENTS.length){ // データ無しの保険（具材は渡す）
      const wrap=$('<div></div>');
      wrap.appendChild($('<div class="banner ng">このレッスンの新出単語データがありません。</div>'));
      const nb=$('<button class="btn green">🍅 具材ゲット →</button>'); nb.onclick=()=>completeStep(i); wrap.appendChild(nb);
      render(wrap); return;
    }
    const POOL=[...new Set(SENTS.flatMap(s=>s.words.map(w=>w.ja)))]; // ダミー意味の候補（このレッスン内）
    const totalToms=SENTS.reduce((a,s)=>a+s.words.length,0);
    let si=0;
    function openSheet(w,ja,onOk){
      let others=vocabDummies(ja).filter(x=>x!==ja);
      if(others.length<3){ shuffle(POOL).forEach(x=>{ if(others.length>=3)return; if(x!==ja&&!others.includes(x))others.push(x); }); }
      const choices=shuffle([ja,...others.slice(0,3)]);
      const bg=$('<div class="vsheet-bg"></div>');
      const sh=$(`<div class="vsheet"><div class="vh"><span class="w">🍅 ${w}</span><button class="spk" aria-label="発音">🔊</button></div>
        <div class="vq">意味をえらんで収穫しよう</div><div class="choices"></div></div>`);
      sh.querySelector('.spk').onclick=()=>sayEn(w);
      const box=sh.querySelector('.choices');
      choices.forEach((c,k)=>{const b=$(`<button class="choice tap"><span class="k">${'ABCD'[k]}</span>${c}</button>`);
        b.onclick=()=>{ if(c===ja){ b.classList.add('correct'); [...box.children].forEach(x=>x.disabled=true); sayEn(w); setTimeout(()=>{bg.remove();onOk();},480); }
          else{ b.classList.remove('squish'); void b.offsetWidth; b.classList.add('wrong','squish'); b.disabled=true; buzz(); } };
        box.appendChild(b);});
      bg.appendChild(sh);
      bg.onclick=(e)=>{ if(e.target===bg) bg.remove(); };
      document.querySelector('.device').appendChild(bg);
    }
    function tomatoDone(){
      const wrap=$('<div></div>');
      wrap.appendChild($(`<div class="banner ok">✅ 全 ${SENTS.length} 文・${totalToms} 個のトマトを収穫！ トマトマトのできあがり！</div>`));
      const plate=$('<div style="text-align:center;font-size:30px;letter-spacing:3px;padding:10px 0">🍅🍅🍅 🍽️</div>');
      wrap.appendChild(plate);
      const nb=$('<button class="btn green">🍅 具材ゲット！ 次へ →</button>');
      nb.onclick=()=>completeStep(i); wrap.appendChild(nb);
      verdictMark('ok'); sfxGet(); confettiBurst();
      render(wrap);
    }
    function drawSent(){
      setTop('🍅 トマトマト（具材 '+(i+1)+'/'+STEP_COUNT+'）',true); backBtn.onclick=()=>lesson(curLesson);
      const s=SENTS[si]; const total=s.words.length; let harvested=0;
      const wrap=$('<div></div>');
      wrap.appendChild($(`<div class="qmeta"><span>文 ${si+1} / ${SENTS.length}</span><span>🍅 熟したトマトをタップ</span></div>`));
      const crate=$(`<div class="tm-crate"><div class="cl">🧺 この文のトマト <b>0</b> / ${total}</div><div class="tm-slots"></div></div>`);
      const slots=crate.querySelector('.tm-slots');
      s.words.forEach(()=>slots.appendChild($('<span class="tm-slot"></span>')));
      wrap.appendChild(crate);
      let idx=0; const html=(s.text||'').replace(/<([^>]+)>/g,(m,w)=>{const k=idx++;return `<span class="vword tm-w" data-i="${k}">${w}</span>`;});
      const card=$('<div class="textcard"></div>');
      const sent=$(`<div class="jpmix">${html}</div>`); card.appendChild(sent);
      wrap.appendChild(card);
      wrap.appendChild($('<div class="qhint">🍅 熟したトマト（英単語）をタップ → 発音を聞いて意味を選ぶと収穫！</div>'));
      render(wrap);
      [...sent.querySelectorAll('.tm-w')].forEach(span=>{ const k=+span.dataset.i; const wd=s.words[k]; if(!wd)return;
        span.onclick=()=>{ if(span.classList.contains('done'))return;
          span.classList.remove('pop'); void span.offsetWidth; span.classList.add('pop'); // タップでポップ
          sayEn(wd.w);                                                                     // タップした瞬間に英単語を発音
          openSheet(wd.w,wd.ja,()=>{
            span.classList.add('done'); span.innerHTML=`<ruby>${wd.w}<rt>${wd.ja}</rt></ruby>`; span.onclick=null;
            const sl=slots.children[harvested];
            flyHarvest(span,sl,()=>{ if(sl){sl.classList.add('done');sl.textContent='🍅';}   // 収穫: トマトがかごへ跳ねて落ちる
              harvested++; const cb=crate.querySelector('.cl b'); if(cb)cb.textContent=harvested;
              if(harvested>=total){
                wrap.appendChild($('<div class="banner ok" style="margin-top:12px">✅ この文、全部収穫！ 次の文へ</div>'));
                setTimeout(()=>{ si++; if(si<SENTS.length)drawSent(); else tomatoDone(); },900);
              }
            });
          });
        };
      });
    }
    drawSent();
    showIntro('tomatoM');
  }

  function doStep(i){
    const l=LESSONS.find(x=>x.id===curLesson);const d=l.data;
    setTop(STEPS[i].icon+' '+STEPS[i].name+'（具材 '+(i+1)+'/'+STEP_COUNT+'）',true);backBtn.onclick=()=>lesson(curLesson);
    showTabs(null); // サルサ(index3)のみ専用BGM。他(ビート0=iframe専用/トマト1=単語音声/チーズ2=マイク/レタス4)はBGM停止
    const _bscene={3:'salsa'}[i];
    if(_bscene) bgmPlay(_bscene); else bgmStop();
    // 中学・高校: トマト=複数トマト。ビートは譜面がある課だけ本編(stepBeat)、
    //   譜面が無い課(高校のL46以降)はレッスン動画＋本文リスニング(stepBeatMiddle)で具材を渡す。
    const ck=(d&&d.course)||'beginner';
    const beat=hasChart(ck,(l.b!=null?l.b:curLesson))?stepBeat:stepBeatMiddle;
    const dispatch=(ck!=='beginner')
      ? ({0:beat,1:stepVocabMulti,2:stepShadow,3:stepSalsa,4:stepLettuce})

  function stepBeat(d,i){

  // 2 🥫 サルサグラマー（文法解説=レシピ表示 → 文法クイズ＋穴埋めを1品に統合）

  const SALSA_PASS_RATIO=0.75;   // 合格ライン=従来比率（10問→8問、9問→7問）

  function stepSalsa(d,i){
    // 3形式を共通形式へ: JSON手作り {q,ja,choices,a,expl} / 旧手作り {q:'「和訳」　英文',c,a,e} / cloze {pre,post,choices,ans,ja,e}

  // 【廃止・未使用】旧 レタス・スラッシュ（水槽ゲーム）。現在レタス枠は下の並べ替え版 stepLettuce が担当。
  // 関数名重複を避けるため _stepLettuceSlashUnused に改名（doStepからは呼ばれない）。
  const LT_SIZE=80, LT_BASE=58, LT_GROW=1.08, LT_CAP=1.6;
  function lettuceSpeed(qidx){ return Math.min(LT_BASE*Math.pow(LT_GROW,qidx), LT_BASE*LT_CAP); }
  function _stepLettuceSlashUnused(d,i){
    const src=(d.testVocab&&d.testVocab.length)?d.testVocab:d.vocab;

    let qi=0,combo=0,raf=null,items=[],lock=false,lastTs=0;
    const wrap=$('<div class="lettuce-wrap"></div>');
    wrap.appendChild($('<div class="lettuce-top"><div class="lq"><small class="lq-num"></small><span class="lq-ja"></span></div><div class="combo-badge">コンボ<b class="lq-combo">-</b></div></div>'));

    function startQ(){
      if(raf)cancelAnimationFrame(raf); raf=null;

      const q=qs[qi]; const spd=lettuceSpeed(qi);
      window.__ttfLettuce={speed:spd,cap:LT_BASE*LT_CAP,base:LT_BASE,idx:qi,total:qs.length,answer:q.w,size:LT_SIZE,
        pos:()=>items.filter(t=>!t.dead).map(t=>({x:t.x,y:t.y}))}; // 検証用フック（衝突=距離が半径和未満に留まらないこと）
      wrap.querySelector('.lq-num').textContent='だい '+(qi+1)+' もん / '+qs.length;

      const fw=field.clientWidth||300, fh=field.clientHeight||300;
      opts.forEach((o,k)=>{
        const el=$('<div class="lettuce"><span class="lw"></span></div>');
        el.querySelector('.lw').textContent=o.w;
        // 4玉とも最初から表示。四隅エリアに置いて、斜めのランダム方向へ等速で漂う
        const col=k%2, rowi=Math.floor(k/2);
        const ang=Math.PI/4+(Math.random()-0.5)*(Math.PI/4);   // 22.5°〜67.5°
        const it={el,w:o.w,
          x:(fw-LT_SIZE)*(0.1+col*0.7)+Math.random()*14,
          y:(fh-LT_SIZE)*(0.12+rowi*0.6)+Math.random()*14,
          vx:Math.cos(ang)*spd*(Math.random()<0.5?-1:1),
          vy:Math.sin(ang)*spd*(Math.random()<0.5?-1:1)};

      const dt=lastTs?Math.min((ts-lastTs)/1000,0.05):0; lastTs=ts;

        if(it.y<=0){it.y=0;it.vy=Math.abs(it.vy);} if(it.y>=my){it.y=my;it.vy=-Math.abs(it.vy);}

  // 並べ替え(Duolingo風) の正誤判定。

  function eqArr(a,b){return a.length===b.length&&a.every((x,k)=>x===b[k]);}
  function jaFlexibleOk(answer,arr){
    if(arr.length!==answer.length)return false;
    if([...arr].sort().join('')!==[...answer].sort().join(''))return false; // 同じタイル集合
    if(arr[arr.length-1]!==answer[answer.length-1])return false;                          // 述語(末尾)は固定
    const topic=answer.findIndex(t=>/[はわ]$/.test(t));                                   // 話題「〜は」
    if(topic===0 && arr[0]!==answer[0])return false;                                     // 話題は先頭固定
    return true;
  }
  function reorderOk(item,arr){
    if(eqArr(arr,item.answer))return true;
    if((item.alts||[]).some(a=>eqArr(arr,a)))return true;
    if(item.lang==='ja')return jaFlexibleOk(item.answer,arr);
    return false;
  }
  // タイルの表示を正規化して位置バレ(文頭大文字・末尾句読点)を消す。判定・完成表示には原文(orig)を使う。
  // 固有名詞=正解文の先頭以外で大文字出現する語。"I"(I'm等含む)は常に大文字。日本語(ja)は正規化しない。
  function reorderProperSet(answer){ const s=new Set();
    (answer||[]).forEach((w,k)=>{ if(k>0 && /^[A-Z]/.test(w)) s.add(w.replace(/[.?!,]+$/,'').toLowerCase()); });

    if(/^i$/i.test(w)||/^i['’]/i.test(w))return 'I'+w.slice(1); // I / I'm / I've … は大文字I

  // 検証用フック（UI非依存）: 正規化タイル表示と完成文の正書法
  window.__ttfReorder={

    const check=$('<button class="btn" style="margin-top:12px" disabled>答え合わせ</button>'); host.appendChild(check);
    const msg=$('<div style="margin-top:8px"></div>'); host.appendChild(msg);

    let uid=0, locked=false, draggingId=null, ghost=null;

      const el=$(`<button class="ro-tile ${isEn?'en':''}" data-id="${t.id}">${t.t}</button>`);
      el.style.touchAction='none';

    }

      const hf=$(`<div class="hf-chip"><div><div class="lb">🙌 ハンズフリー</div><div class="desc">通過するたび自動で次の文へ</div></div>
        <label class="switch"><input type="checkbox" ${handsFree?'checked':''}><span></span></label></div>`);
      hf.querySelector('input').addEventListener('change',e=>{ handsFree=e.target.checked; SET.handsfree=handsFree;
        if(passed){ // すでに通過済みの画面でONにしたら、そのまま自動で次へ
          if(handsFree){ next.style.display='none'; later(()=>{ if(left)return; left=true; const last=si+1>=total; if(last)cheeseFin(); else { si++; drawSentence(true); } },500); }
          else { next.style.display='flex'; next.disabled=false; }
        } });
      wrap.appendChild(hf);
      const listen=$('<button class="btn soft" style="margin-top:8px">🔊 お手本をもう一度聞く</button>');
      listen.onclick=()=>{ if(passed||left||!SR){ sayEn(p.en); return; }
        recPause('model'); setStatus('info','🔊 お手本 再生中…'); hideRec(); // お手本中は認識をお休み(iOSのこもり対策)
        speakModel(()=>beginTurn()); };
      wrap.appendChild(listen);
      const restartBtn=$('<button class="btn" style="margin-top:8px;display:none">🔁 認識を再開</button>'); wrap.appendChild(restartBtn);
      const next=$('<button class="btn green" disabled style="margin-top:8px">通過してから次へ</button>');
      next.onclick=()=>{ left=true; si++; if(si<total)drawSentence(true); else cheeseFin(); };
      wrap.appendChild(next);
      wrap.appendChild($('<div class="note">最初に一度だけ押せば、あとは自動で判定します。声がそろえば通過、うまく揃わなくても何回か読めば必ず通過します（要 Chrome / Safari ＋ マイク許可）。</div>'));
      function refresh(){ sent.querySelectorAll('.sh-word').forEach((sp,k)=>{ sp.classList.toggle('matched',matched.has(k)); sp.classList.toggle('auto-matched',auto.has(k)); }); }
      function setStatus(kind,html){ meter.style.display='block'; meter.className='banner '+(kind==='ok'?'ok':(kind==='ng'?'ng':(kind==='listen'?'info listening':'info'))); meter.innerHTML=html; }
      function addRecognized(text){
        const set=new Set(text.split(/\s+/).map(norm).filter(Boolean));
        targ.forEach((t,k)=>{ if(matched.has(k)||!t)return; if(set.has(t) || [...set].some(r=> r.length>2 && (r.includes(t)||t.includes(r)))) matched.add(k); });
        refresh();
      }
      function succeed(){ // 通過は自動。全単語グリーン＋演出
        if(passed||left)return; passed=true; recPause('pass'); hideRec(); // 認識は一時停止（セッションは次の文まで維持）
        words.forEach((_,k)=>matched.add(k)); auto.clear(); refresh();
        startBox.remove(); listen.style.display='none'; restartBtn.style.display='none';
        successFlash(); chime();
        const last=si+1>=total;
        const cb=wrap.querySelector('.cheese-bar i'), cl=wrap.querySelector('.cheese-bar-label');
        if(cb)cb.style.width=((si+1)/total*100)+'%'; if(cl)cl.textContent=(si+1)+' / '+total;
        if(handsFree){ // ハンズフリー: 通過したら自動で次の文へ（マイク許可済み）
          setStatus('ok', last?'🎉 通過！ チーズがとろっとろ！':'🎉 通過！ つづけて次の文へ…');
          next.style.display='none';
          later(()=>{ if(left)return; left=true; if(last)cheeseFin(); else { si++; drawSentence(true); } }, 1200);
        } else {
          setStatus('ok','🎉 通過！ ぜんぶ言えました！ ナイス・シャドウイング！');
          next.disabled=false; next.textContent=last?'🧀 具材ゲット！ 次へ →':'次の文へ →';
        }
      }
      function judgeRound(){ // 1発話（認識のfinal結果）ごとの自動判定。認識は continuous のため回し続ける
        if(passed||left)return;
        const th=SH_TH[Math.min(failed,SH_TH.length-1)];
        if(matched.size/words.length>=th){ succeed(); return; }
        failed++;
        if(failed>=5){ succeed(); return; } // 5回で必ず通過
        setStatus('ng','🔁 もう一度、続けて読んでみよう。くり返すほど通過しやすくなります。');
        later(()=>{ if(!passed&&!left&&sess.wantListen)setStatus('listen','🎧 聞き取り中…　お手本に続けて、声に出して読もう'); },900);
      }
      // この文の認識イベントの受け口（セッションはステップ共通・ハンドラだけ文ごとに差し替える）
      sess.h={
        onLive:()=>{ if(!passed&&!left&&sess.wantListen)showRec(); },
        onText:(txt,fin)=>{ if(passed||left)return; addRecognized(txt);
          if(matched.size>=words.length){ succeed(); return; }
          if(fin)judgeRound(); },
        onEnd:(err)=>{ hideRec(); if(passed||left)return;
          if(!sess.wantListen)return; // 意図的一時停止（お手本再生中・通過後・離脱）→ 自動再起動しない
          if(err){ // エラーで終了 → 自動復旧せず「再開」ボタン（GAS方式）
            const saHint=(isIOS()&&isStandalone())?'<br>※アプリを一度閉じて開き直すと直ることがあります。':''; // iOSスタンドアロン初回起動対策
            setStatus('ng',(err==='not-allowed'||err==='service-not-allowed')?('マイクが許可されていません。許可してから「🔁 認識を再開」を押してください。'+saHint):('認識が中断しました。「🔁 認識を再開」を押してください。'+saHint));
            restartBtn.style.display='block'; return; }
          if(matched.size>=words.length){ succeed(); return; }
          recStart(); }, // ブラウザ都合の終了（長い無音など）→ ステップ内で自動再開
      };
      sess.onSuspend=()=>{ if(passed||left)return; hideRec();
        setStatus('ng','いったんマイクをお休みしました。「🔁 認識を再開」を押してください。');
        restartBtn.style.display='block'; };
      function beginTurn(){ // 音読ターン: 認識を再開して聞き取り
        if(passed||left)return;
        setStatus('listen','🎧 聞き取り中…　お手本に続けて、声に出して読もう');
        if(!recStart()){ hideRec(); fallbackSim(); }
      }
      function speakModel(onDone){ let go=false; const fin=()=>{ if(go||left||sess.closed)return; go=true; onDone(); };
        sayEn(p.en,{onend:fin}); later(fin, Math.max(1600, p.en.length*95)); } // お手本=mp3優先(TTS×マイク競合の解消)。onend不発時の保険つき
      function startCycle(){ // お手本再生（この間は認識を一時停止=iOSダッキングでお手本がこもるのを回避）→ 音読ターンで再開
        startBox.remove();
        if(!SR){ setStatus('info','🔊 お手本 再生中…'); speakModel(()=>fallbackSim()); return; }
        recPause('model'); setStatus('info','🔊 お手本 再生中…');
        speakModel(()=>beginTurn());
      }
      function fallbackSim(){ // SR非対応: 自動で数ラウンド回して必ず通過（擬似）
        const step=()=>{ if(passed||left)return;
          const cover=Math.min(words.length, Math.max(1,Math.round(words.length*(0.5+0.16*failed))));
          shuffle(words.map((_,k)=>k)).slice(0,cover).forEach(k=>matched.add(k)); refresh();
          const th=SH_TH[Math.min(failed,SH_TH.length-1)];
          if(matched.size/words.length>=th||failed>=4){ succeed(); return; }
          failed++; setStatus('listen','🎧 自動判定中…（擬似モード）'); later(step,700);
        };
        setStatus('listen','🎧 自動判定中…（擬似モード）'); later(step,600);
      }
      restartBtn.onclick=()=>{ restartBtn.style.display='none'; beginTurn(); };
      _shadowKeep=true; render(wrap); // ステップ内の文送り再描画では認識セッションを維持する
      if(autostart) startCycle(); // 2文目以降 or ハンズフリー: 自動開始（マイク許可済み）
      if(si===0&&!autostart)showIntro('cheese');
    }
    drawSentence();
  }

  // ---------- 🌮 タコス完成演出（6具材コンプで自動再生 → パーティーテーブルへ） ----------
  // party_mockup の完成演出を移植: 具材が並ぶ→7層組み上げ→ライム絞り→いただきます→ぱくっ×3
  // 6具材コンプ → トム(掲げて大喜び)がポン登場 → かじる画にクロスフェード → 「タコス完成！」＋獲得ジングル → 数秒で閉じる
  function tacoComplete(){
    const lid=curLesson, si=stageOf(lid);
    const C=`${A}/celebrate`;
    const ov=$(`<div class="final-ovl"><div class="final-wrap">

        </div>
        <div class="final-word"></div>

      <div class="final-foot" style="display:flex;flex-direction:column;gap:8px">

    document.querySelector('.device').appendChild(ov);

    const timers=[]; const fT=(fn,ms)=>timers.push(setTimeout(fn,ms));
    let done=false;
    const close=()=>{ if(done)return true; done=true; timers.forEach(clearTimeout); ov.remove(); return false; };
    const finish=()=>{ if(close())return; stageScreen(si); };
    const goExam=()=>{ if(close())return; rush(lid,()=>stageScreen(si),()=>stageScreen(si)); };  // 完成→昇級試験へ
    tableBtn.onclick=finish; examBtn.onclick=goExam;
    const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    function fw(txt,size){ word.textContent=txt; word.style.fontSize=(size||30)+'px';
      word.classList.remove('show'); void word.offsetWidth; word.classList.add('show'); }
    function stars(x,y){ if(reduce)return; for(let k=0;k<7;k++){ const s=$(`<span class="star-fx">${k%2?'⭐':'✨'}</span>`);
      s.style.left=x+'px'; s.style.top=y+'px';
      s.style.setProperty('--dx',(Math.random()*180-90)+'px'); s.style.setProperty('--dy',(Math.random()*-130-20)+'px');
      stage.appendChild(s); setTimeout(()=>s.remove(),850); } }
    const cx=()=>stage.clientWidth*0.5, cy=()=>stage.clientHeight*0.32;
    if(reduce){ // 控えめ: クロスフェードや拡大を省き、最終状態＋ジングル1回のみ
      cheer.style.transition=bite.style.transition='none';
      bite.classList.add('show'); fw('🌮 タコス完成！ 🎉',30); sfxFanfare();
      return;   // 自動クローズせず、ユーザーが「昇級試験」か「テーブル」を選ぶ
    }
    // 1) 掲げて大喜びのトムをポンと大きく登場 ＝演出開始の瞬間(0s)にファンファーレを鳴らす
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ cheer.classList.add('show'); sfxFanfare(); }));
    fT(()=>{ confettiBurst(); stars(cx(),cy()); },350);
    // 2) 少し間 → かじる画へクロスフェード（bite を上に重ねてフェードイン）
    fT(()=>bite.classList.add('show'),1600);
    // 3) 完成の瞬間: 文字＋紙吹雪・星（ファンファーレは冒頭で既に発火済み・二重に鳴らさない）
    fT(()=>{ fw('🌮 タコス完成！ 🎉',30); confettiBurst(); stars(cx(),stage.clientHeight*0.28); },2600);
    // 4) 完成後は自動で閉じず、「🌶️ 昇級試験に挑戦」か「テーブルへ」をユーザーが選ぶ（完成→昇級試験の流れ）
  }

  // ---------- タコス厨房ラッシュ（飛び級） — WordTacos kitchen_rush と同一の音楽・画像・演出 ----------
  const KR_GOAL=10, KR_LIVES=10;
  const KR_TIME=[7.0,6.5,6.0,5.5,5.0,4.5,4.0,3.5,3.0,2.5]; // streak0..9 で単調に短縮(WordTacosと同一)
  const KR_OK=['いいね!','ナイスタコス!','のってる!','味が決まってる!'];               // WordTacos原文
  const KR_NG=['もう一度!','ライム絞って深呼吸','次のタコスは美味しくなる','焦らずいこう']; // WordTacos原文
  const KR_FAIL_TITLES=['🌮 今日は店じまい!','🌶️ ペースを取り戻そう','🥬 仕込み直し!'];
  const KR_FAIL_MSGS=['タコス10個こぼした…明日また来てね!','サルサ切れだ!　補充して再挑戦!','今日は厨房がガチャガチャ。深呼吸!','熱したフライパンを冷まそう、そして再挑戦!'];
  // rush(targetId, backTo, onWin)
  //  ① 昇進試験（レッスン内・必須）: targetId=現レッスン。合格で exam[id]=true → onWin で 5具材そろっていればタコス完成。
  //  ② 飛び級（ロック中レッスン）: targetId=そのレッスン。合格で skip[id]=true → 解放。
  function rush(targetId,backTo,onWin){
    targetId=targetId||(LESSONS.find(x=>!isUnlocked(x.id))||{}).id;
    const tl=LESSONS.find(x=>x.id===targetId);
    const wasLocked=!isUnlocked(targetId); // ロック中に挑む=飛び級動線／開放済みに挑む=昇進試験
    setTop('🌶️ タコス厨房ラッシュ',true); showTabs(null);
    let streak=0, fails=0, served=0, maxStreak=0;
    let answered=false, raf=null, convAnim=null, gone=false, cur=null;
    const POOL=buildRushPool(); // 基本プール＋解放済みレッスンのvocab（直近ほど重み大）
    backBtn.onclick=()=>{ gone=true; stopTimer(); bgmStop(); (backTo||home)(); };
    function stopTimer(){ if(raf){cancelAnimationFrame(raf);raf=null;} if(convAnim){try{convAnim.cancel();}catch(e){} convAnim=null;} }
    function pick(){const tot=POOL.reduce((a,b)=>a+b.wt,0);let r=Math.random()*tot;for(const v of POOL){r-=v.wt;if(r<=0)return v;}return POOL[0];}
    function makeQ(){
      const q=pick(); const dir=Math.random()<0.5?'en_jp':'jp_en'; const isFinal=streak===KR_GOAL-1;
      const key=dir==='en_jp'?'m':'w';
      const others=shuffle(POOL.filter(x=>x[key]!==q[key])).slice(0,3);
      const opts=shuffle([q,...others]); const ans=opts.findIndex(x=>x[key]===q[key]);
      return {q,dir,opts,ans,isFinal,timeLimit:SET.timer?KR_TIME[Math.min(streak,KR_TIME.length-1)]:99};
    }
    function setKrMascot(emo){ const m=document.getElementById('kr-mascot'); if(m)setEmotion(m,emo); }
    function setBubble(t){ const b=document.getElementById('kr-bubble'); if(b)b.textContent=t; }
    function fiestaFlash(){ try{ const f=$('<div class="fiesta-flash"></div>'); document.querySelector('.device').appendChild(f); setTimeout(()=>{try{f.remove();}catch(e){}},520);}catch(e){} }
    function startScreen(){ // WordTacosスタート画面と同一の文言
      const ov=$(`<div class="kr-ovl"><h1>タコス厨房<span class="taco">ラッシュ</span></h1>
        <p>流れてくるトルティーヤに<br>正しい具材(英単語)を載せて、<br>お客にタコスを届けよう<br><br><b>10連続正解で合格!</b><br>間違えるとストリークがリセットされ、<br>だんだん難しくなります</p>
        <button class="kbtn">スタート</button>
        <button class="kbtn" style="background:transparent;color:var(--muted);box-shadow:none">あとで（もどる）</button></div>`);
      const btns=ov.querySelectorAll('button');
      btns[0].onclick=()=>{ ov.remove(); bgmPlay('rush'); draw(); };
      btns[1].onclick=()=>{ gone=true; ov.remove(); bgmStop(); (backTo||home)(); };
      render($('<div class="krx"></div>')); document.querySelector('.device').appendChild(ov);
    }
    function draw(){
      if(gone)return; answered=false; cur=makeQ(); const c=cur;
      const wrap=$('<div class="krx"></div>');
      // HUD (🌮 n/10 + ストリークバー + タイマー)
      wrap.appendChild($(`<div class="hud"><span class="streakn">🌮 <span id="krs">${streak}</span><span class="sep">/10</span></span>
        <div class="streak-bar"><div id="krfill" style="width:${streak*100/KR_GOAL}%"></div></div>
        <span class="timer" id="krt">${c.timeLimit.toFixed(1)}s</span></div>`));
      wrap.appendChild($(`<div class="fails ${KR_LIVES-fails<=2?'danger':''}" id="krlives">${'❤️'.repeat(KR_LIVES-fails)}${'🤍'.repeat(fails)}</div>`));
      // 客の列(tom.png・右端) — WordTacosと同一
      wrap.appendChild($(`<div class="customer-row"><div></div><div class="customer" id="krc">
        <img src="${A}/customers/tom.png" alt="Tom" draggable="false" onerror="this.outerHTML='🙂';this.parentElement.style.fontSize='2.4rem'"></div></div>`));
      // オーダー板 — WordTacos原文(「◯◯」お願い! / ラストは 決めろ!)
      const dirLabel = c.isFinal?'🔥 ラストオーダー! 🔥':(c.dir==='jp_en'?'— ORDER (英語で何?) —':'— ORDER (意味は?) —');
      const token = c.dir==='jp_en'?c.q.m:c.q.w;
      const promptTxt = c.isFinal?`「${token}」決めろ!`:`「${token}」お願い!`;
      wrap.appendChild($(`<div class="order ${c.isFinal?'final-order':''}"><div class="direction">${dirLabel}</div><div class="prompt">${promptTxt}</div></div>`));
      // コンベア + トルティーヤ(木目ロール・視覚タイマー) — WordTacosと同一
      const cw=$('<div class="conveyor-wrap"></div>'); const conv=$('<div class="conveyor"></div>'); const tort=$('<div class="tortilla">🫓</div>');
      cw.appendChild(conv); cw.appendChild(tort); wrap.appendChild(cw);
      // 選択肢(具材タグ)
      const box=$('<div class="choices2"></div>');
      c.opts.forEach((o,k)=>{ const label=c.dir==='en_jp'?o.m:o.w;
        const b=$(`<button class="choice2">${label}</button>`); b.onclick=()=>choose(k,box,tort); box.appendChild(b); });
      wrap.appendChild(box);
      // マスコット行(画像) — WordTacosと同一の感情セット
      const mrow=$('<div class="mascot-row"></div>');
      mrow.appendChild($(mascotHTML('bounce',['idle','proud','cheering','encouraging','cheering_warm','surprised'],'👨‍🍳')));
      mrow.firstChild.id='kr-mascot';
      mrow.appendChild($(`<div class="bubble" id="kr-bubble">注文を待ってる…</div>`));
      wrap.appendChild(mrow);
      wrap.appendChild($('<div class="streak-badge" id="krbadge"></div>'));
      render(wrap);
      // マスコット表情とセリフ — WordTacosと同一の分岐
      if(c.isFinal){ setKrMascot('cheering'); setBubble('🔥 ラスト! 決めろ!'); }
      else { setKrMascot('idle');
        setBubble(streak===0?'落ち着いていこう':streak<5?'いいぞ、続けよう!':streak<8?'あと少し、集中!':'もうすぐ10連続だ!'); }
      if(c.dir==='en_jp') setTimeout(()=>{ if(!gone&&!answered) sayEn(c.q.w); },160); // 英語出題は即読み上げ(WordTacos同)
      // タイマー＋コンベア開始
      const convW=cw.clientWidth||300; const dist=Math.max(40,convW-78);
      convAnim=tort.animate([{left:'0px'},{left:dist+'px'}],{duration:c.timeLimit*1000,easing:'linear',fill:'forwards'});
      const t0=performance.now(); const tEl=wrap.querySelector('#krt');
      const tick=()=>{ if(gone||answered)return; const left=c.timeLimit-(performance.now()-t0)/1000;
        tEl.textContent=Math.max(0,left).toFixed(1)+'s'; if(left<=c.timeLimit*0.35)tEl.classList.add('danger');
        if(left<=0){ timeUp(box,tort); return; } raf=requestAnimationFrame(tick); };
      raf=requestAnimationFrame(tick);
    }
    function lockChoices(box,ans,chosen){ [...box.children].forEach((ch,k)=>{ ch.disabled=true;
      if(k===ans)ch.classList.add('correct'); else if(k===chosen)ch.classList.add('wrong'); }); }
    function choose(k,box,tort){ if(answered||gone)return; answered=true; stopTimer();
      if(cur.dir==='jp_en') sayEn(cur.q.w); // 日→英はボタン押下と同時に正解を読み上げ(WordTacos同)
      lockChoices(box,cur.ans,k);
      if(k===cur.ans) onCorrect(tort); else onWrong(tort); }
    function timeUp(box,tort){ if(answered||gone)return; answered=true; stopTimer();
      if(cur.dir==='jp_en') sayEn(cur.q.w);
      setBubble('時間切れ!');
      lockChoices(box,cur.ans,-1); onWrong(tort); }
    function onCorrect(tort){ served++; streak++; if(streak>maxStreak)maxStreak=streak;
      // タコス完成→右上へ飛ぶ(WordTacosと同一のWAAPI)
      try{ tort.textContent='🌮'; tort.animate([
        {transform:'translate(0,0) rotate(0deg) scale(1)',opacity:1},
        {transform:'translate(40px,-30px) rotate(20deg) scale(1.05)',opacity:1,offset:.3},
        {transform:'translate(150px,-100px) rotate(60deg) scale(.5)',opacity:0}
      ],{duration:700,easing:'cubic-bezier(0.4,0,0.6,1)',fill:'forwards'}); }catch(e){}
      const cu=document.getElementById('krc'); if(cu)cu.classList.add('happy');
      setKrMascot(streak>=8?'cheering':streak>=5?'proud':'cheering_warm');
      setBubble(KR_OK[Math.floor(Math.random()*KR_OK.length)]);
      const f=document.getElementById('krfill'); if(f)f.style.width=(streak*100/KR_GOAL)+'%';
      const sn=document.getElementById('krs'); if(sn)sn.textContent=streak;
      if(streak===5){ badge('🌮 連続 5!'); fiestaFlash(); }
      if(streak===8){ badge('🔥 あと2!'); fiestaFlash(); }
      if(streak>=KR_GOAL){ setTimeout(()=>{ if(!gone)endGame(true); },900); return; }
      setTimeout(()=>{ const c2=document.getElementById('krc'); if(c2)c2.classList.remove('happy'); if(!gone)draw(); },700);
    }
    function onWrong(tort){ streak=0; fails++;
      // 焦げ落ち(WordTacosと同一のWAAPI)
      try{ tort.animate([
        {transform:'translate(0,0) rotate(0deg)',filter:'hue-rotate(0deg) brightness(1)',opacity:1},
        {transform:'translate(0,0) rotate(20deg)',filter:'hue-rotate(-40deg) brightness(.7)',opacity:1,offset:.3},
        {transform:'translate(0,90px) rotate(60deg)',filter:'hue-rotate(-90deg) brightness(.4)',opacity:0}
      ],{duration:600,easing:'ease-in',fill:'forwards'}); }catch(e){}
      const cu=document.getElementById('krc'); if(cu)cu.classList.add('angry');
      setKrMascot('cheering_warm'); setBubble(KR_NG[Math.floor(Math.random()*KR_NG.length)]);
      const f=document.getElementById('krfill'); if(f)f.style.width='0%';
      const sn=document.getElementById('krs'); if(sn)sn.textContent=0;
      const lv=document.getElementById('krlives'); if(lv){lv.innerHTML='❤️'.repeat(KR_LIVES-fails)+'🤍'.repeat(fails); if(KR_LIVES-fails<=2)lv.classList.add('danger');}
      sfxFail(); // WordTacos: fail_dizzy + fail_negative 同時再生
      if(fails>=KR_LIVES){ setTimeout(()=>{ if(!gone)endGame(false); },900); return; }
      setTimeout(()=>{ const c2=document.getElementById('krc'); if(c2)c2.classList.remove('angry'); if(!gone)draw(); },900);
    }
    function badge(text){ const b=document.getElementById('krbadge'); if(!b)return; b.textContent=text; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
    function endGame(win){ stopTimer(); bgmStop();
      if(win){ const ek=CS().examKey, sk=CS().skipKey;                     // 合格フラグもコース別
        STATE[ek]=STATE[ek]||{}; STATE[sk]=STATE[sk]||{};
        if(targetId){ STATE[ek][targetId]=true; STATE[sk][targetId]=true;   // 昇級試験合格＝そのレッスンの exam、飛び級でも解放(skip)として効く
          try{ if(window.gasflare){ const c=CS();
            gasflare.log(c.prefix+targetId, c.prefix.toUpperCase()+targetId, '★ 昇級試験(厨房ラッシュ)合格'); } }catch(e){} }
        save(); sfxVictory(); confettiBurst(); }  // 昇級試験の合格音＝victory.mp3（タコス完成のファンファーレとは別音）
      const failTitle=KR_FAIL_TITLES[Math.floor(Math.random()*KR_FAIL_TITLES.length)];
      const failMsg=KR_FAIL_MSGS[Math.floor(Math.random()*KR_FAIL_MSGS.length)];
      // 結果画面 — WordTacosと同一(マスコット + 失敗時は具材が転がり落ちる)
      const ov=$(`<div class="kr-ovl ${win?'':'failed'}">
        <div class="end-scene">
          <img src="${A}/mascot/${win?'cheering':'tumbled'}.png" alt="" onerror="${win?"this.style.display='none'":`this.onerror=null;this.src='${A}/mascot/worried.png'`}">
          <div class="end-spill" aria-hidden="true">
            <span class="spill spill-1">🥬</span><span class="spill spill-2">🍅</span><span class="spill spill-3">🧀</span>
            <span class="spill spill-4">🥩</span><span class="spill spill-5">🥬</span><span class="spill spill-6">💧</span>
          </div>
        </div>
        <h1>${win?'合格!':failTitle}</h1>
        ${win?`<p>${wasLocked?('10連続正解! '+(tl?('Lesson '+tl.id+'「'+tl.title+'」'):'次のコース')+' が解放されました。'):'10連続正解! 昇級試験クリア！ 🎉'}</p>`:`<p class="fail-msg">${failMsg}</p>`}
        <div class="stats-row">
          <div class="stats"><div class="big">${maxStreak}</div><div class="label">最高連続正解</div></div>
          <div class="stats"><div class="big">${served}</div><div class="label">出したタコス</div></div>
        </div>
        <button class="kbtn">${win?'つづける →':'もう一度'}</button></div>`);
      ov.querySelector('button').onclick=()=>{ ov.remove(); if(win){ (onWin||home)(); } else { streak=0;fails=0;served=0;maxStreak=0; bgmPlay('rush'); draw(); } };
      document.querySelector('.device').appendChild(ov);
    }
    startScreen();
  }

  // ---------- 起動: 共有データ lessons.json をロード → 20レッスン構成 ----------
  // 失敗時(オフライン・file:直開き等)は現行のインラインL12のみで従来どおり動く
  (function boot(){
    // 事前生成音声(Piper)マニフェスト＋サルサ手作り問題セット（非ブロッキング。失敗時はTTS/自動生成にフォールバック）
    try{ fetch('party_audio/manifest.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null)
      .then(m=>{ if(m&&(m.exact||m.normalized))_sayMap=m; }).catch(()=>{}); }catch(e){}
    try{ fetch('grammar_questions.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null)
      .then(g=>{ if(g&&typeof g==='object')GRAMMAR_Q=g; }).catch(()=>{}); }catch(e){}
    // 中学・高校サルサ用の手作り文法問題。非ブロッキング。無ければ例文clozeにフォールバック
    Object.keys(COURSES).forEach(k=>{ const f=COURSES[k].grammar; if(!f)return;
      try{ fetch(f,{cache:'no-cache'}).then(r=>r.ok?r.json():null)
        .then(g=>{ if(g&&typeof g==='object')COURSE_GRAMMAR[k]=g; }).catch(()=>{}); }catch(e){} });
    // vocab_sentences.json は buildLessons(構成)より前に必要（新出語の文脈文）→ lessons.json と揃えてから構成
    let pv; try{ pv=fetch('vocab_sentences.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null); }catch(e){ pv=Promise.resolve(null); }
    // 中学・高校のレッスンJSON（コース定義から）
    const courseKeys=Object.keys(COURSES).filter(k=>COURSES[k].json);
    const pcs=courseKeys.map(k=>{ try{ return fetch(COURSES[k].json,{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null); }
      catch(e){ return Promise.resolve(null); } });
    let p=null;
    try{ p=fetch('lessons.json',{cache:'no-cache'}).then(r=>{ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); }); }catch(e){ p=null; }
    if(!p){ title(); return; }
    Promise.all([p.catch(()=>null), pv, Promise.all(pcs)])
     .then(([data,vs,cds])=>{ if(vs&&typeof vs==='object')VOCAB_SENT=vs;
       if(data)BEGINNER_DATA=data;
       courseKeys.forEach((k,i)=>{ const d=cds[i]; if(Array.isArray(d)&&d.length)COURSE_DATA[k]=d; });
       if(!rebuildActiveCourse()){ STATE.course='beginner'; if(data)buildLessons(data); } })
     .catch(()=>{})
     .then(()=>{ tapToStart(()=>{ title(); showStandaloneHint(); }); }); // 「タップしてスタート」→ タイトルへ
  })();

  // 検証・デバッグ用の内部フック（UI動作には影響しない）
  window.__ttf={ get lessons(){return LESSONS;}, get state(){return STATE;}, prog, stageOf,
    home, stageScreen, lesson, doStep, completeStep, stepCount:STEP_COUNT,
    lessonDone, isUnlocked, examPassed, canComplete, rush, get steps(){return STEPS;},
    speak, sayEn, sayResolve:_sayResolve, settings, showStandaloneHint, isIOS, isStandalone, resetAudioSession,
    tacoComplete, sfxFanfare, sfxVictory, reorderProblem, get grammarJson(){return GRAMMAR_Q;},
    get course(){return STATE.course;}, get courses(){return COURSES;},
    get middleData(){return COURSE_DATA.middle;}, get highData(){return COURSE_DATA.high;},
    get courseData(){return COURSE_DATA;}, get courseGrammar(){return COURSE_GRAMMAR;},
    setCourse:(c)=>{ STATE.course=COURSES[c]?c:'beginner'; save(); return rebuildActiveCourse(); },
    buildMiddleLessons, buildMiddleLesson, rebuildActiveCourse };
})();
</script>

<script src="gasflare.js"></script>
