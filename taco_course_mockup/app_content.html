<style>
  :root{
    --bg:#fafafa;--card:#fff;--panel:#f3f6fb;--fg:#1f2937;--fg-soft:#374151;--muted:#6b7280;--faint:#9ca3af;
    --accent:#2563eb;--accent-dark:#1d4ed8;--accent-soft:#eff6ff;--border:#e5e7eb;--border-soft:#f3f4f6;
    --green:#10b981;--green-soft:#d1fae5;--green-ink:#065f46;--amber:#f59e0b;--amber-soft:#fef3c7;--amber-ink:#92400e;
    --red:#ef4444;--red-soft:#fee2e2;--red-ink:#991b1b;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
    --shadow:0 6px 18px rgba(15,23,42,.10);--shadow-lg:0 20px 48px rgba(15,23,42,.18);
    --radius:14px;--ui:"Hiragino Sans","Yu Gothic",Meiryo,system-ui,-apple-system,sans-serif;
    --serif:Georgia,"Times New Roman","Hiragino Mincho ProN",serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f172a;--card:#1e293b;--panel:#172033;--fg:#e5e9f0;--fg-soft:#cbd5e1;--muted:#94a3b8;--faint:#64748b;
    --accent:#3b82f6;--accent-dark:#60a5fa;--accent-soft:#1b2b47;--border:#334155;--border-soft:#263145;
    --green:#34d399;--green-soft:#0f3d31;--green-ink:#6ee7b7;--amber:#fbbf24;--amber-soft:#3b2f12;--amber-ink:#fcd34d;
    --red:#f87171;--red-soft:#3b1a1a;--red-ink:#fca5a5;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 6px 18px rgba(0,0,0,.4);--shadow-lg:0 22px 50px rgba(0,0,0,.55);
  }}
  :root[data-theme="light"]{--bg:#fafafa;--card:#fff;--panel:#f3f6fb;--fg:#1f2937;--fg-soft:#374151;--muted:#6b7280;--faint:#9ca3af;--accent:#2563eb;--accent-dark:#1d4ed8;--accent-soft:#eff6ff;--border:#e5e7eb;--border-soft:#f3f4f6;--green:#10b981;--green-soft:#d1fae5;--green-ink:#065f46;--amber:#f59e0b;--amber-soft:#fef3c7;--amber-ink:#92400e;--red:#ef4444;--red-soft:#fee2e2;--red-ink:#991b1b;--shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);--shadow:0 6px 18px rgba(15,23,42,.10);--shadow-lg:0 20px 48px rgba(15,23,42,.18);}
  :root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--panel:#172033;--fg:#e5e9f0;--fg-soft:#cbd5e1;--muted:#94a3b8;--faint:#64748b;--accent:#3b82f6;--accent-dark:#60a5fa;--accent-soft:#1b2b47;--border:#334155;--border-soft:#263145;--green:#34d399;--green-soft:#0f3d31;--green-ink:#6ee7b7;--amber:#fbbf24;--amber-soft:#3b2f12;--amber-ink:#fcd34d;--red:#f87171;--red-soft:#3b1a1a;--red-ink:#fca5a5;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 6px 18px rgba(0,0,0,.4);--shadow-lg:0 22px 50px rgba(0,0,0,.55);}

  *{box-sizing:border-box}
  .ttf-wrap{font-family:var(--ui);color:var(--fg);background:var(--bg);min-height:100vh;display:flex;justify-content:center;
    padding:22px 14px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .device{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--border);border-radius:26px;
    box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;height:min(860px,92vh);position:relative}

  .topbar{flex:none;display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--border-soft);background:var(--card)}
  .topbar .logo{font-weight:800;font-size:.95rem;letter-spacing:-.01em}
  .topbar .logo em{color:var(--accent);font-style:normal}
  .topbar .logo small{display:block;font-size:.52rem;letter-spacing:.06em;color:var(--faint);font-weight:700}
  .topbar .back{border:none;background:var(--panel);color:var(--fg);width:32px;height:32px;border-radius:9px;font-size:1rem;cursor:pointer;font-family:inherit}
  .topbar .sp{flex:1}
  .topbar .st{font-weight:800;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .view{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .view::-webkit-scrollbar{width:6px}.view::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .kicker{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--faint)}
  .levels{display:flex;gap:0;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:3px}
  .levels button{flex:1;text-align:center;font-size:.74rem;font-weight:800;padding:8px 4px;border-radius:8px;color:var(--muted);
    background:none;border:none;cursor:pointer;font-family:inherit}
  .levels button.on{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}

  .lcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;
    box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .lcard.tap:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .lcard.current{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .lcard.locked{opacity:.7;cursor:default}
  .lrow{display:flex;align-items:center;gap:11px}
  .lnum{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;font-size:.9rem;
    background:var(--panel);color:var(--muted);border:1px solid var(--border)}
  .lcard.current .lnum{background:var(--accent);color:#fff;border-color:var(--accent)}
  .lcard.done .lnum{background:var(--green);color:#fff;border-color:var(--green)}
  .ltitle{font-weight:800;font-size:.94rem}.lmeta{font-size:.72rem;color:var(--muted);margin-top:1px}
  .grab{margin-left:auto;font-size:1.05rem;color:var(--faint)}
  .pips{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .pip{width:15px;height:15px;border-radius:5px;background:var(--panel);border:1.5px solid var(--border)}
  .pip.done{background:var(--green);border-color:var(--green)}
  .pip.cur{border-color:var(--accent);background:var(--accent-soft)}
  .pips .lbl{font-size:.66rem;color:var(--faint);font-weight:800;margin-left:3px;font-variant-numeric:tabular-nums}
  .locknote{font-size:.72rem;color:var(--faint);font-weight:700}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:none;
    border-radius:11px;padding:13px;font-weight:800;font-size:.92rem;font-family:inherit;cursor:pointer;box-shadow:var(--shadow-sm);width:100%}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
  .btn.soft{background:var(--panel);color:var(--fg);border:1px solid var(--border);box-shadow:none}
  .btn.green{background:var(--green)}

  .textcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
  .en{font-family:var(--serif);color:var(--fg)}
  .passage .en{font-size:1.05rem;font-weight:600;line-height:1.55}
  .passage .jp{font-size:.82rem;color:var(--muted);margin-top:5px}
  .passage .ln{padding:9px 0;border-bottom:1px solid var(--border-soft)}
  .passage .ln:last-child{border:none}

  /* journey */
  .course-progress{display:flex;align-items:center;gap:9px}
  .course-progress .bar{flex:1;height:9px;border-radius:999px;background:var(--panel);overflow:hidden;border:1px solid var(--border)}
  .course-progress .bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s cubic-bezier(.16,1,.3,1)}
  .course-progress .n{font-size:.72rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .step{display:flex;gap:12px;padding:5px 0;align-items:flex-start}
  .rail{width:40px;flex:none;display:flex;flex-direction:column;align-items:center;position:relative}
  .node{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:1.05rem;z-index:2;
    border:1.5px solid var(--border);background:var(--card);color:var(--muted)}
  .rail .line{width:2px;flex:1;min-height:14px;background:var(--border);margin:2px 0}
  .step:last-child .line{display:none}
  .step.done .node{background:var(--green);border-color:var(--green);color:#fff}
  .step.done .line{background:var(--green)}
  .step.current .node{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
  .step.locked .node{background:var(--panel);color:var(--faint)}
  .sc{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-sm);
    display:flex;align-items:center;gap:8px;cursor:pointer;transition:transform .1s}
  .step.locked .sc{cursor:not-allowed;opacity:.65;box-shadow:none}
  .step.current .sc{border-color:var(--accent)}
  .sc.tap:hover{transform:translateX(2px)}
  .sc .sn{font-weight:800;font-size:.9rem}.sc .sd{font-size:.71rem;color:var(--muted);margin-top:1px}
  .sc .go{margin-left:auto;font-size:1.1rem;color:var(--accent);flex:none}
  .tag{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;flex:none;margin-left:auto}
  .tag.g{background:var(--green-soft);color:var(--green-ink)}.tag.lk{background:var(--panel);color:var(--faint)}

  /* quiz */
  .qhead{font-weight:800;font-size:1.05rem;line-height:1.5}
  .qhead .em{display:inline-block;background:var(--accent);color:#fff;font-family:var(--serif);font-weight:700;
    padding:1px 10px;border-radius:8px;margin:0 2px}
  .qhead .bl{display:inline-block;min-width:56px;border-bottom:2.5px dashed var(--accent);text-align:center;color:var(--accent);font-family:var(--serif)}
  .choices{display:flex;flex-direction:column;gap:9px}
  .choice{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:11px;
    padding:12px 14px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;color:var(--fg);transition:.1s}
  .choice .k{width:22px;height:22px;border-radius:6px;background:var(--panel);display:grid;place-items:center;font-size:.75rem;font-weight:800;color:var(--muted);flex:none}
  .choice.tap:hover{border-color:var(--accent);background:var(--accent-soft)}
  .choice.correct{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
  .choice.correct .k{background:var(--green);color:#fff}
  .choice.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
  .choice.wrong .k{background:var(--red);color:#fff}
  .choice:disabled{cursor:default}
  .qmeta{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .streak{display:flex;gap:5px;flex-wrap:wrap}
  .streak i{width:14px;height:14px;border-radius:50%;background:var(--panel);border:1.5px solid var(--border)}
  .streak i.on{background:var(--accent);border-color:var(--accent)}

  /* vocab card */
  .vcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow-sm)}
  .vcard .vw{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--accent)}
  .vcard .vs{font-size:.9rem;margin-top:6px;line-height:1.6}
  .vcard .vs .em{background:var(--accent);color:#fff;font-family:var(--serif);padding:1px 8px;border-radius:7px;font-weight:700}
  .vcard .vm{margin-top:8px;font-size:.85rem;font-weight:800;color:var(--green-ink);background:var(--green-soft);
    border-radius:8px;padding:7px 10px;display:none}
  .vcard.open .vm{display:block}
  .vcard .reveal{margin-top:8px;font-size:.78rem;color:var(--accent);font-weight:800;background:none;border:none;cursor:pointer;font-family:inherit;padding:0}
  .vcard.open .reveal{display:none}

  /* song */
  .player{background:linear-gradient(135deg,var(--accent),#4f46e5);border-radius:16px;padding:18px;color:#fff;text-align:center;box-shadow:var(--shadow)}
  .player .disc{font-size:2.4rem;transition:transform .3s}.player.playing .disc{animation:spin 3s linear infinite}
  .player .pt{font-weight:800;margin-top:6px}.player .pbar{height:6px;background:rgba(255,255,255,.3);border-radius:999px;margin-top:12px;overflow:hidden}
  .player .pbar>i{display:block;height:100%;width:0;background:#fff;border-radius:999px}
  .player .play{margin-top:12px;background:#fff;color:var(--accent);border:none;border-radius:999px;padding:9px 22px;font-weight:800;cursor:pointer;font-family:inherit}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* mic / shadow */
  .mic{display:flex;flex-direction:column;align-items:center;gap:10px}
  .mic .b{width:82px;height:82px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:grid;place-items:center;
    font-size:2rem;cursor:pointer;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent);position:relative}
  .mic .b.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 45%,transparent);animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(1.3);opacity:0}}
  .match{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow-sm)}
  .match .r{display:flex;justify-content:space-between;font-size:.74rem;font-weight:800;color:var(--muted)}
  .match .r b{font-size:1.2rem;color:var(--amber-ink)}
  .mbar{position:relative;height:9px;border-radius:999px;background:var(--panel);border:1px solid var(--border);margin:11px 0 6px}
  .mbar>i{display:block;height:100%;border-radius:999px;background:var(--amber);transition:width .4s}
  .mbar>s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--green)}
  .attempts{display:flex;gap:8px;justify-content:center;align-items:center}
  .attempts i{width:14px;height:14px;border-radius:50%;background:var(--panel);border:1.5px solid var(--border)}
  .attempts i.on{background:var(--accent);border-color:var(--accent)}
  .attempts .l{font-size:.68rem;font-weight:800;color:var(--muted);margin-left:3px}

  .banner{border-radius:12px;padding:11px 13px;font-size:.85rem;font-weight:800;display:flex;align-items:center;gap:8px}
  .banner.ok{background:var(--green-soft);color:var(--green-ink)}.banner.ng{background:var(--red-soft);color:var(--red-ink)}
  .banner.info{background:var(--accent-soft);color:var(--accent-dark)}
  .note{font-size:.75rem;color:var(--faint);text-align:center;line-height:1.5}
  .spacer{flex:1}

  /* overlay */
  .ovl{position:absolute;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:22px;z-index:20}
  .ovl .box{background:var(--card);border-radius:20px;padding:26px 22px;text-align:center;box-shadow:var(--shadow-lg);max-width:340px;width:100%}
  .ovl .big{font-size:3rem}.ovl h3{margin:8px 0 4px;font-size:1.3rem}.ovl p{margin:0 0 16px;color:var(--muted);font-size:.9rem}
  .confetti{font-size:1.6rem;letter-spacing:4px}
  /* youtube */
  .ytwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--border)}
  .ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  /* in-passage clickable words */
  .jpmix{font-size:1.1rem;line-height:2.5;font-weight:500;color:var(--fg)}
  .vword{font-family:var(--serif);color:var(--accent);font-weight:700;border-bottom:2px dotted var(--accent);cursor:pointer;padding:0 3px;border-radius:4px;transition:background .1s;white-space:nowrap}
  .vword:hover{background:var(--accent-soft)}
  .vword.done{color:var(--green-ink);border-bottom:none;cursor:default;background:none}
  .vword.done ruby{color:var(--green-ink)}
  .vword ruby rt{font-size:.42em;color:var(--green-ink);font-weight:800;font-family:var(--ui)}
  /* bottom sheet popup */
  .vsheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.4);z-index:30;display:flex;align-items:flex-end}
  .vsheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px 16px 20px;box-shadow:0 -12px 34px rgba(0,0,0,.25);animation:sheetup .24s cubic-bezier(.16,1,.3,1)}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
  .vsheet .vh{display:flex;align-items:center;gap:10px}
  .vsheet .vh .w{font-family:var(--serif);font-size:1.55rem;font-weight:700;color:var(--accent)}
  .vsheet .vh .spk{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);border:none;font-size:1.15rem;cursor:pointer}
  .vsheet .vq{font-size:.76rem;color:var(--muted);font-weight:800;margin:12px 0 9px}
  .choice.shake{animation:shake .3s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  /* shadowing (本サイト方式: 単語単位マッチング) */
  .shline{font-family:var(--serif);font-size:1.12rem;line-height:2.3;color:var(--fg)}
  .sh-word{padding:1px 3px;border-radius:5px;transition:background .18s,color .18s}
  .sh-word.matched{background:var(--green-soft);color:var(--green-ink);font-weight:700}
  .sh-word.auto-matched{background:var(--amber-soft);color:var(--amber-ink)}

  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

</div>

      const wrap=$('<div></div>');
      wrap.appendChild($(`<div class="qmeta"><span>お手本を追って音読</span><span>${si+1} / ${total} 文</span></div>`));
      wrap.appendChild($(`<div class="banner info">🎙️「話す」を押して声に出して読む → 認識できた単語が緑に。揃わなくても、くり返すほど合格ラインが下がります。${SR?'':'<br><b>※この環境は音声認識に未対応のため擬似モードで動作します。</b>'}</div>`));
      const card=$('<div class="textcard"></div>');
      const sent=$('<div class="shline"></div>');
      words.forEach((w,k)=>{ sent.appendChild($(`<span class="sh-word" data-k="${k}">${w}</span>`)); sent.appendChild(document.createTextNode(' ')); });
      card.appendChild(sent);
      card.appendChild($(`<div style="font-size:.8rem;color:var(--muted);margin-top:10px;border-top:1px solid var(--border-soft);padding-top:9px">${p.jp}</div>`));
      wrap.appendChild(card);
      const meter=$('<div style="display:none"></div>'); wrap.appendChild(meter);
      const listen=$('<button class="btn soft" style="margin-top:2px">🔊 お手本を聞く</button>'); listen.onclick=()=>speak(p.en); wrap.appendChild(listen);
      const speakBtn=$('<button class="btn" style="margin-top:8px">🎙️ 話す（音読する）</button>'); wrap.appendChild(speakBtn);
      const next=$('<button class="btn green" disabled style="margin-top:8px">通過してから次へ</button>');
      next.onclick=()=>{ try{rec&&rec.abort();}catch(e){} si++; if(si<total)drawSentence(); else completeStep(i); };
      wrap.appendChild(next);
      wrap.appendChild($('<div class="note">本サイト方式: 単語単位マッチング／SH_PASS_THRESHOLDS＝0.7→0.55→0.4→0.3→0.2／autoMatch。要 Chrome/Edge/Safari＋HTTPS＋マイク許可。</div>'));
      function refresh(){ sent.querySelectorAll('.sh-word').forEach((sp,k)=>{ sp.classList.toggle('matched',matched.has(k)); sp.classList.toggle('auto-matched',auto.has(k)); }); }
      function addRecognized(text){
        const set=new Set(text.split(/\s+/).map(norm).filter(Boolean));
        targ.forEach((t,k)=>{ if(matched.has(k)||!t)return; if(set.has(t) || [...set].some(r=> r.length>2 && (r.includes(t)||t.includes(r)))) matched.add(k); });
        refresh();
      }
      function evaluate(){
        const th=SH_TH[Math.min(failed,SH_TH.length-1)];
        const ratio=matched.size/words.length;
        const pass = ratio>=th || failed>=4 || matched.size>=words.length; // 5回目で必ず通過
        if(pass && matched.size<words.length){ words.forEach((_,k)=>{ if(!matched.has(k)){matched.add(k);auto.add(k);} }); refresh(); }
        meter.style.display='block';
        if(pass){ meter.className='banner ok'; meter.innerHTML=`◯ 通過！ 一致 ${Math.round(matched.size/words.length*100)}%（合格ライン ${Math.round(th*100)}%）${auto.size?'・一部は自動一致':''}`;
          speakBtn.style.display='none'; next.disabled=false; next.textContent=(si+1<total)?'次の文へ →':'完食してコース修了 →'; }
        else{ failed++; const nth=SH_TH[Math.min(failed,SH_TH.length-1)];
          meter.className='banner ng'; meter.innerHTML=`もう一度！ 一致 ${Math.round(ratio*100)}% → 次の合格ラインは <b>${Math.round(nth*100)}%</b>`; }
      }
      function setRecUI(on){ recording=on; speakBtn.classList.toggle('green',on); speakBtn.textContent=on?'⏹ 録音を止めて判定':'🎙️ もう一度 話す'; }
      function startRec(){
        settled=false; meter.style.display='none';
        try{
          rec=new SR(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=true;
          rec.onresult=(e)=>{ let txt=''; for(let j=0;j<e.results.length;j++) txt+=e.results[j][0].transcript+' '; addRecognized(txt); };
          rec.onerror=(e)=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ settled=true; setRecUI(false); meter.style.display='block'; meter.className='banner ng'; meter.innerHTML='マイクが許可されていません。ブラウザのマイク許可をONにして、もう一度お試しください。'; } };
          rec.onend=()=>{ if(settled)return; settled=true; setRecUI(false); evaluate(); };
          rec.start(); setRecUI(true);
        }catch(err){ fallbackSim(); }
      }
      function fallbackSim(){
        const cover=Math.min(words.length, Math.max(1,Math.round(words.length*(0.4+0.18*failed+Math.random()*0.18))));
        shuffle(words.map((_,k)=>k)).slice(0,cover).forEach(k=>matched.add(k)); refresh(); evaluate();
      }
      speakBtn.onclick=()=>{
        if(!SR){ fallbackSim(); return; }
        if(!recording) startRec();
        else { try{ rec&&rec.stop(); }catch(e){ setRecUI(false); if(!settled){settled=true;evaluate();} } }
      };
      render(wrap);
    }
    drawSentence();
  }

  // ---------- LESSON COMPLETE ----------
  function lessonComplete(){
    const ov=$(`<div class="ovl"><div class="box"><div class="big">🌮🎉</div><h3>コース完食！</h3>
      <p>Lesson ${curLesson} の全7品をやり切りました。次のレッスンが解放されます。</p>
      <div class="confetti">✨🎊✨</div><button class="btn" style="margin-top:14px">ホームへ戻る</button></div></div>`);
    ov.querySelector('button').onclick=()=>{ov.remove();home();};
    document.querySelector('.device').appendChild(ov);
  }

  // ---------- RUSH (飛び級) ----------
  function rush(targetId){
    targetId=targetId||(LESSONS.find(x=>!isUnlocked(x.id))||{}).id;
    const tl=LESSONS.find(x=>x.id===targetId);
    setTop('🌮 タコス厨房ラッシュ',true);backBtn.onclick=home;
    let streak=0,idx=0;const target=10;
    // weighted pick
    function pick(){const tot=RUSH_POOL.reduce((a,b)=>a+b.wt,0);let r=Math.random()*tot;for(const v of RUSH_POOL){r-=v.wt;if(r<=0)return v;}return RUSH_POOL[0];}
    function draw(){
      const v=pick();const others=shuffle(RUSH_POOL.filter(x=>x.m!==v.m)).slice(0,3).map(x=>x.m);
      const choices=shuffle([v.m,...others]);const ans=choices.indexOf(v.m);
      const wrap=$('<div></div>');
      wrap.appendChild($('<div class="banner info">これまでの全単語から連続出題。<b>直近ほど出やすい</b>／10問連続正解で飛び級！</div>'));
      wrap.appendChild($(`<div class="qmeta"><span>連続正解</span><span>${streak} / ${target}</span></div>`));
      const s=$('<div class="streak"></div>');for(let k=0;k<target;k++)s.appendChild($(`<i class="${k<streak?'on':''}"></i>`));wrap.appendChild(s);
      wrap.appendChild($(`<div class="qhead" style="margin-top:8px"><span class="em" style="font-size:1.15rem">${v.w}</span> の意味は？</div>`));
      const box=$('<div class="choices" style="margin-top:4px"></div>');let answered=false;
      choices.forEach((c,k)=>{const b=$(`<button class="choice tap"><span class="k">${'ABCD'[k]}</span>${c}</button>`);
        b.onclick=()=>{if(answered)return;answered=true;
          if(k===ans){b.classList.add('correct');streak++;setTimeout(()=>{if(streak>=target)pass();else draw();},450);}
          else{b.classList.add('wrong');[...box.children].forEach((ch,p2)=>{if(p2===ans)ch.classList.add('correct');});
            [...box.children].forEach(ch=>ch.disabled=true);
            setTimeout(()=>{wrap.appendChild($('<div class="banner ng" style="margin-top:9px">✗ 連続が途切れました。最初からやり直し。</div>'));
              const rb=$('<button class="btn" style="margin-top:8px">↺ 最初から</button>');rb.onclick=()=>{streak=0;draw();};wrap.appendChild(rb);},400);}
        };box.appendChild(b);});
      wrap.appendChild(box);render(wrap);
    }
    function pass(){STATE.skip=STATE.skip||{};if(targetId)STATE.skip[targetId]=true;save();
      const ov=$(`<div class="ovl"><div class="box"><div class="big">🌮🏃‍♂️</div><h3>飛び級 成功！</h3>
      <p>10問連続正解！ ${tl?('Lesson '+tl.id+'「'+tl.title+'」'):'次のコース'} が解放されました。</p><button class="btn" style="margin-top:14px">ホームへ</button></div></div>`);
      ov.querySelector('button').onclick=()=>{ov.remove();home();};document.querySelector('.device').appendChild(ov);}
    draw();
  }

  home();
})();
</script>
