// ===== ステージ → レッスン選択 =====
async function enterStage(stageId) {
  curStage = stageId;
  const s = STAGES.find(x => x.id === stageId);
  if (!stageData || stageData.stage !== stageId) {
    showLoading('クイズを準備中...');
    const r = await fetch(s.src + '?t=' + Date.now());
    const raw = await r.json();
    let quizzes = raw.quizzes;
    if (typeof s.sliceStart === 'number') {
      quizzes = quizzes.slice(s.sliceStart, s.sliceEnd);
    }
    stageData = { stage: stageId, quizzes };
    hideLoading();
  }
  document.getElementById('lesson-stage-name').innerText = s.name;
  renderLessons();
  switchScreen('screen-lessons');
}

function renderLessons() {
  const s = STAGES.find(x => x.id === curStage);
  const totalLessons = Math.ceil(s.total / LESSON_SIZE);
  const p = getProg(curStage);
  const lessons = p.lessons || {};
  const c = document.getElementById('lesson-list');
  let html = '';
  for (let i = 0; i < totalLessons; i++) {
    const status = lessons[i] || { phase: 'main', passed: false };
    const startIdx = i * LESSON_SIZE;
    const endIdx = Math.min(startIdx + LESSON_SIZE, s.total);
    const locked = isLessonLocked(i);
    const lockedClass = locked ? 'locked' : '';
    const passedClass = status.passed ? 'passed' : '';
    const unansweredN = unansweredCount(curStage, i);
    const phaseStr = status.passed
        ? (unansweredN > 0 ? `合格 ✓ ・ 未学習 ${unansweredN}語` : '合格 ✓')
      : locked ? '🔒 タップで昇級試験(開放)'
      : status.unlocked ? '🔓 スキップ開放済 (未合格)'
      : status.phase === 'promo' ? '昇級テスト中'
      : status.phase === 'retry' ? '復習中' : '未着手';
    html += `<div class="lesson-card ${lockedClass} ${passedClass}" onclick="openLessonMenu(${i})">
      <div class="num">${i + 1}</div>
      <div class="desc">
        <div class="label">レッスン ${i + 1} ・ ${startIdx + 1}〜${endIdx}問</div>
        <div class="info">${phaseStr}</div>
      </div>
      <div class="arrow">›</div>
    </div>`;
  }
  c.innerHTML = html;
}

// ===== レッスン開始 =====
function startLesson(lessonIdx) {
  curLesson = lessonIdx;
  const status = lessonStatus(curStage, lessonIdx);
  // 旧昇級試験フェーズ ('promo') はこのアプリ内では使わない (Kitchen Rush 専用)。
  // 保存済みフェーズは 'main' / 'retry' のみ尊重する。
  const savedPhase = status.phase === 'retry' ? 'retry' : 'main';
  // このレッスンの正規ID集合。復元キューはこの範囲内のIDのみで構成されるはず。
  // 範囲外/無効IDを含む「古い・別レッスン・壊れた」resumeQueue は破棄してフレッシュ開始する(自己修復)。
  // ← これが無いと、古いlocalStorageのキューをそのまま復元し、別レッスンの問題が出て進めなくなる。
  const lStart = lessonIdx * LESSON_SIZE;
  const lEnd = Math.min(lStart + LESSON_SIZE, stageData.quizzes.length);
  const lessonIds = new Set(stageData.quizzes.slice(lStart, lEnd).map(q => q.id));
  const validQueue = (arr) => Array.isArray(arr) && arr.length > 0 && arr.every(id => lessonIds.has(id));
  const rq = status.resumeQueue;
  // 中断状態があれば復元 (旧 promo シャッフルのキューは migrate 済み)
  if (savedPhase === 'main' && validQueue(rq) && status.resumeIndex != null && status.resumeIndex < rq.length) {
    curPhase = 'main';
    curQueue = rq;
    curIndex = status.resumeIndex;
    mainErrors = (status.resumeMainErrors || []).filter(id => lessonIds.has(id));
    retryErrors = (status.resumeRetryErrors || []).filter(id => lessonIds.has(id));
    segmentCorrect = 0;
  } else if (savedPhase === 'retry' && validQueue(status.retryQueue)) {
    curPhase = 'retry';
    curQueue = status.retryQueue;
    curIndex = 0; mainErrors = []; retryErrors = []; segmentCorrect = 0;
  } else {
    curPhase = 'main';
    curQueue = stageData.quizzes.slice(lStart, lEnd).map(q => q.id);
    mainErrors = []; retryErrors = []; curIndex = 0; segmentCorrect = 0;
  }
  // 旧昇級試験の変数は念のため必ずリセット
  promoCorrect = 0; promoTotal = 0; promoStreak = 0;
  document.getElementById('quiz-stage-name').innerText = STAGES.find(s => s.id === curStage).name + ' L' + (lessonIdx + 1);
  switchScreen('screen-quiz');
  renderQuiz();
}

// ===== クイズ描画 =====
function findQuiz(qid) { return stageData.quizzes.find(q => q.id === qid); }

function rubyHTML(text) {
  if (!text) return '';
  let s = text;
  s = s.replace(/<([^>]+)>/g, (m, w) => `<span class="embed">${escapeHtml(w)}</span>`);
  s = s.replace(/｜([^《》｜]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
  s = s.replace(/([一-龥々〆ヶ]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
  return s;
}
// ルビ展開のみを行う（<word> マーカーは触らない）。
// maskWordTag() で先に <word> を <span> へ置換した文字列を rubyHTML() に通すと、
// rubyHTML 内の <([^>]+)> 正規表現が span タグ自身を巻き込み、結果として
// span 全体がテキストとして表示されてしまう（昇級テストの選択肢で発生していた）。
function rubyOnly(text) {
  if (!text) return '';
  let s = text;
  s = s.replace(/｜([^《》｜]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
  s = s.replace(/([一-龥々〆ヶ]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
  return s;
}
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 回答後フィードバック: 全画面フロートモーダル制御。
// 元のクイズ画面を完全に覆い、左上に単語 / 中央に選択肢4つ (○/✗マーク付き) /
// 意味 / 解説 / 次へ を一画面に集約する。視線移動を最小にする狙い。
function showFeedback(opts) {
  const ov = document.getElementById('answer-overlay');
  document.getElementById('ao-word').textContent = opts.word || '';
  const v = document.getElementById('ao-verdict');
  v.innerHTML = (opts.verdictLabel || '')
    + (opts.elapsed != null ? ` <span class="elapsed">(${opts.elapsed.toFixed(1)}秒)</span>` : '');
  v.className = 'ao-verdict ' + (opts.verdictKind || '');
  document.getElementById('ao-meaning').innerHTML =
    `<span class="label">意味</span><b>${escapeHtml(opts.word || '')}</b> = ${escapeHtml(opts.meaning || '')}`;
  document.getElementById('ao-choices').innerHTML = (opts.choices || []).map(c =>
    `<div class="ao-choice ${c.kind || ''}">
      <span class="mark">${c.mark}</span>
      <span class="text">${c.text}</span>
      <span class="marker">${c.kind === 'correct' ? '○' : (c.kind === 'wrong' ? '×' : '')}</span>
    </div>`
  ).join('');
  const e = document.getElementById('ao-explanation');
  e.innerHTML = opts.explanation || '';
  e.style.display = opts.explanation ? '' : 'none';
  ov.classList.add('show');
  ov.setAttribute('aria-hidden', 'false');
}
function hideFeedback() {
  const ov = document.getElementById('answer-overlay');
  ov.classList.remove('show');
  ov.setAttribute('aria-hidden', 'true');
}
// モーダルに渡す choices リストを作る (main/retry/promo 共通)。
function buildOverlayChoices(q, correctIdx, selectedIdx) {
  let texts;
  if (curPhase === 'promo') {
    // promo は事前に rubyOnly(maskWordTag(...)) 済みの HTML が __promoChoices に並んでいる
    texts = q.__promoChoices || [];
  } else {
    const src = q.choices_ruby || q.choices || [];
    const order = q.__renderOrder || [0, 1, 2, 3];
    texts = order.map(o => rubyHTML(src[o]));
  }
  return texts.map((t, i) => ({
    mark: 'ABCD'[i],
    text: t,
    kind: i === correctIdx ? 'correct' : (i === selectedIdx ? 'wrong' : '')
  }));
}

function renderQuiz() {
  answered = false;
  // 防御: 無効ID(古い/壊れたキュー)はスキップ。通常は startLesson の検証で発生しないが、
  // すり抜けても q が undefined で例外→画面ブランク/音声なし/進行不能 になるのを防ぐ。
  while (curIndex < curQueue.length && !findQuiz(curQueue[curIndex])) curIndex++;
  if (curIndex >= curQueue.length) {
    onPhaseComplete();
    return;
  }
  const qid = curQueue[curIndex];
  const q = findQuiz(qid);
  if (curPhase === 'promo') {
    document.getElementById('quiz-progress').innerText = `連続正解 ${promoStreak} / ${PROMO_PASS_STREAK}`;
    document.getElementById('progress-fill').style.width = Math.round(promoStreak * 100 / PROMO_PASS_STREAK) + '%';
    document.getElementById('q-counter').innerHTML = '';
  } else {
    // 表示は CHECK_INTERVAL ごとの「一区切り」内の進捗。一区切りで休憩できるため、
    // 1〜10/10 を出した方が「あと何問でひと区切りか」がわかりやすい。
    const segStart = Math.floor(curIndex / CHECK_INTERVAL) * CHECK_INTERVAL;
    const segSize = Math.min(CHECK_INTERVAL, curQueue.length - segStart);
    const posInSeg = (curIndex - segStart) + 1;
    const remainInSeg = segSize - posInSeg;
    // topbar progress (全体に対する%表示)
    document.getElementById('quiz-progress').innerText = `${curIndex + 1} / ${curQueue.length}`;
    document.getElementById('progress-fill').style.width = Math.round(curIndex * 100 / curQueue.length) + '%';
    // qcard 上部の大型表示 (一区切りベース)
    const remainClass = remainInSeg === 0 ? 'remain zero' : 'remain';
    const remainText = remainInSeg === 0
      ? '🎉 区切りまであと0問!'
      : `区切りまであと ${remainInSeg} 問`;
    document.getElementById('q-counter').innerHTML =
      `<span class="pos">問 <span class="num">${posInSeg}</span> / ${segSize}</span>` +
      `<span class="${remainClass}">${remainText}</span>`;
  }
  const phaseTag = document.getElementById('phase-tag');
  if (curPhase === 'main') { phaseTag.className = 'phase-tag'; phaseTag.innerText = '本編'; }
  else if (curPhase === 'retry') { phaseTag.className = 'phase-tag retry'; phaseTag.innerText = '復習'; }
  else { phaseTag.className = 'phase-tag promo'; phaseTag.innerText = '昇級'; }

  // promo フェーズ: 文脈マッチング(単語+意味から ふさわしいbody抜粋を選ぶ)
  const body = document.getElementById('qbody');
  // qcard 側に promo-mode を付け外しして、単語バッジを固定 + 選択肢を内部スクロールに切り替える
  body.parentElement.classList.toggle('promo-mode', curPhase === 'promo');
  if (curPhase === 'promo') {
    body.classList.add('simple');
    // 昇級テストは意味なしで単語だけ提示。レイアウトは正誤モーダル (.ao-header) と
    // 同じ横並びコンパクト構成で、選択肢エリアに高さを譲る。
    body.innerHTML = `<div class="promo-prompt">
      <span class="embed">${escapeHtml(q.word)}</span>
      <div class="promo-hint">この単語が自然に入る文は?</div>
    </div>`;
    // 4つのbodyから選ぶ: 正解=自分のbody、不正解3=同ステージから別のクイズ
    // maskWordTag は <word> マーカーを span に置換するので、その後はルビ展開のみを
    // 行う rubyOnly を通す（rubyHTML を通すと置換済みの span タグごと再エスケープしてしまう）。
    const correctBody = rubyOnly(maskWordTag(q.body_ruby || q.body, q.word));
    const distractors = pickDistractorBodies(q.id, 3).map(d => rubyOnly(maskWordTag(d.body_ruby || d.body, d.word)));
    const all = [correctBody, ...distractors];
    const target = Math.floor(Math.random() * 4);
    // 正解を target位置に
    [all[0], all[target]] = [all[target], all[0]];
    q.__promoChoices = all;
    q.__promoCorrectIdx = target;
    document.getElementById('choices').innerHTML = all.map((c, i) =>
      `<button class="choice" data-idx="${i}" onclick="selectChoice(${i})" style="font-size:0.9rem;line-height:1.6">
        <span class="mark">${'ABCD'[i]}</span><span class="text">${c}</span><span class="marker"></span>
      </button>`
    ).join('');
  } else {
    body.classList.remove('simple');
    // 同じ単語に複数の日本語混じり文(alt_bodies)があれば、出題ごとにランダムで1つ選ぶ。
    // 同じ語を別々の文脈で繰り返し見ることで、偶発的な学習(incidental learning)を促す。
    // alt_bodies_ruby(ふりがな付き)を優先、無ければ alt_bodies(素)を使う。alt無しの語は従来通り。
    const bodyVariants = [q.body_ruby || q.body];
    const altR = q.alt_bodies_ruby || [], altP = q.alt_bodies || [];
    for (let i = 0; i < Math.max(altR.length, altP.length); i++) {
      const v = altR[i] || altP[i];
      if (v) bodyVariants.push(v);
    }
    body.innerHTML = rubyHTML(bodyVariants[Math.floor(Math.random() * bodyVariants.length)]);
    // choices をシャッフル: 表示位置 → 元 index のマップ
    const srcChoices = q.choices_ruby || q.choices;
    const order = shuffle([0, 1, 2, 3]);
    q.__renderOrder = order;
    q.__displayCorrectIdx = order.indexOf(q.correct_index);
    document.getElementById('choices').innerHTML = order.map((origIdx, i) =>
      `<button class="choice" data-idx="${i}" onclick="selectChoice(${i})">
        <span class="mark">${'ABCD'[i]}</span><span class="text">${rubyHTML(srcChoices[origIdx])}</span><span class="marker"></span>
      </button>`
    ).join('');
  }
  document.getElementById('play-en-btn').onclick = () => playEnWord(curStage, q.word);

  // 新しい問題に進む際は前回フィードバックモーダルを閉じる。
  hideFeedback();

  // 自動で英単語発音
  setTimeout(() => playEnWord(curStage, q.word), 200);
  // タイマー開始
  startTimer();
}

function maskWordTag(text, word) {
  return (text || '').replace(`<${word}>`, '<span class="embed" style="background:var(--ink);min-width:60px;display:inline-block;text-align:center">____</span>');
}

function pickDistractorBodies(excludeId, n) {
  const pool = stageData.quizzes.filter(q => q.id !== excludeId);
  const out = [];
  const used = new Set();
  while (out.length < n && pool.length > 0) {
    const i = Math.floor(Math.random() * pool.length);
    if (used.has(i)) continue;
    used.add(i);
    out.push(pool[i]);
    if (used.size >= pool.length) break;
  }
  return out;
}

function startTimer() {
  stopTimer();
  startTime = Date.now();
  const limit = currentTimeLimit();
  const bar = document.getElementById('timer-bar');
  bar.style.width = '100%';
  bar.classList.remove('danger');
  let elapsed = 0;
  timerId = setInterval(() => {
    elapsed += 0.1;
    const remaining = Math.max(0, limit - elapsed);
    const frac = remaining / limit;
    bar.style.width = (frac * 100) + '%';
    if (frac <= 0.3) bar.classList.add('danger');
    if (remaining <= 0) {
      stopTimer();
      if (!answered) onTimeUp();
    }
  }, 100);
}
function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
}
function onTimeUp() {
  if (answered) return;
  answered = true;
  const q = findQuiz(curQueue[curIndex]);
  const correctIdx = curPhase === 'promo' ? q.__promoCorrectIdx : (q.__displayCorrectIdx ?? q.correct_index);
  if (curPhase === 'main') mainErrors.push(q.id);
  else if (curPhase === 'retry') retryErrors.push(q.id);
  if (curPhase === 'promo') { promoTotal++; promoStreak = 0; }
  if (curPhase === 'main' || curPhase === 'retry') {
    recordVerdict(curStage, curLesson, q.id, 'wrong');
  }
  saveResumeState();
  // 正解を表示
  const btns = document.querySelectorAll('.choice');
  btns.forEach((b, i) => {
    b.disabled = true;
    const marker = b.querySelector('.marker');
    if (i === correctIdx) { b.classList.add('correct'); if (marker) marker.innerText = '○'; }
  });
  playSE('wrong');
  showVerdict('timeup');
  showFeedback({
    word: q.word,
    meaning: q.meaning_jp,
    verdictLabel: '⏰ 時間切れ',
    verdictKind: 'wrong',
    choices: buildOverlayChoices(q, correctIdx, -1),
    explanation: q.explanation && curPhase !== 'promo' ? rubyHTML(q.explanation_ruby || q.explanation) : ''
  });
}

function selectChoice(idx) {
  if (answered) return;
  answered = true;
  stopTimer();
  const elapsed = (Date.now() - startTime) / 1000;
  const ratio = elapsed / currentTimeLimit();
  const q = findQuiz(curQueue[curIndex]);
  const correctIdx = curPhase === 'promo' ? q.__promoCorrectIdx : (q.__displayCorrectIdx ?? q.correct_index);
  const correct = idx === correctIdx;
  if (correct) segmentCorrect++;
  if (curPhase === 'promo') {
    promoTotal++;
    if (correct) { promoCorrect++; promoStreak++; } else { promoStreak = 0; }
  }
  if (!correct) {
    if (curPhase === 'main') mainErrors.push(q.id);
    else if (curPhase === 'retry') retryErrors.push(q.id);
  }
  // 評価判定
  let verdict;
  if (!correct) verdict = 'wrong';
  else if (ratio <= TACOS_THRESHOLD) verdict = 'tacos';
  else if (ratio <= EXCELLENT_THRESHOLD) verdict = 'excellent';
  else verdict = 'good';
  // verdict履歴を保存 (本編・復習中のみ。promoは別途)
  if (curPhase === 'main' || curPhase === 'retry') {
    recordVerdict(curStage, curLesson, q.id, verdict);
  }
  saveResumeState();
  const btns = document.querySelectorAll('.choice');
  btns.forEach((b, i) => {
    b.disabled = true;
    const marker = b.querySelector('.marker');
    if (i === correctIdx) { b.classList.add('correct'); if (marker) marker.innerText = '○'; }
    else if (i === idx) { b.classList.add('wrong'); if (marker) marker.innerText = '×'; }
  });
  playSE(correct ? 'correct' : 'wrong');
  showVerdict(verdict);
  const labelMap = { tacos: '🌮 Tacos!', excellent: '🌟 Excellent!', good: '👍 Good!', wrong: '✖️ もう一度' };
  showFeedback({
    word: q.word,
    meaning: q.meaning_jp,
    verdictLabel: labelMap[verdict],
    verdictKind: correct ? 'correct' : 'wrong',
    elapsed,
    choices: buildOverlayChoices(q, correctIdx, idx),
    explanation: q.explanation && curPhase !== 'promo' ? rubyHTML(q.explanation_ruby || q.explanation) : ''
  });
}

document.getElementById('next-btn').onclick = () => {
  hideFeedback();
  // 昇級テスト: 10連続正解達成 → 即合格へ
  if (curPhase === 'promo' && promoStreak >= PROMO_PASS_STREAK) {
    onPhaseComplete();
    return;
  }
  curIndex++;
  // 昇級テスト: キューが尽きたらレッスン100語を再シャッフルして継続
  if (curPhase === 'promo' && curIndex >= curQueue.length) {
    const startIdx = curLesson * LESSON_SIZE;
    const endIdx = Math.min(startIdx + LESSON_SIZE, stageData.quizzes.length);
    const ids = stageData.quizzes.slice(startIdx, endIdx).map(q => q.id);
    curQueue = shuffle(ids);
    curIndex = 0;
  }
  // curIndex増加後の進行位置を保存(チェックポイント中に終了されても次の問から再開する)
  saveResumeState();
  // 10問ごとチェック (main/retryのみ)
  if (curPhase !== 'promo' && curIndex > 0 && curIndex % CHECK_INTERVAL === 0 && curIndex < curQueue.length) {
    showCheckpoint();
    return;
  }
  renderQuiz();
};

function showVerdict(kind) {
  // kind: 'fantastic' | 'good' | 'ok' | 'wrong' | 'timeup'
  const ov = document.getElementById('overlay-mark');
  const sym = document.getElementById('overlay-symbol');
  const cfg = {
    tacos: { text: 'Tacos!', mode: 'text-mode' },
    excellent: { text: 'Excellent!', mode: 'text-mode' },
    good: { text: 'Good!', mode: 'text-mode' },
    wrong: { text: '✖️', mode: 'symbol-mode' },
    timeup: { text: '✖️', mode: 'symbol-mode' },
  };
  const c = cfg[kind] || cfg.wrong;
  sym.innerText = c.text;
  ov.className = 'overlay-mark show ' + c.mode;
  setTimeout(() => { ov.className = 'overlay-mark'; }, 700);
}

function showCheckpoint() {
  playSE('checkpoint');
  // 直近 CHECK_INTERVAL 問のverdictから実数集計 (resume後でも正確に)
  const verdicts = lessonVerdicts(curStage, curLesson);
  const recentIds = curQueue.slice(Math.max(0, curIndex - CHECK_INTERVAL), curIndex);
  let recentCorrect = 0;
  for (const qid of recentIds) {
    const v = verdicts[qid];
    if (v && v !== 'wrong') recentCorrect++;
  }
  const denom = recentIds.length || CHECK_INTERVAL;
  const rate = Math.round(recentCorrect * 100 / denom);
  const praise = getPraise(rate);
  const emotion =
    rate >= 100 ? 'cheering' :
    rate >= 90  ? 'grinning' :
    rate >= 70  ? 'speaking' :
    rate >= 50  ? 'encouraging' :
                  'cheering_warm';
  // 100問単位の習得度
  const bd = verdictBreakdown(curStage, curLesson);
  const data = ['tacos','excellent','good','wrong','unanswered'].map(k => ({
    label: VERDICT_LABELS[k], count: bd.counts[k], color: VERDICT_COLORS[k]
  }));
  const chart = pieChartSVG(data, 160);
  const legend = data.filter(d => d.count > 0).map(d =>
    `<span style="display:inline-flex;align-items:center;gap:4px;margin:0 6px;font-size:0.75rem">
       <span style="width:10px;height:10px;background:${d.color};border-radius:2px;display:inline-block"></span>
       ${d.label} <b>${d.count}</b>
     </span>`
  ).join('');
  const extra = `
    <div style="font-size:0.78rem;color:var(--sub);margin:8px 0 4px">レッスン ${curLesson+1} の習得度 (全 ${bd.total} 問)</div>
    ${chart}
    <div style="margin:8px 0;line-height:1.8">${legend}</div>
  `;
  showModal({
    emotion,
    title: `${CHECK_INTERVAL}問完了`,
    praise,
    rate: rate + '%',
    sub: `直近 ${denom} 問中 ${recentCorrect} 問正解`,
    extra,
    actions: [
      { label: '続ける →', onclick: () => { segmentCorrect = 0; closeModal(); renderQuiz(); } },
      { label: '戻る', secondary: true, onclick: () => { closeModal(); quitToLessons(); } },
    ],
  });
}

function onPhaseComplete() {
  if (curPhase === 'main') {
    // 進捗保存
    if (mainErrors.length > 0) {
      // retry phaseへ
      curPhase = 'retry';
      curQueue = [...mainErrors];
      mainErrors = [];
      retryErrors = [];
      curIndex = 0;
      segmentCorrect = 0;
      setLessonStatus(curStage, curLesson, { phase: 'retry', retryQueue: curQueue });
      showModal({
        emotion: 'speaking',
        title: '本編クリア!',
        praise: '間違えた問題をもう一度。',
        sub: `${curQueue.length} 問を復習します`,
        actions: [{ label: '復習スタート', onclick: () => { closeModal(); renderQuiz(); } }],
      });
    } else {
      // 本編完了 (間違いゼロ) → 3択: 昇級試験 / 苦手だけ / 全体練習
      const weakCount = weakWordIds(curStage, curLesson).length;
      const actions = [
        { label: '昇級試験へ', onclick: () => { closeModal(); goPromo(); } },
      ];
      if (weakCount > 0) {
        actions.push({ label: `苦手だけ練習 (${weakCount}語)`, secondary: true, onclick: () => { closeModal(); startWeakPractice(); } });
      }
      actions.push({ label: '全体練習(100問)', secondary: true, onclick: () => { closeModal(); startLesson(curLesson); } });
      showModal({
        emotion: 'proud',
        title: '本編 完了!',
        praise: '全問正解で本編クリア',
        sub: '次にしたいことを選んでください',
        actions,
      });
    }
  } else if (curPhase === 'retry') {
    if (retryErrors.length > 0) {
      // まだ間違いがあれば 再度retry
      curQueue = [...retryErrors];
      retryErrors = [];
      curIndex = 0;
      segmentCorrect = 0;
      setLessonStatus(curStage, curLesson, { phase: 'retry', retryQueue: curQueue });
      showModal({
        emotion: 'thinking',
        title: 'もう一度復習',
        praise: '繰り返し定着!',
        sub: `${curQueue.length} 問残っています`,
        actions: [{ label: '続ける', onclick: () => { closeModal(); renderQuiz(); } }],
      });
    } else {
      // 復習クリア → 3択: 昇級試験 / 苦手だけ / 全体練習
      const weakCount = weakWordIds(curStage, curLesson).length;
      const actions = [
        { label: '昇級試験へ', onclick: () => { closeModal(); goPromo(); } },
      ];
      if (weakCount > 0) {
        actions.push({ label: `苦手だけ練習 (${weakCount}語)`, secondary: true, onclick: () => { closeModal(); startWeakPractice(); } });
      }
      actions.push({ label: '全体練習(100問)', secondary: true, onclick: () => { closeModal(); startLesson(curLesson); } });
      showModal({
        emotion: 'proud',
        title: '復習 クリア!',
        praise: '間違いがなくなりました',
        sub: '次にしたいことを選んでください',
        actions,
      });
    }
  } else if (curPhase === 'promo') {
    // 昇級テスト: 10連続正解達成で合格 (next-btn からのみ到達する)
    playSE('victory', 0.9);
    setLessonStatus(curStage, curLesson, { phase: 'main', passed: true, promoRate: 100, resumeQueue: null, resumeIndex: null, resumeMainErrors: null, resumeRetryErrors: null });
    try { if (window.gasflare) { var _s = STAGES.find(function (x) { return x.id === curStage; });
      gasflare.log(curStage + '.L' + (curLesson + 1), (_s ? _s.name : curStage) + ' L' + (curLesson + 1), '✅ レッスン合格'); } } catch (e) { }
    showModal({
      emotion: 'cheering',
      title: `レッスン ${curLesson + 1} 合格!`,
      praise: `${PROMO_PASS_STREAK}連続正解で昇級テスト突破!`,
      sub: '次のレッスンへ進めます',
      actions: [
        { label: '次のレッスンへ', onclick: () => { closeModal(); curLesson++; if (curLesson * LESSON_SIZE < stageData.quizzes.length) startLesson(curLesson); else quitToLessons(); } },
        { label: 'レッスン一覧へ', secondary: true, onclick: () => { closeModal(); quitToLessons(); } },
      ],
    });
  }
}

// レッスンが鍵付きかどうか
// - lesson 0 は常に開放
// - status.passed (本編合格) または status.unlocked (スキップで解放) なら鍵なし
// - verdicts に何か記録があれば(=触ったことがある)鍵なし
// - 前のレッスンが passed なら鍵なし
function isLessonLocked(lessonIdx) {
  if (lessonIdx <= 0) return false;
  const p = getProg(curStage);
  const lessons = p.lessons || {};
  const status = lessons[lessonIdx] || {};
  if (status.passed || status.unlocked) return false;
  const hasProgress = status.verdicts && Object.keys(status.verdicts).length > 0;
  if (hasProgress) return false;
  const prev = lessons[lessonIdx - 1] || {};
  return !prev.passed;
}

// レッスンの未学習(verdict 無し)単語数
function unansweredCount(stage, lessonIdx) {
  const verdicts = lessonVerdicts(stage, lessonIdx);
  const startIdx = lessonIdx * LESSON_SIZE;
  const endIdx = Math.min(startIdx + LESSON_SIZE, stageData.quizzes.length);
  let n = 0;
  for (let i = startIdx; i < endIdx; i++) {
    if (!verdicts[stageData.quizzes[i].id]) n++;
  }
  return n;
}

// good/wrong (excellent/tacos 未満) の単語数 (未学習は除く)
function goodOrWorseCount(stage, lessonIdx) {
  const verdicts = lessonVerdicts(stage, lessonIdx);
  const startIdx = lessonIdx * LESSON_SIZE;
  const endIdx = Math.min(startIdx + LESSON_SIZE, stageData.quizzes.length);
  let n = 0;
  for (let i = startIdx; i < endIdx; i++) {
    const v = verdicts[stageData.quizzes[i].id];
    if (v === 'good' || v === 'wrong') n++;
  }
  return n;
}

// レッスン選択時の選択肢モーダル: 鍵付き / 未合格 / 合格 で異なる選択を提示
function openLessonMenu(lessonIdx) {
  const status = lessonStatus(curStage, lessonIdx);
  const locked = isLessonLocked(lessonIdx);
  const passed = !!status.passed;
  const stageName = STAGES.find(s => s.id === curStage).name;

  // === 鍵付き ===
  if (locked) {
    showModal({
      emotion: 'speaking',
      title: '🔒 鍵付きレッスン',
      praise: `レッスン ${lessonIdx + 1} はまだ開放されていません`,
      sub: `前のレッスン (L${lessonIdx}) の昇級試験に合格すると開放されます (前レッスンは合格扱いにはなりません)`,
      actions: [
        { label: `L${lessonIdx} の昇級試験を受けて開放`, onclick: () => {
          closeModal();
          // スキップ開放モード: lesson=N-1 の昇級試験を受けて、target=N を unlocked にする
          const params = new URLSearchParams({
            stage: curStage,
            lesson: lessonIdx - 1,
            mode: 'skip',
            target: lessonIdx,
          });
          window.location.href = `kitchen_rush_prototype.html?${params}`;
        }},
        { label: '戻る', secondary: true, onclick: () => closeModal() },
      ],
    });
    return;
  }

  const weakIds = weakWordIds(curStage, lessonIdx);
  const weak = goodOrWorseCount(curStage, lessonIdx);
  const unanswered = unansweredCount(curStage, lessonIdx);

  // === 合格済み: 続きから学習 (未学習が残っていれば) / 全単語復習 / 苦手のみ復習 / 昇級試験再挑戦 ===
  if (passed) {
    const actions = [];
    // 昇級試験合格後でも未学習があれば未学習だけ学習できるようにする (passed状態は維持)
    if (unanswered > 0) {
      actions.push({ label: `続きから学習 (未学習 ${unanswered}語)`, onclick: () => {
        closeModal();
        curLesson = lessonIdx;
        startUnansweredPractice();
      }});
    }
    actions.push({ label: '全単語復習 (100問)', secondary: unanswered > 0, onclick: () => {
      closeModal();
      curLesson = lessonIdx;
      // 進捗をリセットして頭からやり直し
      setLessonStatus(curStage, lessonIdx, { resumeQueue: null, resumeIndex: null, resumeMainErrors: null, resumeRetryErrors: null, phase: 'main' });
      startLesson(lessonIdx);
    }});
    if (weak > 0) {
      actions.push({ label: `苦手のみ復習 (${weak}語)`, secondary: true, onclick: () => {
        closeModal();
        curLesson = lessonIdx;
        startWeakPractice();
      }});
    } else {
      actions.push({ label: '苦手のみ復習 (0語)', secondary: true, disabled: true });
    }
    actions.push({ label: '昇級試験に再挑戦 (タコス厨房ラッシュ)', secondary: true, onclick: () => {
      closeModal();
      curLesson = lessonIdx;
      goPromo();
    }});
    actions.push({ label: '戻る', secondary: true, onclick: () => closeModal() });
    showModal({
      emotion: 'proud',
      title: `レッスン ${lessonIdx + 1} ・ 合格済`,
      praise: unanswered > 0 ? `未学習が ${unanswered}語 残っています` : '復習で定着を確かなものに',
      sub: `${stageName} L${lessonIdx + 1}`,
      actions,
    });
    return;
  }

  // === 未合格: 続きから学習 / 苦手を学習 / 昇級試験 ===
  // 昇級試験はいつでも挑戦可能 (Kitchen Rush 自体が10問の独立ミニゲームなので前提条件なし)
  const actions = [
    { label: `続きから学習 (未学習 ${unanswered}語)`, onclick: () => {
      closeModal();
      curLesson = lessonIdx;
      startLesson(lessonIdx);
    }},
  ];
  if (weak > 0) {
    actions.push({ label: `苦手を学習 (${weak}語)`, secondary: true, onclick: () => {
      closeModal();
      curLesson = lessonIdx;
      startWeakPractice();
    }});
  } else {
    actions.push({ label: '苦手を学習 (0語)', secondary: true, disabled: true });
  }
  actions.push({ label: '昇級試験 (タコス厨房ラッシュ)', secondary: true, onclick: () => {
    closeModal();
    curLesson = lessonIdx;
    goPromo();
  }});
  actions.push({ label: '戻る', secondary: true, onclick: () => closeModal() });
  showModal({
    emotion: 'speaking',
    title: `レッスン ${lessonIdx + 1}`,
    praise: `${stageName} の100語`,
    sub: '次にしたいことを選んでください',
    actions,
  });
}

// レッスン100語のうち「good 以下」(good/wrong/未回答) の単語IDだけを返す
function weakWordIds(stage, lessonIdx) {
  const verdicts = lessonVerdicts(stage, lessonIdx);
  const startIdx = lessonIdx * LESSON_SIZE;
  const endIdx = Math.min(startIdx + LESSON_SIZE, stageData.quizzes.length);
  const ids = [];
  for (let i = startIdx; i < endIdx; i++) {
    const qid = stageData.quizzes[i].id;
    const v = verdicts[qid];
    if (!v || v === 'good' || v === 'wrong' || v === 'unanswered') ids.push(qid);
  }
  return ids;
}

// 未学習だけ練習: 一度も verdict が付いていない単語だけをキューに差し込む
function startUnansweredPractice() {
  const verdicts = lessonVerdicts(curStage, curLesson);
  const startIdx = curLesson * LESSON_SIZE;
  const endIdx = Math.min(startIdx + LESSON_SIZE, stageData.quizzes.length);
  const ids = [];
  for (let i = startIdx; i < endIdx; i++) {
    const qid = stageData.quizzes[i].id;
    if (!verdicts[qid]) ids.push(qid);
  }
  if (ids.length === 0) {
    alert('未学習はありません!');
    return;
  }
  curPhase = 'main';
  curQueue = shuffle(ids);
  curIndex = 0; mainErrors = []; retryErrors = []; segmentCorrect = 0;
  setLessonStatus(curStage, curLesson, { phase: 'main', resumeQueue: curQueue, resumeIndex: 0, resumeMainErrors: [], resumeRetryErrors: [] });
  document.getElementById('quiz-stage-name').innerText =
    STAGES.find(s => s.id === curStage).name + ' L' + (curLesson + 1) + ' 未学習';
  switchScreen('screen-quiz');
  renderQuiz();
}

// 苦手だけ練習: weakWordIds を main phase のキューに差し込んで再開
function startWeakPractice() {
  const weakIds = weakWordIds(curStage, curLesson);
  if (weakIds.length === 0) {
    alert('すべて Excellent 以上で苦手はありません!');
    return;
  }
  curPhase = 'main';
  curQueue = shuffle(weakIds);
  curIndex = 0; mainErrors = []; retryErrors = []; segmentCorrect = 0;
  setLessonStatus(curStage, curLesson, { phase: 'main', resumeQueue: curQueue, resumeIndex: 0, resumeMainErrors: [], resumeRetryErrors: [] });
  document.getElementById('quiz-stage-name').innerText =
    STAGES.find(s => s.id === curStage).name + ' L' + (curLesson + 1) + ' 苦手練習';
  switchScreen('screen-quiz');
  renderQuiz();
}

function goPromo() {
  // 昇級試験 = タコス厨房ラッシュ ミニゲーム
  // 現在の stage/lesson を引数で渡し、合格時に localStorage 経由で本体側を更新して戻る
  const params = new URLSearchParams({ stage: curStage, lesson: curLesson });
  window.location.href = `kitchen_rush_prototype.html?${params}`;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showModal({ emotion, title, praise, rate, sub, extra, actions }) {
  setMascot('modal-mascot', emotion || 'speaking');
  animateMascot('modal-mascot', 'pop', 500);
  document.getElementById('modal-title').innerText = title || '';
  document.getElementById('modal-praise').innerText = praise || '';
  document.getElementById('modal-rate').innerText = rate || '';
  document.getElementById('modal-sub').innerText = sub || '';
  const extraEl = document.getElementById('modal-extra');
  if (extraEl) extraEl.innerHTML = extra || '';
  const ac = document.getElementById('modal-actions');
  ac.innerHTML = '';
  (actions || []).forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn' + (a.secondary ? ' secondary' : '') + (a.disabled ? ' disabled' : '');
    b.innerText = a.label;
    if (a.disabled) { b.disabled = true; b.style.opacity = '0.4'; b.style.cursor = 'not-allowed'; }
    else b.onclick = a.onclick;
    ac.appendChild(b);
  });
  document.getElementById('modal-bg').classList.add('active');
}
function closeModal() { document.getElementById('modal-bg').classList.remove('active'); }

function quitToLessons() { renderLessons(); switchScreen('screen-lessons'); }
function goHome() { renderHome(); switchScreen('screen-stages'); }
function backToStart() { switchScreen('screen-start'); }

const TAB_SCREENS = ['screen-stages', 'screen-review', 'screen-stats', 'screen-settings'];
function switchScreen(id) {
  // クイズ画面に入る瞬間に BGM を止める (学習中は無音)。逆にレベル/レッスン選択画面など
  // 学習以外に戻ったら、ユーザーが mute していなければ自動で再開する。
  const bgm = document.getElementById('bgm');
  if (bgm) {
    if (id === 'screen-quiz') {
      bgm.pause();
    } else if (!bgm.muted) {
      bgm.play().catch(() => {});
    }
  }
  // クイズ画面から離れる時はタイマーを停止する。
  // これがないと、戻るボタンで一覧へ戻った後もタイマーが裏で走り続け、
  // 時間切れに達した瞬間に直前の問題が ✖ 扱いで記録されてしまう。
  if (id !== 'screen-quiz') stopTimer();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // タブ表示状態を同期 (タイトル画面・クイズ画面では非表示)
  const showTabs = TAB_SCREENS.includes(id) || id === 'screen-lessons';
  document.body.classList.toggle('has-tabs', showTabs);
  document.querySelectorAll('.tab-btn').forEach(b => {
    const t = b.dataset.tab;
    b.classList.toggle('active', t === id || (id === 'screen-lessons' && t === 'screen-stages'));
  });
  window.scrollTo(0, 0);
}

function playEnWord(stage, word) {
  const audioStage = (STAGES.find(s => s.id === stage)?.audioStage) || stage;
  const url = `app_audio/${audioStage}_en/${encodeURIComponent(word)}.mp3`;
  const a = new Audio(url);
  a.play().catch(() => {});
}

// SE
const SE_CACHE = {};
function playSE(name, vol = 0.7) {
  try {
    let a = SE_CACHE[name];
    if (!a) {
      a = new Audio('app_assets/sounds/' + name + '.mp3');
      a.volume = vol;
      SE_CACHE[name] = a;
    }
    a.currentTime = 0;
    a.play().catch(() => {});
  } catch (e) {}
}

// ふりがな表示トグル (右上フロート)。状態は localStorage に永続化。
(function setupRubyToggle(){
  const btn = document.getElementById('ruby-toggle-btn');
  if (!btn) return;
  const savedRuby = localStorage.getItem('wt_show_ruby') === '1';

// Suno で生成した wordtacos のテーマ。ループ再生。ミュート状態は localStorage に保存。
// iOS / Safari の autoplay policy 上、最初のユーザータップ後にしか .play() できないので
// start-btn と body 全体 (1回限り) でフェイルセーフに start を仕掛ける。
(function setupBGM(){
  const KEY_BGM = 'wt_bgm_muted';
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('bgm-toggle');
  if (!bgm || !btn) return;
  bgm.volume = 0.35;
  const isMuted = () => localStorage.getItem(KEY_BGM) === '1';
  const render = () => {
    btn.classList.toggle('muted', isMuted());
    btn.textContent = isMuted() ? '🔇' : '🎵';
    btn.setAttribute('aria-label', isMuted() ? 'BGM ミュート中 (タップで再生)' : 'BGM 再生中 (タップでミュート)');
  };
  bgm.muted = isMuted();
  render();
  window.startBGM = function startBGM(){
    if (isMuted()) return;
    if (bgm.paused) { try { bgm.play().catch(()=>{}); } catch(_){} }
  };
  btn.onclick = () => {
    const nowMuted = !isMuted();
    localStorage.setItem(KEY_BGM, nowMuted ? '1' : '0');
    bgm.muted = nowMuted;
    if (!nowMuted) window.startBGM();
    render();
  };
  // 念のため body 全体への最初のタップでも start を試す (start-btn 以外の経路で進んだ場合)
  document.addEventListener('pointerdown', () => window.startBGM(), { once: true, passive: true });
})();

// ===== 連続学習日数 (ストリーク) =====
// クイズに 1 問でも回答した日を YYYY-MM-DD で保存。最大 365 日分。
function markStudyDate() {
  const today = new Date().toISOString().slice(0, 10);
  let dates = [];
  try { dates = JSON.parse(localStorage.getItem('wt_streak_dates') || '[]'); } catch {}
  if (!dates.includes(today)) {
    dates.push(today);
    if (dates.length > 365) dates = dates.slice(-365);
    localStorage.setItem('wt_streak_dates', JSON.stringify(dates));
    onStudiedToday();          // その日最初の1問 → 褒める・❄️の付与判定
  }
}
function calcStreak() {
  let dates = [];
  try { dates = JSON.parse(localStorage.getItem('wt_streak_dates') || '[]'); } catch {}
  const set = new Set(dates.concat(frozenDates()));   // ❄️で守った日も連続に数える
  let streak = 0;
  const d = new Date();
  // 今日学習していなくても、昨日学習していれば「昨日からの連続」を表示する
  if (!set.has(d.toISOString().slice(0, 10))) {
    d.setDate(d.getDate() - 1);
  }
  while (set.has(d.toISOString().slice(0, 10))) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}
// recordVerdict にフック (上書きでなくラップ): 答えを記録するたびに今日の日付を残す
(function hookStreak(){
  const _orig = window.recordVerdict;
  window.recordVerdict = function(stage, lessonIdx, qid, verdict) {
    if (typeof _orig === 'function') _orig(stage, lessonIdx, qid, verdict);
    markStudyDate();
  };
})();

// ===== ストリーク・フリーズ（❄️） =====
// 7日連続ごとに❄️を1個獲得（最大2個）。学習できなかった日があっても、
// ❄️が足りれば自動で消費して連続記録を守る。Duolingoのストリークフリーズと同じ考え方。
function frozenDates() {
  try { return JSON.parse(localStorage.getItem('wt_streak_frozen') || '[]'); } catch { return []; }
}
function freezeCount() {
  const v = parseInt(localStorage.getItem('wt_streak_freeze'), 10);
  return isFinite(v) ? Math.max(0, Math.min(2, v)) : 0;
}
function setFreezeCount(n) { localStorage.setItem('wt_streak_freeze', String(Math.max(0, Math.min(2, n)))); }
function _dstr(d) { return d.toISOString().slice(0, 10); }

// 昨日から遡って「欠けた日」を数え、❄️で全部埋められるときだけ消費する（半端に減らさない）。
// 1日1回だけ判定する。
function applyFreeze() {
  const today = _dstr(new Date());
  if (localStorage.getItem('wt_streak_freeze_check') === today) return;
  localStorage.setItem('wt_streak_freeze_check', today);
  let dates = [];
  try { dates = JSON.parse(localStorage.getItem('wt_streak_dates') || '[]'); } catch {}
  if (!dates.length) return;
  const frozen = frozenDates();
  const set = new Set(dates.concat(frozen));
  const miss = [];
  const d = new Date(); d.setDate(d.getDate() - 1);
  while (!set.has(_dstr(d))) {
    miss.push(_dstr(d));
    if (miss.length > 30) return;                    // 1か月空いたら素直に切れる
    d.setDate(d.getDate() - 1);
  }
  if (!miss.length) return;
  const n = freezeCount();
  if (miss.length <= n) {
    setFreezeCount(n - miss.length);
    localStorage.setItem('wt_streak_frozen', JSON.stringify(frozen.concat(miss).sort().slice(-120)));
    stkToast('❄️ フリーズが連続記録を守りました（残り' + freezeCount() + '個）');
  }
}
try { applyFreeze(); } catch (e) {}                  // 起動時にも欠け埋めを判定（表示前に整える）

// ===== 褒める機構 =====
function stkToast(msg) {
  const t = document.createElement('div');
  t.className = 'stk-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2600);
}
function stkPraise(streak, earnedFreeze) {
  const tier =
    streak >= 100 ? 'もう習慣を超えて、特技です。' :
    streak >= 50  ? '継続の天才。ここまで来る人はほとんどいません。' :
    streak >= 30  ? '1か月続いた学習は、一生モノになります。' :
    streak >= 14  ? '2週間継続。脳が英語を「日常」と認識し始めています。' :
    streak >= 7   ? '1週間連続！ここからが定着の本番です。' :

  const ov = document.createElement('div');
  ov.className = 'stk-modal';
  ov.innerHTML =
    '<div class="stk-card">' +
      '<div class="stk-flame">🔥</div>' +
      '<div class="stk-days">' + streak + '日連続！</div>' +
      '<div class="stk-msg">' + tier + '</div>' +
      (earnedFreeze ? '<div class="stk-earn">❄️ ストリーク・フリーズを1個獲得！<br><span>学習できない日があっても、自動で連続記録を守ります（最大2個）</span></div>' : '') +
      '<button class="stk-ok" type="button">つづける</button>' +
    '</div>';
  document.body.appendChild(ov);

  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
}
// その日最初の学習を記録した瞬間に呼ばれる
function onStudiedToday() {
  try { applyFreeze(); } catch (e) {}
  const s = calcStreak();
  // ❄️付与: 7日連続ごとに1個（最大2個）。同じ到達で二重に配らない
  let earned = false;
  if (s > 0 && s % 7 === 0) {
    const last = parseInt(localStorage.getItem('wt_streak_award') || '0', 10);
    if (last !== s) {
      localStorage.setItem('wt_streak_award', String(s));
      if (freezeCount() < 2) { setFreezeCount(freezeCount() + 1); earned = true; }
    }
  }
  const MILESTONES = [3, 7, 14, 21, 30, 50, 75, 100, 150, 200, 365];
  if (MILESTONES.includes(s) || earned) {
    stkPraise(s, earned);
    try { if (window.gasflare) gasflare.log('streak0', '🔥 連続学習', '🔥 ' + s + '日連続を達成' + (earned ? '（❄️獲得）' : '')); } catch (e) {}
  } else if (s >= 2) {
    stkToast('🔥 ' + s + '日連続！');
  }
  try { if (window.gasflare) gasflare.pushLater(); } catch (e) {}
}

// ===== 復習画面 =====
// 全ステージを横断して "wrong" の verdict を集計。ステージ単位でカード表示。
// 各カードはタップで単語一覧を展開、ボタンで「苦手だけで復習」を開始する。
async function renderReview() {
  const body = document.getElementById('review-body');
  let html = '<p class="section-lead">これまで間違えた単語をステージごとにまとめました。タップで単語一覧を見たり、まとめて復習できます。</p>';
  const cards = [];
  STAGES.forEach(s => {
    const p = getProg(s.id);
    const lessons = p.lessons || {};
    const wrongIds = new Set();
    Object.values(lessons).forEach(l => {
      if (!l.verdicts) return;
      for (const [qid, v] of Object.entries(l.verdicts)) {
        if (v === 'wrong') wrongIds.add(qid);
      }
    });
    if (wrongIds.size > 0) cards.push({ stage: s, count: wrongIds.size, ids: wrongIds });
  });
  if (cards.length === 0) {
    html += `<div class="review-empty">まだ間違えた単語はありません。<br>クイズで間違えると、ここに集まります。</div>`;
    body.innerHTML = html;
    return;
  }
  cards.forEach(({ stage, count }) => {
    html += `<div class="review-stage-card">
      <div class="icon">${stage.icon}</div>
      <div class="info">
        <div class="name">${stage.name}</div>
        <div class="sub">${count} 個の苦手単語</div>
      </div>
      <button class="review-words-toggle" data-stage="${stage.id}" data-mode="list">📖 一覧</button>
      <button class="review-words-toggle" data-stage="${stage.id}" data-mode="quiz" style="background:var(--accent);color:white;border-color:var(--accent)">▶ 復習</button>
    </div>
    <div class="review-word-list" id="review-words-${stage.id}"></div>`;
  });
  body.innerHTML = html;
  body.querySelectorAll('.review-words-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const stageId = btn.dataset.stage;
      const mode = btn.dataset.mode;
      if (mode === 'quiz') {
        startReviewFor(stageId);
      } else {
        toggleReviewWords(stageId, btn);
      }
    });
  });
}
async function loadStageData(stageId) {
  const s = STAGES.find(x => x.id === stageId);
  if (stageData && stageData.stage === stageId) return stageData;
  showLoading('読み込み中...');
  const r = await fetch(s.src + '?t=' + Date.now());
  const raw = await r.json();
  let quizzes = raw.quizzes;
  if (typeof s.sliceStart === 'number') quizzes = quizzes.slice(s.sliceStart, s.sliceEnd);
  stageData = { stage: stageId, quizzes };
  hideLoading();
  return stageData;
}
async function toggleReviewWords(stageId, btn) {
  const list = document.getElementById('review-words-' + stageId);
  if (list.classList.contains('open')) {
    list.classList.remove('open'); btn.classList.remove('open'); return;
  }
  // 該当ステージのデータを読み込んで wrong qid のテキストを引く
  await loadStageData(stageId);
  const p = getProg(stageId);
  const lessons = p.lessons || {};
  const wrongIds = new Set();
  Object.values(lessons).forEach(l => {
    if (!l.verdicts) return;
    for (const [qid, v] of Object.entries(l.verdicts)) {
      if (v === 'wrong') wrongIds.add(qid);
    }
  });
  const items = stageData.quizzes.filter(q => wrongIds.has(q.id));
  list.innerHTML = items.map(q => {
    const word = q.word || q.embed || (q.embeds && q.embeds[0]) || q.target || '';
    const meaning = q.meaning || q.answer || (q.choices && q.choices[0]) || '';
    return `<div class="review-word-item"><div class="w">${word}</div><div class="m">${meaning}</div></div>`;
  }).join('') || '<div class="review-word-item"><div class="m">表示できる単語がありません</div></div>';
  list.classList.add('open');
  btn.classList.add('open');
}
async function startReviewFor(stageId) {
  await loadStageData(stageId);
  const p = getProg(stageId);
  const lessons = p.lessons || {};
  const wrongIds = new Set();
  Object.values(lessons).forEach(l => {
    if (!l.verdicts) return;
    for (const [qid, v] of Object.entries(l.verdicts)) {
      if (v === 'wrong') wrongIds.add(qid);
    }
  });
  const queue = stageData.quizzes.filter(q => wrongIds.has(q.id)).map(q => q.id);
  if (queue.length === 0) { alert('復習する単語がありません'); return; }
  // 既存の retry フェーズに乗せる (合格判定無し・正解で wrong から除外)
  const s = STAGES.find(x => x.id === stageId);
  curStage = stageId;
  curLesson = -1; // 復習モード用の特殊値
  curPhase = 'retry';
  curQueue = queue.slice();
  curIndex = 0;
  mainErrors = [];
  retryErrors = [];
  segmentCorrect = 0;
  document.getElementById('quiz-stage-name').innerText = s.name + ' ・ 苦手復習';
  switchScreen('screen-quiz');
  if (typeof showQuestion === 'function') showQuestion();
}

// ===== 統計画面 =====
function renderStats() {
  const body = document.getElementById('stats-body');
  let totalAnswered = 0, totalCorrect = 0, stagesPassed = 0, totalLessons = 0;
  const rows = [];
  STAGES.forEach(s => {
    const p = getProg(s.id);
    const lessons = p.lessons || {};
    let aw = 0, co = 0, ps = 0;
    const tl = Math.ceil(s.total / LESSON_SIZE);
    Object.values(lessons).forEach(l => {
      if (l.passed) ps++;
      if (l.verdicts) {
        for (const v of Object.values(l.verdicts)) { aw++; if (v !== 'wrong') co++; }
      }
    });
    totalAnswered += aw; totalCorrect += co;
    stagesPassed += ps; totalLessons += tl;
    rows.push({ icon: s.icon, name: s.name, passed: ps, total: tl, answered: aw, correct: co });
  });
  const streak = calcStreak();
  const rate = totalAnswered ? Math.round(totalCorrect * 100 / totalAnswered) : 0;
  const flame = streak >= 14 ? '🔥' : streak >= 7 ? '✨' : streak >= 3 ? '🌶️' : '🌱';
  let html = `
    <p class="section-lead">これまでの学習の積み重ねを見てみましょう。</p>
    <div class="stat-grid">
      <div class="stat-card big">

        <div class="stat-value">${streak}<span class="stat-unit">日</span></div>
        <div class="stat-flame">${flame}</div>

        <div class="stat-label">累計回答</div>
        <div class="stat-value">${totalAnswered}<span class="stat-unit">問</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">正答率</div>
        <div class="stat-value">${rate}<span class="stat-unit">%</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">合格レッスン</div>
        <div class="stat-value">${stagesPassed}<span class="stat-unit">/ ${totalLessons}</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">残り苦手単語</div>
        <div class="stat-value">${(function(){
          let n = 0;
          STAGES.forEach(s => {
            const p = getProg(s.id);
            const set = new Set();
            Object.values(p.lessons || {}).forEach(l => {
              for (const [qid, v] of Object.entries(l.verdicts || {})) {
                if (v === 'wrong') set.add(qid);
              }
            });
            n += set.size;
          });
          return n;
        })()}<span class="stat-unit">語</span></div>
      </div>

    <h3 class="section-h2">ステージ別の進捗</h3>
  `;
  rows.forEach(r => {
    const rp = r.answered ? Math.round(r.correct * 100 / r.answered) : 0;
    const pp = r.total ? Math.round(r.passed * 100 / r.total) : 0;
    html += `<div class="stage-stat-row">
      <div class="ss-icon">${r.icon}</div>
      <div class="ss-info">
        <div class="ss-name">${r.name}</div>
        <div class="ss-meta">${r.answered} 問回答 ・ 正答率 ${rp}%</div>
        <div class="ss-bar"><div style="width:${pp}%"></div></div>
        <div class="ss-lessons">${r.passed} / ${r.total} レッスン合格</div>
      </div>

  });

      <div class="settings-divider"></div>
      <button class="btn secondary" id="set-reset-all">🗑️ 進捗をすべてリセット</button>
    </div>
  `;
  document.getElementById('set-bgm').addEventListener('change', e => {
    const muted = !e.target.checked;
    localStorage.setItem('wt_bgm_muted', muted ? '1' : '0');
    const bgm = document.getElementById('bgm');
    if (bgm) { bgm.muted = muted; if (!muted && typeof window.startBGM === 'function') window.startBGM(); }
    // 右上フロートも同期
    const t = document.getElementById('bgm-toggle');
    if (t) { t.classList.toggle('muted', muted); t.textContent = muted ? '🔇' : '🎵'; }
  });
  document.getElementById('set-ruby').addEventListener('change', e => {
    document.body.classList.toggle('show-ruby', e.target.checked);
    localStorage.setItem('wt_show_ruby', e.target.checked ? '1' : '0');
  });
  document.getElementById('set-timer').addEventListener('change', e => {
    localStorage.setItem('wt_no_timer', e.target.checked ? '0' : '1');
  });
  document.getElementById('set-easy').addEventListener('change', e => {
    localStorage.setItem('wt_easy_mode', e.target.checked ? '1' : '0');
  });
  document.getElementById('set-reset-all').addEventListener('click', () => {
    if (confirm('すべての進捗 (合格・苦手単語・連続日数) をリセットしますか?')) {
      STAGES.forEach(s => localStorage.removeItem('wt_prog2_' + s.id));
      localStorage.removeItem('wt_streak_dates');
      alert('リセットしました');
      renderHome();
      renderStats();
      renderSettings();
    }
  });
  const pwaBtn = document.getElementById('pwa-install-btn');
  if (pwaBtn && !pwaDisabled) {
    pwaBtn.addEventListener('click', async () => {
      if (!__deferredInstallPrompt) return;
      __deferredInstallPrompt.prompt();
      await __deferredInstallPrompt.userChoice;
      __deferredInstallPrompt = null;
      renderSettings();
    });
  }
  // 学習リマインダー
  const timeInput = document.getElementById('set-reminder-time');
  timeInput.addEventListener('change', () => {
    localStorage.setItem('wt_reminder_time', timeInput.value || '20:00');
  });
  document.getElementById('set-reminder-ics').addEventListener('click', () => {
    downloadReminderICS(timeInput.value || '20:00');
  });
  document.getElementById('set-reminder-gcal').addEventListener('click', () => {
    const url = googleCalendarReminderURL(timeInput.value || '20:00');
    window.open(url, '_blank', 'noopener');
  });
}

// ===== 学習リマインダー (OS カレンダーへ登録) =====
// 「次回該当時刻」を起点に毎日繰り返し。.ics は iOS/Android/macOS の標準カレンダー
// アプリで開ける。Google アカウントの場合は Quick Add URL の方が摩擦が少ない。
function _nextOccurrence(hhmm) {
  const [h, m] = (hhmm || '20:00').split(':').map(n => parseInt(n, 10) || 0);
  const d = new Date();
  d.setSeconds(0, 0);
  d.setHours(h, m);
  if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
  return d;
}
function _formatICSLocal(d) {
  // ローカル時刻ベースの DTSTART (Z 無し) — TZID は付けないので端末タイムゾーンで解釈される
  const z = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}T${z(d.getHours())}${z(d.getMinutes())}00`;
}
function _formatICSUTC(d) {
  const z = (n) => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}${z(d.getUTCMonth() + 1)}${z(d.getUTCDate())}T${z(d.getUTCHours())}${z(d.getUTCMinutes())}${z(d.getUTCSeconds())}Z`;
}
function buildReminderICS(hhmm) {
  const start = _nextOccurrence(hhmm);
  const end = new Date(start.getTime() + 15 * 60 * 1000);
  const stamp = _formatICSUTC(new Date());
  const uid = 'wordtacos-' + start.getTime() + '@teachertacos.com';
  // RFC 5545: CRLF 改行
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//WordTacos//Daily Reminder//JP',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:' + uid,
    'DTSTAMP:' + stamp,
    'DTSTART:' + _formatICSLocal(start),
    'DTEND:' + _formatICSLocal(end),
    'RRULE:FREQ=DAILY',
    'SUMMARY:🌮 WordTacos の時間',
    'DESCRIPTION:今日も英単語\\, いっぱい食べよ。\\nhttps://words.teachertacos.com/',
    'URL:https://words.teachertacos.com/',
    'BEGIN:VALARM',
    'TRIGGER:PT0M',
    'ACTION:DISPLAY',
    'DESCRIPTION:WordTacos',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR',
    '',
  ];
  return lines.join('\r\n');
}
function downloadReminderICS(hhmm) {
  const ics = buildReminderICS(hhmm);
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wordtacos-reminder.ics';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}
function googleCalendarReminderURL(hhmm) {
  const start = _nextOccurrence(hhmm);
  const end = new Date(start.getTime() + 15 * 60 * 1000);
  // Google Calendar Quick Add は UTC の YYYYMMDDTHHMMSSZ 表記
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: '🌮 WordTacos の時間',
    dates: _formatICSUTC(start) + '/' + _formatICSUTC(end),
    details: '今日も英単語、いっぱい食べよ。\nhttps://words.teachertacos.com/',
    location: 'https://words.teachertacos.com/',
    recur: 'RRULE:FREQ=DAILY',
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

// ===== タイマー OFF 対応 =====
// 既存の currentTimeLimit を保ったまま、no_timer 設定があれば 999 秒 (= 実質無制限) に。
(function hookTimer(){
  const _orig = window.currentTimeLimit;
  if (typeof _orig !== 'function') return;
  window.currentTimeLimit = function() {
    if (localStorage.getItem('wt_no_timer') === '1') return 999;
    return _orig();
  };
})();

// 🐢 イージーモード: 制限時間を 1.6倍にゆるめる (no_timer 設定の方が優先)。
(function hookEasyMode(){
  const _orig = window.currentTimeLimit;
  if (typeof _orig !== 'function') return;
  window.currentTimeLimit = function() {
    const base = _orig();
    if (base >= 999) return base;  // 無制限設定はそのまま尊重
    if (localStorage.getItem('wt_easy_mode') === '1') return Math.round(base * 1.6);
    return base;
  };
})();

// ===== タブ切替 =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    if (tab === 'screen-stages') renderHome();
    else if (tab === 'screen-review') renderReview();
    else if (tab === 'screen-stats') renderStats();
    else if (tab === 'screen-settings') renderSettings();
    switchScreen(tab);
  });
});

// ===== Service Worker 登録 =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
