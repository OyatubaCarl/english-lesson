テーマパークに行った日、ジェットコースターや観覧車に乗って1日中<fun>な時間を過ごした。", "choices": ["楽しみ", "悲しみ", "怒り", "疲れ"], "correct_index": 0, "explanation": "have fun = 楽しむ。funny(おかしい)とは少し違う。", "id": "s1_133", "body_ruby": "クラスでテーマパークに行《い》った日《ひ》、ジェットコースターや観覧車《かんらんしゃ》に乗《の》って1日《にち》中《なか》<fun>な時間《じかん》を過《す》ごした。", "choices_ruby": ["楽《たの》しみ", "悲《かな》しみ", "怒《いか》り", "疲《つか》れ"], "explanation_ruby": "have fun = 楽《たの》しむ。funny(おかしい)とは少《すこ》し違《ちが》う。", "body_kana": "クラスでテーマパークにいったひ、ジェットコースターやかんらんしゃにのって1日なか<fun>なじかんをすごした。"}, {"word": "girl", "meaning_jp": "女の子", "pos": "名", "body": "公園で、3歳くらいのピンクのドレスを着た小さな<girl>がお母さんと手をつないで歩いていた。", "choices": ["女の子", "男の子", "母", "祖母"], "correct_index": 0, "explanation": "boy の対義語。", "id": "s1_134", "body_ruby": "公園《こうえん》で、3歳《さい》くらいのピンクのドレスを着《き》た小《ちい》さな<girl>がお母《かあ》さんと手《て》をつないで歩《ある》いていた。", "choices_ruby": ["｜女の子《おんなのこ》", "｜男の子《おとこのこ》", "母《はは》", "祖母《そぼ》"], "explanation_ruby": "boy の対義《たいぎ》語《ご》。", "body_kana": "こうえんで、3歳くらいのピンクのドレスをきたちいさな<girl>がおかあさんとてをつないであるいていた。"}, {"word": "glad", "meaning_jp": "嬉しい", "pos": "形", "body": "ずっと欲しかった本をプレゼントでもらえて、彼女はとても<glad>そうな顔をして何度もお礼を言った。喜びの気持ちを表すよ。", "choices": ["嬉しい", "悲しい", "怒った", "退屈な"], "correct_index": 0, "explanation": "I'm glad to ~ = 〜できて嬉しい。happy より少し軽い喜び。", "id": "s1_135", "body_ruby": "ずっと欲《ほ》しかった本《ほん》をプレゼントでもらえて、彼女《かのじょ》はとても<glad>そうな顔《かお》をして何度《なんど》もお礼《れい》を言《い》った。喜《よろこ》びの気持《きも》ちを表《あらわ》すよ。", "choices_ruby": ["嬉《うれ》しい", "悲《かな》しい", "怒《いか》った", "退屈《たいくつ》な"], "explanation_ruby": "I'm glad to ~ = 〜できて嬉《うれ》しい。happy より少《すこ》し軽《かる》い喜《よろこ》び。", "body_kana": "ずっとほしかったほんをプレゼントでもらえて、かのじょはとても<glad>そうなかおをしてなんどもおれいをいった。よろこびのきもちをあらわすよ。"}, {"word": "goal", "meaning_jp": "目標、ゴール", "pos": "名", "body": "私の今年の<goal>は、英語のテストで90点を取ることだ。", "choices": ["目標", "結果", "問題", "原因"], "correct_index": 0, "explanation": "サッカー等の「ゴール」「目標」の両方。", "id": "s1_136", "body_ruby": "私《わたし》の今年《ことし》の<goal>は、英語《えいご》のテストで90点《てん》を取《と》ることだ。", "choices_ruby": ["目標《もくひょう》", "結果《けっか》", "問題《もんだい》", "原因《げんいん》"], "explanation_ruby": "サッカー等《など》の「ゴール」「目標《もくひょう》」の両方《りょうほう》。", "body_kana": "わたしのことしの<goal>は、えいごのテストで90点をとることだ。"}, {"word": "goalball", "meaning_jp": "ゴールボール", "pos": "名", "body": "パラリンピックで行われる<goalball>という競技は、目隠しをした選手が音の鳴るボールを転がして相手のゴールに入れる。", "choices": ["ゴールボール", "サッカー", "バスケ", "野球"], "correct_index": 0, "explanation": "視覚障害者向けの団体球技。パラリンピック種目。", "id": "s1_137", "body_ruby": "パラリンピックで行《おこな》われる<goalball>という競技《きょうぎ》は、目隠《めかく》しをした選手《せんしゅ》が音《おと》の鳴《な》るボールを転《ころ》がして相手《あいて》のゴールに入《い》れる。", "choices_ruby": ["ゴールボール", "サッカー", "バスケ", "野球《やきゅう》"], "explanation_ruby": "視覚障害者《しかくしょうがいしゃ》向《む》けの団体《だんたい》球技《きゅうぎ》。パラリンピック種目《しゅもく》。", "body_kana": "パラリンピックでおこなわれる<goalball>というきょうぎは、めかくしをしたせんしゅがおとのなるボールをころがしてあいてのゴールにいれる。"}, {"word": "good", "meaning_jp": "良い", "pos": "形", "body": "今日の天気は朝から雲一つない青空で、運動会をするのにとても<good>な日になった。", "choices": ["良い", "悪い", "暑い", "寒い"], "correct_index": 0, "explanation": "bad(悪い)の対。Good morning! = おはよう。", "id": "s1_138", "body_ruby": "今日《きょう》の天気《てんき》は朝《あさ》から雲《くも》一《ひと》つない青《あお》空《そら》で、運動会《うんどうかい》をするのにとても<good>な日《ひ》になった。", "choices_ruby": ["良《よ》い", "悪《わる》い", "暑《あつ》い", "寒《さむ》い"], "explanation_ruby": "bad(悪《わる》い)の対《つい》。Good morning! = おはよう。", "body_kana": "きょうのてんきはあさからくもひとつないあおそらで、うんどうかいをするのにとても<good>なひになった。"}, {"word": "got", "meaning_jp": "得た、もらった", "pos": "動", "body": "昨日、誕生日プレゼントとして、ずっと欲しかったゲームソフトを祖母から<got>した。", "choices": ["得た", "あげた", "失った", "捨てた"], "correct_index": 0, "explanation": "get の過去形。get-got-got(米)/gotten(英)。", "id": "s1_139", "body_ruby": "昨日《きのう》、誕生日《たんじょうび》プレゼントとして、ずっと欲《ほ》しかったゲームソフトを祖母《そぼ》から<got>した。", "choices_ruby": ["得《え》た", "あげた", "失《う》った", "捨《す》てた"], "explanation_ruby": "get の過去形《かこけい》。get-got-got(米《こめ》)/gotten(英《えい》)。", "body_kana": "きのう、たんじょうびプレゼントとして、ずっとほしかったゲームソフトをそぼから<got>した。"}, {"word": "grandfather", "meaning_jp": "祖父", "pos": "名", "body": "母の父である<grandfather>は、今年で80歳になるが、毎朝散歩を欠かさない元気な人だ。父の父も同じ呼び方だ。", "choices": ["祖父", "祖母", "父", "叔父"], "correct_index": 0, "explanation": "grand(大きい)+ father(父)。grandpa とも。", "id": "s1_140", "body_ruby": "母《はは》の父《ちち》である<grandfather>は、今年《ことし》で80歳《さい》になるが、毎朝《まいあさ》散歩《さんぽ》を欠《か》かさない元気《げんき》な人《ひと》だ。父《ちち》の ], "correct_index": 0, "explanation": "Great! = いいね! great-grandfather = 曽祖父。", "id": "s1_144", "body_ruby": "彼《かれ》は今日《きょう》のテストで100点《てん》満点《まんてん》を取《と》った。クラス40人《にん》で1人《にん》だけだったので、<great>な成績《せいせき》だと先生《せんせい》からも褒《ほ》められた。", "choices_ruby": ["素晴《すば》らしい", "ひどい", "普通《ふつう》の", "退屈《たいくつ》な"], "explanation_ruby": "Great! = いいね! great-grandfather = 曽祖父《そうそふ》。", "body_kana": "かれはきょうのテストで100点まんてんをとった。クラス40人で1人だけだったので、<great>なせいせきだとせんせいからもほめられた。"}, {"word": "green", "meaning_jp": "緑", "pos": "形", "body": "春になって、冬の間は枯れていた木々の枝に、新しい<green>の葉っぱがたくさん芽吹いてきれいだ。植物の葉の色だ。", "choices": ["緑", "赤", "黄", "茶"], "correct_index": 0, "explanation": "信号の「青」も英語では green light。", "id": "s1_145", "body_ruby": "春《はる》になって、冬《ふゆ》の間《あいだ》は枯《か》れていた木々《きぎ》の枝《えだ》に、新《あたら》しい<green>の葉《は》っぱがたくさん芽《め》吹《ふ》いてきれいだ。植物《しょくぶつ》の葉《は》の色《いろ》だ。", "choices_ruby": ["緑《みどり》", "赤《あか》", "黄《き》", "茶《ちゃ》"], "explanation_ruby": "信号《しんごう》の「青《あお》」も英語《えいご》では green light。", "body_kana": "はるになって、ふゆのあいだはかれていたきぎのえだに、あたらしい<green>のはっぱがたくさんめふいてきれいだ。しょくぶつのはのいろだ。"}, {"word": "ground", "meaning_jp": "地面、運動場", "pos": "名", "body": "体育の授業で、靴底でぎゅっと固められた茶色の<ground>の上を、全員で5周走った。", "choices": ["地面", "空", "壁", "天井"], "correct_index": 0, "explanation": "on the ground = 地面に。playground = 遊び場。", "id": "s1_146", "body_ruby": "体育《たいいく》の授業《じゅぎょう》で、靴底《くつぞこ》でぎゅっと固《かた》められた茶色《ちゃいろ》の<ground>の上《うえ》を、全員《ぜんいん》で5周《しゅう》走《はし》った。", "choices_ruby": ["地面《じめん》", "空《そら》", "壁《かべ》", "天井《てんじょう》"], "explanation_ruby": "on the ground = 地面《じめん》に。playground = ｜遊び場《あそびば》。", "body_kana": "たいいくのじゅぎょうで、くつぞこでぎゅっとかためられたちゃいろの<ground>のうえを、ぜんいんで5しゅうはしった。"}, {"word": "group", "meaning_jp": "グループ", "pos": "名", "body": "理科の実験では、4人ずつ10個の<group>に分かれて、それぞれが顕微鏡で植物の細胞を観察した。集まった少人数のまとまりだ。", "choices": ["グループ", "学年", "教室", "国"], "correct_index": 0, "explanation": "small group(小グループ)、age group(年齢層)。", "id": "s1_147", "body_ruby": "理科《りか》の実験《じっけん》では、4人《にん》ずつ10個《こ》の<group>に分《わ》かれて、それぞれが顕微鏡《けんびきょう》で植物《しょくぶつ》の細胞《さいぼう》を観察《かんさつ》した。集《あつ》まった少人数《しょうにんずう》のまとまりだ。", "choices_ruby": ["グループ", "学年《がくねん》", "教室《きょうしつ》", "国《くに》"], "explanation_ruby": "small group(小《しょう》グループ)、age group(年齢層《ねんれいそう》)。", "body_kana": "りかのじっけんでは、4人ずつ10個の<group>にわかれて、それぞれがけんびきょうでしょくぶつのさいぼうをかんさつした。あつまったしょうにんずうのまとまりだ。"}, {"word": "guitar", "meaning_jp": "ギター", "pos": "名", "body": "兄は軽音楽部に入っていて、毎日放課後に6本の弦が張られた<guitar>を抱えて、指で弦をはじいて練習している。", "choices": ["ギター", "ピアノ", "ドラム", "ベース"], "correct_index": 0, "explanation": "弦楽器。guitarist = ギタリスト。", "id": "s1_148", "body_ruby": "兄《あに》は軽音楽部《けいおんがくぶ》に入《はい》っていて、毎日《まいにち》放課後《ほうかご》に6本《ほん》の弦《げん》が張《は》られた<guitar>を抱《かか》えて、指《ゆび》で弦《げん》をはじいて練習《れんしゅう》している。", "choices_ruby": ["ギター", "ピアノ", "ドラム", "ベース"], "explanation_ruby": "弦楽器《げんがっき》。guitarist = ギタリスト。", "body_kana": "あにはけいおんがくぶにはいっていて、まいにちほうかごに6本のげんがはられた<guitar>をかかえて、ゆびでげんをはじいてれんしゅうしている。"}, {"word": "hair", "meaning_jp": "髪", "pos": "名", "body": "私の<hair>は腰まで届くほど長かったが、夏が来て暑くて仕方なくなり、美容院でばっさり肩まで切ってもらった。", "choices": ["髪", "目", "鼻", "肌"], "correct_index": 0, "explanation": "頭髪・体毛の総称。haircut = 散髪。", "id": "s1_149", "body_ruby": "私《わたし》の<hair>は腰《こし》まで届《とど》くほど長《なが》かったが、夏《なつ》が来《き》て暑《あつ》くて仕方《しかた》なくなり、美容院《びよういん》でばっさり肩《かた》まで切《き》ってもらった。", "choices_ruby": ["髪《かみ》", "目《め》", "鼻《はな》", "肌《はだ》"], "explanation_ruby": "頭髪《とうはつ》・体毛《たいもう》の総称《そうしょう》。haircut = 散髪《さんぱつ》。", "body_kana": "わたしの<hair>はこしまでとどくほどながかったが、なつがきてあつくてしかたなくなり、びよういんでばっさりかたまできってもらった。"}, {"word": "hamburger", "meaning_jp": "ハンバーガー", "pos": "名", "body": "ファストフード店で、丸いパンの間に肉と野菜を挟んだ<hamburger>とコーラを注文した。", "choices": ["ハンバーガー", "ホットドッグ", "ピザ", "サンドイッチ"], "correct_index": 0, "explanation": "ドイツのハンブルク(Hamburg)が語源。", "id": "s1_150", "body_ruby": "ファストフード店《みせ》で、丸《まる》いパンの間《ま》に肉《にく》と野菜《やさい》を挟《はさ》んだ<hamburger>とコーラを注文《ちゅうもん》した。", "choices_ruby": ["ハンバーガー", "ホットドッグ", "ピザ", "サンドイッチ"], "explanation_ruby": "ドイツのハンブルク(Hamburg)が語源《ごげん》。", "body_kana": "ファストフードみせで、まるいパンのまににくとやさいをはさんだ<hamburger>とコーラをちゅうもんした。"}, {"word": "hand", "meaning_jp": "手", "pos": "名", "body": "ご飯を食べる前には、石鹸を使って両方の<hand>をしっかり洗うように、小さい頃から母に何度も言われてきた。", "choices": ["手", "足", "顔", "首"], "correct_index": 0, "explanation": "handshake = 握手、handful = 一握り。", "id": "s1_151", "body_ruby": "ご飯《めし》を食《た》べる前《まえ》には、石鹸《せっけん》を使《つか》って両方《りょうほう》の<hand>をしっかり洗《あら》うように、小《ちい》さい頃《ごろ》から母《はは》に何度《なんど》も言《い》われてきた。", "choices_ruby": ["手《て》", "足《あし》", "顔《かお》", "首《くび》"], "explanation_ruby": "handshake = 握手《あくしゅ》、handful = 一握《ひとにぎ》り。", "body_kana": "ごめしをたべるまえには、せっけんをつかってりょうほうの<hand>をしっかりあらうように、ちいさいごろからははになんどもいわれてきた。"}, {"word": "hard", "meaning_jp": "難しい、硬い", "pos": "形", "body": "今日の数学のテストは普段より問題数も多く、計算も複雑で、クラスのみんなが「<hard>だった」と口々に言っていた。", "choices": ["難しい", "簡単な", "楽しい", "短い"], "correct_index": 0, "explanation": "easy(簡単)の対。「硬い」「一生懸命」の意味もある。", "id": "s1_152", "body_ruby": "今日《きょう》の数学《すうがく》のテストは普段《ふだん》より問題数《もんだいすう》も多《おお》く、計算《けいさん》も複雑《ふくざつ》で、クラスのみんなが「<hard>だった」と口々《くちぐち》に言《い》っていた。", "choices_ruby": ["難《むずか》しい", "簡単《かんたん》な", "楽《たの》しい", "短《みじか》い"], "explanation_ruby": "easy(簡単《かんたん》)の対《つい》。「硬《かた》い」「一生懸命《いっしょうけんめい》」の意味《いみ》もある。", "body_kana": "きょうのすうがくのテストはふだんよりもんだいすうもおおく、けいさんもふくざつで、クラスのみんなが「<hard>だった」とくちぐちにいっていた。"}, {"word": "hawk", "meaning_jp": "タカ", "pos": "名", "body": "山の上空を、翼を大きく広げた茶色の<hawk>が、地上の小動物を狙ってゆっくり旋回していた。鋭い目とくちばしを持つ猛禽だ。", "choices": ["タカ", "ハト", "スズメ", "カモメ"], "correct_index": 0, "explanation": "鋭い目で獲物を狙う猛禽。eagle(ワシ)より小さい。", "id": "s1_153", "body_ruby": "山《やま》の上《うえ》空《そら》を、翼《つばさ》を大《おお》きく広《ひろ》げた茶色《ちゃいろ》の<hawk>が、地上《ちじょう》の小動物《しょうどうぶつ》を狙《ねら》ってゆっくり旋回《せんかい》していた。鋭《するど》い目《め》とくちばしを持《も》つ猛禽《もうきん》だ。", "choices_ruby": ["タカ", "ハト", "スズメ", "カモメ"], "explanation_ruby": "鋭《するど》い目《め》で獲物《えもの》を狙《ねら》う猛禽《もうきん》。eagle(ワシ)より小《ちい》さい。", "body_kana": "やまのうえそらを、つばさをおおきくひろげたちゃいろの<hawk>が、ちじょうのしょうどうぶつをねらってゆっくりせんかいしていた。するどいめとくちばしをもつもうきんだ。"}, {"word": "head", "meaning_jp": "頭", "pos": "名", "body": "自転車に乗る時は、転んだときに脳を守るため、必ずヘルメットを<head>にしっかりかぶって走るよう注意されている。", "choices": ["頭", "肩", "胸", "腹"], "correct_index": 0, "explanation": "headache = 頭痛、headphone = ヘッドホン。", "id": "s1_154", "body_ruby": "自転車《じてんしゃ》に乗《の》る時《とき》は、転《ころ》んだときに脳《のう》を守《まも》るため、必《かなら》ずヘルメットを<head>にしっかりかぶって走《はし》るよう注意《ちゅうい》されている。", "choices_ruby": ["頭《あたま》", "肩《かた》", "胸《むね》", "腹《はら》"], "explanation_ruby": "headache = 頭痛《ずつう》、headphone = ヘッドホン。", "body_kana": "じてんしゃにのるときは、ころんだときにのうをまもるため、かならずヘルメットを<head>にしっかりかぶってはしるようちゅういされている。"}, {"word": "hear", "meaning_jp": "聞こえる", "pos": "動", "body": "夜、ベッドに入った瞬間、隣の部屋から父の大きないびきを<hear>して、なかなか眠れずに苦労した。", "choices": ["聞こえる", "見える", "話す", "歌う"], "correct_index": 0, "explanation": "hear-heard-heard。listen(意識して聞く)と区別。", "id": "s1_155", "body_ruby": "夜《よる》、ベッドに入《はい》った瞬間《しゅんかん》、隣《となり》の部屋《へや》から父《ちち》の大《おお》きないびきを<hear>して、なかなか眠《ねむ》れずに苦労《くろう》した。", "choices_ruby": ["聞《き》こえる", "見《み》える", "話《はな》す", "歌《うた》う"], "explanation_ruby": "hear-heard-heard。listen(意識《いしき》して聞《き》く)と区別《くべつ》。", "body_kana": "よる、ベッドにはいったしゅんかん、となりのへやからちちのおおきないびきを<hear>して、なかなかねむれずにくろうした。"}, {"word": "help", "meaning_jp": "助ける", "pos": "動", "body": "道で重い荷物を持ったおばあさんが困っていたので、声をかけて駅まで一緒に運ぶのを<help>した。", "choices": ["助ける", "邪魔する", "見る", "無視する"], "correct_index": 0, "explanation": "Help! = 助けて!。helpful = 役立つ。", "id": "s1_156", "body_ruby": "道《みち》で重《おも》い荷物《にもつ》を持《も》ったおばあさんが困《こま》っていたので、声《こえ》をかけて駅《えき》まで一緒《いっしょ》に運《はこ》ぶのを<help>した。", "choices_ruby": ["助《たす》ける", "邪魔《じゃま》する", "見《み》る", "無視《むし》する"], "explanation_ruby": "Help! = 助《たす》けて!。helpful = 役立《やくた》つ。", "body_kana": "みちでおもいにもつをもったおばあさんがこまっていたので、こえをかけてえきまでいっしょにはこぶのを<help>した。"}, {"word": "high", "meaning_jp": "高い", "pos": "形", "body": "東京スカイツリーは地上から634メートルもあり、世界で2番目に<high>な建物として有名だ。", "choices": ["高い", "低い", "重い", "古い"], "correct_index": 0, "explanation": "low(低い)の対。価格・温度・声などにも使う。", "id": "s1_157", "body_ruby": "東京《とうきょう》スカイツリーは地上《ちじょう》から634メートルもあり、世界《せかい》で2番目《ばんめ》に<high>な建物《たてもの》として有名《ゆうめい》だ。", "choices_ruby": ["高《たか》い", "低《ひく》い", "重《おも》い", "古《ふる》い"], "explanation_ruby": "low(低《ひく》い)の対《つい》。価格《かかく》・温度《おんど》・声《こえ》などにも使《つか》う。", "body_kana": "とうきょうスカイツリーはちじょうから634メートルもあり、せかいで2番目に<high>なたてものとしてゆうめいだ。"}, {"word": "hold", "meaning_jp": "持つ、抱える", "pos": "動", "body": "赤ちゃんが生まれた病院で、生まれたばかりの妹を初めて両腕でそっと<hold>させてもらった。", "choices": ["持つ", "離す", "投げる", "落とす"], "correct_index": 0, "explanation": "hold-held-held。Hold on! = ちょっと待って!", "id": "s1_158", "body_ruby": "赤《あか》ちゃんが生《う》まれた病院《びょういん》で、生《う》まれたばかりの妹《いもうと》を初《はじ》めて両腕《りょううで》でそっと<hold>させてもらった。", "choices_ruby": ["持《も》つ", "離《はな》す", "投《な》げる", "落《お》とす"], "explanation_ruby": "hold-held-held。Hold on! = ちょっと待《ま》って!", "body_kana": "あかちゃんがうまれたびょういんで、うまれたばかりのいもうとをはじめてりょううででそっと<hold>させてもらった。"}, {"word": "hole", "meaning_jp": "穴", "pos": "名", "body": "庭でずっと遊んでいたら、お気に入りのジーンズのひざの部分に5センチもの大きな<hole>ができてしまった。", "choices": ["穴", "線", "点", "輪"], "correct_index": 0, "explanation": "whole(全体)と発音が同じ。", "id": "s1_159", "body_ruby": "庭《にわ》でずっと遊《あそ》んでいたら、お気《き》に入《い》りのジーンズのひざの部分《ぶぶん》に5センチもの大《おお》きな<hole>ができてしまった。", "choices_ruby": ["穴《あな》", "線《せん》", "点《てん》", "輪《わ》"], "explanation_ruby": "whole(全体《ぜんたい》)と発音《はつおん》が同《おな》じ。", "body_kana": "にわでずっとあそんでいたら、おきにいりのジーンズのひざのぶぶんに5センチものおおきな<hole>ができてしまった。"}, {"word": "holiday", "meaning_jp": "休日、祝日", "pos": "名", "body": "5月の<holiday>は祝日が多く、3日からの大型連休のおかげで家族で温泉旅行に行くことができる。学校や仕事が休みになる特別な日だ。", "choices": ["休日", "平日", "授業日", "練習日"], "correct_index": 0, "explanation": "summer holiday(夏休み)。holy day(神聖な日)が語源。", "id": "s1_160", "body_ruby": "5月《がつ》の<holiday>は祝日《しゅくじつ》が多《おお》く、3日《にち》からの大型連休《おおがたれんきゅう》のおかげで家族《かぞく》で温泉旅行《おんせんりょこう》に行《い》くことができる。学校《がっこう》や仕事《しごと》が休《やす》みになる特別《とくべつ》な日《ひ》だ。", "choices_ruby": ["休日《きゅうじつ》", "平日《へいじつ》", "授業《じゅぎょう》日《にち》", "練習日《れんしゅうび》"], "explanation_ruby": "summer holiday(夏休《なつやす》み)。holy day(神聖《しんせい》な日《ひ》)が語源《ごげん》。", "body_kana": "5月の<holiday>はしゅくじつがおおく、3日からのおおがたれんきゅうのおかげでかぞくでおんせんりょこうにいくことができる。がっこうやしごとがやすみになるとくべつなひだ。"}, {"word": "home", "meaning_jp": "家、家庭", "pos": "名", "body": "夕方になると、空が暗くなり始める頃、私は自分の<home>に戻って、温かい夕食を家族と一緒に食べる。自分が暮らしている場所だ。", "choices": ["家", "学校", "公園", "駅"], "correct_index": 0, "explanation": "house(建物)よりも「我が家」のニュアンス。", "id": "s1_161", "body_ruby": "夕方《ゆうがた》になると、空《そら》が暗《くら》くなり始《はじ》める頃《ごろ》、私《わたし》は自分《じぶん》の<home>に戻《もど》って、温《あたた》かい夕食《ゆうしょく》を家族《かぞく》と一緒《いっしょ》に食《た》べる。自分《じぶん》が暮《く》らしている場所《ばしょ》だ。", "choices_ruby": ["家《いえ》", "学校《がっこう》", "公園《こうえん》", "駅《えき》"], "explanation_ruby": "house(建物《たてもの》)よりも「｜我が家《わがや》」のニュアンス。", "body_kana": "ゆうがたになると、そらがくらくなりはじめるごろ、わたしはじぶんの<home>にもどって、あたたかいゆうしょくをかぞくといっしょにたべる。じぶんがくらしているばしょだ。"}, {"word": "homework", "meaning_jp": "宿題", "pos": "名", "body": "今日の<homework>は、数学の問題集3ページと、英語の単語ノート1ページだ。", "choices": ["宿題", "テスト", "授業", "教科書"], "correct_index": 0, "explanation": "home + work。do my homework(宿題をする)。", "id": "s1_162", "body_ruby": "今日《きょう》の<homework>は、数学《すうがく》の問題集《もんだいしゅう》3ページと、英語《えいご》の単語《たんご》ノート1ページだ。", "choices_ruby": ["宿題《しゅくだい》", "テスト", "授業《じゅぎょう》", "教科書《きょうかしょ》"], "explanation_ruby": "home + work。do my homework(宿題《しゅくだい》をする)。", "body_kana": "きょうの<homework>は、すうがくのもんだいしゅう3ページと、えいごのたんごノート1ページだ。"}, {"word": "hope", "meaning_jp": "希望する", "pos": "動", "body": "明日のサッカーの試合は野外で行われるので、心の中で「晴れますように」と強く<hope>している。", "choices": ["希望する", "諦める", "怒る", "悲しむ"], "correct_index": 0, "explanation": "I hope ~ = 〜だといいな。希望する。", "id": "s1_163", "body_ruby": "明日《あした》のサッカーの試合《しあい》は野外《やがい》で行《おこな》われるので、心《こころ》の中《なか》で「晴《は》れますように」と強《つよ》く<hope>している。", "choices_ruby": ["希望《きぼう》する", "諦《あきら》める", "怒《いか》る", "悲《かな》しむ"], "explanation_ruby": "I hope ~ = 〜だといいな。希望《きぼう》する。", "body_kana": "あしたのサッカーのしあいはやがいでおこなわれるので、こころのなかで「はれますように」とつよく<hope>している。"}, {"word": "horse", "meaning_jp": "馬", "pos": "名", "body": "牧場では、茶色の毛と黒いたてがみを持つ大きな<horse>が、広い草原で気持ちよさそうに草を食べていた。人が乗ることもある動物だ。", "choices": ["馬", "牛", "羊", "豚"], "correct_index": 0, "explanation": "horseback riding = 乗馬。", "id": "s1_164", "body_ruby": "牧場《ぼくじょう》では、茶色《ちゃいろ》の毛《け》と黒《くろ》いたてがみを持《も》つ大《おお》きな<horse>が、広《ひろ》い草原《そうげん》で気持《きも》ちよさそうに草《くさ》を食《た》べていた。人《ひと》が乗《の》ることもある動物《どうぶつ》だ。", "choices_ruby": ["馬《うま》", "牛《うし》", "羊《ひつじ》", "豚《ぶた》"], "explanation_ruby": "horseback riding = 乗馬《じょうば》。", "body_kana": "ぼくじょうでは、ちゃいろのけとくろいたてがみをもつおおきな<horse>が、ひろいそうげんできもちよさそうにくさをたべていた。ひとがのることもあるどうぶつだ。"}, {"word": "hospital", "meaning_jp": "病院", "pos": "名", "body": "高熱が下がらなかったので、母が車で町の大きな<hospital>に連れて行ってくれて、医師の診察を受けた。", "choices": ["病院", "薬局", "図書館", "美容院"], "correct_index": 0, "explanation": "go to hospital = 入院、go to the hospital = 病院に行く。", "id": "s1_165", "body_ruby": "高熱《こうねつ》が下《さ》がらなかったので、母《はは》が車《くるま》で町《まち》の大《おお》きな<hospital>に連《つ》れて行《い》ってくれて、医師《いし》の診察《しんさつ》を受《う》けた。", "choices_ruby": ["病院《びょういん》", "薬局《やっきょく》", "図書館《としょかん》", "美容院《びよういん》"], "explanation_ruby": "go to hospital = 入院《にゅういん》、go to the hospital = 病院《びょういん》に行《い》く。", "body_kana": "こうねつがさがらなかったので、ははがくるまでまちのおおきな<hospital>につれていってくれて、いしのしんさつをうけた。"}, {"word": "hot", "meaning_jp": "暑い、熱い", "pos": "形", "body": "今日の最高気温は35度を超えて、エアコンが効かない教室は<hot>くて、生徒たちはみんな汗だくになっていた。", "choices": ["暑い", "寒い", "涼しい", "暖かい"], "correct_index": 0, "explanation": "cold(寒い)の対。「辛い」の意味もある(spicy)。", "id": "s1_166", "body_ruby": "今日《きょう》の最高気温《さいこうきおん》は35度《ど》を超《こ》えて、エアコンが効《き》かない教室《きょうしつ》は<hot>くて、生徒《せいと》たちはみんな汗《あせ》だくになっていた。", "choices_ruby": ["暑《あつ》い", "寒《さむ》い", "涼《すず》しい", "暖《あたた》かい"], "explanation_ruby": "cold(寒《さむ》い)の対《つい》。「辛《から》い」の意味《いみ》もある(spicy)。", "body_kana": "きょうのさいこうきおんは35どをこえて、エアコンがきかないきょうしつは<hot>くて、せいとたちはみんなあせだくになっていた。"}, {"word": "house", "meaning_jp": "家", "pos": "名", "body": "私の<house>は2階建てで、屋根が赤くて庭には桜の木が植えてある。", "choices": ["家", "車", "ビル", "テント"], "correct_index": 0, "explanation": "home(家庭的意味)よりも建物としての「家」。", "id": "s1_167", "body_ruby": "私《わたし》の<house>は2階《かい》建《た》てで、屋根《やね》が赤《あか》くて庭《にわ》には桜《さくら》の木《き》が植《う》えてある。", "choices_ruby": ["家《いえ》", "車《くるま》", "ビル", "テント"], "explanation_ruby": "home(家庭的《かていてき》意味《いみ》)よりも建物《たてもの》としての「家《いえ》」。", "body_kana": "わたしの<house>は2階たてで、やねがあかくてにわにはさくらのきがうえてある。"}, {"word": "hungry", "meaning_jp": "お腹が空いた", "pos": "形", "body": "朝ごはんを抜いて学校に来たので、4時間目には我慢できないほど<hungry>になって、お腹がぐうぐう鳴った。", "choices": ["お腹が空いた", "満腹の", "眠い", "疲れた"], "correct_index": 0, "explanation": "full(満腹)の対。I'm hungry. = お腹空いた。", "id": "s1_168", "body_ruby": "朝《あさ》ごはんを抜《ぬ》いて学校《がっこう》に来《き》たので、4時間目《じかんめ》には我慢《がまん》できないほど<hungry>になって、お腹《なか》がぐうぐう鳴《な》った。", "choices_ruby": ["お腹《なか》が空《す》いた", "満腹《まんぷく》の", "眠《ねむ》い", "疲《つか》れた"], "explanation_ruby": "full(満腹《まんぷく》)の対《つい》。I'm hungry. = お腹《なか》空《す》いた。", "body_kana": "あさごはんをぬいてがっこうにきたので、4時間目にはがまんできないほど<hungry>になって、おなかがぐうぐうなった。"}, {"word": "India", "meaning_jp": "インド", "pos": "名", "body": "カレーやヨガで有名な国、<India>は世界で2番目に人口が多く、ガンジス川という大きな川が流れている。", "choices": ["インド", "中国", "韓国", "タイ"], "correct_index": 0, "explanation": "南アジアの大国。Indian(インド人・インドの)。", "id": "s1_169", "body_ruby": "カレーやヨガで有名《ゆうめい》な国《くに》、<India>は世界《せかい》で2番目《ばんめ》に人口《じんこう》が多《おお》く、ガンジス川《かわ》という大《おお》きな川《かわ》が流《なが》れている。", "choices_ruby": ["インド", "中国《ちゅうごく》", "韓国《かんこく》", "タイ"], "explanation_ruby": "南《みなみ》アジアの大国《たいこく》。Indian(インド人《ひと》・インドの)。", "body_kana": "カレーやヨガでゆうめいなくに、<India>はせかいで2番目にじんこうがおおく、ガンジスかわというおおきなかわがながれている。"}, {"word": "interesting", "meaning_jp": "面白い、興味深い", "pos": "形", "body": "昨日読み始めた推理小説は、犯人がなかなか分からないストーリーで、最後まで<interesting>くて一晩で読み切ってしまった。", "choices": ["面白い", "つまらない", "短い", "難しい"], "correct_index": 0, "explanation": "interest(興味)+ -ing。boring(退屈)の対。", "id": "s1_170", "body_ruby": "昨日《きのう》｜読み始《よみはじ》めた推理小説《すいりしょうせつ》は、犯人《はんにん》がなかなか分《わ》からないストーリーで、最後《さいご》まで<interesting>くて一晩《ひとばん》で読《よ》み切《き》ってしまった。", "choices_ruby": ["面白《おもしろ》い", "つまらない", "短《みじか》い", "難《むずか》しい"], "explanation_ruby": "interest(興味《きょうみ》)+ -ing。boring(退屈《たいくつ》)の対《つい》。", "body_kana": "きのうよみはじめたすいりしょうせつは、はんにんがなかなかわからないストーリーで、さいごまで<interesting>くてひとばんでよみきってしまった。"}, {"word": "January", "meaning_jp": "1月", "pos": "名", "body": "1年が始まる<January>には、お正月のお祝いや初詣など、寒い中でも家族で外出する伝統行事がたくさんある。", "choices": ["1月", "2月", "12月", "3月"], "correct_index": 0, "explanation": "ローマ神話の門の神 Janus(両面神)が語源。", "id": "s1_171", "body_ruby": "1年《ねん》が始《はじ》まる<January>には、お正月《しょうがつ》のお祝《いわ》いや初詣《はつもうで》など、寒《さむ》い中《なか》でも家族《かぞく》で外出《がいしゅつ》する伝統《でんとう》行事《ぎょうじ》がたくさんある。", "choices_ruby": ["1月《がつ》", "2月《がつ》", "12月《がつ》", "3月《がつ》"], "explanation_ruby": "ローマ神話《しんわ》の門《もん》の神《かみ》 Janus(両面《りょうめん》神《かみ》)が語源《ごげん》。", "body_kana": "1年がはじまる<January>には、おしょうがつのおいわいやはつもうでなど、さむいなかでもかぞくでがいしゅつするでんとうぎょうじがたくさんある。"}, {"word": "Japan", "meaning_jp": "日本", "pos": "名", "body": "私たちが住んでいる<Japan>は、北海道から沖縄まで南北に細長い島国で、人口は約1億2千万人だ。アジアの東に位置する。", "choices": ["日本", "中国", "韓国", "台湾"], "correct_index": 0, "explanation": "Japanese = 日本の・日本人・日本語。", "id": "s1_172", "body_ruby": "私《わたし》たちが住《す》んでいる<Japan>は、北海道《ほっかいどう》から沖縄《おきなわ》まで南北《なんぼく》に細長《ほそなが》い島《しま》国《くに》で、人口《じんこう》は約《やく》1億《おく》2千万人《せんまんにん》だ。アジアの東《ひがし》に位置《いち》する。", "choices_ruby": ["日本《にっぽん》", "中国《ちゅうごく》", "韓国《かんこく》", "台湾《たいわん》"], "explanation_ruby": "Japanese = 日本《にっぽん》の・日本人《にほんじん》・日本語《にほんご》。", "body_kana": "わたしたちがすんでいる<Japan>は、ほっかいどうからおきなわまでなんぼくにほそながいしまくにで、じんこうはやく1おく2せんまんにんだ。アジアのひがしにいちする。"}, {"word": "Japanese", "meaning_jp": "日本語、日本の", "pos": "名/形", "body": "外国人観光客に道を尋ねられたが、英語が話せなかったので、ジェスチャーを交えて<Japanese>で説明した。日本で使われる言葉だ。", "choices": ["日本語", "英語", "中国語", "韓国語"], "correct_index": 0, "explanation": "国名 Japan + -ese。「日本人」「日本料理」などの意味も。", "id": "s1_173", "body_ruby": "外国人《がいこくじん》観光客《かんこうきゃく》に道《みち》を尋《たず》ねられたが、英語《えいご》が話《はな》せなかったので、ジェスチャーを交《まじ》えて<Japanese>で説明《せつめい》した。日本《にっぽん》で使《つか》われる言葉《ことば》だ。", "choices_ruby": ["日本語《にほんご》", "英語《えいご》", "中国語《ちゅうごくご》", "韓国語《かんこくご》"], "explanation_ruby": "国名《こくめい》 Japan + -ese。「日本人《にほんじん》」「日本料理《にほんりょうり》」などの意味《いみ》も。", "body_kana": "がいこくじんかんこうきゃくにみちをたずねられたが、えいごがはなせなかったので、ジェスチャーをまじえて<Japanese>でせつめいした。にっぽんでつかわれることばだ。"}, {"word": "join", "meaning_jp": "参加する、加わる", "pos": "動", "body": "中学に入学して、運動と仲間が好きな私はサッカー部に<join>した。", "choices": ["参加する", "やめる", "見る", "離れる"], "correct_index": 0, "explanation": "Join us! = 一緒にやろう。", "id": "s1_174", "body_ruby": "中学《ちゅうがく》に入学《にゅうがく》して、運動《うんどう》と仲間《なかま》が好《す》きな私《わたし》はサッカー部《ぶ》に<join>した。", "choices_ruby": ["参加《さんか》する", "やめる", "見《み》る", "離《はな》れる"], "explanation_ruby": "Join us! = 一緒《いっしょ》にやろう。", "body_kana": "ちゅうがくににゅうがくして、うんどうとなかまがすきなわたしはサッカーぶに<join>した。"}, {"word": "July", "meaning_jp": "7月", "pos": "名", "body": "夏休みが始まる<July>には海の日があり、家族で海水浴やキャンプに出かける家庭が多い。", "choices": ["7月", "6月", "8月", "9月"], "correct_index": 0, "explanation": "ローマ皇帝 Julius Caesar が由来。", "id": "s1_175", "body_ruby": "夏休《なつやす》みが始《はじ》まる<July>には海《うみ》の日《ひ》があり、家族《かぞく》で海水浴《かいすいよく》やキャンプに出《で》かける家庭《かてい》が多《おお》い。", "choices_ruby": ["7月《がつ》", "6月《がつ》", "8月《がつ》", "9月《がつ》"], "explanation_ruby": "ローマ皇帝《こうてい》 Julius Caesar が由来《ゆらい》。", "body_kana": "なつやすみがはじまる<July>にはうみのひがあり、かぞくでかいすいよくやキャンプにでかけるかていがおおい。"}, {"word": "jump", "meaning_jp": "跳ぶ", "pos": "動", "body": "体育の授業で、両足を揃えて踏切板の上から思い切り<jump>して、1メートル50センチの高さを軽々と越えた。", "choices": ["跳ぶ", "歩く", "走る", "座る"], "correct_index": 0, "explanation": "high jump(走り高跳び)、long jump(走り幅跳び)。", "id": "s1_176", "body_ruby": "体育《たいいく》の授業《じゅぎょう》で、両足《りょうあし》を揃《そろ》えて踏切《ふみきり》板《いた》の上《うえ》から｜思い切《おもいき》り<jump>して、1メートル50センチの高《たか》さを軽々《かるがる》と越《こ》えた。", "choices_ruby": ["跳《と》ぶ", "歩《ある》く", "走《はし》る", "座《すわ》る"], "explanation_ruby": "high jump(走《はし》り高跳《たかとび》び)、long jump(走《はし》り幅跳《はばとび》び)。", "body_kana": "たいいくのじゅぎょうで、りょうあしをそろえてふみきりいたのうえからおもいきり<jump>して、1メートル50センチのたかさをかるがるとこえた。"}, {"word": "June", "meaning_jp": "6月", "pos": "名", "body": "梅雨の時期にあたる<June>は、毎日のように小雨が降り続け、傘を学校に置きっぱなしにしている友達が多い。", "choices": ["6月", "5月", "7月", "8月"], "correct_index": 0, "explanation": "ローマ神話の女神 Juno が由来。", "id": "s1_177", "body_ruby": "梅雨《つゆ》の時期《じき》にあたる<June>は、毎日《まいにち》のように小雨《こさめ》が降《お》り続《つづ》け、傘《かさ》を学校《がっこう》に置《お》きっぱなしにしている友達《ともだち》が多《おお》い。", "choices_ruby": ["6月《がつ》", "5月《がつ》", "7月《がつ》", "8月《がつ》"], "explanation_ruby": "ローマ神話《しんわ》の女神《めがみ》 Juno が由来《ゆらい》。", "body_kana": "つゆのじきにあたる<June>は、まいにちのようにこさめがおりつづけ、かさをがっこうにおきっぱなしにしているともだちがおおい。"}, {"word": "kind", "meaning_jp": "親切な、種類", "pos": "形/名", "body": "電車で重い荷物を持ったおばあさんに席を譲り、降りる時にエレベーターまで案内してあげた彼は、本当に<kind>な人だ。", "choices": ["親切な", "意地悪な", "怒った", "悲しい"], "correct_index": 0, "explanation": "「種類」の意味もある(what kind of ~?)。多義語。", "id": "s1_178", "body_ruby": "電車《でんしゃ》で重《おも》い荷物《にもつ》を持《も》ったおばあさんに席《せき》を譲《ゆず》り、降《お》りる時《とき》にエレベーターまで案内《あんない》してあげた彼《かれ》は、本当《ほんとう》に<kind>な人《ひと》だ。", "choices_ruby": ["親切《しんせつ》な", "意地悪《いじわる》な", "怒《いか》った", "悲《かな》しい"], "explanation_ruby": "「種類《しゅるい》」の意味《いみ》もある(what kind of ~?)。多義《たぎ》語《ご》。", "body_kana": "でんしゃでおもいにもつをもったおばあさんにせきをゆずり、おりるときにエレベーターまであんないしてあげたかれは、ほんとうに<kind>なひとだ。"}, {"word": "kite", "meaning_jp": "凧", "pos": "名", "body": "お正月に、紙と竹で作った大きな<kite>を持って広い公園に行き、糸を引きながら走って空高く飛ばした。風で揚げる遊び道具だ。", "choices": ["凧", "風船", "飛行機", "鳥"], "correct_index": 0, "explanation": "fly a kite = 凧を揚げる。", "id": "s1_179", "body_ruby": "お正月《しょうがつ》に、紙《かみ》と竹《たけ》で作《つく》った大《おお》きな<kite>を持《も》って広《ひろ》い公園《こうえん》に行《い》き、糸《いと》を引《ひ》きながら走《はし》って空《そら》高《たか》く飛《と》ばした。風《かぜ》で揚《あ》げる遊《あそ》び道具《どうぐ》だ。", "choices_ruby": ["凧《たこ》", "風船《ふうせん》", "飛行機《ひこうき》", "鳥《とり》"], "explanation_ruby": "fly a kite = 凧《たこ》を揚《あ》げる。", "body_kana": "おしょうがつに、かみとたけでつくったおおきな<kite>をもってひろいこうえんにいき、いとをひきながらはしってそらたかくとばした。かぜであげるあそびどうぐだ。"}, {"word": "know", "meaning_jp": "知っている", "pos": "動", "body": "彼女はクラスのみんなの誕生日を全員<know>しているので、誰の誕生日が近いか聞けばすぐ教えてくれる。", "choices": ["知っている", "忘れている", "聞く", "話す"], "correct_index": 0, "explanation": "k は発音しない(know = ノウ)。know-knew-known。", "id": "s1_180", "body_ruby": "彼女《かのじょ》はクラスのみんなの誕生日《たんじょうび》を全員《ぜんいん》<know>しているので、誰《だれ》の誕生日《たんじょうび》が近《ちか》いか聞《き》けばすぐ教《おし》えてくれる。", "choices_ruby": ["知《し》っている", "忘《わす》れている", "聞《き》く", "話《はな》す"], "explanation_ruby": "k は発音《はつおん》しない(know = ノウ)。know-knew-known。", "body_kana": "かのじょはクラスのみんなのたんじょうびをぜんいん<know>しているので、だれのたんじょうびがちかいかきけばすぐおしえてくれる。"}, {"word": "language", "meaning_jp": "言語、言葉", "pos": "名", "body": "世界には英語、日本語、中国語、スペイン語、フランス語など、約7000もの<language>があり、それぞれ独自の発音と文字を持っている。", "choices": ["言語", "国", "文化", "宗教"], "correct_index": 0, "explanation": "foreign language(外国語)、sign language(手話)。", "id": "s1_181", "body_ruby": "世界《せかい》には英語《えいご》、日本語《にほんご》、中国語《ちゅうごくご》、スペイン語《ご》、フランス語《ご》など、約《やく》7000もの<language>があり、それぞれ独自《どくじ》の発音《はつおん》と文字《もじ》を持《も》っている。", "choices_ruby": ["言語《げんご》", "国《くに》", "文化《ぶんか》", "宗教《しゅうきょう》"], "explanation_ruby": "foreign language(外国語《がいこくご》)、sign language(手話《しゅわ》)。", "body_kana": "せかいにはえいご、にほんご、ちゅうごくご、スペインご、フランスごなど、やく7000もの<language>があり、それぞれどくじのはつおんともじをもっている。"}, {"word": "late", "meaning_jp": "遅い、遅れた", "pos": "形", "body": "今朝、目覚まし時計が鳴らなかったせいで20分も寝坊し、結果として学校の朝の会に<late>してしまい、先生に厳しく注意された。", "choices": ["遅れた", "早い", "速い", "急いだ"], "correct_index": 0, "explanation": "early(早い)の対。「故〜」の意味もある(late grandfather)。", "id": "s1_182", "body_ruby": "今朝《けさ》、目覚《めざ》まし時計《とけい》が鳴《な》らなかったせいで20分《ふん》も寝坊《ねぼう》し、結果《けっか》として学校《がっこう》の朝《あさ》の会《かい》に<late>してしまい、先生《せんせい》に厳《きび》しく注意《ちゅうい》された。", "choices_ruby": ["遅《おく》れた", "早《はや》い", "速《はや》い", "急《いそ》いだ"], "explanation_ruby": "early(早《はや》い)の対《つい》。「故《ゆえ》〜」の意味《いみ》もある(late grandfather)。", "body_kana": "けさ、めざましとけいがならなかったせいで20分もねぼうし、けっかとしてがっこうのあさのかいに<late>してしまい、せんせいにきびしくちゅういされた。"}, {"word": "learn", "meaning_jp": "学ぶ", "pos": "動", "body": "私は最近、ピアノ教室に通って、楽譜の読み方や指の動かし方を週1回先生から<learn>している。", "choices": ["学ぶ", "教える", "忘れる", "遊ぶ"], "correct_index": 0, "explanation": "study(勉強する)と似ているが、結果として身につくニュアンス。", "id": "s1_183", "body_ruby": "私《わたし》は最近《さいきん》、ピアノ教室《きょうしつ》に通《かよ》って、楽譜《がくふ》の｜読み方《よみかた》や指《ゆび》の動《うご》かし方《ほう》を週《しゅう》1回《かい》先生《せんせい》から<learn>している。", "choices_ruby": ["学《まな》ぶ", "教《おし》える", "忘《わす》れる", "遊《あそ》ぶ"], "explanation_ruby": "study(勉強《べんきょう》する)と似《に》ているが、結果《けっか》として身《み》につくニュアンス。", "body_kana": "わたしはさいきん、ピアノきょうしつにかよって、がくふのよみかたやゆびのうごかしほうをしゅう1回せんせいから<learn>している。"}, {"word": "leave", "meaning_jp": "去る、出発する", "pos": "動", "body": "今朝、いつもの電車に乗るために、家を朝7時半ちょうどに<leave>した。", "choices": ["去る", "戻る", "残る", "止まる"], "correct_index": 0, "explanation": "leave-left-left。「置いていく」「残す」の意味もある。", "id": "s1_184", "body_ruby": "今朝《けさ》、いつもの電車《でんしゃ》に乗《の》るために、家《いえ》を朝《あさ》7時半《じはん》ちょうどに<leave>した。", "choices_ruby": ["去《さ》る", "戻《もど》る", "残《のこ》る", "止《と》まる"], "explanation_ruby": "leave-left-left。「置《お》いていく」「残《のこ》す」の意味《いみ》もある。", "body_kana": "けさ、いつものでんしゃにのるために、いえをあさ7時半ちょうどに<leave>した。"}, {"word": "leg", "meaning_jp": "脚", "pos": "名", "body": "サッカーの試合で相手選手とぶつかって転んでしまい、左の<leg>のひざ上に青あざができて、しばらくは曲げると痛かった。", "choices": ["脚", "腕", "首", "腰"], "correct_index": 0, "explanation": "foot(足首から下)と区別。crab legs = カニの脚。", "id": "s1_185", "body_ruby": "サッカーの試合《しあい》で相手選手《あいてせんしゅ》とぶつかって転《ころ》んでしまい、左《ひだり》の<leg>のひざ上《うえ》に青《あお》あざができて、しばらくは曲《ま》げると痛《いた》かった。", "choices_ruby": ["脚《あし》", "腕《うで》", "首《くび》", "腰《こし》"], "explanation_ruby": "foot(足首《あしくび》から下《した》)と区別《くべつ》。crab legs = カニの脚《あし》。", "body_kana": "サッカーのしあいであいてせんしゅとぶつかってころんでしまい、ひだりの<leg>のひざうえにあおあざができて、しばらくはまげるといたかった。"}, {"word": "let's", "meaning_jp": "〜しよう", "pos": "助", "body": "週末に映画を見に行こうと友達を誘いたかったので、「<let's>go to the movies」とメッセージを送った。", "choices": ["〜しよう", "〜しない", "〜したい", "〜できる"], "correct_index": 0, "explanation": "let us の短縮。Let's go! = 行こう!", "id": "s1_186", "body_ruby": "週末《しゅうまつ》に映画《えいが》を｜見に行《みにい》こうと友達《ともだち》を誘《さそ》いたかったので、「<let's>go to the movies」とメッセージを送《おく》った。", "choices_ruby": ["〜しよう", "〜しない", "〜したい", "〜できる"], "explanation_ruby": "let us の短縮《たんしゅく》。Let's go! = 行《い》こう!", "body_kana": "しゅうまつにえいがをみにいこうとともだちをさそいたかったので、「<let's>go to the movies」とメッセージをおくった。"}, {"word": "letter", "meaning_jp": "手紙", "pos": "名", "body": "祖母の誕生日に、感謝の気持ちを便箋3枚にペンで書いた<letter>を、切手を貼って郵便ポストに入れた。文章で気持ちを伝える紙だ。", "choices": ["手紙", "本", "ノート", "封筒"], "correct_index": 0, "explanation": "「文字」の意味もある(英語の26 letters)。", "id": "s1_187", "body_ruby": "祖母《そぼ》の誕生日《たんじょうび》に、感謝《かんしゃ》の気持《きも》ちを便箋《びんせん》3枚《まい》にペンで書《か》いた<letter>を、切手《きって》を貼《は》って郵便《ゆうびん》ポストに入《い》れた。文章《ぶんしょう》で気持《きも》ちを伝《つた》える紙《かみ》だ。", "choices_ruby": ["手紙《てがみ》", "本《ほん》", "ノート", "封筒《ふうとう》"], "explanation_ruby": "「文字《もじ》」の意味《いみ》もある(英語《えいご》の26 letters)。", "body_kana": "そぼのたんじょうびに、かんしゃのきもちをびんせん3枚にペンでかいた<letter>を、きってをはってゆうびんポストにいれた。ぶんしょうできもちをつたえるかみだ。"}, {"word": "library", "meaning_jp": "図書館", "pos": "名", "body": "テスト前は静かに勉強したいので、3万冊の本がある町の<library>に行って、参考書を借りて読んでいる。", "choices": ["図書館", "本屋", "学校", "塾"], "correct_index": 0, "explanation": "本屋(bookstore)は買う場所、library は借りる場所。", "id": "s1_188", "body_ruby": "テスト前《まえ》は静《しず》かに勉強《べんきょう》したいので、3万冊《まんさつ》の本《ほん》がある町《まち》の<library>に行《い》って、参考書《さんこうしょ》を借《か》りて読《よ》んでいる。", "choices_ruby": ["図書館《としょかん》", "本屋《ほんや》", "学校《がっこう》", "塾《じゅく》"], "explanation_ruby": "本屋《ほんや》(bookstore)は買《か》う場所《ばしょ》、library は借《か》りる場所《ばしょ》。", "body_kana": "テストまえはしずかにべんきょうしたいので、3まんさつのほんがあるまちの<library>にいって、さんこうしょをかりてよんでいる。"}, {"word": "life", "meaning_jp": "生活、人生、命", "pos": "名", "body": "祖父は80年の長い<life>の中で、戦争・高度成長・平成・令和と4つの時代を経験した。", "choices": ["人生", "学校", "仕事", "家"], "correct_index": 0, "explanation": "live(生きる)の名詞形。daily life = 日常生活。", "id": "s1_189", "body_ruby": "祖父《そふ》は80年《ねん》の長《なが》い<life>の中《なか》で、戦争《せんそう》・高度成長《こうどせいちょう》・平成《へいせい》・令和《れいわ》と4つの時代《じだい》を経験《けいけん》した。", "choices_ruby": ["人生《じんせい》", "学校《がっこう》", "仕事《しごと》", "家《いえ》"], "explanation_ruby": "live(生《い》きる)の名詞《めいし》形《かたち》。daily life = 日常生活《にちじょうせいかつ》。", "body_kana": "そふは80年のながい<life>のなかで、せんそう・こうどせいちょう・へいせい・れいわと4つのじだいをけいけんした。"}, {"word": "like", "meaning_jp": "好き", "pos": "動", "body": "私は学校の中で、音楽の授業と体育の授業を特に<like>している。", "choices": ["好き", "嫌い", "怖い", "退屈"], "correct_index": 0, "explanation": "love(愛する)より軽い「好き」。前置詞では「〜のような」。", "id": "s1_190", "body_ruby": "私《わたし》は学校《がっこう》の中《なか》で、音楽《おんがく》の授業《じゅぎょう》と体育《たいいく》の授業《じゅぎょう》を特《とく》に<like>している。", "choices_ruby": ["好《す》き", "嫌《きら》い", "怖《こわ》い", "退屈《たいくつ》"], "explanation_ruby": "love(愛《あい》する)より軽《かる》い「好《す》き」。前置詞《ぜんちし》では「〜のような」。", "body_kana": "わたしはがっこうのなかで、おんがくのじゅぎょうとたいいくのじゅぎょうをとくに<like>している。"}, {"word": "listen", "meaning_jp": "(注意して)聞く", "pos": "動", "body": "毎日寝る前にベッドで、お気に入りの歌手のCDをイヤホンで30分<listen>している。", "choices": ["聞く", "見る", "話す", "歌う"], "correct_index": 0, "explanation": "t は発音しない(listen=リスン)。hear(聞こえる)と区別。", "id": "s1_191", "body_ruby": "毎日《まいにち》寝《ね》る前《まえ》にベッドで、お気《き》に入《い》りの歌手《かしゅ》のCDをイヤホンで30分《ふん》<listen>している。", "choices_ruby": ["聞《き》く", "見《み》る", "話《はな》す", "歌《うた》う"], "explanation_ruby": "t は発音《はつおん》しない(listen=リスン)。hear(聞《き》こえる)と区別《くべつ》。", "body_kana": "まいにちねるまえにベッドで、おきにいりのかしゅのCDをイヤホンで30分<listen>している。"}, {"word": "live", "meaning_jp": "住む、生きる", "pos": "動", "body": "私は東京で生まれてから今までずっと、同じ町の同じマンションに家族と<live>している。", "choices": ["住む", "去る", "訪れる", "通う"], "correct_index": 0, "explanation": "live in 〜 = 〜に住んでいる。形容詞では「生(なま)の」。", "id": "s1_192", "body_ruby": "私《わたし》は東京《とうきょう》で生《う》まれてから今《いま》までずっと、同《おな》じ町《まち》の同《おな》じマンションに家族《かぞく》と<live>している。", "choices_ruby": ["住《す》む", "去《さ》る", "訪《おとず》れる", "通《かよ》う"], "explanation_ruby": "live in 〜 = 〜に住《す》んでいる。形容詞《けいようし》では「生《なま》(なま)の」。", "body_kana": "わたしはとうきょうでうまれてからいままでずっと、おなじまちのおなじマンションにかぞくと<live>している。"}, {"word": "London", "meaning_jp": "ロンドン", "pos": "名", "body": "イギリスの首都<London>は、テムズ川が流れ、ビッグベンや国会議事堂で有名な、歴史ある世界的な大都市だ。", "choices": ["ロンドン", "パリ", "ローマ", "ベルリン"], "correct_index": 0, "explanation": "英国の首都。Big Ben(ビッグベン)で有名。", "id": "s1_193", "body_ruby": "イギリスの首都《しゅと》<London>は、テムズ川《かわ》が流《なが》れ、ビッグベンや国会議事堂《こっかいぎじどう》で有名《ゆうめい》な、歴史《れきし》ある世界的《せかいてき》な大都市《だいとし》だ。", "choices_ruby": ["ロンドン", "パリ", "ローマ", "ベルリン"], "explanation_ruby": "英国《えいこく》の首都《しゅと》。Big Ben(ビッグベン)で有名《ゆうめい》。", "body_kana": "イギリスのしゅと<London>は、テムズかわがながれ、ビッグベンやこっかいぎじどうでゆうめいな、れきしあるせかいてきなだいとしだ。"}, {"word": "long", "meaning_jp": "長い", "pos": "形", "body": "夏休みは7月20日から8月31日まで40日以上もあって、1年で一番<long>な休みだ。", "choices": ["長い", "短い", "重い", "細い"], "correct_index": 0, "explanation": "short(短い)の対。距離・時間どちらにも使う。", "id": "s1_194", "body_ruby": "夏休《なつやす》みは7月《がつ》20日《にち》から8月《がつ》31日《にち》まで40日《にち》以上《いじょう》もあって、1年《ねん》で一番《いちばん》<long>な休《やす》みだ。", "choices_ruby": ["長《なが》い", "短《みじか》い", "重《おも》い", "細《こま》い"], "explanation_ruby": "short(短《みじか》い)の対《つい》。距離《きょり》・時間《じかん》どちらにも使《つか》う。", "body_kana": "なつやすみは7月20日から8月31日まで40日いじょうもあって、1年でいちばん<long>なやすみだ。"}, {"word": "look", "meaning_jp": "見る", "pos": "動", "body": "夜空にとても明るい星が出ていたので、家族でベランダに出てみんなで5分間じっと<look>した。", "choices": ["見る", "話す", "走る", "止まる"], "correct_index": 0, "explanation": "look at = 〜を見る。see(見える)と区別。", "id": "s1_195", "body_ruby": "夜《よる》空《そら》にとても明《あか》るい星《ほし》が出《で》ていたので、家族《かぞく》でベランダに出《で》てみんなで5分間《ふんかん》じっと<look>した。", "choices_ruby": ["見《み》る", "話《はな》す", "走《はし》る", "止《と》まる"], "explanation_ruby": "look at = 〜を見《み》る。see(見《み》える)と区別《くべつ》。", "body_kana": "よるそらにとてもあかるいほしがでていたので、かぞくでベランダにでてみんなで5分間じっと<look>した。"}, {"word": "luck", "meaning_jp": "運", "pos": "名", "body": "テストでヤマが当たって、勉強した範囲だけが出題された。今日の<luck>に感謝した。", "choices": ["運", "努力", "勉強", "練習"], "correct_index": 0, "explanation": "Good luck! = 頑張って!。lucky(幸運な)。", "id": "s1_196", "body_ruby": "テストでヤマが当《あ》たって、勉強《べんきょう》した範囲《はんい》だけが出題《しゅつだい》された。今日《きょう》の<luck>に感謝《かんしゃ》した。", "choices_ruby": ["運《うん》", "努力《どりょく》", "勉強《べんきょう》", "練習《れんしゅう》"], "explanation_ruby": "Good luck! = 頑張《がんば》って!。lucky(幸運《こううん》な)。", "body_kana": "テストでヤマがあたって、べんきょうしたはんいだけがしゅつだいされた。きょうの<luck>にかんしゃした。"}, {"word": "lunch", "meaning_jp": "昼食", "pos": "名", "body": "学校では12時半から1時まで、母が朝作ってくれたお弁当を教室で広げて<lunch>を食べる。", "choices": ["昼食", "朝食", "夕食", "夜食"], "correct_index": 0, "explanation": "school lunch(給食)、lunch box(弁当箱)。", "id": "s1_197", "body_ruby": "学校《がっこう》では12時半《じはん》から1時《じ》まで、母《はは》が朝《あさ》作《つく》ってくれたお弁当《べんとう》を教室《きょうしつ》で広《ひろ》げて<lunch>を食《た》べる。", "choices_ruby": ["昼食《ちゅうしょく》", "朝食《ちょうしょく》", "夕食《ゆうしょく》", "夜食《やしょく》"], "explanation_ruby": "school lunch(給食《きゅうしょく》)、lunch box(弁当箱《べんとうばこ》)。", "body_kana": "がっこうでは12時半から1時まで、ははがあさつくってくれたおべんとうをきょうしつでひろげて<lunch>をたべる。"}, {"word": "made", "meaning_jp": "作った", "pos": "動", "body": "祖母は私の誕生日に、私の好きな野菜と肉をたっぷり入れたカレーを2時間かけて<made>した。", "choices": ["作った", "壊した", "買った", "売った"], "correct_index": 0, "explanation": "make の過去形。make-made-made。", "id": "s1_198", "body_ruby": "祖母《そぼ》は私《わたし》の誕生日《たんじょうび》に、私《わたし》の好《す》きな野菜《やさい》と肉《にく》をたっぷり入《い》れたカレーを2時間《じかん》かけて<made>した。", "choices_ruby": ["作《つく》った", "壊《こわ》した", "買《か》った", "売《う》った"], "explanation_ruby": "make の過去形《かこけい》。make-made-made。", "body_kana": "そぼはわたしのたんじょうびに、わたしのすきなやさいとにくをたっぷりいれたカレーを2時間かけて<made>した。"}, {"word": "man", "meaning_jp": "男性", "pos": "名", "body": "電車で立っていた妊婦さんに、スーツを着た背の高い40歳くらいの<man>が、自分の席を譲ってあげていた。", "choices": ["男性", "女性", "少年", "少女"], "correct_index": 0, "explanation": "woman(女性)の対。複数形は men。", "id": "s1_199", "body_ruby": "電車《でんしゃ》で立《た》っていた妊婦《にんぷ》さんに、スーツを着《き》た背《せ》の高《たか》い40歳《さい》くらいの<man>が、自分《じぶん》の席《せき》を譲《ゆず》ってあげていた。", "choices_ruby": ["男性《だんせい》", "女性《じょせい》", "少年《しょうねん》", "少女《しょうじょ》"], "explanation_ruby": "woman(女性《じょせい》)の対《つい》。複数形《ふくすうけい》は men。", "body_kana": "でんしゃでたっていたにんぷさんに、スーツをきたせのたかい40歳くらいの<man>が、じぶんのせきをゆずってあげていた。"}, {"word": "March", "meaning_jp": "3月", "pos": "名", "body": "卒業式が行われる<March>には、冬の終わりで風はまだ冷たいが、桜のつぼみがふくらみ始めて春の訪れを感じる。", "choices": ["3月", "4月", "5月", "2月"], "correct_index": 0, "explanation": "ローマ神話の戦争の神 Mars が由来。", "id": "s1_200", "body_ruby": "卒業式《そつぎょうしき》が行《おこな》われる<March>には、冬《ふゆ》の終《お》わりで風《かぜ》はまだ冷《つめ》たいが、桜《さくら》のつぼみがふくらみ始《はじ》めて春《はる》の訪《おとず》れを感《かん》じる。", "choices_ruby": ["3月《がつ》", "4月《がつ》", "5月《がつ》", "2月《がつ》"], "explanation_ruby": "ローマ神話《しんわ》の戦争《せんそう》の神《かみ》 Mars が由来《ゆらい》。", "body_kana": "そつぎょうしきがおこなわれる<March>には、ふゆのおわりでかぜはまだつめたいが、さくらのつぼみがふくらみはじめてはるのおとずれをかんじる。"}, {"word": "math", "meaning_jp": "数学", "pos": "名", "body": "今日の<math>の授業では、座標平面に直線を引いて、その方程式を求める問題を解いた。", "choices": ["数学", "国語", "英語", "理科"], "correct_index": 0, "explanation": "mathematics の短縮形。", "id": "s1_201", "body_ruby": "今日《きょう》の<math>の授業《じゅぎょう》では、座標《ざひょう》平面《へいめん》に直線《ちょくせん》を引《ひ》いて、その方程式《ほうていしき》を求《もと》める問題《もんだい》を解《と》いた。", "choices_ruby": ["数学《すうがく》", "国語《こくご》", "英語《えいご》", "理科《りか》"], "explanation_ruby": "mathematics の短縮形《たんしゅくけい》。", "body_kana": "きょうの<math>のじゅぎょうでは、ざひょうへいめんにちょくせんをひいて、そのほうていしきをもとめるもんだいをといた。"}, {"word": "mean", "meaning_jp": "意味する", "pos": "動", "body": "外国人観光客が話す「How much?」という英語が何を<mean>しているか分からなかったので、辞書で調べたら「いくら?」だった。", "choices": ["意味する", "話す", "聞く", "書く"], "correct_index": 0, "explanation": "What does ~ mean? = 〜はどういう意味? mean-meant-meant。", "id": "s1_202", "body_ruby": "外国人《がいこくじん》観光客《かんこうきゃく》が話《はな》す「How much?」という英語《えいご》が何《なに》を<mean>しているか分《わ》からなかったので、辞書《じしょ》で調《しら》べたら「いくら?」だった。", "choices_ruby": ["意味《いみ》する", "話《はな》す", "聞《き》く", "書《か》く"], "explanation_ruby": "What does ~ mean? = 〜はどういう意味《いみ》? mean-meant-meant。", "body_kana": "がいこくじんかんこうきゃくがはなす「How much?」というえいごがなにを<mean>しているかわからなかったので、じしょでしらべたら「いくら?」だった。"}, {"word": "meet", "meaning_jp": "会う", "pos": "動", "body": "中学が別れて以来、小学校の親友とは何ヶ月も顔を合わせていなかったが、来週の土曜日にようやく2年ぶりに駅前のカフェで<meet>することになった。", "choices": ["会う", "別れる", "話す", "見る"], "correct_index": 0, "explanation": "Nice to meet you. = はじめまして。meet-met-met。", "id": "s1_203", "body_ruby": "中学《ちゅうがく》が別《わか》れて以来《いらい》、小学校《しょうがっこう》の親友《しんゆう》とは何ヶ月《なんかげつ》も顔《かお》を合《あ》わせていなかったが、来週《らいしゅう》の土曜日《どようび》にようやく2年《ねん》ぶりに駅前《えきまえ》のカフェで<meet>することになった。", "choices_ruby": ["会《あ》う", "別《わか》れる", "話《はな》す", "見《み》る"], "explanation_ruby": "Nice to meet you. = はじめまして。meet-met-met。", "body_kana": "ちゅうがくがわかれていらい、しょうがっこうのしんゆうとはなんかげつもかおをあわせていなかったが、らいしゅうのどようびにようやく2年ぶりにえきまえのカフェで<meet>することになった。"}, {"word": "met", "meaning_jp": "会った", "pos": "動", "body": "昨日、駅前のカフェで、半年ぶりに小学校の同級生に偶然<met>した。「久しぶり!」と声をかけ合った。", "choices": ["会った", "別れた", "見た", "話した"], "correct_index": 0, "explanation": "meet の過去形。meet-met-met。", "id": "s1_204", "body_ruby": "昨日《きのう》、駅前《えきまえ》のカフェで、半年《はんとし》ぶりに小学校《しょうがっこう》の同級生《どうきゅうせい》に偶然《ぐうぜん》<met>した。「久《ひさ》しぶり!」と声《こえ》をかけ合《あ》った。", "choices_ruby": ["会《あ》った", "別《わか》れた", "見《み》た", "話《はな》した"], "explanation_ruby": "meet の過去形《かこけい》。meet-met-met。", "body_kana": "きのう、えきまえのカフェで、はんとしぶりにしょうがっこうのどうきゅうせいにぐうぜん<met>した。「ひさしぶり!」とこえをかけあった。"}, {"word": "mom", "meaning_jp": "お母さん", "pos": "名", "body": "学校から帰って玄関を開けると、台所から「おかえり!」と<mom>の優しい声が聞こえてきた。母を親しみを込めて呼ぶ言葉だ。", "choices": ["お母さん", "お父さん", "お兄さん", "お姉さん"], "correct_index": 0, "explanation": "mother(母)のくだけた呼び方。mommy はもっと幼い表現。", "id": "s1_205", "body_ruby": "学校《がっこう》から帰《かえ》って玄関《げんかん》を開《ひら》けると、台所《だいどころ》から「おかえり!」と<mom>の優《やさ》しい声《こえ》が聞《き》こえてきた。母《はは》を親《した》しみを込《こ》めて呼《よ》ぶ言葉《ことば》だ。", "choices_ruby": ["お母《かあ》さん", "お父《とう》さん", "お兄《にい》さん", "お姉《ねえ》さん"], "explanation_ruby": "mother(母《はは》)のくだけた｜呼び方《よびかた》。mommy はもっと幼《おさな》い表現《ひょうげん》。", "body_kana": "がっこうからかえってげんかんをひらけると、だいどころから「おかえり!」と<mom>のやさしいこえがきこえてきた。ははをしたしみをこめてよぶことばだ。"}, {"word": "Monday", "meaning_jp": "月曜日", "pos": "名", "body": "週末ゆっくり休んだ後の<Monday>は、また5日間の学校生活が始まると思うと、朝が一番つらい曜日だ。", "choices": ["月曜日", "金曜日", "土曜日", "日曜日"], "correct_index": 0, "explanation": "moon(月)+ day。日曜の次の曜日。", "id": "s1_206", "body_ruby": "週末《しゅうまつ》ゆっくり休《やす》んだ後《のち》の<Monday>は、また5日間《にちかん》の学校生活《がっこうせいかつ》が始《はじ》まると思《おも》うと、朝《あさ》が一番《いちばん》つらい曜日《ようび》だ。", "choices_ruby": ["月曜日《げつようび》", "金曜日《きんようび》", "土曜日《どようび》", "日曜日《にちようび》"], "explanation_ruby": "moon(月《がつ》)+ day。日曜《にちよう》の次《つぎ》の曜日《ようび》。", "body_kana": "しゅうまつゆっくりやすんだのちの<Monday>は、また5日間のがっこうせいかつがはじまるとおもうと、あさがいちばんつらいようびだ。"}, {"word": "monkey", "meaning_jp": "サル", "pos": "名", "body": "動物園で見た茶色の<monkey>は、木の枝から枝へ尻尾を使って素早く跳び移っていた。人間に近い顔をした動物だ。", "choices": ["サル", "クマ", "リス", "犬"], "correct_index": 0, "explanation": "ape(類人猿)とは少し違う。", "id": "s1_207", "body_ruby": "動物園《どうぶつえん》で見《み》た茶色《ちゃいろ》の<monkey>は、木《き》の枝《えだ》から枝《えだ》へ尻尾《しっぽ》を使《つか》って素早《すばや》く跳《と》び移《うつ》っていた。人間《にんげん》に近《ちか》い顔《かお》をした動物《どうぶつ》だ。", "choices_ruby": ["サル", "クマ", "リス", "犬《いぬ》"], "explanation_ruby": "ape(類人猿《るいじんえん》)とは少《すこ》し違《ちが》う。", "body_kana": "どうぶつえんでみたちゃいろの<monkey>は、きのえだからえだへしっぽをつかってすばやくとびうつっていた。にんげんにちかいかおをしたどうぶつだ。"}, {"word": "month", "meaning_jp": "月(暦の)", "pos": "名", "body": "1年は1月から12月までの12個の<month>に分かれていて、それぞれ約30日ある。", "choices": ["月(暦)", "週", "日", "年"], "correct_index": 0, "explanation": "moon(月)が語源。this month = 今月。", "id": "s1_208", "body_ruby": "1年《ねん》は1月《がつ》から12月《がつ》までの12個《こ》の<month>に分《わ》かれていて、それぞれ約《やく》30日《にち》ある。", "choices_ruby": ["月《がつ》(暦《こよみ》)", "週《しゅう》", "日《にち》", "年《ねん》"], "explanation_ruby": "moon(月《がつ》)が語源《ごげん》。this month = 今月《こんげつ》。", "body_kana": "1年は1月から12月までの12個の<month>にわかれていて、それぞれやく30日ある。"}, {"word": "morning", "meaning_jp": "朝", "pos": "名", "body": "毎日<morning>6時に目覚まし時計で起きて、朝食を食べて準備をしてから学校に行く。", "choices": ["朝", "昼", "夕方", "夜"], "correct_index": 0, "explanation": "Good morning! = おはよう。", "id": "s1_209", "body_ruby": "毎日《まいにち》<morning>6時《じ》に目覚《めざ》まし時計《とけい》で起《お》きて、朝食《ちょうしょく》を食《た》べて準備《じゅんび》をしてから学校《がっこう》に行《い》く。", "choices_ruby": ["朝《あさ》", "昼《ひる》", "夕方《ゆうがた》", "夜《よる》"], "explanation_ruby": "Good morning! = おはよう。", "body_kana": "まいにち<morning>6時にめざましとけいでおきて、ちょうしょくをたべてじゅんびをしてからがっこうにいく。"}, {"word": "mother", "meaning_jp": "母", "pos": "名", "body": "私の<mother>は40歳の看護師で、夜勤がある日は朝に帰ってきて、家族のために朝食を作ってから寝る。父と一緒に私を育てた人だ。", "choices": ["母", "父", "祖母", "叔母"], "correct_index": 0, "explanation": "father(父)の対。Mother's Day(母の日)。", "id": "s1_210", "body_ruby": "私《わたし》の<mother>は40歳《さい》の看護《かんご》師《し》で、夜勤《やきん》がある日《ひ》は朝《あさ》に帰《かえ》ってきて、家族《かぞく》のために朝食《ちょうしょく》を作《つく》ってから寝《ね》る。父《ちち》と一緒《いっしょ》に私《わたし》を育《そだ》てた人《ひと》だ。", "choices_ruby": ["母《はは》", "父《ちち》", "祖母《そぼ》", "叔母《おば》"], "explanation_ruby": "father(父《ちち》)の対《つい》。Mother's Day(母《はは》の日《ひ》)。", "body_kana": "わたしの<mother>は40歳のかんごしで、やきんがあるひはあさにかえってきて、かぞくのためにちょうしょくをつくってからねる。ちちといっしょにわたしをそだてたひとだ。"}, {"word": "mountain", "meaning_jp": "山", "pos": "名", "body": "日本で一番高い<mountain>は、標高3776メートルの富士山だ。", "choices": ["山", "海", "川", "野原"], "correct_index": 0, "explanation": "Mt. = Mountain の略。富士山 = Mt. Fuji。", "id": "s1_211", "body_ruby": "日本《にっぽん》で一番《いちばん》高《たか》い<mountain>は、標高《ひょうこう》3776メートルの富士山《ふじさん》だ。", "choices_ruby": ["山《やま》", "海《うみ》", "川《かわ》", "野原《のはら》"], "explanation_ruby": "Mt. = Mountain の略《りゃく》。富士山《ふじさん》 = Mt. Fuji。", "body_kana": "にっぽんでいちばんたかい<mountain>は、ひょうこう3776メートルのふじさんだ。"}, {"word": "mouth", "meaning_jp": "口", "pos": "名", "body": "歯医者で治療してもらう時、椅子を倒して<mouth>を大きく開けたまま、ずっと我慢して待っていた。", "choices": ["口", "目", "耳", "鼻"], "correct_index": 0, "explanation": "mouse(ネズミ)とは綴り違い。", "id": "s1_212", "body_ruby": "歯医者《はいしゃ》で治療《ちりょう》してもらう時《とき》、椅子《いす》を倒《たお》して<mouth>を大《おお》きく開《ひら》けたまま、ずっと我慢《がまん》して待《ま》っていた。", "choices_ruby": ["口《くち》", "目《め》", "耳《みみ》", "鼻《はな》"], "explanation_ruby": "mouse(ネズミ)とは綴《つづ》り違《ちが》い。", "body_kana": "はいしゃでちりょうしてもらうとき、いすをたおして<mouth>をおおきくひらけたまま、ずっとがまんしてまっていた。"}, {"word": "move", "meaning_jp": "動く、引っ越す", "pos": "動", "body": "去年の春、父の転勤で家族全員が東京から大阪へ<move>した。", "choices": ["動く(引っ越す)", "止まる", "戻る", "残る"], "correct_index": 0, "explanation": "movement(動き)、movie(動画=映画)。", "id": "s1_213", "body_ruby": "去年《きょねん》の春《はる》、父《ちち》の転勤《てんきん》で家族全員《かぞくぜんいん》が東京《とうきょう》から大阪《おおさか》へ<move>した。", "choices_ruby": ["動《うご》く(｜引っ越《ひっこ》す)", "止《と》まる", "戻《もど》る", "残《のこ》る"], "explanation_ruby": "movement(動《うご》き)、movie(動画《どうが》=映画《えいが》)。", "body_kana": "きょねんのはる、ちちのてんきんでかぞくぜんいんがとうきょうからおおさかへ<move>した。"}, {"word": "movie", "meaning_jp": "映画", "pos": "名", "body": "週末に友達と駅前の映画館で、2時間半のアクション<movie>を見て、ハラハラドキドキしながら楽しんだ。", "choices": ["映画", "ドラマ", "演劇", "本"], "correct_index": 0, "explanation": "moving picture(動く絵)の略。film とも言う。", "id": "s1_214", "body_ruby": "週末《しゅうまつ》に友達《ともだち》と駅前《えきまえ》の映画館《えいがかん》で、2時間《じかん》半《はん》のアクション<movie>を見《み》て、ハラハラドキドキしながら楽《たの》しんだ。", "choices_ruby": ["映画《えいが》", "ドラマ", "演劇《えんげき》", "本《ほん》"], "explanation_ruby": "moving picture(動《うご》く絵《え》)の略《りゃく》。film とも言《い》う。", "body_kana": "しゅうまつにともだちとえきまえのえいがかんで、2時間はんのアクション<movie>をみて、ハラハラドキドキしながらたのしんだ。"}, {"word": "music", "meaning_jp": "音楽", "pos": "名", "body": "私は宿題をする時、ピアノ曲、ジャズ、ポップス、クラシックなど、その日の気分に合わせて違う<music>をイヤホンで聴きながら集中する。", "choices": ["音楽", "絵", "本", "映画"], "correct_index": 0, "explanation": "musical(音楽の・ミュージカル)、musician(音楽家)。", "id": "s1_215", "body_ruby": "私《わたし》は宿題《しゅくだい》をする時《とき》、ピアノ曲《きょく》、ジャズ、ポップス、クラシックなど、その日《ひ》の気分《きぶん》に合《あ》わせて違《ちが》う<music>をイヤホンで聴《き》きながら集中《しゅうちゅう》する。", "choices_ruby": ["音楽《おんがく》", "絵《え》", "本《ほん》", "映画《えいが》"], "explanation_ruby": "musical(音楽《おんがく》の・ミュージカル)、musician(音楽家《おんがくか》)。", "body_kana": "わたしはしゅくだいをするとき、ピアノきょく、ジャズ、ポップス、クラシックなど、そのひのきぶんにあわせてちがう<music>をイヤホンでききながらしゅうちゅうする。"}, {"word": "musician", "meaning_jp": "音楽家", "pos": "名", "body": "彼の父はオーケストラでバイオリンを弾いている有名な<musician>で、世界中でコンサートを開いている。音楽を職業にしている人だ。", "choices": ["音楽家", "画家", "作家", "建築家"], "correct_index": 0, "explanation": "music + -ian(専門家)。", "id": "s1_216", "body_ruby": "彼《かれ》の父《ちち》はオーケストラでバイオリンを弾《ひ》いている有名《ゆうめい》な<musician>で、世界中《せかいじゅう》でコンサートを開《ひら》いている。音楽《おんがく》を職業《しょくぎょう》にしている人《ひと》だ。", "choices_ruby": ["音楽家《おんがくか》", "画家《がか》", "作家《さっか》", "建築家《けんちくか》"], "explanation_ruby": "music + -ian(専門家《せんもんか》)。", "body_kana": "かれのちちはオーケストラでバイオリンをひいているゆうめいな<musician>で、せかいじゅうでコンサートをひらいている。おんがくをしょくぎょうにしているひとだ。"}, {"word": "name", "meaning_jp": "名前", "pos": "名", "body": "新学期、自己紹介で「私の<name>は山田太郎です」と先生とクラス全員に向けて、はっきり大きな声で言った。人や物を呼ぶ言葉だ。", "choices": ["名前", "顔", "声", "服"], "correct_index": 0, "explanation": "first name(下の名前)、last name(姓)。", "id": "s1_217", "body_ruby": "新学期《しんがっき》、自己紹介《じこしょうかい》で「私《わたし》の<name>は山田《やまだ》太郎《たろう》です」と先生《せんせい》とクラス全員《ぜんいん》に向《む》けて、はっきり大《おお》きな声《こえ》で言《い》った。人《ひと》や物《もの》を呼《よ》ぶ言葉《ことば》だ。", "choices_ruby": ["名前《なまえ》", "顔《かお》", "声《こえ》", "服《ふく》"], "explanation_ruby": "first name(下《した》の名前《なまえ》)、last name(姓《せい》)。", "body_kana": "しんがっき、じこしょうかいで「わたしの<name>はやまだたろうです」とせんせいとクラスぜんいんにむけて、はっきりおおきなこえでいった。ひとやものをよぶことばだ。"}, {"word": "neck", "meaning_jp": "首", "pos": "名", "body": "重いカバンを毎日背負っていたら、<neck>から肩にかけてカチカチに固まってしまい、左右に動かすと鈍い痛みが走るようになった。", "choices": ["首", "肩", "頭", "胸"], "correct_index": 0, "explanation": "necklace = ネックレス(首飾り)。", "id": "s1_218", "body_ruby": "重《おも》いカバンを毎日《まいにち》背負《せお》っていたら、<neck>から肩《かた》にかけてカチカチに固《かた》まってしまい、左右《さゆう》に動《うご》かすと鈍《にぶ》い痛《いた》みが走《はし》るようになった。", "choices_ruby": ["首《くび》", "肩《かた》", "頭《あたま》", "胸《むね》"], "explanation_ruby": "necklace = ネックレス(首飾《くびかざ》り)。", "body_kana": "おもいカバンをまいにちせおっていたら、<neck>からかたにかけてカチカチにかたまってしまい、さゆうにうごかすとにぶいいたみがはしるようになった。"}, {"word": "new", "meaning_jp": "新しい", "pos": "形", "body": "中学に入学した4月、母が買ってくれた<new>な制服とリュックを身につけて、初めて学校の門をくぐった。古くない、最近のものだ。", "choices": ["新しい", "古い", "汚れた", "壊れた"], "correct_index": 0, "explanation": "old(古い)の対。New York(ニューヨーク)。", "id": "s1_219", "body_ruby": "中学《ちゅうがく》に入学《にゅうがく》した4月《がつ》、母《はは》が買《か》ってくれた<new>な制服《せいふく》とリュックを身《み》につけて、初《はじ》めて学校《がっこう》の門《もん》をくぐった。古《ふる》くない、最近《さいきん》のものだ。", "choices_ruby": ["新《あたら》しい", "古《ふる》い", "汚《よご》れた", "壊《こわ》れた"], "explanation_ruby": "old(古《ふる》い)の対《つい》。New York(ニューヨーク)。", "body_kana": "ちゅうがくににゅうがくした4月、ははがかってくれた<new>なせいふくとリュックをみにつけて、はじめてがっこうのもんをくぐった。ふるくない、さいきんのものだ。"}, {"word": "nice", "meaning_jp": "素敵な", "pos": "形", "body": "新しいクラスメイトは、いつも笑顔で挨拶してくれて、困っている人を助けてあげる、本当に<nice>な人だ。", "choices": ["素敵な", "意地悪な", "怖い", "退屈な"], "correct_index": 0, "explanation": "Nice to meet you! = はじめまして。", "id": "s1_220", "body_ruby": "新《あたら》しいクラスメイトは、いつも笑顔《えがお》で挨拶《あいさつ》してくれて、困《こま》っている人《ひと》を助《たす》けてあげる、本当《ほんとう》に<nice>な人《ひと》だ。", "choices_ruby": ["素敵《すてき》な", "意地悪《いじわる》な", "怖《こわ》い", "退屈《たいくつ》な"], "explanation_ruby": "Nice to meet you! = はじめまして。", "body_kana": "あたらしいクラスメイトは、いつもえがおであいさつしてくれて、こまっているひとをたすけてあげる、ほんとうに<nice>なひとだ。"}, {"word": "night", "meaning_jp": "夜", "pos": "名", "body": "夏の<night>は涼しい風が吹いて、空にはたくさんの星と月が見える。", "choices": ["夜", "昼", "朝", "夕方"], "correct_index": 0, "explanation": "Good night! = おやすみ。at night = 夜に。", "id": "s1_221", "body_ruby": "夏《なつ》の<night>は涼《すず》しい風《かぜ》が吹《ふ》いて、空《そら》にはたくさんの星《ほし》と月《がつ》が見《み》える。", "choices_ruby": ["夜《よる》", "昼《ひる》", "朝《あさ》", "夕方《ゆうがた》"], "explanation_ruby": "Good night! = おやすみ。at night = 夜《よる》に。", "body_kana": "なつの<night>はすずしいかぜがふいて、そらにはたくさんのほしとがつがみえる。"}, {"word": "nine", "meaning_jp": "9", "pos": "名/形", "body": "野球は1チーム<nine>人の選手で行う。ピッチャー、キャッチャー、4人の内野手、3人の外野手を合わせると揃う数だ。", "choices": ["9", "10", "8", "11"], "correct_index": 0, "explanation": "数字の9。eight(8)と ten(10)の間。", "id": "s1_222", "body_ruby": "野球《やきゅう》は1チーム<nine>人《にん》の選手《せんしゅ》で行《おこな》う。ピッチャー、キャッチャー、4人《にん》の内野手《ないやしゅ》、3人《にん》の外野手《がいやしゅ》を合《あ》わせると揃《そろ》う数《かず》だ。", "choices_ruby": ["9", "10", "8", "11"], "explanation_ruby": "数字《すうじ》の9。eight(8)と ten(10)の間《あいだ》。", "body_kana": "やきゅうは1チーム<nine>にんのせんしゅでおこなう。ピッチャー、キャッチャー、4人のないやしゅ、3人のがいやしゅをあわせるとそろうかずだ。"}, {"word": "nineteen", "meaning_jp": "19", "pos": "名/形", "body": "私の兄は高校3年生で<nineteen>歳。次の誕生日でついに20歳の成人を迎える。", "choices": ["19", "90", "9", "29"], "correct_index": 0, "explanation": "nine + teen。", "id": "s1_223", "body_ruby": "私《わたし》の兄《あに》は高校《こうこう》3年生《ねんせい》で<nineteen>歳《さい》。次《つぎ》の誕生日《たんじょうび》でついに20歳《さい》の成人《せいじん》を迎《むか》える。", "choices_ruby": ["19", "90", "9", "29"], "explanation_ruby": "nine + teen。", "body_kana": "わたしのあにはこうこう3年生で<nineteen>さい。つぎのたんじょうびでついに20歳のせいじんをむかえる。"}, {"word": "ninety", "meaning_jp": "90", "pos": "名/形", "body": "近所のおばあさんは今年で<ninety>歳。腰も曲がらず毎日庭の手入れをして、「100歳まであと10年は元気に生きるつもりだ」と笑って語ってくれた。", "choices": ["90", "9", "19", "100"], "correct_index": 0, "explanation": "nine + -ty。", "id": "s1_224", "body_ruby": "近所《きんじょ》のおばあさんは今年《ことし》で<ninety>歳《さい》。腰《こし》も曲《ま》がらず毎日《まいにち》庭《にわ》の手《て》入《い》れをして、「100歳《さい》まであと10年《ねん》は元気《げんき》に生《い》きるつもりだ」と笑《わら》って語《かた》ってくれた。", "choices_ruby": ["90", "9", "19", "100"], "explanation_ruby": "nine + -ty。", "body_kana": "きんじょのおばあさんはことしで<ninety>さい。こしもまがらずまいにちにわのていれをして、「100歳まであと10年はげんきにいきるつもりだ」とわらってかたってくれた。"}, {"word": "ninth", "meaning_jp": "9番目", "pos": "名/形", "body": "学級委員の選挙で、彼は10人の候補者の中で<ninth>の結果だった。彼より票が多かったのは8人で、後ろにはあと1人いた。", "choices": ["9番目", "1番目", "10番目", "5番目"], "correct_index": 0, "explanation": "nine + -th。「e が消える」注意。", "id": "s1_225", "body_ruby": "学級委員《がっきゅういいん》の選挙《せんきょ》で、彼《かれ》は10人《にん》の候補者《こうほしゃ》の中《なか》で<ninth>の結果《けっか》だった。彼《かれ》より票《ひょう》が多《おお》かったのは8人《にん》で、後《うし》ろにはあと1人《にん》いた。", "choices_ruby": ["9番目《ばんめ》", "1番目《ばんめ》", "10番目《ばんめ》", "5番目《ばんめ》"], "explanation_ruby": "nine + -th。「e が消《き》える」注意《ちゅうい》。", "body_kana": "がっきゅういいんのせんきょで、かれは10人のこうほしゃのなかで<ninth>のけっかだった。かれよりひょうがおおかったのは8人で、うしろにはあと1人いた。"}, {"word": "noodle", "meaning_jp": "麺", "pos": "名", "body": "ラーメン屋に入って、小麦粉から作られた細長い<noodle>がたっぷり入った熱い醤油ラーメンを注文した。", "choices": ["麺", "ご飯", "パン", "肉"], "correct_index": 0, "explanation": "ramen, soba, udon すべて noodle。", "id": "s1_226", "body_ruby": "ラーメン屋《や》に入《はい》って、小麦粉《こむぎこ》から作《つく》られた細長《ほそなが》い<noodle>がたっぷり入《はい》った熱《あつ》い醤油《しょうゆ》ラーメンを注文《ちゅうもん》した。", "choices_ruby": ["麺《めん》", "ご飯《めし》", "パン", "肉《にく》"], "explanation_ruby": "ramen, soba, udon すべて noodle。", "body_kana": "ラーメンやにはいって、こむぎこからつくられたほそながい<noodle>がたっぷりはいったあついしょうゆラーメンをちゅうもんした。"}, {"word": "nose", "meaning_jp": "鼻", "pos": "名", "body": "風邪を引いてしまい、<nose>から鼻水が止まらず、ティッシュ箱が朝から夕方までに2箱も空になってしまった。", "choices": ["鼻", "耳", "目", "口"], "correct_index": 0, "explanation": "顔の中央。runny nose = 鼻水。", "id": "s1_227", "body_ruby": "風邪《かぜ》を引《ひ》いてしまい、<nose>から鼻水《はなみず》が止《と》まらず、ティッシュ箱《はこ》が朝《あさ》から夕方《ゆうがた》までに2箱《はこ》も空《そら》になってしまった。", "choices_ruby": ["鼻《はな》", "耳《みみ》", "目《め》", "口《くち》"], "explanation_ruby": "顔《かお》の中央《ちゅうおう》。runny nose = 鼻水《はなみず》。", "body_kana": "かぜをひいてしまい、<nose>からはなみずがとまらず、ティッシュはこがあさからゆうがたまでに2はこもそらになってしまった。"}, {"word": "notebook", "meaning_jp": "ノート", "pos": "名", "body": "授業中は、先生が黒板に書いたことを、ページ番号順に<notebook>に丁寧に書き写すことが大切だ。文字を書くための綴じられた紙の束だ。", "choices": ["ノート", "教科書", "辞書", "鉛筆"], "correct_index": 0, "explanation": "note(メモ)+ book。", "id": "s1_228", "body_ruby": "授業中《じゅぎょうちゅう》は、先生《せんせい》が黒板《こくばん》に書《か》いたことを、ページ番号順《ばんごうじゅん》に<notebook>に丁寧《ていねい》に書《か》き写《うつ》すことが大切《たいせつ》だ。文字《もじ》を書《か》くための綴《と》じられた紙《かみ》の束《そく》だ。", "choices_ruby": ["ノート", "教科書《きょうかしょ》", "辞書《じしょ》", "鉛筆《えんぴつ》"], "explanation_ruby": "note(メモ)+ book。", "body_kana": "じゅぎょうちゅうは、せんせいがこくばんにかいたことを、ページばんごうじゅんに<notebook>にていねいにかきうつすことがたいせつだ。もじをかくためのとじられたかみのそくだ。"}, {"word": "November", "meaning_jp": "11月", "pos": "名", "body": "秋が深まる<November>には、街路樹の葉が赤や黄色に色づき、夜はぐっと冷え込んで、暖房が必要になってくる。", "choices": ["11月", "10月", "12月", "9月"], "correct_index": 0, "explanation": "nove(9)が語源(旧暦の9月)。", "id": "s1_229", "body_ruby": "秋《あき》が深《ふか》まる<November>には、街路樹《がいろじゅ》の葉《は》が赤《あか》や黄色《きいろ》に色《いろ》づき、夜《よる》はぐっと冷《ひ》え込《こ》んで、暖房《だんぼう》が必要《ひつよう》になってくる。", "choices_ruby": ["11月《がつ》", "10月《がつ》", "12月《がつ》", "9月《がつ》"], "explanation_ruby": "nove(9)が語源《ごげん》(旧暦《きゅうれき》の9月《がつ》)。", "body_kana": "あきがふかまる<November>には、がいろじゅのはがあかやきいろにいろづき、よるはぐっとひえこんで、だんぼうがひつようになってくる。"}, {"word": "number", "meaning_jp": "数、番号", "pos": "名", "body": "学校の出席<number>は、名前の50音順に1から30まで決められていて、私は12番だ。", "choices": ["数(番号)", "色", "形", "名前"], "correct_index": 0, "explanation": "phone number(電話番号)、number one(1番)。", "id": "s1_230", "body_ruby": "学校《がっこう》の出席《しゅっせき》<number>は、名前《なまえ》の50音順《おんじゅん》に1から30まで決《き》められていて、私《わたし》は12番《ばん》だ。", "choices_ruby": ["数《かず》(番号《ばんごう》)", "色《いろ》", "形《かたち》", "名前《なまえ》"], "explanation_ruby": "phone number(電話番号《でんわばんごう》)、number one(1番《ばん》)。", "body_kana": "がっこうのしゅっせき<number>は、なまえの50おんじゅんに1から30まできめられていて、わたしは12番だ。"}, {"word": "October", "meaning_jp": "10月", "pos": "名", "body": "秋が深まる<October>には、スポーツの日があり、運動会や文化祭が学校で開かれて、空がますます高く感じられる。", "choices": ["10月", "11月", "9月", "12月"], "correct_index": 0, "explanation": "octo(8)が語源(旧暦の8月)。タコは octopus(8本足)。", "id": "s1_231", "body_ruby": "秋《あき》が深《ふか》まる<October>には、スポーツの日《ひ》があり、運動会《うんどうかい》や文化祭《ぶんかさい》が学校《がっこう》で開《ひら》かれて、空《そら》がますます高《たか》く感《かん》じられる。", "choices_ruby": ["10月《がつ》", "11月《がつ》", "9月《がつ》", "12月《がつ》"], "explanation_ruby": "octo(8)が語源《ごげん》(旧暦《きゅうれき》の8月《がつ》)。タコは octopus(8本《ほん》足《あし》)。", "body_kana": "あきがふかまる<October>には、スポーツのひがあり、うんどうかいやぶんかさいががっこうでひらかれて、そらがますますたかくかんじられる。"}, {"word": "office", "meaning_jp": "事務所、会社", "pos": "名", "body": "父は毎朝7時に家を出て、電車で1時間かけて新宿のビルにある会社の<office>に通勤している。机が並んで人が働く場所だ。", "choices": ["事務所", "工場", "店", "学校"], "correct_index": 0, "explanation": "post office = 郵便局、office worker = 会社員。", "id": "s1_232", "body_ruby": "父《ちち》は毎朝《まいあさ》7時《じ》に家《いえ》を出《で》て、電車《でんしゃ》で1時間《じかん》かけて新宿《しんじゅく》のビルにある会社《かいしゃ》の<office>に通勤《つうきん》している。机《つくえ》が並《なら》んで人《ひと》が働《はたら》く場所《ばしょ》だ。", "choices_ruby": ["事務所《じむしょ》", "工場《こうじょう》", "店《みせ》", "学校《がっこう》"], "explanation_ruby": "post office = 郵便局《ゆうびんきょく》、office worker = 会社員《かいしゃいん》。", "body_kana": "ちちはまいあさ7時にいえをでて、でんしゃで1時間かけてしんじゅくのビルにあるかいしゃの<office>につうきんしている。つくえがならんでひとがはたらくばしょだ。"}, {"word": "often", "meaning_jp": "よく、頻繁に", "pos": "副", "body": "私は週に3〜4回、放課後に公園で友達とサッカーをして遊ぶ。1週間で半分以上の日は、<often>夕方まで外でボールを蹴っている。", "choices": ["よく(頻繁に)", "たまに", "決して〜ない", "いつも"], "correct_index": 0, "explanation": "頻度の副詞。sometimes(時々)< often(よく)< always(いつも)。", "id": "s1_233", "body_ruby": "私《わたし》は週《しゅう》に3〜4回《かい》、放課後《ほうかご》に公園《こうえん》で友達《ともだち》とサッカーをして遊《あそ》ぶ。1週間《しゅうかん》で半分以上《はんぶんいじょう》の日《ひ》は、<often>夕方《ゆうがた》まで外《そと》でボールを蹴《け》っている。", "choices_ruby": ["よく(頻繁《ひんぱん》に)", "たまに", "決《けっ》して〜ない", "いつも"], "explanation_ruby": "頻度《ひんど》の副詞《ふくし》。sometimes(時々《ときどき》)< often(よく)< always(いつも)。", "body_kana": "わたしはしゅうに3〜4回、ほうかごにこうえんでともだちとサッカーをしてあそぶ。1週間ではんぶんいじょうのひは、<often>ゆうがたまでそとでボールをけっている。"}, {"word": "oh", "meaning_jp": "おお、ああ", "pos": "間", "body": "鏡を見たら、髪の毛がぼさぼさだったので、思わず「<oh>!」と声を出して驚いた。気持ちが動いた時に思わず出る言葉だ。", "choices": ["おお", "うん", "はい", "いいえ"], "correct_index": 0, "explanation": "驚き・喜び・残念などを表す感嘆詞。", "id": "s1_234", "body_ruby": "鏡《かがみ》を見《み》たら、｜髪の毛《かみのけ》がぼさぼさだったので、思《おも》わず「<oh>!」と声《こえ》を出《だ》して驚《おどろ》いた。気持《きも》ちが動《うご》いた時《とき》に思《おも》わず出《で》る言葉《ことば》だ。", "choices_ruby": ["おお", "うん", "はい", "いいえ"], "explanation_ruby": "驚《おどろ》き・喜《よろこ》び・残念《ざんねん》などを表《あらわ》す感嘆《かんたん》詞《し》。", "body_kana": "かがみをみたら、かみのけがぼさぼさだったので、おもわず「<oh>!」とこえをだしておどろいた。きもちがうごいたときにおもわずでることばだ。"}, {"word": "old", "meaning_jp": "古い、年取った", "pos": "形", "body": "祖父が大切にしているこの黒い時計は、50年前から使っているとても<old>なものだ。", "choices": ["古い", "新しい", "高い", "明るい"], "correct_index": 0, "explanation": "new(新しい)・young(若い)の対。How old? = 何歳?", "id": "s1_235", "body_ruby": "祖父《そふ》が大切《たいせつ》にしているこの黒《くろ》い時計《とけい》は、50年《ねん》前《ぜん》から使《つか》っているとても<old>なものだ。", "choices_ruby": ["古《ふる》い", "新《あたら》しい", "高《たか》い", "明《あか》るい"], "explanation_ruby": "new(新《あたら》しい)・young(若《わか》い)の対《つい》。How old? = 何歳《なんさい》?", "body_kana": "そふがたいせつにしているこのくろいとけいは、50年ぜんからつかっているとても<old>なものだ。"}, {"word": "one", "meaning_jp": "1", "pos": "名/形", "body": "1年生になる前の私には、おじいちゃんに買ってもらったテディベアの「クマちゃん」という<one>つだけの大切な宝物があった。", "choices": ["1", "2", "3", "10"], "correct_index": 0, "explanation": "代名詞でも使う(I have one. = 1つ持ってる)。", "id": "s1_236", "body_ruby": "1年生《ねんせい》になる前《まえ》の私《わたし》には、おじいちゃんに買《か》ってもらったテディベアの「クマちゃん」という<one>つだけの大切《たいせつ》な宝物《たからもの》があった。", "choices_ruby": ["1", "2", "3", "10"], "explanation_ruby": "代名詞《だいめいし》でも使《つか》う(I have one. = 1つ持《も》ってる)。", "body_kana": "1年生になるまえのわたしには、おじいちゃんにかってもらったテディベアの「クマちゃん」という<one>つだけのたいせつなたからものがあった。"}, {"word": "open", "meaning_jp": "開ける、開いた", "pos": "動/形", "body": "学校が暑かったので、教室の南側にある3つの窓を全部<open>して、外の風を中に入れた。", "choices": ["開ける", "閉める", "壊す", "見る"], "correct_index": 0, "explanation": "close(閉じる)の対。形容詞でも動詞でも。", "id": "s1_237", "body_ruby": "学校《がっこう》が暑《あつ》かったので、教室《きょうしつ》の南側《みなみがわ》にある3つの窓《まど》を全部《ぜんぶ》<open>して、外《そと》の風《かぜ》を中《なか》に入《い》れた。", "choices_ruby": ["開《ひら》ける", "閉《し》める", "壊《こわ》す", "見《み》る"], "explanation_ruby": "close(閉《と》じる)の対《つい》。形容詞《けいようし》でも動詞《どうし》でも。", "body_kana": "がっこうがあつかったので、きょうしつのみなみがわにある3つのまどをぜんぶ<open>して、そとのかぜをなかにいれた。"}, {"word": "orange", "meaning_jp": "オレンジ色、ミカン", "pos": "名/形", "body": "夕暮れの空は、太陽が沈む西側だけが赤と黄色の混じった鮮やかな<orange>に染まっていた。", "choices": ["オレンジ色", "赤", "青", "緑"], "correct_index": 0, "explanation": "色も果物も同じ単語。", "id": "s1_238", "body_ruby": "夕暮《ゆうぐ》れの空《そら》は、太陽《たいよう》が沈《しず》む西側《にしがわ》だけが赤《あか》と黄色《きいろ》の混《ま》じった鮮《あざ》やかな<orange>に染《そ》まっていた。", "choices_ruby": ["オレンジ色《いろ》", "赤《あか》", "青《あお》", "緑《みどり》"], "explanation_ruby": "色《いろ》も果物《くだもの》も同《おな》じ単語《たんご》。", "body_kana": "ゆうぐれのそらは、たいようがしずむにしがわだけがあかときいろのまじったあざやかな<orange>にそまっていた。"}, {"word": "own", "meaning_jp": "自分自身の", "pos": "形", "body": "中学生になって、ようやく親と兄と分けない、自分1人だけの<own>の部屋を持てるようになった。", "choices": ["自分の", "誰かの", "みんなの", "他人の"], "correct_index": 0, "explanation": "my own room = 自分自身の部屋。所有の強調。", "id": "s1_239", "body_ruby": "中学生《ちゅうがくせい》になって、ようやく親《おや》と兄《あに》と分《わ》けない、自分《じぶん》1人《にん》だけの<own>の部屋《へや》を持《も》てるようになった。", "choices_ruby": ["自分《じぶん》の", "誰《だれ》かの", "みんなの", "他人《たにん》の"], "explanation_ruby": "my own room = 自分自身《じぶんじしん》の部屋《へや》。所有《しょゆう》の強調《きょうちょう》。", "body_kana": "ちゅうがくせいになって、ようやくおやとあにとわけない、じぶん1人だけの<own>のへやをもてるようになった。"}, {"word": "panda", "meaning_jp": "パンダ", "pos": "名", "body": "上野動物園で人気の白と黒の毛をした<panda>は、笹を1日に20キロも食べる、中国に住む大きな動物だ。", "choices": ["パンダ", "クマ", "ライオン", "サル"], "correct_index": 0, "explanation": "中国の固有種。giant panda(ジャイアントパンダ)。", "id": "s1_240", "body_ruby": "上野動物園《うえのどうぶつえん》で人気《にんき》の白《しろ》と黒《くろ》の毛《け》をした<panda>は、笹《ささ》を1日《にち》に20キロも食《た》べる、中国《ちゅうごく》に住《す》む大《おお》きな動物《どうぶつ》だ。", "choices_ruby": ["パンダ", "クマ", "ライオン", "サル"], "explanation_ruby": "中国《ちゅうごく》の固有《こゆう》種《たね》。giant panda(ジャイアントパンダ)。", "body_kana": "うえのどうぶつえんでにんきのしろとくろのけをした<panda>は、ささを1日に20キロもたべる、ちゅうごくにすむおおきなどうぶつだ。"}, {"word": "pardon", "meaning_jp": "もう一度言ってください", "pos": "名", "body": "外国の人と話していて、相手の英語が早口で聞き取れなかったので、「<pardon>?」と聞き直してもう一度言ってもらった。", "choices": ["もう一度言って", "ありがとう", "はい", "さようなら"], "correct_index": 0, "explanation": "I beg your pardon? = もう一度言って頂けますか。", "id": "s1_241", "body_ruby": "外国《がいこく》の人《ひと》と話《はな》していて、相手《あいて》の英語《えいご》が早口《はやくち》で聞《き》き取《と》れなかったので、「<pardon>?」と聞《き》き直《なお》してもう一度《いちど》言《い》ってもらった。", "choices_ruby": ["もう一度《いちど》言《い》って", "ありがとう", "はい", "さようなら"], "explanation_ruby": "I beg your pardon? = もう一度《いちど》言《い》って頂《いただ》けますか。", "body_kana": "がいこくのひととはなしていて、あいてのえいごがはやくちでききとれなかったので、「<pardon>?」とききなおしてもういちどいってもらった。"}, {"word": "parent", "meaning_jp": "親", "pos": "名", "body": "学校の懇談会には、父と母の両方の<parent>が来てくれて、先生から私の成績や態度について話を聞いていた。", "choices": ["親", "兄弟", "おじ", "祖父母"], "correct_index": 0, "explanation": "通常は複数形 parents で「両親」。", "id": "s1_242", "body_ruby": "学校《がっこう》の懇談会《こんだんかい》には、父《ちち》と母《はは》の両方《りょうほう》の<parent>が来《き》てくれて、先生《せんせい》から私《わたし》の成績《せいせき》や態度《たいど》について話《はなし》を聞《き》いていた。", "choices_ruby": ["親《おや》", "兄弟《きょうだい》", "おじ", "祖父母《そふぼ》"], "explanation_ruby": "通常《つうじょう》は複数形《ふくすうけい》 parents で「両親《りょうしん》」。", "body_kana": "がっこうのこんだんかいには、ちちとははのりょうほうの<parent>がきてくれて、せんせいからわたしのせいせきやたいどについてはなしをきいていた。"}, {"word": "park", "meaning_jp": "公園", "pos": "名", "body": "週末は家族で家から500メートルの近所の大きな<park>に行って、お弁当を食べながらピクニックを楽しむ。緑のある町の遊び場だ。", "choices": ["公園", "学校", "病院", "駅"], "correct_index": 0, "explanation": "「車を駐車する」の動詞の意味もある。", "id": "s1_243", "body_ruby": "週末《しゅうまつ》は家族《かぞく》で家《いえ》から500メートルの近所《きんじょ》の大《おお》きな<park>に行《い》って、お弁当《べんとう》を食《た》べながらピクニックを楽《たの》しむ。緑《みどり》のある町《まち》の｜遊び場《あそびば》だ。", "choices_ruby": ["公園《こうえん》", "学校《がっこう》", "病院《びょういん》", "駅《えき》"], "explanation_ruby": "「車《くるま》を駐車《ちゅうしゃ》する」の動詞《どうし》の意味《いみ》もある。", "body_kana": "しゅうまつはかぞくでいえから500メートルのきんじょのおおきな<park>にいって、おべんとうをたべながらピクニックをたのしむ。みどりのあるまちのあそびばだ。"}, {"word": "pen", "meaning_jp": "ペン", "pos": "名", "body": "授業のノートは、青色のインクが出る<pen>でしっかり書いている。手で持って文字を書く道具だ。", "choices": ["ペン", "消しゴム", "ノート", "本"], "correct_index": 0, "explanation": "ballpoint pen(ボールペン)、fountain pen(万年筆)。", "id": "s1_244", "body_ruby": "授業《じゅぎょう》のノートは、青色《あおいろ》のインクが出《で》る<pen>でしっかり書《か》いている。手《て》で持《も》って文字《もじ》を書《か》く道具《どうぐ》だ。", "choices_ruby": ["ペン", "消《け》しゴム", "ノート", "本《ほん》"], "explanation_ruby": "ballpoint pen(ボールペン)、fountain pen(万年筆《まんねんひつ》)。", "body_kana": "じゅぎょうのノートは、あおいろのインクがでる<pen>でしっかりかいている。てでもってもじをかくどうぐだ。"}, {"word": "pencil", "meaning_jp": "鉛筆", "pos": "名", "body": "テストの答案には、消しゴムで消せるHBの<pencil>を使って答えを書く。木の中に黒い芯が入った文房具だ。", "choices": ["鉛筆", "ペン", "クレヨン", "筆"], "correct_index": 0, "explanation": "pencil case(筆箱)、color pencil(色鉛筆)。", "id": "s1_245", "body_ruby": "テストの答案《とうあん》には、消《け》しゴムで消《け》せるHBの<pencil>を使《つか》って答《こた》えを書《か》く。木《き》の中《なか》に黒《くろ》い芯《しん》が入《はい》った文房具《ぶんぼうぐ》だ。", "choices_ruby": ["鉛筆《えんぴつ》", "ペン", "クレヨン", "筆《ふで》"], "explanation_ruby": "pencil case(筆箱《ふでばこ》)、color pencil(色鉛筆《いろえんぴつ》)。", "body_kana": "テストのとうあんには、けしゴムでけせるHBの<pencil>をつかってこたえをかく。きのなかにくろいしんがはいったぶんぼうぐだ。"}, {"word": "people", "meaning_jp": "人々", "pos": "名", "body": "新宿駅は通勤時間になると、スーツ姿の会社員、学生、観光客など、何千人もの<people>が改札を通って、毎日忙しく行き交っている。", "choices": ["人々", "動物", "建物", "車"], "correct_index": 0, "explanation": "person の複数形扱い。常に複数。", "id": "s1_246", "body_ruby": "新宿駅《しんじゅくえき》は通勤《つうきん》時間《じかん》になると、スーツ姿《すがた》の会社員《かいしゃいん》、学生《がくせい》、観光客《かんこうきゃく》など、何千《なんぜん》人《ひと》もの<people>が改札《かいさつ》を通《かよ》って、毎日《まいにち》忙《いそが》しく行《い》き交《まじ》っている。", "choices_ruby": ["人々《ひとびと》", "動物《どうぶつ》", "建物《たてもの》", "車《くるま》"], "explanation_ruby": "person の複数形《ふくすうけい》扱《あつか》い。常《つね》に複数《ふくすう》。", "body_kana": "しんじゅくえきはつうきんじかんになると、スーツすがたのかいしゃいん、がくせい、かんこうきゃくなど、なんぜんひともの<people>がか
