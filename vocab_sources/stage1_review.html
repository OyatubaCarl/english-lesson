<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordTacos Stage 1 ─ 403問 / 位置・重複修正済 v6</title>
<style>
:root {
  --bg: #FFF8EE;
  --paper: #FFFDF7;
  --ink: #2A1F14;
  --sub: #6B5A47;
  --accent: #C73E1D;
  --green: #4A7C59;
  --green-soft: #EAF4EC;
  --yellow: #E8B647;
  --border: #E6D5BC;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Hiragino Sans", "Hiragino Maru Gothic ProN", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  padding: 16px;
}
.wrap { max-width: 900px; margin: 0 auto; }
header {
  text-align: center;
  padding: 20px 0;
  border-bottom: 2px dashed var(--border);
  margin-bottom: 24px;
}
h1 { font-size: 1.8rem; }
h1 .taco { color: var(--accent); }
.subtitle { font-size: 0.85rem; color: var(--sub); margin-top: 4px; }
.controls {
  position: sticky;
  top: 0;
  background: var(--bg);
  padding: 12px 0;
  z-index: 100;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.95rem;
  font-family: inherit;
  background: var(--paper);
}
.search-box:focus { outline: none; border-color: var(--accent); }
.stats {
  font-size: 0.8rem;
  color: var(--sub);
  padding: 0 8px;
}
.filter-chip {
  padding: 6px 12px;
  font-size: 0.78rem;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  user-select: none;
}
.filter-chip.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.cards {
  display: grid;
  gap: 8px;
}
.card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.card-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.id {
  font-family: "SF Mono", monospace;
  font-size: 0.7rem;
  color: var(--sub);
}
.word {
  font-family: "Helvetica Neue", sans-serif;
  font-weight: 700;
  color: var(--accent);
  font-size: 1.1rem;
}
.pos {
  font-size: 0.65rem;
  background: var(--green);
  color: white;
  padding: 1px 6px;
  border-radius: 3px;
}
.meaning {
  font-size: 0.85rem;
  color: var(--sub);
}
.body {
  font-size: 0.95rem;
  line-height: 1.7;
  padding: 8px 10px;
  background: linear-gradient(180deg, #FFF7E8, #FFF1D6);
  border-left: 3px solid var(--yellow);
  border-radius: 0 6px 6px 0;
  margin-bottom: 6px;
}
.body .embed {
  display: inline-block;
  background: var(--accent);
  color: white;
  font-family: "Helvetica Neue", sans-serif;
  font-weight: 700;
  padding: 0 6px;
  border-radius: 4px;
  margin: 0 1px;
}
.choices-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 0.78rem;
  margin-top: 4px;
}
.choice-chip {
  background: white;
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 6px;
}
.choice-chip.correct {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--green);
  font-weight: 700;
}
.explanation {
  font-size: 0.78rem;
  color: var(--sub);
  margin-top: 4px;
  padding: 4px 8px;
  background: #FDF6E3;
  border-radius: 4px;
}
.hidden { display: none; }
.no-results {
  text-align: center;
  padding: 40px;
  color: var(--sub);
}
ruby rt { font-size: 0.45em; color: var(--sub); font-weight: 400; }
.embed ruby rt { color: rgba(255,255,255,0.92); }
body.no-ruby rt { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word<span class="taco">Tacos</span> ─ Stage 1 レビュー</h1>
    <div class="subtitle">中1範囲 全403問 / 単語・本文・選択肢・解説を一覧</div>
  </header>

  <div class="controls">
    <input type="text" class="search-box" id="search" placeholder="🔍 単語・意味・本文を検索(例: nose / 鼻 / 風邪)">
    <span class="stats" id="stats">─</span>
    <span class="filter-chip active" data-pos="all">全て</span>
    <span class="filter-chip" data-pos="名">名</span>
    <span class="filter-chip" data-pos="動">動</span>
    <span class="filter-chip" data-pos="形">形</span>
    <span class="filter-chip" data-pos="副">副</span>
    <span class="filter-chip active" id="ruby-chip">ふりがな</span>
  </div>

  <div class="cards" id="cards"></div>
  <div class="no-results hidden" id="no-results">該当する問題なし</div>
</div>

<script>
const DATA = [{"id": "s1_001", "word": "afternoon", "meaning_jp": "午後", "pos": "名", "body": "今日の<afternoon>は、給食を食べて午後の授業を3時間受けた後、放課後に図書館で本を読もうと思っている。", "choices": ["午前", "午後", "夕方", "夜"], "correct_index": 1, "explanation": "noon = 「昼」。after(後)+ noon(昼)で「午後」。", "body_ruby": "今日《きょう》の<afternoon>は、給食《きゅうしょく》を食《た》べて午後《ごご》の授業《じゅぎょう》を3時間《じかん》受《う》けた後《あと》、放課後《ほうかご》に図書館《としょかん》で本《ほん》を読《よ》もうと思《おも》っている。", "choices_ruby": ["午前《ごぜん》", "午後《ごご》", "夕方《ゆうがた》", "夜《よる》"], "explanation_ruby": "noon = 「昼《ひる》」。after(後《のち》)+ noon(昼《ひる》)で「午後《ごご》」。", "body_kana": "きょうの<afternoon>は、きゅうしょくをたべてごごのじゅぎょうを3時間うけたあと、ほうかごにとしょかんでほんをよもうとおもっている。"}, {"id": "s1_002", "word": "ago", "meaning_jp": "〜前に", "pos": "副", "body": "私が初めてピアノを弾いたのは、5年<ago>のことでした。", "choices": ["前に", "後に", "おきに", "続けて"], "correct_index": 0, "explanation": "ago は「期間+ago」の形で、過去の時点を表します。", "body_ruby": "私《わたし》が初《はじ》めてピアノを弾《ひ》いたのは、5年《ねん》<ago>のことでした。", "choices_ruby": ["前《まえ》に", "後《のち》に", "おきに", "続《つづ》けて"], "explanation_ruby": "ago は「期間《きかん》+ago」の形《かたち》で、過去《かこ》の時点《じてん》を表《あらわ》します。", "body_kana": "わたしがはじめてピアノをひいたのは、5年<ago>のことでした。"}, {"id": "s1_003", "word": "always", "meaning_jp": "いつも", "pos": "副", "body": "昨日も、今日も、明日もきっと、朝6時に起きると母は<always>キッチンでコーヒーを淹れている。365日変わらない我が家の朝の景色だ。", "choices": ["いつも", "たまに", "時々", "ほとんど〜ない"], "correct_index": 0, "explanation": "頻度を表す副詞の中で最も強い「100%、常に」の意味。", "body_ruby": "昨日《きのう》も、今日《きょう》も、明日《あした》もきっと、朝《あさ》6時《じ》に起《お》きると母《はは》は<always>キッチンでコーヒーを淹《い》れている。365日《にち》変《か》わらない｜我が家《わがや》の朝《あさ》の景色《けしき》だ。", "choices_ruby": ["いつも", "たまに", "時々《ときどき》", "ほとんど〜ない"], "explanation_ruby": "頻度《ひんど》を表《あらわ》す副詞《ふくし》の中《なか》で最《もっと》も強《つよ》い「100%、常《つね》に」の意味《いみ》。", "body_kana": "きのうも、きょうも、あしたもきっと、あさ6時におきるとははは<always>キッチンでコーヒーをいれている。365日かわらないわがやのあさのけしきだ。"}, {"id": "s1_004", "word": "animal", "meaning_jp": "動物", "pos": "名", "body": "動物園にはライオン、ゾウ、キリン、パンダ、サルなど、たくさんの<animal>がいて、子どもたちはどのオリの前でも目を輝かせている。", "choices": ["植物", "動物", "建物", "食べ物"], "correct_index": 1, "explanation": "anima(息・命)が語源。「生き物」全般を指す語。", "body_ruby": "動物園《どうぶつえん》にはライオン、ゾウ、キリン、パンダ、サルなど、たくさんの<animal>がいて、子《こ》どもたちはどのオリの前《まえ》でも目《め》を輝《かがや》かせている。", "choices_ruby": ["植物《しょくぶつ》", "動物《どうぶつ》", "建物《たてもの》", "｜食べ物《たべもの》"], "explanation_ruby": "anima(息《いき》・命《いのち》)が語源《ごげん》。「｜生き物《いきもの》」全般《ぜんぱん》を指《さ》す語《ご》。", "body_kana": "どうぶつえんにはライオン、ゾウ、キリン、パンダ、サルなど、たくさんの<animal>がいて、こどもたちはどのオリのまえでもめをかがやかせている。"}, {"id": "s1_005", "word": "answer", "meaning_jp": "答える、答え", "pos": "動/名", "body": "先生からの質問に、誰も<answer>することができませんでした。", "choices": ["答える", "質問する", "笑う", "逃げる"], "correct_index": 0, "explanation": "動詞でも名詞でも使う基本語。", "body_ruby": "先生《せんせい》からの質問《しつもん》に、誰《だれ》も<answer>することができませんでした。", "choices_ruby": ["答《こた》える", "質問《しつもん》する", "笑《わら》う", "逃《に》げる"], "explanation_ruby": "動詞《どうし》でも名詞《めいし》でも使《つか》う基本語《きほんご》。", "body_kana": "せんせいからのしつもんに、だれも<answer>することができませんでした。"}, {"id": "s1_006", "word": "anything", "meaning_jp": "何でも、何か", "pos": "代", "body": "「お腹が空いたなら、冷蔵庫にある<anything>食べていいよ」と母が言いました。", "choices": ["何でも", "一つも〜ない", "誰も", "どこにも"], "correct_index": 0, "explanation": "肯定文では「何でも」、疑問文では「何か」、否定文では「何も〜ない」の意味になる。", "body_ruby": "「お腹《なか》が空《す》いたなら、冷蔵庫《れいぞうこ》にある<anything>食《た》べていいよ」と母《はは》が言《い》いました。", "choices_ruby": ["何《なん》でも", "一《ひと》つも〜ない", "誰《だれ》も", "どこにも"], "explanation_ruby": "肯定《こうてい》文《ぶん》では「何《なん》でも」、疑問文《ぎもんぶん》では「何《なに》か」、否定文《ひていぶん》では「何《なに》も〜ない」の意味《いみ》になる。", "body_kana": "「おなかがすいたなら、れいぞうこにある<anything>たべていいよ」とははがいいました。"}, {"id": "s1_007", "word": "April", "meaning_jp": "4月", "pos": "名", "body": "桜が満開になる<April>の朝、私は新しい制服に身を包み、初めて中学校の門をくぐった。", "choices": ["1月", "4月", "7月", "10月"], "correct_index": 1, "explanation": "ローマ神話の女神 Aphrodite に由来する月名。日本では新学期。", "body_ruby": "桜《さくら》が満開《まんかい》になる<April>の朝《あさ》、私《わたし》は新《あたら》しい制服《せいふく》に身《み》を包《つつ》み、初《はじ》めて中学校《ちゅうがっこう》の門《もん》をくぐった。", "choices_ruby": ["1月《がつ》", "4月《がつ》", "7月《がつ》", "10月《がつ》"], "explanation_ruby": "ローマ神話《しんわ》の女神《めがみ》 Aphrodite に由来《ゆらい》する月名《げつめい》。日本《にっぽん》では新学期《しんがっき》。", "body_kana": "さくらがまんかいになる<April>のあさ、わたしはあたらしいせいふくにみをつつみ、はじめてちゅうがっこうのもんをくぐった。"}, {"id": "s1_008", "word": "arm", "meaning_jp": "腕", "pos": "名", "body": "重いリュックを長時間背負っていたら、両方の<arm>がしびれてしまい、しばらく手が思うように動かせなくなった。", "choices": ["足", "腕", "首", "肩"], "correct_index": 1, "explanation": "肩から手首までの部分。動詞では「武装する」の意味も。", "body_ruby": "重《おも》いリュックを長時間《ちょうじかん》背負《せお》っていたら、両方《りょうほう》の<arm>がしびれてしまい、しばらく手《て》が思《おも》うように動《うご》かせなくなった。", "choices_ruby": ["足《あし》", "腕《うで》", "首《くび》", "肩《かた》"], "explanation_ruby": "肩《かた》から手首《てくび》までの部分《ぶぶん》。動詞《どうし》では「武装《ぶそう》する」の意味《いみ》も。", "body_kana": "おもいリュックをちょうじかんせおっていたら、りょうほうの<arm>がしびれてしまい、しばらくてがおもうようにうごかせなくなった。"}, {"id": "s1_009", "word": "art", "meaning_jp": "美術、芸術", "pos": "名", "body": "中学校で一番好きな授業は<art>で、絵を描いている時間が楽しいです。", "choices": ["数学", "音楽", "美術", "体育"], "correct_index": 2, "explanation": "「芸術」全般を指すが、学校の教科では特に「美術」を意味する。", "body_ruby": "中学校《ちゅうがっこう》で一番好《いちばんす》きな授業《じゅぎょう》は<art>で、絵《え》を描《えが》いている時間《じかん》が楽《たの》しいです。", "choices_ruby": ["数学《すうがく》", "音楽《おんがく》", "美術《びじゅつ》", "体育《たいいく》"], "explanation_ruby": "「芸術《げいじゅつ》」全般《ぜんぱん》を指《さ》すが、学校《がっこう》の教科《きょうか》では特《とく》に「美術《びじゅつ》」を意味《いみ》する。", "body_kana": "ちゅうがっこうでいちばんすきなじゅぎょうは<art>で、えをえがいているじかんがたのしいです。"}, {"id": "s1_010", "word": "ask", "meaning_jp": "たずねる、頼む", "pos": "動", "body": "道に迷ったので、近くの人に駅までの道を<ask>しました。", "choices": ["たずねる", "教える", "探す", "歩く"], "correct_index": 0, "explanation": "質問・依頼の両方に使える基本動詞。", "body_ruby": "道《みち》に迷《まよ》ったので、近《ちか》くの人《ひと》に駅《えき》までの道《みち》を<ask>しました。", "choices_ruby": ["たずねる", "教《おし》える", "探《さが》す", "歩《ある》く"], "explanation_ruby": "質問《しつもん》・依頼《いらい》の両方《りょうほう》に使《つか》える基本《きほん》動詞《どうし》。", "body_kana": "みちにまよったので、ちかくのひとにえきまでのみちを<ask>しました。"}, {"id": "s1_011", "word": "ate", "meaning_jp": "食べた", "pos": "動", "body": "朝ごはんに、母が作ってくれた目玉焼きとトーストを15分で全部<ate>した。空腹だったお腹が満たされて、学校に行く力が湧いた。", "choices": ["作った", "食べた", "買った", "見た"], "correct_index": 1, "explanation": "ate は eat(食べる)の過去形。eat-ate-eaten。", "body_ruby": "朝《あさ》ごはんに、母《はは》が作《つく》ってくれた目玉焼《めだまやき》きとトーストを15分《ふん》で全部《ぜんぶ》<ate>した。空腹《くうふく》だったお腹《なか》が満《み》たされて、学校《がっこう》に行《い》く力《ちから》が湧《わ》いた。", "choices_ruby": ["作《つく》った", "食《た》べた", "買《か》った", "見《み》た"], "explanation_ruby": "ate は eat(食《た》べる)の過去形《かこけい》。eat-ate-eaten。", "body_kana": "あさごはんに、ははがつくってくれためだまやききとトーストを15分でぜんぶ<ate>した。くうふくだったおなかがみたされて、がっこうにいくちからがわいた。"}, {"id": "s1_012", "word": "August", "meaning_jp": "8月", "pos": "名", "body": "夏休みの真ん中、<August>の終わりには大きな花火大会があり、毎年浴衣を着て家族で見に行く。", "choices": ["6月", "7月", "8月", "9月"], "correct_index": 2, "explanation": "ローマ皇帝 Augustus に由来する月名。", "body_ruby": "夏休《なつやす》みの｜真ん中《まんなか》、<August>の終《お》わりには大《おお》きな花火大会《はなびたいかい》があり、毎年《まいとし》浴衣《ゆかた》を着《き》て家族《かぞく》で見《み》に行《い》く。", "choices_ruby": ["6月《がつ》", "7月《がつ》", "8月《がつ》", "9月《がつ》"], "explanation_ruby": "ローマ皇帝《こうてい》 Augustus に由来《ゆらい》する月名《げつめい》。", "body_kana": "なつやすみのまんなか、<August>のおわりにはおおきなはなびたいかいがあり、まいとしゆかたをきてかぞくでみにいく。"}, {"id": "s1_013", "word": "aunt", "meaning_jp": "おば", "pos": "名", "body": "母の妹である<aunt>が、北海道から手作りのお菓子を送ってくれました。", "choices": ["兄", "姉", "おじ", "おば"], "correct_index": 3, "explanation": "父・母の姉妹のこと。男性形は uncle。", "body_ruby": "母《はは》の妹《いもうと》である<aunt>が、北海道《ほっかいどう》から手作《てづく》りのお菓子《かし》を送《おく》ってくれました。", "choices_ruby": ["兄《あに》", "姉《あね》", "おじ", "おば"], "explanation_ruby": "父《ちち》・母《はは》の姉妹《しまい》のこと。男性形《だんせいがた》は uncle。", "body_kana": "ははのいもうとである<aunt>が、ほっかいどうからてづくりのおかしをおくってくれました。"}, {"id": "s1_014", "word": "Australia", "meaning_jp": "オーストラリア", "pos": "名", "body": "コアラやカンガルーがいる国、<Australia>にいつか行ってみたいです。", "choices": ["アメリカ", "オーストラリア", "カナダ", "インド"], "correct_index": 1, "explanation": "南半球の島大陸国家。", "body_ruby": "コアラやカンガルーがいる国《くに》、<Australia>にいつか行《い》ってみたいです。", "choices_ruby": ["アメリカ", "オーストラリア", "カナダ", "インド"], "explanation_ruby": "南半球《みなみはんきゅう》の島《しま》大陸《たいりく》国家《こっか》。", "body_kana": "コアラやカンガルーがいるくに、<Australia>にいつかいってみたいです。"}, {"id": "s1_015", "word": "autumn", "meaning_jp": "秋", "pos": "名", "body": "木の葉が赤や黄色に色づき始める<autumn>が、私の一番好きな季節。風が涼しくなり、街路樹を見上げて歩くのが楽しい。", "choices": ["春", "夏", "秋", "冬"], "correct_index": 2, "explanation": "イギリス英語の「秋」。アメリカでは fall を使うことが多い。", "body_ruby": "｜木の葉《このは》が赤《あか》や黄色《きいろ》に色《いろ》づき始《はじ》める<autumn>が、私《わたし》の一番好《いちばんす》きな季節《きせつ》。風《かぜ》が涼《すず》しくなり、街路樹《がいろじゅ》を見上《みあ》げて歩《ある》くのが楽《たの》しい。", "choices_ruby": ["春《はる》", "夏《なつ》", "秋《あき》", "冬《ふゆ》"], "explanation_ruby": "イギリス英語《えいご》の「秋《あき》」。アメリカでは fall を使《つか》うことが多《おお》い。", "body_kana": "このはがあかやきいろにいろづきはじめる<autumn>が、わたしのいちばんすきなきせつ。かぜがすずしくなり、がいろじゅをみあげてあるくのがたのしい。"}, {"id": "s1_016", "word": "beautiful", "meaning_jp": "美しい", "pos": "形", "body": "夕暮れの空にかかる虹が、信じられないほど<beautiful>でした。", "choices": ["美しい", "大きい", "暗い", "普通の"], "correct_index": 0, "explanation": "beauty(美)+ -ful(満ちた)で「美に満ちた」=「美しい」。", "body_ruby": "夕暮《ゆうぐ》れの空《そら》にかかる虹《にじ》が、信《しん》じられないほど<beautiful>でした。", "choices_ruby": ["美《うつく》しい", "大《おお》きい", "暗《くら》い", "普通《ふつう》の"], "explanation_ruby": "beauty(美《び》)+ -ful(満《み》ちた)で「美《び》に満《み》ちた」=「美《うつく》しい」。", "body_kana": "ゆうぐれのそらにかかるにじが、しんじられないほど<beautiful>でした。"}, {"id": "s1_017", "word": "big", "meaning_jp": "大きい", "pos": "形", "body": "駅前に新しくできたショッピングモールはとても<big>で、中で迷子になりました。", "choices": ["小さい", "大きい", "古い", "高い"], "correct_index": 1, "explanation": "サイズの大きさを表す最も基本的な形容詞。", "body_ruby": "駅前《えきまえ》に新《あたら》しくできたショッピングモールはとても<big>で、中《なか》で迷子《まいご》になりました。", "choices_ruby": ["小《ちい》さい", "大《おお》きい", "古《ふる》い", "高《たか》い"], "explanation_ruby": "サイズの大《おお》きさを表《あらわ》す最《もっと》も基本的《きほんてき》な形容詞《けいようし》。", "body_kana": "えきまえにあたらしくできたショッピングモールはとても<big>で、なかでまいごになりました。"}, {"id": "s1_018", "word": "bird", "meaning_jp": "鳥", "pos": "名", "body": "朝、窓の外で<bird>が綺麗な声でさえずっていた。羽を広げて青い空へ飛び立っていく姿が、カーテン越しに見えた。", "choices": ["虫", "鳥", "猫", "犬"], "correct_index": 1, "explanation": "羽を持ち空を飛ぶ動物の総称。", "body_ruby": "朝《あさ》、窓《まど》の外《そと》で<bird>が綺麗《きれい》な声《こえ》でさえずっていた。羽《はね》を広《ひろ》げて青《あお》い空《そら》へ飛《と》び立《た》っていく姿《すがた》が、カーテン越《ご》しに見《み》えた。", "choices_ruby": ["虫《むし》", "鳥《とり》", "猫《ねこ》", "犬《いぬ》"], "explanation_ruby": "羽《はね》を持《も》ち空《そら》を飛《と》ぶ動物《どうぶつ》の総称《そうしょう》。", "body_kana": "あさ、まどのそとで<bird>がきれいなこえでさえずっていた。はねをひろげてあおいそらへとびたっていくすがたが、カーテンごしにみえた。"}, {"id": "s1_019", "word": "book", "meaning_jp": "本", "pos": "名", "body": "図書館で借りた<book>を、夜にゆっくり読むのが好きです。", "choices": ["ノート", "本", "雑誌", "新聞"], "correct_index": 1, "explanation": "古英語 bōc(ブナの木)から。昔、文字をブナに刻んだことに由来。", "body_ruby": "図書館《としょかん》で借《か》りた<book>を、夜《よる》にゆっくり読《よ》むのが好《す》きです。", "choices_ruby": ["ノート", "本《ほん》", "雑誌《ざっし》", "新聞《しんぶん》"], "explanation_ruby": "古《こ》英語《えいご》 bō bc(ブナの木《き》)から。昔《むかし》、文字《もじ》をブナに刻《きざ》んだことに由来《ゆらい》。", "body_kana": "としょかんでかりた<book>を、よるにゆっくりよむのがすきです。"}, {"word": "back", "meaning_jp": "戻って、後ろ", "pos": "副", "body": "公園で午後ずっと遊んでいたが、お腹が空いてきたので、歩いて家に<back>した。家を出てから2時間が経っていた。", "choices": ["戻って", "前へ", "速く", "ゆっくり"], "correct_index": 0, "explanation": "back は「元の場所へ」のニュアンス。come back / go back の形でよく使う。", "id": "s1_020", "body_ruby": "公園《こうえん》で午後《ごご》ずっと遊《あそ》んでいたが、お腹《なか》が空《す》いてきたので、歩《ある》いて家《いえ》に<back>した。家《いえ》を出《で》てから2時間《じかん》が経《た》っていた。", "choices_ruby": ["戻《もど》って", "前《まえ》へ", "速《はや》く", "ゆっくり"], "explanation_ruby": "back は「元《もと》の場所《ばしょ》へ」のニュアンス。come back / go back の形《かたち》でよく使《つか》う。", "body_kana": "こうえんでごごずっとあそんでいたが、おなかがすいてきたので、あるいていえに<back>した。いえをでてから2時間がたっていた。"}, {"word": "bag", "meaning_jp": "かばん", "pos": "名", "body": "毎朝、教科書とノートと筆箱を<bag>の中に入れて学校に持って行く。中身はだいたい3キロくらいの重さになる。", "choices": ["かばん", "机", "棚", "靴"], "correct_index": 0, "explanation": "口の開いた入れ物全般。school bag, paper bag など複合語が多い。", "id": "s1_021", "body_ruby": "毎朝《まいあさ》、教科書《きょうかしょ》とノートと筆箱《ふでばこ》を<bag>の中《なか》に入《い》れて学校《がっこう》に持《も》って行《い》く。中身《なかみ》はだいたい3キロくらいの重《おも》さになる。", "choices_ruby": ["かばん", "机《つくえ》", "棚《たな》", "靴《くつ》"], "explanation_ruby": "口《くち》の開《ひら》いた入《い》れ物《もの》全般《ぜんぱん》。school bag, paper bag など複合語《ふくごうご》が多《おお》い。", "body_kana": "まいあさ、きょうかしょとノートとふでばこを<bag>のなかにいれてがっこうにもっていく。なかみはだいたい3キロくらいのおもさになる。"}, {"word": "ball", "meaning_jp": "ボール", "pos": "名", "body": "サッカーの試合で、丸い<ball>を足で蹴ってゴールに入れた。チームのみんなが大喜びで拍手してくれた。", "choices": ["ボール", "バット", "網", "棒"], "correct_index": 0, "explanation": "丸い球状の物体。soccer ball / baseball など組み合わせて使う。", "id": "s1_022", "body_ruby": "サッカーの試合《しあい》で、丸《まる》い<ball>を足《あし》で蹴《け》ってゴールに入《い》れた。チームのみんなが大喜《おおよろこ》びで拍手《はくしゅ》してくれた。", "choices_ruby": ["ボール", "バット", "網《あみ》", "棒《ぼう》"], "explanation_ruby": "丸《まる》い球状《きゅうじょう》の物体《ぶったい》。soccer ball / baseball など｜組み合《くみあ》わせて使《つか》う。", "body_kana": "サッカーのしあいで、まるい<ball>をあしでけってゴールにいれた。チームのみんながおおよろこびではくしゅしてくれた。"}, {"word": "baseball", "meaning_jp": "野球", "pos": "名", "body": "夏休みは家族で甲子園に<baseball>の試合を観に行く予定だ。9回まで投手がボールを投げ、バッターが打つスポーツだ。", "choices": ["野球", "サッカー", "テニス", "卓球"], "correct_index": 0, "explanation": "base(塁)+ ball(球)。アメリカ生まれの球技。", "id": "s1_023", "body_ruby": "夏休《なつやす》みは家族《かぞく》で甲子園《こうしえん》に<baseball>の試合《しあい》を観《み》に行《い》く予定《よてい》だ。9回《かい》まで投手《とうしゅ》がボールを投《な》げ、バッターが打《う》つスポーツだ。", "choices_ruby": ["野球《やきゅう》", "サッカー", "テニス", "卓球《たっきゅう》"], "explanation_ruby": "base(塁《るい》)+ ball(球《たま》)。アメリカ生《う》まれの球技《きゅうぎ》。", "body_kana": "なつやすみはかぞくでこうしえんに<baseball>のしあいをみにいくよていだ。9回までとうしゅがボールをなげ、バッターがうつスポーツだ。"}, {"word": "basketball", "meaning_jp": "バスケットボール", "pos": "名", "body": "彼は身長が180センチを超えるので、放課後に<basketball>をするのが大好きだ。ゴールにボールを入れるスポーツだ。", "choices": ["バスケットボール", "バレーボール", "野球", "ハンドボール"], "correct_index": 0, "explanation": "basket(かご)+ ball(球)。元々桃の収穫かごをゴールに使った。", "id": "s1_024", "body_ruby": "彼《かれ》は身長《しんちょう》が180センチを超《こ》えるので、放課後《ほうかご》に<basketball>をするのが大好《だいす》きだ。ゴールにボールを入《い》れるスポーツだ。", "choices_ruby": ["バスケットボール", "バレーボール", "野球《やきゅう》", "ハンドボール"], "explanation_ruby": "basket(かご)+ ball(球《たま》)。元々《もともと》桃《もも》の収穫《しゅうかく》かごをゴールに使《つか》った。", "body_kana": "かれはしんちょうが180センチをこえるので、ほうかごに<basketball>をするのがだいすきだ。ゴールにボールをいれるスポーツだ。"}, {"word": "bat", "meaning_jp": "コウモリ", "pos": "名", "body": "夕方になると、薄暗い空を黒い<bat>が音もなく飛んでいる姿を見かける。羽のある哺乳類で、洞窟に住むことが多い。", "choices": ["コウモリ", "鳥", "蝶", "蛾"], "correct_index": 0, "explanation": "野球の「バット」と同じ綴り。文脈で見分ける(=多義語)。", "id": "s1_025", "body_ruby": "夕方《ゆうがた》になると、薄暗《うすぐら》い空《そら》を黒《くろ》い<bat>が音《おと》もなく飛《と》んでいる姿《すがた》を見《み》かける。羽《はね》のある哺乳類《ほにゅうるい》で、洞窟《どうくつ》に住《す》むことが多《おお》い。", "choices_ruby": ["コウモリ", "鳥《とり》", "蝶《ちょう》", "蛾《が》"], "explanation_ruby": "野球《やきゅう》の「バット」と同《おな》じ綴《つづ》り。文脈《ぶんみゃく》で見分《みわ》ける(=多義《たぎ》語《ご》)。", "body_kana": "ゆうがたになると、うすぐらいそらをくろい<bat>がおともなくとんでいるすがたをみかける。はねのあるほにゅうるいで、どうくつにすむことがおおい。"}, {"word": "bath", "meaning_jp": "風呂", "pos": "名", "body": "学校から帰って汗をかいたので、温かい<bath>に20分間ゆっくりと浸かった。一日の疲れが取れて気持ち良かった。", "choices": ["風呂", "シャワー", "プール", "洗面所"], "correct_index": 0, "explanation": "take a bath = お風呂に入る。シャワーは take a shower。", "id": "s1_026", "body_ruby": "学校《がっこう》から帰《かえ》って汗《あせ》をかいたので、温《あたた》かい<bath>に20分間《ふんかん》ゆっくりと浸《つ》かった。一日《いちにち》の疲《つか》れが取《と》れて気持《きも》ち良《よ》かった。", "choices_ruby": ["風呂《ふろ》", "シャワー", "プール", "洗面所《せんめんじょ》"], "explanation_ruby": "take a bath = お風呂《ふろ》に入《はい》る。シャワーは take a shower。", "body_kana": "がっこうからかえってあせをかいたので、あたたかい<bath>に20分間ゆっくりとつかった。いちにちのつかれがとれてきもちよかった。"}, {"word": "bed", "meaning_jp": "ベッド", "pos": "名", "body": "毎晩11時には自分の部屋の<bed>に入って眠るようにしている。", "choices": ["ベッド", "椅子", "ソファ", "机"], "correct_index": 0, "explanation": "go to bed = 寝る、in bed = 寝ている状態。", "id": "s1_027", "body_ruby": "毎晩《まいばん》11時《じ》には自分《じぶん》の部屋《へや》の<bed>に入《はい》って眠《ねむ》るようにしている。", "choices_ruby": ["ベッド", "椅子《いす》", "ソファ", "机《つくえ》"], "explanation_ruby": "go to bed = 寝《ね》る、in bed = 寝《ね》ている状態《じょうたい》。", "body_kana": "まいばん11時にはじぶんのへやの<bed>にはいってねむるようにしている。"}, {"word": "bell", "meaning_jp": "ベル、鐘", "pos": "名", "body": "授業の終わりを知らせる<bell>がキーンと鳴り、生徒たちは一斉に教科書を閉じて休み時間に入った。", "choices": ["ベル", "笛", "拍手", "声"], "correct_index": 0, "explanation": "音を鳴らす道具。doorbell(玄関のベル)、jingle bell(鈴)。", "id": "s1_028", "body_ruby": "授業《じゅぎょう》の終《お》わりを知《し》らせる<bell>がキーンと鳴《な》り、生徒《せいと》たちは一斉《いっせい》に教科書《きょうかしょ》を閉《と》じて｜休み時間《やすみじかん》に入《はい》った。", "choices_ruby": ["ベル", "笛《ふえ》", "拍手《はくしゅ》", "声《こえ》"], "explanation_ruby": "音《おと》を鳴《な》らす道具《どうぐ》。doorbell(玄関《げんかん》のベル)、jingle bell(鈴《すず》)。", "body_kana": "じゅぎょうのおわりをしらせる<bell>がキーンとなり、せいとたちはいっせいにきょうかしょをとじてやすみじかんにはいった。"}, {"word": "bike", "meaning_jp": "自転車", "pos": "名", "body": "学校までは2キロほどあるので、毎朝赤い<bike>に乗ってペダルをこいで通学している。徒歩より15分短く着く。", "choices": ["自転車", "車", "バス", "電車"], "correct_index": 0, "explanation": "bicycle の短縮形。motorbike(オートバイ)も bike と呼ぶ。", "id": "s1_029", "body_ruby": "学校《がっこう》までは2キロほどあるので、毎朝《まいあさ》赤《あか》い<bike>に乗《の》ってペダルをこいで通学《つうがく》している。徒歩《とほ》より15分《ふん》短《みじか》く着《つ》く。", "choices_ruby": ["自転車《じてんしゃ》", "車《くるま》", "バス", "電車《でんしゃ》"], "explanation_ruby": "bicycle の短縮形《たんしゅくけい》。motorbike(オートバイ)も bike と呼《よ》ぶ。", "body_kana": "がっこうまでは2キロほどあるので、まいあさあかい<bike>にのってペダルをこいでつうがくしている。とほより15分みじかくつく。"}, {"word": "birthday", "meaning_jp": "誕生日", "pos": "名", "body": "明日は私が生まれた日、つまり13回目の<birthday>なので、家族がケーキを用意してくれることになっている。", "choices": ["誕生日", "結婚記念日", "正月", "卒業式"], "correct_index": 0, "explanation": "birth(誕生)+ day(日)。Happy birthday! と祝う。", "id": "s1_030", "body_ruby": "明日《あした》は私《わたし》が生《う》まれた日《ひ》、つまり13回《かい》目《め》の<birthday>なので、家族《かぞく》がケーキを用意《ようい》してくれることになっている。", "choices_ruby": ["誕生日《たんじょうび》", "結婚記念日《けっこんきねんび》", "正月《しょうがつ》", "卒業式《そつぎょうしき》"], "explanation_ruby": "birth(誕生《たんじょう》)+ day(日《にち》)。Happy birthday! と祝《いわ》う。", "body_kana": "あしたはわたしがうまれたひ、つまり13回めの<birthday>なので、かぞくがケーキをよういしてくれることになっている。"}, {"word": "black", "meaning_jp": "黒", "pos": "形", "body": "夜空には雲一つなく、見上げると一面が深い<black>で、星だけがきらきらと光っていた。", "choices": ["黒", "白", "青", "赤"], "correct_index": 0, "explanation": "色の名前。黒猫=black cat、黒板=blackboard。", "id": "s1_031", "body_ruby": "夜《よる》空《そら》には雲《くも》一《ひと》つなく、見上《みあ》げると一面《いちめん》が深《ふか》い<black>で、星《ほし》だけがきらきらと光《ひか》っていた。", "choices_ruby": ["黒《くろ》", "白《しろ》", "青《あお》", "赤《あか》"], "explanation_ruby": "色《いろ》の名前《なまえ》。黒猫《くろねこ》=black cat、黒板《こくばん》=blackboard。", "body_kana": "よるそらにはくもひとつなく、みあげるといちめんがふかい<black>で、ほしだけがきらきらとひかっていた。"}, {"word": "blue", "meaning_jp": "青", "pos": "形", "body": "夏の海は太陽の光で、どこまでも続く深い<blue>に輝いていて、見ているだけで気持ちが涼しくなった。", "choices": ["青", "緑", "赤", "黄"], "correct_index": 0, "explanation": "空や海の色。「青信号」は英語では green light。", "id": "s1_032", "body_ruby": "夏《なつ》の海《うみ》は太陽《たいよう》の光《ひかり》で、どこまでも続《つづ》く深《ふか》い<blue>に輝《かがや》いていて、見《み》ているだけで気持《きも》ちが涼《すず》しくなった。", "choices_ruby": ["青《あお》", "緑《みどり》", "赤《あか》", "黄《き》"], "explanation_ruby": "空《そら》や海《うみ》の色《いろ》。「青信号《あおしんごう》」は英語《えいご》では green light。", "body_kana": "なつのうみはたいようのひかりで、どこまでもつづくふかい<blue>にかがやいていて、みているだけできもちがすずしくなった。"}, {"word": "body", "meaning_jp": "体", "pos": "名", "body": "毎日30分のランニングを続けていたら、半年で<body>が引き締まり、階段を上っても息切れしなくなった。", "choices": ["体", "心", "頭", "声"], "correct_index": 0, "explanation": "頭以外の胴体全体、または身体全部。", "id": "s1_033", "body_ruby": "毎日《まいにち》30分《ふん》のランニングを続《つづ》けていたら、半年《はんとし》で<body>が引《ひ》き締《し》まり、階段《かいだん》を上《あ》っても息切《いきぎ》れしなくなった。", "choices_ruby": ["体《からだ》", "心《こころ》", "頭《あたま》", "声《こえ》"], "explanation_ruby": "頭以外《あたまいがい》の胴体《どうたい》全体《ぜんたい》、または身体《しんたい》全部《ぜんぶ》。", "body_kana": "まいにち30分のランニングをつづけていたら、はんとしで<body>がひきしまり、かいだんをあってもいきぎれしなくなった。"}, {"word": "bookstore", "meaning_jp": "本屋", "pos": "名", "body": "駅前の大きな<bookstore>には漫画から専門書まで5万冊が並んでいて、新刊を探すのが楽しみだ。", "choices": ["本屋", "図書館", "文房具店", "コンビニ"], "correct_index": 0, "explanation": "book(本)+ store(店)。図書館は library。", "id": "s1_034", "body_ruby": "駅前《えきまえ》の大《おお》きな<bookstore>には漫画《まんが》から専門書《せんもんしょ》まで5万冊《まんさつ》が並《なら》んでいて、新刊《しんかん》を探《さが》すのが楽《たの》しみだ。", "choices_ruby": ["本屋《ほんや》", "図書館《としょかん》", "文房具店《ぶんぼうぐてん》", "コンビニ"], "explanation_ruby": "book(本《ほん》)+ store(店《みせ》)。図書館《としょかん》は library。", "body_kana": "えきまえのおおきな<bookstore>にはまんがからせんもんしょまで5まんさつがならんでいて、しんかんをさがすのがたのしみだ。"}, {"word": "borrow", "meaning_jp": "借りる", "pos": "動", "body": "鉛筆を忘れたので、隣の席の友達に1本<borrow>した。「明日には必ず返すから」と約束して、使い終わった後ですぐ持ち主に渡した。", "choices": ["借りる", "返す", "買う", "なくす"], "correct_index": 0, "explanation": "後で返す約束で使わせてもらう。買う=buy。", "id": "s1_035", "body_ruby": "鉛筆《えんぴつ》を忘《わす》れたので、隣《となり》の席《せき》の友達《ともだち》に1本《ほん》<borrow>した。「明日《あした》には必《かなら》ず返《かえ》すから」と約束《やくそく》して、使《つか》い終《お》わった後《あと》ですぐ｜持ち主《もちぬし》に渡《わた》した。", "choices_ruby": ["借《か》りる", "返《かえ》す", "買《か》う", "なくす"], "explanation_ruby": "後《あと》で返《かえ》す約束《やくそく》で使《つか》わせてもらう。買《か》う=buy。", "body_kana": "えんぴつをわすれたので、となりのせきのともだちに1本<borrow>した。「あしたにはかならずかえすから」とやくそくして、つかいおわったあとですぐもちぬしにわたした。"}, {"word": "bought", "meaning_jp": "買った", "pos": "動", "body": "母は昨日デパートで、私の誕生日プレゼントとして3000円の新しいスニーカーを<bought>した。お金を払って手に入れた。", "choices": ["買った", "売った", "見つけた", "もらった"], "correct_index": 0, "explanation": "buy(買う)の過去形。buy-bought-bought の不規則変化。", "id": "s1_036", "body_ruby": "母《はは》は昨日《きのう》デパートで、私《わたし》の誕生日《たんじょうび》プレゼントとして3000円《えん》の新《あたら》しいスニーカーを<bought>した。お金《かね》を払《はら》って手《て》に入《い》れた。", "choices_ruby": ["買《か》った", "売《う》った", "見《み》つけた", "もらった"], "explanation_ruby": "buy(買《か》う)の過去形《かこけい》。buy-bought-bought の不規則《ふきそく》変化《へんか》。", "body_kana": "はははきのうデパートで、わたしのたんじょうびプレゼントとして3000円のあたらしいスニーカーを<bought>した。おかねをはらっててにいれた。"}, {"word": "boy", "meaning_jp": "男の子", "pos": "名", "body": "公園で泣いていた5歳くらいの<boy>に、お姉さんが優しく声をかけて、お母さんを一緒に探してあげた。", "choices": ["男の子", "女の子", "おじいさん", "おばあさん"], "correct_index": 0, "explanation": "若い男性。girl(女の子)の対義語。", "id": "s1_037", "body_ruby": "公園《こうえん》で泣《な》いていた5歳《さい》くらいの<boy>に、お姉《ねえ》さんが優《やさ》しく声《こえ》をかけて、お母《かあ》さんを一緒《いっしょ》に探《さが》してあげた。", "choices_ruby": ["｜男の子《おとこのこ》", "｜女の子《おんなのこ》", "おじいさん", "おばあさん"], "explanation_ruby": "若《わか》い男性《だんせい》。girl(｜女の子《おんなのこ》)の対義《たいぎ》語《ご》。", "body_kana": "こうえんでないていた5歳くらいの<boy>に、おねえさんがやさしくこえをかけて、おかあさんをいっしょにさがしてあげた。"}, {"word": "breakfast", "meaning_jp": "朝食", "pos": "名", "body": "毎朝7時に、卵とトーストとサラダの<breakfast>を食べてから学校に行く。", "choices": ["朝食", "昼食", "夕食", "夜食"], "correct_index": 0, "explanation": "break(やぶる)+ fast(断食)。夜の断食を破る=朝食。", "id": "s1_038", "body_ruby": "毎朝《まいあさ》7時《じ》に、卵《たまご》とトーストとサラダの<breakfast>を食《た》べてから学校《がっこう》に行《い》く。", "choices_ruby": ["朝食《ちょうしょく》", "昼食《ちゅうしょく》", "夕食《ゆうしょく》", "夜食《やしょく》"], "explanation_ruby": "break(やぶる)+ fast(断食《だんじき》)。夜《よる》の断食《だんじき》を破《やぶ》る=朝食《ちょうしょく》。", "body_kana": "まいあさ7時に、たまごとトーストとサラダの<breakfast>をたべてからがっこうにいく。"}, {"word": "brother", "meaning_jp": "兄弟", "pos": "名", "body": "私には3歳年上の<brother>がいて、よくサッカーを一緒に練習してくれる。", "choices": ["兄(弟)", "姉(妹)", "いとこ", "友達"], "correct_index": 0, "explanation": "兄も弟も brother。年齢で区別したい時は older / younger を付ける。", "id": "s1_039", "body_ruby": "私《わたし》には3歳《さい》年上《としうえ》の<brother>がいて、よくサッカーを一緒《いっしょ》に練習《れんしゅう》してくれる。", "choices_ruby": ["兄《あに》(弟《おとうと》)", "姉《あね》(妹《いもうと》)", "いとこ", "友達《ともだち》"], "explanation_ruby": "兄《あに》も弟《おとうと》も brother。年齢《ねんれい》で区別《くべつ》したい時《とき》は older / younger を付《つ》ける。", "body_kana": "わたしには3歳としうえの<brother>がいて、よくサッカーをいっしょにれんしゅうしてくれる。"}, {"word": "brown", "meaning_jp": "茶色", "pos": "形", "body": "秋になると、街路樹の葉が緑から鮮やかな<brown>に変わり、地面いっぱいに敷き詰められた。", "choices": ["茶色", "黒", "緑", "黄色"], "correct_index": 0, "explanation": "土やチョコレートの色。", "id": "s1_040", "body_ruby": "秋《あき》になると、街路樹《がいろじゅ》の葉《は》が緑《みどり》から鮮《あざ》やかな<brown>に変《か》わり、地面《じめん》いっぱいに敷《し》き詰《つ》められた。", "choices_ruby": ["茶色《ちゃいろ》", "黒《くろ》", "緑《みどり》", "黄色《きいろ》"], "explanation_ruby": "土《つち》やチョコレートの色《いろ》。", "body_kana": "あきになると、がいろじゅのはがみどりからあざやかな<brown>にかわり、じめんいっぱいにしきつめられた。"}, {"word": "brush", "meaning_jp": "ブラシ、磨く", "pos": "名/動", "body": "毎朝、髪を整えるために木製の<brush>を使って、頭のてっぺんから毛先まで丁寧にとかしている。", "choices": ["ブラシ", "ハサミ", "ピン", "ゴム"], "correct_index": 0, "explanation": "毛束のついた道具。toothbrush(歯ブラシ)もこれ。", "id": "s1_041", "body_ruby": "毎朝《まいあさ》、髪《かみ》を整《ととの》えるために木製《もくせい》の<brush>を使《つか》って、頭《あたま》のてっぺんから毛先《けさき》まで丁寧《ていねい》にとかしている。", "choices_ruby": ["ブラシ", "ハサミ", "ピン", "ゴム"], "explanation_ruby": "毛束《けたば》のついた道具《どうぐ》。toothbrush(歯《は》ブラシ)もこれ。", "body_kana": "まいあさ、かみをととのえるためにもくせいの<brush>をつかって、あたまのてっぺんからけさきまでていねいにとかしている。"}, {"word": "bus", "meaning_jp": "バス", "pos": "名", "body": "駅から家まで30人乗りの大きな<bus>に乗って帰る。料金は220円で、約15分で家の近くの停留所に着く。", "choices": ["バス", "電車", "車", "船"], "correct_index": 0, "explanation": "大型の乗合自動車。", "id": "s1_042", "body_ruby": "駅《えき》から家《いえ》まで30人乗《にんの》りの大《おお》きな<bus>に乗《の》って帰《かえ》る。料金《りょうきん》は220円《えん》で、約《やく》15分《ふん》で家《いえ》の近《ちか》くの停留所《ていりゅうしょ》に着《つ》く。", "choices_ruby": ["バス", "電車《でんしゃ》", "車《くるま》", "船《ふね》"], "explanation_ruby": "大型《おおがた》の乗合《のりあい》自動車《じどうしゃ》。", "body_kana": "えきからいえまで30人乗りのおおきな<bus>にのってかえる。りょうきんは220円で、やく15分でいえのちかくのていりゅうしょにつく。"}, {"word": "buy", "meaning_jp": "買う", "pos": "動", "body": "新しいゲーム機がほしいので、お年玉とお小遣いを貯めて、3万円のものを<buy>するつもりだ。", "choices": ["買う", "売る", "借りる", "あげる"], "correct_index": 0, "explanation": "buy-bought-bought の不規則動詞。sell(売る)の対義語。", "id": "s1_043", "body_ruby": "新《あたら》しいゲーム機《き》がほしいので、お年玉《としだま》とお小遣《こづか》いを貯《た》めて、3万円《まんえん》のものを<buy>するつもりだ。", "choices_ruby": ["買《か》う", "売《う》る", "借《か》りる", "あげる"], "explanation_ruby": "buy-bought-bought の不規則《ふきそく》動詞《どうし》。sell(売《う》る)の対義《たいぎ》語《ご》。", "body_kana": "あたらしいゲームきがほしいので、おとしだまとおこづかいをためて、3まんえんのものを<buy>するつもりだ。"}, {"word": "cake", "meaning_jp": "ケーキ", "pos": "名", "body": "誕生日には毎年、母が手作りのチョコレートの<cake>を焼いてくれる。ロウソクを立てて、家族で歌を歌うのが恒例だ。", "choices": ["ケーキ", "パン", "クッキー", "アイス"], "correct_index": 0, "explanation": "甘い焼き菓子。birthday cake(誕生日ケーキ)。", "id": "s1_044", "body_ruby": "誕生日《たんじょうび》には毎年《まいとし》、母《はは》が手作《てづく》りのチョコレートの<cake>を焼《や》いてくれる。ロウソクを立《た》てて、家族《かぞく》で歌《うた》を歌《うた》うのが恒例《こうれい》だ。", "choices_ruby": ["ケーキ", "パン", "クッキー", "アイス"], "explanation_ruby": "甘《あま》い焼《や》き菓子《かし》。birthday cake(誕生日《たんじょうび》ケーキ)。", "body_kana": "たんじょうびにはまいとし、ははがてづくりのチョコレートの<cake>をやいてくれる。ロウソクをたてて、かぞくでうたをうたうのがこうれいだ。"}, {"word": "came", "meaning_jp": "来た", "pos": "動", "body": "昨日、東京に住んでいるいとこが新幹線で2時間かけて私の家まで<came>した。久しぶりに会えてとても嬉しかった。", "choices": ["来た", "行った", "帰った", "去った"], "correct_index": 0, "explanation": "come(来る)の過去形。come-came-come の不規則変化。", "id": "s1_045", "body_ruby": "昨日《きのう》、東京《とうきょう》に住《す》んでいるいとこが新幹線《しんかんせん》で2時間《じかん》かけて私《わたし》の家《いえ》まで<came>した。久《ひさ》しぶりに会《あ》えてとても嬉《うれ》しかった。", "choices_ruby": ["来《き》た", "行《い》った", "帰《かえ》った", "去《さ》った"], "explanation_ruby": "come(来《く》る)の過去形《かこけい》。come-came-come の不規則《ふきそく》変化《へんか》。", "body_kana": "きのう、とうきょうにすんでいるいとこがしんかんせんで2時間かけてわたしのいえまで<came>した。ひさしぶりにあえてとてもうれしかった。"}, {"word": "camera", "meaning_jp": "カメラ", "pos": "名", "body": "祖父から13歳の誕生日に、レンズの大きな古い<camera>をもらった。シャッターを押すと「カチッ」と音がして、景色が写真として残る。", "choices": ["カメラ", "テレビ", "ラジオ", "電話"], "correct_index": 0, "explanation": "写真や動画を撮る機械。", "id": "s1_046", "body_ruby": "祖父《そふ》から13歳《さい》の誕生日《たんじょうび》に、レンズの大《おお》きな古《ふる》い<camera>をもらった。シャッターを押《お》すと「カチッ」と音《おと》がして、景色《けしき》が写真《しゃしん》として残《のこ》る。", "choices_ruby": ["カメラ", "テレビ", "ラジオ", "電話《でんわ》"], "explanation_ruby": "写真《しゃしん》や動画《どうが》を撮《と》る機械《きかい》。", "body_kana": "そふから13歳のたんじょうびに、レンズのおおきなふるい<camera>をもらった。シャッターをおすと「カチッ」とおとがして、けしきがしゃしんとしてのこる。"}, {"word": "Canberra", "meaning_jp": "キャンベラ", "pos": "名", "body": "オーストラリアの首都は、シドニーやメルボルンではなく、内陸にある<Canberra>という計画的に作られた都市だ。", "choices": ["キャンベラ", "シドニー", "メルボルン", "ブリスベン"], "correct_index": 0, "explanation": "オーストラリアの政治の中心。1913年に首都として人工的に作られた。", "id": "s1_047", "body_ruby": "オーストラリアの首都《しゅと》は、シドニーやメルボルンではなく、内陸《ないりく》にある<Canberra>という計画的《けいかくてき》に作《つく》られた都市《とし》だ。", "choices_ruby": ["キャンベラ", "シドニー", "メルボルン", "ブリスベン"], "explanation_ruby": "オーストラリアの政治《せいじ》の中心《ちゅうしん》。1913年《ねん》に首都《しゅと》として人工的《じんこうてき》に作《つく》られた。", "body_kana": "オーストラリアのしゅとは、シドニーやメルボルンではなく、ないりくにある<Canberra>というけいかくてきにつくられたとしだ。"}, {"word": "cap", "meaning_jp": "(つばのある)帽子", "pos": "名", "body": "野球チームの応援に行くため、チームのロゴが入った青い<cap>をかぶった。前にだけつばのある帽子だ。", "choices": ["帽子", "靴", "手袋", "マフラー"], "correct_index": 0, "explanation": "前にだけツバのある帽子。全周にツバがあるのは hat。", "id": "s1_048", "body_ruby": "野球《やきゅう》チームの応援《おうえん》に行《い》くため、チームのロゴが入《はい》った青《あお》い<cap>をかぶった。前《まえ》にだけつばのある帽子《ぼうし》だ。", "choices_ruby": ["帽子《ぼうし》", "靴《くつ》", "手袋《てぶくろ》", "マフラー"], "explanation_ruby": "前《まえ》にだけツバのある帽子《ぼうし》。全周《ぜんしゅう》にツバがあるのは hat。", "body_kana": "やきゅうチームのおうえんにいくため、チームのロゴがはいったあおい<cap>をかぶった。まえにだけつばのあるぼうしだ。"}, {"word": "car", "meaning_jp": "車", "pos": "名", "body": "父は毎朝7時に、家族用の4人乗りの<car>を運転して30分かけて会社へ通っている。ハンドルとアクセルで動く乗り物だ。", "choices": ["車", "バイク", "自転車", "電車"], "correct_index": 0, "explanation": "自家用の自動車。bus / truck と区別。", "id": "s1_049", "body_ruby": "父《ちち》は毎朝《まいあさ》7時《じ》に、家族用《かぞくよう》の4人乗《にんの》りの<car>を運転《うんてん》して30分《ふん》かけて会社《かいしゃ》へ通《かよ》っている。ハンドルとアクセルで動《うご》く｜乗り物《のりもの》だ。", "choices_ruby": ["車《くるま》", "バイク", "自転車《じてんしゃ》", "電車《でんしゃ》"], "explanation_ruby": "自家用《じかよう》の自動車《じどうしゃ》。bus / truck と区別《くべつ》。", "body_kana": "ちちはまいあさ7時に、かぞくようの4人乗りの<car>をうんてんして30分かけてかいしゃへかよっている。ハンドルとアクセルでうごくのりものだ。"}, {"word": "careful", "meaning_jp": "注意深い", "pos": "形", "body": "床が滑りやすいので、走らずに<careful>に歩くようにと先生から注意された。", "choices": ["注意深い", "急いだ", "強い", "速い"], "correct_index": 0, "explanation": "care(注意)+ -ful(満ちた)。Be careful! = 気をつけて!", "id": "s1_050", "body_ruby": "床《ゆか》が滑《すべ》りやすいので、走《はし》らずに<careful>に歩《ある》くようにと先生《せんせい》から注意《ちゅうい》された。", "choices_ruby": ["注意深《ちゅういぶか》い", "急《いそ》いだ", "強《つよ》い", "速《はや》い"], "explanation_ruby": "care(注意《ちゅうい》)+ -ful(満《み》ちた)。Be careful! = 気《き》をつけて!", "body_kana": "ゆかがすべりやすいので、はしらずに<careful>にあるくようにとせんせいからちゅういされた。"}, {"word": "carry", "meaning_jp": "運ぶ", "pos": "動", "body": "重い段ボール箱を、玄関から2階の自分の部屋まで両手で<carry>するのを母が手伝ってくれた。", "choices": ["運ぶ", "投げる", "壊す", "置く"], "correct_index": 0, "explanation": "別の場所まで持って移動する。bring と似ているが、移動の途中を強調。", "id": "s1_051", "body_ruby": "重《おも》い段《だん》ボール箱《はこ》を、玄関《げんかん》から2階《かい》の自分《じぶん》の部屋《へや》まで両手《りょうて》で<carry>するのを母《はは》が手伝《てつだ》ってくれた。", "choices_ruby": ["運《はこ》ぶ", "投《な》げる", "壊《こわ》す", "置《お》く"], "explanation_ruby": "別《べつ》の場所《ばしょ》まで持《も》って移動《いどう》する。bring と似《に》ているが、移動《いどう》の途中《とちゅう》を強調《きょうちょう》。", "body_kana": "おもいだんボールはこを、げんかんから2階のじぶんのへやまでりょうてで<carry>するのをははがてつだってくれた。"}, {"word": "case", "meaning_jp": "場合、ケース", "pos": "名", "body": "雨が降っている<case>には、傘を持っていくべきだ。状況や事情によって対応を変える必要がある。", "choices": ["場合", "理由", "結果", "原因"], "correct_index": 0, "explanation": "in case = 〜の場合に。状況・事例・容器の意味もある多義語。", "id": "s1_052", "body_ruby": "雨《あめ》が降《ふ》っている<case>には、傘《かさ》を持《も》っていくべきだ。状況《じょうきょう》や事情《じじょう》によって対応《たいおう》を変《か》える必要《ひつよう》がある。", "choices_ruby": ["場合《ばあい》", "理由《りゆう》", "結果《けっか》", "原因《げんいん》"], "explanation_ruby": "in case = 〜の場合《ばあい》に。状況《じょうきょう》・事例《じれい》・容器《ようき》の意味《いみ》もある多義《たぎ》語《ご》。", "body_kana": "あめがふっている<case>には、かさをもっていくべきだ。じょうきょうやじじょうによってたいおうをかえるひつようがある。"}, {"word": "cat", "meaning_jp": "猫", "pos": "名", "body": "私の家では、3年前から茶色の<cat>を一匹飼っている。名前はミケで、毎日「ニャー」と鳴いて甘えてくる。", "choices": ["猫", "犬", "ウサギ", "鳥"], "correct_index": 0, "explanation": "ペットの代表。鳴き声は meow(ミャー)。", "id": "s1_053", "body_ruby": "私《わたし》の家《いえ》では、3年《ねん》前《ぜん》から茶色《ちゃいろ》の<cat>を一匹《いっぴき》飼《か》っている。名前《なまえ》はミケで、毎日《まいにち》「ニャー」と鳴《な》いて甘《あま》えてくる。", "choices_ruby": ["猫《ねこ》", "犬《いぬ》", "ウサギ", "鳥《とり》"], "explanation_ruby": "ペットの代表《だいひょう》。｜鳴き声《なきごえ》は meow(ミャー)。", "body_kana": "わたしのいえでは、3年ぜんからちゃいろの<cat>をいっぴきかっている。なまえはミケで、まいにち「ニャー」とないてあまえてくる。"}, {"word": "catch", "meaning_jp": "捕まえる", "pos": "動", "body": "公園で遊んでいたら、友達が投げてきたフリスビーを両手でしっかり<catch>することができた。", "choices": ["捕まえる", "投げる", "落とす", "蹴る"], "correct_index": 0, "explanation": "catch-caught-caught の不規則動詞。throw(投げる)の対。", "id": "s1_054", "body_ruby": "公園《こうえん》で遊《あそ》んでいたら、友達《ともだち》が投《な》げてきたフリスビーを両手《りょうて》でしっかり<catch>することができた。", "choices_ruby": ["捕《つか》まえる", "投《な》げる", "落《お》とす", "蹴《け》る"], "explanation_ruby": "catch-caught-caught の不規則《ふきそく》動詞《どうし》。throw(投《な》げる)の対《つい》。", "body_kana": "こうえんであそんでいたら、ともだちがなげてきたフリスビーをりょうてでしっかり<catch>することができた。"}, {"word": "CD", "meaning_jp": "CD", "pos": "名", "body": "父の部屋には、若い頃に集めた音楽<CD>が200枚以上ある。円い盤に音が記録されている、昔よく使われた記録媒体だ。", "choices": ["CD", "テープ", "本", "写真"], "correct_index": 0, "explanation": "Compact Disc の略。直径12cmの記録メディア。", "id": "s1_055", "body_ruby": "父《ちち》の部屋《へや》には、若《わか》い頃《ごろ》に集《あつ》めた音楽《おんがく》<CD>が200枚《まい》以上《いじょう》ある。円《まる》い盤《ばん》に音《おと》が記録《きろく》されている、昔《むかし》よく使《つか》われた記録媒体《きろくばいたい》だ。", "choices_ruby": ["CD", "テープ", "本《ほん》", "写真《しゃしん》"], "explanation_ruby": "Compact Disc の略《りゃく》。直径《ちょっけい》12cmの記録《きろく》メディア。", "body_kana": "ちちのへやには、わかいごろにあつめたおんがく<CD>が200枚いじょうある。まるいばんにおとがきろくされている、むかしよくつかわれたきろくばいたいだ。"}, {"word": "chair", "meaning_jp": "椅子", "pos": "名", "body": "教室の<chair>は木製で、背もたれと4本の脚がついている。授業中は1時間ほど座って先生の話を聞く。", "choices": ["椅子", "机", "棚", "ベッド"], "correct_index": 0, "explanation": "1人用の座る家具。sofa は2-3人用。", "id": "s1_056", "body_ruby": "教室《きょうしつ》の<chair>は木製《もくせい》で、背《せ》もたれと4本《ほん》の脚《あし》がついている。授業中《じゅぎょうちゅう》は1時間《じかん》ほど座《すわ》って先生《せんせい》の話《はなし》を聞《き》く。", "choices_ruby": ["椅子《いす》", "机《つくえ》", "棚《たな》", "ベッド"], "explanation_ruby": "1人《ひとり》用《よう》の座《すわ》る家具《かぐ》。sofa は2-3人《にん》用《よう》。", "body_kana": "きょうしつの<chair>はもくせいで、せもたれと4本のあしがついている。じゅぎょうちゅうは1時間ほどすわってせんせいのはなしをきく。"}, {"word": "change", "meaning_jp": "変える、変化", "pos": "動/名", "body": "中学に入って、髪型を短く<change>することにした。今までと全く違う見た目になるよう変えるためだ。", "choices": ["変える", "守る", "増やす", "減らす"], "correct_index": 0, "explanation": "別の状態にする。change clothes(着替える)。", "id": "s1_057", "body_ruby": "中学《ちゅうがく》に入《はい》って、髪型《かみがた》を短《みじか》く<change>することにした。今《いま》までと全《まった》く違《ちが》う｜見た目《みため》になるよう変《か》えるためだ。", "choices_ruby": ["変《か》える", "守《まも》る", "増《ふ》やす", "減《へ》らす"], "explanation_ruby": "別《べつ》の状態《じょうたい》にする。change clothes(着替《きが》える)。", "body_kana": "ちゅうがくにはいって、かみがたをみじかく<change>することにした。いままでとまったくちがうみためになるようかえるためだ。"}, {"word": "child", "meaning_jp": "子供", "pos": "名", "body": "公園では、まだ小学校に入る前の小さな<child>がたくさん遊んでいて、保護者がベンチから見守っている。", "choices": ["子供", "大人", "老人", "赤ちゃん"], "correct_index": 0, "explanation": "複数形は children。adult(大人)の対義語。", "id": "s1_058", "body_ruby": "公園《こうえん》では、まだ小学校《しょうがっこう》に入《はい》る前《まえ》の小《ちい》さな<child>がたくさん遊《あそ》んでいて、保護者《ほごしゃ》がベンチから見守《みまも》っている。", "choices_ruby": ["子供《こども》", "大人《おとな》", "老人《ろうじん》", "赤《あか》ちゃん"], "explanation_ruby": "複数形《ふくすうけい》は children。adult(大人《おとな》)の対義《たいぎ》語《ご》。", "body_kana": "こうえんでは、まだしょうがっこうにはいるまえのちいさな<child>がたくさんあそんでいて、ほごしゃがベンチからみまもっている。"}, {"word": "China", "meaning_jp": "中国", "pos": "名", "body": "万里の長城やパンダで有名な国、<China>は人口が約14億人で、日本の西側に位置している。", "choices": ["中国", "韓国", "インド", "ロシア"], "correct_index": 0, "explanation": "東アジアの大国。Chinese は「中国の・中国語・中国人」。", "id": "s1_059", "body_ruby": "万里《ばんり》の長城《ちょうじょう》やパンダで有名《ゆうめい》な国《くに》、<China>は人口《じんこう》が約《やく》14億《おく》人《ひと》で、日本《にっぽん》の西側《にしがわ》に位置《いち》している。", "choices_ruby": ["中国《ちゅうごく》", "韓国《かんこく》", "インド", "ロシア"], "explanation_ruby": "東《ひがし》アジアの大国《たいこく》。Chinese は「中国《ちゅうごく》の・中国語《ちゅうごくご》・中国人《ちゅうごくじん》」。", "body_kana": "ばんりのちょうじょうやパンダでゆうめいなくに、<China>はじんこうがやく14おくひとで、にっぽんのにしがわにいちしている。"}, {"word": "class", "meaning_jp": "クラス、授業", "pos": "名", "body": "私の<class>には30人の生徒がいて、毎日6時間の授業を一緒に受けている。学校での学習のまとまりだ。", "choices": ["クラス", "学校", "部屋", "学年"], "correct_index": 0, "explanation": "「組」「授業」の両方の意味。English class = 英語の授業。", "id": "s1_060", "body_ruby": "私《わたし》の<class>には30人《にん》の生徒《せいと》がいて、毎日《まいにち》6時間《じかん》の授業《じゅぎょう》を一緒《いっしょ》に受《う》けている。学校《がっこう》での学習《がくしゅう》のまとまりだ。", "choices_ruby": ["クラス", "学校《がっこう》", "部屋《へや》", "学年《がくねん》"], "explanation_ruby": "「組《くみ》」「授業《じゅぎょう》」の両方《りょうほう》の意味《いみ》。English class = 英語《えいご》の授業《じゅぎょう》。", "body_kana": "わたしの<class>には30人のせいとがいて、まいにち6時間のじゅぎょうをいっしょにうけている。がっこうでのがくしゅうのまとまりだ。"}, {"word": "classmate", "meaning_jp": "クラスメイト", "pos": "名", "body": "中学に入って初めての席は、小学校で同じ組だった<classmate>の隣だった。", "choices": ["クラスメイト", "先生", "先輩", "後輩"], "correct_index": 0, "explanation": "class(クラス)+ mate(仲間)。", "id": "s1_061", "body_ruby": "中学《ちゅうがく》に入《はい》って初《はじ》めての席《せき》は、小学校《しょうがっこう》で同《おな》じ組《くみ》だった<classmate>の隣《となり》だった。", "choices_ruby": ["クラスメイト", "先生《せんせい》", "先輩《せんぱい》", "後輩《こうはい》"], "explanation_ruby": "class(クラス)+ mate(仲間《なかま》)。", "body_kana": "ちゅうがくにはいってはじめてのせきは、しょうがっこうでおなじくみだった<classmate>のとなりだった。"}, {"word": "classroom", "meaning_jp": "教室", "pos": "名", "body": "私の<classroom>は3階の南側にあり、窓から運動場と桜の木がよく見える。授業を受ける部屋だ。", "choices": ["教室", "職員室", "体育館", "図書室"], "correct_index": 0, "explanation": "class(クラス)+ room(部屋)。", "id": "s1_062", "body_ruby": "私《わたし》の<classroom>は3階《かい》の南側《みなみがわ》にあり、窓《まど》から運動場《うんどうじょう》と桜《さくら》の木《き》がよく見《み》える。授業《じゅぎょう》を受《う》ける部屋《へや》だ。", "choices_ruby": ["教室《きょうしつ》", "職員室《しょくいんしつ》", "体育館《たいいくかん》", "図書室《としょしつ》"], "explanation_ruby": "class(クラス)+ room(部屋《へや》)。", "body_kana": "わたしの<classroom>は3階のみなみがわにあり、まどからうんどうじょうとさくらのきがよくみえる。じゅぎょうをうけるへやだ。"}, {"word": "clean", "meaning_jp": "きれいな、掃除する", "pos": "形/動", "body": "毎週日曜日に、ほうきと雑巾を使って自分の部屋を<clean>している。床も机もピカピカになって気持ち良い。", "choices": ["掃除する", "汚す", "壊す", "片付ける"], "correct_index": 0, "explanation": "汚れを取り除く。形容詞では「きれいな」。dirty(汚い)の対。", "id": "s1_063", "body_ruby": "毎週《まいしゅう》日曜日《にちようび》に、ほうきと雑巾《ぞうきん》を使《つか》って自分《じぶん》の部屋《へや》を<clean>している。床《ゆか》も机《つくえ》もピカピカになって｜気持ち良《きもちよ》い。", "choices_ruby": ["掃除《そうじ》する", "汚《よご》す", "壊《こわ》す", "片付《かたづ》ける"], "explanation_ruby": "汚《よご》れを｜取り除《とりのぞ》く。形容詞《けいようし》では「きれいな」。dirty(汚《きたな》い)の対《つい》。", "body_kana": "まいしゅうにちようびに、ほうきとぞうきんをつかってじぶんのへやを<clean>している。ゆかもつくえもピカピカになってきもちよい。"}, {"word": "climb", "meaning_jp": "登る", "pos": "動", "body": "夏休みに家族で富士山に挑戦し、山頂まで6時間かけてゆっくりと<climb>した。", "choices": ["登る", "降りる", "歩く", "走る"], "correct_index": 0, "explanation": "b は発音しない(climb=クライム)。mountain climbing(登山)。", "id": "s1_064", "body_ruby": "夏休《なつやす》みに家族《かぞく》で富士山《ふじさん》に挑戦《ちょうせん》し、山頂《さんちょう》まで6時間《じかん》かけてゆっくりと<climb>した。", "choices_ruby": ["登《のぼ》る", "降《お》りる", "歩《ある》く", "走《はし》る"], "explanation_ruby": "b は発音《はつおん》しない(climb=クライム)。mountain climbing(登山《とざん》)。", "body_kana": "なつやすみにかぞくでふじさんにちょうせんし、さんちょうまで6時間かけてゆっくりと<climb>した。"}, {"word": "close", "meaning_jp": "閉める", "pos": "動", "body": "夕方になって寒くなってきたので、開いていた窓を全部<close>して、暖房をつけた。", "choices": ["閉める", "開ける", "壊す", "見る"], "correct_index": 0, "explanation": "open(開ける)の対義語。形容詞では「近い」の意味もある。", "id": "s1_065", "body_ruby": "夕方《ゆうがた》になって寒《さむ》くなってきたので、開《ひら》いていた窓《まど》を全部《ぜんぶ》<close>して、暖房《だんぼう》をつけた。", "choices_ruby": ["閉《し》める", "開《ひら》ける", "壊《こわ》す", "見《み》る"], "explanation_ruby": "open(開《ひら》ける)の対義《たいぎ》語《ご》。形容詞《けいようし》では「近《ちか》い」の意味《いみ》もある。", "body_kana": "ゆうがたになってさむくなってきたので、ひらいていたまどをぜんぶ<close>して、だんぼうをつけた。"}, {"word": "clothes", "meaning_jp": "服", "pos": "名", "body": "母は私の部屋に散らかった<clothes>をハンガーにかけたり、引き出しにしまったりしてくれた。", "choices": ["服", "靴", "本", "おもちゃ"], "correct_index": 0, "explanation": "常に複数形。clothes line = 物干し綱。", "id": "s1_066", "body_ruby": "母《はは》は私《わたし》の部屋《へや》に散《ち》らかった<clothes>をハンガーにかけたり、｜引き出《ひきだ》しにしまったりしてくれた。", "choices_ruby": ["服《ふく》", "靴《くつ》", "本《ほん》", "おもちゃ"], "explanation_ruby": "常《つね》に複数形《ふくすうけい》。clothes line = 物干《ものほ》し綱《つな》。", "body_kana": "はははわたしのへやにちらかった<clothes>をハンガーにかけたり、ひきだしにしまったりしてくれた。"}, {"word": "club", "meaning_jp": "部活、クラブ", "pos": "名", "body": "中学校に入ってから、放課後にバスケットボールの<club>に入って、週4回練習している。", "choices": ["部活", "授業", "塾", "友達"], "correct_index": 0, "explanation": "趣味やスポーツの集まり。tennis club, music club など。", "id": "s1_067", "body_ruby": "中学校《ちゅうがっこう》に入《はい》ってから、放課後《ほうかご》にバスケットボールの<club>に入《はい》って、週《しゅう》4回《かい》練習《れんしゅう》している。", "choices_ruby": ["部活《ぶかつ》", "授業《じゅぎょう》", "塾《じゅく》", "友達《ともだち》"], "explanation_ruby": "趣味《しゅみ》やスポーツの集《あつ》まり。tennis club, music club など。", "body_kana": "ちゅうがっこうにはいってから、ほうかごにバスケットボールの<club>にはいって、しゅう4回れんしゅうしている。"}, {"word": "color", "meaning_jp": "色", "pos": "名", "body": "虹には赤・橙・黄・緑・青・藍・紫の7つの<color>があり、雨上がりの空に並んで現れる。", "choices": ["色", "形", "音", "におい"], "correct_index": 0, "explanation": "イギリス英語では colour。", "id": "s1_068", "body_ruby": "虹《にじ》には赤《あか》・橙《だいだい》・黄《き》・緑《みどり》・青《あお》・藍《あい》・紫《むらさき》の7つの<color>があり、雨上《あめあ》がりの空《そら》に並《なら》んで現《あらわ》れる。", "choices_ruby": ["色《いろ》", "形《かたち》", "音《おと》", "におい"], "explanation_ruby": "イギリス英語《えいご》では colour。", "body_kana": "にじにはあか・だいだい・き・みどり・あお・あい・むらさきの7つの<color>があり、あめあがりのそらにならんであらわれる。"}, {"word": "computer", "meaning_jp": "コンピュータ", "pos": "名", "body": "宿題のレポートを書くために、キーボードとマウスを使って<computer>で文章を打った。", "choices": ["コンピュータ", "テレビ", "ラジオ", "電話"], "correct_index": 0, "explanation": "compute(計算する)+ -er(機械)。", "id": "s1_069", "body_ruby": "宿題《しゅくだい》のレポートを書《か》くために、キーボードとマウスを使《つか》って<computer>で文章《ぶんしょう》を打《う》った。", "choices_ruby": ["コンピュータ", "テレビ", "ラジオ", "電話《でんわ》"], "explanation_ruby": "compute(計算《けいさん》する)+ -er(機械《きかい》)。", "body_kana": "しゅくだいのレポートをかくために、キーボードとマウスをつかって<computer>でぶんしょうをうった。"}, {"word": "cook", "meaning_jp": "料理する", "pos": "動", "body": "母は家にあった野菜と肉と米を使って、台所で40分かけて夕食を<cook>してくれた。", "choices": ["料理する", "食べる", "片付ける", "買う"], "correct_index": 0, "explanation": "名詞で「料理人」の意味もある。He is a good cook.", "id": "s1_070", "body_ruby": "母《はは》は家《いえ》にあった野菜《やさい》と肉《にく》と米《こめ》を使《つか》って、台所《だいどころ》で40分《ふん》かけて夕食《ゆうしょく》を<cook>してくれた。", "choices_ruby": ["料理《りょうり》する", "食《た》べる", "片付《かたづ》ける", "買《か》う"], "explanation_ruby": "名詞《めいし》で「料理人《りょうりにん》」の意味《いみ》もある。He is a good cook.", "body_kana": "はははいえにあったやさいとにくとこめをつかって、だいどころで40分かけてゆうしょくを<cook>してくれた。"}, {"word": "course", "meaning_jp": "コース、講座", "pos": "名", "body": "夏休みに、市民センターで開かれる英会話の3か月<course>に申し込んだ。順序立てて学んでいく授業のまとまりだ。", "choices": ["講座", "試験", "学校", "教科書"], "correct_index": 0, "explanation": "of course(もちろん)の慣用句も覚えておく。", "id": "s1_071", "body_ruby": "夏休《なつやす》みに、市民《しみん》センターで開《ひら》かれる英会話《えいかいわ》の3か月《かげつ》<course>に｜申し込《もうしこ》んだ。順序《じゅんじょ》立《た》てて学《まな》んでいく授業《じゅぎょう》のまとまりだ。", "choices_ruby": ["講座《こうざ》", "試験《しけん》", "学校《がっこう》", "教科書《きょうかしょ》"], "explanation_ruby": "of course(もちろん)の慣用句《かんようく》も覚《おぼ》えておく。", "body_kana": "なつやすみに、しみんセンターでひらかれるえいかいわの3かかげつ<course>にもうしこんだ。じゅんじょたててまなんでいくじゅぎょうのまとまりだ。"}, {"word": "cousin", "meaning_jp": "いとこ", "pos": "名", "body": "おじさん夫婦の子供である私と同い年の<cousin>とは、お正月とお盆に祖父母の家で会って一緒に遊ぶ。", "choices": ["いとこ", "兄弟", "おじ", "甥"], "correct_index": 0, "explanation": "親の兄弟の子。男女どちらにも使う。", "id": "s1_072", "body_ruby": "おじさん夫婦《ふうふ》の子供《こども》である私《わたし》と同《おな》い年《ねん》の<cousin>とは、お正月《しょうがつ》とお盆《ぼん》に祖父母《そふぼ》の家《いえ》で会《あ》って一緒《いっしょ》に遊《あそ》ぶ。", "choices_ruby": ["いとこ", "兄弟《きょうだい》", "おじ", "甥《おい》"], "explanation_ruby": "親《おや》の兄弟《きょうだい》の子《こ》。男女《だんじょ》どちらにも使《つか》う。", "body_kana": "おじさんふうふのこどもであるわたしとおないねんの<cousin>とは、おしょうがつとおぼんにそふぼのいえであっていっしょにあそぶ。"}, {"word": "cry", "meaning_jp": "泣く", "pos": "動", "body": "公園で転んでひざをすりむいた小さな子が、大粒の涙を流して大きな声で<cry>していた。", "choices": ["泣く", "笑う", "怒る", "歌う"], "correct_index": 0, "explanation": "laugh(笑う)の対。cry-cried-cried の規則変化。", "id": "s1_073", "body_ruby": "公園《こうえん》で転《ころ》んでひざをすりむいた小《ちい》さな子《こ》が、大粒《おおつぶ》の涙《なみだ》を流《なが》して大《おお》きな声《こえ》で<cry>していた。", "choices_ruby": ["泣《な》く", "笑《わら》う", "怒《いか》る", "歌《うた》う"], "explanation_ruby": "laugh(笑《わら》う)の対《つい》。cry-cried-cried の規則《きそく》変化《へんか》。", "body_kana": "こうえんでころんでひざをすりむいたちいさなこが、おおつぶのなみだをながしておおきなこえで<cry>していた。"}, {"word": "culture", "meaning_jp": "文化", "pos": "名", "body": "日本の<culture>には、茶道や着物や和食など、長い歴史の中で受け継がれてきた独自のものがたくさんある。", "choices": ["文化", "経済", "政治", "気候"], "correct_index": 0, "explanation": "Japanese culture, pop culture など。", "id": "s1_074", "body_ruby": "日本《にっぽん》の<culture>には、茶道《さどう》や着物《きもの》や和食《わしょく》など、長《なが》い歴史《れきし》の中《なか》で｜受け継《うけつ》がれてきた独自《どくじ》のものがたくさんある。", "choices_ruby": ["文化《ぶんか》", "経済《けいざい》", "政治《せいじ》", "気候《きこう》"], "explanation_ruby": "Japanese culture, pop culture など。", "body_kana": "にっぽんの<culture>には、さどうやきものやわしょくなど、ながいれきしのなかでうけつがれてきたどくじのものがたくさんある。"}, {"word": "cute", "meaning_jp": "かわいい", "pos": "形", "body": "ペットショップの窓から見えた、生後3か月の小さな子犬は、しっぽを振っていてとても<cute>だった。", "choices": ["かわいい", "怖い", "強い", "賢い"], "correct_index": 0, "explanation": "子供や小動物に使う。pretty(きれい)とは少し違う。", "id": "s1_075", "body_ruby": "ペットショップの窓《まど》から見《み》えた、生後《せいご》3か月《かげつ》の小《ちい》さな子犬《こいぬ》は、しっぽを振《ふ》っていてとても<cute>だった。", "choices_ruby": ["かわいい", "怖《こわ》い", "強《つよ》い", "賢《かしこ》い"], "explanation_ruby": "子供《こども》や小動物《しょうどうぶつ》に使《つか》う。pretty(きれい)とは少《すこ》し違《ちが》う。", "body_kana": "ペットショップのまどからみえた、せいご3かかげつのちいさなこいぬは、しっぽをふっていてとても<cute>だった。"}, {"word": "dance", "meaning_jp": "踊る", "pos": "動", "body": "音楽祭のステージで、クラス全員が手をつないで音楽に合わせて<dance>した。", "choices": ["踊る", "歌う", "走る", "歩く"], "correct_index": 0, "explanation": "名詞でも動詞でも使う。dancer = ダンサー。", "id": "s1_076", "body_ruby": "音楽祭《おんがくさい》のステージで、クラス全員《ぜんいん》が手《て》をつないで音楽《おんがく》に合《あ》わせて<dance>した。", "choices_ruby": ["踊《おど》る", "歌《うた》う", "走《はし》る", "歩《ある》く"], "explanation_ruby": "名詞《めいし》でも動詞《どうし》でも使《つか》う。dancer = ダンサー。", "body_kana": "おんがくさいのステージで、クラスぜんいんがてをつないでおんがくにあわせて<dance>した。"}, {"word": "daughter", "meaning_jp": "娘", "pos": "名", "body": "隣の家のおばさんには中学2年生になる<daughter>がいて、よく駅で見かける。", "choices": ["娘", "息子", "姪", "妹"], "correct_index": 0, "explanation": "son(息子)の対。", "id": "s1_077", "body_ruby": "隣《となり》の家《いえ》のおばさんには中学《ちゅうがく》2年生《ねんせい》になる<daughter>がいて、よく駅《えき》で見《み》かける。", "choices_ruby": ["娘《むすめ》", "息子《むすこ》", "姪《めい》", "妹《いもうと》"], "explanation_ruby": "son(息子《むすこ》)の対《つい》。", "body_kana": "となりのいえのおばさんにはちゅうがく2年生になる<daughter>がいて、よくえきでみかける。"}, {"word": "day", "meaning_jp": "日、1日", "pos": "名", "body": "1週間は月曜日から日曜日まで、7つの<day>でできている。地球が1回まわると太陽が昇って沈むまで、24時間ぴったり進む。", "choices": ["日", "週", "月", "年"], "correct_index": 0, "explanation": "every day = 毎日、one day = ある日。", "id": "s1_078", "body_ruby": "1週間《しゅうかん》は月曜日《げつようび》から日曜日《にちようび》まで、7つの<day>でできている。地球《ちきゅう》が1回《かい》まわると太陽《たいよう》が昇《のぼ》って沈《しず》むまで、24時間《じかん》ぴったり進《すす》む。", "choices_ruby": ["日《にち》", "週《しゅう》", "月《がつ》", "年《ねん》"], "explanation_ruby": "every day = 毎日《まいにち》、one day = ある日《ひ》。", "body_kana": "1週間はげつようびからにちようびまで、7つの<day>でできている。ちきゅうが1回まわるとたいようがのぼってしずむまで、24時間ぴったりすすむ。"}, {"word": "dear", "meaning_jp": "親愛なる、いとしい", "pos": "形", "body": "手紙の冒頭に「<dear>お母さんへ」と書いて、感謝の気持ちを丁寧に伝える文章を続けた。大切に思う相手に使う言葉だ。", "choices": ["親愛なる", "嫌いな", "知らない", "怖い"], "correct_index": 0, "explanation": "Dear ○○ で「親愛なる○○へ」(手紙の書き出し)。", "id": "s1_079", "body_ruby": "手紙《てがみ》の冒頭《ぼうとう》に「<dear>お母《かあ》さんへ」と書《か》いて、感謝《かんしゃ》の気持《きも》ちを丁寧《ていねい》に伝《つた》える文章《ぶんしょう》を続《つづ》けた。大切《たいせつ》に思《おも》う相手《あいて》に使《つか》う言葉《ことば》だ。", "choices_ruby": ["親愛《しんあい》なる", "嫌《きら》いな", "知《し》らない", "怖《こわ》い"], "explanation_ruby": "Dear ○○ で「親愛《しんあい》なる○○へ」(手紙《てがみ》の｜書き出《かきだ》し)。", "body_kana": "てがみのぼうとうに「<dear>おかあさんへ」とかいて、かんしゃのきもちをていねいにつたえるぶんしょうをつづけた。たいせつにおもうあいてにつかうことばだ。"}, {"word": "December", "meaning_jp": "12月", "pos": "名", "body": "1年の最後の月である<December>には、クリスマスや大晦日があり、街はイルミネーションで飾られ、家族で年越しの準備をする。", "choices": ["12月", "11月", "1月", "10月"], "correct_index": 0, "explanation": "deca(10)が語源。古代ローマ暦の10番目の月だった。", "id": "s1_080", "body_ruby": "1年《ねん》の最後《さいご》の月《がつ》である<December>には、クリスマスや大晦日《おおみそか》があり、街《まち》はイルミネーションで飾《かざ》られ、家族《かぞく》で年越《としこ》しの準備《じゅんび》をする。", "choices_ruby": ["12月《がつ》", "11月《がつ》", "1月《がつ》", "10月《がつ》"], "explanation_ruby": "deca(10)が語源《ごげん》。古代《こだい》ローマ暦《こよみ》の10番目《ばんめ》の月《がつ》だった。", "body_kana": "1年のさいごのがつである<December>には、クリスマスやおおみそかがあり、まちはイルミネーションでかざられ、かぞくでとしこしのじゅんびをする。"}, {"word": "dictionary", "meaning_jp": "辞書", "pos": "名", "body": "英語の宿題でわからない単語があったので、3万語が載っている厚い<dictionary>で意味と発音を調べた。", "choices": ["辞書", "教科書", "ノート", "雑誌"], "correct_index": 0, "explanation": "dict(言う)が語源。English-Japanese dictionary = 英和辞典。", "id": "s1_081", "body_ruby": "英語《えいご》の宿題《しゅくだい》でわからない単語《たんご》があったので、3万語《まんご》が載《の》っている厚《あつ》い<dictionary>で意味《いみ》と発音《はつおん》を調《しら》べた。", "choices_ruby": ["辞書《じしょ》", "教科書《きょうかしょ》", "ノート", "雑誌《ざっし》"], "explanation_ruby": "dict(言《い》う)が語源《ごげん》。English-Japanese dictionary = 英和辞典《えいわじてん》。", "body_kana": "えいごのしゅくだいでわからないたんごがあったので、3まんごがのっているあつい<dictionary>でいみとはつおんをしらべた。"}, {"word": "dinner", "meaning_jp": "夕食", "pos": "名", "body": "家族そろって午後7時に、母が作ってくれた魚と味噌汁とご飯の<dinner>を食べる。", "choices": ["夕食", "朝食", "昼食", "おやつ"], "correct_index": 0, "explanation": "1日のメインの食事。英米では夕食を指すことが多い。", "id": "s1_082", "body_ruby": "家族《かぞく》そろって午後《ごご》7時《じ》に、母《はは》が作《つく》ってくれた魚《さかな》と味噌汁《みそしる》とご飯《めし》の<dinner>を食《た》べる。", "choices_ruby": ["夕食《ゆうしょく》", "朝食《ちょうしょく》", "昼食《ちゅうしょく》", "おやつ"], "explanation_ruby": "1日《にち》のメインの食事《しょくじ》。英米《えいべい》では夕食《ゆうしょく》を指《さ》すことが多《おお》い。", "body_kana": "かぞくそろってごご7時に、ははがつくってくれたさかなとみそしるとごめしの<dinner>をたべる。"}, {"word": "dog", "meaning_jp": "犬", "pos": "名", "body": "近所のおじいさんは毎朝、茶色い柴犬の<dog>を散歩に連れて行く。「ワン」と鳴く、人間と一緒に暮らす動物だ。", "choices": ["犬", "猫", "牛", "馬"], "correct_index": 0, "explanation": "鳴き声は woof(ワン)。puppy(子犬)とも言う。", "id": "s1_083", "body_ruby": "近所《きんじょ》のおじいさんは毎朝《まいあさ》、茶色《ちゃいろ》い柴犬《しばいぬ》の<dog>を散歩《さんぽ》に連《つ》れて行《い》く。「ワン」と鳴《な》く、人間《にんげん》と一緒《いっしょ》に暮《く》らす動物《どうぶつ》だ。", "choices_ruby": ["犬《いぬ》", "猫《ねこ》", "牛《うし》", "馬《うま》"], "explanation_ruby": "｜鳴き声《なきごえ》は woof(ワン)。puppy(子犬《こいぬ》)とも言《い》う。", "body_kana": "きんじょのおじいさんはまいあさ、ちゃいろいしばいぬの<dog>をさんぽにつれていく。「ワン」となく、にんげんといっしょにくらすどうぶつだ。"}, {"word": "dollar", "meaning_jp": "ドル", "pos": "名", "body": "アメリカに住むいとこが来た時、おみやげに1<dollar>札と書かれたお金をくれた。約150円の価値があるアメリカの通貨だ。", "choices": ["ドル", "円", "ユーロ", "ポンド"], "correct_index": 0, "explanation": "$ という記号で表す。米・加・豪などで使う。", "id": "s1_084", "body_ruby": "アメリカに住《す》むいとこが来《き》た時《とき》、おみやげに1<dollar>札《さつ》と書《か》かれたお金《かね》をくれた。約《やく》150円《えん》の価値《かち》があるアメリカの通貨《つうか》だ。", "choices_ruby": ["ドル", "円《えん》", "ユーロ", "ポンド"], "explanation_ruby": "$ という記号《きごう》で表《あらわ》す。米《こめ》・加《か》・豪《ごう》などで使《つか》う。", "body_kana": "アメリカにすむいとこがきたとき、おみやげに1<dollar>さつとかかれたおかねをくれた。やく150円のかちがあるアメリカのつうかだ。"}, {"word": "door", "meaning_jp": "ドア、扉", "pos": "名", "body": "家に帰って玄関の<door>を開けると、犬が嬉しそうにしっぽを振って迎えてくれた。部屋への出入口にある板だ。", "choices": ["ドア", "窓", "壁", "屋根"], "correct_index": 0, "explanation": "open / close the door。window と区別。", "id": "s1_085", "body_ruby": "家《いえ》に帰《かえ》って玄関《げんかん》の<door>を開《ひら》けると、犬《いぬ》が嬉《うれ》しそうにしっぽを振《ふ》って迎《むか》えてくれた。部屋《へや》への出入口《でいりぐち》にある板《いた》だ。", "choices_ruby": ["ドア", "窓《まど》", "壁《かべ》", "屋根《やね》"], "explanation_ruby": "open / close the door。window と区別《くべつ》。", "body_kana": "いえにかえってげんかんの<door>をひらけると、いぬがうれしそうにしっぽをふってむかえてくれた。へやへのでいりぐちにあるいただ。"}, {"word": "draw", "meaning_jp": "描く", "pos": "動", "body": "美術の授業で、鉛筆と消しゴムを使って、目の前にあったリンゴと花瓶を画用紙に丁寧に<draw>した。", "choices": ["描く", "塗る", "切る", "消す"], "correct_index": 0, "explanation": "線で描く。paint は絵の具で塗る。draw-drew-drawn。", "id": "s1_086", "body_ruby": "美術《びじゅつ》の授業《じゅぎょう》で、鉛筆《えんぴつ》と消《け》しゴムを使《つか》って、｜目の前《めのまえ》にあったリンゴと花瓶《かびん》を画用紙《がようし》に丁寧《ていねい》に<draw>した。", "choices_ruby": ["描《えが》く", "塗《ぬ》る", "切《き》る", "消《け》す"], "explanation_ruby": "線《せん》で描《えが》く。paint は｜絵の具《えのぐ》で塗《ぬ》る。draw-drew-drawn。", "body_kana": "びじゅつのじゅぎょうで、えんぴつとけしゴムをつかって、めのまえにあったリンゴとかびんをがようしにていねいに<draw>した。"}, {"word": "drew", "meaning_jp": "描いた", "pos": "動", "body": "美術の時間に、彼は鉛筆で隣の席の友達の顔をモデルにして、20分かけて画用紙に絵を<drew>した。", "choices": ["描いた", "塗った", "消した", "撮った"], "correct_index": 0, "explanation": "draw の過去形。draw-drew-drawn の不規則変化。", "id": "s1_087", "body_ruby": "美術《びじゅつ》の時間《じかん》に、彼《かれ》は鉛筆《えんぴつ》で隣《となり》の席《せき》の友達《ともだち》の顔《かお》をモデルにして、20分《ふん》かけて画用紙《がようし》に絵《え》を<drew>した。", "choices_ruby": ["描《えが》いた", "塗《ぬ》った", "消《け》した", "撮《と》った"], "explanation_ruby": "draw の過去形《かこけい》。draw-drew-drawn の不規則《ふきそく》変化《へんか》。", "body_kana": "びじゅつのじかんに、かれはえんぴつでとなりのせきのともだちのかおをモデルにして、20分かけてがようしにえを<drew>した。"}, {"word": "drink", "meaning_jp": "飲む", "pos": "動", "body": "運動した後はのどが渇くので、冷たい水をコップ2杯一気に<drink>した。", "choices": ["飲む", "食べる", "噛む", "捨てる"], "correct_index": 0, "explanation": "eat(食べる)の対(液体)。drink-drank-drunk。", "id": "s1_088", "body_ruby": "運動《うんどう》した後《あと》はのどが渇《かわ》くので、冷《つめ》たい水《みず》をコップ2杯《はい》一気《いっき》に<drink>した。", "choices_ruby": ["飲《の》む", "食《た》べる", "噛《か》む", "捨《す》てる"], "explanation_ruby": "eat(食《た》べる)の対《つい》(液体《えきたい》)。drink-drank-drunk。", "body_kana": "うんどうしたあとはのどがかわくので、つめたいみずをコップ2杯いっきに<drink>した。"}, {"word": "drive", "meaning_jp": "運転する", "pos": "動", "body": "父は通勤のため、毎朝青いセダンの車を高速道路で1時間<drive>して会社まで行く。", "choices": ["運転する", "歩く", "座る", "乗る"], "correct_index": 0, "explanation": "drive-drove-driven。driver = 運転手。", "id": "s1_089", "body_ruby": "父《ちち》は通勤《つうきん》のため、毎朝《まいあさ》青《あお》いセダンの車《くるま》を高速道路《こうそくどうろ》で1時間《じかん》<drive>して会社《かいしゃ》まで行《い》く。", "choices_ruby": ["運転《うんてん》する", "歩《ある》く", "座《すわ》る", "乗《の》る"], "explanation_ruby": "drive-drove-driven。driver = 運転手《うんてんしゅ》。", "body_kana": "ちちはつうきんのため、まいあさあおいセダンのくるまをこうそくどうろで1時間<drive>してかいしゃまでいく。"}, {"word": "drum", "meaning_jp": "ドラム", "pos": "名", "body": "兄は軽音楽部に入って、両手にスティックを持って大きな<drum>をたたく練習をしている。打楽器の一種だ。", "choices": ["ドラム", "ピアノ", "ギター", "笛"], "correct_index": 0, "explanation": "打楽器。drummer = ドラム奏者。", "id": "s1_090", "body_ruby": "兄《あに》は軽音楽部《けいおんがくぶ》に入《はい》って、両手《りょうて》にスティックを持《も》って大《おお》きな<drum>をたたく練習《れんしゅう》をしている。打楽器《だがっき》の一種《いっしゅ》だ。", "choices_ruby": ["ドラム", "ピアノ", "ギター", "笛《ふえ》"], "explanation_ruby": "打楽器《だがっき》。drummer = ドラム奏者《そうしゃ》。", "body_kana": "あにはけいおんがくぶにはいって、りょうてにスティックをもっておおきな<drum>をたたくれんしゅうをしている。だがっきのいっしゅだ。"}, {"word": "ear", "meaning_jp": "耳", "pos": "名", "body": "音楽を聴くためにヘッドフォンを両方の<ear>に当てていたら、母に何度も呼ばれていたことに気づかなかった。", "choices": ["耳", "目", "口", "鼻"], "correct_index": 0, "explanation": "両耳=両側にあるので複数形 ears をよく使う。", "id": "s1_091", "body_ruby": "音楽《おんがく》を聴《き》くためにヘッドフォンを両方《りょうほう》の<ear>に当《あ》てていたら、母《はは》に何度《なんど》も呼《よ》ばれていたことに気《き》づかなかった。", "choices_ruby": ["耳《みみ》", "目《め》", "口《くち》", "鼻《はな》"], "explanation_ruby": "両耳《りょうみみ》=両側《りょうがわ》にあるので複数形《ふくすうけい》 ears をよく使《つか》う。", "body_kana": "おんがくをきくためにヘッドフォンをりょうほうの<ear>にあてていたら、ははになんどもよばれていたことにきづかなかった。"}, {"word": "eat", "meaning_jp": "食べる", "pos": "動", "body": "お腹がペコペコだったので、目の前にあったハンバーガーとフライドポテトを15分で全部<eat>した。", "choices": ["食べる", "飲む", "見る", "触る"], "correct_index": 0, "explanation": "eat-ate-eaten の不規則変化。drink(飲む)とセット。", "id": "s1_092", "body_ruby": "お腹《なか》がペコペコだったので、｜目の前《めのまえ》にあったハンバーガーとフライドポテトを15分《ふん》で全部《ぜんぶ》<eat>した。", "choices_ruby": ["食《た》べる", "飲《の》む", "見《み》る", "触《さわ》る"], "explanation_ruby": "eat-ate-eaten の不規則《ふきそく》変化《へんか》。drink(飲《の》む)とセット。", "body_kana": "おなかがペコペコだったので、めのまえにあったハンバーガーとフライドポテトを15分でぜんぶ<eat>した。"}, {"word": "egg", "meaning_jp": "卵", "pos": "名", "body": "朝食には鶏が産んだ白い<egg>をフライパンで焼いた目玉焼きを食べる。殻の中に黄身と白身が入っている。", "choices": ["卵", "牛乳", "パン", "野菜"], "correct_index": 0, "explanation": "boiled egg(ゆで卵)、fried egg(目玉焼き)。", "id": "s1_093", "body_ruby": "朝食《ちょうしょく》には鶏《にわとり》が産《う》んだ白《しろ》い<egg>をフライパンで焼《や》いた目玉焼《めだまやき》きを食《た》べる。殻《から》の中《なか》に黄身《きみ》と白身《しろみ》が入《はい》っている。", "choices_ruby": ["卵《たまご》", "牛乳《ぎゅうにゅう》", "パン", "野菜《やさい》"], "explanation_ruby": "boiled egg(ゆで卵《たまご》)、fried egg(目玉焼《めだまやき》き)。", "body_kana": "ちょうしょくにはにわとりがうんだしろい<egg>をフライパンでやいためだまやききをたべる。からのなかにきみとしろみがはいっている。"}, {"word": "eight", "meaning_jp": "8(8つ)", "pos": "名/形", "body": "私のクラスのソフトボールチームには、ピッチャーとキャッチャーを除いて、外野と内野に<eight>人いる。両手の指の数から指を2本下ろすと同じになる。", "choices": ["8", "6", "10", "12"], "correct_index": 0, "explanation": "数字の8。seven(7)と nine(9)の間。", "id": "s1_094", "body_ruby": "私《わたし》のクラスのソフトボールチームには、ピッチャーとキャッチャーを除《のぞ》いて、外野《がいや》と内野《ないや》に<eight>人《にん》いる。両手《りょうて》の指《ゆび》の数《かず》から指《ゆび》を2本《ほん》下《お》ろすと同《おな》じになる。", "choices_ruby": ["8", "6", "10", "12"], "explanation_ruby": "数字《すうじ》の8。seven(7)と nine(9)の間《あいだ》。", "body_kana": "わたしのクラスのソフトボールチームには、ピッチャーとキャッチャーをのぞいて、がいやとないやに<eight>にんいる。りょうてのゆびのかずからゆびを2本おろすとおなじになる。"}, {"word": "eighteen", "meaning_jp": "18", "pos": "名/形", "body": "<eighteen>歳になると、日本では選挙で投票できるようになる。中学を卒業してから6年経った頃の年齢だ。", "choices": ["18", "8", "80", "28"], "correct_index": 0, "explanation": "eight(8)+ teen(10代の接尾辞)。13-19 に -teen が付く。", "id": "s1_095", "body_ruby": "<eighteen>歳《さい》になると、日本《にっぽん》では選挙《せんきょ》で投票《とうひょう》できるようになる。中学《ちゅうがく》を卒業《そつぎょう》してから6年《ねん》経《た》った頃《ごろ》の年齢《ねんれい》だ。", "choices_ruby": ["18", "8", "80", "28"], "explanation_ruby": "eight(8)+ teen(10代《だい》の接尾辞《せつびじ》)。13-19 に -teen が付《つ》く。", "body_kana": "<eighteen>さいになると、にっぽんではせんきょでとうひょうできるようになる。ちゅうがくをそつぎょうしてから6年たったごろのねんれいだ。"}, {"word": "eighth", "meaning_jp": "8番目", "pos": "名/形", "body": "クラスの徒競走で、彼は10人中<eighth>でゴールした。彼より速かったのは7人だけで、後ろにはあと2人いた。", "choices": ["8番目", "1番目", "10番目", "5番目"], "correct_index": 0, "explanation": "eight(8)+ -th(序数化)。my eighth birthday = 8歳の誕生日。", "id": "s1_096", "body_ruby": "クラスの徒《と》競走《きょうそう》で、彼《かれ》は10人《にん》中《なか》<eighth>でゴールした。彼《かれ》より速《はや》かったのは7人《にん》だけで、後《うし》ろにはあと2人《にん》いた。", "choices_ruby": ["8番目《ばんめ》", "1番目《ばんめ》", "10番目《ばんめ》", "5番目《ばんめ》"], "explanation_ruby": "eight(8)+ -th(序数《じょすう》化《か》)。my eighth birthday = 8歳《さい》の誕生日《たんじょうび》。", "body_kana": "クラスのときょうそうで、かれは10人なか<eighth>でゴールした。かれよりはやかったのは7人だけで、うしろにはあと2人いた。"}, {"word": "eighty", "meaning_jp": "80", "pos": "名/形", "body": "私のおばあちゃんは今年で<eighty>歳になるが、毎朝散歩を欠かさず元気だ。70歳の祖父より10歳年上で、私の年齢より遥かに長く生きてきた。", "choices": ["80", "18", "8", "100"], "correct_index": 0, "explanation": "eight(8)+ -y(十の位)。twenty(20)、thirty(30)... の仲間。", "id": "s1_097", "body_ruby": "私《わたし》のおばあちゃんは今年《ことし》で<eighty>歳《さい》になるが、毎朝《まいあさ》散歩《さんぽ》を欠《か》かさず元気《げんき》だ。70歳《さい》の祖父《そふ》より10歳《さい》年上《としうえ》で、私《わたし》の年齢《ねんれい》より遥《はる》かに長《なが》く生《い》きてきた。", "choices_ruby": ["80", "18", "8", "100"], "explanation_ruby": "eight(8)+ -y(十《じゅう》の位《くらい》)。twenty(20)、thirty(30)... の仲間《なかま》。", "body_kana": "わたしのおばあちゃんはことしで<eighty>さいになるが、まいあささんぽをかかさずげんきだ。70歳のそふより10歳としうえで、わたしのねんれいよりはるかにながくいきてきた。"}, {"word": "eleven", "meaning_jp": "11", "pos": "名/形", "body": "サッカーは1チーム<eleven>人で行うスポーツ。ピッチには両チーム合わせて22人の選手が同時に走っている。", "choices": ["11", "12", "10", "9"], "correct_index": 0, "explanation": "数字の11。サッカーの「イレブン」の語源。", "id": "s1_098", "body_ruby": "サッカーは1チーム<eleven>人《にん》で行《おこな》うスポーツ。ピッチには両《りょう》チーム合《あ》わせて22人《にん》の選手《せんしゅ》が同時《どうじ》に走《はし》っている。", "choices_ruby": ["11", "12", "10", "9"], "explanation_ruby": "数字《すうじ》の11。サッカーの「イレブン」の語源《ごげん》。", "body_kana": "サッカーは1チーム<eleven>にんでおこなうスポーツ。ピッチにはりょうチームあわせて22人のせんしゅがどうじにはしっている。"}, {"word": "eleventh", "meaning_jp": "11番目", "pos": "名/形", "body": "今日はクラスの誕生会で、11月生まれの彼の<eleventh>の誕生日を祝った。10歳の去年から1年経って、ロウソクが1本増えた。", "choices": ["11番目", "10番目", "12番目", "1番目"], "correct_index": 0, "explanation": "eleven(11)+ -th(序数)。", "id": "s1_099", "body_ruby": "今日《きょう》はクラスの誕生会《たんじょうかい》で、11月《がつ》生《う》まれの彼《かれ》の<eleventh>の誕生日《たんじょうび》を祝《いわ》った。10歳《さい》の去年《きょねん》から1年《ねん》経《た》って、ロウソクが1本《ほん》増《ふ》えた。", "choices_ruby": ["11番目《ばんめ》", "10番目《ばんめ》", "12番目《ばんめ》", "1番目《ばんめ》"], "explanation_ruby": "eleven(11)+ -th(序数《じょすう》)。", "body_kana": "きょうはクラスのたんじょうかいで、11月うまれのかれの<eleventh>のたんじょうびをいわった。10歳のきょねんから1年たって、ロウソクが1本ふえた。"}, {"word": "English", "meaning_jp": "英語、イギリスの", "pos": "名/形", "body": "私は世界共通語と呼ばれる<English>を週4時間勉強している。アメリカやイギリス、オーストラリアで話されている言語だ。", "choices": ["英語", "中国語", "フランス語", "ドイツ語"], "correct_index": 0, "explanation": "England(イングランド)が語源。", "id": "s1_100", "body_ruby": "私《わたし》は世界共通《せかいきょうつう》語《ご》と呼《よ》ばれる<English>を週《しゅう》4時間《じかん》勉強《べんきょう》している。アメリカやイギリス、オーストラリアで話《はな》されている言語《げんご》だ。", "choices_ruby": ["英語《えいご》", "中国語《ちゅうごくご》", "フランス語《ご》", "ドイツ語《ご》"], "explanation_ruby": "England(イングランド)が語源《ごげん》。", "body_kana": "わたしはせかいきょうつうごとよばれる<English>をしゅう4時間べんきょうしている。アメリカやイギリス、オーストラリアではなされているげんごだ。"}, {"word": "enjoy", "meaning_jp": "楽しむ", "pos": "動", "body": "夏祭りに浴衣を着て出かけ、屋台のたこ焼きを食べながら、家族と花火を1時間<enjoy>した。", "choices": ["楽しむ", "悲しむ", "我慢する", "急ぐ"], "correct_index": 0, "explanation": "Enjoy yourself! = 楽しんで!", "id": "s1_101", "body_ruby": "夏祭《なつまつ》りに浴衣《ゆかた》を着《き》て出《で》かけ、屋台《やたい》のたこ焼《や》きを食《た》べながら、家族《かぞく》と花火《はなび》を1時間《じかん》<enjoy>した。", "choices_ruby": ["楽《たの》しむ", "悲《かな》しむ", "我慢《がまん》する", "急《いそ》ぐ"], "explanation_ruby": "Enjoy yourself! = 楽《たの》しんで!", "body_kana": "なつまつりにゆかたをきてでかけ、やたいのたこやきをたべながら、かぞくとはなびを1時間<enjoy>した。"}, {"word": "eraser", "meaning_jp": "消しゴム", "pos": "名", "body": "計算問題を間違えたので、机の上の白い<eraser>で答えをきれいに消して、書き直した。鉛筆の字を消すための文房具だ。", "choices": ["消しゴム", "鉛筆", "定規", "のり"], "correct_index": 0, "explanation": "erase(消す)+ -er(道具)。イギリス英語では rubber。", "id": "s1_102", "body_ruby": "計算問題《けいさんもんだい》を間違《まちが》えたので、机《つくえ》の上《うえ》の白《しろ》い<eraser>で答《こた》えをきれいに消《け》して、｜書き直《かきなお》した。鉛筆《えんぴつ》の字《じ》を消《け》すための文房具《ぶんぼうぐ》だ。", "choices_ruby": ["消《け》しゴム", "鉛筆《えんぴつ》", "定規《じょうぎ》", "のり"], "explanation_ruby": "erase(消《け》す)+ -er(道具《どうぐ》)。イギリス英語《えいご》では rubber。", "body_kana": "けいさんもんだいをまちがえたので、つくえのうえのしろい<eraser>でこたえをきれいにけして、かきなおした。えんぴつのじをけすためのぶんぼうぐだ。"}, {"word": "evening", "meaning_jp": "夕方", "pos": "名", "body": "学校が終わって部活を終えた午後6時頃、空がオレンジ色に染まる<evening>に家に帰った。1日のうちで夕日が沈む時間帯だ。", "choices": ["夕方", "朝", "昼", "深夜"], "correct_index": 0, "explanation": "Good evening! = こんばんは。afternoon と night の間。", "id": "s1_103", "body_ruby": "学校《がっこう》が終《お》わって部活《ぶかつ》を終《お》えた午後《ごご》6時《じ》頃《ごろ》、空《そら》がオレンジ色《いろ》に染《そ》まる<evening>に家《いえ》に帰《かえ》った。1日《にち》のうちで夕日《ゆうひ》が沈《しず》む時間帯《じかんたい》だ。", "choices_ruby": ["夕方《ゆうがた》", "朝《あさ》", "昼《ひる》", "深夜《しんや》"], "explanation_ruby": "Good evening! = こんばんは。afternoon と night の間《あいだ》。", "body_kana": "がっこうがおわってぶかつをおえたごご6時ごろ、そらがオレンジいろにそまる<evening>にいえにかえった。1日のうちでゆうひがしずむじかんたいだ。"}, {"word": "excuse", "meaning_jp": "言い訳", "pos": "名", "body": "宿題を忘れた彼は、犬が食べたとか家に置いてきたとか、いろいろな<excuse>を先生に並べたが、信じてもらえなかった。", "choices": ["言い訳", "理由", "質問", "答え"], "correct_index": 0, "explanation": "Excuse me. = すみません(呼びかけ)。", "id": "s1_104", "body_ruby": "宿題《しゅくだい》を忘《わす》れた彼《かれ》は、犬《いぬ》が食《た》べたとか家《いえ》に置《お》いてきたとか、いろいろな<excuse>を先生《せんせい》に並《なら》べたが、信《しん》じてもらえなかった。", "choices_ruby": ["｜言い訳《いいわけ》", "理由《りゆう》", "質問《しつもん》", "答《こた》え"], "explanation_ruby": "Excuse me. = すみません(呼《よ》びかけ)。", "body_kana": "しゅくだいをわすれたかれは、いぬがたべたとかいえにおいてきたとか、いろいろな<excuse>をせんせいにならべたが、しんじてもらえなかった。"}, {"word": "eye", "meaning_jp": "目", "pos": "名", "body": "暗い部屋から急に明るい外に出ると、まぶしくて<eye>を細めてしまい、しばらく前が見えなかった。", "choices": ["目", "鼻", "口", "耳"], "correct_index": 0, "explanation": "顔の両側にあるので複数形 eyes をよく使う。", "id": "s1_105", "body_ruby": "暗《くら》い部屋《へや》から急《きゅう》に明《あか》るい外《そと》に出《で》ると、まぶしくて<eye>を細《ほそ》めてしまい、しばらく前《まえ》が見《み》えなかった。", "choices_ruby": ["目《め》", "鼻《はな》", "口《くち》", "耳《みみ》"], "explanation_ruby": "顔《かお》の両側《りょうがわ》にあるので複数形《ふくすうけい》 eyes をよく使《つか》う。", "body_kana": "くらいへやからきゅうにあかるいそとにでると、まぶしくて<eye>をほそめてしまい、しばらくまえがみえなかった。"}, {"word": "face", "meaning_jp": "顔", "pos": "名", "body": "朝起きてすぐ、洗面台で冷たい水を使って<face>を洗ったら、目が一気に覚めて眠気が吹き飛んだ。", "choices": ["顔", "頭", "首", "肩"], "correct_index": 0, "explanation": "「直面する」の動詞用法もある(face a problem)。", "id": "s1_106", "body_ruby": "朝起《あさお》きてすぐ、洗面台《せんめんだい》で冷《つめ》たい水《みず》を使《つか》って<face>を洗《あら》ったら、目《め》が一気《いっき》に覚《さ》めて眠気《ねむけ》が吹《ふ》き飛《と》んだ。", "choices_ruby": ["顔《かお》", "頭《あたま》", "首《くび》", "肩《かた》"], "explanation_ruby": "「直面《ちょくめん》する」の動詞《どうし》用法《ようほう》もある(face a problem)。", "body_kana": "あさおきてすぐ、せんめんだいでつめたいみずをつかって<face>をあらったら、めがいっきにさめてねむけがふきとんだ。"}, {"word": "family", "meaning_jp": "家族", "pos": "名", "body": "私の<family>は両親、3歳下の弟、犬1匹の合わせて4人と1匹で、毎週日曜は全員でリビングに集まって夕食を食べる。", "choices": ["家族", "友達", "クラス", "近所"], "correct_index": 0, "explanation": "family name = 姓、family tree = 家系図。", "id": "s1_107", "body_ruby": "私《わたし》の<family>は両親《りょうしん》、3歳《さい》下《した》の弟《おとうと》、犬《いぬ》1匹《ひき》の合《あ》わせて4人《にん》と1匹《ひき》で、毎週《まいしゅう》日曜《にちよう》は全員《ぜんいん》でリビングに集《あつ》まって夕食《ゆうしょく》を食《た》べる。", "choices_ruby": ["家族《かぞく》", "友達《ともだち》", "クラス", "近所《きんじょ》"], "explanation_ruby": "family name = 姓《せい》、family tree = 家系図《かけいず》。", "body_kana": "わたしの<family>はりょうしん、3歳したのおとうと、いぬ1匹のあわせて4人と1匹で、まいしゅうにちようはぜんいんでリビングにあつまってゆうしょくをたべる。"}, {"word": "fast", "meaning_jp": "速い、速く", "pos": "形/副", "body": "彼は100メートルを11秒で走り抜ける、クラスで一番<fast>な選手だ。2番目の人でも13秒かかるほど差をつけている。", "choices": ["速い", "遅い", "重い", "強い"], "correct_index": 0, "explanation": "slow(遅い)の対。動詞では「断食する」の意味もある。", "id": "s1_108", "body_ruby": "彼《かれ》は100メートルを11秒《びょう》で走《はし》り抜《ぬ》ける、クラスで一番《いちばん》<fast>な選手《せんしゅ》だ。2番目《ばんめ》の人《ひと》でも13秒《びょう》かかるほど差《さ》をつけている。", "choices_ruby": ["速《はや》い", "遅《おそ》い", "重《おも》い", "強《つよ》い"], "explanation_ruby": "slow(遅《おそ》い)の対《つい》。動詞《どうし》では「断食《だんじき》する」の意味《いみ》もある。", "body_kana": "かれは100メートルを11秒ではしりぬける、クラスでいちばん<fast>なせんしゅだ。2番目のひとでも13秒かかるほどさをつけている。"}, {"word": "father", "meaning_jp": "父", "pos": "名", "body": "私の<father>は毎朝5時に起きて、家族のために朝ごはんを作ってくれる優しい人だ。母と一緒に私を育ててくれた人だ。", "choices": ["父", "兄", "おじ", "祖父"], "correct_index": 0, "explanation": "mother(母)の対。dad は子供がよく使う呼び方。", "id": "s1_109", "body_ruby": "私《わたし》の<father>は毎朝《まいあさ》5時《じ》に起《お》きて、家族《かぞく》のために朝《あさ》ごはんを作《つく》ってくれる優《やさ》しい人《ひと》だ。母《はは》と一緒《いっしょ》に私《わたし》を育《そだ》ててくれた人《ひと》だ。", "choices_ruby": ["父《ちち》", "兄《あに》", "おじ", "祖父《そふ》"], "explanation_ruby": "mother(母《はは》)の対《つい》。dad は子供《こども》がよく使《つか》う｜呼び方《よびかた》。", "body_kana": "わたしの<father>はまいあさ5時におきて、かぞくのためにあさごはんをつくってくれるやさしいひとだ。ははといっしょにわたしをそだててくれたひとだ。"}, {"word": "favorite", "meaning_jp": "お気に入りの", "pos": "形", "body": "私の<favorite>な食べ物は寿司で、特にマグロが大好きだ。", "choices": ["お気に入りの", "嫌いな", "普通の", "苦手な"], "correct_index": 0, "explanation": "favor(好む)+ -ite。my favorite = 私のお気に入り。", "id": "s1_110", "body_ruby": "私《わたし》の<favorite>な｜食べ物《たべもの》は寿司《すし》で、特《とく》にマグロが大好《だいす》きだ。", "choices_ruby": ["お気《き》に入《い》りの", "嫌《きら》いな", "普通《ふつう》の", "苦手《にがて》な"], "explanation_ruby": "favor(好《この》む)+ -ite。my favorite = 私《わたし》のお気《き》に入《い》り。", "body_kana": "わたしの<favorite>なたべものはすしで、とくにマグロがだいすきだ。"}, {"word": "February", "meaning_jp": "2月", "pos": "名", "body": "1年で一番寒くて日数が28日と短い月、それが<February>。バレンタインデーや節分があり、コートが手放せない時期だ。", "choices": ["2月", "1月", "3月", "12月"], "correct_index": 0, "explanation": "ローマ神話の浄化の神 Februa が由来。", "id": "s1_111", "body_ruby": "1年《ねん》で一番《いちばん》寒《さむ》くて日数《にっすう》が28日《にち》と短《みじか》い月《がつ》、それが<February>。バレンタインデーや節分《せつぶん》があり、コートが手放《てばな》せない時期《じき》だ。", "choices_ruby": ["2月《がつ》", "1月《がつ》", "3月《がつ》", "12月《がつ》"], "explanation_ruby": "ローマ神話《しんわ》の浄化《じょうか》の神《かみ》 Februa が由来《ゆらい》。", "body_kana": "1年でいちばんさむくてにっすうが28日とみじかいがつ、それが<February>。バレンタインデーやせつぶんがあり、コートがてばなせないじきだ。"}, {"word": "feed", "meaning_jp": "餌をやる", "pos": "動", "body": "毎朝起きると、家で飼っている金魚に2粒ずつ、犬には1袋の餌を<feed>することが私の役目だ。", "choices": ["餌をやる", "食べる", "捨てる", "洗う"], "correct_index": 0, "explanation": "food の動詞形。feed-fed-fed の不規則変化。", "id": "s1_112", "body_ruby": "毎朝《まいあさ》起《お》きると、家《いえ》で飼《か》っている金魚《きんぎょ》に2粒《つぶ》ずつ、犬《いぬ》には1袋《ふくろ》の餌《えさ》を<feed>することが私《わたし》の役目《やくめ》だ。", "choices_ruby": ["餌《えさ》をやる", "食《た》べる", "捨《す》てる", "洗《あら》う"], "explanation_ruby": "food の動詞形《どうしけい》。feed-fed-fed の不規則《ふきそく》変化《へんか》。", "body_kana": "まいあさおきると、いえでかっているきんぎょに2つぶずつ、いぬには1ふくろのえさを<feed>することがわたしのやくめだ。"}, {"word": "feet", "meaning_jp": "足(複数)", "pos": "名", "body": "長い時間歩いた後、両方の<feet>がじんじん痛くなったので、家に帰って靴を脱いでマッサージした。", "choices": ["足", "手", "腕", "脚"], "correct_index": 0, "explanation": "foot の複数形。foot-feet の不規則変化。", "id": "s1_113", "body_ruby": "長《なが》い時間《じかん》歩《ある》いた後《あと》、両方《りょうほう》の<feet>がじんじん痛《いた》くなったので、家《いえ》に帰《かえ》って靴《くつ》を脱《ぬ》いでマッサージした。", "choices_ruby": ["足《あし》", "手《て》", "腕《うで》", "脚《あし》"], "explanation_ruby": "foot の複数形《ふくすうけい》。foot-feet の不規則《ふきそく》変化《へんか》。", "body_kana": "ながいじかんあるいたあと、りょうほうの<feet>がじんじんいたくなったので、いえにかえってくつをぬいでマッサージした。"}, {"word": "fell", "meaning_jp": "落ちた", "pos": "動", "body": "強い風が吹いた時、屋根の上に置いてあった植木鉢が突然下に<fell>した。庭の石にぶつかって割れ、土が散らばった。", "choices": ["落ちた", "登った", "飛んだ", "止まった"], "correct_index": 0, "explanation": "fall(落ちる)の過去形。fall-fell-fallen。", "id": "s1_114", "body_ruby": "強《つよ》い風《かぜ》が吹《ふ》いた時《とき》、屋根《やね》の上《うえ》に置《お》いてあった植木鉢《うえきばち》が突然《とつぜん》下《した》に<fell>した。庭《にわ》の石《いし》にぶつかって割《わ》れ、土《つち》が散《ち》らばった。", "choices_ruby": ["落《お》ちた", "登《のぼ》った", "飛《と》んだ", "止《と》まった"], "explanation_ruby": "fall(落《お》ちる)の過去形《かこけい》。fall-fell-fallen。", "body_kana": "つよいかぜがふいたとき、やねのうえにおいてあったうえきばちがとつぜんしたに<fell>した。にわのいしにぶつかってわれ、つちがちらばった。"}, {"word": "festival", "meaning_jp": "祭り", "pos": "名", "body": "夏の夜、神社の境内では浴衣を着た人々が屋台に集まり、太鼓と花火で盛り上がる<festival>が行われていた。", "choices": ["祭り", "試験", "会議", "葬式"], "correct_index": 0, "explanation": "summer festival(夏祭り)、music festival(音楽祭)。", "id": "s1_115", "body_ruby": "夏《なつ》の夜《よる》、神社《じんじゃ》の境内《けいだい》では浴衣《ゆかた》を着《き》た人々《ひとびと》が屋台《やたい》に集《あつ》まり、太鼓《たいこ》と花火《はなび》で｜盛り上《もりあ》がる<festival>が行《おこな》われていた。", "choices_ruby": ["祭《まつ》り", "試験《しけん》", "会議《かいぎ》", "葬式《そうしき》"], "explanation_ruby": "summer festival(夏祭《なつまつ》り)、music festival(音楽祭《おんがくさい》)。", "body_kana": "なつのよる、じんじゃのけいだいではゆかたをきたひとびとがやたいにあつまり、たいことはなびでもりあがる<festival>がおこなわれていた。"}, {"word": "field", "meaning_jp": "野原、競技場", "pos": "名", "body": "学校の裏に広がる緑の<field>では、放課後にサッカー部が走り回り、野球部がキャッチボールをしている。", "choices": ["野原", "森", "山", "川"], "correct_index": 0, "explanation": "「分野・専門領域」の意味もある(field of study)。", "id": "s1_116", "body_ruby": "学校《がっこう》の裏《うら》に広《ひろ》がる緑《みどり》の<field>では、放課後《ほうかご》にサッカー部《ぶ》が走《はし》り回《まわ》り、野球部《やきゅうぶ》がキャッチボールをしている。", "choices_ruby": ["野原《のはら》", "森《もり》", "山《やま》", "川《かわ》"], "explanation_ruby": "「分野《ぶんや》・専門領域《せんもんりょういき》」の意味《いみ》もある(field of study)。", "body_kana": "がっこうのうらにひろがるみどりの<field>では、ほうかごにサッカーぶがはしりまわり、やきゅうぶがキャッチボールをしている。"}, {"word": "fifteen", "meaning_jp": "15", "pos": "名/形", "body": "今日のテストは1問1点で、合計<fifteen>問もあった。両手の指10本を使い切って、さらに5本使ってやっと数えられる多さだ。", "choices": ["15", "50", "5", "16"], "correct_index": 0, "explanation": "five(5)+ teen(10代の接尾辞)。", "id": "s1_117", "body_ruby": "今日《きょう》のテストは1問《もん》1点《てん》で、合計《ごうけい》<fifteen>問《もん》もあった。両手《りょうて》の指《ゆび》10本《ほん》を使《つか》い切《き》って、さらに5本《ほん》使《つか》ってやっと数《かぞ》えられる多《おお》さだ。", "choices_ruby": ["15", "50", "5", "16"], "explanation_ruby": "five(5)+ teen(10代《だい》の接尾辞《せつびじ》)。", "body_kana": "きょうのテストは1問1点で、ごうけい<fifteen>もんもあった。りょうてのゆび10本をつかいきって、さらに5本つかってやっとかぞえられるおおさだ。"}, {"word": "fifty", "meaning_jp": "50", "pos": "名/形", "body": "母の財布をのぞいたら、<fifty>円玉が3枚入っていた。1枚で100円玉の半分の価値があり、自販機ではジュースが買えない硬貨だ。", "choices": ["50", "5", "15", "500"], "correct_index": 0, "explanation": "five(5)+ -ty(10の倍数)。", "id": "s1_118", "body_ruby": "母《はは》の財布《さいふ》をのぞいたら、<fifty>円玉《えんだま》が3枚《まい》入《はい》っていた。1枚《まい》で100円《えん》玉《たま》の半分《はんぶん》の価値《かち》があり、自販機《じはんき》ではジュースが買《か》えない硬貨《こうか》だ。", "choices_ruby": ["50", "5", "15", "500"], "explanation_ruby": "five(5)+ -ty(10の倍数《ばいすう》)。", "body_kana": "ははのさいふをのぞいたら、<fifty>えんだまが3枚はいっていた。1枚で100円たまのはんぶんのかちがあり、じはんきではジュースがかえないこうかだ。"}, {"word": "fine", "meaning_jp": "元気な、晴れた", "pos": "形", "body": "風邪を引いていた友達に「調子はどう?」と聞いたら、「もうすっかり治って<fine>だよ」と笑顔で答えてくれた。", "choices": ["元気な", "病気の", "悲しい", "怒った"], "correct_index": 0, "explanation": "I'm fine. = 元気です。「罰金」「細かい」の意味もある。", "id": "s1_119", "body_ruby": "風邪《かぜ》を引《ひ》いていた友達《ともだち》に「調子《ちょうし》はどう?」と聞《き》いたら、「もうすっかり治《なお》って<fine>だよ」と笑顔《えがお》で答《こた》えてくれた。", "choices_ruby": ["元気《げんき》な", "病気《びょうき》の", "悲《かな》しい", "怒《いか》った"], "explanation_ruby": "I'm fine. = 元気《げんき》です。「罰金《ばっきん》」「細《こま》かい」の意味《いみ》もある。", "body_kana": "かぜをひいていたともだちに「ちょうしはどう?」ときいたら、「もうすっかりなおって<fine>だよ」とえがおでこたえてくれた。"}, {"word": "fire", "meaning_jp": "火", "pos": "名", "body": "キャンプで木の枝を集めて、マッチで赤い<fire>を起こし、その上で肉を焼いた。熱と光を出して燃えるものだ。", "choices": ["火", "水", "氷", "風"], "correct_index": 0, "explanation": "fire engine(消防車)、fire alarm(火災警報)。", "id": "s1_120", "body_ruby": "キャンプで木《き》の枝《えだ》を集《あつ》めて、マッチで赤《あか》い<fire>を起《お》こし、その上《うえ》で肉《にく》を焼《や》いた。熱《ねつ》と光《ひかり》を出《だ》して燃《も》えるものだ。", "choices_ruby": ["火《ひ》", "水《みず》", "氷《こおり》", "風《かぜ》"], "explanation_ruby": "fire engine(消防車《しょうぼうしゃ》)、fire alarm(火災《かさい》警報《けいほう》)。", "body_kana": "キャンプできのえだをあつめて、マッチであかい<fire>をおこし、そのうえでにくをやいた。ねつとひかりをだしてもえるものだ。"}, {"word": "first", "meaning_jp": "1番目、最初の", "pos": "形/副", "body": "彼は今日のテストで100点を取って、クラス40人の中で<first>を取った。後ろにはまだ39人もいたので、本人もとても喜んでいた。", "choices": ["1番目", "最後の", "5番目", "10番目"], "correct_index": 0, "explanation": "one(1)の序数。second(2番目)が次。", "id": "s1_121", "body_ruby": "彼《かれ》は今日《きょう》のテストで100点《てん》を取《と》って、クラス40人《にん》の中《なか》で<first>を取《と》った。後《うし》ろにはまだ39人《にん》もいたので、本人《ほんにん》もとても喜《よろこ》んでいた。", "choices_ruby": ["1番目《ばんめ》", "最後《さいご》の", "5番目《ばんめ》", "10番目《ばんめ》"], "explanation_ruby": "one(1)の序数《じょすう》。second(2番目《ばんめ》)が次《つぎ》。", "body_kana": "かれはきょうのテストで100点をとって、クラス40人のなかで<first>をとった。うしろにはまだ39人もいたので、ほんにんもとてもよろこんでいた。"}, {"word": "five", "meaning_jp": "5", "pos": "名/形", "body": "私の家族は両親と兄と妹と私の<five>人で、毎週日曜の夕食をテーブルを囲んで一緒に食べる。", "choices": ["5", "4", "6", "10"], "correct_index": 0, "explanation": "数字の5。four(4)と six(6)の間。", "id": "s1_122", "body_ruby": "私《わたし》の家族《かぞく》は両親《りょうしん》と兄《あに》と妹《いもうと》と私《わたし》の<five>人《にん》で、毎週《まいしゅう》日曜《にちよう》の夕食《ゆうしょく》をテーブルを囲《かこ》んで一緒《いっしょ》に食《た》べる。", "choices_ruby": ["5", "4", "6", "10"], "explanation_ruby": "数字《すうじ》の5。four(4)と six(6)の間《あいだ》。", "body_kana": "わたしのかぞくはりょうしんとあにといもうととわたしの<five>にんで、まいしゅうにちようのゆうしょくをテーブルをかこんでいっしょにたべる。"}, {"word": "flower", "meaning_jp": "花", "pos": "名", "body": "母の日に、感謝の気持ちを込めて、母が好きな赤いカーネーションの<flower>を10本花屋で買って渡した。植物の咲く部分だ。", "choices": ["花", "葉", "根", "枝"], "correct_index": 0, "explanation": "blossom が果樹の花、flower はより一般的。", "id": "s1_123", "body_ruby": "｜母の日《ははのひ》に、感謝《かんしゃ》の気持《きも》ちを込《こ》めて、母《はは》が好《す》きな赤《あか》いカーネーションの<flower>を10本《ほん》花屋《はなや》で買《か》って渡《わた》した。植物《しょくぶつ》の咲《さ》く部分《ぶぶん》だ。", "choices_ruby": ["花《はな》", "葉《は》", "根《ね》", "枝《えだ》"], "explanation_ruby": "blossom が果樹《かじゅ》の花《はな》、flower はより一般的《いっぱんてき》。", "body_kana": "ははのひに、かんしゃのきもちをこめて、ははがすきなあかいカーネーションの<flower>を10本はなやでかってわたした。しょくぶつのさくぶぶんだ。"}, {"word": "fly", "meaning_jp": "飛ぶ", "pos": "動", "body": "秋になると、シベリアから日本に向かってツバメや鴨などの鳥たちが空を高く<fly>してくる。", "choices": ["飛ぶ", "走る", "泳ぐ", "歩く"], "correct_index": 0, "explanation": "fly-flew-flown。名詞では「ハエ」の意味もある(同音多義)。", "id": "s1_124", "body_ruby": "秋《あき》になると、シベリアから日本《にっぽん》に向《む》かってツバメや鴨《かも》などの鳥《とり》たちが空《そら》を高《たか》く<fly>してくる。", "choices_ruby": ["飛《と》ぶ", "走《はし》る", "泳《およ》ぐ", "歩《ある》く"], "explanation_ruby": "fly-flew-flown。名詞《めいし》では「ハエ」の意味《いみ》もある(同音《どうおん》多義《たぎ》)。", "body_kana": "あきになると、シベリアからにっぽんにむかってツバメやかもなどのとりたちがそらをたかく<fly>してくる。"}, {"word": "food", "meaning_jp": "食べ物", "pos": "名", "body": "災害に備えて、缶詰のツナ、レトルトのカレー、ビスケット、ペットボトルの水など、2週間分の<food>を玄関の棚に備蓄してある。", "choices": ["食べ物", "飲み物", "薬", "服"], "correct_index": 0, "explanation": "Japanese food(日本食)、fast food(ファストフード)。", "id": "s1_125", "body_ruby": "災害《さいがい》に備《そな》えて、缶詰《かんづめ》のツナ、レトルトのカレー、ビスケット、ペットボトルの水《みず》など、2週間《しゅうかん》分《ふん》の<food>を玄関《げんかん》の棚《たな》に備蓄《びちく》してある。", "choices_ruby": ["｜食べ物《たべもの》", "｜飲み物《のみもの》", "薬《くすり》", "服《ふく》"], "explanation_ruby": "Japanese food(日本食《にほんしょく》)、fast food(ファストフード)。", "body_kana": "さいがいにそなえて、かんづめのツナ、レトルトのカレー、ビスケット、ペットボトルのみずなど、2週間ふんの<food>をげんかんのたなにびちくしてある。"}, {"word": "football", "meaning_jp": "フットボール、サッカー", "pos": "名", "body": "イギリスでは、丸いボールを足で蹴ってゴールに入れる<football>が一番人気のスポーツだ。アメリカでは違う競技を指す。", "choices": ["サッカー", "野球", "卓球", "バレー"], "correct_index": 0, "explanation": "イギリスではサッカー、アメリカではアメフトを指す。", "id": "s1_126", "body_ruby": "イギリスでは、丸《まる》いボールを足《あし》で蹴《け》ってゴールに入《い》れる<football>が一番人気《いちばんにんき》のスポーツだ。アメリカでは違《ちが》う競技《きょうぎ》を指《さ》す。", "choices_ruby": ["サッカー", "野球《やきゅう》", "卓球《たっきゅう》", "バレー"], "explanation_ruby": "イギリスではサッカー、アメリカではアメフトを指《さ》す。", "body_kana": "イギリスでは、まるいボールをあしでけってゴールにいれる<football>がいちばんにんきのスポーツだ。アメリカではちがうきょうぎをさす。"}, {"word": "forty", "meaning_jp": "40", "pos": "名/形", "body": "祖父は今年で<forty>歳になる父より、ちょうど10歳年上の50歳。父はまだ髪は黒く、人生の真ん中あたりの年齢だ。", "choices": ["40", "14", "4", "44"], "correct_index": 0, "explanation": "four(4)+ -ty。綴りに注意(fourty ではなく forty)。", "id": "s1_127", "body_ruby": "祖父《そふ》は今年《ことし》で<forty>歳《さい》になる父《ちち》より、ちょうど10歳《さい》年上《としうえ》の50歳《さい》。父《ちち》はまだ髪《かみ》は黒《くろ》く、人生《じんせい》の｜真ん中《まんなか》あたりの年齢《ねんれい》だ。", "choices_ruby": ["40", "14", "4", "44"], "explanation_ruby": "four(4)+ -ty。綴《つづ》りに注意《ちゅうい》(fourty ではなく forty)。", "body_kana": "そふはことしで<forty>さいになるちちより、ちょうど10歳としうえの50歳。ちちはまだかみはくろく、じんせいのまんなかあたりのねんれいだ。"}, {"word": "four", "meaning_jp": "4", "pos": "名/形", "body": "公園のベンチに座って数えたら、目の前を通り過ぎていく車には、たいていタイヤが<four>本ついていた。", "choices": ["4", "5", "3", "6"], "correct_index": 0, "explanation": "数字の4。three(3)と five(5)の間。", "id": "s1_128", "body_ruby": "公園《こうえん》のベンチに座《すわ》って数《かぞ》えたら、｜目の前《めのまえ》を通《とお》り過《す》ぎていく車《くるま》には、たいていタイヤが<four>本《ほん》ついていた。", "choices_ruby": ["4", "5", "3", "6"], "explanation_ruby": "数字《すうじ》の4。three(3)と five(5)の間《あいだ》。", "body_kana": "こうえんのベンチにすわってかぞえたら、めのまえをとおりすぎていくくるまには、たいていタイヤが<four>ほんついていた。"}, {"word": "fourteen", "meaning_jp": "14", "pos": "名/形", "body": "中学2年生は4月生まれだと<fourteen>歳。中学1年生の頃より1つ年上で、3年生のお兄さんお姉さんより1つ年下だ。", "choices": ["14", "40", "4", "24"], "correct_index": 0, "explanation": "four(4)+ teen。", "id": "s1_129", "body_ruby": "中学《ちゅうがく》2年生《ねんせい》は4月《がつ》生《う》まれだと<fourteen>歳《さい》。中学《ちゅうがく》1年生《ねんせい》の頃《ごろ》より1つ年上《としうえ》で、3年生《ねんせい》のお兄《にい》さんお姉《ねえ》さんより1つ年下《としした》だ。", "choices_ruby": ["14", "40", "4", "24"], "explanation_ruby": "four(4)+ teen。", "body_kana": "ちゅうがく2年生は4月うまれだと<fourteen>さい。ちゅうがく1年生のごろより1つとしうえで、3年生のおにいさんおねえさんより1つとししただ。"}, {"word": "fourth", "meaning_jp": "4番目", "pos": "名/形", "body": "彼は学校のリレーで、1走から3走までを引き継ぐ<fourth>走者として走り、勢いそのままにゴールテープを切った。", "choices": ["4番目", "1番目", "2番目", "3番目"], "correct_index": 0, "explanation": "four(4)+ -th。July 4th = 7月4日(アメリカ独立記念日)。", "id": "s1_130", "body_ruby": "彼《かれ》は学校《がっこう》のリレーで、1走《そう》から3走《そう》までを｜引き継《ひきつ》ぐ<fourth>走者《そうしゃ》として走《はし》り、勢《いきお》いそのままにゴールテープを切《き》った。", "choices_ruby": ["4番目《ばんめ》", "1番目《ばんめ》", "2番目《ばんめ》", "3番目《ばんめ》"], "explanation_ruby": "four(4)+ -th。July 4th = 7月《がつ》4日《にち》(アメリカ独立記念日《どくりつきねんび》)。", "body_kana": "かれはがっこうのリレーで、1そうから3そうまでをひきつぐ<fourth>そうしゃとしてはしり、いきおいそのままにゴールテープをきった。"}, {"word": "Friday", "meaning_jp": "金曜日", "pos": "名", "body": "1週間の中で<Friday>は私が一番好きな日。次の日が土曜日で学校が休みなので、夜更かしして好きな番組を見られる。", "choices": ["金曜日", "月曜日", "土曜日", "日曜日"], "correct_index": 0, "explanation": "北欧神話の女神 Frigg の日。", "id": "s1_131", "body_ruby": "1週間《しゅうかん》の中《なか》で<Friday>は私《わたし》が一番好《いちばんす》きな日《ひ》。次《つぎ》の日《ひ》が土曜日《どようび》で学校《がっこう》が休《やす》みなので、夜更《よふ》かしして好《す》きな番組《ばんぐみ》を見《み》られる。", "choices_ruby": ["金曜日《きんようび》", "月曜日《げつようび》", "土曜日《どようび》", "日曜日《にちようび》"], "explanation_ruby": "北欧神話《ほくおうしんわ》の女神《めがみ》 Frigg の日《ひ》。", "body_kana": "1週間のなかで<Friday>はわたしがいちばんすきなひ。つぎのひがどようびでがっこうがやすみなので、よふかししてすきなばんぐみをみられる。"}, {"word": "friend", "meaning_jp": "友達", "pos": "名", "body": "小学校から仲が良い<friend>とは、中学が違ってもお互いの家を行き来して、毎週末一緒にゲームをして遊んでいる。", "choices": ["友達", "兄弟", "家族", "先生"], "correct_index": 0, "explanation": "best friend(親友)、make friends(友達になる)。", "id": "s1_132", "body_ruby": "小学校《しょうがっこう》から仲《なか》が良《よ》い<friend>とは、中学《ちゅうがく》が違《ちが》ってもお互《たが》いの家《いえ》を行《い》き来《き》して、毎週《まいしゅう》末《まつ》一緒《いっしょ》にゲームをして遊《あそ》んでいる。", "choices_ruby": ["友達《ともだち》", "兄弟《きょうだい》", "家族《かぞく》", "先生《せんせい》"], "explanation_ruby": "best friend(親友《しんゆう》)、make friends(友達《ともだち》になる)。", "body_kana": "しょうがっこうからなかがよい<friend>とは、ちゅうがくがちがってもおたがいのいえをいききして、まいしゅうまついっしょにゲームをしてあそんでいる。"}, {"word": "fun", "meaning_jp": "楽しみ", "pos": "名", "body": "クラスで
