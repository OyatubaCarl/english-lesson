 "私《わたし》の13歳《さい》の誕生日《たんじょうび》に、両親《りょうしん》が前《ぜん》から欲《ほ》しかった漫画《まんが》の全巻《ぜんかん》セットを<present>として箱《はこ》に包《つつ》んで渡《わた》してくれた。お祝《いわ》いに贈《おく》るものだ。", "choices_ruby": ["プレゼント", "罰《ばつ》", "請求書《せいきゅうしょ》", "手紙《てがみ》"], "explanation_ruby": "gift と同《おな》じ意味《いみ》。「現在《げんざい》の」の形容詞《けいようし》用法《ようほう》もある。", "body_kana": "わたしの13歳のたんじょうびに、りょうしんがぜんからほしかったまんがのぜんかんセットを<present>としてはこにつつんでわたしてくれた。おいわいにおくるものだ。"}, {"word": "problem", "meaning_jp": "問題", "pos": "名", "body": "数学のテストの最後の<problem>は、図形と計算が組み合わさっていて、20分考えても解けなかった。", "choices": ["問題", "答え", "宿題", "教科書"], "correct_index": 0, "explanation": "No problem. = 問題ありません。", "id": "s1_258", "body_ruby": "数学《すうがく》のテストの最後《さいご》の<problem>は、図形《ずけい》と計算《けいさん》が｜組み合《くみあ》わさっていて、20分《ふん》考《かんが》えても解《と》けなかった。", "choices_ruby": ["問題《もんだい》", "答《こた》え", "宿題《しゅくだい》", "教科書《きょうかしょ》"], "explanation_ruby": "No problem. = 問題《もんだい》ありません。", "body_kana": "すうがくのテストのさいごの<problem>は、ずけいとけいさんがくみあわさっていて、20分かんがえてもとけなかった。"}, {"word": "push", "meaning_jp": "押す", "pos": "動", "body": "重い荷物が乗ったショッピングカートを、両手で前に向かってぐっと<push>しながら、レジまで運んだ。", "choices": ["押す", "引く", "持ち上げる", "落とす"], "correct_index": 0, "explanation": "pull(引く)の対。Push! = 押して!", "id": "s1_259", "body_ruby": "重《おも》い荷物《にもつ》が乗《の》ったショッピングカートを、両手《りょうて》で前《まえ》に向《む》かってぐっと<push>しながら、レジまで運《はこ》んだ。", "choices_ruby": ["押《お》す", "引《ひ》く", "持《も》ち上《あ》げる", "落《お》とす"], "explanation_ruby": "pull(引《ひ》く)の対《つい》。Push! = 押《お》して!", "body_kana": "おもいにもつがのったショッピングカートを、りょうてでまえにむかってぐっと<push>しながら、レジまではこんだ。"}, {"word": "question", "meaning_jp": "質問、問題", "pos": "名", "body": "授業中、先生が解説した部分でわからないところがあったので、手を挙げて先生に<question>をした。知りたいことを聞く言葉だ。", "choices": ["質問", "答え", "宿題", "発表"], "correct_index": 0, "explanation": "Q&A = question and answer。", "id": "s1_260", "body_ruby": "授業中《じゅぎょうちゅう》、先生《せんせい》が解説《かいせつ》した部分《ぶぶん》でわからないところがあったので、手《て》を挙《あ》げて先生《せんせい》に<question>をした。知《し》りたいことを聞《き》く言葉《ことば》だ。", "choices_ruby": ["質問《しつもん》", "答《こた》え", "宿題《しゅくだい》", "発表《はっぴょう》"], "explanation_ruby": "Q&A = question and answer。", "body_kana": "じゅぎょうちゅう、せんせいがかいせつしたぶぶんでわからないところがあったので、てをあげてせんせいに<question>をした。しりたいことをきくことばだ。"}, {"word": "quickly", "meaning_jp": "素早く", "pos": "副", "body": "電車があと2分で出てしまうので、改札を抜けてホームまで階段を<quickly>駆け上がった。", "choices": ["素早く", "ゆっくり", "静かに", "重く"], "correct_index": 0, "explanation": "quick(速い)+ -ly。slowly(ゆっくり)の対。", "id": "s1_261", "body_ruby": "電車《でんしゃ》があと2分《ふん》で出《で》てしまうので、改札《かいさつ》を抜《ぬ》けてホームまで階段《かいだん》を<quickly>駆《か》け上《あ》がった。", "choices_ruby": ["素早《すばや》く", "ゆっくり", "静《しず》かに", "重《おも》く"], "explanation_ruby": "quick(速《はや》い)+ -ly。slowly(ゆっくり)の対《つい》。", "body_kana": "でんしゃがあと2分ででてしまうので、かいさつをぬけてホームまでかいだんを<quickly>かけあがった。"}, {"word": "rabbit", "meaning_jp": "ウサギ", "pos": "名", "body": "幼稚園で飼っている真っ白な<rabbit>は、長い耳をピンと立てて、もぐもぐと人参を食べていた。耳が長く跳ねる小さな動物だ。", "choices": ["ウサギ", "リス", "ハムスター", "猫"], "correct_index": 0, "explanation": "ぴょんぴょん跳ねる動物。", "id": "s1_262", "body_ruby": "幼稚園《ようちえん》で飼《か》っている｜真っ白《まっしろ》な<rabbit>は、長《なが》い耳《みみ》をピンと立《た》てて、もぐもぐと人参《にんじん》を食《た》べていた。耳《みみ》が長《なが》く跳《は》ねる小《ちい》さな動物《どうぶつ》だ。", "choices_ruby": ["ウサギ", "リス", "ハムスター", "猫《ねこ》"], "explanation_ruby": "ぴょんぴょん跳《は》ねる動物《どうぶつ》。", "body_kana": "ようちえんでかっているまっしろな<rabbit>は、ながいみみをピンとたてて、もぐもぐとにんじんをたべていた。みみがながくはねるちいさなどうぶつだ。"}, {"word": "ran", "meaning_jp": "走った", "pos": "動", "body": "学校に遅刻しそうになって、家を出てから駅まで止まらずに5分間全力で<ran>した。", "choices": ["走った", "歩いた", "止まった", "座った"], "correct_index": 0, "explanation": "run の過去形。run-ran-run。", "id": "s1_263", "body_ruby": "学校《がっこう》に遅刻《ちこく》しそうになって、家《いえ》を出《で》てから駅《えき》まで止《と》まらずに5分間《ふんかん》全力《ぜんりょく》で<ran>した。", "choices_ruby": ["走《はし》った", "歩《ある》いた", "止《と》まった", "座《すわ》った"], "explanation_ruby": "run の過去形《かこけい》。run-ran-run。", "body_kana": "がっこうにちこくしそうになって、いえをでてからえきまでとまらずに5分間ぜんりょくで<ran>した。"}, {"word": "read", "meaning_jp": "読む", "pos": "動", "body": "寝る前に部屋のベッドに入って、図書館で借りてきた小説を毎晩30ページずつ<read>している。", "choices": ["読む", "書く", "見る", "話す"], "correct_index": 0, "explanation": "現在形と過去形・過去分詞は同じ綴り(発音は変わる)。", "id": "s1_264", "body_ruby": "寝《ね》る前《まえ》に部屋《へや》のベッドに入《はい》って、図書館《としょかん》で借《か》りてきた小説《しょうせつ》を毎晩《まいばん》30ページずつ<read>している。", "choices_ruby": ["読《よ》む", "書《か》く", "見《み》る", "話《はな》す"], "explanation_ruby": "現在形《げんざいけい》と過去形《かこけい》・過去分詞《かこぶんし》は同《おな》じ綴《つづ》り(発音《はつおん》は変《か》わる)。", "body_kana": "ねるまえにへやのベッドにはいって、としょかんでかりてきたしょうせつをまいばん30ページずつ<read>している。"}, {"word": "ready", "meaning_jp": "準備ができた", "pos": "形", "body": "明日の遠足の準備として、お弁当・水筒・帽子をリュックに全部詰めて、出発の<ready>が完了した。", "choices": ["準備ができた", "始まっていない", "終わった", "遅れた"], "correct_index": 0, "explanation": "Ready, set, go! = 位置について、よーい、ドン!", "id": "s1_265", "body_ruby": "明日《あした》の遠足《えんそく》の準備《じゅんび》として、お弁当《べんとう》・水筒《すいとう》・帽子《ぼうし》をリュックに全部《ぜんぶ》詰《つ》めて、出発《しゅっぱつ》の<ready>が完了《かんりょう》した。", "choices_ruby": ["準備《じゅんび》ができた", "始《はじ》まっていない", "終《お》わった", "遅《おく》れた"], "explanation_ruby": "Ready, set, go! = 位置《いち》について、よーい、ドン!", "body_kana": "あしたのえんそくのじゅんびとして、おべんとう・すいとう・ぼうしをリュックにぜんぶつめて、しゅっぱつの<ready>がかんりょうした。"}, {"word": "red", "meaning_jp": "赤", "pos": "形", "body": "信号が<red>に変わったので、走っていた車もすべて止まって、横断歩道を渡る人を待った。", "choices": ["赤", "青", "緑", "黄"], "correct_index": 0, "explanation": "止まれの色。Red Cross = 赤十字。", "id": "s1_266", "body_ruby": "信号《しんごう》が<red>に変《か》わったので、走《はし》っていた車《くるま》もすべて止《と》まって、横断歩道《おうだんほどう》を渡《わた》る人《ひと》を待《ま》った。", "choices_ruby": ["赤《あか》", "青《あお》", "緑《みどり》", "黄《き》"], "explanation_ruby": "止《と》まれの色《いろ》。Red Cross = 赤十字《せきじゅうじ》。", "body_kana": "しんごうが<red>にかわったので、はしっていたくるまもすべてとまって、おうだんほどうをわたるひとをまった。"}, {"word": "restaurant", "meaning_jp": "レストラン", "pos": "名", "body": "家族で外食する時は、駅前のイタリア料理の<restaurant>に行って、ピザやパスタを食べることが多い。", "choices": ["レストラン", "スーパー", "コンビニ", "本屋"], "correct_index": 0, "explanation": "フランス語由来。", "id": "s1_267", "body_ruby": "家族《かぞく》で外食《がいしょく》する時《とき》は、駅前《えきまえ》のイタリア料理《りょうり》の<restaurant>に行《い》って、ピザやパスタを食《た》べることが多《おお》い。", "choices_ruby": ["レストラン", "スーパー", "コンビニ", "本屋《ほんや》"], "explanation_ruby": "フランス語《ご》由来《ゆらい》。", "body_kana": "かぞくでがいしょくするときは、えきまえのイタリアりょうりの<restaurant>にいって、ピザやパスタをたべることがおおい。"}, {"word": "restroom", "meaning_jp": "(公共の)トイレ", "pos": "名", "body": "映画館で映画が始まる前に、ロビーにある<restroom>に行って手を洗ってきた。公共の場所での手洗いや用を足す部屋だ。", "choices": ["トイレ", "売店", "駐車場", "受付"], "correct_index": 0, "explanation": "アメリカでよく使う婉曲表現。bathroom も同じ。", "id": "s1_268", "body_ruby": "映画館《えいがかん》で映画《えいが》が始《はじ》まる前《まえ》に、ロビーにある<restroom>に行《い》って手《て》を洗《あら》ってきた。公共《こうきょう》の場所《ばしょ》での手洗《てあら》いや用《よう》を足《た》す部屋《へや》だ。", "choices_ruby": ["トイレ", "売店《ばいてん》", "駐車場《ちゅうしゃじょう》", "受付《うけつけ》"], "explanation_ruby": "アメリカでよく使《つか》う婉曲《えんきょく》表現《ひょうげん》。bathroom も同《おな》じ。", "body_kana": "えいがかんでえいががはじまるまえに、ロビーにある<restroom>にいっててをあらってきた。こうきょうのばしょでのてあらいやようをたすへやだ。"}, {"word": "rice", "meaning_jp": "米、ご飯", "pos": "名", "body": "日本人の食事には、毎食必ずと言っていいほど、白く炊いた<rice>が出てくる。田んぼで育つ、おにぎりやおすしの材料だ。", "choices": ["米(ご飯)", "パン", "麺", "肉"], "correct_index": 0, "explanation": "「お米」「炊いたご飯」両方の意味。", "id": "s1_269", "body_ruby": "日本人《にほんじん》の食事《しょくじ》には、毎食《まいしょく》必《かなら》ずと言《い》っていいほど、白《しろ》く炊《た》いた<rice>が出《で》てくる。田《た》んぼで育《そだ》つ、おにぎりやおすしの材料《ざいりょう》だ。", "choices_ruby": ["米《こめ》(ご飯《めし》)", "パン", "麺《めん》", "肉《にく》"], "explanation_ruby": "「お米《こめ》」「炊《た》いたご飯《めし》」両方《りょうほう》の意味《いみ》。", "body_kana": "にほんじんのしょくじには、まいしょくかならずといっていいほど、しろくたいた<rice>がでてくる。たんぼでそだつ、おにぎりやおすしのざいりょうだ。"}, {"word": "right", "meaning_jp": "正しい、右", "pos": "形", "body": "テストでこの計算問題の答えを「12」と書いた。先生に「君の答えは<right>です」と言われて満点だった。", "choices": ["正しい", "間違っている", "難しい", "簡単な"], "correct_index": 0, "explanation": "wrong(間違い)の対。「右」の意味もある(left の対)。", "id": "s1_270", "body_ruby": "テストでこの計算問題《けいさんもんだい》の答《こた》えを「12」と書《か》いた。先生《せんせい》に「君《くん》の答《こた》えは<right>です」と言《い》われて満点《まんてん》だった。", "choices_ruby": ["正《ただ》しい", "間違《まちが》っている", "難《むずか》しい", "簡単《かんたん》な"], "explanation_ruby": "wrong(間違《まちが》い)の対《つい》。「右《みぎ》」の意味《いみ》もある(left の対《つい》)。", "body_kana": "テストでこのけいさんもんだいのこたえを「12」とかいた。せんせいに「くんのこたえは<right>です」といわれてまんてんだった。"}, {"word": "river", "meaning_jp": "川", "pos": "名", "body": "私の町には、東京の中心を流れる隅田<river>のような、幅100メートルもある大きな川がある。水が高い場所から海へ流れていく自然だ。", "choices": ["川", "海", "湖", "池"], "correct_index": 0, "explanation": "山から海へ流れる水路。lake(湖)とは異なる。", "id": "s1_271", "body_ruby": "私《わたし》の町《まち》には、東京《とうきょう》の中心《ちゅうしん》を流《なが》れる隅田《すみだ》<river>のような、幅《はば》100メートルもある大《おお》きな川《かわ》がある。水《みず》が高《たか》い場所《ばしょ》から海《うみ》へ流《なが》れていく自然《しぜん》だ。", "choices_ruby": ["川《かわ》", "海《うみ》", "湖《みずうみ》", "池《いけ》"], "explanation_ruby": "山《やま》から海《うみ》へ流《なが》れる水路《すいろ》。lake(湖《みずうみ》)とは異《こと》なる。", "body_kana": "わたしのまちには、とうきょうのちゅうしんをながれるすみだ<river>のような、はば100メートルもあるおおきなかわがある。みずがたかいばしょからうみへながれていくしぜんだ。"}, {"word": "room", "meaning_jp": "部屋", "pos": "名", "body": "私の<room>は2階の南向きで、4畳半ほどの広さに、ベッド・机・本棚が置いてある。", "choices": ["部屋", "庭", "玄関", "屋根"], "correct_index": 0, "explanation": "living room(リビング)、classroom(教室)。", "id": "s1_272", "body_ruby": "私《わたし》の<room>は2階《かい》の南向《みなみむ》きで、4畳半《じょうはん》ほどの広《ひろ》さに、ベッド・机《つくえ》・本棚《ほんだな》が置《お》いてある。", "choices_ruby": ["部屋《へや》", "庭《にわ》", "玄関《げんかん》", "屋根《やね》"], "explanation_ruby": "living room(リビング)、classroom(教室《きょうしつ》)。", "body_kana": "わたしの<room>は2階のみなみむきで、4畳半ほどのひろさに、ベッド・つくえ・ほんだながおいてある。"}, {"word": "ruler", "meaning_jp": "定規", "pos": "名", "body": "算数の時間に、ノートに直線を引くため、目盛りの付いた30センチの<ruler>を使って正確に線を引いた。長さを測る道具だ。", "choices": ["定規", "鉛筆", "消しゴム", "コンパス"], "correct_index": 0, "explanation": "「支配者」の意味もある(rule = 統治する)。", "id": "s1_273", "body_ruby": "算数《さんすう》の時間《じかん》に、ノートに直線《ちょくせん》を引《ひ》くため、目盛《めも》りの付《つ》いた30センチの<ruler>を使《つか》って正確《せいかく》に線《せん》を引《ひ》いた。長《なが》さを測《はか》る道具《どうぐ》だ。", "choices_ruby": ["定規《じょうぎ》", "鉛筆《えんぴつ》", "消《け》しゴム", "コンパス"], "explanation_ruby": "「支配者《しはいしゃ》」の意味《いみ》もある(rule = 統治《とうち》する)。", "body_kana": "さんすうのじかんに、ノートにちょくせんをひくため、めもりのついた30センチの<ruler>をつかってせいかくにせんをひいた。ながさをはかるどうぐだ。"}, {"word": "said", "meaning_jp": "言った", "pos": "動", "body": "先生に質問されて、彼は「分かりません」と<said>した。", "choices": ["言った", "答えた", "質問した", "笑った"], "correct_index": 0, "explanation": "say の過去形。say-said-said。", "id": "s1_274", "body_ruby": "先生《せんせい》に質問《しつもん》されて、彼《かれ》は「分《わ》かりません」と<said>した。", "choices_ruby": ["言《い》った", "答《こた》えた", "質問《しつもん》した", "笑《わら》った"], "explanation_ruby": "say の過去形《かこけい》。say-said-said。", "body_kana": "せんせいにしつもんされて、かれは「わかりません」と<said>した。"}, {"word": "sandwich", "meaning_jp": "サンドイッチ", "pos": "名", "body": "今日のお弁当は、母が作ってくれた、2枚のパンにハムとレタスとトマトを挟んだ<sandwich>だ。手で持って食べられる軽食だ。", "choices": ["サンドイッチ", "ハンバーガー", "ピザ", "パスタ"], "correct_index": 0, "explanation": "イギリスのサンドイッチ伯爵が由来。", "id": "s1_275", "body_ruby": "今日《きょう》のお弁当《べんとう》は、母《はは》が作《つく》ってくれた、2枚《まい》のパンにハムとレタスとトマトを挟《はさ》んだ<sandwich>だ。手《て》で持《も》って食《た》べられる軽食《けいしょく》だ。", "choices_ruby": ["サンドイッチ", "ハンバーガー", "ピザ", "パスタ"], "explanation_ruby": "イギリスのサンドイッチ伯爵《はくしゃく》が由来《ゆらい》。", "body_kana": "きょうのおべんとうは、ははがつくってくれた、2枚のパンにハムとレタスとトマトをはさんだ<sandwich>だ。てでもってたべられるけいしょくだ。"}, {"word": "sat", "meaning_jp": "座った", "pos": "動", "body": "電車に乗った時、ちょうど空いていた窓際の席に<sat>した。そこから外の景色を見ながら通学した。", "choices": ["座った", "立った", "歩いた", "走った"], "correct_index": 0, "explanation": "sit の過去形。sit-sat-sat。", "id": "s1_276", "body_ruby": "電車《でんしゃ》に乗《の》った時《とき》、ちょうど空《す》いていた窓際《まどぎわ》の席《せき》に<sat>した。そこから外《そと》の景色《けしき》を見《み》ながら通学《つうがく》した。", "choices_ruby": ["座《すわ》った", "立《た》った", "歩《ある》いた", "走《はし》った"], "explanation_ruby": "sit の過去形《かこけい》。sit-sat-sat。", "body_kana": "でんしゃにのったとき、ちょうどすいていたまどぎわのせきに<sat>した。そこからそとのけしきをみながらつうがくした。"}, {"word": "Saturday", "meaning_jp": "土曜日", "pos": "名", "body": "学校がお休みの<Saturday>は、朝ゆっくり起きて、家族と一緒に少し遅めの朝食を食べる。週末の始まりだ。", "choices": ["土曜日", "日曜日", "月曜日", "金曜日"], "correct_index": 0, "explanation": "ローマの神 Saturn(土星)が由来。", "id": "s1_277", "body_ruby": "学校《がっこう》がお休《やす》みの<Saturday>は、朝《あさ》ゆっくり起《お》きて、家族《かぞく》と一緒《いっしょ》に少《すこ》し遅《おそ》めの朝食《ちょうしょく》を食《た》べる。週末《しゅうまつ》の始《はじ》まりだ。", "choices_ruby": ["土曜日《どようび》", "日曜日《にちようび》", "月曜日《げつようび》", "金曜日《きんようび》"], "explanation_ruby": "ローマの神《かみ》 Saturn(土星《どせい》)が由来《ゆらい》。", "body_kana": "がっこうがおやすみの<Saturday>は、あさゆっくりおきて、かぞくといっしょにすこしおそめのちょうしょくをたべる。しゅうまつのはじまりだ。"}, {"word": "saw", "meaning_jp": "見た", "pos": "動", "body": "昨日の夜空で、初めて流れ星を<saw>した。3秒くらいの間、北の方に光の線が見えた。", "choices": ["見た", "聞いた", "話した", "触った"], "correct_index": 0, "explanation": "see の過去形。see-saw-seen。", "id": "s1_278", "body_ruby": "昨日《きのう》の夜《よる》空《そら》で、初《はじ》めて｜流れ星《ながれぼし》を<saw>した。3秒《びょう》くらいの間《あいだ》、北《きた》の方《ほう》に光《ひかり》の線《せん》が見《み》えた。", "choices_ruby": ["見《み》た", "聞《き》いた", "話《はな》した", "触《さわ》った"], "explanation_ruby": "see の過去形《かこけい》。see-saw-seen。", "body_kana": "きのうのよるそらで、はじめてながれぼしを<saw>した。3秒くらいのあいだ、きたのほうにひかりのせんがみえた。"}, {"word": "say", "meaning_jp": "言う", "pos": "動", "body": "朝、家を出る時には、必ず母に「行ってきます」と<say>する習慣がある。", "choices": ["言う", "聞く", "見る", "読む"], "correct_index": 0, "explanation": "say-said-said。speak(話す)と区別。", "id": "s1_279", "body_ruby": "朝《あさ》、家《いえ》を出《で》る時《とき》には、必《かなら》ず母《はは》に「行《い》ってきます」と<say>する習慣《しゅうかん》がある。", "choices_ruby": ["言《い》う", "聞《き》く", "見《み》る", "読《よ》む"], "explanation_ruby": "say-said-said。speak(話《はな》す)と区別《くべつ》。", "body_kana": "あさ、いえをでるときには、かならずははに「いってきます」と<say>するしゅうかんがある。"}, {"word": "school", "meaning_jp": "学校", "pos": "名", "body": "私は毎朝8時に家を出て、自転車で15分かけて中学校の<school>に通っている。先生から勉強を教わる場所だ。", "choices": ["学校", "病院", "公園", "図書館"], "correct_index": 0, "explanation": "elementary school(小学校)、high school(高校)。", "id": "s1_280", "body_ruby": "私《わたし》は毎朝《まいあさ》8時《じ》に家《いえ》を出《で》て、自転車《じてんしゃ》で15分《ふん》かけて中学校《ちゅうがっこう》の<school>に通《かよ》っている。先生《せんせい》から勉強《べんきょう》を教《おそ》わる場所《ばしょ》だ。", "choices_ruby": ["学校《がっこう》", "病院《びょういん》", "公園《こうえん》", "図書館《としょかん》"], "explanation_ruby": "elementary school(小学校《しょうがっこう》)、high school(高校《こうこう》)。", "body_kana": "わたしはまいあさ8時にいえをでて、じてんしゃで15分かけてちゅうがっこうの<school>にかよっている。せんせいからべんきょうをおそわるばしょだ。"}, {"word": "schoolyard", "meaning_jp": "校庭", "pos": "名", "body": "昼休みになると、生徒たちは教室を飛び出して、広い<schoolyard>でドッジボールや鬼ごっこをして遊ぶ。", "choices": ["校庭", "教室", "体育館", "屋上"], "correct_index": 0, "explanation": "school + yard(庭)。", "id": "s1_281", "body_ruby": "昼休《ひるやす》みになると、生徒《せいと》たちは教室《きょうしつ》を｜飛び出《とびだ》して、広《ひろ》い<schoolyard>でドッジボールや鬼《おに》ごっこをして遊《あそ》ぶ。", "choices_ruby": ["校庭《こうてい》", "教室《きょうしつ》", "体育館《たいいくかん》", "屋上《おくじょう》"], "explanation_ruby": "school + yard(庭《にわ》)。", "body_kana": "ひるやすみになると、せいとたちはきょうしつをとびだして、ひろい<schoolyard>でドッジボールやおにごっこをしてあそぶ。"}, {"word": "science", "meaning_jp": "理科、科学", "pos": "名", "body": "私が一番好きな教科は<science>で、特に化学の実験で薬品を混ぜて色が変わる瞬間がとても面白い。自然の仕組みを学ぶ学問だ。", "choices": ["理科", "数学", "国語", "社会"], "correct_index": 0, "explanation": "scientist = 科学者、scientific = 科学的な。", "id": "s1_282", "body_ruby": "私《わたし》が一番好《いちばんす》きな教科《きょうか》は<science>で、特《とく》に化学《かがく》の実験《じっけん》で薬品《やくひん》を混《ま》ぜて色《いろ》が変《か》わる瞬間《しゅんかん》がとても面白《おもしろ》い。自然《しぜん》の仕組《しく》みを学《まな》ぶ学問《がくもん》だ。", "choices_ruby": ["理科《りか》", "数学《すうがく》", "国語《こくご》", "社会《しゃかい》"], "explanation_ruby": "scientist = 科学者《かがくしゃ》、scientific = 科学的《かがくてき》な。", "body_kana": "わたしがいちばんすきなきょうかは<science>で、とくにかがくのじっけんでやくひんをまぜていろがかわるしゅんかんがとてもおもしろい。しぜんのしくみをまなぶがくもんだ。"}, {"word": "Scotland", "meaning_jp": "スコットランド", "pos": "名", "body": "イギリスの北部にある<Scotland>は、緑の丘とお城で有名で、バグパイプという楽器の発祥地でもある国の一部だ。", "choices": ["スコットランド", "イングランド", "アイルランド", "ウェールズ"], "correct_index": 0, "explanation": "イギリス(UK)を構成する4地域の一つ。", "id": "s1_283", "body_ruby": "イギリスの北部《ほくぶ》にある<Scotland>は、緑《みどり》の丘《おか》とお城《しろ》で有名《ゆうめい》で、バグパイプという楽器《がっき》の発祥地《はっしょうち》でもある国《くに》の一部《いちぶ》だ。", "choices_ruby": ["スコットランド", "イングランド", "アイルランド", "ウェールズ"], "explanation_ruby": "イギリス(UK)を構成《こうせい》する4地域《ちいき》の一《ひと》つ。", "body_kana": "イギリスのほくぶにある<Scotland>は、みどりのおかとおしろでゆうめいで、バグパイプというがっきのはっしょうちでもあるくにのいちぶだ。"}, {"word": "sea", "meaning_jp": "海", "pos": "名", "body": "夏休みに家族で湘南の海岸に行って、青く広がる<sea>で水泳を楽しんだ。塩水の大きな水のことで、地球の表面の7割を占める。", "choices": ["海", "山", "川", "湖"], "correct_index": 0, "explanation": "ocean(大洋)よりも狭い。", "id": "s1_284", "body_ruby": "夏休《なつやす》みに家族《かぞく》で湘南《しょうなん》の海岸《かいがん》に行《い》って、青《あお》く広《ひろ》がる<sea>で水泳《すいえい》を楽《たの》しんだ。塩水《しおみず》の大《おお》きな水《みず》のことで、地球《ちきゅう》の表面《ひょうめん》の7割《わり》を占《し》める。", "choices_ruby": ["海《うみ》", "山《やま》", "川《かわ》", "湖《みずうみ》"], "explanation_ruby": "ocean(大洋《たいよう》)よりも狭《せま》い。", "body_kana": "なつやすみにかぞくでしょうなんのかいがんにいって、あおくひろがる<sea>ですいえいをたのしんだ。しおみずのおおきなみずのことで、ちきゅうのひょうめんの7わりをしめる。"}, {"word": "second", "meaning_jp": "2番目、秒", "pos": "名/形", "body": "今日の50メートル走で、彼は<second>でゴールした。トップは彼の親友で、彼の後ろにはあと38人が控えていた。", "choices": ["2番目", "1番目", "3番目", "最後"], "correct_index": 0, "explanation": "「秒」の意味もある(60 seconds = 1 minute)。", "id": "s1_285", "body_ruby": "今日《きょう》の50メートル走《そう》で、彼《かれ》は<second>でゴールした。トップは彼《かれ》の親友《しんゆう》で、彼《かれ》の後《あと》ろにはあと38人《にん》が控《ひか》えていた。", "choices_ruby": ["2番目《ばんめ》", "1番目《ばんめ》", "3番目《ばんめ》", "最後《さいご》"], "explanation_ruby": "「秒《びょう》」の意味《いみ》もある(60 seconds = 1 minute)。", "body_kana": "きょうの50メートルそうで、かれは<second>でゴールした。トップはかれのしんゆうで、かれのあとろにはあと38人がひかえていた。"}, {"word": "see", "meaning_jp": "見える、会う", "pos": "動", "body": "山の頂上に登ると、雲一つない晴れた日には、遠くに富士山を<see>することができる。", "choices": ["見える", "聞こえる", "感じる", "触る"], "correct_index": 0, "explanation": "see-saw-seen。look(意識して見る)と区別。", "id": "s1_286", "body_ruby": "山《やま》の頂上《ちょうじょう》に登《のぼ》ると、雲《くも》一《ひと》つない晴《は》れた日《ひ》には、遠《とお》くに富士山《ふじさん》を<see>することができる。", "choices_ruby": ["見《み》える", "聞《き》こえる", "感《かん》じる", "触《さわ》る"], "explanation_ruby": "see-saw-seen。look(意識《いしき》して見《み》る)と区別《くべつ》。", "body_kana": "やまのちょうじょうにのぼると、くもひとつないはれたひには、とおくにふじさんを<see>することができる。"}, {"word": "September", "meaning_jp": "9月", "pos": "名", "body": "夏休みが終わって学校が始まる<September>。長い休みの宿題提出と、久しぶりの友達との再会で胸が高鳴る。", "choices": ["9月", "8月", "10月", "11月"], "correct_index": 0, "explanation": "sept(7)が語源(旧暦の7月)。", "id": "s1_287", "body_ruby": "夏休《なつやす》みが終《お》わって学校《がっこう》が始《はじ》まる<September>。長《なが》い休《やす》みの宿題《しゅくだい》提出《ていしゅつ》と、久《ひさ》しぶりの友達《ともだち》との再会《さいかい》で胸《むね》が高鳴《たかな》る。", "choices_ruby": ["9月《がつ》", "8月《がつ》", "10月《がつ》", "11月《がつ》"], "explanation_ruby": "sept(7)が語源《ごげん》(旧暦《きゅうれき》の7月《がつ》)。", "body_kana": "なつやすみがおわってがっこうがはじまる<September>。ながいやすみのしゅくだいていしゅつと、ひさしぶりのともだちとのさいかいでむねがたかなる。"}, {"word": "seven", "meaning_jp": "7", "pos": "名/形", "body": "1週間は月・火・水・木・金・土・日の<seven>日でできていて、ちょうど指の数より2本多い。", "choices": ["7", "6", "8", "10"], "correct_index": 0, "explanation": "数字の7。lucky seven = 幸運の数字。", "id": "s1_288", "body_ruby": "1週間《しゅうかん》は月《がつ》・火《ひ》・水《みず》・木《き》・金《きん》・土《つち》・日《にち》の<seven>日《にち》でできていて、ちょうど指《ゆび》の数《かず》より2本《ほん》多《おお》い。", "choices_ruby": ["7", "6", "8", "10"], "explanation_ruby": "数字《すうじ》の7。lucky seven = 幸運《こううん》の数字《すうじ》。", "body_kana": "1週間はがつ・ひ・みず・き・きん・つち・にちの<seven>にちでできていて、ちょうどゆびのかずより2本おおい。"}, {"word": "seventeen", "meaning_jp": "17", "pos": "名/形", "body": "近所のお兄さんは高校2年生で<seventeen>歳。来年高校3年生になり、再来年は大学受験を迎える。", "choices": ["17", "70", "7", "27"], "correct_index": 0, "explanation": "seven + teen。", "id": "s1_289", "body_ruby": "近所《きんじょ》のお兄《にい》さんは高校《こうこう》2年生《ねんせい》で<seventeen>歳《さい》。来年《らいねん》高校《こうこう》3年生《ねんせい》になり、再来年《さらいねん》は大学受験《だいがくじゅけん》を迎《むか》える。", "choices_ruby": ["17", "70", "7", "27"], "explanation_ruby": "seven + teen。", "body_kana": "きんじょのおにいさんはこうこう2年生で<seventeen>さい。らいねんこうこう3年生になり、さらいねんはだいがくじゅけんをむかえる。"}, {"word": "seventh", "meaning_jp": "7番目", "pos": "名/形", "body": "彼はクラスの徒競走で30人中<seventh>でゴールした。彼より速く走った人が6人いたが、まだ後ろに23人もいた。", "choices": ["7番目", "1番目", "10番目", "5番目"], "correct_index": 0, "explanation": "seven + -th。", "id": "s1_290", "body_ruby": "彼《かれ》はクラスの徒《と》競走《きょうそう》で30人《にん》中《なか》<seventh>でゴールした。彼《かれ》より速《はや》く走《はし》った人《ひと》が6人《にん》いたが、まだ後《うし》ろに23人《にん》もいた。", "choices_ruby": ["7番目《ばんめ》", "1番目《ばんめ》", "10番目《ばんめ》", "5番目《ばんめ》"], "explanation_ruby": "seven + -th。", "body_kana": "かれはクラスのときょうそうで30人なか<seventh>でゴールした。かれよりはやくはしったひとが6人いたが、まだうしろに23人もいた。"}, {"word": "seventy", "meaning_jp": "70", "pos": "名/形", "body": "近所のおじいさんは今年で<seventy>歳の誕生日を迎えるので、私たち子どもたちで花束を渡した。あと10年生きれば80歳の節目になる。", "choices": ["70", "7", "17", "77"], "correct_index": 0, "explanation": "seven + -ty。", "id": "s1_291", "body_ruby": "近所《きんじょ》のおじいさんは今年《ことし》で<seventy>歳《さい》の誕生日《たんじょうび》を迎《むか》えるので、私《わたし》たち子《こ》どもたちで花束《はなたば》を渡《わた》した。あと10年生《ねんせい》きれば80歳《さい》の節目《ふしめ》になる。", "choices_ruby": ["70", "7", "17", "77"], "explanation_ruby": "seven + -ty。", "body_kana": "きんじょのおじいさんはことしで<seventy>さいのたんじょうびをむかえるので、わたしたちこどもたちではなたばをわたした。あと10年生きれば80歳のふしめになる。"}, {"word": "shoe", "meaning_jp": "靴", "pos": "名", "body": "雨が強く降っているので、玄関で長靴に履き替えてから出かけた。普段は革の<shoe>を履いている。", "choices": ["靴", "服", "帽子", "ベルト"], "correct_index": 0, "explanation": "両足で2つあるので複数形 shoes をよく使う。", "id": "s1_292", "body_ruby": "雨《あめ》が強《つよ》く降《ふ》っているので、玄関《げんかん》で長靴《ながぐつ》に履《は》き替《か》えてから出《で》かけた。普段《ふだん》は革《かわ》の<shoe>を履《は》いている。", "choices_ruby": ["靴《くつ》", "服《ふく》", "帽子《ぼうし》", "ベルト"], "explanation_ruby": "両足《りょうあし》で2つあるので複数形《ふくすうけい》 shoes をよく使《つか》う。", "body_kana": "あめがつよくふっているので、げんかんでながぐつにはきかえてからでかけた。ふだんはかわの<shoe>をはいている。"}, {"word": "shop", "meaning_jp": "店", "pos": "名", "body": "学校の帰りに、駅前のおいしいパンが売っている<shop>に寄って、メロンパンを150円で買った。お金で物を売る所だ。", "choices": ["店", "学校", "家", "公園"], "correct_index": 0, "explanation": "store と同じ意味。動詞では「買い物をする」。", "id": "s1_293", "body_ruby": "学校《がっこう》の帰《かえ》りに、駅前《えきまえ》のおいしいパンが売《う》っている<shop>に寄《よ》って、メロンパンを150円《えん》で買《か》った。お金《かね》で物《もの》を売《う》る所《ところ》だ。", "choices_ruby": ["店《みせ》", "学校《がっこう》", "家《いえ》", "公園《こうえん》"], "explanation_ruby": "store と同《おな》じ意味《いみ》。動詞《どうし》では「｜買い物《かいもの》をする」。", "body_kana": "がっこうのかえりに、えきまえのおいしいパンがうっている<shop>によって、メロンパンを150円でかった。おかねでものをうるところだ。"}, {"word": "short", "meaning_jp": "短い、背が低い", "pos": "形", "body": "髪が長すぎて目にかかるようになったので、美容院で<short>に切ってもらった。", "choices": ["短い", "長い", "重い", "古い"], "correct_index": 0, "explanation": "long(長い)・tall(背が高い)の対。", "id": "s1_294", "body_ruby": "髪《かみ》が長《なが》すぎて目《め》にかかるようになったので、美容院《びよういん》で<short>に切《き》ってもらった。", "choices_ruby": ["短《みじか》い", "長《なが》い", "重《おも》い", "古《ふる》い"], "explanation_ruby": "long(長《なが》い)・tall(背《せ》が高《たか》い)の対《つい》。", "body_kana": "かみがながすぎてめにかかるようになったので、びよういんで<short>にきってもらった。"}, {"word": "shoulder", "meaning_jp": "肩", "pos": "名", "body": "雪が降る朝、薄着で外に出てしまったので、両方の<shoulder>がぎゅっと縮こまるほど冷えてしまった。", "choices": ["肩", "腰", "首", "腕"], "correct_index": 0, "explanation": "両側にあるので shoulders と複数形も。", "id": "s1_295", "body_ruby": "雪《ゆき》が降《ふ》る朝《あさ》、薄着《うすぎ》で外《そと》に出《で》てしまったので、両方《りょうほう》の<shoulder>がぎゅっと縮《ちぢ》こまるほど冷《ひ》えてしまった。", "choices_ruby": ["肩《かた》", "腰《こし》", "首《くび》", "腕《うで》"], "explanation_ruby": "両側《りょうがわ》にあるので shoulders と複数形《ふくすうけい》も。", "body_kana": "ゆきがふるあさ、うすぎでそとにでてしまったので、りょうほうの<shoulder>がぎゅっとちぢこまるほどひえてしまった。"}, {"word": "show", "meaning_jp": "見せる、ショー", "pos": "動/名", "body": "新しく買ったゲームソフトの遊び方を、友達に画面を指さしながら<show>した。", "choices": ["見せる", "隠す", "捨てる", "売る"], "correct_index": 0, "explanation": "show-showed-shown。TV show(テレビ番組)。", "id": "s1_296", "body_ruby": "新《あたら》しく買《か》ったゲームソフトの遊《あそ》び方《ほう》を、友達《ともだち》に画面《がめん》を指《さ》さしながら<show>した。", "choices_ruby": ["見《み》せる", "隠《かく》す", "捨《す》てる", "売《う》る"], "explanation_ruby": "show-showed-shown。TV show(テレビ番組《ばんぐみ》)。", "body_kana": "あたらしくかったゲームソフトのあそびほうを、ともだちにがめんをささしながら<show>した。"}, {"word": "shrine", "meaning_jp": "神社", "pos": "名", "body": "お正月には、家族で近所の鳥居がある<shrine>に行って、新年のお参りをして、お守りを買って帰る。", "choices": ["神社", "お寺", "教会", "城"], "correct_index": 0, "explanation": "神道(Shinto)の施設。仏教は temple(寺)。", "id": "s1_297", "body_ruby": "お正月《しょうがつ》には、家族《かぞく》で近所《きんじょ》の鳥居《とりい》がある<shrine>に行《い》って、新年《しんねん》のお参《まい》りをして、お守《まも》りを買《か》って帰《かえ》る。", "choices_ruby": ["神社《じんじゃ》", "お寺《てら》", "教会《きょうかい》", "城《しろ》"], "explanation_ruby": "神道《しんとう》(Shinto)の施設《しせつ》。仏教《ぶっきょう》は temple(寺《てら》)。", "body_kana": "おしょうがつには、かぞくできんじょのとりいがある<shrine>にいって、しんねんのおまいりをして、おまもりをかってかえる。"}, {"word": "sing", "meaning_jp": "歌う", "pos": "動", "body": "音楽の時間に、クラス全員でピアノの伴奏に合わせて、合唱コンクールの課題曲を大きな声で<sing>した。", "choices": ["歌う", "踊る", "話す", "弾く"], "correct_index": 0, "explanation": "sing-sang-sung。song(歌)の動詞形。", "id": "s1_298", "body_ruby": "音楽《おんがく》の時間《じかん》に、クラス全員《ぜんいん》でピアノの伴奏《ばんそう》に合《あ》わせて、合唱《がっしょう》コンクールの課題曲《かだいきょく》を大《おお》きな声《こえ》で<sing>した。", "choices_ruby": ["歌《うた》う", "踊《おど》る", "話《はな》す", "弾《ひ》く"], "explanation_ruby": "sing-sang-sung。song(歌《うた》)の動詞形《どうしけい》。", "body_kana": "おんがくのじかんに、クラスぜんいんでピアノのばんそうにあわせて、がっしょうコンクールのかだいきょくをおおきなこえで<sing>した。"}, {"word": "singer", "meaning_jp": "歌手", "pos": "名", "body": "彼女は人気のある<singer>で、毎年大きな会場でコンサートを開き、CDも100万枚以上売り上げている。歌うことを職業にしている人だ。", "choices": ["歌手", "俳優", "画家", "料理人"], "correct_index": 0, "explanation": "sing(歌う)+ -er(人)。", "id": "s1_299", "body_ruby": "彼女《かのじょ》は人気《にんき》のある<singer>で、毎年《まいとし》大《おお》きな会場《かいじょう》でコンサートを開《ひら》き、CDも100万枚《まんまい》以上《いじょう》｜売り上《うりあ》げている。歌《うた》うことを職業《しょくぎょう》にしている人《ひと》だ。", "choices_ruby": ["歌手《かしゅ》", "俳優《はいゆう》", "画家《がか》", "料理人《りょうりにん》"], "explanation_ruby": "sing(歌《うた》う)+ -er(人《ひと》)。", "body_kana": "かのじょはにんきのある<singer>で、まいとしおおきなかいじょうでコンサートをひらき、CDも100まんまいいじょううりあげている。うたうことをしょくぎょうにしているひとだ。"}, {"word": "sister", "meaning_jp": "姉、妹", "pos": "名", "body": "私には3歳年下の<sister>がいて、いつも一緒に絵を描いたり、絵本を読み聞かせたりして遊んでいる。", "choices": ["姉(妹)", "兄(弟)", "母", "おば"], "correct_index": 0, "explanation": "姉も妹もどちらも sister。", "id": "s1_300", "body_ruby": "私《わたし》には3歳《さい》年下《としした》の<sister>がいて、いつも一緒《いっしょ》に絵《え》を描《えが》いたり、絵本《えほん》を読《よ》み聞《き》かせたりして遊《あそ》んでいる。", "choices_ruby": ["姉《あね》(妹《いもうと》)", "兄《あに》(弟《おとうと》)", "母《はは》", "おば"], "explanation_ruby": "姉《あね》も妹《いもうと》もどちらも sister。", "body_kana": "わたしには3歳とししたの<sister>がいて、いつもいっしょにえをえがいたり、えほんをよみきかせたりしてあそんでいる。"}, {"word": "sit", "meaning_jp": "座る", "pos": "動", "body": "授業中は背筋を伸ばして、椅子にきちんと<sit>することが大切だと、入学式で先生に教わった。", "choices": ["座る", "立つ", "歩く", "寝る"], "correct_index": 0, "explanation": "stand(立つ)の対。sit-sat-sat。", "id": "s1_301", "body_ruby": "授業中《じゅぎょうちゅう》は背筋《せすじ》を伸《の》ばして、椅子《いす》にきちんと<sit>することが大切《たいせつ》だと、入学式《にゅうがくしき》で先生《せんせい》に教《おそ》わった。", "choices_ruby": ["座《すわ》る", "立《た》つ", "歩《ある》く", "寝《ね》る"], "explanation_ruby": "stand(立《た》つ)の対《つい》。sit-sat-sat。", "body_kana": "じゅぎょうちゅうはせすじをのばして、いすにきちんと<sit>することがたいせつだと、にゅうがくしきでせんせいにおそわった。"}, {"word": "six", "meaning_jp": "6", "pos": "名/形", "body": "サイコロの一番大きな目は<six>で、黒い丸が縦に2つ、横に3つ並んで描かれている。", "choices": ["6", "5", "7", "10"], "correct_index": 0, "explanation": "数字の6。five(5)と seven(7)の間。", "id": "s1_302", "body_ruby": "サイコロの一番《いちばん》大《おお》きな目《め》は<six>で、黒《くろ》い丸《まる》が縦《たて》に2つ、横《よこ》に3つ並《なら》んで描《えが》かれている。", "choices_ruby": ["6", "5", "7", "10"], "explanation_ruby": "数字《すうじ》の6。five(5)と seven(7)の間《あいだ》。", "body_kana": "サイコロのいちばんおおきなめは<six>で、くろいまるがたてに2つ、よこに3つならんでえがかれている。"}, {"word": "sixteen", "meaning_jp": "16", "pos": "名/形", "body": "高校1年生は4月生まれだと<sixteen>歳。中学を卒業して1年が経ち、運転免許のうち原付なら取れる年齢だ。", "choices": ["16", "60", "6", "26"], "correct_index": 0, "explanation": "six + teen。", "id": "s1_303", "body_ruby": "高校《こうこう》1年生《ねんせい》は4月《がつ》生《う》まれだと<sixteen>歳《さい》。中学《ちゅうがく》を卒業《そつぎょう》して1年《ねん》が経《た》ち、運転免許《うんてんめんきょ》のうち原付《げんつき》なら取《と》れる年齢《ねんれい》だ。", "choices_ruby": ["16", "60", "6", "26"], "explanation_ruby": "six + teen。", "body_kana": "こうこう1年生は4月うまれだと<sixteen>さい。ちゅうがくをそつぎょうして1年がたち、うんてんめんきょのうちげんつきならとれるねんれいだ。"}, {"word": "sixth", "meaning_jp": "6番目", "pos": "名/形", "body": "クラスの算数のテストの順位で、私は40人中<sixth>になった。私より高い得点を取った人がたった5人しかいなかった。", "choices": ["6番目", "1番目", "10番目", "60番目"], "correct_index": 0, "explanation": "six + -th。", "id": "s1_304", "body_ruby": "クラスの算数《さんすう》のテストの順位《じゅんい》で、私《わたし》は40人《にん》中《なか》<sixth>になった。私《わたし》より高《たか》い得点《とくてん》を取《と》った人《ひと》がたった5人《にん》しかいなかった。", "choices_ruby": ["6番目《ばんめ》", "1番目《ばんめ》", "10番目《ばんめ》", "60番目《ばんめ》"], "explanation_ruby": "six + -th。", "body_kana": "クラスのさんすうのテストのじゅんいで、わたしは40人なか<sixth>になった。わたしよりたかいとくてんをとったひとがたった5人しかいなかった。"}, {"word": "sixty", "meaning_jp": "60", "pos": "名/形", "body": "時計の文字盤の周りには、1分から<sixty>分までの目盛りが等間隔に並んでいる。1時間ぴったりで一周する。", "choices": ["60", "16", "6", "70"], "correct_index": 0, "explanation": "six + -ty。", "id": "s1_305", "body_ruby": "時計《とけい》の文字盤《もじばん》の周《まわ》りには、1分《ふん》から<sixty>分《ふん》までの目盛《めも》りが等間隔《とうかんかく》に並《なら》んでいる。1時間《じかん》ぴったりで一周《いっしゅう》する。", "choices_ruby": ["60", "16", "6", "70"], "explanation_ruby": "six + -ty。", "body_kana": "とけいのもじばんのまわりには、1分から<sixty>ふんまでのめもりがとうかんかくにならんでいる。1時間ぴったりでいっしゅうする。"}, {"word": "sky", "meaning_jp": "空", "pos": "名", "body": "今日の<sky>は雲一つない晴天で、地面から見上げると一面真っ青に広がっていて、とても気持ちが良い天気だ。", "choices": ["空", "海", "地面", "森"], "correct_index": 0, "explanation": "in the sky = 空に。Sky Tree = 東京スカイツリー。", "id": "s1_306", "body_ruby": "今日《きょう》の<sky>は雲《くも》一《ひと》つない晴天《せいてん》で、地面《じめん》から見上《みあ》げると一面《いちめん》｜真っ青《まっさお》に広《ひろ》がっていて、とても気持《きも》ちが良《よ》い天気《てんき》だ。", "choices_ruby": ["空《そら》", "海《うみ》", "地面《じめん》", "森《もり》"], "explanation_ruby": "in the sky = 空《そら》に。Sky Tree = 東京《とうきょう》スカイツリー。", "body_kana": "きょうの<sky>はくもひとつないせいてんで、じめんからみあげるといちめんまっさおにひろがっていて、とてもきもちがよいてんきだ。"}, {"word": "small", "meaning_jp": "小さい", "pos": "形", "body": "祖母の家で初めて見た子猫は、まだ生まれて1ヶ月で手のひらに乗るほど<small>だった。", "choices": ["小さい", "大きい", "重い", "速い"], "correct_index": 0, "explanation": "big / large(大きい)の対。", "id": "s1_307", "body_ruby": "祖母《そぼ》の家《いえ》で初《はじ》めて見《み》た子猫《こねこ》は、まだ生《う》まれて1ヶ月《かげつ》で手《て》のひらに乗《の》るほど<small>だった。", "choices_ruby": ["小《ちい》さい", "大《おお》きい", "重《おも》い", "速《はや》い"], "explanation_ruby": "big / large(大《おお》きい)の対《つい》。", "body_kana": "そぼのいえではじめてみたこねこは、まだうまれて1ヶ月でてのひらにのるほど<small>だった。"}, {"word": "soccer", "meaning_jp": "サッカー", "pos": "名", "body": "私は<soccer>部に入っていて、毎日放課後の2時間、ボールを足で蹴ってゴールに入れる練習をしている。11人ずつ2チームで競う球技だ。", "choices": ["サッカー", "野球", "バスケ", "テニス"], "correct_index": 0, "explanation": "イギリスでは football と呼ぶ。", "id": "s1_308", "body_ruby": "私《わたし》は<soccer>部《ぶ》に入《はい》っていて、毎日《まいにち》放課後《ほうかご》の2時間《じかん》、ボールを足《あし》で蹴《け》ってゴールに入《い》れる練習《れんしゅう》をしている。11人《にん》ずつ2チームで競《きそ》う球技《きゅうぎ》だ。", "choices_ruby": ["サッカー", "野球《やきゅう》", "バスケ", "テニス"], "explanation_ruby": "イギリスでは football と呼《よ》ぶ。", "body_kana": "わたしは<soccer>ぶにはいっていて、まいにちほうかごの2時間、ボールをあしでけってゴールにいれるれんしゅうをしている。11人ずつ2チームできそうきゅうぎだ。"}, {"word": "son", "meaning_jp": "息子", "pos": "名", "body": "隣のおじさんには中学3年生の<son>がいて、よく駅で見かける。", "choices": ["息子", "娘", "兄", "甥"], "correct_index": 0, "explanation": "daughter(娘)の対。", "id": "s1_309", "body_ruby": "隣《となり》のおじさんには中学《ちゅうがく》3年生《ねんせい》の<son>がいて、よく駅《えき》で見《み》かける。", "choices_ruby": ["息子《むすこ》", "娘《むすめ》", "兄《あに》", "甥《おい》"], "explanation_ruby": "daughter(娘《むすめ》)の対《つい》。", "body_kana": "となりのおじさんにはちゅうがく3年生の<son>がいて、よくえきでみかける。"}, {"word": "song", "meaning_jp": "歌", "pos": "名", "body": "卒業式で歌う<song>を、音楽の時間に毎日30分かけて、ピアノに合わせて声を出して練習している。メロディーと歌詞のある音楽だ。", "choices": ["歌", "音楽", "詩", "話"], "correct_index": 0, "explanation": "sing(歌う)の名詞形。", "id": "s1_310", "body_ruby": "卒業式《そつぎょうしき》で歌《うた》う<song>を、音楽《おんがく》の時間《じかん》に毎日《まいにち》30分《ふん》かけて、ピアノに合《あ》わせて声《こえ》を出《だ》して練習《れんしゅう》している。メロディーと歌詞《かし》のある音楽《おんがく》だ。", "choices_ruby": ["歌《うた》", "音楽《おんがく》", "詩《し》", "話《はなし》"], "explanation_ruby": "sing(歌《うた》う)の名詞《めいし》形《かたち》。", "body_kana": "そつぎょうしきでうたう<song>を、おんがくのじかんにまいにち30分かけて、ピアノにあわせてこえをだしてれんしゅうしている。メロディーとかしのあるおんがくだ。"}, {"word": "sorry", "meaning_jp": "ごめんなさい、残念", "pos": "形", "body": "友達のペンを借りていたのに無くしてしまったので、「<sorry>!」と謝って、新しい同じペンを買って渡した。", "choices": ["ごめんなさい", "ありがとう", "おはよう", "さようなら"], "correct_index": 0, "explanation": "I'm sorry. = ごめんなさい/残念です。", "id": "s1_311", "body_ruby": "友達《ともだち》のペンを借《か》りていたのに無《な》くしてしまったので、「<sorry>!」と謝《あやま》って、新《あたら》しい同《おな》じペンを買《か》って渡《わた》した。", "choices_ruby": ["ごめんなさい", "ありがとう", "おはよう", "さようなら"], "explanation_ruby": "I'm sorry. = ごめんなさい/残念《ざんねん》です。", "body_kana": "ともだちのペンをかりていたのになくしてしまったので、「<sorry>!」とあやまって、あたらしいおなじペンをかってわたした。"}, {"word": "Spanish", "meaning_jp": "スペイン語、スペインの", "pos": "名/形", "body": "中南米のメキシコやアルゼンチンでは、英語ではなくスペイン由来の<Spanish>が公用語として話されている。", "choices": ["スペイン語", "フランス語", "ポルトガル語", "イタリア語"], "correct_index": 0, "explanation": "Spain(スペイン)+ -ish。", "id": "s1_312", "body_ruby": "中南米《ちゅうなんべい》のメキシコやアルゼンチンでは、英語《えいご》ではなくスペイン由来《ゆらい》の<Spanish>が公用語《こうようご》として話《はな》されている。", "choices_ruby": ["スペイン語《ご》", "フランス語《ご》", "ポルトガル語《ご》", "イタリア語《ご》"], "explanation_ruby": "Spain(スペイン)+ -ish。", "body_kana": "ちゅうなんべいのメキシコやアルゼンチンでは、えいごではなくスペインゆらいの<Spanish>がこうようごとしてはなされている。"}, {"word": "speak", "meaning_jp": "話す", "pos": "動", "body": "外国人観光客に道を尋ねられた時、勇気を出して英語で<speak>してみたら、向こうも笑顔で答えてくれた。", "choices": ["話す", "聞く", "見る", "書く"], "correct_index": 0, "explanation": "speak-spoke-spoken。speaker = 話す人/スピーカー。", "id": "s1_313", "body_ruby": "外国人《がいこくじん》観光客《かんこうきゃく》に道《みち》を尋《たず》ねられた時《とき》、勇気《ゆうき》を出《だ》して英語《えいご》で<speak>してみたら、向《む》こうも笑顔《えがお》で答《こた》えてくれた。", "choices_ruby": ["話《はな》す", "聞《き》く", "見《み》る", "書《か》く"], "explanation_ruby": "speak-spoke-spoken。speaker = 話《はな》す人《ひと》/スピーカー。", "body_kana": "がいこくじんかんこうきゃくにみちをたずねられたとき、ゆうきをだしてえいごで<speak>してみたら、むこうもえがおでこたえてくれた。"}, {"word": "special", "meaning_jp": "特別な", "pos": "形", "body": "今日は私の13歳の誕生日という1年に1度の<special>な日なので、家族がレストランで好きなものを注文させてくれた。", "choices": ["特別な", "普通の", "毎日の", "退屈な"], "correct_index": 0, "explanation": "ordinary(普通)の対。", "id": "s1_314", "body_ruby": "今日《きょう》は私《わたし》の13歳《さい》の誕生日《たんじょうび》という1年《ねん》に1度《ど》の<special>な日《ひ》なので、家族《かぞく》がレストランで好《す》きなものを注文《ちゅうもん》させてくれた。", "choices_ruby": ["特別《とくべつ》な", "普通《ふつう》の", "毎日《まいにち》の", "退屈《たいくつ》な"], "explanation_ruby": "ordinary(普通《ふつう》)の対《つい》。", "body_kana": "きょうはわたしの13歳のたんじょうびという1年に1どの<special>なひなので、かぞくがレストランですきなものをちゅうもんさせてくれた。"}, {"word": "speech", "meaning_jp": "スピーチ、演説", "pos": "名", "body": "学校の全校集会で、生徒会長が壇上に立って、新学期の抱負について5分間の<speech>を聞かせてくれた。", "choices": ["スピーチ", "歌", "踊り", "本"], "correct_index": 0, "explanation": "speak(話す)の名詞形。", "id": "s1_315", "body_ruby": "学校《がっこう》の全校《ぜんこう》集会《しゅうかい》で、生徒会長《せいとかいちょう》が壇上《だんじょう》に立《た》って、新学期《しんがっき》の抱負《ほうふ》について5分間《ふんかん》の<speech>を聞《き》かせてくれた。", "choices_ruby": ["スピーチ", "歌《うた》", "踊《おど》り", "本《ほん》"], "explanation_ruby": "speak(話《はな》す)の名詞《めいし》形《かたち》。", "body_kana": "がっこうのぜんこうしゅうかいで、せいとかいちょうがだんじょうにたって、しんがっきのほうふについて5分間の<speech>をきかせてくれた。"}, {"word": "sport", "meaning_jp": "スポーツ", "pos": "名", "body": "私の好きな<sport>はサッカーで、放課後は校庭で2時間ボールを蹴り、休日にはテレビでバスケや野球の試合を観戦する。", "choices": ["スポーツ", "音楽", "美術", "読書"], "correct_index": 0, "explanation": "sports day = 運動会。", "id": "s1_316", "body_ruby": "私《わたし》の好《す》きな<sport>はサッカーで、放課後《ほうかご》は校庭《こうてい》で2時間《じかん》ボールを蹴《け》り、休日《きゅうじつ》にはテレビでバスケや野球《やきゅう》の試合《しあい》を観戦《かんせん》する。", "choices_ruby": ["スポーツ", "音楽《おんがく》", "美術《びじゅつ》", "読書《どくしょ》"], "explanation_ruby": "sports day = 運動会《うんどうかい》。", "body_kana": "わたしのすきな<sport>はサッカーで、ほうかごはこうていで2時間ボールをけり、きゅうじつにはテレビでバスケややきゅうのしあいをかんせんする。"}, {"word": "spring", "meaning_jp": "春", "pos": "名", "body": "桜が満開になる<spring>は、新学期や入学式があり、新しい出会いと別れの季節として、日本ではとても大切にされている。", "choices": ["春", "夏", "秋", "冬"], "correct_index": 0, "explanation": "「ばね」「泉」の意味もある多義語。", "id": "s1_317", "body_ruby": "桜《さくら》が満開《まんかい》になる<spring>は、新学期《しんがっき》や入学式《にゅうがくしき》があり、新《あたら》しい出会《であ》いと別《わか》れの季節《きせつ》として、日本《にっぽん》ではとても大切《たいせつ》にされている。", "choices_ruby": ["春《はる》", "夏《なつ》", "秋《あき》", "冬《ふゆ》"], "explanation_ruby": "「ばね」「泉《いずみ》」の意味《いみ》もある多義《たぎ》語《ご》。", "body_kana": "さくらがまんかいになる<spring>は、しんがっきやにゅうがくしきがあり、あたらしいであいとわかれのきせつとして、にっぽんではとてもたいせつにされている。"}, {"word": "stairs", "meaning_jp": "階段", "pos": "名", "body": "エレベーターが故障していたので、私たちは1階から5階まで、足を一段ずつ上げる<stairs>を歩いて上った。", "choices": ["階段", "エレベーター", "坂", "エスカレーター"], "correct_index": 0, "explanation": "常に複数形 stairs。step(1段)。", "id": "s1_318", "body_ruby": "エレベーターが故障《こしょう》していたので、私《わたし》たちは1階《かい》から5階《かい》まで、足《あし》を一段《いちだん》ずつ上《あ》げる<stairs>を歩《ある》いて上《あ》った。", "choices_ruby": ["階段《かいだん》", "エレベーター", "坂《さか》", "エスカレーター"], "explanation_ruby": "常《つね》に複数形《ふくすうけい》 stairs。step(1段《だん》)。", "body_kana": "エレベーターがこしょうしていたので、わたしたちは1階から5階まで、あしをいちだんずつあげる<stairs>をあるいてあった。"}, {"word": "stand", "meaning_jp": "立つ", "pos": "動", "body": "電車が混んでいて空席がなかったので、入口の近くで20分間ずっと<stand>したまま、目的の駅まで揺られていた。", "choices": ["立つ", "座る", "歩く", "寝る"], "correct_index": 0, "explanation": "sit(座る)の対。stand-stood-stood。", "id": "s1_319", "body_ruby": "電車《でんしゃ》が混《こ》んでいて空席《くうせき》がなかったので、入口《いりぐち》の近《ちか》くで20分間《ふんかん》ずっと<stand>したまま、目的《もくてき》の駅《えき》まで揺《ゆ》られていた。", "choices_ruby": ["立《た》つ", "座《すわ》る", "歩《ある》く", "寝《ね》る"], "explanation_ruby": "sit(座《すわ》る)の対《つい》。stand-stood-stood。", "body_kana": "でんしゃがこんでいてくうせきがなかったので、いりぐちのちかくで20分間ずっと<stand>したまま、もくてきのえきまでゆられていた。"}, {"word": "start", "meaning_jp": "始める", "pos": "動", "body": "毎日午後7時きっかりに、机に向かって2時間の宿題を<start>するように決めている。", "choices": ["始める", "終わる", "止める", "休む"], "correct_index": 0, "explanation": "begin と同じ意味。finish / end の対。", "id": "s1_320", "body_ruby": "毎日《まいにち》午後《ごご》7時《じ》きっかりに、机《つくえ》に向《む》かって2時間《じかん》の宿題《しゅくだい》を<start>するように決《き》めている。", "choices_ruby": ["始《はじ》める", "終《お》わる", "止《や》める", "休《やす》む"], "explanation_ruby": "begin と同《おな》じ意味《いみ》。finish / end の対《つい》。", "body_kana": "まいにちごご7時きっかりに、つくえにむかって2時間のしゅくだいを<start>するようにきめている。"}, {"word": "stop", "meaning_jp": "止まる、止める", "pos": "動", "body": "横断歩道の信号が赤に変わったので、走っていた車もすべて手前で<stop>した。", "choices": ["止まる", "進む", "戻る", "走る"], "correct_index": 0, "explanation": "go(進む)の対。bus stop = バス停。", "id": "s1_321", "body_ruby": "横断歩道《おうだんほどう》の信号《しんごう》が赤《あか》に変《か》わったので、走《はし》っていた車《くるま》もすべて手前《てまえ》で<stop>した。", "choices_ruby": ["止《と》まる", "進《すす》む", "戻《もど》る", "走《はし》る"], "explanation_ruby": "go(進《すす》む)の対《つい》。bus stop = バス停《てい》。", "body_kana": "おうだんほどうのしんごうがあかにかわったので、はしっていたくるまもすべててまえで<stop>した。"}, {"word": "story", "meaning_jp": "物語、話", "pos": "名", "body": "祖父は戦争中の体験談を、夕食の席で1時間かけてゆっくりと聞かせてくれた。とても貴重な<story>だった。", "choices": ["物語", "歌", "本", "絵"], "correct_index": 0, "explanation": "「階」の意味もある(2-story house = 2階建て)。", "id": "s1_322", "body_ruby": "祖父《そふ》は戦争中《せんそうちゅう》の体験談《たいけんだん》を、夕食《ゆうしょく》の席《せき》で1時間《じかん》かけてゆっくりと聞《き》かせてくれた。とても貴重《きちょう》な<story>だった。", "choices_ruby": ["物語《ものがたり》", "歌《うた》", "本《ほん》", "絵《え》"], "explanation_ruby": "「階《かい》」の意味《いみ》もある(2-story house = 2階《かい》建《た》て)。", "body_kana": "そふはせんそうちゅうのたいけんだんを、ゆうしょくのせきで1時間かけてゆっくりときかせてくれた。とてもきちょうな<story>だった。"}, {"word": "street", "meaning_jp": "通り、道", "pos": "名", "body": "私の家の前の<street>は、車が両方向に通る片側1車線の道で、夕方は近所の人が散歩していてにぎやかだ。", "choices": ["通り", "公園", "庭", "屋根"], "correct_index": 0, "explanation": "road(道)より、建物が両側にある通りに使う。", "id": "s1_323", "body_ruby": "私《わたし》の家《いえ》の前《まえ》の<street>は、車《くるま》が両方向《りょうほうこう》に通《とお》る片側《かたがわ》1車線《しゃせん》の道《みち》で、夕方《ゆうがた》は近所《きんじょ》の人《ひと》が散歩《さんぽ》していてにぎやかだ。", "choices_ruby": ["通《とお》り", "公園《こうえん》", "庭《にわ》", "屋根《やね》"], "explanation_ruby": "road(道《みち》)より、建物《たてもの》が両側《りょうがわ》にある通《とお》りに使《つか》う。", "body_kana": "わたしのいえのまえの<street>は、くるまがりょうほうこうにとおるかたがわ1しゃせんのみちで、ゆうがたはきんじょのひとがさんぽしていてにぎやかだ。"}, {"word": "strong", "meaning_jp": "強い", "pos": "形", "body": "彼は毎日腕立て伏せを100回やっていて、クラスで一番腕の<strong>力がある。", "choices": ["強い", "弱い", "速い", "重い"], "correct_index": 0, "explanation": "weak(弱い)の対。strong wind = 強風。", "id": "s1_324", "body_ruby": "彼《かれ》は毎日《まいにち》腕立《うでたて》て伏《ふ》せを100回《かい》やっていて、クラスで一番《いちばん》腕《うで》の<strong>力《ちから》がある。", "choices_ruby": ["強《つよ》い", "弱《よわ》い", "速《はや》い", "重《おも》い"], "explanation_ruby": "weak(弱《よわ》い)の対《つい》。strong wind = 強風《きょうふう》。", "body_kana": "かれはまいにちうでたててふせを100回やっていて、クラスでいちばんうでの<strong>ちからがある。"}, {"word": "student", "meaning_jp": "生徒、学生", "pos": "名", "body": "私の通う中学校には、1年生から3年生まで合わせて約500人の<student>が在籍している。", "choices": ["生徒", "先生", "校長", "保護者"], "correct_index": 0, "explanation": "study(勉強する)+ -ent。teacher(先生)の対。", "id": "s1_325", "body_ruby": "私《わたし》の通《かよ》う中学校《ちゅうがっこう》には、1年生《ねんせい》から3年生《ねんせい》まで合《あ》わせて約《やく》500人《にん》の<student>が在籍《ざいせき》している。", "choices_ruby": ["生徒《せいと》", "先生《せんせい》", "校長《こうちょう》", "保護者《ほごしゃ》"], "explanation_ruby": "study(勉強《べんきょう》する)+ -ent。teacher(先生《せんせい》)の対《つい》。", "body_kana": "わたしのかようちゅうがっこうには、1年生から3年生まであわせてやく500人の<student>がざいせきしている。"}, {"word": "study", "meaning_jp": "勉強する", "pos": "動", "body": "テストの1週間前から、毎日3時間ずつ机に向かって、教科書と問題集を開いて<study>している。知識を身につけるための活動だ。", "choices": ["勉強する", "遊ぶ", "眠る", "走る"], "correct_index": 0, "explanation": "studio(スタジオ)と同じ語源。", "id": "s1_326", "body_ruby": "テストの1週間《しゅうかん》前《ぜん》から、毎日《まいにち》3時間《じかん》ずつ机《つくえ》に向《む》かって、教科書《きょうかしょ》と問題集《もんだいしゅう》を開《ひら》いて<study>している。知識《ちしき》を身《み》につけるための活動《かつどう》だ。", "choices_ruby": ["勉強《べんきょう》する", "遊《あそ》ぶ", "眠《ねむ》る", "走《はし》る"], "explanation_ruby": "studio(スタジオ)と同《おな》じ語源《ごげん》。", "body_kana": "テストの1週間ぜんから、まいにち3時間ずつつくえにむかって、きょうかしょともんだいしゅうをひらいて<study>している。ちしきをみにつけるためのかつどうだ。"}, {"word": "subject", "meaning_jp": "教科、科目", "pos": "名", "body": "中学では、国語・数学・英語・理科・社会など、9つもの<subject>を週に何時間かずつ勉強する。", "choices": ["教科", "教室", "クラス", "学校"], "correct_index": 0, "explanation": "「主題」「主語」の意味もある多義語。", "id": "s1_327", "body_ruby": "中学《ちゅうがく》では、国語《こくご》・数学《すうがく》・英語《えいご》・理科《りか》・社会《しゃかい》など、9つもの<subject>を週《しゅう》に何時間《なんじかん》かずつ勉強《べんきょう》する。", "choices_ruby": ["教科《きょうか》", "教室《きょうしつ》", "クラス", "学校《がっこう》"], "explanation_ruby": "「主題《しゅだい》」「主語《しゅご》」の意味《いみ》もある多義《たぎ》語《ご》。", "body_kana": "ちゅうがくでは、こくご・すうがく・えいご・りか・しゃかいなど、9つもの<subject>をしゅうになんじかんかずつべんきょうする。"}, {"word": "summer", "meaning_jp": "夏", "pos": "名", "body": "<summer>は1年で一番暑い季節で、海水浴やかき氷、花火大会など楽しいイベントがたくさんあり、学校は長い休みになる。", "choices": ["夏", "春", "秋", "冬"], "correct_index": 0, "explanation": "summer vacation = 夏休み。", "id": "s1_328", "body_ruby": "<summer>は1年《ねん》で一番《いちばん》暑《あつ》い季節《きせつ》で、海水浴《かいすいよく》やかき氷《こおり》、花火大会《はなびたいかい》など楽《たの》しいイベントがたくさんあり、学校《がっこう》は長《なが》い休《やす》みになる。", "choices_ruby": ["夏《なつ》", "春《はる》", "秋《あき》", "冬《ふゆ》"], "explanation_ruby": "summer vacation = 夏休《なつやす》み。", "body_kana": "<summer>は1年でいちばんあついきせつで、かいすいよくやかきこおり、はなびたいかいなどたのしいイベントがたくさんあり、がっこうはながいやすみになる。"}, {"word": "Sunday", "meaning_jp": "日曜日", "pos": "名", "body": "週末の<Sunday>は学校が休みなので、午前中はゆっくり寝て、午後は家族で買い物に出かけることが多い。", "choices": ["日曜日", "月曜日", "土曜日", "金曜日"], "correct_index": 0, "explanation": "sun(太陽)+ day。土曜の翌日。", "id": "s1_329", "body_ruby": "週末《しゅうまつ》の<Sunday>は学校《がっこう》が休《やす》みなので、午前中《ごぜんちゅう》はゆっくり寝《ね》て、午後《ごご》は家族《かぞく》で｜買い物《かいもの》に出《で》かけることが多《おお》い。", "choices_ruby": ["日曜日《にちようび》", "月曜日《げつようび》", "土曜日《どようび》", "金曜日《きんようび》"], "explanation_ruby": "sun(太陽《たいよう》)+ day。土曜《どよう》の翌日《よくじつ》。", "body_kana": "しゅうまつの<Sunday>はがっこうがやすみなので、ごぜんちゅうはゆっくりねて、ごごはかぞくでかいものにでかけることがおおい。"}, {"word": "sure", "meaning_jp": "確信して", "pos": "形", "body": "彼は地図を見ずに道案内をしてくれて、「この道で<sure>合っている」と自信を持って言い切った。", "choices": ["確信して", "迷って", "知らない", "驚いて"], "correct_index": 0, "explanation": "I'm sure. = 確信しています。Sure! = もちろん!", "id": "s1_330", "body_ruby": "彼《かれ》は地図《ちず》を見《み》ずに道案内《みちあんない》をしてくれて、「この道《みち》で<sure>合《あ》っている」と自信《じしん》を持《も》って｜言い切《いいき》った。", "choices_ruby": ["確信《かくしん》して", "迷《まよ》って", "知《し》らない", "驚《おどろ》いて"], "explanation_ruby": "I'm sure. = 確信《かくしん》しています。Sure! = もちろん!", "body_kana": "かれはちずをみずにみちあんないをしてくれて、「このみちで<sure>あっている」とじしんをもっていいきった。"}, {"word": "swam", "meaning_jp": "泳いだ", "pos": "動", "body": "夏休みに家族で海に行って、青く透き通った海の中で、1時間ほど魚を見ながら<swam>した。", "choices": ["泳いだ", "潜った", "歩いた", "走った"], "correct_index": 0, "explanation": "swim の過去形。swim-swam-swum。", "id": "s1_331", "body_ruby": "夏休《なつやす》みに家族《かぞく》で海《うみ》に行《い》って、青《あお》く透《す》き通《とお》った海《うみ》の中《なか》で、1時間《じかん》ほど魚《さかな》を見《み》ながら<swam>した。", "choices_ruby": ["泳《およ》いだ", "潜《もぐ》った", "歩《ある》いた", "走《はし》った"], "explanation_ruby": "swim の過去形《かこけい》。swim-swam-swum。", "body_kana": "なつやすみにかぞくでうみにいって、あおくすきとおったうみのなかで、1時間ほどさかなをみながら<swam>した。"}, {"word": "swim", "meaning_jp": "泳ぐ", "pos": "動", "body": "夏の体育の時間に、学校の25メートルプールでクロールを使って、息継ぎをしながら<swim>する練習をした。", "choices": ["泳ぐ", "走る", "歩く", "飛ぶ"], "correct_index": 0, "explanation": "swim-swam-swum。swimmer = 水泳選手。", "id": "s1_332", "body_ruby": "夏《なつ》の体育《たいいく》の時間《じかん》に、学校《がっこう》の25メートルプールでクロールを使《つか》って、息継《いきつ》ぎをしながら<swim>する練習《れんしゅう》をした。", "choices_ruby": ["泳《およ》ぐ", "走《はし》る", "歩《ある》く", "飛《と》ぶ"], "explanation_ruby": "swim-swam-swum。swimmer = 水泳《すいえい》選手《せんしゅ》。", "body_kana": "なつのたいいくのじかんに、がっこうの25メートルプールでクロールをつかって、いきつぎをしながら<swim>するれんしゅうをした。"}, {"word": "Sydney", "meaning_jp": "シドニー", "pos": "名", "body": "オーストラリアの東海岸にある<Sydney>は、貝殻のような形のオペラハウスで有名な、人口500万人の大都市だ。", "choices": ["シドニー", "メルボルン", "ロンドン", "ニューヨーク"], "correct_index": 0, "explanation": "首都ではないがオーストラリア最大の都市。", "id": "s1_333", "body_ruby": "オーストラリアの東海岸《ひがしかいがん》にある<Sydney>は、貝殻《かいがら》のような形《かたち》のオペラハウスで有名《ゆうめい》な、人口《じんこう》500万人《まんにん》の大都市《だいとし》だ。", "choices_ruby": ["シドニー", "メルボルン", "ロンドン", "ニューヨーク"], "explanation_ruby": "首都《しゅと》ではないがオーストラリア最大《さいだい》の都市《とし》。", "body_kana": "オーストラリアのひがしかいがんにある<Sydney>は、かいがらのようなかたちのオペラハウスでゆうめいな、じんこう500まんにんのだいとしだ。"}, {"word": "table", "meaning_jp": "テーブル、机", "pos": "名", "body": "毎日家族そろって、ダイニングルームの大きな木の<table>を囲んで夕食を食べる。", "choices": ["テーブル", "椅子", "ベッド", "棚"], "correct_index": 0, "explanation": "kitchen table(食卓)、desk(個人用の机)とは少し違う。", "id": "s1_334", "body_ruby": "毎日《まいにち》家族《かぞく》そろって、ダイニングルームの大《おお》きな木《き》の<table>を囲《かこ》んで夕食《ゆうしょく》を食《た》べる。", "choices_ruby": ["テーブル", "椅子《いす》", "ベッド", "棚《たな》"], "explanation_ruby": "kitchen table(食卓《しょくたく》)、desk(個人用《こじんよう》の机《つくえ》)とは少《すこ》し違《ちが》う。", "body_kana": "まいにちかぞくそろって、ダイニングルームのおおきなきの<table>をかこんでゆうしょくをたべる。"}, {"word": "talk", "meaning_jp": "話す", "pos": "動", "body": "学校が終わってから友達と帰り道で、今日見たテレビ番組について楽しく<talk>しながら歩いた。", "choices": ["話す", "聞く", "走る", "書く"], "correct_index": 0, "explanation": "speak と似ているが、より会話的。", "id": "s1_335", "body_ruby": "学校《がっこう》が終《お》わってから友達《ともだち》と｜帰り道《かえりみち》で、今日《きょう》見《み》たテレビ番組《ばんぐみ》について楽《たの》しく<talk>しながら歩《ある》いた。", "choices_ruby": ["話《はな》す", "聞《き》く", "走《はし》る", "書《か》く"], "explanation_ruby": "speak と似《に》ているが、より会話的《かいわてき》。", "body_kana": "がっこうがおわってからともだちとかえりみちで、きょうみたテレビばんぐみについてたのしく<talk>しながらあるいた。"}, {"word": "taxi", "meaning_jp": "タクシー", "pos": "名", "body": "重い荷物を持って駅から家まで歩くのが大変なので、駅前の乗り場から黄色い<taxi>に乗って帰った。お金を払って乗る車だ。", "choices": ["タクシー", "バス", "電車", "自転車"], "correct_index": 0, "explanation": "cab とも言う。料金メーター制。", "id": "s1_336", "body_ruby": "重《おも》い荷物《にもつ》を持《も》って駅《えき》から家《いえ》まで歩《ある》くのが大変《たいへん》なので、駅前《えきまえ》の｜乗り場《のりば》から黄色《きいろ》い<taxi>に乗《の》って帰《かえ》った。お金《かね》を払《はら》って乗《の》る車《くるま》だ。", "choices_ruby": ["タクシー", "バス", "電車《でんしゃ》", "自転車《じてんしゃ》"], "explanation_ruby": "cab とも言《い》う。料金《りょうきん》メーター制《せい》。", "body_kana": "おもいにもつをもってえきからいえまであるくのがたいへんなので、えきまえののりばからきいろい<taxi>にのってかえった。おかねをはらってのるくるまだ。"}, {"word": "teach", "meaning_jp": "教える", "pos": "動", "body": "先生は毎日、私たちに英語の文法や読み方を、黒板と教科書を使って丁寧に<teach>してくれる。", "choices": ["教える", "学ぶ", "聞く", "話す"], "correct_index": 0, "explanation": "teach-taught-taught。learn の対。", "id": "s1_337", "body_ruby": "先生《せんせい》は毎日《まいにち》、私《わたし》たちに英語《えいご》の文法《ぶんぽう》や｜読み方《よみかた》を、黒板《こくばん》と教科書《きょうかしょ》を使《つか》って丁寧《ていねい》に<teach>してくれる。", "choices_ruby": ["教《おし》える", "学《まな》ぶ", "聞《き》く", "話《はな》す"], "explanation_ruby": "teach-taught-taught。learn の対《つい》。", "body_kana": "せんせいはまいにち、わたしたちにえいごのぶんぽうやよみかたを、こくばんときょうかしょをつかってていねいに<teach>してくれる。"}, {"word": "teacher", "meaning_jp": "先生", "pos": "名", "body": "私の英語の<teacher>は20年のキャリアがあるベテランで、難しい文法も例文を使って分かりやすく説明してくれる。学校で教える人だ。", "choices": ["先生", "生徒", "校長", "親"], "correct_index": 0, "explanation": "teach + -er。student(生徒)の対。", "id": "s1_338", "body_ruby": "私《わたし》の英語《えいご》の<teacher>は20年《ねん》のキャリアがあるベテランで、難《むずか》しい文法《ぶんぽう》も例文《れいぶん》を使《つか》って分《わ》かりやすく説明《せつめい》してくれる。学校《がっこう》で教《おし》える人《ひと》だ。", "choices_ruby": ["先生《せんせい》", "生徒《せいと》", "校長《こうちょう》", "親《おや》"], "explanation_ruby": "teach + -er。student(生徒《せいと》)の対《つい》。", "body_kana": "わたしのえいごの<teacher>は20年のキャリアがあるベテランで、むずかしいぶんぽうもれいぶんをつかってわかりやすくせつめいしてくれる。がっこうでおしえるひとだ。"}, {"word": "team", "meaning_jp": "チーム", "pos": "名", "body": "サッカーの試合は、それぞれ11人ずつの2つの<team>に分かれて、ボールを蹴り合って勝敗を競うスポーツだ。", "choices": ["チーム", "個人", "監督", "応援"], "correct_index": 0, "explanation": "team work(団結)、team mate(チームメイト)。", "id": "s1_339", "body_ruby": "サッカーの試合《しあい》は、それぞれ11人《にん》ずつの2つの<team>に分《わ》かれて、ボールを蹴《け》り合《あ》って勝敗《しょうはい》を競《きそ》うスポーツだ。", "choices_ruby": ["チーム", "個人《こじん》", "監督《かんとく》", "応援《おうえん》"], "explanation_ruby": "team work(団結《だんけつ》)、team mate(チームメイト)。", "body_kana": "サッカーのしあいは、それぞれ11人ずつの2つの<team>にわかれて、ボールをけりあってしょうはいをきそうスポーツだ。"}, {"word": "teeth", "meaning_jp": "歯(複数)", "pos": "名", "body": "毎晩寝る前に、上下28本の<teeth>を歯ブラシで3分かけて丁寧に磨いている。虫歯になりたくないからだ。", "choices": ["歯", "舌", "唇", "頬"], "correct_index": 0, "explanation": "tooth(歯)の複数形。tooth-teeth の不規則変化。", "id": "s1_340", "body_ruby": "毎晩《まいばん》寝《ね》る前《まえ》に、上下《じょうげ》28本《ほん》の<teeth>を歯《は》ブラシで3分《ふん》かけて丁寧《ていねい》に磨《みが》いている。虫歯《むしば》になりたくないからだ。", "choices_ruby": ["歯《は》", "舌《した》", "唇《くちびる》", "頬《ほお》"], "explanation_ruby": "tooth(歯《は》)の複数形《ふくすうけい》。tooth-teeth の不規則《ふきそく》変化《へんか》。", "body_kana": "まいばんねるまえに、じょうげ28本の<teeth>をはブラシで3分かけてていねいにみがいている。むしばになりたくないからだ。"}, {"word": "tell", "meaning_jp": "言う、伝える", "pos": "動", "body": "今日学校であった嬉しい出来事を、家に帰ってから真っ先に母に<tell>した。", "choices": ["伝える", "隠す", "聞く", "読む"], "correct_index": 0, "explanation": "tell-told-told。say は内容、tell は相手も意識。", "id": "s1_341", "body_ruby": "今日《きょう》学校《がっこう》であった嬉《うれ》しい出来事《できごと》を、家《いえ》に帰《かえ》ってから｜真っ先《まっさき》に母《はは》に<tell>した。", "choices_ruby": ["伝《つた》える", "隠《かく》す", "聞《き》く", "読《よ》む"], "explanation_ruby": "tell-told-told。say は内容《ないよう》、tell は相手《あいて》も意識《いしき》。", "body_kana": "きょうがっこうであったうれしいできごとを、いえにかえってからまっさきにははに<tell>した。"}, {"word": "ten", "meaning_jp": "10", "pos": "名/形", "body": "両手の指を全部広げると<ten>本になる。私が数を覚えた頃、まずこの数まで指で数えることから始めた。", "choices": ["10", "9", "11", "100"], "correct_index": 0, "explanation": "10進法の基準。", "id": "s1_342", "body_ruby": "両手《りょうて》の指《ゆび》を全部《ぜんぶ》広《ひろ》げると<ten>本《ほん》になる。私《わたし》が数《かず》を覚《おぼ》えた頃《ごろ》、まずこの数《かず》まで指《ゆび》で数《かぞ》えることから始《はじ》めた。", "choices_ruby": ["10", "9", "11", "100"], "explanation_ruby": "10進法《しんほう》の基準《きじゅん》。", "body_kana": "りょうてのゆびをぜんぶひろげると<ten>ほんになる。わたしがかずをおぼえたごろ、まずこのかずまでゆびでかぞえることからはじめた。"}, {"word": "tennis", "meaning_jp": "テニス", "pos": "名", "body": "彼女は中学校の<tennis>部に入っていて、放課後にラケットでボールを打ち合う練習を毎日2時間している球技だ。", "choices": ["テニス", "サッカー", "野球", "バスケ"], "correct_index": 0, "explanation": "ラケット使用の球技。", "id": "s1_343", "body_ruby": "彼女《かのじょ》は中学校《ちゅうがっこう》の<tennis>部《ぶ》に入《はい》っていて、放課後《ほうかご》にラケットでボールを打《う》ち合《あ》う練習《れんしゅう》を毎日《まいにち》2時間《じかん》している球技《きゅうぎ》だ。", "choices_ruby": ["テニス", "サッカー", "野球《やきゅう》", "バスケ"], "explanation_ruby": "ラケット使用《しよう》の球技《きゅうぎ》。", "body_kana": "かのじょはちゅうがっこうの<tennis>ぶにはいっていて、ほうかごにラケットでボールをうちあうれんしゅうをまいにち2時間しているきゅうぎだ。"}, {"word": "tenth", "meaning_jp": "10番目", "pos": "名/形", "body": "彼は学校のマラソン大会で、100人の生徒の中で<tenth>でゴールした。彼より速かったのは9人だけだった。", "choices": ["10番目", "1番目", "9番目", "100番目"], "correct_index": 0, "explanation": "ten + -th。", "id": "s1_344", "body_ruby": "彼《かれ》は学校《がっこう》のマラソン大会《たいかい》で、100人《にん》の生徒《せいと》の中《なか》で<tenth>でゴールした。彼《かれ》より速《はや》かったのは9人《にん》だけだった。", "choices_ruby": ["10番目《ばんめ》", "1番目《ばんめ》", "9番目《ばんめ》", "100番目《ばんめ》"], "explanation_ruby": "ten + -th。", "body_kana": "かれはがっこうのマラソンたいかいで、100人のせいとのなかで<tenth>でゴールした。かれよりはやかったのは9人だけだった。"}, {"word": "terrible", "meaning_jp": "ひどい", "pos": "形", "body": "今日の朝は、目覚まし時計が鳴らず、雨は降り、傘も忘れて、本当に<terrible>な1日のスタートだった。", "choices": ["ひどい", "素晴らしい", "普通の", "楽しい"], "correct_index": 0, "explanation": "great / wonderful の対。", "id": "s1_345", "body_ruby": "今日《きょう》の朝《あさ》は、目覚《めざ》まし時計《とけい》が鳴《な》らず、雨《あめ》は降《お》り、傘《かさ》も忘《わす》れて、本当《ほんとう》に<terrible>な1日《にち》のスタートだった。", "choices_ruby": ["ひどい", "素晴《すば》らしい", "普通《ふつう》の", "楽《たの》しい"], "explanation_ruby": "great / wonderful の対《つい》。", "body_kana": "きょうのあさは、めざましとけいがならず、あめはおり、かさもわすれて、ほんとうに<terrible>な1日のスタートだった。"}, {"word": "thank", "meaning_jp": "感謝する", "pos": "動", "body": "友達が消しゴムを貸してくれたので、「本当にありがとう」と笑顔で<thank>した。", "choices": ["感謝する", "怒る", "謝る", "断る"], "correct_index": 0, "explanation": "Thank you! = ありがとう!", "id": "s1_346", "body_ruby": "友達《ともだち》が消《け》しゴムを貸《か》してくれたので、「本当《ほんとう》にありがとう」と笑顔《えがお》で<thank>した。", "choices_ruby": ["感謝《かんしゃ》する", "怒《いか》る", "謝《あやま》る", "断《ことわ》る"], "explanation_ruby": "Thank you! = ありがとう!", "body_kana": "ともだちがけしゴムをかしてくれたので、「ほんとうにありがとう」とえがおで<thank>した。"}, {"word": "think", "meaning_jp": "考える、思う", "pos": "動", "body": "難しい数学の問題が出たので、頭の中でいろいろな解き方を5分間じっくり<think>した。", "choices": ["考える", "話す", "見る", "聞く"], "correct_index": 0, "explanation": "think-thought-thought の不規則動詞。", "id": "s1_347", "body_ruby": "難《むずか》しい数学《すうがく》の問題《もんだい》が出《で》たので、頭《あたま》の中《なか》でいろいろな解《と》き方《ほう》を5分間《ふんかん》じっくり<think>した。", "choices_ruby": ["考《かんが》える", "話《はな》す", "見《み》る", "聞《き》く"], "explanation_ruby": "think-thought-thought の不規則《ふきそく》動詞《どうし》。", "body_kana": "むずかしいすうがくのもんだいがでたので、あたまのなかでいろいろなときほうを5分間じっくり<think>した。"}, {"word": "thirteen", "meaning_jp": "13", "pos": "名/形", "body": "中学1年生は4月生まれの場合、誕生日を迎えると<thirteen>歳になる。子どもから少しずつ大人へ向かう年齢だ。", "choices": ["13", "30", "3", "33"], "correct_index": 0, "explanation": "three + teen。", "id": "s1_348", "body_ruby": "中学《ちゅうがく》1年生《ねんせい》は4月《がつ》生《う》まれの場合《ばあい》、誕生日《たんじょうび》を迎《むか》えると<thirteen>歳《さい》になる。子《こ》どもから少《すこ》しずつ大人《おとな》へ向《む》かう年齢《ねんれい》だ。", "choices_ruby": ["13", "30", "3", "33"], "explanation_ruby": "three + teen。", "body_kana": "ちゅうがく1年生は4月うまれのばあい、たんじょうびをむかえると<thirteen>さいになる。こどもからすこしずつおとなへむかうねんれいだ。"}, {"word": "thirteenth", "meaning_jp": "13番目", "pos": "名/形", "body": "今日は12月の<thirteenth>で、あと12日でクリスマスがやってくる。家族はそろそろツリーを出し始めた。", "choices": ["13番目", "30番目", "3番目", "23番目"], "correct_index": 0, "explanation": "thirteen + -th。", "id": "s1_349", "body_ruby": "今日《きょう》は12月《がつ》の<thirteenth>で、あと12日《にち》でクリスマスがやってくる。家族《かぞく》はそろそろツリーを出《だ》し始《はじ》めた。", "choices_ruby": ["13番目《ばんめ》", "30番目《ばんめ》", "3番目《ばんめ》", "23番目《ばんめ》"], "explanation_ruby": "thirteen + -th。", "body_kana": "きょうは12月の<thirteenth>で、あと12日でクリスマスがやってくる。かぞくはそろそろツリーをだしはじめた。"}, {"word": "thirtieth", "meaning_jp": "30番目", "pos": "名/形", "body": "母の<thirtieth>の誕生日に、家族で大きなケーキを焼いて、30本のロウソクを立ててお祝いした。", "choices": ["30番目", "13番目", "3番目", "300番目"], "correct_index": 0, "explanation": "thirty + -eth。", "id": "s1_350", "body_ruby": "母《はは》の<thirtieth>の誕生日《たんじょうび》に、家族《かぞく》で大《おお》きなケーキを焼《や》いて、30本《ほん》のロウソクを立《た》ててお祝《いわ》いした。", "choices_ruby": ["30番目《ばんめ》", "13番目《ばんめ》", "3番目《ばんめ》", "300番目《ばんめ》"], "explanation_ruby": "thirty + -eth。", "body_kana": "ははの<thirtieth>のたんじょうびに、かぞくでおおきなケーキをやいて、30本のロウソクをたてておいわいした。"}, {"word": "thirty", "meaning_jp": "30", "pos": "名/形", "body": "私のクラスには男子15人と女子15人、合わせて<thirty>人が在籍している。20を超えてもう少しで1ヶ月の日数に届く人数だ。", "choices": ["30", "13", "3", "33"], "correct_index": 0, "explanation": "three + -ty。20の次の十の位。", "id": "s1_351", "body_ruby": "私《わたし》のクラスには男子《だんし》15人《にん》と女子《じょし》15人《にん》、合《あ》わせて<thirty>人《にん》が在籍《ざいせき》している。20を超《こ》えてもう少《すこ》しで1ヶ月《かげつ》の日《ひ》数《かず》に届《とど》く人数《にんずう》だ。", "choices_ruby": ["30", "13", "3", "33"], "explanation_ruby": "three + -ty。20の次《つぎ》の十《じゅう》の位《くらい》。", "body_kana": "わたしのクラスにはだんし15人とじょし15人、あわせて<thirty>にんがざいせきしている。20をこえてもうすこしで1ヶ月のひかずにとどくにんずうだ。"}, {"word": "three", "meaning_jp": "3", "pos": "名/形", "body": "信号の色は赤・青・黄の<three>色で、私たちの行動を案内している。", "choices": ["3", "2", "4", "5"], "correct_index": 0, "explanation": "数字の3。two(2)と four(4)の間。", "id": "s1_352", "body_ruby": "信号《しんごう》の色《いろ》は赤《あか》・青《あお》・黄《き》の<three>色《いろ》で、私《わたし》たちの行動《こうどう》を案内《あんない》している。", "choices_ruby": ["3", "2", "4", "5"], "explanation_ruby": "数字《すうじ》の3。two(2)と four(4)の間《あいだ》。", "body_kana": "しんごうのいろはあか・あお・きの<three>いろで、わたしたちのこうどうをあんないしている。"}, {"word": "throw", "meaning_jp": "投げる", "pos": "動", "body": "ピッチャーは50メートル離れたキャッチャーに向けて、白いボールを思い切り<throw>した。", "choices": ["投げる", "受ける", "蹴る", "打つ"], "correct_index": 0, "explanation": "throw-threw-thrown。catch(捕る)の対。", "id": "s1_353", "body_ruby": "ピッチャーは50メートル離《はな》れたキャッチャーに向《む》けて、白《しろ》いボールを｜思い切《おもいき》り<throw>した。", "choices_ruby": ["投《な》げる", "受《う》ける", "蹴《け》る", "打《う》つ"], "explanation_ruby": "throw-threw-thrown。catch(捕《と》る)の対《つい》。", "body_kana": "ピッチャーは50メートルはなれたキャッチャーにむけて、しろいボールをおもいきり<throw>した。"}, {"word": "Thursday", "meaning_jp": "木曜日", "pos": "名", "body": "1週間の真ん中を過ぎた<Thursday>になると、週末まであと2日と感じて、気持ちが少しずつ軽くなる。", "choices": ["木曜日", "水曜日", "金曜日", "土曜日"], "correct_index": 0, "explanation": "北欧神話の雷神 Thor の日。", "id": "s1_354", "body_ruby": "1週間《しゅうかん》の｜真ん中《まんなか》を過《す》ぎた<Thursday>になると、週末《しゅうまつ》まであと2日《にち》と感《かん》じて、気持《きも》ちが少《すこ》しずつ軽《かる》くなる。", "choices_ruby": ["木曜日《もくようび》", "水曜日《すいようび》", "金曜日《きんようび》", "土曜日《どようび》"], "explanation_ruby": "北欧神話《ほくおうしんわ》の雷神《らいじん》 Thor の日《ひ》。", "body_kana": "1週間のまんなかをすぎた<Thursday>になると、しゅうまつまであと2日とかんじて、きもちがすこしずつかるくなる。"}, {"word": "time", "meaning_jp": "時間", "pos": "名", "body": "朝家を出る前に時計を見ると、いつもより5分早い<time>だったので、ゆっくり朝食を食べてからゆとりを持って学校に向かった。", "choices": ["時間", "場所", "理由", "人物"], "correct_index": 0, "explanation": "What time? = 何時? on time = 時間通りに。", "id": "s1_355", "body_ruby": "朝《あさ》家《いえ》を出《で》る前《まえ》に時計《とけい》を見《み》ると、いつもより5分《ふん》早《はや》い<time>だったので、ゆっくり朝食《ちょうしょく》を食《た》べてからゆとりを持《も》って学校《がっこう》に向《む》かった。", "choices_ruby": ["時間《じかん》", "場所《ばしょ》", "理由《りゆう》", "人物《じんぶつ》"], "explanation_ruby": "What time? = 何時《なんじ》? on time = 時間《じかん》通《とお》りに。", "body_kana": "あさいえをでるまえにとけいをみると、いつもより5分はやい<time>だったので、ゆっくりちょうしょくをたべてからゆとりをもってがっこうにむかった。"}, {"word": "tired", "meaning_jp": "疲れた", "pos": "形", "body": "サッカーの試合で2時間ぶっ通しで走り回ったので、家に帰る頃にはくたくたに<tired>になっていた。", "choices": ["疲れた", "元気な", "嬉しい", "悲しい"], "correct_index": 0, "explanation": "tire(疲れさせる)の過去分詞。", "id": "s1_356", "body_ruby": "サッカーの試合《しあい》で2時間《じかん》ぶっ通《とお》しで走《はし》り回《まわ》ったので、家《いえ》に帰《かえ》る頃《ごろ》にはくたくたに<tired>になっていた。", "choices_ruby": ["疲《つか》れた", "元気《げんき》な", "嬉《うれ》しい", "悲《かな》しい"], "explanation_ruby": "tire(疲《つか》れさせる)の過去分詞《かこぶんし》。", "body_kana": "サッカーのしあいで2時間ぶっとおしではしりまわったので、いえにかえるごろにはくたくたに<tired>になっていた。"}, {"word": "today", "meaning_jp": "今日", "pos": "副/名", "body": "昨日は雨だったが、<today>は朝から晴れて、運動会が予定通りに行われる絶好の日になった。", "choices": ["今日", "明日", "昨日", "明後日"], "correct_index": 0, "explanation": "yesterday(昨日)と tomorrow(明日)の中間。", "id": "s1_357", "body_ruby": "昨日《きのう》は雨《あめ》だったが、<today>は朝《あさ》から晴《は》れて、運動会《うんどうかい》が予定《よてい》通《とお》りに行《おこな》われる絶好《ぜっこう》の日《ひ》になった。", "choices_ruby": ["今日《きょう》", "明日《あした》", "昨日《きのう》", "明後日《あさって》"], "explanation_ruby": "yesterday(昨日《きのう》)と tomorrow(明日《あした》)の中間《ちゅうかん》。", "body_kana": "きのうはあめだったが、<today>はあさからはれて、うんどうかいがよていとおりにおこなわれるぜっこうのひになった。"}, {"word": "tomorrow", "meaning_jp": "明日", "pos": "副/名", "body": "今日は1月1日のお正月、<tomorrow>は1月2日になり、新年のお年玉をもらいに祖父母の家を訪ねる予定だ。", "choices": ["明日", "昨日", "今日", "来週"], "correct_index": 0, "explanation": "tomorrow morning = 明日の朝。", "id": "s1_358", "body_ruby": "今日《きょう》は1月《がつ》1日《にち》のお正月《しょうがつ》、<tomorrow>は1月《がつ》2日《にち》になり、新年《しんねん》のお年玉《としだま》をもらいに祖父母《そふぼ》の家《いえ》を訪《たず》ねる予定《よてい》だ。", "choices_ruby": ["明日《あした》", "昨日《きのう》", "今日《きょう》", "来週《らいしゅう》"], "explanation_ruby": "tomorrow morning = 明日《あした》の朝《あさ》。", "body_kana": "きょうは1月1日のおしょうがつ、<tomorrow>は1月2日になり、しんねんのおとしだまをもらいにそふぼのいえをたずねるよていだ。"}, {"word": "tooth", "meaning_jp": "歯", "pos": "名", "body": "硬いリンゴを噛んだ時、奥の<tooth>が突然グラついて、舌で触るとぐらぐら動くのが分かった。", "choices": ["歯", "舌", "頬", "唇"], "correct_index": 0, "explanation": "複数形は teeth。toothbrush(歯ブラシ)。", "id": "s1_359", "body_ruby": "硬《かた》いリンゴを噛《か》んだ時《とき》、奥《おく》の<tooth>が突然《とつぜん》グラついて、舌《した》で触《さわ》るとぐらぐら動《うご》くのが分《わ》かった。", "choices_ruby": ["歯《は》", "舌《した》", "頬《ほお》", "唇《くちびる》"], "explanation_ruby": "複数形《ふくすうけい》は teeth。toothbrush(歯《は》ブラシ)。", "body_kana": "かたいリンゴをかんだとき、おくの<tooth>がとつぜんグラついて、したでさわるとぐらぐらうごくのがわかった。"}, {"word": "town", "meaning_jp": "町", "pos": "名", "body": "私の住んでいる<town>は人口5万人で、駅前には商店街と病院があり、子供から大人まで楽しく暮らせる規模の都市だ。", "choices": ["町", "村", "都市", "国"], "correct_index": 0, "explanation": "city(大都市)より小さい。village(村)より大きい。", "id": "s1_360", "body_ruby": "私《わたし》の住《す》んでいる<town>は人口《じんこう》5万人《まんにん》で、駅前《えきまえ》には商店街《しょうてんがい》と病院《びょういん》があり、子供《こども》から大人《おとな》まで楽《たの》しく暮《く》らせる規模《きぼ》の都市《とし》だ。", "choices_ruby": ["町《まち》", "村《むら》", "都市《とし》", "国《くに》"], "explanation_ruby": "city(大都市《だいとし》)より小《ちい》さい。village(村《むら》)より大《おお》きい。", "body_kana": "わたしのすんでいる<town>はじんこう5まんにんで、えきまえにはしょうてんがいとびょういんがあり、こどもからおとなまでたのしくくらせるきぼのとしだ。"}, {"word": "train", "meaning_jp": "電車", "pos": "名", "body": "毎朝7時20分発の<train>に乗って、20分かけて2駅先の学校の最寄り駅まで通学している。線路の上を走る乗り物だ。", "choices": ["電車", "車", "バス", "船"], "correct_index": 0, "explanation": "「訓練する」の動詞の意味もある(train players)。", "id": "s1_361", "body_ruby": "毎朝《まいあさ》7時《じ》20分《ふん》発《はつ》の<train>に乗《の》って、20分《ふん》かけて2駅《えき》先《さき》の学校《がっこう》の最寄《もよ》り駅《えき》まで通学《つうがく》している。線路《せんろ》の上《うえ》を走《はし》る｜乗り物《のりもの》だ。", "choices_ruby": ["電車《でんしゃ》", "車《くるま》", "バス", "船《ふね》"], "explanation_ruby": "「訓練《くんれん》する」の動詞《どうし》の意味《いみ》もある(train players)。", "body_kana": "まいあさ7時20分はつの<train>にのって、20分かけて2えきさきのがっこうのもよりえきまでつうがくしている。せんろのうえをはしるのりものだ。"}, {"word": "tree", "meaning_jp": "木", "pos": "名", "body": "公園の入口には、樹齢100年を超える大きな桜の<tree>が1本立っていて、春には何千もの花を咲かせる。地面から太い幹が伸びる植物だ。", "choices": ["木", "草", "花", "葉"], "correct_index": 0, "explanation": "Christmas tree(クリスマスツリー)。", "id": "s1_362", "body_ruby": "公園《こうえん》の入口《いりぐち》には、樹齢《じゅれい》100年《ねん》を超《こ》える大《おお》きな桜《さくら》の<tree>が1本《ほん》立《た》っていて、春《はる》には何千《なんぜん》もの花《はな》を咲《さ》かせる。地面《じめん》から太《ふと》い幹《かん》が伸《の》びる植物《しょくぶつ》だ。", "choices_ruby": ["木《き》", "草《くさ》", "花《はな》", "葉《は》"], "explanation_ruby": "Christmas tree(クリスマスツリー)。", "body_kana": "こうえんのいりぐちには、じゅれい100年をこえるおおきなさくらの<tree>が1本たっていて、はるにはなんぜんものはなをさかせる。じめんからふといかんがのびるしょくぶつだ。"}, {"word": "trip", "meaning_jp": "旅行", "pos": "名", "body": "夏休みに家族で京都へ3泊4日の<trip>に行き、お寺や神社を巡って観光を楽しんだ。", "choices": ["旅行", "散歩", "通勤", "練習"], "correct_index": 0, "explanation": "trip < journey < travel(旅の規模順)。", "id": "s1_363", "body_ruby": "夏休《なつやす》みに家族《かぞく》で京都《きょうと》へ3泊《はく》4日《にち》の<trip>に行《い》き、お寺《てら》や神社《じんじゃ》を巡《めぐ》って観光《かんこう》を楽《たの》しんだ。", "choices_ruby": ["旅行《りょこう》", "散歩《さんぽ》", "通勤《つうきん》", "練習《れんしゅう》"], "explanation_ruby": "trip < journey < travel(旅《たび》の規模《きぼ》順《じゅん》)。", "body_kana": "なつやすみにかぞくできょうとへ3はく4日の<trip>にいき、おてらやじんじゃをめぐってかんこうをたのしんだ。"}, {"word": "Tuesday", "meaning_jp": "火曜日", "pos": "名", "body": "月曜日の翌日の<Tuesday>は、まだ週末まで4日もあるので、朝起きるのが少しつらい。学校に行く2日目だ。", "choices": ["火曜日", "月曜日", "水曜日", "木曜日"], "correct_index": 0, "explanation": "北欧神話の戦の神 Tyr の日。", "id": "s1_364", "body_ruby": "月曜日《げつようび》の翌日《よくじつ》の<Tuesday>は、まだ週末《しゅうまつ》まで4日《にち》もあるので、朝起《あさお》きるのが少《すこ》しつらい。学校《がっこう》に行《い》く2日《にち》目《め》だ。", "choices_ruby": ["火曜日《かようび》", "月曜日《げつようび》", "水曜日《すいようび》", "木曜日《もくようび》"], "explanation_ruby": "北欧神話《ほくおうしんわ》の戦《せん》の神《かみ》 Tyr の日《ひ》。", "body_kana": "げつようびのよくじつの<Tuesday>は、まだしゅうまつまで4日もあるので、あさおきるのがすこしつらい。がっこうにいく2日めだ。"}, {"word": "tug-of-war", "meaning_jp": "綱引き", "pos": "名", "body": "運動会のクラス対抗の<tug-of-war>で、両クラスが太いロープの両端を引き合って勝負した。力比べの伝統的な競技だ。", "choices": ["綱引き", "玉入れ", "リレー", "騎馬戦"], "correct_index": 0, "explanation": "tug(引く)+ of + war(戦争)。", "id": "s1_365", "body_ruby": "運動会《うんどうかい》のクラス対抗《たいこう》の<tug-of-war>で、両《りょう》クラスが太《ふと》いロープの両端《りょうたん》を引《ひ》き合《あ》って勝負《しょうぶ》した。力《ちから》比《くら》べの伝統的《でんとうてき》な競技《きょうぎ》だ。", "choices_ruby": ["綱引《つなひき》き", "玉《たま》入《い》れ", "リレー", "騎馬戦《きばせん》"], "explanation_ruby": "tug(引《ひ》く)+ of + war(戦争《せんそう》)。", "body_kana": "うんどうかいのクラスたいこうの<tug-of-war>で、りょうクラスがふといロープのりょうたんをひきあってしょうぶした。ちからくらべのでんとうてきなきょうぎだ。"}, {"word": "TV", "meaning_jp": "テレビ", "pos": "名", "body": "夕食を食べながら、リビングの50インチの<TV>で家族と一緒にニュース番組を見るのが、毎日の習慣だ。番組を映す電子機器だ。", "choices": ["テレビ", "ラジオ", "電話", "コンピュータ"], "correct_index": 0, "explanation": "television の略。", "id": "s1_366", "body_ruby": "夕食《ゆうしょく》を食《た》べながら、リビングの50インチの<TV>で家族《かぞく》と一緒《いっしょ》にニュース番組《ばんぐみ》を見《み》るのが、毎日《まいにち》の習慣《しゅうかん》だ。番組《ばんぐみ》を映《うつ》す電子機器《でんしきき》だ。", "choices_ruby": ["テレビ", "ラジオ", "電話《でんわ》", "コンピュータ"], "explanation_ruby": "television の略《りゃく》。", "body_kana": "ゆうしょくをたべながら、リビングの50インチの<TV>でかぞくといっしょにニュースばんぐみをみるのが、まいにちのしゅうかんだ。ばんぐみをうつすでんしききだ。"}, {"word": "twelfth", "meaning_jp": "12番目", "pos": "名/形", "body": "彼は今日のテストで40人中<twelfth>の成績だった。彼より高い点を取った人が11人、低い人は28人もいた。", "choices": ["12番目", "20番目", "2番目", "21番目"], "correct_index": 0, "explanation": "twelve + -th(綴り変化に注意)。", "id": "s1_367", "body_ruby": "彼《かれ》は今日《きょう》のテストで40人《にん》中《なか》<twelfth>の成績《せいせき》だった。彼《かれ》より高《たか》い点《てん》を取《と》った人《ひと》が11人《にん》、低《ひく》い人《ひと》は28人《にん》もいた。", "choices_ruby": ["12番目《ばんめ》", "20番目《ばんめ》", "2番目《ばんめ》", "21番目《ばんめ》"], "explanation_ruby": "twelve + -th(綴《つづ》り変化《へんか》に注意《ちゅうい》)。", "body_kana": "かれはきょうのテストで40人なか<twelfth>のせいせきだった。かれよりたかいてんをとったひとが11人、ひくいひとは28人もいた。"}, {"word": "twelve", "meaning_jp": "12", "pos": "名/形", "body": "1年は1月から始まり12月で終わる、合計<twelve>つの月でできている。時計の文字盤にも書かれている数字だ。", "choices": ["12", "10", "20", "2"], "correct_index": 0, "explanation": "1ダース = 12個。a dozen も同じ。", "id": "s1_368", "body_ruby": "1年《ねん》は1月《がつ》から始《はじ》まり12月《がつ》で終《お》わる、合計《ごうけい》<twelve>つの月《がつ》でできている。時計《とけい》の文字盤《もじばん》にも書《か》かれている数字《すうじ》だ。", "choices_ruby": ["12", "10", "20", "2"], "explanation_ruby": "1ダース = 12個《こ》。a dozen も同《おな》じ。", "body_kana": "1年は1月からはじまり12月でおわる、ごうけい<twelve>つのがつでできている。とけいのもじばんにもかかれているすうじだ。"}, {"word": "twentieth", "meaning_jp": "20番目", "pos": "名/形", "body": "私の兄の<twentieth>の誕生日は来月で、家族で成人式のお祝いの会を開く予定だ。", "choices": ["20番目", "12番目", "2番目", "200番目"], "correct_index": 0, "explanation": "twenty + -eth。", "id": "s1_369", "body_ruby": "私《わたし》の兄《あに》の<twentieth>の誕生日《たんじょうび》は来月《らいげつ》で、家族《かぞく》で成人式《せいじんしき》のお祝《いわ》いの会《あ》を開《ひら》く予定《よてい》だ。", "choices_ruby": ["20番目《ばんめ》", "12番目《ばんめ》", "2番目《ばんめ》", "200番目《ばんめ》"], "explanation_ruby": "twenty + -eth。", "body_kana": "わたしのあにの<twentieth>のたんじょうびはらいげつで、かぞくでせいじんしきのおいわいのあをひらくよていだ。"}, {"word": "twenty", "meaning_jp": "20", "pos": "名/形", "body": "日本では<twenty>歳になると成人として扱われ、お酒を飲んだり、選挙で投票したりできるようになる。", "choices": ["20", "10", "12", "200"], "correct_index": 0, "explanation": "two + -ty。", "id": "s1_370", "body_ruby": "日本《にっぽん》では<twenty>歳《さい》になると成人《せいじん》として扱《あつか》われ、お酒《さけ》を飲《の》んだり、選挙《せんきょ》で投票《とうひょう》したりできるようになる。", "choices_ruby": ["20", "10", "12", "200"], "explanation_ruby": "two + -ty。", "body_kana": "にっぽんでは<twenty>さいになるとせいじんとしてあつかわれ、おさけをのんだり、せんきょでとうひょうしたりできるようになる。"}, {"word": "two", "meaning_jp": "2", "pos": "名/形", "body": "私には双子の弟が<two>人いて、顔も背の高さもそっくりで、お母さんですらたまに見分けがつかないほどだ。", "choices": ["2", "1", "3", "12"], "correct_index": 0, "explanation": "数字の2。w は発音しない(two = トゥー)。", "id": "s1_371", "body_ruby": "私《わたし》には双子《ふたご》の弟《おとうと》が<two>人《にん》いて、顔《かお》も背《せ》の高《たか》さもそっくりで、お母《かあ》さんですらたまに見分《みわ》けがつかないほどだ。", "choices_ruby": ["2", "1", "3", "12"], "explanation_ruby": "数字《すうじ》の2。w は発音《はつおん》しない(two = トゥー)。", "body_kana": "わたしにはふたごのおとうとが<two>にんいて、かおもせのたかさもそっくりで、おかあさんですらたまにみわけがつかないほどだ。"}, {"word": "uncle", "meaning_jp": "おじ", "pos": "名", "body": "父の弟である<uncle>は、お正月に毎年お年玉を5000円くれる優しい人だ。", "choices": ["おじ", "おば", "祖父", "兄"], "correct_index": 0, "explanation": "aunt(おば)の対。", "id": "s1_372", "body_ruby": "父《ちち》の弟《おとうと》である<uncle>は、お正月《しょうがつ》に毎年《まいとし》お年玉《としだま》を5000円《えん》くれる優《やさ》しい人《ひと》だ。", "choices_ruby": ["おじ", "おば", "祖父《そふ》", "兄《あに》"], "explanation_ruby": "aunt(おば)の対《つい》。", "body_kana": "ちちのおとうとである<uncle>は、おしょうがつにまいとしおとしだまを5000円くれるやさしいひとだ。"}, {"word": "USA", "meaning_jp": "アメリカ合衆国", "pos": "名", "body": "ハンバーガーやハリウッド映画で有名な<USA>は、北アメリカ大陸にある、50の州からなる人口3億人を超える大国だ。", "choices": ["アメリカ合衆国", "イギリス", "オーストラリア", "カナダ"], "correct_index": 0, "explanation": "United States of America の略。", "id": "s1_373", "body_ruby": "ハンバーガーやハリウッド映画《えいが》で有名《ゆうめい》な<USA>は、北《きた》アメリカ大陸《たいりく》にある、50の州《しゅう》からなる人口《じんこう》3億《おく》人《ひと》を超《こ》える大国《たいこく》だ。", "choices_ruby": ["アメリカ合衆国《がっしゅうこく》", "イギリス", "オーストラリア", "カナダ"], "explanation_ruby": "United States of America の略《りゃく》。", "body_kana": "ハンバーガーやハリウッドえいがでゆうめいな<USA>は、きたアメリカたいりくにある、50のしゅうからなるじんこう3おくひとをこえるたいこくだ。"}, {"word": "use", "meaning_jp": "使う", "pos": "動", "body": "宿題のレポートを書くために、机のパソコンとキーボードを<use>して、2時間かけて文章をまとめた。", "choices": ["使う", "壊す", "捨てる", "見る"], "correct_index": 0, "explanation": "useful(役に立つ)、used(中古の)。", "id": "s1_374", "body_ruby": "宿題《しゅくだい》のレポートを書《か》くために、机《つくえ》のパソコンとキーボードを<use>して、2時間《じかん》かけて文章《ぶんしょう》をまとめた。", "choices_ruby": ["使《つか》う", "壊《こわ》す", "捨《す》てる", "見《み》る"], "explanation_ruby": "useful(｜役に立《やくにた》つ)、used(中古《ちゅうこ》の)。", "body_kana": "しゅくだいのレポートをかくために、つくえのパソコンとキーボードを<use>して、2時間かけてぶんしょうをまとめた。"}, {"word": "usually", "meaning_jp": "普段、たいてい", "pos": "副", "body": "月曜から金曜は学校給食を食べるが、土曜日のお昼は<usually>家でラーメンを食べる。月に4回ある土曜のうち、ラーメンの日が3回以上は続いている。", "choices": ["普段", "決して〜ない", "時々", "突然"], "correct_index": 0, "explanation": "頻度の副詞。often より少し頻度が高い。", "id": "s1_375", "body_ruby": "月曜《げつよう》から金曜《きんよう》は学校給食《がっこうきゅうしょく》を食《た》べるが、土曜日《どようび》のお昼《ひる》は<usually>家《いえ》でラーメンを食《た》べる。月《がつ》に4回《かい》ある土曜《どよう》のうち、ラーメンの日《ひ》が3回《かい》以上《いじょう》は続《つづ》いている。", "choices_ruby": ["普段《ふだん》", "決《けっ》して〜ない", "時々《ときどき》", "突然《とつぜん》"], "explanation_ruby": "頻度《ひんど》の副詞《ふくし》。often より少《すこ》し頻度《ひんど》が高《たか》い。", "body_kana": "げつようからきんようはがっこうきゅうしょくをたべるが、どようびのおひるは<usually>いえでラーメンをたべる。がつに4回あるどようのうち、ラーメンのひが3回いじょうはつづいている。"}, {"word": "visit", "meaning_jp": "訪れる", "pos": "動", "body": "夏休みには、新幹線に乗って遠くに住む祖父母の家を毎年<visit>する。", "choices": ["訪れる", "去る", "住む", "離れる"], "correct_index": 0, "explanation": "visitor = 訪問者。", "id": "s1_376", "body_ruby": "夏休《なつやす》みには、新幹線《しんかんせん》に乗《の》って遠《とお》くに住《す》む祖父母《そふぼ》の家《いえ》を毎年《まいとし》<visit>する。", "choices_ruby": ["訪《おとず》れる", "去《さ》る", "住《す》む", "離《はな》れる"], "explanation_ruby": "visitor = 訪問者《ほうもんしゃ》。", "body_kana": "なつやすみには、しんかんせんにのってとおくにすむそふぼのいえをまいとし<visit>する。"}, {"word": "volleyball", "meaning_jp": "バレーボール", "pos": "名", "body": "体育の時間に、6人ずつの2チームに分かれて、ネット越しに白い球を<volleyball>のように打ち合うスポーツをした。手で打つ球技だ。", "choices": ["バレーボール", "サッカー", "テニス", "野球"], "correct_index": 0, "explanation": "volley(打ち合い)+ ball。", "id": "s1_377", "body_ruby": "体育《たいいく》の時間《じかん》に、6人《にん》ずつの2チームに分《わ》かれて、ネット越《ご》しに白《しろ》い球《たま》を<volleyball>のように打《う》ち合《あ》うスポーツをした。手《て》で打《う》つ球技《きゅうぎ》だ。", "choices_ruby": ["バレーボール", "サッカー", "テニス", "野球《やきゅう》"], "explanation_ruby": "volley(打《う》ち合《あ》い)+ ball。", "body_kana": "たいいくのじかんに、6人ずつの2チームにわかれて、ネットごしにしろいたまを<volleyball>のようにうちあうスポーツをした。てでうつきゅうぎだ。"}, {"word": "walk", "meaning_jp": "歩く", "pos": "動", "body": "天気が良い日には、自転車を使わず、家から学校まで20分かけて<walk>することにしている。", "choices": ["歩く", "走る", "立つ", "座る"], "correct_index": 0, "explanation": "run(走る)よりゆっくり。take a walk = 散歩する。", "id": "s1_378", "body_ruby": "天気《てんき》が良《よ》い日《ひ》には、自転車《じてんしゃ》を使《つか》わず、家《いえ》から学校《がっこう》まで20分《ふん》かけて<walk>することにしている。", "choices_ruby": ["歩《ある》く", "走《はし》る", "立《た》つ", "座《すわ》る"], "explanation_ruby": "run(走《はし》る)よりゆっくり。take a walk = 散歩《さんぽ》する。", "body_kana": "てんきがよいひには、じてんしゃをつかわず、いえからがっこうまで20分かけて<walk>することにしている。"}, {"word": "wall", "meaning_jp": "壁", "pos": "名", "body": "教室の前の<wall>には黒板が、後ろには時計と掲示物がたくさん貼られている。", "choices": ["壁", "床", "天井", "ドア"], "correct_index": 0, "explanation": "wallpaper(壁紙)。", "id": "s1_379", "body_ruby": "教室《きょうしつ》の前《まえ》の<wall>には黒板《こくばん》が、後《うし》ろには時計《とけい》と掲示物《けいじぶつ》がたくさん貼《は》られている。", "choices_ruby": ["壁《かべ》", "床《ゆか》", "天井《てんじょう》", "ドア"], "explanation_ruby": "wallpaper(壁紙《かべがみ》)。", "body_kana": "きょうしつのまえの<wall>にはこくばんが、うしろにはとけいとけいじぶつがたくさんはられている。"}, {"word": "want", "meaning_jp": "欲しい", "pos": "動", "body": "本屋で見かけた漫画の新刊をどうしても<want>していて、お小遣いを1ヶ月節約して買うことに決めた。", "choices": ["欲しい", "嫌い", "捨てたい", "返したい"], "correct_index": 0, "explanation": "I want to ~ = 〜したい。", "id": "s1_380", "body_ruby": "本屋《ほんや》で見《み》かけた漫画《まんが》の新刊《しんかん》をどうしても<want>していて、お小遣《こづか》いを1ヶ月《かげつ》節約《せつやく》して買《か》うことに決《き》めた。", "choices_ruby": ["欲《ほ》しい", "嫌《きら》い", "捨《す》てたい", "返《かえ》したい"], "explanation_ruby": "I want to ~ = 〜したい。", "body_kana": "ほんやでみかけたまんがのしんかんをどうしても<want>していて、おこづかいを1ヶ月せつやくしてかうことにきめた。"}, {"word": "wash", "meaning_jp": "洗う", "pos": "動", "body": "食事の前には、石鹸を使って両手を<wash>するように、小さい頃から繰り返し教えられてきた。", "choices": ["洗う", "汚す", "拭く", "乾かす"], "correct_index": 0, "explanation": "wash hands(手を洗う)、wash car(洗車)。", "id": "s1_381", "body_ruby": "食事《しょくじ》の前《まえ》には、石鹸《せっけん》を使《つか》って両手《りょうて》を<wash>するように、小《ちい》さい頃《ごろ》から｜繰り返《くりかえ》し教《おし》えられてきた。", "choices_ruby": ["洗《あら》う", "汚《よご》す", "拭《ふ》く", "乾《かわ》かす"], "explanation_ruby": "wash hands(手《て》を洗《あら》う)、wash car(洗車《せんしゃ》)。", "body_kana": "しょくじのまえには、せっけんをつかってりょうてを<wash>するように、ちいさいごろからくりかえしおしえられてきた。"}, {"word": "watch", "meaning_jp": "見る、腕時計", "pos": "動/名", "body": "夕食後の1時間、家族で居間に集まって、一緒にテレビのドラマを<watch>するのが日課だ。", "choices": ["見る", "聞く", "話す", "歌う"], "correct_index": 0, "explanation": "see(見える)、look(意識して見る)、watch(動くものを追う)。", "id": "s1_382", "body_ruby": "夕食《ゆうしょく》後《のち》の1時間《じかん》、家族《かぞく》で居間《いま》に集《あつ》まって、一緒《いっしょ》にテレビのドラマを<watch>するのが日課《にっか》だ。", "choices_ruby": ["見《み》る", "聞《き》く", "話《はな》す", "歌《うた》う"], "explanation_ruby": "see(見《み》える)、look(意識《いしき》して見《み》る)、watch(動《うご》くものを追《お》う)。", "body_kana": "ゆうしょくのちの1時間、かぞくでいまにあつまって、いっしょにテレビのドラマを<watch>するのがにっかだ。"}, {"word": "water", "meaning_jp": "水", "pos": "名", "body": "運動した後はのどが渇くので、冷たい<water>をコップに3杯入れて一気に飲んだ。", "choices": ["水", "お湯", "ジュース", "お茶"], "correct_index": 0, "explanation": "H₂O。waterfall(滝)、watermelon(スイカ)。", "id": "s1_383", "body_ruby": "運動《うんどう》した後《あと》はのどが渇《かわ》くので、冷《つめ》たい<water>をコップに3杯《はい》入《い》れて一気《いっき》に飲《の》んだ。", "choices_ruby": ["水《みず》", "お湯《ゆ》", "ジュース", "お茶《ちゃ》"], "explanation_ruby": "H₂O。waterfall(滝《たき》)、watermelon(スイカ)。", "body_kana": "うんどうしたあとはのどがかわくので、つめたい<water>をコップに3杯いれていっきにのんだ。"}, {"word": "wear", "meaning_jp": "身につける", "pos": "動", "body": "卒業式の日には、紺のジャケットと白いシャツを<wear>して、正装で出席するように指示されている。", "choices": ["身につける", "脱ぐ", "洗う", "片付ける"], "correct_index": 0, "explanation": "wear-wore-worn。「使い古す」の意味もある。", "id": "s1_384", "body_ruby": "卒業式《そつぎょうしき》の日《ひ》には、紺《こん》のジャケットと白《しろ》いシャツを<wear>して、正装《せいそう》で出席《しゅっせき》するように指示《しじ》されている。", "choices_ruby": ["身《み》につける", "脱《ぬ》ぐ", "洗《あら》う", "片付《かたづ》ける"], "explanation_ruby": "wear-wore-worn。「使《つか》い古《ふる》す」の意味《いみ》もある。", "body_kana": "そつぎょうしきのひには、こんのジャケットとしろいシャツを<wear>して、せいそうでしゅっせきするようにしじされている。"}, {"word": "Wednesday", "meaning_jp": "水曜日", "pos": "名", "body": "1週間のちょうど真ん中の<Wednesday>を過ぎると、週末まであと2日と思えて、気持ちが前向きになる。", "choices": ["水曜日", "火曜日", "木曜日", "金曜日"], "correct_index": 0, "explanation": "北欧神話の神オーディン(Woden)の日。", "id": "s1_385", "body_ruby": "1週間《しゅうかん》のちょうど｜真ん中《まんなか》の<Wednesday>を過《す》ぎると、週末《しゅうまつ》まであと2日《にち》と思《おも》えて、気持《きも》ちが前向《まえむ》きになる。", "choices_ruby": ["水曜日《すいようび》", "火曜日《かようび》", "木曜日《もくようび》", "金曜日《きんようび》"], "explanation_ruby": "北欧神話《ほくおうしんわ》の神《かみ》オーディン(Woden)の日《ひ》。", "body_kana": "1週間のちょうどまんなかの<Wednesday>をすぎると、しゅうまつまであと2日とおもえて、きもちがまえむきになる。"}, {"word": "week", "meaning_jp": "週", "pos": "名", "body": "1<week>は月曜日から日曜日までの7日間でできている。日本の学校では、平日5日が授業で、土日が休みとなる単位だ。", "choices": ["週", "月", "日", "年"], "correct_index": 0, "explanation": "next week(来週)、weekend(週末)。", "id": "s1_386", "body_ruby": "1<week>は月曜日《げつようび》から日曜日《にちようび》までの7日間《にちかん》でできている。日本《にっぽん》の学校《がっこう》では、平日《へいじつ》5日《にち》が授業《じゅぎょう》で、土日《どにち》が休《やす》みとなる単位《たんい》だ。", "choices_ruby": ["週《しゅう》", "月《がつ》", "日《にち》", "年《ねん》"], "explanation_ruby": "next week(来週《らいしゅう》)、weekend(週末《しゅうまつ》)。", "body_kana": "1<week>はげつようびからにちようびまでの7日間でできている。にっぽんのがっこうでは、へいじつ5日がじゅぎょうで、どにちがやすみとなるたんいだ。"}, {"word": "weekend", "meaning_jp": "週末", "pos": "名", "body": "学校が休みになる<weekend>には、家族と一緒に映画を見に行ったり、買い物に出かけたりして楽しく過ごす。", "choices": ["週末", "平日", "祝日", "夏休み"], "correct_index": 0, "explanation": "week + end。土曜と日曜を指す。", "id": "s1_387", "body_ruby": "学校《がっこう》が休《やす》みになる<weekend>には、家族《かぞく》と一緒《いっしょ》に映画《えいが》を｜見に行《みにい》ったり、｜買い物《かいもの》に出《で》かけたりして楽《たの》しく過《す》ごす。", "choices_ruby": ["週末《しゅうまつ》", "平日《へいじつ》", "祝日《しゅくじつ》", "夏休《なつやす》み"], "explanation_ruby": "week + end。土曜《どよう》と日曜《にちよう》を指《さ》す。", "body_kana": "がっこうがやすみになる<weekend>には、かぞくといっしょにえいがをみにいったり、かいものにでかけたりしてたのしくすごす。"}, {"word": "welcome", "meaning_jp": "ようこそ、歓迎", "pos": "形/間", "body": "私が遊びに行くと、おばあちゃんはいつも玄関で手を広げて「<welcome>!」と笑顔で迎え入れてくれる。", "choices": ["ようこそ", "さようなら", "ありがとう", "ごめん"], "correct_index": 0, "explanation": "You're welcome. = どういたしまして。", "id": "s1_388", "body_ruby": "私《わたし》が遊《あそ》びに行《い》くと、おばあちゃんはいつも玄関《げんかん》で手《て》を広《ひろ》げて「<welcome>!」と笑顔《えがお》で迎《むか》え入《い》れてくれる。", "choices_ruby": ["ようこそ", "さようなら", "ありがとう", "ごめん"], "explanation_ruby": "You're welcome. = どういたしまして。", "body_kana": "わたしがあそびにいくと、おばあちゃんはいつもげんかんでてをひろげて「<welcome>!」とえがおでむかえいれてくれる。"}, {"word": "went", "meaning_jp": "行った", "pos": "動", "body": "昨日、家族で動物園に<went>した。パンダや象や猿などをたくさん見て、お土産も買って楽しんで帰ってきた。", "choices": ["行った", "来た", "帰った", "止まった"], "correct_index": 0, "explanation": "go の過去形。go-went-gone の不規則変化。", "id": "s1_389", "body_ruby": "昨日《きのう》、家族《かぞく》で動物園《どうぶつえん》に<went>した。パンダや象《ぞう》や猿《さる》などをたくさん見《み》て、お土産《みやげ》も買《か》って楽《たの》しんで帰《かえ》ってきた。", "choices_ruby": ["行《い》った", "来《き》た", "帰《かえ》った", "止《と》まった"], "explanation_ruby": "go の過去形《かこけい》。go-went-gone の不規則《ふきそく》変化《へんか》。", "body_kana": "きのう、かぞくでどうぶつえんに<went>した。パンダやぞうやさるなどをたくさんみて、おみやげもかってたのしんでかえってきた。"}, {"word": "wheel", "meaning_jp": "車輪", "pos": "名", "body": "自転車には前と後ろに合わせて2つの<wheel>がついていて、それが回転することで前に進むことができる。回転する丸い部品だ。", "choices": ["車輪", "ハンドル", "サドル", "ペダル"], "correct_index": 0, "explanation": "steering wheel(ハンドル)、wheelchair(車椅子)。", "id": "s1_390", "body_ruby": "自転車《じてんしゃ》には前《まえ》と後《うし》ろに合《あ》わせて2つの<wheel>がついていて、それが回転《かいてん》することで前《まえ》に進《すす》むことができる。回転《かいてん》する丸《まる》い部品《ぶひん》だ。", "choices_ruby": ["車輪《しゃりん》", "ハンドル", "サドル", "ペダル"], "explanation_ruby": "steering wheel(ハンドル)、wheelchair(車椅子《くるまいす》)。", "body_kana": "じてんしゃにはまえとうしろにあわせて2つの<wheel>がついていて、それがかいてんすることでまえにすすむことができる。かいてんするまるいぶひんだ。"}, {"word": "white", "meaning_jp": "白", "pos": "形", "body": "冬の朝、目を覚まして窓の外を見ると、夜のうちに降った雪で、町の屋根や道が一面<white>に覆われていた。", "choices": ["白", "黒", "赤", "青"], "correct_index": 0, "explanation": "black(黒)の対。White House(米大統領官邸)。", "id": "s1_391", "body_ruby": "冬《ふゆ》の朝《あさ》、目《め》を覚《さ》まして窓《まど》の外《そと》を見《み》ると、夜《よる》のうちに降《ふ》った雪《ゆき》で、町《まち》の屋根《やね》や道《みち》が一面《いちめん》<white>に覆《おお》われていた。", "choices_ruby": ["白《しろ》", "黒《くろ》", "赤《あか》", "青《あお》"], "explanation_ruby": "black(黒《くろ》)の対《つい》。White House(米大統領《べいだいとうりょう》官邸《かんてい》)。", "body_kana": "ふゆのあさ、めをさましてまどのそとをみると、よるのうちにふったゆきで、まちのやねやみちがいちめん<white>におおわれていた。"}, {"word": "win", "meaning_jp": "勝つ", "pos": "動", "body": "今日のサッカーの試合で、私たちのチームは相手チームに3対1で<win>することができた。", "choices": ["勝つ", "負ける", "引き分ける", "棄権する"], "correct_index": 0, "explanation": "win-won-won。lose(負ける)の対。winner = 勝者。", "id": "s1_392", "body_ruby": "今日《きょう》のサッカーの試合《しあい》で、私《わたし》たちのチームは相手《あいて》チームに3対《つい》1で<win>することができた。", "choices_ruby": ["勝《か》つ", "負《ま》ける", "｜引き分《ひきわ》ける", "棄権《きけん》する"], "explanation_ruby": "win-won-won。lose(負《ま》ける)の対《つい》。winner = 勝者《しょうしゃ》。", "body_kana": "きょうのサッカーのしあいで、わたしたちのチームはあいてチームに3つい1で<win>することができた。"}, {"word": "window", "meaning_jp": "窓", "pos": "名", "body": "電車に乗っている時、私は<window>側の席に座って、流れていく外の景色を眺めるのが好きだ。建物の壁にある光と空気の通る四角い穴だ。", "choices": ["窓", "ドア", "壁", "屋根"], "correct_index": 0, "explanation": "wind(風)+ ow。", "id": "s1_393", "body_ruby": "電車《でんしゃ》に乗《の》っている時《とき》、私《わたし》は<window>側《がわ》の席《せき》に座《すわ》って、流《なが》れていく外《そと》の景色《けしき》を眺《なが》めるのが好《す》きだ。建物《たてもの》の壁《かべ》にある光《ひか》と空《そら》気《き》の通《とお》る四角《しかく》い穴《あな》だ。", "choices_ruby": ["窓《まど》", "ドア", "壁《かべ》", "屋根《やね》"], "explanation_ruby": "wind(風《かぜ》)+ ow。", "body_kana": "でんしゃにのっているとき、わたしは<window>がわのせきにすわって、ながれていくそとのけしきをながめるのがすきだ。たてもののかべにあるひかとそらきのとおるしかくいあなだ。"}, {"word": "winter", "meaning_jp": "冬", "pos": "名", "body": "<winter>は1年で一番寒い季節で、空からは雪が降り、湖が凍り、コートと手袋とマフラーが必要になる。", "choices": ["冬", "春", "夏", "秋"], "correct_index": 0, "explanation": "winter vacation = 冬休み。", "id": "s1_394", "body_ruby": "<winter>は1年《ねん》で一番《いちばん》寒《さむ》い季節《きせつ》で、空《そら》からは雪《ゆき》が降《お》り、湖《みずうみ》が凍《こお》り、コートと手袋《てぶくろ》とマフラーが必要《ひつよう》になる。", "choices_ruby": ["冬《ふゆ》", "春《はる》", "夏《なつ》", "秋《あき》"], "explanation_ruby": "winter vacation = 冬休《ふゆやす》み。", "body_kana": "<winter>は1年でいちばんさむいきせつで、そらからはゆきがおり、みずうみがこおり、コートとてぶくろとマフラーがひつようになる。"}, {"word": "woman", "meaning_jp": "女性", "pos": "名", "body": "電車で立っていた妊婦さんに、隣に座っていた40歳くらいの優しい<woman>が、自分の席を立って譲ってあげていた。大人の女の人だ。", "choices": ["女性", "男性", "少女", "少年"], "correct_index": 0, "explanation": "man(男性)の対。複数形は women。", "id": "s1_395", "body_ruby": "電車《でんしゃ》で立《た》っていた妊婦《にんぷ》さんに、隣《となり》に座《すわ》っていた40歳《さい》くらいの優《やさ》しい<woman>が、自分《じぶん》の席《せき》を立《た》って譲《ゆず》ってあげていた。大人《おとな》の｜女の人《おんなのひと》だ。", "choices_ruby": ["女性《じょせい》", "男性《だんせい》", "少女《しょうじょ》", "少年《しょうねん》"], "explanation_ruby": "man(男性《だんせい》)の対《つい》。複数形《ふくすうけい》は women。", "body_kana": "でんしゃでたっていたにんぷさんに、となりにすわっていた40歳くらいのやさしい<woman>が、じぶんのせきをたってゆずってあげていた。おとなのおんなのひとだ。"}, {"word": "work", "meaning_jp": "働く", "pos": "動", "body": "私の父は毎朝7時に家を出て、夜の9時まで会社のオフィスで<work>している。", "choices": ["働く", "遊ぶ", "休む", "寝る"], "correct_index": 0, "explanation": "play(遊ぶ)の対。homework(宿題)。", "id": "s1_396", "body_ruby": "私《わたし》の父《ちち》は毎朝《まいあさ》7時《じ》に家《いえ》を出《で》て、夜《よる》の9時《じ》まで会社《かいしゃ》のオフィスで<work>している。", "choices_ruby": ["働《はたら》く", "遊《あそ》ぶ", "休《やす》む", "寝《ね》る"], "explanation_ruby": "play(遊《あそ》ぶ)の対《つい》。homework(宿題《しゅくだい》)。", "body_kana": "わたしのちちはまいあさ7時にいえをでて、よるの9時までかいしゃのオフィスで<work>している。"}, {"word": "write", "meaning_jp": "書く", "pos": "動", "body": "夏休みの宿題で、毎日寝る前に5分間、その日にあったことを日記帳に鉛筆で<write>する習慣をつけている。", "choices": ["書く", "読む", "話す", "聞く"], "correct_index": 0, "explanation": "write-wrote-written。w は発音しない。", "id": "s1_397", "body_ruby": "夏休《なつやす》みの宿題《しゅくだい》で、毎日《まいにち》寝《ね》る前《まえ》に5分間《ふんかん》、その日《ひ》にあったことを日記帳《にっきちょう》に鉛筆《えんぴつ》で<write>する習慣《しゅうかん》をつけている。", "choices_ruby": ["書《か》く", "読《よ》む", "話《はな》す", "聞《き》く"], "explanation_ruby": "write-wrote-written。w は発音《はつおん》しない。", "body_kana": "なつやすみのしゅくだいで、まいにちねるまえに5分間、そのひにあったことをにっきちょうにえんぴつで<write>するしゅうかんをつけている。"}, {"word": "wrote", "meaning_jp": "書いた", "pos": "動", "body": "彼は祖母の誕生日に、感謝の気持ちを込めた長い手紙を便箋3枚に丁寧に<wrote>した。", "choices": ["書いた", "読んだ", "話した", "聞いた"], "correct_index": 0, "explanation": "write の過去形。write-wrote-written。", "id": "s1_398", "body_ruby": "彼《かれ》は祖母《そぼ》の誕生日《たんじょうび》に、感謝《かんしゃ》の気持《きも》ちを込《こ》めた長《なが》い手紙《てがみ》を便箋《びんせん》3枚《まい》に丁寧《ていねい》に<wrote>した。", "choices_ruby": ["書《か》いた", "読《よ》んだ", "話《はな》した", "聞《き》いた"], "explanation_ruby": "write の過去形《かこけい》。write-wrote-written。", "body_kana": "かれはそぼのたんじょうびに、かんしゃのきもちをこめたながいてがみをびんせん3枚にていねいに<wrote>した。"}, {"word": "year", "meaning_jp": "年", "pos": "名", "body": "1<year>は365日あり、12の月で構成されている。私は今年で13歳になり、来年の誕生日には14歳になる。", "choices": ["年", "月", "週", "日"], "correct_index": 0, "explanation": "this year(今年)、next year(来年)。", "id": "s1_399", "body_ruby": "1<year>は365日《にち》あり、12の月《がつ》で構成《こうせい》されている。私《わたし》は今年《ことし》で13歳《さい》になり、来年《らいねん》の誕生日《たんじょうび》には14歳《さい》になる。", "choices_ruby": ["年《ねん》", "月《がつ》", "週《しゅう》", "日《にち》"], "explanation_ruby": "this year(今年《ことし》)、next year(来年《らいねん》)。", "body_kana": "1<year>は365日あり、12のがつでこうせいされている。わたしはことしで13歳になり、らいねんのたんじょうびには14歳になる。"}, {"word": "yellow", "meaning_jp": "黄色", "pos": "形", "body": "信号の<yellow>は、赤の前の合図で「注意して止まる準備を」と知らせる、バナナやひまわりの色だ。", "choices": ["黄色", "赤", "青", "緑"], "correct_index": 0, "explanation": "信号の色。yellow card(イエローカード=警告)。", "id": "s1_400", "body_ruby": "信号《しんごう》の<yellow>は、赤《あか》の前《まえ》の合図《あいず》で「注意《ちゅうい》して止《と》まる準備《じゅんび》を」と知《し》らせる、バナナやひまわりの色《いろ》だ。", "choices_ruby": ["黄色《きいろ》", "赤《あか》", "青《あお》", "緑《みどり》"], "explanation_ruby": "信号《しんごう》の色《いろ》。yellow card(イエローカード=警告《けいこく》)。", "body_kana": "しんごうの<yellow>は、あかのまえのあいずで「ちゅういしてとまるじゅんびを」としらせる、バナナやひまわりのいろだ。"}, {"word": "yesterday", "meaning_jp": "昨日", "pos": "副/名", "body": "今日は宿題が出なかったので、<yesterday>のうちに済ませておけばよかったと少し後悔した。", "choices": ["昨日", "明日", "今日", "去年"], "correct_index": 0, "explanation": "yester(前の)+ day(日)。", "id": "s1_401", "body_ruby": "今日《きょう》は宿題《しゅくだい》が出《で》なかったので、<yesterday>のうちに済《す》ませておけばよかったと少《すこ》し後悔《こうかい》した。", "choices_ruby": ["昨日《きのう》", "明日《あした》", "今日《きょう》", "去年《きょねん》"], "explanation_ruby": "yester(前《まえ》の)+ day(日《にち》)。", "body_kana": "きょうはしゅくだいがでなかったので、<yesterday>のうちにすませておけばよかったとすこしこうかいした。"}, {"word": "zero", "meaning_jp": "0、ゼロ", "pos": "名/形", "body": "テストで1問も間違えなかったので、減点が<zero>で満点を取った。1より小さい、何もない数だ。", "choices": ["0", "1", "10", "100"], "correct_index": 0, "explanation": "「ゼロ」。oh とも nought とも言う。", "id": "s1_402", "body_ruby": "テストで1問《もん》も間違《まちが》えなかったので、減点《げんてん》が<zero>で満点《まんてん》を取《と》った。1より小《ちい》さい、何《なに》もない数《かず》だ。", "choices_ruby": ["0", "1", "10", "100"], "explanation_ruby": "「ゼロ」。oh とも nought とも言《い》う。", "body_kana": "テストで1問もまちがえなかったので、げんてんが<zero>でまんてんをとった。1よりちいさい、なにもないかずだ。"}, {"word": "zoo", "meaning_jp": "動物園", "pos": "名", "body": "週末に家族で上野の<zoo>に行って、パンダ・キリン・ライオン・象などたくさんの動物を1日中見て楽しんだ。", "choices": ["動物園", "水族館", "植物園", "遊園地"], "correct_index": 0, "explanation": "zoological garden の略。", "id": "s1_403", "body_ruby": "週末《しゅうまつ》に家族《かぞく》で上野《うえの》の<zoo>に行《い》って、パンダ・キリン・ライオン・象《ぞう》などたくさんの動物《どうぶつ》を1日《にち》中《じゅう》見《み》て楽《たの》しんだ。", "choices_ruby": ["動物園《ど function escapeHTML(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderBody(s) {
  return escapeHTML(s)
    .replace(/｜([^《》｜]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>')
    .replace(/([一-龯々〆ヶ]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>')
    .replace(/&lt;(.+?)&gt;/g, '<span class="embed">$1</span>');
}

const cardsDiv = document.getElementById("cards");
const noResults = document.getElementById("no-results");
const statsEl = document.getElementById("stats");
const searchEl = document.getElementById("search");

DATA.forEach((q, i) => {
  const div = document.createElement("div");
  div.className = "card";
  div.dataset.word = q.word.toLowerCase();
  div.dataset.meaning = q.meaning_jp.toLowerCase();
  div.dataset.body = q.body.toLowerCase();
  div.dataset.pos = q.pos;
  div.dataset.idx = i + 1;
  div.innerHTML = `
    <div class="card-head">
      <span class="id">#${String(i+1).padStart(3,'0')}</span>
      <span class="word">${escapeHTML(q.word)}</span>
      <span class="pos">${escapeHTML(q.pos)}</span>
      <span class="meaning">${escapeHTML(q.meaning_jp)}</span>
    </div>
    <div class="body">${renderBody(q.body_ruby || q.body)}</div>
    <div class="choices-row">
      ${q.choices.map((c, idx) => `<span class="choice-chip ${idx === q.correct_index ? 'correct' : ''}">${"ABCD"[idx]}. ${renderBody((q.choices_ruby || q.choices)[idx] || c)}</span>`).join("")}
    </div>
    ${q.explanation ? `<div class="explanation">💡 ${renderBody(q.explanation_ruby || q.explanation)}</div>` : ''}
  `;
  cardsDiv.appendChild(div);
});

let currentPos = "all";

function filter() {
  const q = searchEl.value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll(".card").forEach(card => {
    const matchPos = currentPos === "all" || card.dataset.pos.includes(currentPos);
    const matchQuery = !q || card.dataset.word.includes(q) || card.dataset.meaning.includes(q) || card.dataset.body.includes(q);
    if (matchPos && matchQuery) {
      card.classList.remove("hidden");
      visible++;
    } else {
      card.classList.add("hidden");
    }
  });
  statsEl.textContent = visible + " / " + DATA.length;
  noResults.classList.toggle("hidden", visible > 0);
}

searchEl.addEventListener("input", filter);
document.querySelectorAll(".filter-chip[data-pos]").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".filter-chip[data-pos]").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentPos = chip.dataset.pos;
    filter();
  });
});
// ふりがな表示切替
document.getElementById("ruby-chip").addEventListener("click", function() {
  document.body.classList.toggle("no-ruby");
  this.classList.toggle("active", !document.body.classList.contains("no-ruby"));
});
filter();
</script>
