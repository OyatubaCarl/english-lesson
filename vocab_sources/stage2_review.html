ジアム、競技場", "pos": "名", "body": "5万人収容の<stadium>は満員で、ゴールが決まった瞬間、地鳴りのような歓声が客席を包んだ。", "choices": ["競技場", "体育館", "公民館", "劇場"], "correct_index": 0, "explanation": "屋外の大型競技場。", "id": "s2_292", "body_ruby": "5万人《まんにん》収容《しゅうよう》の<stadium>は満員《まんいん》で、ゴールが決《き》まった瞬間《しゅんかん》、地鳴《じな》りのような歓声《かんせい》が客席《きゃくせき》を包《つつ》んだ。", "choices_ruby": ["競技場《きょうぎじょう》", "体育館《たいいくかん》", "公民館《こうみんかん》", "劇場《げきじょう》"], "explanation_ruby": "屋外《おくがい》の大型《おおがた》競技場《きょうぎじょう》。", "body_kana": "5まんにんしゅうようの<stadium>はまんいんで、ゴールがきまったしゅんかん、じなりのようなかんせいがきゃくせきをつつんだ。"}, {"word": "staff", "meaning_jp": "職員、スタッフ", "pos": "名", "body": "遊園地で道に迷ったら、制服を着た<staff>が地図を指さしながら、観覧車までの行き方を教えてくれた。", "choices": ["職員", "客", "選手", "観客"], "correct_index": 0, "explanation": "働く人たち全体。集合的に使う。", "id": "s2_293", "body_ruby": "遊園地《ゆうえんち》で道《みち》に迷《まよ》ったら、制服《せいふく》を着《き》た<staff>が地図《ちず》を指《さ》さしながら、観覧車《かんらんしゃ》までの行《い》き方《ほう》を教《おし》えてくれた。", "choices_ruby": ["職員《しょくいん》", "客《きゃく》", "選手《せんしゅ》", "観客《かんきゃく》"], "explanation_ruby": "働《はたら》く人《にん》たち全体《ぜんたい》。集合的《しゅうごうてき》に使《つか》う。", "body_kana": "ゆうえんちでみちにまよったら、せいふくをきた<staff>がちずをささしながら、かんらんしゃまでのいきほうをおしえてくれた。"}, {"word": "star", "meaning_jp": "星", "pos": "名", "body": "キャンプ場の夜空には、街では見えない小さな<star>まで無数に輝いていて、天の川もはっきり分かった。", "choices": ["星", "月", "雲", "飛行機"], "correct_index": 0, "explanation": "「人気者・スター」の意味もある。", "id": "s2_294", "body_ruby": "キャンプ場《ば》の夜《よる》空《そら》には、街《まち》では見《み》えない小《ちい》さな<star>まで無数《むすう》に輝《かがや》いていて、｜天の川《あまのがわ》もはっきり分《わ》かった。", "choices_ruby": ["星《ほし》", "月《がつ》", "雲《くも》", "飛行機《ひこうき》"], "explanation_ruby": "「人気者《にんきもの》・スター」の意味《いみ》もある。", "body_kana": "キャンプばのよるそらには、まちではみえないちいさな<star>までむすうにかがやいていて、あまのがわもはっきりわかった。"}, {"word": "station", "meaning_jp": "駅", "pos": "名", "body": "待ち合わせは朝9時に<station>の改札前。電車が着くたびに、人の波がどっと吐き出されてくる。", "choices": ["駅", "空港", "港", "停留所"], "correct_index": 0, "explanation": "police station(警察署)、fire station(消防署)も。", "id": "s2_295", "body_ruby": "｜待ち合《まちあ》わせは朝《あさ》9時《じ》に<station>の改札《かいさつ》前《まえ》。電車《でんしゃ》が着《つ》くたびに、人《にん》の波《なみ》がどっと｜吐き出《はきだ》されてくる。", "choices_ruby": ["駅《えき》", "空《そら》港《みなと》", "港《みなと》", "停留所《ていりゅうしょ》"], "explanation_ruby": "police station(警察署《けいさつしょ》)、fire station(消防署《しょうぼうしょ》)も。", "body_kana": "まちあわせはあさ9時に<station>のかいさつまえ。でんしゃがつくたびに、にんのなみがどっとはきだされてくる。"}, {"word": "stay", "meaning_jp": "滞在する、とどまる", "pos": "動", "body": "夏休みに祖父母の家へ行き、1週間<stay>した。朝は畑を手伝い、夜は縁側で花火をした。", "choices": ["滞在する", "通過する", "出発する", "引っ越す"], "correct_index": 0, "explanation": "stay home = 家にいる。homestay(ホームステイ)。", "id": "s2_296", "body_ruby": "夏休《なつやす》みに祖父母《そふぼ》の家《いえ》へ行《い》き、1週間《しゅうかん》<stay>した。朝《あさ》は畑《はたけ》を手伝《てつだ》い、夜《よる》は縁側《えんがわ》で花火《はなび》をした。", "choices_ruby": ["滞在《たいざい》する", "通過《つうか》する", "出発《しゅっぱつ》する", "｜引っ越《ひっこ》す"], "explanation_ruby": "stay home = 家《いえ》にいる。homestay(ホームステイ)。", "body_kana": "なつやすみにそふぼのいえへいき、1週間<stay>した。あさははたけをてつだい、よるはえんがわではなびをした。"}, {"word": "step", "meaning_jp": "一歩、段", "pos": "名", "body": "赤ちゃんが初めて自分の足で1<step>を踏み出し、よろけながらもう1歩進むと、家族中が拍手した。", "choices": ["一歩", "一言", "一口", "一枚"], "correct_index": 0, "explanation": "step by step = 一歩ずつ。階段の「段」も。", "id": "s2_297", "body_ruby": "赤《あか》ちゃんが初《はじ》めて自分《じぶん》の足《あし》で1<step>を踏《ふ》み出《だ》し、よろけながらもう1歩《ほ》進《すす》むと、家族《かぞく》中《なか》が拍手《はくしゅ》した。", "choices_ruby": ["一歩《いっぽ》", "一言《ひとこと》", "一口《ひとくち》", "一枚《いちまい》"], "explanation_ruby": "step by step = 一歩《いっぽ》ずつ。階段《かいだん》の「段《だん》」も。", "body_kana": "あかちゃんがはじめてじぶんのあしで1<step>をふみだし、よろけながらもう1ほすすむと、かぞくなかがはくしゅした。"}, {"word": "store", "meaning_jp": "店", "pos": "名", "body": "駅前の文房具の<store>で、ノート2冊と消しゴムを買った。レジの横には新製品のペンが並んでいた。", "choices": ["店", "倉庫だけの建物", "工場", "事務所"], "correct_index": 0, "explanation": "shop とほぼ同じ。convenience store(コンビニ)。", "id": "s2_298", "body_ruby": "駅前《えきまえ》の文房具《ぶんぼうぐ》の<store>で、ノート2冊《さつ》と消《け》しゴムを買《か》った。レジの横《よこ》には新製品《しんせいひん》のペンが並《なら》んでいた。", "choices_ruby": ["店《みせ》", "倉庫《そうこ》だけの建物《たてもの》", "工場《こうじょう》", "事務所《じむしょ》"], "explanation_ruby": "shop とほぼ同《おな》じ。convenience store(コンビニ)。", "body_kana": "えきまえのぶんぼうぐの<store>で、ノート2冊とけしゴムをかった。レジのよこにはしんせいひんのペンがならんでいた。"}, {"word": "straight", "meaning_jp": "まっすぐな、まっすぐに", "pos": "形/副", "body": "「この道を<straight>に200メートル進むと、右手に郵便局が見えますよ」と道を教えてもらった。", "choices": ["まっすぐに", "曲がって", "戻って", "ななめに"], "correct_index": 0, "explanation": "go straight = 直進する。", "id": "s2_299", "body_ruby": "「この道《みち》を<straight>に200メートル進《すす》むと、右手《みぎて》に郵便局《ゆうびんきょく》が見《み》えますよ」と道《みち》を教《おし》えてもらった。", "choices_ruby": ["まっすぐに", "曲《ま》がって", "戻《もど》って", "ななめに"], "explanation_ruby": "go straight = 直進《ちょくしん》する。", "body_kana": "「このみちを<straight>に200メートルすすむと、みぎてにゆうびんきょくがみえますよ」とみちをおしえてもらった。"}, {"word": "stuff", "meaning_jp": "物、持ち物", "pos": "名", "body": "「机の上の<stuff>を全部片付けてからテストを始めます」と言われ、筆箱以外をカバンにしまった。", "choices": ["物", "ごみ", "宿題", "机"], "correct_index": 0, "explanation": "いろいろな物をまとめて指すくだけた語。", "id": "s2_300", "body_ruby": "「机《つくえ》の上《うえ》の<stuff>を全部《ぜんぶ》片付《かたづ》けてからテストを始《はじ》めます」と言《い》われ、筆箱《ふでばこ》以外《いがい》をカバンにしまった。", "choices_ruby": ["物《もの》", "ごみ", "宿題《しゅくだい》", "机《つくえ》"], "explanation_ruby": "いろいろな物《もの》をまとめて指《さ》すくだけた語《ご》。", "body_kana": "「つくえのうえの<stuff>をぜんぶかたづけてからテストをはじめます」といわれ、ふでばこいがいをカバンにしまった。"}, {"word": "style", "meaning_jp": "スタイル、様式", "pos": "名", "body": "同じ題材でも、水墨画と油絵では描き方の<style>がまったく違い、受ける印象も変わる。", "choices": ["様式", "値段", "大きさ", "重さ"], "correct_index": 0, "explanation": "やり方・流儀。lifestyle = 生活様式。", "id": "s2_301", "body_ruby": "同《おな》じ題材《だいざい》でも、水墨画《すいぼくが》と油絵《あぶらえ》では描《えが》き方《ほう》の<style>がまったく違《ちが》い、受《う》ける印象《いんしょう》も変《か》わる。", "choices_ruby": ["様式《ようしき》", "値段《ねだん》", "大《おお》きさ", "重《おも》さ"], "explanation_ruby": "やり方《ほう》・流儀《りゅうぎ》。lifestyle = 生活《せいかつ》様式《ようしき》。", "body_kana": "おなじだいざいでも、すいぼくがとあぶらえではえがきほうの<style>がまったくちがい、うけるいんしょうもかわる。"}, {"word": "sugar", "meaning_jp": "砂糖", "pos": "名", "body": "ホットケーキの生地に<sugar>を大さじ2杯入れると、焼き上がりがほんのり甘くなる。", "choices": ["砂糖", "塩", "こしょう", "酢"], "correct_index": 0, "explanation": "salt(塩)とセットで覚える調味料。", "id": "s2_302", "body_ruby": "ホットケーキの生地《きじ》に<sugar>を大《おお》さじ2杯《はい》入《い》れると、焼《や》き上《あ》がりがほんのり甘《あま》くなる。", "choices_ruby": ["砂糖《さとう》", "塩《しお》", "こしょう", "酢《す》"], "explanation_ruby": "salt(塩《しお》)とセットで覚《おぼ》える調味料《ちょうみりょう》。", "body_kana": "ホットケーキのきじに<sugar>をおおさじ2杯いれると、やきあがりがほんのりあまくなる。"}, {"word": "suggest", "meaning_jp": "提案する", "pos": "動", "body": "行き先が決まらない私たちに、先生は「近くの科学館はどう?」と<suggest>してくれた。", "choices": ["提案する", "命令する", "反対する", "報告する"], "correct_index": 0, "explanation": "suggestion(提案)の動詞形。", "id": "s2_303", "body_ruby": "行《い》き先《さき》が決《き》まらない私《わたし》たちに、先生《せんせい》は「近《ちか》くの科学館《かがくかん》はどう?」と<suggest>してくれた。", "choices_ruby": ["提案《ていあん》する", "命令《めいれい》する", "反対《はんたい》する", "報告《ほうこく》する"], "explanation_ruby": "suggestion(提案《ていあん》)の動詞形《どうしけい》。", "body_kana": "いきさきがきまらないわたしたちに、せんせいは「ちかくのかがくかんはどう?」と<suggest>してくれた。"}, {"word": "sun", "meaning_jp": "太陽", "pos": "名", "body": "梅雨の合間に久しぶりに<sun>が顔を出し、洗濯物が午前中だけでカラッと乾いた。", "choices": ["太陽", "月", "星", "雷"], "correct_index": 0, "explanation": "Sunday(日曜)の語源。sunrise = 日の出。", "id": "s2_304", "body_ruby": "梅雨《つゆ》の合間《あいま》に久《ひさ》しぶりに<sun>が顔《かお》を出《だ》し、洗濯物《せんたくもの》が午前中《ごぜんちゅう》だけでカラッと乾《かわ》いた。", "choices_ruby": ["太陽《たいよう》", "月《がつ》", "星《ほし》", "雷《かみなり》"], "explanation_ruby": "Sunday(日曜《にちよう》)の語源《ごげん》。sunrise = ｜日の出《ひので》。", "body_kana": "つゆのあいまにひさしぶりに<sun>がかおをだし、せんたくものがごぜんちゅうだけでカラッとかわいた。"}, {"word": "sung", "meaning_jp": "歌われる", "pos": "動", "body": "この校歌は創立から100年間、毎年の入学式と卒業式で<sung>されてきた。", "choices": ["歌われる", "禁止される", "作られる", "忘れられる"], "correct_index": 0, "explanation": "sing の過去分詞。sing-sang-sung。", "id": "s2_305", "body_ruby": "この校歌《こうか》は創立《そうりつ》から100年間《ねんかん》、毎年《まいとし》の入学式《にゅうがくしき》と卒業式《そつぎょうしき》で<sung>されてきた。", "choices_ruby": ["歌《うた》われる", "禁止《きんし》される", "作《つく》られる", "忘《わす》れられる"], "explanation_ruby": "sing の過去分詞《かこぶんし》。sing-sang-sung。", "body_kana": "このこうかはそうりつから100年間、まいとしのにゅうがくしきとそつぎょうしきで<sung>されてきた。"}, {"word": "sunny", "meaning_jp": "晴れた", "pos": "形", "body": "遠足の朝は雲ひとつない<sunny>な天気で、てるてる坊主を作った甲斐があった。", "choices": ["晴れた", "曇った", "雨の", "雪の"], "correct_index": 0, "explanation": "sun + -y。cloudy、rainy の仲間。", "id": "s2_306", "body_ruby": "遠足《えんそく》の朝《あさ》は雲《くも》ひとつない<sunny>な天気《てんき》で、てるてる坊主《ぼうず》を作《つく》った甲斐《かい》があった。", "choices_ruby": ["晴《は》れた", "曇《くも》った", "雨《あめ》の", "雪《ゆき》の"], "explanation_ruby": "sun + -y。cloudy、rainy の仲間《なかま》。", "body_kana": "えんそくのあさはくもひとつない<sunny>なてんきで、てるてるぼうずをつくったかいがあった。"}, {"word": "supermarket", "meaning_jp": "スーパーマーケット", "pos": "名", "body": "夕方の<supermarket>は買い物客でにぎわい、お惣菜コーナーには割引シールが貼られ始めていた。", "choices": ["スーパー", "本屋", "美容院", "銀行"], "correct_index": 0, "explanation": "super(超)+ market(市場)。", "id": "s2_307", "body_ruby": "夕方《ゆうがた》の<supermarket>は｜買い物《かいもの》客《きゃく》でにぎわい、お惣菜《そうざい》コーナーには割引《わりびき》シールが貼《は》られ始《はじ》めていた。", "choices_ruby": ["スーパー", "本屋《ほんや》", "美容院《びよういん》", "銀行《ぎんこう》"], "explanation_ruby": "super(超《ちょう》)+ market(市場《しじょう》)。", "body_kana": "ゆうがたの<supermarket>はかいものきゃくでにぎわい、おそうざいコーナーにはわりびきシールがはられはじめていた。"}, {"word": "surf", "meaning_jp": "サーフィンをする、ネットを見て回る", "pos": "動", "body": "夏の海で、ボードに乗って波に挑む人たちが<surf>していた。大きな波に乗れると歓声が上がった。", "choices": ["サーフィンをする", "泳ぐ", "潜る", "釣りをする"], "correct_index": 0, "explanation": "surf the internet = ネットを見て回る、の意味も。", "id": "s2_308", "body_ruby": "夏《なつ》の海《うみ》で、ボードに乗《の》って波《なみ》に挑《いど》む人《にん》たちが<surf>していた。大《おお》きな波《なみ》に乗《の》れると歓声《かんせい》が上《あ》がった。", "choices_ruby": ["サーフィンをする", "泳《およ》ぐ", "潜《もぐ》る", "釣《つ》りをする"], "explanation_ruby": "surf the internet = ネットを見《み》て回《まわ》る、の意味《いみ》も。", "body_kana": "なつのうみで、ボードにのってなみにいどむにんたちが<surf>していた。おおきななみにのれるとかんせいがあがった。"}, {"word": "surprised", "meaning_jp": "驚いた", "pos": "形", "body": "教室のドアを開けたら全員がクラッカーを鳴らし、誕生日を祝ってくれた。心臓が止まるかと思うほど<surprised>した。", "choices": ["驚いた", "退屈した", "安心した", "眠くなった"], "correct_index": 0, "explanation": "人が「驚いた」状態。出来事側は surprising。", "id": "s2_309", "body_ruby": "教室《きょうしつ》のドアを開《ひら》けたら全員《ぜんいん》がクラッカーを鳴《な》らし、誕生日《たんじょうび》を祝《いわ》ってくれた。心臓《しんぞう》が止《と》まるかと思《おも》うほど<surprised>した。", "choices_ruby": ["驚《おどろ》いた", "退屈《たいくつ》した", "安心《あんしん》した", "眠《ねむ》くなった"], "explanation_ruby": "人《にん》が「驚《おどろ》いた」状態《じょうたい》。出来事《できごと》側《がわ》は surprising。", "body_kana": "きょうしつのドアをひらけたらぜんいんがクラッカーをならし、たんじょうびをいわってくれた。しんぞうがとまるかとおもうほど<surprised>した。"}, {"word": "surprising", "meaning_jp": "驚くべき", "pos": "形", "body": "あの小さな1年生が、6年生を抜いてマラソン大会で優勝したのは、学校中にとって<surprising>な出来事だった。", "choices": ["驚くべき", "予想通りの", "つまらない", "悲しい"], "correct_index": 0, "explanation": "出来事が「人を驚かせる」。人側は surprised。", "id": "s2_310", "body_ruby": "あの小《ちい》さな1年生《ねんせい》が、6年生《ねんせい》を抜《ぬ》いてマラソン大会《たいかい》で優勝《ゆうしょう》したのは、学校《がっこう》中《なか》にとって<surprising>な出来事《できごと》だった。", "choices_ruby": ["驚《おどろ》くべき", "予想《よそう》通《とお》りの", "つまらない", "悲《かな》しい"], "explanation_ruby": "出来事《できごと》が「人《にん》を驚《おどろ》かせる」。人《にん》側《がわ》は surprised。", "body_kana": "あのちいさな1年生が、6年生をぬいてマラソンたいかいでゆうしょうしたのは、がっこうなかにとって<surprising>なできごとだった。"}, {"word": "taken", "meaning_jp": "撮られる、取られる", "pos": "動", "body": "この白黒写真は50年前の運動会で<taken>されたもので、若い頃の祖父が一等でゴールする瞬間だ。", "choices": ["撮られた", "破られた", "塗られた", "売られた"], "correct_index": 0, "explanation": "take の過去分詞。take-took-taken。", "id": "s2_311", "body_ruby": "この白黒写真《しろくろしゃしん》は50年《ねん》前《まえ》の運動会《うんどうかい》で<taken>されたもので、若《わか》い頃《ごろ》の祖父《そふ》が一等《いっとう》でゴールする瞬間《しゅんかん》だ。", "choices_ruby": ["撮《と》られた", "破《やぶ》られた", "塗《ぬ》られた", "売《う》られた"], "explanation_ruby": "take の過去分詞《かこぶんし》。take-took-taken。", "body_kana": "このしろくろしゃしんは50年まえのうんどうかいで<taken>されたもので、わかいごろのそふがいっとうでゴールするしゅんかんだ。"}, {"word": "tale", "meaning_jp": "物語、昔話", "pos": "名", "body": "祖母は寝る前に、桃から生まれた男の子が鬼を退治する<tale>を、何度もせがまれて話してくれた。", "choices": ["昔話", "新聞記事", "日記", "手紙"], "correct_index": 0, "explanation": "fairy tale = おとぎ話。tail(しっぽ)と同音。", "id": "s2_312", "body_ruby": "祖母《そぼ》は寝《ね》る前《まえ》に、桃《もも》から生《う》まれた｜男の子《おとこのこ》が鬼《おに》を退治《たいじ》する<tale>を、何度《なんど》もせがまれて話《はな》してくれた。", "choices_ruby": ["昔話《むかしばなし》", "新聞記事《しんぶんきじ》", "日記《にっき》", "手紙《てがみ》"], "explanation_ruby": "fairy tale = おとぎ話《はなし》。tail(しっぽ)と同音《どうおん》。", "body_kana": "そぼはねるまえに、ももからうまれたおとこのこがおにをたいじする<tale>を、なんどもせがまれてはなしてくれた。"}, {"word": "tall", "meaning_jp": "背が高い", "pos": "形", "body": "兄はこの1年で10センチも伸びて、ついに父を追い越すほど<tall>になった。ドアの枠に頭をぶつけそうだ。", "choices": ["背が高い", "背が低い", "やせた", "太った"], "correct_index": 0, "explanation": "short(背が低い)の対。建物にも使う。", "id": "s2_313", "body_ruby": "兄《あに》はこの1年《ねん》で10センチも伸《の》びて、ついに父《ちち》を｜追い越《おいこ》すほど<tall>になった。ドアの枠《わく》に頭《あたま》をぶつけそうだ。", "choices_ruby": ["背《せ》が高《たか》い", "背《せ》が低《ひく》い", "やせた", "太《ふと》った"], "explanation_ruby": "short(背《せ》が低《ひく》い)の対《つい》。建物《たてもの》にも使《つか》う。", "body_kana": "あにはこの1年で10センチものびて、ついにちちをおいこすほど<tall>になった。ドアのわくにあたまをぶつけそうだ。"}, {"word": "task", "meaning_jp": "課題、仕事", "pos": "名", "body": "今日の私の<task>は、花壇の水やりとウサギ小屋の掃除。飼育委員の当番表で決まっている。", "choices": ["課題", "趣味", "休憩", "ごほうび"], "correct_index": 0, "explanation": "やるべき仕事のひとつひとつ。", "id": "s2_314", "body_ruby": "今日《きょう》の私《わたし》の<task>は、花壇《かだん》の水《みず》やりとウサギ小屋《こや》の掃除《そうじ》。飼育《しいく》委員《いいん》の当番表《とうばんひょう》で決《き》まっている。", "choices_ruby": ["課題《かだい》", "趣味《しゅみ》", "休憩《きゅうけい》", "ごほうび"], "explanation_ruby": "やるべき仕事《しごと》のひとつひとつ。", "body_kana": "きょうのわたしの<task>は、かだんのみずやりとウサギこやのそうじ。しいくいいんのとうばんひょうできまっている。"}, {"word": "tea", "meaning_jp": "茶", "pos": "名", "body": "祖母は来客があると、急須で熱い<tea>をいれ、湯のみに注いで茶菓子と一緒に出す。", "choices": ["茶", "水", "牛乳", "ジュース"], "correct_index": 0, "explanation": "green tea = 緑茶。tea ceremony = 茶道。", "id": "s2_315", "body_ruby": "祖母《そぼ》は来客《らいきゃく》があると、急須《きゅうす》で熱《あつ》い<tea>をいれ、湯《ゆ》のみに注《そそ》いで茶菓子《ちゃがし》と一緒《いっしょ》に出《だ》す。", "choices_ruby": ["茶《ちゃ》", "水《みず》", "牛乳《ぎゅうにゅう》", "ジュース"], "explanation_ruby": "green tea = 緑茶《りょくちゃ》。tea ceremony = 茶道《さどう》。", "body_kana": "そぼはらいきゃくがあると、きゅうすであつい<tea>をいれ、ゆのみにそそいでちゃがしといっしょにだす。"}, {"word": "test", "meaning_jp": "テスト、試験", "pos": "名", "body": "明日は数学の<test>がある。範囲は教科書の30ページ分で、計算問題が中心らしい。", "choices": ["テスト", "宿題", "行事", "面談"], "correct_index": 0, "explanation": "exam より小規模な確認の意味で使うことが多い。", "id": "s2_316", "body_ruby": "明日《あした》は数学《すうがく》の<test>がある。範囲《はんい》は教科書《きょうかしょ》の30ページ分《ふん》で、計算問題《けいさんもんだい》が中心《ちゅうしん》らしい。", "choices_ruby": ["テスト", "宿題《しゅくだい》", "行事《ぎょうじ》", "面談《めんだん》"], "explanation_ruby": "exam より小規模《しょうきぼ》な確認《かくにん》の意味《いみ》で使《つか》うことが多《おお》い。", "body_kana": "あしたはすうがくの<test>がある。はんいはきょうかしょの30ページふんで、けいさんもんだいがちゅうしんらしい。"}, {"word": "thing", "meaning_jp": "物、こと", "pos": "名", "body": "忘れ物が多いので、次の日に持っていく<thing>を、前の晩に玄関にまとめて置くようにした。", "choices": ["物", "人", "場所", "時間"], "correct_index": 0, "explanation": "形のある物にも、出来事にも使える便利な語。", "id": "s2_317", "body_ruby": "｜忘れ物《わすれもの》が多《おお》いので、次《つぎ》の日《にち》に持《も》っていく<thing>を、前《まえ》の晩《ばん》に玄関《げんかん》にまとめて置《お》くようにした。", "choices_ruby": ["物《もの》", "人《にん》", "場所《ばしょ》", "時間《じかん》"], "explanation_ruby": "形《かたち》のある物《もの》にも、出来事《できごと》にも使《つか》える便利《べんり》な語《ご》。", "body_kana": "わすれものがおおいので、つぎのにちにもっていく<thing>を、まえのばんにげんかんにまとめておくようにした。"}, {"word": "thought", "meaning_jp": "考えた", "pos": "動", "body": "クイズの答えを1分間じっくり<thought>したが、結局思いつかず、降参してヒントをもらった。", "choices": ["考えた", "話した", "書いた", "聞いた"], "correct_index": 0, "explanation": "think の過去形。名詞では「考え」。", "id": "s2_318", "body_ruby": "クイズの答《こた》えを1分間《ふんかん》じっくり<thought>したが、結局《けっきょく》思《おも》いつかず、降参《こうさん》してヒントをもらった。", "choices_ruby": ["考《かんが》えた", "話《はな》した", "書《か》いた", "聞《き》いた"], "explanation_ruby": "think の過去形《かこけい》。名詞《めいし》では「考《かんが》え」。", "body_kana": "クイズのこたえを1分間じっくり<thought>したが、けっきょくおもいつかず、こうさんしてヒントをもらった。"}, {"word": "ticket", "meaning_jp": "チケット、切符", "pos": "名", "body": "映画館の窓口で中学生の<ticket>を2枚買い、半券を握りしめて上映の10分前に席についた。", "choices": ["チケット", "パンフレット", "ポスター", "椅子"], "correct_index": 0, "explanation": "入場券・乗車券。", "id": "s2_319", "body_ruby": "映画館《えいがかん》の窓口《まどぐち》で中学生《ちゅうがくせい》の<ticket>を2枚《まい》買《か》い、半券《はんけん》を握《にぎ》りしめて上映《じょうえい》の10分《ふん》前《まえ》に席《せき》についた。", "choices_ruby": ["チケット", "パンフレット", "ポスター", "椅子《いす》"], "explanation_ruby": "入場券《にゅうじょうけん》・乗車券《じょうしゃけん》。", "body_kana": "えいがかんのまどぐちでちゅうがくせいの<ticket>を2枚かい、はんけんをにぎりしめてじょうえいの10分まえにせきについた。"}, {"word": "together", "meaning_jp": "一緒に", "pos": "副", "body": "難しい大型パズルだったが、家族4人で<together>に取り組んだら、3日で1000ピースを完成できた。", "choices": ["一緒に", "別々に", "ひとりで", "順番に"], "correct_index": 0, "explanation": "alone(ひとりで)の対。", "id": "s2_320", "body_ruby": "難《むずか》しい大型《おおがた》パズルだったが、家族《かぞく》4人《にん》で<together>に｜取り組《とりく》んだら、3日《にち》で1000ピースを完成《かんせい》できた。", "choices_ruby": ["一緒《いっしょ》に", "別々《べつべつ》に", "ひとりで", "順番《じゅんばん》に"], "explanation_ruby": "alone(ひとりで)の対《つい》。", "body_kana": "むずかしいおおがたパズルだったが、かぞく4人で<together>にとりくんだら、3日で1000ピースをかんせいできた。"}, {"word": "toilet", "meaning_jp": "トイレ", "pos": "名", "body": "新幹線の<toilet>は各車両の端にあり、使用中は入口の上のランプが赤く点灯する。", "choices": ["トイレ", "売店", "座席", "出口"], "correct_index": 0, "explanation": "英では便器そのもの。米では bathroom が丁寧。", "id": "s2_321", "body_ruby": "新幹線《しんかんせん》の<toilet>は各車両《かくしゃりょう》の端《はじ》にあり、使用中《しようちゅう》は入口《いりぐち》の上《うえ》のランプが赤《あか》く点灯《てんとう》する。", "choices_ruby": ["トイレ", "売店《ばいてん》", "座席《ざせき》", "出口《でぐち》"], "explanation_ruby": "英《えい》では便器《べんき》そのもの。米《こめ》では bathroom が丁寧《ていねい》。", "body_kana": "しんかんせんの<toilet>はかくしゃりょうのはじにあり、しようちゅうはいりぐちのうえのランプがあかくてんとうする。"}, {"word": "took", "meaning_jp": "取った、(時間が)かかった", "pos": "動", "body": "棚の一番上の本を、踏み台に乗って<took>した。背伸びしても指先が届かなかったのだ。", "choices": ["取った", "置いた", "捨てた", "隠した"], "correct_index": 0, "explanation": "take の過去形。take-took-taken。", "id": "s2_322", "body_ruby": "棚《たな》の一番上《いちばんうえ》の本《ほん》を、｜踏み台《ふみだい》に乗《の》って<took>した。背伸《せの》びしても指先《ゆびさき》が届《とど》かなかったのだ。", "choices_ruby": ["取《と》った", "置《お》いた", "捨《す》てた", "隠《かく》した"], "explanation_ruby": "take の過去形《かこけい》。take-took-taken。", "body_kana": "たなのいちばんうえのほんを、ふみだいにのって<took>した。せのびしてもゆびさきがとどかなかったのだ。"}, {"word": "top", "meaning_jp": "頂上、一番上", "pos": "名", "body": "3時間かけて山の<top>に着くと、眼下に町が広がり、遠くの海まで一望できた。", "choices": ["頂上", "ふもと", "中腹", "入口"], "correct_index": 0, "explanation": "bottom(底)の対。", "id": "s2_323", "body_ruby": "3時間《じかん》かけて山《やま》の<top>に着《つ》くと、眼下《がんか》に町《まち》が広《ひろ》がり、遠《とお》くの海《うみ》まで一望《いちぼう》できた。", "choices_ruby": ["頂上《ちょうじょう》", "ふもと", "中腹《ちゅうふく》", "入口《いりぐち》"], "explanation_ruby": "bottom(底《そこ》)の対《つい》。", "body_kana": "3時間かけてやまの<top>につくと、がんかにまちがひろがり、とおくのうみまでいちぼうできた。"}, {"word": "touch", "meaning_jp": "触れる", "pos": "動", "body": "博物館の展示には「作品に<touch>しないでください」という札があり、ガラス越しに眺めるだけにした。", "choices": ["触れる", "見る", "撮る", "話す"], "correct_index": 0, "explanation": "手をふれること。touch panel = タッチパネル。", "id": "s2_324", "body_ruby": "博物館《はくぶつかん》の展示《てんじ》には「作品《さくひん》に<touch>しないでください」という札《さつ》があり、ガラス越《こ》しに眺《なが》めるだけにした。", "choices_ruby": ["触《ふ》れる", "見《み》る", "撮《と》る", "話《はな》す"], "explanation_ruby": "手《て》をふれること。touch panel = タッチパネル。", "body_kana": "はくぶつかんのてんじには「さくひんに<touch>しないでください」というさつがあり、ガラスこしにながめるだけにした。"}, {"word": "tourism", "meaning_jp": "観光業", "pos": "名", "body": "この温泉の町は<tourism>で成り立っていて、旅館やお土産屋で働く人が住民の半分を占める。", "choices": ["観光業", "農業", "工業", "漁業"], "correct_index": 0, "explanation": "tour(旅行)+ -ism。tourist = 観光客。", "id": "s2_325", "body_ruby": "この温泉《おんせん》の町《まち》は<tourism>で｜成り立《なりた》っていて、旅館《りょかん》やお土産《みやげ》屋《や》で働《はたら》く人《にん》が住民《じゅうみん》の半分《はんぶん》を占《し》める。", "choices_ruby": ["観光《かんこう》業《ぎょう》", "農業《のうぎょう》", "工業《こうぎょう》", "漁業《ぎょぎょう》"], "explanation_ruby": "tour(旅行《りょこう》)+ -ism。tourist = 観光客《かんこうきゃく》。", "body_kana": "このおんせんのまちは<tourism>でなりたっていて、りょかんやおみやげやではたらくにんがじゅうみんのはんぶんをしめる。"}, {"word": "toy", "meaning_jp": "おもちゃ", "pos": "名", "body": "押し入れの奥から、幼い頃に毎日遊んだ電車の<toy>が出てきた。電池を替えるとまだ走った。", "choices": ["おもちゃ", "教科書", "工具", "食器"], "correct_index": 0, "explanation": "toy shop = おもちゃ屋。", "id": "s2_326", "body_ruby": "押《お》し入《い》れの奥《おく》から、｜幼い頃《おさないころ》に毎日《まいにち》遊《あそ》んだ電車《でんしゃ》の<toy>が出《で》てきた。電池《でんち》を替《か》えるとまだ走《はし》った。", "choices_ruby": ["おもちゃ", "教科書《きょうかしょ》", "工具《こうぐ》", "食器《しょっき》"], "explanation_ruby": "toy shop = おもちゃ屋《や》。", "body_kana": "おしいれのおくから、おさないころにまいにちあそんだでんしゃの<toy>がでてきた。でんちをかえるとまだはしった。"}, {"word": "traditional", "meaning_jp": "伝統的な", "pos": "形", "body": "お正月に着物を着て初詣に行くのは、何百年も受け継がれてきた日本の<traditional>な習慣だ。", "choices": ["伝統的な", "最新の", "外国の", "一時的な"], "correct_index": 0, "explanation": "tradition(伝統)+ -al。", "id": "s2_327", "body_ruby": "お正月《しょうがつ》に着物《きもの》を着《き》て初詣《はつもうで》に行《い》くのは、何百《なんびゃく》年《ねん》も｜受け継《うけつ》がれてきた日本《にっぽん》の<traditional>な習慣《しゅうかん》だ。", "choices_ruby": ["伝統的《でんとうてき》な", "最新《さいしん》の", "外国《がいこく》の", "一時的《いちじてき》な"], "explanation_ruby": "tradition(伝統《でんとう》)+ -al。", "body_kana": "おしょうがつにきものをきてはつもうでにいくのは、なんびゃくねんもうけつがれてきたにっぽんの<traditional>なしゅうかんだ。"}, {"word": "trouble", "meaning_jp": "困りごと、トラブル", "pos": "名", "body": "自動販売機にお金を入れたのにジュースが出てこない<trouble>が起き、貼ってある番号に電話した。", "choices": ["困りごと", "幸運", "祝い事", "計画"], "correct_index": 0, "explanation": "be in trouble = 困っている。", "id": "s2_328", "body_ruby": "自動販売機《じどうはんばいき》にお金《かね》を入《い》れたのにジュースが出《で》てこない<trouble>が起《お》き、貼《は》ってある番号《ばんごう》に電話《でんわ》した。", "choices_ruby": ["困《こま》りごと", "幸運《こううん》", "祝《いわ》い事《こと》", "計画《けいかく》"], "explanation_ruby": "be in trouble = 困《こま》っている。", "body_kana": "じどうはんばいきにおかねをいれたのにジュースがでてこない<trouble>がおき、はってあるばんごうにでんわした。"}, {"word": "try", "meaning_jp": "試す、挑戦する", "pos": "動", "body": "初めての一輪車に<try>したが、3秒でバランスを崩した。それでも毎日続けたら、1週間で10メートル進めた。", "choices": ["挑戦する", "諦める", "見学する", "休む"], "correct_index": 0, "explanation": "try to ~ = 〜しようと努める。Try it! = やってみて!", "id": "s2_329", "body_ruby": "初《はじ》めての一輪《いちりん》車《くるま》に<try>したが、3秒《びょう》でバランスを崩《くず》した。それでも毎日《まいにち》続《つづ》けたら、1週間《しゅうかん》で10メートル進《すす》めた。", "choices_ruby": ["挑戦《ちょうせん》する", "諦《あきら》める", "見学《けんがく》する", "休《やす》む"], "explanation_ruby": "try to ~ = 〜しようと努《つと》める。Try it! = やってみて!", "body_kana": "はじめてのいちりんくるまに<try>したが、3秒でバランスをくずした。それでもまいにちつづけたら、1週間で10メートルすすめた。"}, {"word": "understand", "meaning_jp": "理解する", "pos": "動", "body": "最初は意味不明だった公式も、先生が図で説明してくれたら、なるほどと<understand>できた。", "choices": ["理解する", "暗記する", "質問する", "間違える"], "correct_index": 0, "explanation": "understand-understood-understood。", "id": "s2_330", "body_ruby": "最初《さいしょ》は意味不明《いみふめい》だった公式《こうしき》も、先生《せんせい》が図《ず》で説明《せつめい》してくれたら、なるほどと<understand>できた。", "choices_ruby": ["理解《りかい》する", "暗記《あんき》する", "質問《しつもん》する", "間違《まちが》える"], "explanation_ruby": "understand-understood-understood。", "body_kana": "さいしょはいみふめいだったこうしきも、せんせいがずでせつめいしてくれたら、なるほどと<understand>できた。"}, {"word": "used", "meaning_jp": "中古の", "pos": "形", "body": "新品だと3万円する自転車を、<used>のもので探したら、ほとんど傷のないものが1万円で見つかった。", "choices": ["中古の", "新品の", "壊れた", "借り物の"], "correct_index": 0, "explanation": "use(使う)の過去分詞から。used car = 中古車。", "id": "s2_331", "body_ruby": "新品《しんぴん》だと3万円《まんえん》する自転車《じてんしゃ》を、<used>のもので探《さが》したら、ほとんど傷《きず》のないものが1万円《まんえん》で見《み》つかった。", "choices_ruby": ["中古《ちゅうこ》の", "新品《しんぴん》の", "壊《こわ》れた", "｜借り物《かりもの》の"], "explanation_ruby": "use(使《つか》う)の過去分詞《かこぶんし》から。used car = 中古車《ちゅうこしゃ》。", "body_kana": "しんぴんだと3まんえんするじてんしゃを、<used>のものでさがしたら、ほとんどきずのないものが1まんえんでみつかった。"}, {"word": "useful", "meaning_jp": "役に立つ", "pos": "形", "body": "10徳ナイフは、はさみ・ドライバー・栓抜きがひとつになっていて、キャンプでとても<useful>だった。", "choices": ["役に立つ", "場所をとる", "値段が高い", "壊れやすい"], "correct_index": 0, "explanation": "use(使う)+ -ful。useless = 役に立たない。", "id": "s2_332", "body_ruby": "10徳《とく》ナイフは、はさみ・ドライバー・栓抜《せんぬき》きがひとつになっていて、キャンプでとても<useful>だった。", "choices_ruby": ["｜役に立《やくにた》つ", "場所《ばしょ》をとる", "値段《ねだん》が高《たか》い", "壊《こわ》れやすい"], "explanation_ruby": "use(使《つか》う)+ -ful。useless = ｜役に立《やくにた》たない。", "body_kana": "10とくナイフは、はさみ・ドライバー・せんぬききがひとつになっていて、キャンプでとても<useful>だった。"}, {"word": "vacation", "meaning_jp": "休暇", "pos": "名", "body": "夏の<vacation>は40日もある。前半は祖父母の家、後半は部活と宿題の予定で、もう手帳が埋まっている。", "choices": ["休暇", "授業", "行事", "仕事"], "correct_index": 0, "explanation": "summer vacation = 夏休み。英では holiday。", "id": "s2_333", "body_ruby": "夏《なつ》の<vacation>は40日《にち》もある。前半《ぜんはん》は祖父母《そふぼ》の家《いえ》、後半《こうはん》は部活《ぶかつ》と宿題《しゅくだい》の予定《よてい》で、もう手帳《てちょう》が埋《う》まっている。", "choices_ruby": ["休暇《きゅうか》", "授業《じゅぎょう》", "行事《ぎょうじ》", "仕事《しごと》"], "explanation_ruby": "summer vacation = 夏休《なつやす》み。英《えい》では holiday。", "body_kana": "なつの<vacation>は40日もある。ぜんはんはそふぼのいえ、こうはんはぶかつとしゅくだいのよていで、もうてちょうがうまっている。"}, {"word": "vegetable", "meaning_jp": "野菜", "pos": "名", "body": "給食では、にんじん・ピーマン・ほうれん草など、苦手な<vegetable>も残さず食べるようにしている。", "choices": ["野菜", "果物", "肉", "魚"], "correct_index": 0, "explanation": "fruit(果物)と対で覚える。", "id": "s2_334", "body_ruby": "給食《きゅうしょく》では、にんじん・ピーマン・ほうれん草《くさ》など、苦手《にがて》な<vegetable>も残《のこ》さず食《た》べるようにしている。", "choices_ruby": ["野菜《やさい》", "果物《くだもの》", "肉《にく》", "魚《さかな》"], "explanation_ruby": "fruit(果物《くだもの》)と対《つい》で覚《おぼ》える。", "body_kana": "きゅうしょくでは、にんじん・ピーマン・ほうれんくさなど、にがてな<vegetable>ものこさずたべるようにしている。"}, {"word": "vet", "meaning_jp": "獣医", "pos": "名", "body": "飼い犬が餌を食べなくなったので<vet>に連れて行くと、注射を1本打って薬を出してくれた。", "choices": ["獣医", "歯医者", "床屋", "調教師"], "correct_index": 0, "explanation": "veterinarian の短縮形。動物のお医者さん。", "id": "s2_335", "body_ruby": "飼《か》い犬《いぬ》が餌《えさ》を食《た》べなくなったので<vet>に連《つ》れて行《い》くと、注射《ちゅうしゃ》を1本《ほん》打《う》って薬《くすり》を出《だ》してくれた。", "choices_ruby": ["獣医《じゅうい》", "歯医者《はいしゃ》", "床《ゆか》屋《や》", "調教師《ちょうきょうし》"], "explanation_ruby": "veterinarian の短縮形《たんしゅくけい》。動物《どうぶつ》のお医者《いしゃ》さん。", "body_kana": "かいいぬがえさをたべなくなったので<vet>につれていくと、ちゅうしゃを1本うってくすりをだしてくれた。"}, {"word": "video", "meaning_jp": "動画、ビデオ", "pos": "名", "body": "体育祭のリレーを父が<video>に撮ってくれた。夕食後に家族で再生して、ゴールの瞬間を何度も見返した。", "choices": ["動画", "写真", "絵", "録音"], "correct_index": 0, "explanation": "video game = テレビゲーム。", "id": "s2_336", "body_ruby": "体育祭《たいいくさい》のリレーを父《ちち》が<video>に撮《と》ってくれた。夕食《ゆうしょく》後《のち》に家族《かぞく》で再生《さいせい》して、ゴールの瞬間《しゅんかん》を何度《なんど》も見返《みかえ》した。", "choices_ruby": ["動画《どうが》", "写真《しゃしん》", "絵《え》", "録音《ろくおん》"], "explanation_ruby": "video game = テレビゲーム。", "body_kana": "たいいくさいのリレーをちちが<video>にとってくれた。ゆうしょくのちにかぞくでさいせいして、ゴールのしゅんかんをなんどもみかえした。"}, {"word": "village", "meaning_jp": "村", "pos": "名", "body": "山あいの<village>には50軒ほどの家が寄り添い、コンビニはないが、湧き水と棚田の景色が美しい。", "choices": ["村", "都会", "工業地帯", "港町"], "correct_index": 0, "explanation": "town(町)より小さい集落。", "id": "s2_337", "body_ruby": "山《やま》あいの<village>には50軒《けん》ほどの家《いえ》が寄《よ》り添《そ》い、コンビニはないが、湧《わ》き水《みず》と棚田《たなだ》の景色《けしき》が美《うつく》しい。", "choices_ruby": ["村《むら》", "都会《とかい》", "工業地帯《こうぎょうちたい》", "港町《みなとまち》"], "explanation_ruby": "town(町《まち》)より小《ちい》さい集落《しゅうらく》。", "body_kana": "やまあいの<village>には50けんほどのいえがよりそい、コンビニはないが、わきみずとたなだのけしきがうつくしい。"}, {"word": "visitor", "meaning_jp": "訪問者、来園者", "pos": "名", "body": "この動物園は桜の季節になると、1日1万人を超える<visitor>でにぎわう。", "choices": ["訪問者", "飼育員", "獣医", "警備員"], "correct_index": 0, "explanation": "visit(訪れる)+ -or(人)。", "id": "s2_338", "body_ruby": "この動物園《どうぶつえん》は桜《さくら》の季節《きせつ》になると、1日《にち》1万人《まんにん》を超《こ》える<visitor>でにぎわう。", "choices_ruby": ["訪問者《ほうもんしゃ》", "飼育員《しいくいん》", "獣医《じゅうい》", "警備員《けいびいん》"], "explanation_ruby": "visit(訪《おとず》れる)+ -or(人《にん》)。", "body_kana": "このどうぶつえんはさくらのきせつになると、1日1まんにんをこえる<visitor>でにぎわう。"}, {"word": "wait", "meaning_jp": "待つ", "pos": "動", "body": "人気のラーメン店は行列ができていて、席に着くまで40分も<wait>した。スープは並んだ甲斐のある味だった。", "choices": ["待つ", "帰る", "急ぐ", "注文する"], "correct_index": 0, "explanation": "wait for ~ = 〜を待つ。Wait a minute! = ちょっと待って!", "id": "s2_339", "body_ruby": "人気《にんき》のラーメン店《みせ》は行列《ぎょうれつ》ができていて、席《せき》に着《つ》くまで40分《ふん》も<wait>した。スープは並《なら》んだ甲斐《かい》のある味《あじ》だった。", "choices_ruby": ["待《ま》つ", "帰《かえ》る", "急《いそ》ぐ", "注文《ちゅうもん》する"], "explanation_ruby": "wait for ~ = 〜を待《ま》つ。Wait a minute! = ちょっと待《ま》って!", "body_kana": "にんきのラーメンみせはぎょうれつができていて、せきにつくまで40分も<wait>した。スープはならんだかいのあるあじだった。"}, {"word": "war", "meaning_jp": "戦争", "pos": "名", "body": "祖父の子ども時代は<war>のさなかで、食べ物が配給制になり、夜は灯りを消して過ごしたという。", "choices": ["戦争", "平和", "祭り", "選挙"], "correct_index": 0, "explanation": "peace(平和)の対。world war = 世界大戦。", "id": "s2_340", "body_ruby": "祖父《そふ》の子《こ》ども時代《じだい》は<war>のさなかで、｜食べ物《たべもの》が配給《はいきゅう》制《せい》になり、夜《よる》は灯《あか》りを消《け》して過《す》ごしたという。", "choices_ruby": ["戦争《せんそう》", "平和《へいわ》", "祭《まつ》り", "選挙《せんきょ》"], "explanation_ruby": "peace(平和《へいわ》)の対《つい》。world war = 世界大戦《せかいたいせん》。", "body_kana": "そふのこどもじだいは<war>のさなかで、たべものがはいきゅうせいになり、よるはあかりをけしてすごしたという。"}, {"word": "warm", "meaning_jp": "暖かい", "pos": "形", "body": "3月に入り、コートがいらないほど<warm>な日が増えてきた。花壇のチューリップも芽を出した。", "choices": ["暖かい", "寒い", "暑すぎる", "涼しい"], "correct_index": 0, "explanation": "hot ほど暑くない心地よさ。cool(涼しい)と対。", "id": "s2_341", "body_ruby": "3月《がつ》に入《はい》り、コートがいらないほど<warm>な日《ひ》が増《ふ》えてきた。花壇《かだん》のチューリップも芽《め》を出《だ》した。", "choices_ruby": ["暖《あたた》かい", "寒《さむ》い", "暑《あつ》すぎる", "涼《すず》しい"], "explanation_ruby": "hot ほど暑《あつ》くない心地《ここち》よさ。cool(涼《すず》しい)と対《つい》。", "body_kana": "3月にはいり、コートがいらないほど<warm>なひがふえてきた。かだんのチューリップもめをだした。"}, {"word": "warming", "meaning_jp": "温暖化", "pos": "名", "body": "地球の<warming>が進むと、氷河がとけて海面が上がり、低い土地の島国が水没する恐れがある。", "choices": ["温暖化", "寒冷化", "乾燥化", "砂漠化"], "correct_index": 0, "explanation": "global warming = 地球温暖化。", "id": "s2_342", "body_ruby": "地球《ちきゅう》の<warming>が進《すす》むと、氷河《ひょうが》がとけて海面《かいめん》が上《あ》がり、低《ひく》い土地《とち》の島《しま》国《くに》が水没《すいぼつ》する恐《おそ》れがある。", "choices_ruby": ["温暖化《おんだんか》", "寒冷《かんれい》化《か》", "乾燥《かんそう》化《か》", "砂漠《さばく》化《か》"], "explanation_ruby": "global warming = 地球温暖化《ちきゅうおんだんか》。", "body_kana": "ちきゅうの<warming>がすすむと、ひょうががとけてかいめんがあがり、ひくいとちのしまくにがすいぼつするおそれがある。"}, {"word": "way", "meaning_jp": "道、方法", "pos": "名", "body": "駅への<way>をたずねられたので、「2つ目の信号を右です」と地図を描いて教えてあげた。", "choices": ["道", "切符", "時刻", "値段"], "correct_index": 0, "explanation": "「方法」の意味も(the way to ~ = 〜のやり方)。", "id": "s2_343", "body_ruby": "駅《えき》への<way>をたずねられたので、「2つ目《め》の信号《しんごう》を右《みぎ》です」と地図《ちず》を描《えが》いて教《おし》えてあげた。", "choices_ruby": ["道《みち》", "切符《きっぷ》", "時刻《じこく》", "値段《ねだん》"], "explanation_ruby": "「方法《ほうほう》」の意味《いみ》も(the way to ~ = 〜のやり方《ほう》)。", "body_kana": "えきへの<way>をたずねられたので、「2つめのしんごうをみぎです」とちずをえがいておしえてあげた。"}, {"word": "weather", "meaning_jp": "天気", "pos": "名", "body": "山の<weather>は変わりやすく、さっきまでの青空が、30分後には霧と小雨に変わっていた。", "choices": ["天気", "地形", "気温だけ", "標高"], "correct_index": 0, "explanation": "weather forecast = 天気予報。", "id": "s2_344", "body_ruby": "山《やま》の<weather>は変《か》わりやすく、さっきまでの青《あお》空《そら》が、30分《ふん》後《のち》には霧《きり》と小雨《こさめ》に変《か》わっていた。", "choices_ruby": ["天気《てんき》", "地形《ちけい》", "気温《きおん》だけ", "標高《ひょうこう》"], "explanation_ruby": "weather forecast = 天気予報《てんきよほう》。", "body_kana": "やまの<weather>はかわりやすく、さっきまでのあおそらが、30分のちにはきりとこさめにかわっていた。"}, {"word": "western", "meaning_jp": "西洋の、西の", "pos": "形", "body": "明治時代になると、ちょんまげを切り、<western>な服装や建物が日本に一気に広まった。", "choices": ["西洋の", "東洋の", "古代の", "未来の"], "correct_index": 0, "explanation": "west(西)+ -ern。Western food = 洋食。", "id": "s2_345", "body_ruby": "明治時代《めいじじだい》になると、ちょんまげを切《き》り、<western>な服装《ふくそう》や建物《たてもの》が日本《にっぽん》に一気《いっき》に広《ひろ》まった。", "choices_ruby": ["西洋《せいよう》の", "東洋《とうよう》の", "古代《こだい》の", "未来《みらい》の"], "explanation_ruby": "west(西《にし》)+ -ern。Western food = 洋食《ようしょく》。", "body_kana": "めいじじだいになると、ちょんまげをきり、<western>なふくそうやたてものがにっぽんにいっきにひろまった。"}, {"word": "wide", "meaning_jp": "幅の広い", "pos": "形", "body": "この川は対岸まで200メートルもある<wide>な流れで、橋を渡るだけで3分かかる。", "choices": ["幅の広い", "幅のせまい", "浅い", "短い"], "correct_index": 0, "explanation": "narrow(せまい)の対。widely = 広く。", "id": "s2_346", "body_ruby": "この川《かわ》は対岸《たいがん》まで200メートルもある<wide>な流《なが》れで、橋《はし》を渡《わた》るだけで3分《ふん》かかる。", "choices_ruby": ["幅《はば》の広《ひろ》い", "幅《はば》のせまい", "浅《あさ》い", "短《みじか》い"], "explanation_ruby": "narrow(せまい)の対《つい》。widely = 広《ひろ》く。", "body_kana": "このかわはたいがんまで200メートルもある<wide>なながれで、はしをわたるだけで3分かかる。"}, {"word": "wonder", "meaning_jp": "不思議に思う", "pos": "動", "body": "夜空を見上げるたび、星の向こうに何があるのだろうと<wonder>する。図鑑を読んでも謎は深まるばかりだ。", "choices": ["不思議に思う", "断言する", "暗記する", "計算する"], "correct_index": 0, "explanation": "I wonder why ~ = なぜ〜なのだろう。", "id": "s2_347", "body_ruby": "夜《よる》空《そら》を見上《みあ》げるたび、星《ほし》の向《む》こうに何《なに》があるのだろうと<wonder>する。図鑑《ずかん》を読《よ》んでも謎《なぞ》は深《ふか》まるばかりだ。", "choices_ruby": ["不思議《ふしぎ》に思《おも》う", "断言《だんげん》する", "暗記《あんき》する", "計算《けいさん》する"], "explanation_ruby": "I wonder why ~ = なぜ〜なのだろう。", "body_kana": "よるそらをみあげるたび、ほしのむこうになにがあるのだろうと<wonder>する。ずかんをよんでもなぞはふかまるばかりだ。"}, {"word": "wonderful", "meaning_jp": "すばらしい", "pos": "形", "body": "山頂から見た日の出は、雲の海が金色に輝く<wonderful>な眺めで、寒さも眠気も吹き飛んだ。", "choices": ["すばらしい", "ひどい", "普通の", "こわい"], "correct_index": 0, "explanation": "wonder(驚き)+ -ful。", "id": "s2_348", "body_ruby": "山頂《さんちょう》から見《み》た｜日の出《ひので》は、雲《くも》の海《うみ》が金色《きんいろ》に輝《かがや》く<wonderful>な眺《なが》めで、寒《さむ》さも眠気《ねむけ》も吹《ふ》き飛《と》んだ。", "choices_ruby": ["すばらしい", "ひどい", "普通《ふつう》の", "こわい"], "explanation_ruby": "wonder(驚《おどろ》き)+ -ful。", "body_kana": "さんちょうからみたひのでは、くものうみがきんいろにかがやく<wonderful>なながめで、さむさもねむけもふきとんだ。"}, {"word": "word", "meaning_jp": "単語、言葉", "pos": "名", "body": "英語の小テストでは、毎回新しい<word>を10個ずつ覚える。つづりと意味の両方が出題される。", "choices": ["単語", "文章", "段落", "物語"], "correct_index": 0, "explanation": "言葉のいちばん小さなまとまり。", "id": "s2_349", "body_ruby": "英語《えいご》の小《しょう》テストでは、毎回《まいかい》新《あたら》しい<word>を10個《こ》ずつ覚《おぼ》える。つづりと意味《いみ》の両方《りょうほう》が出題《しゅつだい》される。", "choices_ruby": ["単語《たんご》", "文章《ぶんしょう》", "段落《だんらく》", "物語《ものがたり》"], "explanation_ruby": "言葉《ことば》のいちばん小《ちい》さなまとまり。", "body_kana": "えいごのしょうテストでは、まいかいあたらしい<word>を10個ずつおぼえる。つづりといみのりょうほうがしゅつだいされる。"}, {"word": "world", "meaning_jp": "世界", "pos": "名", "body": "オリンピックには<world>中から200を超える国と地域の選手が集まり、力を競い合う。", "choices": ["世界", "日本", "宇宙", "大陸"], "correct_index": 0, "explanation": "all over the world = 世界中で。", "id": "s2_350", "body_ruby": "オリンピックには<world>中《なか》から200を超《こ》える国《くに》と地域《ちいき》の選手《せんしゅ》が集《あつ》まり、力《ちから》を競《きそ》い合《あ》う。", "choices_ruby": ["世界《せかい》", "日本《にっぽん》", "宇宙《うちゅう》", "大陸《たいりく》"], "explanation_ruby": "all over the world = 世界中《せかいじゅう》で。", "body_kana": "オリンピックには<world>なかから200をこえるくにとちいきのせんしゅがあつまり、ちからをきそいあう。"}, {"word": "worry", "meaning_jp": "心配する", "pos": "動", "body": "帰りが遅くなって、母がずっと<worry>していた。玄関を開けると、ほっとした顔で迎えてくれた。", "choices": ["心配する", "安心する", "喜ぶ", "忘れる"], "correct_index": 0, "explanation": "Don't worry. = 心配しないで。", "id": "s2_351", "body_ruby": "帰《かえ》りが遅《おそ》くなって、母《はは》がずっと<worry>していた。玄関《げんかん》を開《ひら》けると、ほっとした顔《かお》で迎《むか》えてくれた。", "choices_ruby": ["心配《しんぱい》する", "安心《あんしん》する", "喜《よろこ》ぶ", "忘《わす》れる"], "explanation_ruby": "Don't worry. = 心配《しんぱい》しないで。", "body_kana": "かえりがおそくなって、ははがずっと<worry>していた。げんかんをひらけると、ほっとしたかおでむかえてくれた。"}, {"word": "worse", "meaning_jp": "より悪い", "pos": "形", "body": "昨日は鼻水だけだったのに、今日は熱まで出てきた。風邪は治るどころか<worse>になっている。", "choices": ["より悪い", "より良い", "同じままの", "治った"], "correct_index": 0, "explanation": "bad の比較級。bad-worse-worst。", "id": "s2_352", "body_ruby": "昨日《きのう》は鼻水《はなみず》だけだったのに、今日《きょう》は熱《ねつ》まで出《で》てきた。風邪《かぜ》は治《なお》るどころか<worse>になっている。", "choices_ruby": ["より悪《わる》い", "より良《よ》い", "同《おな》じままの", "治《なお》った"], "explanation_ruby": "bad の比較《ひかく》級《きゅう》。bad-worse-worst。", "body_kana": "きのうははなみずだけだったのに、きょうはねつまででてきた。かぜはなおるどころか<worse>になっている。"}, {"word": "worst", "meaning_jp": "最も悪い", "pos": "形", "body": "今回の数学は28点で、入学してから受けたテストの中で<worst>の点数だった。次は挽回したい。", "choices": ["最も悪い", "最も良い", "平均の", "2番目に良い"], "correct_index": 0, "explanation": "bad の最上級。the worst = 最悪。", "id": "s2_353", "body_ruby": "今回《こんかい》の数学《すうがく》は28点《てん》で、入学《にゅうがく》してから受《う》けたテストの中《なか》で<worst>の点数《てんすう》だった。次《つぎ》は挽回《ばんかい》したい。", "choices_ruby": ["最《もっと》も悪《わる》い", "最《もっと》も良《よ》い", "平均《へいきん》の", "2番目《ばんめ》に良《よ》い"], "explanation_ruby": "bad の最上級《さいじょうきゅう》。the worst = 最悪《さいあく》。", "body_kana": "こんかいのすうがくは28点で、にゅうがくしてからうけたテストのなかで<worst>のてんすうだった。つぎはばんかいしたい。"}, {"word": "worth", "meaning_jp": "価値がある", "pos": "形", "body": "テレビの鑑定番組で、蔵から出てきた古い壺に100万円の<worth>があると分かり、家族は大騒ぎになった。", "choices": ["価値", "重さ", "高さ", "古さ"], "correct_index": 0, "explanation": "be worth ~ing = 〜する価値がある。", "id": "s2_354", "body_ruby": "テレビの鑑定《かんてい》番組《ばんぐみ》で、蔵《くら》から出《で》てきた古《ふる》い壺《つぼ》に100万円《まんえん》の<worth>があると分《わ》かり、家族《かぞく》は大騒《おおさわ》ぎになった。", "choices_ruby": ["価値《かち》", "重《おも》さ", "高《たか》さ", "古《ふる》さ"], "explanation_ruby": "be worth ~ing = 〜する価値《かち》がある。", "body_kana": "テレビのかんていばんぐみで、くらからでてきたふるいつぼに100まんえんの<worth>があるとわかり、かぞくはおおさわぎになった。"}, {"word": "wow", "meaning_jp": "わあ(驚きの声)", "pos": "間", "body": "一面の雪景色を窓から見た瞬間、思わず「<wow>!」と声が出た。昨夜のうちに30センチも積もっていた。", "choices": ["わあ", "おやすみ", "ただいま", "もしもし"], "correct_index": 0, "explanation": "驚き・感動を表す感嘆の声。", "id": "s2_355", "body_ruby": "一面《いちめん》の雪景色《ゆきげしき》を窓《まど》から見《み》た瞬間《しゅんかん》、思《おも》わず「<wow>!」と声《こえ》が出《で》た。昨夜《さくや》のうちに30センチも積《つ》もっていた。", "choices_ruby": ["わあ", "おやすみ", "ただいま", "もしもし"], "explanation_ruby": "驚《おどろ》き・感動《かんどう》を表《あらわ》す感嘆《かんたん》の声《こえ》。", "body_kana": "いちめんのゆきげしきをまどからみたしゅんかん、おもわず「<wow>!」とこえがでた。さくやのうちに30センチもつもっていた。"}, {"word": "writing", "meaning_jp": "書くこと、文章", "pos": "名", "body": "国語の授業では週に1回、テーマを決めて400字の<writing>に取り組む。今週のお題は「私の宝物」だ。", "choices": ["書くこと", "読むこと", "話すこと", "聞くこと"], "correct_index": 0, "explanation": "write + -ing。4技能の一つ(reading / listening / speaking と並ぶ)。", "id": "s2_356", "body_ruby": "国語《こくご》の授業《じゅぎょう》では週《しゅう》に1回《かい》、テーマを決《き》めて400字《じ》の<writing>に｜取り組《とりく》む。今週《こんしゅう》のお題《だい》は「私《わたし》の宝物《たからもの》」だ。", "choices_ruby": ["書《か》くこと", "読《よ》むこと", "話《はな》すこと", "聞《き》くこと"], "explanation_ruby": "write + -ing。4技能《ぎのう》の一《ひと》つ(reading / listening / speaking と並《なら》ぶ)。", "body_kana": "こくごのじゅぎょうではしゅうに1回、テーマをきめて400じの<writing>にとりくむ。こんしゅうのおだいは「わたしのたからもの」だ。"}, {"word": "written", "meaning_jp": "書かれた", "pos": "動", "body": "この石碑には、100年前の大津波の高さと教訓が<written>されていて、今も登下校の道で目にする。", "choices": ["書かれている", "消されている", "話されている", "歌われている"], "correct_index": 0, "explanation": "write の過去分詞。write-wrote-written。", "id": "s2_357", "body_ruby": "この石碑《せきひ》には、100年《ねん》前《まえ》の｜大津波《おおつなみ》の高《たか》さと教訓《きょうくん》が<written>されていて、今《いま》も登下校《とうげこう》の道《みち》で目《め》にする。", "choices_ruby": ["書《か》かれている", "消《け》されている", "話《はな》されている", "歌《うた》われている"], "explanation_ruby": "write の過去分詞《かこぶんし》。write-wrote-written。", "body_kana": "このせきひには、100年まえのおおつなみのたかさときょうくんが<written>されていて、いまもとうげこうのみちでめにする。"}, {"word": "young", "meaning_jp": "若い", "pos": "形", "body": "アルバムの中の祖父は、今の父より<young>で、黒々とした髪に学生服姿で写っていた。", "choices": ["若い", "年老いた", "背が高い", "太った"], "correct_index": 0, "explanation": "old(年取った)の対。the young = 若者たち。", "id": "s2_358", "body_ruby": "アルバムの中《なか》の祖父《そふ》は、今《いま》の父《ちち》より<young>で、黒々《くろぐろ》とした髪《かみ》に学生服《がくせいふく》姿《すがた》で写《うつ》っていた。", "choices_ruby": ["若《わか》い", "年老《としお》いた", "背《せ》が高《たか》い", "太《ふと》った"], "explanation_ruby": "old(年《ねん》取《と》った)の対《つい》。the young = 若者《わかもの》たち。", "body_kana": "アルバムのなかのそふは、いまのちちより<young>で、くろぐろとしたかみにがくせいふくすがたでうつっていた。"}, {"id": "s2_359", "word": "ancestor", "meaning_jp": "先祖", "pos": "名", "body": "祖父の話によると、私たちの <ancestor> は江戸時代から東北で暮らしていたそうです。", "choices": ["子孫", "隣人", "先祖", "親友"], "correct_index": 2, "explanation": "ante-(前)+ cest(行く)で「前を行く者=先祖」。", "body_ruby": "祖父《そふ》の話《はなし》によると、私《わたし》たちの <ancestor> は江戸時代《えどじだい》から東北《とうほく》で暮《く》らしていたそうです。", "choices_ruby": ["子孫《しそん》", "隣人《りんじん》", "先祖《せんぞ》", "親友《しんゆう》"], "explanation_ruby": "ante-(前《まえ》)+ cest(行《い》く)で「前《まえ》を行《い》く者《もの》=先祖《せんぞ》」。", "body_kana": "そふのはなしによると、わたしたちの <ancestor> はえどじだいからとうほくでくらしていたそうです。"}, {"word": "belt", "meaning_jp": "ベルト", "pos": "名", "body": "ズボンがゆるいので、ウエストに革製の<belt>を巻いて落ちないようにした。腰に締める細長い帯だ。", "choices": ["ベルト", "靴下", "シャツ", "帽子"], "correct_index": 0, "explanation": "腰回りに巻く帯。seat belt(シートベルト)も同じ語。", "id": "s2_360", "body_ruby": "ズボンがゆるいので、ウエストに革製《かわせい》の<belt>を巻《ま》いて落《お》ちないようにした。腰《こし》に締《し》める細長《ほそなが》い帯《おび》だ。", "choices_ruby": ["ベルト", "靴下《くつした》", "シャツ", "帽子《ぼうし》"], "explanation_ruby": "腰《こし》回《まわ》りに巻《ま》く帯《おび》。seat belt(シートベルト)も同《おな》じ語《ご》。", "body_kana": "ズボンがゆるいので、ウエストにかわせいの<belt>をまいておちないようにした。こしにしめるほそながいおびだ。"}, {"word": "calendar", "meaning_jp": "カレンダー", "pos": "名", "body": "1月から12月までの予定を書き込む<calendar>を、机の上に置いて毎日確認している。日付や曜日が一目で分かる。", "choices": ["カレンダー", "時計", "ノート", "辞書"], "correct_index": 0, "explanation": "1年の日付を表示する暦。", "id": "s2_361", "body_ruby": "1月《がつ》から12月《がつ》までの予定《よてい》を｜書き込《かきこ》む<calendar>を、机《つくえ》の上《うえ》に置《お》いて毎日《まいにち》確認《かくにん》している。日付《ひづけ》や曜日《ようび》が一目《いちもく》で分《わ》かる。", "choices_ruby": ["カレンダー", "時計《とけい》", "ノート", "辞書《じしょ》"], "explanation_ruby": "1年《ねん》の日付《ひづけ》を表示《ひょうじ》する暦《こよみ》。", "body_kana": "1月から12月までのよていをかきこむ<calendar>を、つくえのうえにおいてまいにちかくにんしている。ひづけやようびがいちもくでわかる。"}, {"word": "clerk", "meaning_jp": "店員", "pos": "名", "body": "本屋でレジに立っている<clerk>に、探している小説の場所を尋ねたら、3階の奥まで案内してくれた。", "choices": ["店員", "客", "経営者", "学生"], "correct_index": 0, "explanation": "店や事務所で接客・事務を行う人。", "id": "s2_362", "body_ruby": "本屋《ほんや》でレジに立《た》っている<clerk>に、探《さが》している小説《しょうせつ》の場所《ばしょ》を尋《たず》ねたら、3階《かい》の奥《おく》まで案内《あんない》してくれた。", "choices_ruby": ["店員《てんいん》", "客《きゃく》", "経営者《けいえいしゃ》", "学生《がくせい》"], "explanation_ruby": "店《みせ》や事務所《じむしょ》で接客《せっきゃく》・事務《じむ》を行《おこな》う人《にん》。", "body_kana": "ほんやでレジにたっている<clerk>に、さがしているしょうせつのばしょをたずねたら、3階のおくまであんないしてくれた。"}, {"word": "coin", "meaning_jp": "硬貨", "pos": "名", "body": "おばあちゃんが、お年玉の中に銀色の100円<coin>を10枚入れてくれた。", "choices": ["硬貨", "紙幣", "クレジットカード", "切手"], "correct_index": 0, "explanation": "金属製のお金。紙のお金は bill(米)/note(英)。", "id": "s2_363", "body_ruby": "おばあちゃんが、お年玉《としだま》の中《なか》に銀色《ぎんいろ》の100円《えん》<coin>を10枚《まい》入《い》れてくれた。", "choices_ruby": ["硬貨《こうか》", "紙幣《しへい》", "クレジットカード", "切手《きって》"], "explanation_ruby": "金属製《きんぞくせい》のお金《かね》。紙《かみ》のお金《かね》は bill(米《こめ》)/note(英《えい》)。", "body_kana": "おばあちゃんが、おとしだまのなかにぎんいろの100円<coin>を10枚いれてくれた。"}, {"word": "country", "meaning_jp": "国", "pos": "名", "body": "世界には日本やアメリカや中国など、独自の言語や文化を持つ200近くの<country>がある。それぞれが政府を持っている。", "choices": ["国", "県", "市", "街"], "correct_index": 0, "explanation": "「田舎」の意味もある(in the country = 田舎で)。", "id": "s2_364", "body_ruby": "世界《せかい》には日本《にっぽん》やアメリカや中国《ちゅうごく》など、独自《どくじ》の言語《げんご》や文化《ぶんか》を持《も》つ200近《ちか》くの<country>がある。それぞれが政府《せいふ》を持《も》っている。", "choices_ruby": ["国《くに》", "県《けん》", "市《し》", "街《まち》"], "explanation_ruby": "「田舎《いなか》」の意味《いみ》もある(in the country = 田舎《いなか》で)。", "body_kana": "せかいにはにっぽんやアメリカやちゅうごくなど、どくじのげんごやぶんかをもつ200ちかくの<country>がある。それぞれがせいふをもっている。"}, {"word": "curry", "meaning_jp": "カレー", "pos": "名", "body": "土曜日の昼食は、母が圧力鍋で2時間煮込んだスパイスのきいた<curry>で、ご飯に大量にかけて食べる。", "choices": ["カレー", "ラーメン", "うどん", "ピザ"], "correct_index": 0, "explanation": "インド料理由来。日本では「カレーライス」が定番。", "id": "s2_365", "body_ruby": "土曜日《どようび》の昼食《ちゅうしょく》は、母《はは》が圧力鍋《あつりょくなべ》で2時間《じかん》煮込《にこ》んだスパイスのきいた<curry>で、ご飯《めし》に大量《たいりょう》にかけて食《た》べる。", "choices_ruby": ["カレー", "ラーメン", "うどん", "ピザ"], "explanation_ruby": "インド料理《りょうり》由来《ゆらい》。日本《にっぽん》では「カレーライス」が定番《ていばん》。", "body_kana": "どようびのちゅうしょくは、ははがあつりょくなべで2時間にこんだスパイスのきいた<curry>で、ごめしにたいりょうにかけてたべる。"}, {"word": "disappear", "meaning_jp": "消える", "pos": "動", "body": "朝靄(あさもや)に包まれていた湖は、太陽が昇るにつれて少しずつ霧が<disappear>し、青い水面がはっきり姿を現した。", "choices": ["消える", "現れる", "増える", "止まる"], "correct_index": 0, "explanation": "dis-(否定)+ appear(現れる)= 消える。appear の対義語。", "id": "s2_366", "body_ruby": "朝靄《あさもや》(あさもや)に包《つつ》まれていた湖《みずうみ》は、太陽《たいよう》が昇《のぼ》るにつれて少《すこ》しずつ霧《きり》が<disappear>し、青《あお》い水面《すいめん》がはっきり姿《すがた》を現《あらわ》した。", "choices_ruby": ["消《き》える", "現《あらわ》れる", "増《ふ》える", "止《と》まる"], "explanation_ruby": "dis-(否定《ひてい》)+ appear(現《あらわ》れる)= 消《き》える。appear の対義《たいぎ》語《ご》。", "body_kana": "あさもや(あさもや)につつまれていたみずうみは、たいようがのぼるにつれてすこしずつきりが<disappear>し、あおいすいめんがはっきりすがたをあらわした。"}, {"word": "easily", "meaning_jp": "簡単に", "pos": "副", "body": "この問題は数字を入れ替えるだけなので、5分以内で誰でも<easily>解けるだろう。", "choices": ["簡単に", "難しく", "ゆっくり", "急いで"], "correct_index": 0, "explanation": "easy(簡単な)+ -ly(副詞化)。", "id": "s2_367", "body_ruby": "この問題《もんだい》は数字《すうじ》を入《い》れ替《か》えるだけなので、5分《ふん》以内《いない》で誰《だれ》でも<easily>解《と》けるだろう。", "choices_ruby": ["簡単《かんたん》に", "難《むずか》しく", "ゆっくり", "急《いそ》いで"], "explanation_ruby": "easy(簡単《かんたん》な)+ -ly(副詞《ふくし》化《か》)。", "body_kana": "このもんだいはすうじをいれかえるだけなので、5分いないでだれでも<easily>とけるだろう。"}, {"word": "elephant", "meaning_jp": "象", "pos": "名", "body": "動物園で見た灰色の大きな<elephant>は、長い鼻でりんごを器用につかんで口に運んでいた。", "choices": ["象", "キリン", "カバ", "サイ"], "correct_index": 0, "explanation": "trunk = 鼻、tusk = 牙。", "id": "s2_368", "body_ruby": "動物園《どうぶつえん》で見《み》た灰色《はいいろ》の大《おお》きな<elephant>は、長《なが》い鼻《はな》でりんごを器用《きよう》につかんで口《くち》に運《はこ》んでいた。", "choices_ruby": ["象《ぞう》", "キリン", "カバ", "サイ"], "explanation_ruby": "trunk = 鼻《はな》、tusk = 牙《きば》。", "body_kana": "どうぶつえんでみたはいいろのおおきな<elephant>は、ながいはなでりんごをきようにつかんでくちにはこんでいた。"}, {"word": "fall", "meaning_jp": "落ちる、秋", "pos": "動/名", "body": "強い風が吹いて、机の上にあった教科書が床に<fall>してしまった。", "choices": ["落ちる", "登る", "投げる", "止まる"], "correct_index": 0, "explanation": "fall-fell-fallen。アメリカ英語で「秋」の意味も。", "id": "s2_369", "body_ruby": "強《つよ》い風《かぜ》が吹《ふ》いて、机《つくえ》の上《うえ》にあった教科書《きょうかしょ》が床《ゆか》に<fall>してしまった。", "choices_ruby": ["落《お》ちる", "登《のぼ》る", "投《な》げる", "止《と》まる"], "explanation_ruby": "fall-fell-fallen。アメリカ英語《えいご》で「秋《あき》」の意味《いみ》も。", "body_kana": "つよいかぜがふいて、つくえのうえにあったきょうかしょがゆかに<fall>してしまった。"}, {"word": "far", "meaning_jp": "遠くに", "pos": "副", "body": "私の家から学校までは自転車で20分、歩くと50分もかかるくらい<far>なので、毎朝早起きする必要がある。", "choices": ["遠くに", "近くに", "高くに", "深くに"], "correct_index": 0, "explanation": "near(近い)の対義語。How far ~? = どれくらい遠いか。", "id": "s2_370", "body_ruby": "私《わたし》の家《いえ》から学校《がっこう》までは自転車《じてんしゃ》で20分《ふん》、歩《ある》くと50分《ふん》もかかるくらい<far>なので、毎朝《まいあさ》早起《はやお》きする必要《ひつよう》がある。", "choices_ruby": ["遠《とお》くに", "近《ちか》くに", "高《たか》くに", "深《ふか》くに"], "explanation_ruby": "near(近《ちか》い)の対義《たいぎ》語《ご》。How far ~? = どれくらい遠《とお》いか。", "body_kana": "わたしのいえからがっこうまではじてんしゃで20分、あるくと50分もかかるくらい<far>なので、まいあさはやおきするひつようがある。"}, {"word": "follow", "meaning_jp": "ついて行く、従う", "pos": "動", "body": "迷子になった子犬の後を、5人の友達が10分間ずっと<follow>して、安全な場所まで連れて行った。", "choices": ["ついて行く", "先導する", "止める", "逃げる"], "correct_index": 0, "explanation": "Follow me. = 私についてきて。lead(先導する)の対。", "id": "s2_371", "body_ruby": "迷子《まいご》になった子犬《こいぬ》の後《あと》を、5人《にん》の友達《ともだち》が10分間《ふんかん》ずっと<follow>して、安全《あんぜん》な場所《ばしょ》まで連《つ》れて行《い》った。", "choices_ruby": ["ついて行《い》く", "先導《せんどう》する", "止《や》める", "逃《に》げる"], "explanation_ruby": "Follow me. = 私《わたし》についてきて。lead(先導《せんどう》する)の対《つい》。", "body_kana": "まいごになったこいぬのあとを、5人のともだちが10分間ずっと<follow>して、あんぜんなばしょまでつれていった。"}, {"word": "forward", "meaning_jp": "前へ", "pos": "副", "body": "「<forward>!」と監督に号令をかけられて、選手たちは一斉に前方のゴール方向に駆け出した。後ろではなく前の方向だ。", "choices": ["前へ", "後ろへ", "右へ", "左へ"], "correct_index": 0, "explanation": "fore(前)+ -ward(方向)。backward(後ろへ)の対。", "id": "s2_372", "body_ruby": "「<forward>!」と監督《かんとく》に号令《ごうれい》をかけられて、選手《せんしゅ》たちは一斉《いっせい》に前方《ぜんぽう》のゴール方向《ほうこう》に駆《か》け出《だ》した。後《うし》ろではなく前《まえ》の方向《ほうこう》だ。", "choices_ruby": ["前《まえ》へ", "後《うし》ろへ", "右《みぎ》へ", "左《ひだり》へ"], "explanation_ruby": "fore(前《まえ》)+ -ward(方向《ほうこう》)。backward(後《うし》ろへ)の対《つい》。", "body_kana": "「<forward>!」とかんとくにごうれいをかけられて、せんしゅたちはいっせいにぜんぽうのゴールほうこうにかけだした。うしろではなくまえのほうこうだ。"}, {"word": "hundred", "meaning_jp": "100", "pos": "名/形", "body": "今日の英語のテストで全問正解して、答案用紙の右上に大きく赤い<hundred>と書かれていた。母はケーキを買って祝ってくれた。", "choices": ["100", "10", "1000", "50"], "correct_index": 0, "explanation": "two hundred = 200、a hundred years = 100年。", "id": "s2_373", "body_ruby": "今日《きょう》の英語《えいご》のテストで全問正解《ぜんもんせいかい》して、答案《とうあん》用紙《ようし》の右上《みぎうえ》に大《おお》きく赤《あか》い<hundred>と書《か》かれていた。母《はは》はケーキを買《か》って祝《いわ》ってくれた。", "choices_ruby": ["100", "10", "1000", "50"], "explanation_ruby": "two hundred = 200、a hundred years = 100年《ねん》。", "body_kana": "きょうのえいごのテストでぜんもんせいかいして、とうあんようしのみぎうえにおおきくあかい<hundred>とかかれていた。はははケーキをかっていわってくれた。"}, {"word": "junior", "meaning_jp": "年下の、中学の", "pos": "形", "body": "私が通っている<junior>ハイスクールは、小学校を卒業した12歳から15歳の生徒が通う、義務教育の後半の学校だ。", "choices": ["中学の(年下の)", "高校の", "大学の", "小学校の"], "correct_index": 0, "explanation": "junior high school = 中学校。senior(年上の)の対。", "id": "s2_374", "body_ruby": "私《わたし》が通《かよ》っている<junior>ハイスクールは、小学校《しょうがっこう》を卒業《そつぎょう》した12歳《さい》から15歳《さい》の生徒《せいと》が通《かよ》う、義務教育《ぎむきょういく》の後《あと》半《はん》の学校《がっこう》だ。", "choices_ruby": ["中学《ちゅうがく》の(年下《としした》の)", "高校《こうこう》の", "大学《だいがく》の", "小学校《しょうがっこう》の"], "explanation_ruby": "junior high school = 中学校《ちゅうがっこう》。senior(年上《としうえ》の)の対《つい》。", "body_kana": "わたしがかよっている<junior>ハイスクールは、しょうがっこうをそつぎょうした12歳から15歳のせいとがかよう、ぎむきょういくのあとはんのがっこうだ。"}, {"word": "kilometer", "meaning_jp": "キロメートル", "pos": "名", "body": "私の家から駅までは2<kilometer>離れていて、徒歩で30分かかる。", "choices": ["キロメートル", "メートル", "センチメートル", "ミリメートル"], "correct_index": 0, "explanation": "kilo(1000)+ meter。略は km。", "id": "s2_375", "body_ruby": "私《わたし》の家《いえ》から駅《えき》までは2<kilometer>離《はな》れていて、徒歩《とほ》で30分《ふん》かかる。", "choices_ruby": ["キロメートル", "メートル", "センチメートル", "ミリメートル"], "explanation_ruby": "kilo(1000)+ meter。略《りゃく》は km。", "body_kana": "わたしのいえからえきまでは2<kilometer>はなれていて、とほで30分かかる。"}, {"word": "last", "meaning_jp": "最後の、この前の", "pos": "形", "body": "12月31日は1年の<last>の日で、家族で集まって紅白歌合戦を見ながら年越しそばを食べる。", "choices": ["最後の", "最初の", "次の", "途中の"], "correct_index": 0, "explanation": "first(最初)の対。last week = 先週、last night = 昨夜。", "id": "s2_376", "body_ruby": "12月《がつ》31日《にち》は1年《ねん》の<last>の日《ひ》で、家族《かぞく》で集《あつ》まって紅白歌合戦《こうはくうたがっせん》を見《み》ながら年越《としこ》しそばを食《た》べる。", "choices_ruby": ["最後《さいご》の", "最初《さいしょ》の", "次《つぎ》の", "途中《とちゅう》の"], "explanation_ruby": "first(最初《さいしょ》)の対《つい》。last week = 先週《せんしゅう》、last night = 昨夜《さくや》。", "body_kana": "12月31日は1年の<last>のひで、かぞくであつまってこうはくうたがっせんをみながらとしこしそばをたべる。"}, {"word": "lose", "meaning_jp": "失う、負ける", "pos": "動", "body": "今日のサッカーの試合で、私たちのチームは1対3で相手チームに<lose>してしまった。", "choices": ["負ける", "勝つ", "引き分ける", "辞める"], "correct_index": 0, "explanation": "win(勝つ)の対。lose-lost-lost。", "id": "s2_377", "body_ruby": "今日《きょう》のサッカーの試合《しあい》で、私《わたし》たちのチームは1対《つい》3で相手《あいて》チームに<lose>してしまった。", "choices_ruby": ["負《ま》ける", "勝《か》つ", "｜引き分《ひきわ》ける", "辞《や》める"], "explanation_ruby": "win(勝《か》つ)の対《つい》。lose-lost-lost。", "body_kana": "きょうのサッカーのしあいで、わたしたちのチームは1つい3であいてチームに<lose>してしまった。"}, {"word": "member", "meaning_jp": "メンバー、一員", "pos": "名", "body": "私が入っている吹奏楽部は、トランペット5人、フルート4人など、計30人の<member>がいる大所帯の部活だ。", "choices": ["メンバー", "監督", "観客", "敵"], "correct_index": 0, "explanation": "club member, family member など。", "id": "s2_378", "body_ruby": "私《わたし》が入《はい》っている吹奏楽部《すいそうがくぶ》は、トランペット5人《にん》、フルート4人《にん》など、計《けい》30人《にん》の<member>がいる大所帯《おおじょたい》の部活《ぶかつ》だ。", "choices_ruby": ["メンバー", "監督《かんとく》", "観客《かんきゃく》", "敵《てき》"], "explanation_ruby": "club member, family member など。", "body_kana": "わたしがはいっているすいそうがくぶは、トランペット5人、フルート4人など、けい30人の<member>がいるおおじょたいのぶかつだ。"}, {"word": "meter", "meaning_jp": "メートル", "pos": "名", "body": "学校のプールは縦が25<meter>あり、私は1往復で50回腕を使って泳ぐ。", "choices": ["メートル", "センチ", "キロメートル", "ミリ"], "correct_index": 0, "explanation": "略は m。kilometer(km)=1000m。", "id": "s2_379", "body_ruby": "学校《がっこう》のプールは縦《たて》が25<meter>あり、私《わたし》は1往復《おうふく》で50回《かい》腕《うで》を使《つか》って泳《およ》ぐ。", "choices_ruby": ["メートル", "センチ", "キロメートル", "ミリ"], "explanation_ruby": "略《りゃく》は m。kilometer(km)=1000m。", "body_kana": "がっこうのプールはたてが25<meter>あり、わたしは1おうふくで50回うでをつかっておよぐ。"}, {"word": "museum", "meaning_jp": "博物館、美術館", "pos": "名", "body": "上野の<museum>には、世界中から集められた絵画や古い化石、昔の道具などが展示されていて、見て学べる場所だ。", "choices": ["博物館", "図書館", "映画館", "水族館"], "correct_index": 0, "explanation": "art museum = 美術館、history museum = 歴史博物館。", "id": "s2_380", "body_ruby": "上野《うえの》の<museum>には、世界中《せかいじゅう》から集《あつ》められた絵画《かいが》や古《ふる》い化石《かせき》、昔《むかし》の道具《どうぐ》などが展示《てんじ》されていて、見《み》て学《まな》べる場所《ばしょ》だ。", "choices_ruby": ["博物館《はくぶつかん》", "図書館《としょかん》", "映画館《えいがかん》", "水族館《すいぞくかん》"], "explanation_ruby": "art museum = 美術館《びじゅつかん》、history museum = 歴史《れきし》博物館《はくぶつかん》。", "body_kana": "うえのの<museum>には、せかいじゅうからあつめられたかいがやふるいかせき、むかしのどうぐなどがてんじされていて、みてまなべるばしょだ。"}, {"word": "nature", "meaning_jp": "自然", "pos": "名", "body": "週末は街を離れて、山や川や森のある場所へ行き、緑に囲まれた<nature>の中で1日のんびり過ごすのが好きだ。人が作ったものではない世界だ。", "choices": ["自然", "都会", "建物", "工場"], "correct_index": 0, "explanation": "natural(自然な)、Mother Nature(母なる自然)。", "id": "s2_381", "body_ruby": "週末《しゅうまつ》は街《まち》を離《はな》れて、山《やま》や川《かわ》や森《もり》のある場所《ばしょ》へ行《い》き、緑《みどり》に囲《かこ》まれた<nature>の中《なか》で1日《にち》のんびり過《す》ごすのが好《す》きだ。人《にん》が作《つく》ったものではない世界《せかい》だ。", "choices_ruby": ["自然《しぜん》", "都会《とかい》", "建物《たてもの》", "工場《こうじょう》"], "explanation_ruby": "natural(自然《しぜん》な)、Mother Nature(母《はは》なる自然《しぜん》)。", "body_kana": "しゅうまつはまちをはなれて、やまやかわやもりのあるばしょへいき、みどりにかこまれた<nature>のなかで1日のんびりすごすのがすきだ。にんがつくったものではないせかいだ。"}, {"word": "next", "meaning_jp": "次の", "pos": "形", "body": "今日は月曜日なので、<next>の土曜日まではあと5日ある。指折り数えて週末を待っている。", "choices": ["次の", "前の", "今の", "昨日の"], "correct_index": 0, "explanation": "next week = 来週、next year = 来年。", "id": "s2_382", "body_ruby": "今日《きょう》は月曜日《げつようび》なので、<next>の土曜日《どようび》まではあと5日《にち》ある。指折《ゆびお》り数《かぞ》えて週末《しゅうまつ》を待《ま》っている。", "choices_ruby": ["次《つぎ》の", "前《まえ》の", "今《いま》の", "昨日《きのう》の"], "explanation_ruby": "next week = 来週《らいしゅう》、next year = 来年《らいねん》。", "body_kana": "きょうはげつようびなので、<next>のどようびまではあと5日ある。ゆびおりかぞえてしゅうまつをまっている。"}, {"word": "noon", "meaning_jp": "正午、お昼", "pos": "名", "body": "学校のチャイムは<noon>ちょうどに鳴る。時計の針が12時を指すと同時に、給食の準備が始まる。", "choices": ["正午", "夜中", "夕方", "朝"], "correct_index": 0, "explanation": "afternoon(午後)= after(後)+ noon(昼)。", "id": "s2_383", "body_ruby": "学校《がっこう》のチャイムは<noon>ちょうどに鳴《な》る。時計《とけい》の針《はり》が12時《じ》を指《さ》すと同時《どうじ》に、給食《きゅうしょく》の準備《じゅんび》が始《はじ》まる。", "choices_ruby": ["正午《しょうご》", "夜中《よなか》", "夕方《ゆうがた》", "朝《あさ》"], "explanation_ruby": "afternoon(午後《ごご》)= after(後《のち》)+ noon(昼《ひる》)。", "body_kana": "がっこうのチャイムは<noon>ちょうどになる。とけいのはりが12時をさすとどうじに、きゅうしょくのじゅんびがはじまる。"}, {"word": "pass", "meaning_jp": "通る、合格する", "pos": "動", "body": "兄は今年の春、難しい高校受験を頑張って勉強した結果、第一志望の高校に<pass>することができた。", "choices": ["合格する", "落ちる", "始める", "終わる"], "correct_index": 0, "explanation": "「通り過ぎる」「渡す」の意味もある(pass the salt)。", "id": "s2_384", "body_ruby": "兄《あに》は今年《ことし》の春《はる》、難《むずか》しい高校受験《こうこうじゅけん》を頑張《がんば》って勉強《べんきょう》した結果《けっか》、第一《だいいち》志望《しぼう》の高校《こうこう》に<pass>することができた。", "choices_ruby": ["合格《ごうかく》する", "落《お》ちる", "始《はじ》める", "終《お》わる"], "explanation_ruby": "「通《とお》り過《す》ぎる」「渡《わた》す」の意味《いみ》もある(pass the salt)。", "body_kana": "あにはことしのはる、むずかしいこうこうじゅけんをがんばってべんきょうしたけっか、だいいちしぼうのこうこうに<pass>することができた。"}, {"word": "plastic", "meaning_jp": "プラスチック", "pos": "名/形", "body": "スーパーで野菜を入れてもらう<plastic>の袋は、最近は環境のためにエコバッグに変える人が増えている。石油から作る人工材料だ。", "choices": ["プラスチック", "木", "鉄", "ガラス"], "correct_index": 0, "explanation": "plastic bottle = ペットボトル。", "id": "s2_385", "body_ruby": "スーパーで野菜《やさい》を入《い》れてもらう<plastic>の袋《ふくろ》は、最近《さいきん》は環境《かんきょう》のためにエコバッグに変《か》える人《にん》が増《ふ》えている。石油《せきゆ》から作《つく》る人工《じんこう》材料《ざいりょう》だ。", "choices_ruby": ["プラスチック", "木《き》", "鉄《てつ》", "ガラス"], "explanation_ruby": "plastic bottle = ペットボトル。", "body_kana": "スーパーでやさいをいれてもらう<plastic>のふくろは、さいきんはかんきょうのためにエコバッグにかえるにんがふえている。せきゆからつくるじんこうざいりょうだ。"}, {"word": "popular", "meaning_jp": "人気のある", "pos": "形", "body": "彼女はいつも明るくて誰にでも優しいので、クラスの男子からも女子からも好かれる<popular>な存在だ。", "choices": ["人気のある", "嫌われている", "目立たない", "静かな"], "correct_index": 0, "explanation": "people(人々)が語源。pop music の pop も同じ語源。", "id": "s2_386", "body_ruby": "彼女《かのじょ》はいつも明《あか》るくて誰《だれ》にでも優《やさ》しいので、クラスの男子《だんし》からも女子《じょし》からも好《す》かれる<popular>な存在《そんざい》だ。", "choices_ruby": ["人気《にんき》のある", "嫌《きら》われている", "目立《めだ》たない", "静《しず》かな"], "explanation_ruby": "people(人々《ひとびと》)が語源《ごげん》。pop music の pop も同《おな》じ語源《ごげん》。", "body_kana": "かのじょはいつもあかるくてだれにでもやさしいので、クラスのだんしからもじょしからもすかれる<popular>なそんざいだ。"}, {"word": "rock", "meaning_jp": "岩", "pos": "名", "body": "山道を登っていると、人の背丈より大きな茶色の<rock>がいくつも転がっていて、避けながら歩く必要があった。とても硬い大きな石だ。", "choices": ["岩", "土", "水", "草"], "correct_index": 0, "explanation": "stone(石)より大きい。rock music の rock も同じ綴り。", "id": "s2_387", "body_ruby": "山道《やまみち》を登《のぼ》っていると、人《にん》の背丈《せたけ》より大《おお》きな茶色《ちゃいろ》の<rock>がいくつも転《ころ》がっていて、避《さ》けながら歩《ある》く必要《ひつよう》があった。とても硬《かた》い大《おお》きな石《いし》だ。", "choices_ruby": ["岩《いわ》", "土《つち》", "水《みず》", "草《くさ》"], "explanation_ruby": "stone(石《いし》)より大《おお》きい。rock music の rock も同《おな》じ綴《つづ》り。", "body_kana": "やまみちをのぼっていると、にんのせたけよりおおきなちゃいろの<rock>がいくつもころがっていて、さけながらあるくひつようがあった。とてもかたいおおきないしだ。"}, {"word": "rope", "meaning_jp": "ロープ、綱", "pos": "名", "body": "運動会の綱引きで、2チームが太い<rope>の両端をつかんで、力いっぱい引き合う競技をした。麻や繊維をより合わせた長い紐だ。", "choices": ["ロープ", "棒", "鎖", "糸"], "correct_index": 0, "explanation": "string(細い紐)より太い。jump rope = 縄跳び。", "id": "s2_388", "body_ruby": "運動会《うんどうかい》の綱引《つなひき》きで、2チームが太《ふと》い<rope>の両端《りょうたん》をつかんで、力《ちから》いっぱい引《ひ》き合《あ》う競技《きょうぎ》をした。麻《あさ》や繊維《せんい》をより合《あ》わせた長《なが》い紐《ひも》だ。", "choices_ruby": ["ロープ", "棒《ぼう》", "鎖《くさり》", "糸《いと》"], "explanation_ruby": "string(細《こま》い紐《ひも》)より太《ふと》い。jump rope = 縄《なわ》跳《と》び。", "body_kana": "うんどうかいのつなひききで、2チームがふとい<rope>のりょうたんをつかんで、ちからいっぱいひきあうきょうぎをした。あさやせんいをよりあわせたながいひもだ。"}, {"word": "send", "meaning_jp": "送る", "pos": "動", "body": "誕生日の友達に、お祝いのメッセージカードを書いて、切手を貼って郵便で<send>することにした。", "choices": ["送る", "受け取る", "捨てる", "返す"], "correct_index": 0, "explanation": "send-sent-sent。receive(受け取る)の対。", "id": "s2_389", "body_ruby": "誕生日《たんじょうび》の友達《ともだち》に、お祝《いわ》いのメッセージカードを書《か》いて、切手《きって》を貼《は》って郵便《ゆうびん》で<send>することにした。", "choices_ruby": ["送《おく》る", "｜受け取《うけと》る", "捨《す》てる", "返《かえ》す"], "explanation_ruby": "send-sent-sent。receive(｜受け取《うけと》る)の対《つい》。", "body_kana": "たんじょうびのともだちに、おいわいのメッセージカードをかいて、きってをはってゆうびんで<send>することにした。"}, {"word": "shape", "meaning_jp": "形", "pos": "名", "body": "粘土細工の時間で、丸い<shape>のクッキーや星型のクッキーをいろいろ作って、オーブンで焼いて食べた。物の見た目の輪郭だ。", "choices": ["形", "色", "大きさ", "重さ"], "correct_index": 0, "explanation": "round shape(丸い形)、square shape(四角い形)。", "id": "s2_390", "body_ruby": "粘土《ねんど》細工《さいく》の時間《じかん》で、丸《まる》い<shape>のクッキーや星型《ほしがた》のクッキーをいろいろ作《つく》って、オーブンで焼《や》いて食《た》べた。物《もの》の｜見た目《みため》の輪郭《りんかく》だ。", "choices_ruby": ["形《かたち》", "色《いろ》", "大《おお》きさ", "重《おも》さ"], "explanation_ruby": "round shape(丸《まる》い形《かたち》)、square shape(四角《しかく》い形《かたち》)。", "body_kana": "ねんどさいくのじかんで、まるい<shape>のクッキーやほしがたのクッキーをいろいろつくって、オーブンでやいてたべた。もののみためのりんかくだ。"}, {"word": "snack", "meaning_jp": "おやつ、軽食", "pos": "名", "body": "学校から帰ってお腹が空いた午後3時に、母が用意してくれたクッキーとミルクの<snack>を食べた。食事の間の小さな食べ物だ。", "choices": ["おやつ", "朝食", "夕食", "宴会"], "correct_index": 0, "explanation": "potato chips(ポテチ)などの「スナック菓子」も。", "id": "s2_391", "body_ruby": "学校《がっこう》から帰《かえ》ってお腹《なか》が空《す》いた午後《ごご》3時《じ》に、母《はは》が用意《ようい》してくれたクッキーとミルクの<snack>を食《た》べた。食事《しょくじ》の間《ま》の小《ちい》さな｜食べ物《たべもの》だ。", "choices_ruby": ["おやつ", "朝食《ちょうしょく》", "夕食《ゆうしょく》", "宴会《えんかい》"], "explanation_ruby": "potato chips(ポテチ)などの「スナック菓子《かし》」も。", "body_kana": "がっこうからかえっておなかがすいたごご3時に、ははがよういしてくれたクッキーとミルクの<snack>をたべた。しょくじのまのちいさなたべものだ。"}, {"word": "textbook", "meaning_jp": "教科書", "pos": "名", "body": "新学期の最初の日、新しい<textbook>を10冊以上、リュックに詰めて学校に持って帰った。授業で使う学習用の本だ。", "choices": ["教科書", "辞書", "ノート", "雑誌"], "correct_index": 0, "explanation": "text(本文)+ book。", "id": "s2_392", "body_ruby": "新学期《しんがっき》の最初《さいしょ》の日《ひ》、新《あたら》しい<textbook>を10冊《さつ》以上《いじょう》、リュックに詰《つ》めて学校《がっこう》に持《も》って帰《かえ》った。授業《じゅぎょう》で使《つか》う学習用《がくしゅうよう》の本《ほん》だ。", "choices_ruby": ["教科書《きょうかしょ》", "辞書《じしょ》", "ノート", "雑誌《ざっし》"], "explanation_ruby": "text(本文《ほんぶん》)+ book。", "body_kana": "しんがっきのさいしょのひ、あたらしい<textbook>を10冊いじょう、リュックにつめてがっこうにもってかえった。じゅぎょうでつかうがくしゅうようのほんだ。"}, {"word": "third", "meaning_jp": "3番目", "pos": "名/形", "body": "100メートル走で、彼は40人中<third>でゴールした。彼より速かった2人は陸上部のエースで、後ろにはまだ37人いた。", "choices": ["3番目", "1番目", "2番目", "30番目"], "correct_index": 0, "explanation": "three + -d。三人称(third person)。", "id": "s2_393", "body_ruby": "100メートル走《そう》で、彼《かれ》は40人《にん》中《なか》<third>でゴールした。彼《かれ》より速《はや》かった2人《にん》は陸上部《りくじょうぶ》のエースで、後《うし》ろにはまだ37人《にん》いた。", "choices_ruby": ["3番目《ばんめ》", "1番目《ばんめ》", "2番目《ばんめ》", "30番目《ばんめ》"], "explanation_ruby": "three + -d。三人《さんにん》称《しょう》(third person)。", "body_kana": "100メートルそうで、かれは40人なか<third>でゴールした。かれよりはやかった2人はりくじょうぶのエースで、うしろにはまだ37人いた。"}, {"word": "thirsty", "meaning_jp": "のどが渇いた", "pos": "形", "body": "夏の運動会で1時間走り回った後、暑さでとても<thirsty>になって、水筒の冷たい水を一気に半分飲んだ。", "choices": ["のどが渇いた", "お腹が空いた", "眠い", "暑い"], "correct_index": 0, "explanation": "hungry(空腹)とは違う。", "id": "s2_394", "body_ruby": "夏《なつ》の運動会《うんどうかい》で1時間《じかん》走《はし》り回《まわ》った後《あと》、暑《あつ》さでとても<thirsty>になって、水筒《すいとう》の冷《つめ》たい水《みず》を一気《いっき》に半分《はんぶん》飲《の》んだ。", "choices_ruby": ["のどが渇《かわ》いた", "お腹《なか》が空《す》いた", "眠《ねむ》い", "暑《あつ》い"], "explanation_ruby": "hungry(空《そら》腹《はら》)とは違《ちが》う。", "body_kana": "なつのうんどうかいで1時間はしりまわったあと、あつさでとても<thirsty>になって、すいとうのつめたいみずをいっきにはんぶんのんだ。"}, {"word": "thousand", "meaning_jp": "1000", "pos": "名/形", "body": "コンサート会場には、彼女のファンが1<thousand>人以上集まっていた。学校の全校生徒よりはるかに多くて、ホールの椅子が全部埋まり、立ち見も出ていた。", "choices": ["1000", "100", "10000", "10"], "correct_index": 0, "explanation": "two thousand = 2000。a thousand years = 1000年。", "id": "s2_395", "body_ruby": "コンサート会場《かいじょう》には、彼女《かのじょ》のファンが1<thousand>人以上《ひといじょう》集《あつ》まっていた。学校《がっこう》の全校生徒《ぜんこうせいと》よりはるかに多《おお》くて、ホールの椅子《いす》が全部《ぜんぶ》埋《う》まり、｜立ち見《たちみ》も出《で》ていた。", "choices_ruby": ["1000", "100", "10000", "10"], "explanation_ruby": "two thousand = 2000。a thousand years = 1000年《ねん》。", "body_kana": "コンサートかいじょうには、かのじょのファンが1<thousand>ひといじょうあつまっていた。がっこうのぜんこうせいとよりはるかにおおくて、ホールのいすがぜんぶうまり、たちみもでていた。"}, {"word": "tie", "meaning_jp": "ネクタイ、結ぶ", "pos": "名/動", "body": "卒業式の前、父がスーツに合う赤いストライプの<tie>を首に結んでくれた。男性がシャツの襟元に巻く細長い布だ。", "choices": ["ネクタイ", "ベルト", "靴下", "帽子"], "correct_index": 0, "explanation": "動詞では「結ぶ」、スポーツでは「引き分け」。", "id": "s2_396", "body_ruby": "卒業式《そつぎょうしき》の前《まえ》、父《ちち》がスーツに合《あ》う赤《あか》いストライプの<tie>を首《くび》に結《むす》んでくれた。男性《だんせい》がシャツの襟元《えりもと》に巻《ま》く細長《ほそなが》い布《ぬの》だ。", "choices_ruby": ["ネクタイ", "ベルト", "靴下《くつした》", "帽子《ぼうし》"], "explanation_ruby": "動詞《どうし》では「結《むす》ぶ」、スポーツでは「｜引き分《ひきわ》け」。", "body_kana": "そつぎょうしきのまえ、ちちがスーツにあうあかいストライプの<tie>をくびにむすんでくれた。だんせいがシャツのえりもとにまくほそながいぬのだ。"}, {"word": "track", "meaning_jp": "陸上トラック、線路", "pos": "名", "body": "陸上競技場の<track>は1周400メートルあり、私はそこを5周して2キロ走った。", "choices": ["トラック(走路)", "ボール", "ラケット", "ゴール"], "correct_index": 0, "explanation": "「線路」「足跡」「記録曲」の意味もある。", "id": "s2_397", "body_ruby": "陸上競技場《りくじょうきょうぎじょう》の<track>は1周《しゅう》400メートルあり、私《わたし》はそこを5周《まわ》して2キロ走《はし》った。", "choices_ruby": ["トラック(走路《そうろ》)", "ボール", "ラケット", "ゴール"], "explanation_ruby": "「線路《せんろ》」「足跡《そくせき》」「記録《きろく》曲《きょく》」の意味《いみ》もある。", "body_kana": "りくじょうきょうぎじょうの<track>は1しゅう400メートルあり、わたしはそこを5まわして2キロはしった。"}, {"word": "violin", "meaning_jp": "バイオリン", "pos": "名", "body": "彼女はオーケストラ部に入っていて、毎日放課後に弓で弦をこする楽器の<violin>を1時間練習している。", "choices": ["バイオリン", "ピアノ", "ギター", "ドラム"], "correct_index": 0, "explanation": "violinist = バイオリン奏者。", "id": "s2_398", "body_ruby": "彼女《かのじょ》はオーケストラ部《ぶ》に入《はい》っていて、毎日《まいにち》放課後《ほうかご》に弓《ゆみ》で弦《げん》をこする楽器《がっき》の<violin>を1時間《じかん》練習《れんしゅう》している。", "choices_ruby": ["バイオリン", "ピアノ", "ギター", "ドラム"], "explanation_ruby": "violinist = バイオリン奏者《そうしゃ》。", "body_kana": "かのじょはオーケストラぶにはいっていて、まいにちほうかごにゆみでげんをこするがっきの<violin>を1時間れんしゅうしている。"}, {"word": "voice", "meaning_jp": "声", "pos": "名", "body": "電話越しに、3年ぶりに祖母の優しい<voice>を聞いて、思わず涙が出そうになった。", "choices": ["声", "音", "歌", "話"], "correct_index": 0, "explanation": "loud voice(大声)、low voice(低い声)。", "id": "s2_399", "body_ruby": "電話《でんわ》越《こ》しに、3年《ねん》ぶりに祖母《そぼ》の優《やさ》しい<voice>を聞《き》いて、思《おも》わず涙《なみだ》が出《だ》そうになった。", "choices_ruby": ["声《こえ》", "音《おと》", "歌《うた》", "話《はなし》"], "explanation_ruby": "loud voice(大声《おおごえ》)、low voice(低《ひく》い声《こえ》)。", "body_kana": "でんわこしに、3年ぶりにそぼのやさしい<voice>をきいて、おもわずなみだがだそうになった。"}, {"word": "wheelchair", "meaning_jp": "車椅子", "pos": "名", "body": "祖父は足の手術をしたので、しばらくの間、自分で歩かずに4輪のついた<wheelchair>に座って移動している。座って動かせる椅子だ。", "choices": ["車椅子", "椅子", "ベッド", "ベビーカー"], "correct_index": 0, "explanation": "wheel(車輪)+ chair(椅子)。", "id": "s2_400", "body_ruby": "祖父《そふ》は足《あし》の手術《しゅじゅつ》をしたので、しばらくの間《かん》、自分《じぶん》で歩《ある》かずに4輪《わ》のついた<wheelchair>に座《すわ》って移動《いどう》している。座《すわ》って動《うご》かせる椅子《いす》だ。", "choices_ruby": ["車椅子《くるまいす》", "椅子《いす》", "ベッド", "ベビーカー"], "explanation_ruby": "wheel(車輪《しゃりん》)+ chair(椅子《いす》)。", "body_kana": "そふはあしのしゅじゅつをしたので、しばらくのかん、じぶんであるかずに4わのついた<wheelchair>にすわっていどうしている。すわってうごかせるいすだ。"}];

}

  return escapeHTML(s)
    .replace(/｜([^《》｜]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>')
    .replace(/([一-龯々〆ヶ]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>')
    .replace(/&lt;(.+?)&gt;/g, '<span class="embed">$1</span>');
}

const cardsDiv = document.getElementById("cards");
const noResults = document.getElementById("no-results");
const statsEl = document.getElementById("stats");
const searchEl = document.getElementById("search");

DATA.forEach((q, i) => {
  const div = document.createElement("div");
  div.className = "card";
  div.dataset.word = q.word.toLowerCase();
  div.dataset.meaning = q.meaning_jp.toLowerCase();
  div.dataset.body = q.body.toLowerCase();
  div.dataset.pos = q.pos;
  div.dataset.idx = i + 1;
  div.innerHTML = `
    <div class="card-head">
      <span class="id">#${String(i+1).padStart(3,'0')}</span>
      <span class="word">${escapeHTML(q.word)}</span>
      <span class="pos">${escapeHTML(q.pos)}</span>
      <span class="meaning">${escapeHTML(q.meaning_jp)}</span>
    </div>
    <div class="body">${renderBody(q.body_ruby || q.body)}</div>
    <div class="choices-row">
      ${q.choices.map((c, idx) => `<span class="choice-chip ${idx === q.correct_index ? 'correct' : ''}">${"ABCD"[idx]}. ${renderBody((q.choices_ruby || q.choices)[idx] || c)}</span>`).join("")}
    </div>
    ${q.explanation ? `<div class="explanation">💡 ${renderBody(q.explanation_ruby || q.explanation)}</div>` : ''}
  `;
  cardsDiv.appendChild(div);
});

let currentPos = "all";

function filter() {
  const q = searchEl.value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll(".card").forEach(card => {
    const matchPos = currentPos === "all" || card.dataset.pos.includes(currentPos);
    const matchQuery = !q || card.dataset.word.includes(q) || card.dataset.meaning.includes(q) || card.dataset.body.includes(q);
    if (matchPos && matchQuery) {
      card.classList.remove("hidden");
      visible++;
    } else {
      card.classList.add("hidden");
    }
  });
  statsEl.textContent = visible + " / " + DATA.length;
  noResults.classList.toggle("hidden", visible > 0);
}

searchEl.addEventListener("input", filter);
document.querySelectorAll(".filter-chip[data-pos]").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".filter-chip[data-pos]").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentPos = chip.dataset.pos;
    filter();
  });
});
// ふりがな表示切替
document.getElementById("ruby-chip").addEventListener("click", function() {
  document.body.classList.toggle("no-ruby");
  this.classList.toggle("active", !document.body.classList.contains("no-ruby"));
});
filter();
</script>
</body>
</html>
