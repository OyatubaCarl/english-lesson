choices": ["ホール", "教室", "校庭", "屋上"], "correct_index": 0, "explanation": "催し物用の大きな建物・広間。city hall = 市役所。", "id": "s2_136", "body_ruby": "合唱《がっしょう》コンクールは、市民《しみん》<hall>の大《おお》きな舞台《ぶたい》で行《おこな》われる。客席《きゃくせき》は800席《せき》もあり、響《ひび》きがまるで違《ちが》う。", "choices_ruby": ["ホール", "教室《きょうしつ》", "校庭《こうてい》", "屋上《おくじょう》"], "explanation_ruby": "｜催し物《もよおしもの》用《よう》の大《おお》きな建物《たてもの》・広間《ひろま》。city hall = 市役所《しやくしょ》。", "body_kana": "がっしょうコンクールは、しみん<hall>のおおきなぶたいでおこなわれる。きゃくせきは800せきもあり、ひびきがまるでちがう。"}, {"word": "hallway", "meaning_jp": "廊下", "pos": "名", "body": "「<hallway>は走らない!」と先生に注意された。教室と教室をつなぐ細長い通路は、すれ違う人も多い。", "choices": ["廊下", "階段", "昇降口", "渡り廊下の屋根"], "correct_index": 0, "explanation": "hall + way。corridor とも言う。", "id": "s2_137", "body_ruby": "「<hallway>は走《はし》らない!」と先生《せんせい》に注意《ちゅうい》された。教室《きょうしつ》と教室《きょうしつ》をつなぐ細長《ほそなが》い通路《つうろ》は、すれ違《ちが》う人《にん》も多《おお》い。", "choices_ruby": ["廊下《ろうか》", "階段《かいだん》", "昇降口《しょうこうぐち》", "渡《わた》り廊下《ろうか》の屋根《やね》"], "explanation_ruby": "hall + way。corridor とも言《い》う。", "body_kana": "「<hallway>ははしらない!」とせんせいにちゅういされた。きょうしつときょうしつをつなぐほそながいつうろは、すれちがうにんもおおい。"}, {"word": "handout", "meaning_jp": "配布プリント", "pos": "名", "body": "先生が授業の<handout>を配り、「これは教科書の補足です。ノートに貼っておいて」と言った。", "choices": ["配布プリント", "教科書", "辞書", "成績表"], "correct_index": 0, "explanation": "hand out(配る)から生まれた名詞。", "id": "s2_138", "body_ruby": "先生《せんせい》が授業《じゅぎょう》の<handout>を配《くば》り、「これは教科書《きょうかしょ》の補足《ほそく》です。ノートに貼《は》っておいて」と言《い》った。", "choices_ruby": ["配布《はいふ》プリント", "教科書《きょうかしょ》", "辞書《じしょ》", "成績表《せいせきひょう》"], "explanation_ruby": "hand out(配《くば》る)から生《う》まれた名詞《めいし》。", "body_kana": "せんせいがじゅぎょうの<handout>をくばり、「これはきょうかしょのほそくです。ノートにはっておいて」といった。"}, {"word": "happen", "meaning_jp": "起こる", "pos": "動", "body": "教室に戻ると、机が全部後ろに下げられていた。何が<happen>したのかと思ったら、ワックスがけの日だった。", "choices": ["起こる", "終わる", "消える", "増える"], "correct_index": 0, "explanation": "What happened? = 何があったの?", "id": "s2_139", "body_ruby": "教室《きょうしつ》に戻《もど》ると、机《つくえ》が全部《ぜんぶ》後《うし》ろに下《さ》げられていた。何《なに》が<happen>したのかと思《おも》ったら、ワックスがけの日《ひ》だった。", "choices_ruby": ["起《お》こる", "終《お》わる", "消《き》える", "増《ふ》える"], "explanation_ruby": "What happened? = 何《なに》があったの?", "body_kana": "きょうしつにもどると、つくえがぜんぶうしろにさげられていた。なにが<happen>したのかとおもったら、ワックスがけのひだった。"}, {"word": "happy", "meaning_jp": "幸せな", "pos": "形", "body": "テストで初めて満点を取り、帰り道はスキップしたくなるほど<happy>だった。家族にもすぐ報告した。", "choices": ["幸せな", "悲しい", "心配な", "退屈な"], "correct_index": 0, "explanation": "sad(悲しい)の対。happiness(幸福)の形容詞。", "id": "s2_140", "body_ruby": "テストで初《はじ》めて満点《まんてん》を取《と》り、｜帰り道《かえりみち》はスキップしたくなるほど<happy>だった。家族《かぞく》にもすぐ報告《ほうこく》した。", "choices_ruby": ["幸《しあわ》せな", "悲《かな》しい", "心配《しんぱい》な", "退屈《たいくつ》な"], "explanation_ruby": "sad(悲《かな》しい)の対《つい》。happiness(幸福《こうふく》)の形容詞《けいようし》。", "body_kana": "テストではじめてまんてんをとり、かえりみちはスキップしたくなるほど<happy>だった。かぞくにもすぐほうこくした。"}, {"word": "Hawaii", "meaning_jp": "ハワイ", "pos": "名", "body": "太平洋に浮かぶ<Hawaii>は、ワイキキビーチや火山で知られるアメリカの州で、日本から飛行機で約7時間かかる。", "choices": ["ハワイ", "グアム", "沖縄", "フィジー"], "correct_index": 0, "explanation": "アメリカ50番目の州。州都はホノルル。", "id": "s2_141", "body_ruby": "太平洋《たいへいよう》に浮《う》かぶ<Hawaii>は、ワイキキビーチや火山《かざん》で知《し》られるアメリカの州《しゅう》で、日本《にっぽん》から飛行機《ひこうき》で約《やく》7時間《じかん》かかる。", "choices_ruby": ["ハワイ", "グアム", "沖縄《おきなわ》", "フィジー"], "explanation_ruby": "アメリカ50番目《ばんめ》の州《しゅう》。州都《しゅうと》はホノルル。", "body_kana": "たいへいようにうかぶ<Hawaii>は、ワイキキビーチやかざんでしられるアメリカのしゅうで、にっぽんからひこうきでやく7時間かかる。"}, {"word": "health", "meaning_jp": "健康", "pos": "名", "body": "早寝早起き、朝ごはん、適度な運動。<health>のためには、この3つが大切だと保健の授業で習った。", "choices": ["健康", "成績", "貯金", "天気"], "correct_index": 0, "explanation": "healthy(健康な)の名詞形。", "id": "s2_142", "body_ruby": "早寝早起《はやねはやお》き、朝《あさ》ごはん、適度《てきど》な運動《うんどう》。<health>のためには、この3つが大切《たいせつ》だと保健《ほけん》の授業《じゅぎょう》で習《なら》った。", "choices_ruby": ["健康《けんこう》", "成績《せいせき》", "貯金《ちょきん》", "天気《てんき》"], "explanation_ruby": "healthy(健康《けんこう》な)の名詞《めいし》形《かたち》。", "body_kana": "はやねはやおき、あさごはん、てきどなうんどう。<health>のためには、この3つがたいせつだとほけんのじゅぎょうでならった。"}, {"word": "heavy", "meaning_jp": "重い", "pos": "形", "body": "辞書と教科書を全部入れたカバンはあまりに<heavy>で、持ち上げると肩にずっしり食い込んだ。", "choices": ["重い", "軽い", "小さい", "柔らかい"], "correct_index": 0, "explanation": "light(軽い)の対。heavy rain = 大雨。", "id": "s2_143", "body_ruby": "辞書《じしょ》と教科書《きょうかしょ》を全部《ぜんぶ》入《い》れたカバンはあまりに<heavy>で、持《も》ち上《あ》げると肩《かた》にずっしり食《く》い込《こ》んだ。", "choices_ruby": ["重《おも》い", "軽《かる》い", "小《ちい》さい", "柔《やわ》らかい"], "explanation_ruby": "light(軽《かる》い)の対《つい》。heavy rain = 大雨《おおあめ》。", "body_kana": "じしょときょうかしょをぜんぶいれたカバンはあまりに<heavy>で、もちあげるとかたにずっしりくいこんだ。"}, {"word": "held", "meaning_jp": "開催した、持った", "pos": "動", "body": "今年の花火大会は、3年ぶりに河川敷で<held>された。1万発の花火に、土手は見物客でいっぱいだった。", "choices": ["開催された", "中止された", "延期された", "予定された"], "correct_index": 0, "explanation": "hold(開く・持つ)の過去形・過去分詞。", "id": "s2_144", "body_ruby": "今年《ことし》の花火大会《はなびたいかい》は、3年《ねん》ぶりに河川敷《かせんじき》で<held>された。1万《まん》発《はつ》の花火《はなび》に、土手《どて》は見物客《けんぶつきゃく》でいっぱいだった。", "choices_ruby": ["開催《かいさい》された", "中止《ちゅうし》された", "延期《えんき》された", "予定《よてい》された"], "explanation_ruby": "hold(開《ひら》く・持《も》つ)の過去形《かこけい》・過去分詞《かこぶんし》。", "body_kana": "ことしのはなびたいかいは、3年ぶりにかせんじきで<held>された。1まんはつのはなびに、どてはけんぶつきゃくでいっぱいだった。"}, {"word": "heritage", "meaning_jp": "遺産", "pos": "名", "body": "屋久島や姫路城は、未来に残すべき宝として世界<heritage>に登録されている。", "choices": ["遺産", "事件", "貿易", "気候"], "correct_index": 0, "explanation": "World Heritage = 世界遺産。先祖から受け継ぐもの。", "id": "s2_145", "body_ruby": "屋久《やく》島《しま》や姫路城《ひめじじょう》は、未来《みらい》に残《のこ》すべき宝《たから》として世界《せかい》<heritage>に登録《とうろく》されている。", "choices_ruby": ["遺産《いさん》", "事件《じけん》", "貿易《ぼうえき》", "気候《きこう》"], "explanation_ruby": "World Heritage = 世界《せかい》遺産《いさん》。先祖《せんぞ》から｜受け継《うけつ》ぐもの。", "body_kana": "やくしまやひめじじょうは、みらいにのこすべきたからとしてせかい<heritage>にとうろくされている。"}, {"word": "history", "meaning_jp": "歴史", "pos": "名", "body": "社会の授業で、縄文時代から現代までの日本の<history>を、年表を使って順番にたどっている。", "choices": ["歴史", "地理", "政治", "経済"], "correct_index": 0, "explanation": "historical = 歴史的な。", "id": "s2_146", "body_ruby": "社会《しゃかい》の授業《じゅぎょう》で、縄文時代《じょうもんじだい》から現代《げんだい》までの日本《にっぽん》の<history>を、年表《ねんぴょう》を使《つか》って順番《じゅんばん》にたどっている。", "choices_ruby": ["歴史《れきし》", "地理《ちり》", "政治《せいじ》", "経済《けいざい》"], "explanation_ruby": "historical = 歴史的《れきしてき》な。", "body_kana": "しゃかいのじゅぎょうで、じょうもんじだいからげんだいまでのにっぽんの<history>を、ねんぴょうをつかってじゅんばんにたどっている。"}, {"word": "hit", "meaning_jp": "打つ", "pos": "動", "body": "バッターは初球を思い切り<hit>した。ボールはぐんぐん伸びて、フェンスを越える特大ホームランになった。", "choices": ["打つ", "投げる", "蹴る", "止める"], "correct_index": 0, "explanation": "hit-hit-hit(無変化)。「ヒット曲」も同じ語。", "id": "s2_147", "body_ruby": "バッターは初球《しょきゅう》を｜思い切《おもいき》り<hit>した。ボールはぐんぐん伸《の》びて、フェンスを越《こ》える特大《とくだい》ホームランになった。", "choices_ruby": ["打《う》つ", "投《な》げる", "蹴《け》る", "止《や》める"], "explanation_ruby": "hit-hit-hit(無変化《むへんか》)。「ヒット曲《きょく》」も同《おな》じ語《ご》。", "body_kana": "バッターはしょきゅうをおもいきり<hit>した。ボールはぐんぐんのびて、フェンスをこえるとくだいホームランになった。"}, {"word": "hour", "meaning_jp": "1時間", "pos": "名", "body": "テスト勉強を夜7時に始めて、終わったのが10時。今日は3<hour>も机に向かったことになる。", "choices": ["時間", "分", "秒", "日"], "correct_index": 0, "explanation": "60分=1時間。h は発音しない(アワー)。", "id": "s2_148", "body_ruby": "テスト勉強《べんきょう》を夜《よる》7時《じ》に始《はじ》めて、終《お》わったのが10時《じ》。今日《きょう》は3<hour>も机《つくえ》に向《む》かったことになる。", "choices_ruby": ["時間《じかん》", "分《ふん》", "秒《びょう》", "日《にち》"], "explanation_ruby": "60分《ふん》=1時間《じかん》。h は発音《はつおん》しない(アワー)。", "body_kana": "テストべんきょうをよる7時にはじめて、おわったのが10時。きょうは3<hour>もつくえにむかったことになる。"}, {"word": "hula", "meaning_jp": "フラダンス", "pos": "名", "body": "ハワイの伝統舞踊である<hula>は、手の動きひとつひとつに、波や花などの意味が込められている。", "choices": ["フラダンス", "タンゴ", "バレエ", "盆踊り"], "correct_index": 0, "explanation": "ハワイ語由来。hula dance とも言う。", "id": "s2_149", "body_ruby": "ハワイの伝統《でんとう》舞踊《ぶよう》である<hula>は、手《て》の動《うご》きひとつひとつに、波《なみ》や花《はな》などの意味《いみ》が込《こ》められている。", "choices_ruby": ["フラダンス", "タンゴ", "バレエ", "盆踊《ぼんおど》り"], "explanation_ruby": "ハワイ語《ご》由来《ゆらい》。hula dance とも言《い》う。", "body_kana": "ハワイのでんとうぶようである<hula>は、てのうごきひとつひとつに、なみやはななどのいみがこめられている。"}, {"word": "hunting", "meaning_jp": "狩り", "pos": "名", "body": "大昔の人々は、弓矢や槍を使ってシカやイノシシを捕る<hunting>で食料を手に入れていた。", "choices": ["狩り", "農業", "漁業", "買い物"], "correct_index": 0, "explanation": "hunt(狩る)+ -ing。job hunting = 就職活動。", "id": "s2_150", "body_ruby": "大昔《おおむかし》の人々《ひとびと》は、弓矢《ゆみや》や槍《やり》を使《つか》ってシカやイノシシを捕《と》る<hunting>で食料《しょくりょう》を手《て》に入《い》れていた。", "choices_ruby": ["狩《か》り", "農業《のうぎょう》", "漁業《ぎょぎょう》", "｜買い物《かいもの》"], "explanation_ruby": "hunt(狩《か》る)+ -ing。job hunting = 就職活動《しゅうしょくかつどう》。", "body_kana": "おおむかしのひとびとは、ゆみやややりをつかってシカやイノシシをとる<hunting>でしょくりょうをてにいれていた。"}, {"word": "hurry", "meaning_jp": "急ぐ", "pos": "動", "body": "発車のベルが鳴っているのが聞こえて、階段を駆け下りてホームまで<hurry>した。ぎりぎり間に合った。", "choices": ["急ぐ", "休む", "戻る", "迷う"], "correct_index": 0, "explanation": "Hurry up! = 急いで!", "id": "s2_151", "body_ruby": "発車《はっしゃ》のベルが鳴《な》っているのが聞《き》こえて、階段《かいだん》を駆《か》け下《お》りてホームまで<hurry>した。ぎりぎり｜間に合《まにあ》った。", "choices_ruby": ["急《いそ》ぐ", "休《やす》む", "戻《もど》る", "迷《まよ》う"], "explanation_ruby": "Hurry up! = 急《いそ》いで!", "body_kana": "はっしゃのベルがなっているのがきこえて、かいだんをかけおりてホームまで<hurry>した。ぎりぎりまにあった。"}, {"word": "hurt", "meaning_jp": "傷つける、痛む", "pos": "動", "body": "転んだ時にひざを<hurt>してしまい、しばらく曲げるたびにズキズキした。保健室で消毒してもらった。", "choices": ["傷つける", "治す", "洗う", "冷やす"], "correct_index": 0, "explanation": "hurt-hurt-hurt(無変化)。心を傷つける時にも使う。", "id": "s2_152", "body_ruby": "転《ころ》んだ時《とき》にひざを<hurt>してしまい、しばらく曲《ま》げるたびにズキズキした。保健室《ほけんしつ》で消毒《しょうどく》してもらった。", "choices_ruby": ["傷《きず》つける", "治《なお》す", "洗《あら》う", "冷《ひ》やす"], "explanation_ruby": "hurt-hurt-hurt(無変化《むへんか》)。心《こころ》を傷《きず》つける時《とき》にも使《つか》う。", "body_kana": "ころんだときにひざを<hurt>してしまい、しばらくまげるたびにズキズキした。ほけんしつでしょうどくしてもらった。"}, {"word": "idea", "meaning_jp": "考え、アイデア", "pos": "名", "body": "文化祭の出し物に悩んでいたら、彼が「教室をまるごと迷路にしよう」という面白い<idea>を出した。", "choices": ["考え", "規則", "予算", "感想"], "correct_index": 0, "explanation": "Good idea! = いい考えだね!", "id": "s2_153", "body_ruby": "文化祭《ぶんかさい》の｜出し物《だしもの》に悩《なや》んでいたら、彼《かれ》が「教室《きょうしつ》をまるごと迷路《めいろ》にしよう」という面白《おもしろ》い<idea>を出《だ》した。", "choices_ruby": ["考《かんが》え", "規則《きそく》", "予算《よさん》", "感想《かんそう》"], "explanation_ruby": "Good idea! = いい考《かんが》えだね!", "body_kana": "ぶんかさいのだしものになやんでいたら、かれが「きょうしつをまるごとめいろにしよう」というおもしろい<idea>をだした。"}, {"word": "image", "meaning_jp": "印象、画像", "pos": "名", "body": "「図書委員」と聞くと静かな人という<image>があるが、実際のメンバーはクラスで一番にぎやかな3人だ。", "choices": ["印象", "事実", "規則", "成績"], "correct_index": 0, "explanation": "頭に浮かぶ姿。「画像」の意味も。", "id": "s2_154", "body_ruby": "「図書《としょ》委員《いいん》」と聞《き》くと静《しず》かな人《にん》という<image>があるが、実際《じっさい》のメンバーはクラスで一番《いちばん》にぎやかな3人《にん》だ。", "choices_ruby": ["印象《いんしょう》", "事実《じじつ》", "規則《きそく》", "成績《せいせき》"], "explanation_ruby": "頭《あたま》に浮《う》かぶ姿《すがた》。「画像《がぞう》」の意味《いみ》も。", "body_kana": "「としょいいん」ときくとしずかなにんという<image>があるが、じっさいのメンバーはクラスでいちばんにぎやかな3人だ。"}, {"word": "important", "meaning_jp": "重要な", "pos": "形", "body": "「明日は持ち物が3つあります。<important>な連絡なので、必ずメモしてください」と先生が念を押した。", "choices": ["重要な", "簡単な", "不要な", "退屈な"], "correct_index": 0, "explanation": "importance(重要性)の形容詞。", "id": "s2_155", "body_ruby": "「明日《あした》は｜持ち物《もちもの》が3つあります。<important>な連絡《れんらく》なので、必《かなら》ずメモしてください」と先生《せんせい》が念《ねん》を押《お》した。", "choices_ruby": ["重要《じゅうよう》な", "簡単《かんたん》な", "不要《ふよう》な", "退屈《たいくつ》な"], "explanation_ruby": "importance(重要性《じゅうようせい》)の形容詞《けいようし》。", "body_kana": "「あしたはもちものが3つあります。<important>なれんらくなので、かならずメモしてください」とせんせいがねんをおした。"}, {"word": "Indian", "meaning_jp": "インドの、インド人", "pos": "形/名", "body": "駅前にできた<Indian>料理の店では、本場のシェフが大きな窯でナンを焼き、何種類ものカレーを出している。", "choices": ["インドの", "イタリアの", "中国の", "メキシコの"], "correct_index": 0, "explanation": "India + -an。", "id": "s2_156", "body_ruby": "駅前《えきまえ》にできた<Indian>料理《りょうり》の店《みせ》では、本場《ほんば》のシェフが大《おお》きな窯《かま》でナンを焼《や》き、何種類《なんしゅるい》ものカレーを出《だ》している。", "choices_ruby": ["インドの", "イタリアの", "中国《ちゅうごく》の", "メキシコの"], "explanation_ruby": "India + -an。", "body_kana": "えきまえにできた<Indian>りょうりのみせでは、ほんばのシェフがおおきなかまでナンをやき、なんしゅるいものカレーをだしている。"}, {"word": "information", "meaning_jp": "情報", "pos": "名", "body": "台風の接近に伴い、テレビの画面の下に、電車の運休や学校の休校についての<information>が流れ続けた。", "choices": ["情報", "音楽", "広告", "物語"], "correct_index": 0, "explanation": "inform(知らせる)の名詞形。数えられない名詞。", "id": "s2_157", "body_ruby": "台風《たいふう》の接近《せっきん》に伴《ともな》い、テレビの画面《がめん》の下《した》に、電車《でんしゃ》の運休《うんきゅう》や学校《がっこう》の休校《きゅうこう》についての<information>が流《なが》れ続《つづ》けた。", "choices_ruby": ["情報《じょうほう》", "音楽《おんがく》", "広告《こうこく》", "物語《ものがたり》"], "explanation_ruby": "inform(知《し》らせる)の名詞《めいし》形《かたち》。数《かぞ》えられない名詞《めいし》。", "body_kana": "たいふうのせっきんにともない、テレビのがめんのしたに、でんしゃのうんきゅうやがっこうのきゅうこうについての<information>がながれつづけた。"}, {"word": "ink", "meaning_jp": "インク", "pos": "名", "body": "書道で使う墨汁のように、万年筆には黒や青の<ink>を入れて書く。なくなったら詰め替える。", "choices": ["インク" 》する・通訳《つうやく》する)+ -er。", "body_kana": "がいこくじんせんしゅのきしゃかいけんでは、となりにすわった<interpreter>が、しつもんとこたえをすばやくにほんごとえいごになおしてつたえていた。"}, {"word": "invite", "meaning_jp": "招待する", "pos": "動", "body": "誕生日会に仲の良い友達を5人<invite>した。母がケーキを焼いて、みんなでゲームをして過ごした。", "choices": ["招待する", "断る", "見送る", "注文する"], "correct_index": 0, "explanation": "invitation(招待状)の動詞形。", "id": "s2_162", "body_ruby": "誕生日《たんじょうび》会《かい》に仲《なか》の良《よ》い友達《ともだち》を5人《にん》<invite>した。母《はは》がケーキを焼《や》いて、みんなでゲームをして過《す》ごした。", "choices_ruby": ["招待《しょうたい》する", "断《ことわ》る", "見送《みおく》る", "注文《ちゅうもん》する"], "explanation_ruby": "invitation(招待状《しょうたいじょう》)の動詞形《どうしけい》。", "body_kana": "たんじょうびかいになかのよいともだちを5人<invite>した。ははがケーキをやいて、みんなでゲームをしてすごした。"}, {"word": "island", "meaning_jp": "島", "pos": "名", "body": "フェリーで30分の小さな<island>へ行った。周囲は海に囲まれ、自転車なら1時間で一周できる。", "choices": ["島", "半島", "湖", "砂漠"], "correct_index": 0, "explanation": "s は発音しない(アイランド)。", "id": "s2_163", "body_ruby": "フェリーで30分《ふん》の小《ちい》さな<island>へ行《い》った。周囲《しゅうい》は海《うみ》に囲《かこ》まれ、自転車《じてんしゃ》なら1時間《じかん》で一周《いっしゅう》できる。", "choices_ruby": ["島《しま》", "半《はん》島《しま》", "湖《みずうみ》", "砂漠《さばく》"], "explanation_ruby": "s は発音《はつおん》しない(アイランド)。", "body_kana": "フェリーで30分のちいさな<island>へいった。しゅういはうみにかこまれ、じてんしゃなら1時間でいっしゅうできる。"}, {"word": "job", "meaning_jp": "仕事", "pos": "名", "body": "姉は大学を卒業して、4月から銀行での<job>を始めた。朝はスーツを着て、私より早く家を出る。", "choices": ["仕事", "趣味", "休暇", "勉強"], "correct_index": 0, "explanation": "work より具体的な「職」。Good job! = よくやった!", "id": "s2_164", "body_ruby": "姉《あね》は大学《だいがく》を卒業《そつぎょう》して、4月《がつ》から銀行《ぎんこう》での<job>を始《はじ》めた。朝《あさ》はスーツを着《き》て、私《わたし》より早《はや》く家《いえ》を出《で》る。", "choices_ruby": ["仕事《しごと》", "趣味《しゅみ》", "休暇《きゅうか》", "勉強《べんきょう》"], "explanation_ruby": "work より具体的《ぐたいてき》な「職《しょく》」。Good job! = よくやった!", "body_kana": "あねはだいがくをそつぎょうして、4月からぎんこうでの<job>をはじめた。あさはスーツをきて、わたしよりはやくいえをでる。"}, {"word": "jungle", "meaning_jp": "ジャングル", "pos": "名", "body": "アマゾンの<jungle>には、巨木が生いしげり、サルや色鮮やかな鳥、ヘビなど無数の生き物がすんでいる。", "choices": ["ジャングル", "砂漠", "草原", "氷河"], "correct_index": 0, "explanation": "熱帯の密林。jungle gym(ジャングルジム)。", "id": "s2_165", "body_ruby": "アマゾンの< 観光客が絶えない。", "choices": ["知られている", "隠されている", "忘れられている", "閉ざされている"], "correct_index": 0, "explanation": "know の過去分詞。be known for ~ = 〜で知られる。", "id": "s2_169", "body_ruby": "この町《まち》は、夏《なつ》の花火大会《はなびたいかい》と冬《ふゆ》のイルミネーションで全国《ぜんこく》に<known>されていて、観光客《かんこうきゃく》が絶《た》えない。", "choices_ruby": ["知《し》られている", "隠《かく》されている", "忘《わす》れられている", "閉《と》ざされている"], "explanation_ruby": "know の過去分詞《かこぶんし》。be known for ~ = 〜で知《し》られる。", "body_kana": "このまちは、なつのはなびたいかいとふゆのイルミネーションでぜんこくに<known>されていて、かんこうきゃくがたえない。"}, {"word": "land", "meaning_jp": "陸、土地", "pos": "名", "body": "船で3日間、見渡す限りの海だけを進んだ後、ようやく水平線の向こうに<land>が見えてきた。", "choices": ["陸", "海", "空", "波"], "correct_index": 0, "explanation": "sea(海)の対。動詞では「着陸する」。", "id": "s2_170", "body_ruby": "船《ふね》で3日間《にちかん》、見渡《みわた》す限《かぎ》りの海《うみ》だけを進《すす》んだ後《のち》、ようやく水平線《すいへいせん》の向《む》こうに<land>が見《み》えてきた。", "choices_ruby": ["陸《りく》", "海《うみ》", "空《そら》", "波《なみ》"], "explanation_ruby": "sea(海《うみ》)の対《つい》。動詞《どうし》では「着陸《ちゃくりく》する」。", "body_kana": "ふねで3日間、みわたすかぎりのうみだけをすすんだのち、ようやくすいへいせんのむこうに<land>がみえてきた。"}, {"word": "landmine", "meaning_jp": "地雷", "pos": "名", "body": "カンボジアでは、昔の戦争で埋められた<landmine>が今も土の中に残り、撤去の作業が続けられている。", "choices": ["地雷", "宝物", "化石", "水道管"], "correct_index": 0, "explanation": "land(土地)+ mine(爆発物)。踏むと爆発する兵器。", "id": "s2_171", "body_ruby": "カンボジアでは、昔《むかし》の戦争《せんそう》で埋《う》められた<landmine>が今《いま》も土《つち》の中《なか》に残《のこ》り、撤去《てっきょ》の作業《さぎょう》が続《つづ》けられている。", "choices_ruby": ["地雷《じらい》", "宝物《たからもの》", "化石《かせき》", "水道管《すいどうかん》"], "explanation_ruby": "land(土地《とち》)+ mine(爆発物《ばくはつぶつ》)。踏《ふ》むと爆発《ばくはつ》する兵器《へいき》。", "body_kana": "カンボジアでは、むかしのせんそうでうめられた<landmine>がいまもつちのなかにのこり、てっきょのさぎょうがつづけられている。"}, {"word": "large", "meaning_jp": "大きい", "pos": "形", "body": "ポテトをMサイズではなく<large>サイズで注文したら、想像の2倍はあって、2人でも食べきれなかった。", "choices": ["大きい", "小さい", "細い", "短い"], "correct_index": 0, "explanation": "small(小さい)の対。big とほぼ同じ意味。", "id": "s2_172", "body_ruby": "ポテトをMサイズではなく<large>サイズで注文《ちゅうもん》したら、想像《そうぞう》の2倍《ばい》はあって、2人《にん》でも食《た》べきれなかった。", "choices_ruby": ["大《おお》きい", "小《ちい》さい", "細《こま》い", "短《みじか》い"], "explanation_ruby": "small(小《ちい》さい)の対《つい》。big とほぼ同《おな》じ意味《いみ》。", "body_kana": "ポテトをMサイズではなく<large>サイズでちゅうもんしたら、そうぞうの2ばいはあって、2人でもたべきれなかった。"}, {"word": "later", "meaning_jp": "あとで", "pos": "副", "body": "「今は手が離せないから、30分<later>にかけ直すね」と母は電話を切った。", "choices": ["あとで", "すぐに", "前に", "ついでに"], "correct_index": 0, "explanation": "late の比較級。See you later! = またあとで!", "id": "s2_173", "body_ruby": "「今《いま》は手《て》が離《はな》せないから、30分《ふん》<later>にかけ直《なお》すね」と母《はは》は電話《でんわ》を切《き》った。", "choices_ruby": ["あとで", "すぐに", "前《まえ》に", "ついでに"], "explanation_ruby": "late の比較《ひかく》級《きゅう》。See you later! = またあとで!", "body_kana": "「いまはてがはなせないから、30分<later>にかけなおすね」とはははでんわをきった。"}, {"word": "lay", "meaning_jp": "産む、横たえる", "pos": "動", "body": "祖父の家のニワトリは、毎朝小屋の中に卵を1個ずつ<lay>する。とりたては殻が温かい。", "choices": ["産む", "食べる", "割る", "ゆでる"], "correct_index": 0, "explanation": "lay-laid-laid。「置く・横たえる」の意味も。", "id": "s2_174", "body_ruby": "祖父《そふ》の家《いえ》のニワトリは、毎朝《まいあさ》小屋《こや》の中《なか》に卵《たまご》を1個《こ》ずつ<lay>する。とりたては殻《から》が温《あたた》かい。", "choices_ruby": ["産《う》む", "食《た》べる", "割《わ》る", "ゆでる"], "explanation_ruby": "lay-laid-laid。「置《お》く・横《よこ》たえる」の意味《いみ》も。", "body_kana": "そふのいえのニワトリは、まいあさこやのなかにたまごを1個ずつ<lay>する。とりたてはからがあたたかい。"}, {"word": "left", "meaning_jp": "出発した", "pos": "動", "body": "始発の新幹線に乗るため、まだ外が暗い朝5時に家を<left>した。駅に着く頃、空が白み始めた。", "choices": ["出発した", "戻った", "残った", "着いた"], "correct_index": 0, "explanation": "leave の過去形。「左」の意味の left もある。", "id": "s2_175", "body_ruby": "始発《しはつ》の新幹線《しんかんせん》に乗《の》るため、まだ外《そと》が暗《くら》い朝《あさ》5時《じ》に家《いえ》を<left>した。駅《えき》に着《つ》く頃《ごろ》、空《そら》が白《しら》み始《はじ》めた。", "choices_ruby": ["出発《しゅっぱつ》した", "戻《もど》った", "残《のこ》った", "着《つ》いた"], "explanation_ruby": "leave の過去形《かこけい》。「左《ひだり》」の意味《いみ》の left もある。", "body_kana": "しはつのしんかんせんにのるため、まだそとがくらいあさ5時にいえを<left>した。えきにつくごろ、そらがしらみはじめた。"}, {"word": "lesson", "meaning_jp": "レッスン、授業", "pos": "名", "body": "週に1回、駅前の教室でピアノの<lesson>を受けている。先生の前で弾くと、家での練習の成果が出る。", "choices": ["レッスン", "発表会", "休憩", "買い物"], "correct_index": 0, "explanation": "習い事の1回分。「教訓」の意味もある。", "id": "s2_176", "body_ruby": "週《しゅう》に1回《かい》、駅前《えきまえ》の教室《きょうしつ》でピアノの<lesson>を受《う》けている。先生《せんせい》の前《まえ》で弾《ひ》くと、家《いえ》での練習《れんしゅう》の成果《せいか》が出《で》る。", "choices_ruby": ["レッスン", "発表会《はっぴょうかい》", "休憩《きゅうけい》", "｜買い物《かいもの》"], "explanation_ruby": "｜習い事《ならいごと》の1回《かい》分《ふん》。「教訓《きょうくん》」の意味《いみ》もある。", "body_kana": "しゅうに1回、えきまえのきょうしつでピアノの<lesson>をうけている。せんせいのまえでひくと、いえでのれんしゅうのせいかがでる。"}, {"word": "level", "meaning_jp": "水準、レベル", "pos": "名", "body": "この問題集は基礎・標準・発展の3つの<level>に分かれていて、自分の力に合わせて選べる。", "choices": ["水準", "値段", "厚さ", "重さ"], "correct_index": 0, "explanation": "高さ・程度の段階。water level = 水位。", "id": "s2_177", "body_ruby": "この問題集《もんだいしゅう》は基礎《きそ》・標準《ひょうじゅん》・発展《はってん》の3つの<level>に分《わ》かれていて、自分《じぶん》の力《ちから》に合《あ》わせて選《えら》べる。", "choices_ruby": ["水準《すいじゅん》", "値段《ねだん》", "厚《あつ》さ", "重《おも》さ"], "explanation_ruby": "高《たか》さ・程度《ていど》の段階《だんかい》。water level = 水位《すいい》。", "body_kana": "このもんだいしゅうはきそ・ひょうじゅん・はってんの3つの<level>にわかれていて、じぶんのちからにあわせてえらべる。"}, {"word": "lift", "meaning_jp": "持ち上げる", "pos": "動", "body": "引っ越しの手伝いで、2人がかりで冷蔵庫を<lift>して、トラックの荷台までゆっくり運んだ。", "choices": ["持ち上げる", "下ろす", "引きずる", "倒す"], "correct_index": 0, "explanation": "イギリスでは「エレベーター」の意味も。", "id": "s2_178", "body_ruby": "｜引っ越《ひっこ》しの手伝《てつだ》いで、2人《にん》がかりで冷蔵庫《れいぞうこ》を<lift>して、トラックの荷台《にだい》までゆっくり運《はこ》んだ。", "choices_ruby": ["持《も》ち上《あ》げる", "下《くだ》ろす", "引《ひ》きずる", "倒《たお》す"], "explanation_ruby": "イギリスでは「エレベーター」の意味《いみ》も。", "body_kana": "ひっこしのてつだいで、2人がかりでれいぞうこを<lift>して、トラックのにだいまでゆっくりはこんだ。"}, {"word": "light", "meaning_jp": "光、明かり", "pos": "名", "body": "停電で家じゅうが真っ暗になり、懐中電灯の<light>だけを頼りに、ろうそくを探した。", "choices": ["光", "音", "影", "熱"], "correct_index": 0, "explanation": "「軽い」という形容詞の light もある(同じつづり)。", "id": "s2_179", "body_ruby": "停電《ていでん》で家《いえ》じゅうが｜真っ暗《まっくら》になり、懐中電灯《かいちゅうでんとう》の<light>だけを頼《たよ》りに、ろうそくを探《さが》した。", "choices_ruby": ["光《ひかり》", "音《おと》", "影《かげ》", "熱《ねつ》"], "explanation_ruby": "「軽《かる》い」という形容詞《けいようし》の light もある(同《おな》じつづり)。", "body_kana": "ていでんでいえじゅうがまっくらになり、かいちゅうでんとうの<light>だけをたよりに、ろうそくをさがした。"}, {"word": "line", "meaning_jp": "線、列", "pos": "名", "body": "ノートの最後の<line>まで字がぎっしり埋まったので、新しいページをめくった。", "choices": ["線(行)", "点", "丸", "枠"], "correct_index": 0, "explanation": "「列」の意味も(stand in line = 列に並ぶ)。", "id": "s2_180", "body_ruby": "ノートの最後《さいご》の<line>まで字《じ》がぎっしり埋《う》まったので、新《あたら》しいページをめくった。", "choices_ruby": ["線《せん》(行《ぎょう》)", "点《てん》", "丸《まる》", "枠《わく》"], "explanation_ruby": "「列《れつ》」の意味《いみ》も(stand in line = 列《れつ》に並《なら》ぶ)。", "body_kana": "ノートのさいごの<line>までじがぎっしりうまったので、あたらしいページをめくった。"}, {"word": "locate", "meaning_jp": "位置する", "pos": "動", "body": "私たちの学校は、駅から徒歩10分、市役所と公園のちょうど間に<locate>している。", "choices": ["位置する", "移動する", "完成する", "閉店する"], "correct_index": 0, "explanation": "be located in ~ = 〜にある。location(場所)。", "id": "s2_181", "body_ruby": "私《わたし》たちの学校《がっこう》は、駅《えき》から徒歩《とほ》10分《ふん》、市役所《しやくしょ》と公園《こうえん》のちょうど間《ま》に<locate>している。", "choices_ruby": ["位置《いち》する", "移動《いどう》する", "完成《かんせい》する", "閉店《へいてん》する"], "explanation_ruby": "be located in ~ = 〜にある。location(場所《ばしょ》)。", "body_kana": "わたしたちのがっこうは、えきからとほ10分、しやくしょとこうえんのちょうどまに<locate>している。"}, {"word": "lonely", "meaning_jp": "孤独な", "pos": "形", "body": "引っ越して最初の夜は、知っている人が誰もいない町で、胸の奥がきゅっとなるほど<lonely>だった。", "choices": ["孤独な", "にぎやかな", "楽しい", "忙しい"], "correct_index": 0, "explanation": "alone(1人で)と違い、寂しい気持ちを含む。", "id": "s2_182", "body_ruby": "｜引っ越《ひっこ》して最初《さいしょ》の夜《よる》は、知《し》っている人《にん》が誰《だれ》もいない町《まち》で、胸《むね》の奥《おく》がきゅっとなるほど<lonely>だった。", "choices_ruby": ["孤独《こどく》な", "にぎやかな", "楽《たの》しい", "忙《いそが》しい"], "explanation_ruby": "alone(1人《にん》で)と違《ちが》い、寂《さび》しい気持《きも》ちを含《ふく》む。", "body_kana": "ひっこしてさいしょのよるは、しっているにんがだれもいないまちで、むねのおくがきゅっとなるほど<lonely>だった。"}, {"word": "love", "meaning_jp": "大好きである、愛", "pos": "動/名", "body": "祖母は猫を3匹飼っていて、毎日写真を撮っては家族に送ってくるほど猫を<love>している。", "choices": ["大好きである", "苦手である", "世話する", "観察する"], "correct_index": 0, "explanation": "like より強い気持ち。I love you. = 愛している。", "id": "s2_183", "body_ruby": "祖母《そぼ》は猫《ねこ》を3匹《ひき》飼《か》っていて、毎日《まいにち》写真《しゃしん》を撮《と》っては家族《かぞく》に送《おく》ってくるほど猫《ねこ》を<love>している。", "choices_ruby": ["大好《だいす》きである", "苦手《にがて》である", "世話《せわ》する", "観察《かんさつ》する"], "explanation_ruby": "like より強《つよ》い気持《きも》ち。I love you. = 愛《あい》している。", "body_kana": "そぼはねこを3匹かっていて、まいにちしゃしんをとってはかぞくにおくってくるほどねこを<love>している。"}, {"word": "low", "meaning_jp": "低い", "pos": "形", "body": "今朝の気温は氷点下まで下がり、この冬いちばん<low>い記録になった。池の水も凍っていた。", "choices": ["低い", "高い", "暖かい", "湿った"], "correct_index": 0, "explanation": "high(高い)の対。声・温度・値段などに使う。", "id": "s2_184", "body_ruby": "今朝《けさ》の気温《きおん》は氷点下《ひょうてんか》まで下《さ》がり、この冬《ふゆ》いちばん<low>い記録《きろく》になった。池《いけ》の水《みず》も凍《こお》っていた。", "choices_ruby": ["低《ひく》い", "高《たか》い", "暖《あたた》かい", "湿《しめ》った"], "explanation_ruby": "high(高《たか》い)の対《つい》。声《こえ》・温度《おんど》・値段《ねだん》などに使《つか》う。", "body_kana": "けさのきおんはひょうてんかまでさがり、このふゆいちばん<low>いきろくになった。いけのみずもこおっていた。"}, {"word": "main", "meaning_jp": "主な", "pos": "形", "body": "今日の夕食の<main>のおかずはハンバーグで、付け合わせにポテトとにんじんが添えてあった。", "choices": ["主な", "余分な", "最後の", "特別な"], "correct_index": 0, "explanation": "main street = 大通り、main dish = 主菜。", "id": "s2_185", "body_ruby": "今日《きょう》の夕食《ゆうしょく》の<main>のおかずはハンバーグで、付《つ》け合《あ》わせにポテトとにんじんが添《そ》えてあった。", "choices_ruby": ["主《おも》な", "余分《よぶん》な", "最後《さいご》の", "特別《とくべつ》な"], "explanation_ruby": "main street = 大《だい》通《とお》り、main dish = 主菜《しゅさい》。", "body_kana": "きょうのゆうしょくの<main>のおかずはハンバーグで、つけあわせにポテトとにんじんがそえてあった。"}, {"word": "major", "meaning_jp": "主要な、大きな", "pos": "形", "body": "日本の<major>な都市といえば、東京・大阪・名古屋で、新幹線はこの3つを1本で結んでいる。", "choices": ["主要な", "小さな", "新しい", "静かな"], "correct_index": 0, "explanation": "minor(小さい方の)の対。メジャーリーグの major。", "id": "s2_186", "body_ruby": "日本《にっぽん》の<major>な都市《とし》といえば、東京《とうきょう》・大阪《おおさか》・名古屋《なごや》で、新幹線《しんかんせん》はこの3つを1本《ほん》で結《むす》んでいる。", "choices_ruby": ["主要《しゅよう》な", "小《ちい》さな", "新《あたら》しい", "静《しず》かな"], "explanation_ruby": "minor(小《ちい》さい方《ほう》の)の対《つい》。メジャーリーグの major。", "body_kana": "にっぽんの<major>なとしといえば、とうきょう・おおさか・なごやで、しんかんせんはこの3つを1本でむすんでいる。"}, {"word": "market", "meaning_jp": "市場", "pos": "名", "body": "朝の<market>には、とれたての野菜や魚を並べた店がずらりと並び、売り手の元気な声が飛び交っていた。", "choices": ["市場", "工場", "倉庫", "病院"], "correct_index": 0, "explanation": "supermarket(スーパー)の market。", "id": "s2_187", "body_ruby": "朝《あさ》の<market>には、とれたての野菜《やさい》や魚《さかな》を並《なら》べた店《みせ》がずらりと並《なら》び、｜売り手《うりて》の元気《げんき》な声《こえ》が｜飛び交《とびか》っていた。", "choices_ruby": ["市場《しじょう》", "工場《こうじょう》", "倉庫《そうこ》", "病院《びょういん》"], "explanation_ruby": "supermarket(スーパー)の market。", "body_kana": "あさの<market>には、とれたてのやさいやさかなをならべたみせがずらりとならび、うりてのげんきなこえがとびかっていた。"}, {"word": "master", "meaning_jp": "習得する", "pos": "動", "body": "彼は1年間毎日練習を続けて、ついにリフティング100回の技を<master>した。", "choices": ["習得する", "諦める", "忘れる", "披露する"], "correct_index": 0, "explanation": "名詞では「達人・主人」。", "id": "s2_188", "body_ruby": "彼《かれ》は1年間《ねんかん》毎日《まいにち》練習《れんしゅう》を続《つづ》けて、ついにリフティング100回《かい》の技《わざ》を<master>した。", "choices_ruby": ["習得《しゅうとく》する", "諦《あきら》める", "忘《わす》れる", "披露《ひろう》する"], "explanation_ruby": "名詞《めいし》では「達人《たつじん》・主人《しゅじん》」。", "body_kana": "かれは1年間まいにちれんしゅうをつづけて、ついにリフティング100回のわざを<master>した。"}, {"word": "meaning", "meaning_jp": "意味", "pos": "名", "body": "辞書で調べると、この単語には3つの<meaning>が載っていて、文によって訳し方が変わると分かった。", "choices": ["意味", "発音", "つづり", "例文"], "correct_index": 0, "explanation": "mean(意味する)+ -ing。", "id": "s2_189", "body_ruby": "辞書《じしょ》で調《しら》べると、この単語《たんご》には3つの<meaning>が載《の》っていて、文《ぶん》によって訳《やく》し方《ほう》が変《か》わると分《わ》かった。", "choices_ruby": ["意味《いみ》", "発音《はつおん》", "つづり", "例文《れいぶん》"], "explanation_ruby": "mean(意味《いみ》する)+ -ing。", "body_kana": "じしょでしらべると、このたんごには3つの<meaning>がのっていて、ぶんによってやくしほうがかわるとわかった。"}, {"word": "meeting", "meaning_jp": "会議、集まり", "pos": "名", "body": "文化祭の準備のため、放課後に実行委員の<meeting>が開かれ、各クラスの代表が役割を話し合った。", "choices": ["会議", "授業", "掃除", "試合"], "correct_index": 0, "explanation": "meet(会う)+ -ing。", "id": "s2_190", "body_ruby": "文化祭《ぶんかさい》の準備《じゅんび》のため、放課後《ほうかご》に実行委員《じっこういいん》の<meeting>が開《ひら》かれ、各《かく》クラスの代表《だいひょう》が役割《やくわり》を｜話し合《はなしあ》った。", "choices_ruby": ["会議《かいぎ》", "授業《じゅぎょう》", "掃除《そうじ》", "試合《しあい》"], "explanation_ruby": "meet(会《あ》う)+ -ing。", "body_kana": "ぶんかさいのじゅんびのため、ほうかごにじっこういいんの<meeting>がひらかれ、かくクラスのだいひょうがやくわりをはなしあった。"}, {"word": "menu", "meaning_jp": "メニュー", "pos": "名", "body": "レストランで<menu>を開き、写真と値段を見比べながら、10分も悩んでオムライスに決めた。", "choices": ["メニュー", "レシート", "伝票", "クーポン"], "correct_index": 0, "explanation": "料理の一覧表。フランス語由来。", "id": "s2_191", "body_ruby": "レストランで<menu>を開《ひら》き、写真《しゃしん》と値段《ねだん》を見比《みくら》べながら、10分《ふん》も悩《なや》んでオムライスに決《き》めた。", "choices_ruby": ["メニュー", "レシート", "伝票《でんぴょう》", "クーポン"], "explanation_ruby": "料理《りょうり》の一覧表《いちらんひょう》。フランス語《ご》由来《ゆらい》。", "body_kana": "レストランで<menu>をひらき、しゃしんとねだんをみくらべながら、10分もなやんでオムライスにきめた。"}, {"word": "message", "meaning_jp": "伝言、メッセージ", "pos": "名", "body": "留守番電話に「7時頃そちらに着きます」という祖父からの<message>が残されていた。", "choices": ["伝言", "荷物", "写真", "番号"], "correct_index": 0, "explanation": "伝えたい内容・連絡。", "id": "s2_192", "body_ruby": "留守番電話《るすばんでんわ》に「7時《じ》頃《ごろ》そちらに着《つ》きます」という祖父《そふ》からの<message>が残《のこ》されていた。", "choices_ruby": ["伝言《でんごん》", "荷物《にもつ》", "写真《しゃしん》", "番号《ばんごう》"], "explanation_ruby": "伝《つた》えたい内容《ないよう》・連絡《れんらく》。", "body_kana": "るすばんでんわに「7時ごろそちらにつきます」というそふからの<message>がのこされていた。"}, {"word": "mid-1900s", "meaning_jp": "1900年代半ば", "pos": "名", "body": "<mid-1900s>、つまり1950年前後の日本では、テレビや冷蔵庫が各家庭に少しずつ広まり始めた。", "choices": ["1900年代半ば", "1900年代初め", "2000年代", "1800年代"], "correct_index": 0, "explanation": "mid-(半ばの)+ 年代。mid-August = 8月中旬。", "id": "s2_193", "body_ruby": "<mid-1900s>、つまり1950年《ねん》前後《ぜんご》の日本《にっぽん》では、テレビや冷蔵庫《れいぞうこ》が各家庭《かくかてい》に少《すこ》しずつ広《ひろ》まり始《はじ》めた。", "choices_ruby": ["1900年《ねん》代《だい》半《なか》ば", "1900年《ねん》代《だい》初《はじ》め", "2000年《ねん》代《だい》", "1800年《ねん》代《だい》"], "explanation_ruby": "mid-(半《なか》ばの)+ 年代《ねんだい》。mid-August = 8月《がつ》中旬《ちゅうじゅん》。", "body_kana": "<mid-1900s>、つまり1950年ぜんごのにっぽんでは、テレビやれいぞうこがかくかていにすこしずつひろまりはじめた。"}, {"word": "middle", "meaning_jp": "真ん中", "pos": "名", "body": "写真を撮るとき、背の一番高い彼が列の<middle>に立ち、左右に4人ずつ並んだ。", "choices": ["真ん中", "端", "後ろ", "外"], "correct_index": 0, "explanation": "middle school = 中学校。in the middle of ~ = 〜の最中。", "id": "s2_194", "body_ruby": "写真《しゃしん》を撮《と》るとき、背《せ》の一番《いちばん》高《たか》い彼《かれ》が列《れつ》の<middle>に立《た》ち、左右《さゆう》に4人《にん》ずつ並《なら》んだ。", "choices_ruby": ["｜真ん中《まんなか》", "端《はじ》", "後《うし》ろ", "外《そと》"], "explanation_ruby": "middle school = 中学校《ちゅうがっこう》。in the middle of ~ = 〜の最中《さいちゅう》。", "body_kana": "しゃしんをとるとき、せのいちばんたかいかれがれつの<middle>にたち、さゆうに4人ずつならんだ。"}, {"word": "minute", "meaning_jp": "分", "pos": "名", "body": "カップ麺にお湯を注いで3<minute>待つ。時計の長い針が3目盛り進んだら食べごろだ。", "choices": ["分", "秒", "時間", "日"], "correct_index": 0, "explanation": "60秒=1分。Wait a minute! = ちょっと待って!", "id": "s2_195", "body_ruby": "カップ麺《めん》にお湯《ゆ》を注《そそ》いで3<minute>待《ま》つ。時計《とけい》の長《なが》い針《はり》が3目盛《めも》り進《すす》んだら食《た》べごろだ。", "choices_ruby": ["分《ふん》", "秒《びょう》", "時間《じかん》", "日《にち》"], "explanation_ruby": "60秒《びょう》=1分《ふん》。Wait a minute! = ちょっと待《ま》って!", "body_kana": "カップめんにおゆをそそいで3<minute>まつ。とけいのながいはりが3めもりすすんだらたべごろだ。"}, {"word": "moment", "meaning_jp": "瞬間", "pos": "名", "body": "シャッターを押したまさにその<moment>、鳥が画面を横切って、奇跡のような1枚が撮れた。", "choices": ["瞬間", "期間", "場所", "理由"], "correct_index": 0, "explanation": "Just a moment. = 少々お待ちください。", "id": "s2_196", "body_ruby": "シャッターを押《お》したまさにその<moment>、鳥《とり》が画面《がめん》を横切《よこぎ》って、奇跡《きせき》のような1枚《まい》が撮《と》れた。", "choices_ruby": ["瞬間《しゅんかん》", "期間《きかん》", "場所《ばしょ》", "理由《りゆう》"], "explanation_ruby": "Just a moment. = 少々《しょうしょう》お待《ま》ちください。", "body_kana": "シャッターをおしたまさにその<moment>、とりががめんをよこぎって、きせきのような1枚がとれた。"}, {"word": "moon", "meaning_jp": "月", "pos": "名", "body": "今夜は満月で、雲ひとつない空にまん丸の<moon>が浮かび、夜道が明るく照らされていた。", "choices": ["月", "太陽", "星", "雲"], "correct_index": 0, "explanation": "full moon = 満月。Monday(月曜)の語源。", "id": "s2_197", "body_ruby": "今夜《こんや》は満月《まんげつ》で、雲《くも》ひとつない空《そら》にまん丸《まる》の<moon>が浮《う》かび、夜道《よみち》が明《あか》るく照《て》らされていた。", "choices_ruby": ["月《がつ》", "太陽《たいよう》", "星《ほし》", "雲《くも》"], "explanation_ruby": "full moon = 満月《まんげつ》。Monday(月曜《げつよう》)の語源《ごげん》。", "body_kana": "こんやはまんげつで、くもひとつないそらにまんまるの<moon>がうかび、よみちがあかるくてらされていた。"}, {"word": "narrow", "meaning_jp": "狭い", "pos": "形", "body": "その路地は車がすれ違えないほど<narrow>で、自転車でも対向車が来るとどちらかが止まるしかない。", "choices": ["狭い", "広い", "明るい", "新しい"], "correct_index": 0, "explanation": "wide(広い)の対。幅がせまいこと。", "id": "s2_198", "body_ruby": "その路地《ろじ》は車《くるま》がすれ違《ちが》えないほど<narrow>で、自転車《じてんしゃ》でも対向車《たいこうしゃ》が来《く》るとどちらかが止《と》まるしかない。", "choices_ruby": ["狭《せま》い", "広《ひろ》い", "明《あか》るい", "新《あたら》しい"], "explanation_ruby": "wide(広《ひろ》い)の対《つい》。幅《はば》がせまいこと。", "body_kana": "そのろじはくるまがすれちがえないほど<narrow>で、じてんしゃでもたいこうしゃがくるとどちらかがとまるしかない。"}, {"word": "native", "meaning_jp": "母語の、その土地生まれの", "pos": "形", "body": "新しく来たALTの先生は英語の<native>スピーカーで、生まれも育ちもロンドンだそうだ。", "choices": ["母語の", "外国の", "二番目の", "人工の"], "correct_index": 0, "explanation": "native language = 母語。生まれつきの。", "id": "s2_199", "body_ruby": "新《あたら》しく来《き》たALTの先生《せんせい》は英語《えいご》の<native>スピーカーで、生《う》まれも育《そだ》ちもロンドンだそうだ。", "choices_ruby": ["母語《ぼご》の", "外国《がいこく》の", "二番目《にばんめ》の", "人工《じんこう》の"], "explanation_ruby": "native language = 母語《ぼご》。生《う》まれつきの。", "body_kana": "あたらしくきたALTのせんせいはえいごの<native>スピーカーで、うまれもそだちもロンドンだそうだ。"}, {"word": "need", "meaning_jp": "必要とする", "pos": "動", "body": "明日の調理実習では、エプロン・三角巾・ふきんの3点を<need>するので、忘れずに用意しておこう。", "choices": ["必要とする", "禁止する", "販売する", "回収する"], "correct_index": 0, "explanation": "need to ~ = 〜する必要がある。", "id": "s2_200", "body_ruby": "明日《あした》の調理《ちょうり》実習《じっしゅう》では、エプロン・三角巾《さんかくきん》・ふきんの3点《てん》を<need>するので、忘《わす》れずに用意《ようい》しておこう。", "choices_ruby": ["必要《ひつよう》とする", "禁止《きんし》する", "販売《はんばい》する", "回収《かいしゅう》する"], "explanation_ruby": "need to ~ = 〜する必要《ひつよう》がある。", "body_kana": "あしたのちょうりじっしゅうでは、エプロン・さんかくきん・ふきんの3点を<need>するので、わすれずによういしておこう。"}, {"word": "nervous", "meaning_jp": "緊張した", "pos": "形", "body": "全校生徒の前で発表する直前、心臓がドキドキして手のひらに汗がにじむほど<nervous>になった。", "choices": ["緊張した", "落ち着いた", "眠い", "退屈な"], "correct_index": 0, "explanation": "nerve(神経)の形容詞。get nervous = 緊張する。", "id": "s2_201", "body_ruby": "全校生徒《ぜんこうせいと》の前《まえ》で発表《はっぴょう》する直前《ちょくぜん》、心臓《しんぞう》がドキドキして手《て》のひらに汗《あせ》がにじむほど<nervous>になった。", "choices_ruby": ["緊張《きんちょう》した", "｜落ち着《おちつ》いた", "眠《ねむ》い", "退屈《たいくつ》な"], "explanation_ruby": "nerve(神経《しんけい》)の形容詞《けいようし》。get nervous = 緊張《きんちょう》する。", "body_kana": "ぜんこうせいとのまえではっぴょうするちょくぜん、しんぞうがドキドキしててのひらにあせがにじむほど<nervous>になった。"}, {"word": "never", "meaning_jp": "決して〜ない", "pos": "副", "body": "彼は10年来の友達だが、約束を<never>破らない。だから今回も、必ず来てくれると信じている。", "choices": ["決して〜ない", "ときどき", "必ず", "ほとんど毎回"], "correct_index": 0, "explanation": "頻度ゼロを表す。Never give up! = 諦めるな!", "id": "s2_202", "body_ruby": "彼《かれ》は10年来《ねんらい》の友達《ともだち》だが、約束《やくそく》を<never>破《やぶ》らない。だから今回《こんかい》も、必《かなら》ず来《き》てくれると信《しん》じている。", "choices_ruby": ["決《けっ》して〜ない", "ときどき", "必《かなら》ず", "ほとんど毎回《まいかい》"], "explanation_ruby": "頻度《ひんど》ゼロを表《あらわ》す。Never give up! = 諦《あきら》めるな!", "body_kana": "かれは10ねんらいのともだちだが、やくそくを<never>やぶらない。だからこんかいも、かならずきてくれるとしんじている。"}, {"word": "news", "meaning_jp": "ニュース、知らせ", "pos": "名", "body": "夜7時になると、父はテレビをつけて<news>を見る。今日の出来事や明日の天気が次々と報じられる。", "choices": ["ニュース", "ドラマ", "アニメ", "音楽番組"], "correct_index": 0, "explanation": "new(新しい)+ s。Good news! = いい知らせ!", "id": "s2_203", "body_ruby": "夜《よる》7時《じ》になると、父《ちち》はテレビをつけて<news>を見《み》る。今日《きょう》の出来事《できごと》や明日《あした》の天気《てんき》が次々《つぎつぎ》と報《ほう》じられる。", "choices_ruby": ["ニュース", "ドラマ", "アニメ", "音楽番組《おんがくばんぐみ》"], "explanation_ruby": "new(新《あたら》しい)+ s。Good news! = いい知《し》らせ!", "body_kana": "よる7時になると、ちちはテレビをつけて<news>をみる。きょうのできごとやあしたのてんきがつぎつぎとほうじられる。"}, {"word": "nursing", "meaning_jp": "看護", "pos": "名", "body": "母は病院で<nursing>の仕事をしている。白い制服を着て、入院中の人の体温を測ったり薬を配ったりする。", "choices": ["看護", "調理", "設計", "販売"], "correct_index": 0, "explanation": "nurse(看護師)+ -ing。nursing home = 介護施設。", "id": "s2_204", "body_ruby": "母《はは》は病院《びょういん》で<nursing>の仕事《しごと》をしている。白《しろ》い制服《せいふく》を着《き》て、入院中《にゅういんちゅう》の人《にん》の体温《たいおん》を測《はか》ったり薬《くすり》を配《くば》ったりする。", "choices_ruby": ["看護《かんご》", "調理《ちょうり》", "設計《せっけい》", "販売《はんばい》"], "explanation_ruby": "nurse(看護《かんご》師《し》)+ -ing。nursing home = 介護《かいご》施設《しせつ》。", "body_kana": "はははびょういんで<nursing>のしごとをしている。しろいせいふくをきて、にゅういんちゅうのにんのたいおんをはかったりくすりをくばったりする。"}, {"word": "officer", "meaning_jp": "警察官、役人", "pos": "名", "body": "道に迷って交番に行くと、制服姿の<officer>が地図を広げて、丁寧に道順を教えてくれた。", "choices": ["警察官", "店員", "運転手", "教師"], "correct_index": 0, "explanation": "police officer = 警察官。office(役所)+ -er。", "id": "s2_205", "body_ruby": "道《みち》に迷《まよ》って交番《こうばん》に行《い》くと、制服姿《せいふくすがた》の<officer>が地図《ちず》を広《ひろ》げて、丁寧《ていねい》に道順《みちじゅん》を教《おし》えてくれた。", "choices_ruby": ["警察官《けいさつかん》", "店員《てんいん》", "運転手《うんてんしゅ》", "教師《きょうし》"], "explanation_ruby": "police officer = 警察官《けいさつかん》。office(役所《やくしょ》)+ -er。", "body_kana": "みちにまよってこうばんにいくと、せいふくすがたの<officer>がちずをひろげて、ていねいにみちじゅんをおしえてくれた。"}, {"word": "once", "meaning_jp": "一度、かつて", "pos": "副", "body": "富士山には<once>だけ登ったことがある。5年前の夏、家族で頂上まで8時間かけて歩いた。", "choices": ["一度", "毎年", "二度", "決して〜ない"], "correct_index": 0, "explanation": "once upon a time = 昔々。twice = 2回。", "id": "s2_206", "body_ruby": "富士山《ふじさん》には<once>だけ登《のぼ》ったことがある。5年《ねん》前《まえ》の夏《なつ》、家族《かぞく》で頂上《ちょうじょう》まで8時間《じかん》かけて歩《ある》いた。", "choices_ruby": ["一度《いちど》", "毎年《まいとし》", "二度《にど》", "決《けっ》して〜ない"], "explanation_ruby": "once upon a time = 昔々《むかしむかし》。twice = 2回《かい》。", "body_kana": "ふじさんには<once>だけのぼったことがある。5年まえのなつ、かぞくでちょうじょうまで8時間かけてあるいた。"}, {"word": "opinion", "meaning_jp": "意見", "pos": "名", "body": "学級会で「制服は必要か」を話し合い、賛成と反対それぞれの<opinion>が10個以上も出た。", "choices": ["意見", "命令", "うわさ", "成績"], "correct_index": 0, "explanation": "in my opinion = 私の考えでは。", "id": "s2_207", "body_ruby": "学級会《がっきゅうかい》で「制服《せいふく》は必要《ひつよう》か」を｜話し合《はなしあ》い、賛成《さんせい》と反対《はんたい》それぞれの<opinion>が10個《こ》以上《いじょう》も出《で》た。", "choices_ruby": ["意見《いけん》", "命令《めいれい》", "うわさ", "成績《せいせき》"], "explanation_ruby": "in my opinion = 私《わたし》の考《かんが》えでは。", "body_kana": "がっきゅうかいで「せいふくはひつようか」をはなしあい、さんせいとはんたいそれぞれの<opinion>が10個いじょうもでた。"}, {"word": "outside", "meaning_jp": "外(側)", "pos": "副/名", "body": "雨がやんだので、ずっと家の中にいた犬を連れて<outside>に出ると、嬉しそうに走り回った。", "choices": ["外", "中", "地下", "屋根裏"], "correct_index": 0, "explanation": "inside(内側)の対。", "id": "s2_208", "body_ruby": "雨《あめ》がやんだので、ずっと家《いえ》の中《なか》にいた犬《いぬ》を連《つ》れて<outside>に出《で》ると、嬉《うれ》しそうに走《はし》り回《まわ》った。", "choices_ruby": ["外《そと》", "中《なか》", "地下《ちか》", "屋根裏《やねうら》"], "explanation_ruby": "inside(内側《うちがわ》)の対《つい》。", "body_kana": "あめがやんだので、ずっといえのなかにいたいぬをつれて<outside>にでると、うれしそうにはしりまわった。"}, {"word": "p.m.", "meaning_jp": "午後", "pos": "副", "body": "図書館の閉館は6<p.m.>だ。チャイムが鳴る頃には窓の外が夕焼けに染まっている。", "choices": ["午後", "午前", "早朝", "未明"], "correct_index": 0, "explanation": "ラテン語 post meridiem(正午の後)の略。", "id": "s2_209", "body_ruby": "図書館《としょかん》の閉館《へいかん》は6<p.m.>だ。チャイムが鳴《な》る頃《ごろ》には窓《まど》の外《そと》が夕焼《ゆうや》けに染《そ》まっている。", "choices_ruby": ["午後《ごご》", "午前《ごぜん》", "早朝《そうちょう》", "未明《みめい》"], "explanation_ruby": "ラテン語《ご》 post meridiem(正午《しょうご》の後《あと》)の略《りゃく》。", "body_kana": "としょかんのへいかんは6<p.m.>だ。チャイムがなるごろにはまどのそとがゆうやけにそまっている。"}, {"word": "paint", "meaning_jp": "(絵の具で)描く、塗る", "pos": "動", "body": "美術の時間に、水彩絵の具で夕焼けの空を<paint>した。赤とオレンジを混ぜて、にじませるのがコツだ。", "choices": ["絵の具で描く", "鉛筆で書く", "消す", "切り取る"], "correct_index": 0, "explanation": "draw(線で描く)と区別。painter = 画家。", "id": "s2_210", "body_ruby": "美術《びじゅつ》の時間《じかん》に、水彩《すいさい》｜絵の具《えのぐ》で夕焼《ゆうや》けの空《そら》を<paint>した。赤《あか》とオレンジを混《ま》ぜて、にじませるのがコツだ。", "choices_ruby": ["｜絵の具《えのぐ》で描《えが》く", "鉛筆《えんぴつ》で書《か》く", "消《け》す", "｜切り取《きりと》る"], "explanation_ruby": "draw(線《せん》で描《えが》く)と区別《くべつ》。painter = 画家《がか》。", "body_kana": "びじゅつのじかんに、すいさいえのぐでゆうやけのそらを<paint>した。あかとオレンジをまぜて、にじませるのがコツだ。"}, {"word": "panic", "meaning_jp": "パニック", "pos": "名", "body": "非常ベルが突然鳴り響き、一瞬みんな<panic>になりかけたが、先生の「落ち着いて」の一声で列を作れた。", "choices": ["パニック", "沈黙", "笑い", "拍手"], "correct_index": 0, "explanation": "突然の恐怖で冷静さを失うこと。", "id": "s2_211", "body_ruby": "非常《ひじょう》ベルが突然《とつぜん》鳴《な》り響《ひび》き、一瞬《いっしゅん》みんな<panic>になりかけたが、先生《せんせい》の「｜落ち着《おちつ》いて」の一声《ひとこえ》で列《れつ》を作《つく》れた。", "choices_ruby": ["パニック", "沈黙《ちんもく》", "笑《わら》い", "拍手《はくしゅ》"], "explanation_ruby": "突然《とつぜん》の恐怖《きょうふ》で冷静《れいせい》さを失《うしな》うこと。", "body_kana": "ひじょうベルがとつぜんなりひびき、いっしゅんみんな<panic>になりかけたが、せんせいの「おちついて」のひとこえでれつをつくれた。"}, {"word": "paper", "meaning_jp": "紙", "pos": "名", "body": "折り紙用の正方形の<paper>を半分に折り、さらに半分に折って、鶴のくちばしを作っていく。", "choices": ["紙", "布", "板", "ひも"], "correct_index": 0, "explanation": "newspaper(新聞)、paper plane(紙飛行機)。", "id": "s2_212", "body_ruby": "｜折り紙《おりがみ》用《よう》の正方形《せいほうけい》の<paper>を半分《はんぶん》に折《お》り、さらに半分《はんぶん》に折《お》って、鶴《つる》のくちばしを作《つく》っていく。", "choices_ruby": ["紙《かみ》", "布《ぬの》", "板《いた》", "ひも"], "explanation_ruby": "newspaper(新聞《しんぶん》)、paper plane(紙飛行機《かみひこうき》)。", "body_kana": "おりがみようのせいほうけいの<paper>をはんぶんにおり、さらにはんぶんにおって、つるのくちばしをつくっていく。"}, {"word": "part", "meaning_jp": "部分", "pos": "名", "body": "ケーキを8つに切り分けて、いちばん大きな<part>は誕生日の主役である妹のお皿にのせた。", "choices": ["部分", "全体", "材料", "値段"], "correct_index": 0, "explanation": "whole(全体)の対。part of ~ = 〜の一部。", "id": "s2_213", "body_ruby": "ケーキを8つに｜切り分《きりわ》けて、いちばん大《おお》きな<part>は誕生日《たんじょうび》の主役《しゅやく》である妹《いもうと》のお皿《さら》にのせた。", "choices_ruby": ["部分《ぶぶん》", "全体《ぜんたい》", "材料《ざいりょう》", "値段《ねだん》"], "explanation_ruby": "whole(全体《ぜんたい》)の対《つい》。part of ~ = 〜の一部《いちぶ》。", "body_kana": "ケーキを8つにきりわけて、いちばんおおきな<part>はたんじょうびのしゅやくであるいもうとのおさらにのせた。"}, {"word": "party", "meaning_jp": "パーティー", "pos": "名", "body": "クリスマスの夜、友達の家で<party>を開いた。料理を持ち寄り、プレゼント交換をして盛り上がった。", "choices": ["パーティー", "会議", "授業", "練習"], "correct_index": 0, "explanation": "birthday party、Christmas party など。", "id": "s2_214", "body_ruby": "クリスマスの夜《よる》、友達《ともだち》の家《いえ》で<party>を開《ひら》いた。料理《りょうり》を持《も》ち寄《よ》り、プレゼント交換《こうかん》をして｜盛り上《もりあ》がった。", "choices_ruby": ["パーティー", "会議《かいぎ》", "授業《じゅぎょう》", "練習《れんしゅう》"], "explanation_ruby": "birthday party、Christmas party など。", "body_kana": "クリスマスのよる、ともだちのいえで<party>をひらいた。りょうりをもちより、プレゼントこうかんをしてもりあがった。"}, {"word": "patient", "meaning_jp": "患者", "pos": "名", "body": "病院の待合室には、診察の順番を待つ<patient>が10人ほど座っていて、名前が呼ばれるたびに1人ずつ立ち上がった。", "choices": ["患者", "医師", "看護師", "受付係"], "correct_index": 0, "explanation": "形容詞では「忍耐強い」の意味になる。", "id": "s2_215", "body_ruby": "病院《びょういん》の待合室《まちあいしつ》には、診察《しんさつ》の順番《じゅんばん》を待《ま》つ<patient>が10人《にん》ほど座《すわ》っていて、名前《なまえ》が呼《よ》ばれるたびに1人《にん》ずつ｜立ち上《たちあ》がった。", "choices_ruby": ["患者《かんじゃ》", "医師《いし》", "看護《かんご》師《し》", "受付《うけつけ》係《かかり》"], "explanation_ruby": "形容詞《けいようし》では「忍耐《にんたい》強《つよ》い」の意味《いみ》になる。", "body_kana": "びょういんのまちあいしつには、しんさつのじゅんばんをまつ<patient>が10人ほどすわっていて、なまえがよばれるたびに1人ずつたちあがった。"}, {"word": "pay", "meaning_jp": "支払う", "pos": "動", "body": "レジで合計金額を見て、財布から1000円札を出して<pay>した。おつりは120円だった。", "choices": ["支払う", "受け取る", "数える", "両替する"], "correct_index": 0, "explanation": "pay-paid-paid。payment = 支払い。", "id": "s2_216", "body_ruby": "レジで合計金額《ごうけいきんがく》を見《み》て、財布《さいふ》から1000円《えん》札《さつ》を出《だ》して<pay>した。おつりは120円《えん》だった。", "choices_ruby": ["支払《しはら》う", "｜受け取《うけと》る", "数《かぞ》える", "両替《りょうがえ》する"], "explanation_ruby": "pay-paid-paid。payment = 支払《しはら》い。", "body_kana": "レジでごうけいきんがくをみて、さいふから1000円さつをだして<pay>した。おつりは120円だった。"}, {"word": "peace", "meaning_jp": "平和", "pos": "名", "body": "広島の式典では、戦争を二度と繰り返さず、<peace>な世界を築くことを全員で祈った。", "choices": ["平和", "戦争", "貿易", "競争"], "correct_index": 0, "explanation": "war(戦争)の対。peaceful = 平和な。", "id": "s2_217", "body_ruby": "広島《ひろしま》の式典《しきてん》では、戦争《せんそう》を二度《にど》と｜繰り返《くりかえ》さず、<peace>な世界《せかい》を築《きづ》くことを全員《ぜんいん》で祈《いの》った。", "choices_ruby": ["平和《へいわ》", "戦争《せんそう》", "貿易《ぼうえき》", "競争《きょうそう》"], "explanation_ruby": "war(戦争《せんそう》)の対《つい》。peaceful = 平和《へいわ》な。", "body_kana": "ひろしまのしきてんでは、せんそうをにどとくりかえさず、<peace>なせかいをきづくことをぜんいんでいのった。"}, {"word": "perfect", "meaning_jp": "完璧な", "pos": "形", "body": "漢字テストは50問すべて正解で、初めての<perfect>だった。答案の上に大きな花丸がついていた。", "choices": ["完璧な", "不十分な", "平均的な", "おしい"], "correct_index": 0, "explanation": "perfect score = 満点。", "id": "s2_218", "body_ruby": "漢字《かんじ》テストは50問《もん》すべて正解《せいかい》で、初《はじ》めての<perfect>だった。答案《とうあん》の上《うえ》に大《おお》きな花丸《はなまる》がついていた。", "choices_ruby": ["完璧《かんぺき》な", "不十分《ふじゅうぶん》な", "平均的《へいきんてき》な", "おしい"], "explanation_ruby": "perfect score = 満点《まんてん》。", "body_kana": "かんじテストは50問すべてせいかいで、はじめての<perfect>だった。とうあんのうえにおおきなはなまるがついていた。"}, {"word": "person", "meaning_jp": "人", "pos": "名", "body": "落とした財布を交番に届けてくれた<person>に、お礼を言いたい。名前も告げずに帰ったそうだ。", "choices": ["人", "犬", "機械", "店"], "correct_index": 0, "explanation": "1人の人間。複数は people を使うことが多い。", "id": "s2_219", "body_ruby": "落《お》とした財布《さいふ》を交番《こうばん》に届《とど》けてくれた<person>に、お礼《れい》を言《い》いたい。名前《なまえ》も告《つ》げずに帰《かえ》ったそうだ。", "choices_ruby": ["人《にん》", "犬《いぬ》", "機械《きかい》", "店《みせ》"], "explanation_ruby": "1人《にん》の人間《にんげん》。複数《ふくすう》は people を使《つか》うことが多《おお》い。", "body_kana": "おとしたさいふをこうばんにとどけてくれた<person>に、おれいをいいたい。なまえもつげずにかえったそうだ。"}, {"word": "personal", "meaning_jp": "個人的な", "pos": "形", "body": "日記には<personal>なことを書いているので、家族でも勝手に読まれたくない。鍵付きの引き出しにしまっている。", "choices": ["個人的な", "公共の", "学校全体の", "世界的な"], "correct_index": 0, "explanation": "person(個人)+ -al。personal computer = パソコン。", "id": "s2_220", "body_ruby": "日記《にっき》には<personal>なことを書《か》いているので、家族《かぞく》でも勝手《かって》に読《よ》まれたくない。鍵《かぎ》付《つ》きの｜引き出《ひきだ》しにしまっている。", "choices_ruby": ["個人的《こじんてき》な", "公共《こうきょう》の", "学校《がっこう》全体《ぜんたい》の", "世界的《せかいてき》な"], "explanation_ruby": "person(個人《こじん》)+ -al。personal computer = パソコン。", "body_kana": "にっきには<personal>なことをかいているので、かぞくでもかってによまれたくない。かぎつきのひきだしにしまっている。"}, {"word": "phone", "meaning_jp": "電話", "pos": "名", "body": "祖母は耳が少し遠いので、<phone>で話すときは、いつもより大きくゆっくりした声で話すようにしている。", "choices": ["電話", "手紙", "テレビ", "ラジオ"], "correct_index": 0, "explanation": "telephone の短縮形。smartphone(スマホ)。", "id": "s2_221", "body_ruby": "祖母《そぼ》は耳《みみ》が少《すこ》し遠《とお》いので、<phone>で話《はな》すときは、いつもより大《おお》きくゆっくりした声《こえ》で話《はな》すようにしている。", "choices_ruby": ["電話《でんわ》", "手紙《てがみ》", "テレビ", "ラジオ"], "explanation_ruby": "telephone の短縮形《たんしゅくけい》。smartphone(スマホ)。", "body_kana": "そぼはみみがすこしとおいので、<phone>ではなすときは、いつもよりおおきくゆっくりしたこえではなすようにしている。"}, {"word": "photo", "meaning_jp": "写真", "pos": "名", "body": "修学旅行の最終日、全員で並んでクラスの集合<photo>を撮った。あとで1人1枚ずつ配られる。", "choices": ["写真", "似顔絵", "地図", "日記"], "correct_index": 0, "explanation": "photograph の短縮形。take a photo = 写真を撮る。", "id": "s2_222", "body_ruby": "修学旅行《しゅうがくりょこう》の最終日《さいしゅうび》、全員《ぜんいん》で並《なら》んでクラスの集合《しゅうごう》<photo>を撮《と》った。あとで1人《にん》1枚《まい》ずつ配《くば》られる。", "choices_ruby": ["写真《しゃしん》", "似顔絵《にがおえ》", "地図《ちず》", "日記《にっき》"], "explanation_ruby": "photograph の短縮形《たんしゅくけい》。take a photo = 写真《しゃしん》を撮《と》る。", "body_kana": "しゅうがくりょこうのさいしゅうび、ぜんいんでならんでクラスのしゅうごう<photo>をとった。あとで1人1枚ずつくばられる。"}, {"word": "pie", "meaning_jp": "パイ", "pos": "名", "body": "祖母お手製のりんごの<pie>は、サクサクの生地の中に甘く煮たりんごがぎっしり詰まっている。", "choices": ["パイ", "プリン", "ゼリー", "せんべい"], "correct_index": 0, "explanation": "apple pie(アップルパイ)。", "id": "s2_223", "body_ruby": "祖母《そぼ》お手製《てせい》のりんごの<pie>は、サクサクの生地《きじ》の中《なか》に甘《あま》く煮《に》たりんごがぎっしり詰《つ》まっている。", "choices_ruby": ["パイ", "プリン", "ゼリー", "せんべい"], "explanation_ruby": "apple pie(アップルパイ)。", "body_kana": "そぼおてせいのりんごの<pie>は、サクサクのきじのなかにあまくにたりんごがぎっしりつまっている。"}, {"word": "piece", "meaning_jp": "一切れ、一片", "pos": "名", "body": "ピザを8等分して、私は2<piece>食べた。チーズが伸びて、取り分けるのがひと苦労だった。", "choices": ["一切れ", "一皿", "一箱", "一袋"], "correct_index": 0, "explanation": "a piece of ~ = 一切れの〜。peace(平和)と同音。", "id": "s2_224", "body_ruby": "ピザを8等分《とうぶん》して、私《わたし》は2<piece>食《た》べた。チーズが伸《の》びて、｜取り分《とりぶん》けるのがひと苦労《くろう》だった。", "choices_ruby": ["一切《ひとき》れ", "一皿《ひとさら》", "一箱《ひとはこ》", "一袋《ひとふくろ》"], "explanation_ruby": "a piece of ~ = 一切《ひとき》れの〜。peace(平和《へいわ》)と同音《どうおん》。", "body_kana": "ピザを8とうぶんして、わたしは2<piece>たべた。チーズがのびて、とりぶんけるのがひとくろうだった。"}, {"word": "pilot", "meaning_jp": "パイロット", "pos": "名", "body": "機内放送で<pilot>が「当機はまもなく離陸します」と挨拶すると、エンジンの音が一段と大きくなった。", "choices": ["パイロット", "車掌", "船長", "客室乗務員"], "correct_index": 0, "explanation": "飛行機の操縦士。", "id": "s2_225", "body_ruby": "機内《きない》放送《ほうそう》で<pilot>が「当機《とうき》はまもなく離陸《りりく》します」と挨拶《あいさつ》すると、エンジンの音《おと》が一段《いちだん》と大《おお》きくなった。", "choices_ruby": ["パイロット", "車掌《しゃしょう》", "船長《せんちょう》", "客室乗務員《きゃくしつじょうむいん》"], "explanation_ruby": "飛行機《ひこうき》の操縦士《そうじゅうし》。", "body_kana": "きないほうそうで<pilot>が「とうきはまもなくりりくします」とあいさつすると、エンジンのおとがいちだんとおおきくなった。"}, {"word": "plan", "meaning_jp": "計画", "pos": "名", "body": "夏休み初日に、宿題を7月中に終わらせる<plan>を立てた。1日2ページずつ進める計算だ。", "choices": ["計画", "感想", "結果", "罰"], "correct_index": 0, "explanation": "make a plan = 計画を立てる。", "id": "s2_226", "body_ruby": "夏休《なつやす》み初日《しょにち》に、宿題《しゅくだい》を7月《がつ》中《なか》に終《お》わらせる<plan>を立《た》てた。1日《にち》2ページずつ進《すす》める計算《けいさん》だ。", "choices_ruby": ["計画《けいかく》", "感想《かんそう》", "結果《けっか》", "罰《ばつ》"], "explanation_ruby": "make a plan = 計画《けいかく》を立《た》てる。", "body_kana": "なつやすみしょにちに、しゅくだいを7月なかにおわらせる<plan>をたてた。1日2ページずつすすめるけいさんだ。"}, {"word": "plane", "meaning_jp": "飛行機", "pos": "名", "body": "空港の展望デッキから、<plane>が滑走路を加速して、ふわりと空に浮かぶ瞬間を見た。", "choices": ["飛行機", "電車", "船", "バス"], "correct_index": 0, "explanation": "airplane の短縮形。", "id": "s2_227", "body_ruby": "空《そら》港《みなと》の展望《てんぼう》デッキから、<plane>が滑走路《かっそうろ》を加速《かそく》して、ふわりと空《そら》に浮《う》かぶ瞬間《しゅんかん》を見《み》た。", "choices_ruby": ["飛行機《ひこうき》", "電車《でんしゃ》", "船《ふね》", "バス"], "explanation_ruby": "airplane の短縮形《たんしゅくけい》。", "body_kana": "そらみなとのてんぼうデッキから、<plane>がかっそうろをかそくして、ふわりとそらにうかぶしゅんかんをみた。"}, {"word": "plant", "meaning_jp": "植物", "pos": "名", "body": "教室の窓ぎわに鉢植えの<plant>を置いている。日光に向かって葉が伸び、週2回の水やりは日直の仕事だ。", "choices": ["植物", "動物", "鉱物", "家具"], "correct_index": 0, "explanation": "動詞では「植える」。power plant = 発電所。", "id": "s2_228", "body_ruby": "教室《きょうしつ》の窓《まど》ぎわに鉢植《はちうえ》えの<plant>を置《お》いている。日光《にっこう》に向《む》かって葉《は》が伸《の》び、週《しゅう》2回《かい》の水《みず》やりは日直《にっちょく》の仕事《しごと》だ。", "choices_ruby": ["植物《しょくぶつ》", "動物《どうぶつ》", "鉱物《こうぶつ》", "家具《かぐ》"], "explanation_ruby": "動詞《どうし》では「植《う》える」。power plant = 発電所《はつでんしょ》。", "body_kana": "きょうしつのまどぎわにはちうええの<plant>をおいている。にっこうにむかってはがのび、しゅう2回のみずやりはにっちょくのしごとだ。"}, {"word": "plate", "meaning_jp": "皿", "pos": "名", "body": "食事の後、テーブルの<plate>を重ねて台所へ運び、スポンジで洗って水切りかごに伏せた。", "choices": ["皿", "コップ", "なべ", "ふきん"], "correct_index": 0, "explanation": "平たい皿。深い器は bowl。", "id": "s2_229", "body_ruby": "食事《しょくじ》の後《あと》、テーブルの<plate>を重《おも》ねて台所《だいどころ》へ運《はこ》び、スポンジで洗《あら》って水切《みずき》りかごに伏《ふ》せた。", "choices_ruby": ["皿《さら》", "コップ", "なべ", "ふきん"], "explanation_ruby": "平《ひら》たい皿《さら》。深《ふか》い器《うつわ》は bowl。", "body_kana": "しょくじのあと、テーブルの<plate>をおもねてだいどころへはこび、スポンジであらってみずきりかごにふせた。"}, {"word": "point", "meaning_jp": "点、要点", "pos": "名", "body": "バスケの試合は58対55、わずか3<point>差で私たちのチームが勝った。最後の1分は息もできなかった。", "choices": ["点", "分", "人", "回"], "correct_index": 0, "explanation": "得点・要点・先端。That's the point. = そこが重要。", "id": "s2_230", "body_ruby": "バスケの試合《しあい》は58対《つい》55、わずか3<point>差《さ》で私《わたし》たちのチームが勝《か》った。最後《さいご》の1分《ふん》は息《いき》もできなかった。", "choices_ruby": ["点《てん》", "分《ふん》", "人《にん》", "回《かい》"], "explanation_ruby": "得点《とくてん》・要点《ようてん》・先端《せんたん》。That's the point. = そこが重要《じゅうよう》。", "body_kana": "バスケのしあいは58つい55、わずか3<point>さでわたしたちのチームがかった。さいごの1分はいきもできなかった。"}, {"word": "poison", "meaning_jp": "毒", "pos": "名", "body": "フグの内臓には強い<poison>が含まれていて、免許を持つ調理師でなければ調理してはいけない。", "choices": ["毒", "栄養", "香り", "うまみ"], "correct_index": 0, "explanation": "poisonous = 有毒な。", "id": "s2_231", "body_ruby": "フグの内臓《ないぞう》には強《つよ》い<poison>が含《ふく》まれていて、免許《めんきょ》を持《も》つ調理師《ちょうりし》でなければ調理《ちょうり》してはいけない。", "choices_ruby": ["毒《どく》", "栄養《えいよう》", "香《かお》り", "うまみ"], "explanation_ruby": "poisonous = 有毒《ゆうどく》な。", "body_kana": "フグのないぞうにはつよい<poison>がふくまれていて、めんきょをもつちょうりしでなければちょうりしてはいけない。"}, {"word": "police", "meaning_jp": "警察", "pos": "名", "body": "自転車の盗難にあったので、最寄りの交番で<police>に届け出を出した。3日後、隣町で見つかった。", "choices": ["警察", "消防", "病院", "郵便局"], "correct_index": 0, "explanation": "police station = 警察署。常に複数扱い。", "id": "s2_232", "body_ruby": "自転車《じてんしゃ》の盗難《とうなん》にあったので、最寄《もよ》りの交番《こうばん》で<police>に｜届け出《とどけで》を出《だ》した。3日《にち》後《のち》、隣町《となりまち》で見《み》つかった。", "choices_ruby": ["警察《けいさつ》", "消防《しょうぼう》", "病院《びょういん》", "郵便局《ゆうびんきょく》"], "explanation_ruby": "police station = 警察署《けいさつしょ》。常《つね》に複数《ふくすう》扱《あつか》い。", "body_kana": "じてんしゃのとうなんにあったので、もよりのこうばんで<police>にとどけでをだした。3日のち、となりまちでみつかった。"}, {"word": "pollution", "meaning_jp": "汚染", "pos": "名", "body": "工場の排水による川の<pollution>が進み、昔はたくさんいた魚がほとんど見られなくなったという。", "choices": ["汚染", "清掃", "増水", "干上がり"], "correct_index": 0, "explanation": "pollute(汚染する)の名詞形。air pollution = 大気汚染。", "id": "s2_233", "body_ruby": "工場《こうじょう》の排水《はいすい》による川《かわ》の<pollution>が進《すす》み、昔《むかし》はたくさんいた魚《さかな》がほとんど見《み》られなくなったという。", "choices_ruby": ["汚染《おせん》", "清掃《せいそう》", "増水《ぞうすい》", "干上《ひあ》がり"], "explanation_ruby": "pollute(汚染《おせん》する)の名詞《めいし》形《かたち》。air pollution = 大気汚染《たいきおせん》。", "body_kana": "こうじょうのはいすいによるかわの<pollution>がすすみ、むかしはたくさんいたさかながほとんどみられなくなったという。"}, {"word": "poor", "meaning_jp": "貧しい、かわいそうな", "pos": "形", "body": "その物語の主人公は、パンを買うお金もないほど<poor>な少年だったが、努力を重ねて医者になった。", "choices": ["貧しい", "裕福な", "有名な", "健康な"], "correct_index": 0, "explanation": "rich(裕福な)の対。「下手な」の意味もある。", "id": "s2_234", "body_ruby": "その物語《ものがたり》の主人公《しゅじんこう》は、パンを買《か》うお金《かね》もないほど<poor>な少年《しょうねん》だったが、努力《どりょく》を重《おも》ねて医者《いしゃ》になった。", "choices_ruby": ["貧《まず》しい", "裕福《ゆうふく》な", "有名《ゆうめい》な", "健康《けんこう》な"], "explanation_ruby": "rich(裕福《ゆうふく》な)の対《つい》。「下手《へた》な」の意味《いみ》もある。", "body_kana": "そのものがたりのしゅじんこうは、パンをかうおかねもないほど<poor>なしょうねんだったが、どりょくをおもねていしゃになった。"}, {"word": "pot", "meaning_jp": "なべ、ポット", "pos": "名", "body": "大きな<pot>でカレーを作ると、家族4人で食べても2日分はある。2日目の方が味がしみておいしい。", "choices": ["なべ", "皿", "包丁", "まな板"], "correct_index": 0, "explanation": "深い調理器具。植木鉢(flower pot)も。", "id": "s2_235", "body_ruby": "大《おお》きな<pot>でカレーを作《つく》ると、家族《かぞく》4人《にん》で食《た》べても2日《にち》分《ふん》はある。2日《にち》目《め》の方《ほう》が味《あじ》がしみておいしい。", "choices_ruby": ["なべ", "皿《さら》", "包丁《ほうちょう》", "まな板《いた》"], "explanation_ruby": "深《ふか》い調理器具《ちょうりきぐ》。植木鉢《うえきばち》(flower pot)も。", "body_kana": "おおきな<pot>でカレーをつくると、かぞく4人でたべても2日ふんはある。2日めのほうがあじがしみておいしい。"}, {"word": "power", "meaning_jp": "力、電力", "pos": "名", "body": "台風で送電線が切れ、町全体の<power>が止まった。冷蔵庫もエアコンも使えない夜を初めて経験した。", "choices": ["電力", "水道", "ガス", "電話"], "correct_index": 0, "explanation": "powerful = 力強い。power plant = 発電所。", "id": "s2_236", "body_ruby": "台風《たいふう》で送電線《そうでんせん》が切《き》れ、町全体《まちぜんたい》の<power>が止《と》まった。冷蔵庫《れいぞうこ》もエアコンも使《つか》えない夜《よる》を初《はじ》めて経験《けいけん》した。", "choices_ruby": ["電力《でんりょく》", "水道《すいどう》", "ガス", "電話《でんわ》"], "explanation_ruby": "powerful = 力強《ちからづよ》い。power plant = 発電所《はつでんしょ》。", "body_kana": "たいふうでそうでんせんがきれ、まちぜんたいの<power>がとまった。れいぞうこもエアコンもつかえないよるをはじめてけいけんした。"}, {"word": "prefer", "meaning_jp": "〜の方を好む", "pos": "動", "body": "犬と猫、どちらも可愛いが、私は静かに寄り添ってくれる猫の方を<prefer>する。", "choices": ["〜の方を好む", "〜を嫌う", "〜を飼う", "〜を比べる"], "correct_index": 0, "explanation": "prefer A to B = BよりAを好む。", "id": "s2_237", "body_ruby": "犬《いぬ》と猫《ねこ》、どちらも可愛《かわ》いが、私《わたし》は静《しず》かに｜寄り添《よりそ》ってくれる猫《ねこ》の方《ほう》を<prefer>する。", "choices_ruby": ["〜の方《ほう》を好《この》む", "〜を嫌《きら》う", "〜を飼《か》う", "〜を比《くら》べる"], "explanation_ruby": "prefer A to B = BよりAを好《この》む。", "body_kana": "いぬとねこ、どちらもかわいが、わたしはしずかによりそってくれるねこのほうを<prefer>する。"}, {"word": "presentation", "meaning_jp": "発表", "pos": "名", "body": "総合の時間に、調べた国についてスライドを使って<presentation>をした。声の大きさと目線に気をつけた。", "choices": ["発表", "試験", "掃除", "観察"], "correct_index": 0, "explanation": "present(提示する)の名詞形。プレゼン。", "id": "s2_238", "body_ruby": "総合《そうごう》の時間《じかん》に、調《しら》べた国《くに》についてスライドを使《つか》って<presentation>をした。声《こえ》の大《おお》きさと目線《めせん》に気《き》をつけた。", "choices_ruby": ["発表《はっぴょう》", "試験《しけん》", "掃除《そうじ》", "観察《かんさつ》"], "explanation_ruby": "present(提示《ていじ》する)の名詞《めいし》形《かたち》。プレゼン。", "body_kana": "そうごうのじかんに、しらべたくにについてスライドをつかって<presentation>をした。こえのおおきさとめせんにきをつけた。"}, {"word": "program", "meaning_jp": "番組、プログラム", "pos": "名", "body": "毎週日曜の夜は、家族そろって動物の生態を追う<program>を見る。今週はペンギンの特集だった。", "choices": ["番組", "新聞", "雑誌", "辞典"], "correct_index": 0, "explanation": "TV program = テレビ番組。運動会の進行表も。", "id": "s2_239", "body_ruby": "毎週《まいしゅう》日曜《にちよう》の夜《よる》は、家族《かぞく》そろって動物《どうぶつ》の生態《せいたい》を追《お》う<program>を見《み》る。今週《こんしゅう》はペンギンの特集《とくしゅう》だった。", "choices_ruby": ["番組《ばんぐみ》", "新聞《しんぶん》", "雑誌《ざっし》", "辞典《じてん》"], "explanation_ruby": "TV program = テレビ番組《ばんぐみ》。運動会《うんどうかい》の進行表《しんこうひょう》も。", "body_kana": "まいしゅうにちようのよるは、かぞくそろってどうぶつのせいたいをおう<program>をみる。こんしゅうはペンギンのとくしゅうだった。"}, {"word": "promise", "meaning_jp": "約束", "pos": "名/動", "body": "「次のテストで80点を取ったら新しい自転車ね」と母と<promise>した。指切りまでした。", "choices": ["約束", "命令", "予想", "報告"], "correct_index": 0, "explanation": "keep a promise = 約束を守る。", "id": "s2_240", "body_ruby": "「次《つぎ》のテストで80点《てん》を取《と》ったら新《あたら》しい自転車《じてんしゃ》ね」と母《はは》と<promise>した。指《ゆび》切《き》りまでした。", "choices_ruby": ["約束《やくそく》", "命令《めいれい》", "予想《よそう》", "報告《ほうこく》"], "explanation_ruby": "keep a promise = 約束《やくそく》を守《まも》る。", "body_kana": "「つぎのテストで80点をとったらあたらしいじてんしゃね」とははと<promise>した。ゆびきりまでした。"}, {"word": "protect", "meaning_jp": "守る", "pos": "動", "body": "ヘルメットは、転んだときに頭を<protect>するための装備だ。あごひもまでしっかり締めて意味がある。", "choices": ["守る", "攻める", "飾る", "重くする"], "correct_index": 0, "explanation": "protection(保護)の動詞形。", "id": "s2_241", "body_ruby": "ヘルメットは、転《ころ》んだときに頭《あたま》を<protect>するための装備《そうび》だ。あごひもまでしっかり締《し》めて意味《いみ》がある。", "choices_ruby": ["守《まも》る", "攻《せ》める", "飾《かざ》る", "重《おも》くする"], "explanation_ruby": "protection(保護《ほご》)の動詞形《どうしけい》。", "body_kana": "ヘルメットは、ころんだときにあたまを<protect>するためのそうびだ。あごひもまでしっかりしめていみがある。"}, {"word": "public", "meaning_jp": "公共の", "pos": "形", "body": "図書館や公園のような<public>な場所は、みんなのものだから、誰もが気持ちよく使えるようにマナーを守る。", "choices": ["公共の", "個人の", "秘密の", "有料の"], "correct_index": 0, "explanation": "private(私的な)の対。public phone = 公衆電話。", "id": "s2_242", "body_ruby": "図書館《としょかん》や公園《こうえん》のような<public>な場所《ばしょ》は、みんなのものだから、誰《だれ》もが気持《きも》ちよく使《つか》えるようにマナーを守《まも》る。", "choices_ruby": ["公共《こうきょう》の", "個人《こじん》の", "秘密《ひみつ》の", "有料《ゆうりょう》の"], "explanation_ruby": "private(私的《してき》な)の対《つい》。public phone = 公衆電話《こうしゅうでんわ》。", "body_kana": "としょかんやこうえんのような<public>なばしょは、みんなのものだから、だれもがきもちよくつかえるようにマナーをまもる。"}, {"word": "punish", "meaning_jp": "罰する", "pos": "動", "body": "練習をさぼった部員を、顧問はグラウンド10周で<punish>した。次の日からは誰も遅刻しなくなった。", "choices": ["罰する", "ほめる", "許す", "雇う"], "correct_index": 0, "explanation": "punishment = 罰。", "id": "s2_243", "body_ruby": "練習《れんしゅう》をさぼった部員《ぶいん》を、顧問《こもん》はグラウンド10周《しゅう》で<punish>した。次《つぎ》の日《ひ》からは誰《だれ》も遅刻《ちこく》しなくなった。", "choices_ruby": ["罰《ばつ》する", "ほめる", "許《ゆる》す", "雇《やと》う"], "explanation_ruby": "punishment = 罰《ばつ》。", "body_kana": "れんしゅうをさぼったぶいんを、こもんはグラウンド10しゅうで<punish>した。つぎのひからはだれもちこくしなくなった。"}, {"word": "purple", "meaning_jp": "紫", "pos": "名/形", "body": "夕暮れの空は、オレンジから少しずつ<purple>に変わり、最後は夜の藍色に溶けていった。", "choices": ["紫", "緑", "黄", "白"], "correct_index": 0, "explanation": "赤と青を混ぜた色。ぶどうやナスの色。", "id": "s2_244", "body_ruby": "夕暮《ゆうぐ》れの空《そら》は、オレンジから少《すこ》しずつ<purple>に変《か》わり、最後《さいご》は夜《よる》の藍色《あいいろ》に溶《と》けていった。", "choices_ruby": ["紫《むらさき》", "緑《みどり》", "黄《き》", "白《しろ》"], "explanation_ruby": "赤《あか》と青《あお》を混《ま》ぜた色《いろ》。ぶどうやナスの色《いろ》。", "body_kana": "ゆうぐれのそらは、オレンジからすこしずつ<purple>にかわり、さいごはよるのあいいろにとけていった。"}, {"word": "quick", "meaning_jp": "素早い", "pos": "形", "body": "彼女は計算がとても<quick>で、私が1問解く間に3問終わらせてしまう。", "choices": ["素早い", "のろい", "正確な", "ていねいな"], "correct_index": 0, "explanation": "quickly(素早く)の形容詞。slow(遅い)の対。", "id": "s2_245", "body_ruby": "彼女《かのじょ》は計算《けいさん》がとても<quick>で、私《わたし》が1問《もん》解《と》く間《ま》に3問《もん》終《お》わらせてしまう。", "choices_ruby": ["素早《すばや》い", "のろい", "正確《せいかく》な", "ていねいな"], "explanation_ruby": "quickly(素早《すばや》く)の形容詞《けいようし》。slow(遅《おそ》い)の対《つい》。", "body_kana": "かのじょはけいさんがとても<quick>で、わたしが1問とくまに3問おわらせてしまう。"}, {"word": "radish", "meaning_jp": "大根、ラディッシュ", "pos": "名", "body": "畑から抜いたばかりの<radish>は、葉が青々として根が白く太い。おでんに入れると味がしみて柔らかくなる。", "choices": ["大根", "にんじん", "じゃがいも", "玉ねぎ"], "correct_index": 0, "explanation": "日本の大根は daikon radish とも呼ばれる。", "id": "s2_246", "body_ruby": "畑《はたけ》から抜《ぬ》いたばかりの<radish>は、葉《は》が青々《あおあお》として根《ね》が白《しろ》く太《ふと》い。おでんに入《い》れると味《あじ》がしみて柔《やわ》らかくなる。", "choices_ruby": ["大根《だいこん》", "にんじん", "じゃがいも", "玉《たま》ねぎ"], "explanation_ruby": "日本《にっぽん》の大根《だいこん》は daikon radish とも呼《よ》ばれる。", "body_kana": "はたけからぬいたばかりの<radish>は、はがあおあおとしてねがしろくふとい。おでんにいれるとあじがしみてやわらかくなる。"}, {"word": "rain", "meaning_jp": "雨", "pos": "名", "body": "遠足の朝、空から<rain>が降り出した。てるてる坊主の願いもむなしく、行き先は体育館に変更になった。", "choices": ["雨", "雪", "ひょう", "霧"], "correct_index": 0, "explanation": "rainy(雨の)、rainbow(虹)。", "id": "s2_247", "body_ruby": "遠足《えんそく》の朝《あさ》、空《そら》から<rain>が降《お》り出《だ》した。てるてる坊主《ぼうず》の願《ねが》いもむなしく、行《い》き先《さき》は体育館《たいいくかん》に変更《へんこう》になった。", "choices_ruby": ["雨《あめ》", "雪《ゆき》", "ひょう", "霧《きり》"], "explanation_ruby": "rainy(雨《あめ》の)、rainbow(虹《にじ》)。", "body_kana": "えんそくのあさ、そらから<rain>がおりだした。てるてるぼうずのねがいもむなしく、いきさきはたいいくかんにへんこうになった。"}, {"word": "rainy", "meaning_jp": "雨の", "pos": "形", "body": "6月の<rainy>な季節には、玄関にいつも家族全員の傘が干してあり、靴もなかなか乾かない。", "choices": ["雨の", "晴れの", "雪の", "風の"], "correct_index": 0, "explanation": "rainy season = 梅雨。", "id": "s2_248", "body_ruby": "6月《がつ》の<rainy>な季節《きせつ》には、玄関《げんかん》にいつも家族全員《かぞくぜんいん》の傘《かさ》が干《ほ》してあり、靴《くつ》もなかなか乾《かわ》かない。", "choices_ruby": ["雨《あめ》の", "晴《は》れの", "雪《ゆき》の", "風《かぜ》の"], "explanation_ruby": "rainy season = 梅雨《つゆ》。", "body_kana": "6月の<rainy>なきせつには、げんかんにいつもかぞくぜんいんのかさがほしてあり、くつもなかなかかわかない。"}, {"word": "real", "meaning_jp": "本物の", "pos": "形", "body": "博物館に展示されていた恐竜の骨は、レプリカではなく1億年前の<real>な化石だと説明書きにあった。", "choices": ["本物の", "偽物の", "新品の", "想像上の"], "correct_index": 0, "explanation": "really(本当に)の形容詞。reality = 現実。", "id": "s2_249", "body_ruby": "博物館《はくぶつかん》に展示《てんじ》されていた恐竜《きょうりゅう》の骨《ほね》は、レプリカではなく1億年《おくねん》前《まえ》の<real>な化石《かせき》だと説明書《せつめいしょ》きにあった。", "choices_ruby": ["本物《ほんもの》の", "偽物《にせもの》の", "新品《しんぴん》の", "想像《そうぞう》上《うえ》の"], "explanation_ruby": "really(本当《ほんとう》に)の形容詞《けいようし》。reality = 現実《げんじつ》。", "body_kana": "はくぶつかんにてんじされていたきょうりゅうのほねは、レプリカではなく1おくねんまえの<real>なかせきだとせつめいしょきにあった。"}, {"word": "reason", "meaning_jp": "理由", "pos": "名", "body": "遅刻した<reason>を聞かれて、「電車が事故で20分止まったからです」と遅延証明書を見せた。", "choices": ["理由", "結果", "言い訳の上手さ", "時刻"], "correct_index": 0, "explanation": "the reason why ~ = 〜の理由。", "id": "s2_250", "body_ruby": "遅刻《ちこく》した<reason>を聞《き》かれて、「電車《でんしゃ》が事故《じこ》で20分《ふん》止《と》まったからです」と遅延《ちえん》証明書《しょうめいしょ》を見《み》せた。", "choices_ruby": ["理由《りゆう》", "結果《けっか》", "｜言い訳《いいわけ》の上手《じょうず》さ", "時刻《じこく》"], "explanation_ruby": "the reason why ~ = 〜の理由《りゆう》。", "body_kana": "ちこくした<reason>をきかれて、「でんしゃがじこで20分とまったからです」とちえんしょうめいしょをみせた。"}, {"word": "recipe", "meaning_jp": "レシピ、作り方", "pos": "名", "body": "祖母の肉じゃがの<recipe>には、材料の分量から煮込む時間まで、手順が細かく書かれている。", "choices": ["作り方", "値段表", "感想文", "買い物メモ"], "correct_index": 0, "explanation": "料理の手順書。発音は「レシピ」。", "id": "s2_251", "body_ruby": "祖母《そぼ》の肉《にく》じゃがの<recipe>には、材料《ざいりょう》の分量《ぶんりょう》から煮込《にこ》む時間《じかん》まで、手順《てじゅん》が細《こま》かく書《か》かれている。", "choices_ruby": ["｜作り方《つくりかた》", "値段表《ねだんひょう》", "感想文《かんそうぶん》", "｜買い物《かいもの》メモ"], "explanation_ruby": "料理《りょうり》の手順書《てじゅんしょ》。発音《はつおん》は「レシピ」。", "body_kana": "そぼのにくじゃがの<recipe>には、ざいりょうのぶんりょうからにこむじかんまで、てじゅんがこまかくかかれている。"}, {"word": "remain", "meaning_jp": "残る、〜のままである", "pos": "動", "body": "火事で校舎は焼けてしまったが、れんが造りの門だけは100年前の姿のまま<remain>している。", "choices": ["残る", "消える", "移る", "増える"], "correct_index": 0, "explanation": "そのままの状態が続くこと。remains = 遺跡。", "id": "s2_252", "body_ruby": "火事《かじ》で校舎《こうしゃ》は焼《や》けてしまったが、れんが造《づく》りの門《もん》だけは100年《ねん》前《まえ》の姿《すがた》のまま<remain>している。", "choices_ruby": ["残《のこ》る", "消《き》える", "移《うつ》る", "増《ふ》える"], "explanation_ruby": "そのままの状態《じょうたい》が続《つづ》くこと。remains = 遺跡《いせき》。", "body_kana": "かじでこうしゃはやけてしまったが、れんがづくりのもんだけは100年まえのすがたのまま<remain>している。"}, {"word": "remember", "meaning_jp": "覚えている、思い出す", "pos": "動", "body": "小学1年の担任の先生の顔と声は、5年たった今でもはっきり<remember>している。", "choices": ["覚えている", "忘れる", "間違える", "調べる"], "correct_index": 0, "explanation": "forget(忘れる)の対。", "id": "s2_253", "body_ruby": "小学《しょうがく》1年《ねん》の担任《たんにん》の先生《せんせい》の顔《かお》と声《こえ》は、5年《ねん》たった今《いま》でもはっきり<remember>している。", "choices_ruby": ["覚《おぼ》えている", "忘《わす》れる", "間違《まちが》える", "調《しら》べる"], "explanation_ruby": "forget(忘《わす》れる)の対《つい》。", "body_kana": "しょうがく1年のたんにんのせんせいのかおとこえは、5年たったいまでもはっきり<remember>している。"}, {"word": "remove", "meaning_jp": "取り除く", "pos": "動", "body": "靴の裏についたガムを、割り箸を使ってなんとか<remove>した。きれいに取れるまで5分かかった。", "choices": ["取り除く", "付け足す", "塗る", "包む"], "correct_index": 0, "explanation": "re-(再び)+ move(動かす)= どかす。", "id": "s2_254", "body_ruby": "靴《くつ》の裏《うら》についたガムを、｜割り箸《わりばし》を使《つか》ってなんとか<remove>した。きれいに取《と》れるまで5分《ふん》かかった。", "choices_ruby": ["｜取り除《とりのぞ》く", "｜付け足《つけた》す", "塗《ぬ》る", "包《つつ》む"], "explanation_ruby": "re-(再《ふたた》び)+ move(動《うご》かす)= どかす。", "body_kana": "くつのうらについたガムを、わりばしをつかってなんとか<remove>した。きれいにとれるまで5分かかった。"}, {"word": "rescue", "meaning_jp": "救助する", "pos": "動", "body": "川の中州に取り残された子猫を、消防隊員がボートで近づいて無事に<rescue>した。", "choices": ["救助する", "見学する", "撮影する", "放置する"], "correct_index": 0, "explanation": "rescue team = 救助隊。", "id": "s2_255", "body_ruby": "川《かわ》の中州《なかす》に｜取り残《とりのこ》された子猫《こねこ》を、消防隊員《しょうぼうたいいん》がボートで近《ちか》づいて無事《ぶじ》に<rescue>した。", "choices_ruby": ["救助《きゅうじょ》する", "見学《けんがく》する", "撮影《さつえい》する", "放置《ほうち》する"], "explanation_ruby": "rescue team = 救助隊《きゅうじょたい》。", "body_kana": "かわのなかすにとりのこされたこねこを、しょうぼうたいいんがボートでちかづいてぶじに<rescue>した。"}, {"word": "respect", "meaning_jp": "尊敬する", "pos": "動/名", "body": "毎朝誰より早く来て練習し、後輩にも丁寧に教えてくれる先輩を、部員全員が<respect>している。", "choices": ["尊敬する", "心配する", "批判する", "無視する"], "correct_index": 0, "explanation": "目上・立派な人を敬う気持ち。", "id": "s2_256", "body_ruby": "毎朝《まいあさ》誰《だれ》より早《はや》く来《き》て練習《れんしゅう》し、後輩《こうはい》にも丁寧《ていねい》に教《おし》えてくれる先輩《せんぱい》を、部員《ぶいん》全員《ぜんいん》が<respect>している。", "choices_ruby": ["尊敬《そんけい》する", "心配《しんぱい》する", "批判《ひはん》する", "無視《むし》する"], "explanation_ruby": "目上《めうえ》・立派《りっぱ》な人《にん》を敬《うやま》う気持《きも》ち。", "body_kana": "まいあさだれよりはやくきてれんしゅうし、こうはいにもていねいにおしえてくれるせんぱいを、ぶいんぜんいんが<respect>している。"}, {"word": "respond", "meaning_jp": "返答する、反応する", "pos": "動", "body": "名前を呼ばれたら、すぐに「はい」と<respond>するように、入学式の練習で何度も確認した。", "choices": ["返答する", "質問する", "沈黙する", "退場する"], "correct_index": 0, "explanation": "response(返答)の動詞形。", "id": "s2_257", "body_ruby": "名前《なまえ》を呼《よ》ばれたら、すぐに「はい」と<respond>するように、入学式《にゅうがくしき》の練習《れんしゅう》で何度《なんど》も確認《かくにん》した。", "choices_ruby": ["返答《へんとう》する", "質問《しつもん》する", "沈黙《ちんもく》する", "退場《たいじょう》する"], "explanation_ruby": "response(返答《へんとう》)の動詞形《どうしけい》。", "body_kana": "なまえをよばれたら、すぐに「はい」と<respond>するように、にゅうがくしきのれんしゅうでなんどもかくにんした。"}, {"word": "return", "meaning_jp": "返す、戻る", "pos": "動", "body": "図書館で借りた本は、2週間以内にカウンターへ<return>する決まりだ。期限を過ぎると次が借りられない。", "choices": ["返す", "借りる", "破る", "写す"], "correct_index": 0, "explanation": "re-(再び)+ turn(向く)= 戻る・返す。", "id": "s2_258", "body_ruby": "図書館《としょかん》で借《か》りた本《ほん》は、2週間《しゅうかん》以内《いない》にカウンターへ<return>する決《き》まりだ。期限《きげん》を過《す》ぎると次《つ》が借《か》りられない。", "choices_ruby": ["返《かえ》す", "借《か》りる", "破《やぶ》る", "写《うつ》す"], "explanation_ruby": "re-(再《ふたた》び)+ turn(向《む》く)= 戻《もど》る・返《かえ》す。", "body_kana": "としょかんでかりたほんは、2週間いないにカウンターへ<return>するきまりだ。きげんをすぎるとつがかりられない。"}, {"word": "rise", "meaning_jp": "昇る、上がる", "pos": "動", "body": "初日の出を見るために山に登った。水平線から太陽がゆっくり<rise>すると、空が金色に染まった。", "choices": ["昇る", "沈む", "止まる", "隠れる"], "correct_index": 0, "explanation": "rise-rose-risen。set(沈む)の対。", "id": "s2_259", "body_ruby": "｜初日の出《はつひので》を見《み》るために山《やま》に登《のぼ》った。水平線《すいへいせん》から太陽《たいよう》がゆっくり<rise>すると、空《そら》が金色《きんいろ》に染《そ》まった。", "choices_ruby": ["昇《のぼ》る", "沈《しず》む", "止《と》まる", "隠《かく》れる"], "explanation_ruby": "rise-rose-risen。set(沈《しず》む)の対《つい》。", "body_kana": "はつひのでをみるためにやまにのぼった。すいへいせんからたいようがゆっくり<rise>すると、そらがきんいろにそまった。"}, {"word": "road", "meaning_jp": "道路", "pos": "名", "body": "家の前の<road>は通学路になっていて、朝8時になると黄色い帽子の小学生がぞろぞろ歩いていく。", "choices": ["道路", "線路", "川", "畑"], "correct_index": 0, "explanation": "車が通る道。street は建物が並ぶ通り。", "id": "s2_260", "body_ruby": "家《いえ》の前《まえ》の<road>は通学路《つうがくろ》になっていて、朝《あさ》8時《じ》になると黄色《きいろ》い帽子《ぼうし》の小学生《しょうがくせい》がぞろぞろ歩《ある》いていく。", "choices_ruby": ["道路《どうろ》", "線路《せんろ》", "川《かわ》", "畑《はたけ》"], "explanation_ruby": "車《くるま》が通《とお》る道《みち》。street は建物《たてもの》が並《なら》ぶ通《とお》り。", "body_kana": "いえのまえの<road>はつうがくろになっていて、あさ8時になるときいろいぼうしのしょうがくせいがぞろぞろあるいていく。"}, {"word": "robot", "meaning_jp": "ロボット", "pos": "名", "body": "工場見学で、アームを正確に動かして部品を組み立てる<robot>が、休まず働き続けるのを見た。", "choices": ["ロボット", "職人", "コンピュータ", "クレーン"], "correct_index": 0, "explanation": "チェコ語の「労働」が語源。", "id": "s2_261", "body_ruby": "工場見学《こうじょうけんがく》で、アームを正確《せいかく》に動《うご》かして部品《ぶひん》を｜組み立《くみた》てる<robot>が、休《やす》まず働《はたら》き続《つづ》けるのを見《み》た。", "choices_ruby": ["ロボット", "職人《しょくにん》", "コンピュータ", "クレーン"], "explanation_ruby": "チェコ語《ご》の「労働《ろうどう》」が語源《ごげん》。", "body_kana": "こうじょうけんがくで、アームをせいかくにうごかしてぶひんをくみたてる<robot>が、やすまずはたらきつづけるのをみた。"}, {"word": "roll", "meaning_jp": "転がる、転がす", "pos": "動", "body": "坂道でボールを落としてしまい、ころころと10メートルも<roll>していくのを慌てて追いかけた。", "choices": ["転がる", "跳ねる", "止まる", "浮かぶ"], "correct_index": 0, "explanation": "ロールパン・ロールケーキ(巻いた形)の roll。", "id": "s2_262", "body_ruby": "坂道《さかみち》でボールを落《お》としてしまい、ころころと10メートルも<roll>していくのを慌《あわ》てて追《お》いかけた。", "choices_ruby": ["転《ころ》がる", "跳《は》ねる", "止《と》まる", "浮《う》かぶ"], "explanation_ruby": "ロールパン・ロールケーキ(巻《ま》いた形《かたち》)の roll。", "body_kana": "さかみちでボールをおとしてしまい、ころころと10メートルも<roll>していくのをあわてておいかけた。"}, {"word": "rule", "meaning_jp": "規則", "pos": "名", "body": "図書室には「飲食禁止」「私語は小声で」という2つの<rule>があり、入口に大きく貼り出されている。", "choices": ["規則", "本棚", "料金", "感想"], "correct_index": 0, "explanation": "follow the rules = 規則を守る。", "id": "s2_263", "body_ruby": "図書室《としょしつ》には「飲食《いんしょく》禁止《きんし》」「私語《しご》は小声《こごえ》で」という2つの<rule>があり、入口《いりぐち》に大《おお》きく貼《は》り出《だ》されている。", "choices_ruby": ["規則《きそく》", "本棚《ほんだな》", "料金《りょうきん》", "感想《かんそう》"], "explanation_ruby": "follow the rules = 規則《きそく》を守《まも》る。", "body_kana": "としょしつには「いんしょくきんし」「しごはこごえで」という2つの<rule>があり、いりぐちにおおきくはりだされている。"}, {"word": "sacred", "meaning_jp": "神聖な", "pos": "形", "body": "鳥居の先は神様のいる<sacred>な場所とされるので、参道の真ん中を避けて端を歩く人も多い。", "choices": ["神聖な", "危険な", "にぎやかな", "新しい"], "correct_index": 0, "explanation": "宗教的に特別で、汚してはならないもの。", "id": "s2_264", "body_ruby": "鳥居《とりい》の先《さき》は神様《かみさま》のいる<sacred>な場所《ばしょ》とされるので、参道《さんどう》の｜真ん中《まんなか》を避《さ》けて端《はじ》を歩《ある》く人《にん》も多《おお》い。", "choices_ruby": ["神聖《しんせい》な", "危険《きけん》な", "にぎやかな", "新《あたら》しい"], "explanation_ruby": "宗教的《しゅうきょうてき》に特別《とくべつ》で、汚《よご》してはならないもの。", "body_kana": "とりいのさきはかみさまのいる<sacred>なばしょとされるので、さんどうのまんなかをさけてはじをあるくにんもおおい。"}, {"word": "sad", "meaning_jp": "悲しい", "pos": "形", "body": "転校する親友を駅まで見送った帰り道、もう毎日会えないのだと思うと<sad>で涙が出た。", "choices": ["悲しい", "嬉しい", "楽しい", "悔しい"], "correct_index": 0, "explanation": "happy(嬉しい)の対。sadness = 悲しみ。", "id": "s2_265", "body_ruby": "転校《てんこう》する親友《しんゆう》を駅《えき》まで見送《みおく》った｜帰り道《かえりみち》、もう毎日《まいにち》会《あ》えないのだと思《おも》うと<sad>で涙《なみだ》が出《で》た。", "choices_ruby": ["悲《かな》しい", "嬉《うれ》しい", "楽《たの》しい", "悔《くや》しい"], "explanation_ruby": "happy(嬉《うれ》しい)の対《つい》。sadness = 悲《かな》しみ。", "body_kana": "てんこうするしんゆうをえきまでみおくったかえりみち、もうまいにちあえないのだとおもうと<sad>でなみだがでた。"}, {"word": "same", "meaning_jp": "同じ", "pos": "形", "body": "席替えをしたのに、隣の席はまた彼だった。3回連続で<same>並びになる確率は相当低いはずだ。", "choices": ["同じ", "違う", "近い", "新しい"], "correct_index": 0, "explanation": "different(違う)の対。the same as ~ = 〜と同じ。", "id": "s2_266", "body_ruby": "席替《せきが》えをしたのに、隣《となり》の席《せき》はまた彼《かれ》だった。3回《かい》連続《れんぞく》で<same>並《なら》びになる確率《かくりつ》は相当《そうとう》低《ひく》いはずだ。", "choices_ruby": ["同《おな》じ", "違《ちが》う", "近《ちか》い", "新《あたら》しい"], "explanation_ruby": "different(違《ちが》う)の対《つい》。the same as ~ = 〜と同《おな》じ。", "body_kana": "せきがえをしたのに、となりのせきはまたかれだった。3回れんぞくで<same>ならびになるかくりつはそうとうひくいはずだ。"}, {"word": "sang", "meaning_jp": "歌った", "pos": "動", "body": "キャンプファイヤーを囲んで、全員で校歌とポップスを3曲<sang>した。夜空に声が響いた。", "choices": ["歌った", "踊った", "聞いた", "作曲した"], "correct_index": 0, "explanation": "sing の過去形。sing-sang-sung。", "id": "s2_267", "body_ruby": "キャンプファイヤーを囲《かこ》んで、全員《ぜんいん》で校歌《こうか》とポップスを3曲《きょく》<sang>した。夜《よる》空《そら》に声《こえ》が響《ひび》いた。", "choices_ruby": ["歌《うた》った", "踊《おど》った", "聞《き》いた", "作曲《さっきょく》した"], "explanation_ruby": "sing の過去形《かこけい》。sing-sang-sung。", "body_kana": "キャンプファイヤーをかこんで、ぜんいんでこうかとポップスを3曲<sang>した。よるそらにこえがひびいた。"}, {"word": "seal", "meaning_jp": "アザラシ", "pos": "名", "body": "水族館の<seal>は、つるんとした体で氷の上をすべり、飼育員の合図で前ひれをパタパタ振った。", "choices": ["アザラシ", "ペンギン", "ラッコ", "イルカ"], "correct_index": 0, "explanation": "「印鑑・封をする」の意味もある多義語。", "id": "s2_268", "body_ruby": "水族館《すいぞくかん》の<seal>は、つるんとした体《からだ》で氷《こおり》の上《うえ》をすべり、飼育員《しいくいん》の合図《あいず》で前《まえ》ひれをパタパタ振《ふ》った。", "choices_ruby": ["アザラシ", "ペンギン", "ラッコ", "イルカ"], "explanation_ruby": "「印鑑《いんかん》・封《ふう》をする」の意味《いみ》もある多義《たぎ》語《ご》。", "body_kana": "すいぞくかんの<seal>は、つるんとしたからだでこおりのうえをすべり、しいくいんのあいずでまえひれをパタパタふった。"}, {"word": "several", "meaning_jp": "いくつかの", "pos": "形", "body": "夏祭りの屋台で<several>の店を回り、たこ焼き、かき氷、りんごあめの3つを買って食べ歩いた。", "choices": ["いくつかの", "全部の", "1つの", "数えきれない"], "correct_index": 0, "explanation": "3〜5程度の「いくつか」。a few より少し多め。", "id": "s2_269", "body_ruby": "夏祭《なつまつ》りの屋台《やたい》で<several>の店《みせ》を回《まわ》り、たこ焼《や》き、かき氷《こおり》、りんごあめの3つを買《か》って食《た》べ歩《ある》いた。", "choices_ruby": ["いくつかの", "全部《ぜんぶ》の", "1つの", "数《かぞ》えきれない"], "explanation_ruby": "3〜5程度《ていど》の「いくつか」。a few より少《すこ》し多《おお》め。", "body_kana": "なつまつりのやたいで<several>のみせをまわり、たこやき、かきこおり、りんごあめの3つをかってたべあるいた。"}, {"word": "shampoo", "meaning_jp": "シャンプー", "pos": "名", "body": "風呂場の<shampoo>が切れていたので、泡立つ髪のまま家族に新しい詰め替えを持ってきてもらった。", "choices": ["シャンプー", "タオル", "歯みがき粉", "石けん箱"], "correct_index": 0, "explanation": "髪を洗う洗剤。ヒンディー語由来。", "id": "s2_270", "body_ruby": "風呂場《ふろば》の<shampoo>が切《き》れていたので、泡立《あわだ》つ髪《かみ》のまま家族《かぞく》に新《あたら》しい｜詰め替《つめか》えを持《も》ってきてもらった。", "choices_ruby": ["シャンプー", "タオル", "歯《は》みがき粉《こな》", "石《いし》けん箱《はこ》"], "explanation_ruby": "髪《かみ》を洗《あら》う洗剤《せんざい》。ヒンディー語《ご》由来《ゆらい》。", "body_kana": "ふろばの<shampoo>がきれていたので、あわだつかみのままかぞくにあたらしいつめかえをもってきてもらった。"}, {"word": "shirt", "meaning_jp": "シャツ", "pos": "名", "body": "カレーのしずくが白い<shirt>の胸元にはねて、シミになる前に急いで水で叩き洗いした。", "choices": ["シャツ", "ズボン", "靴下", "帽子"], "correct_index": 0, "explanation": "上半身に着る服。T-shirt(Tシャツ)。", "id": "s2_271", "body_ruby": "カレーのしずくが白《しろ》い<shirt>の胸元《むなもと》にはねて、シミになる前《まえ》に急《いそ》いで水《みず》で叩《たた》き洗《あら》いした。", "choices_ruby": ["シャツ", "ズボン", "靴下《くつした》", "帽子《ぼうし》"], "explanation_ruby": "上半身《じょうはんしん》に着《き》る服《ふく》。T-shirt(Tシャツ)。", "body_kana": "カレーのしずくがしろい<shirt>のむなもとにはねて、シミになるまえにいそいでみずでたたきあらいした。"}, {"word": "shopping", "meaning_jp": "買い物", "pos": "名", "body": "週末は母と<shopping>に出かけ、スーパーで食材を、隣の店で私の靴下を買って帰った。", "choices": ["買い物", "散歩", "掃除", "外食"], "correct_index": 0, "explanation": "go shopping = 買い物に行く。", "id": "s2_272", "body_ruby": "週末《しゅうまつ》は母《はは》と<shopping>に出《で》かけ、スーパーで食材《しょくざい》を、隣《となり》の店《みせ》で私《わたし》の靴下《くつした》を買《か》って帰《かえ》った。", "choices_ruby": ["｜買い物《かいもの》", "散歩《さんぽ》", "掃除《そうじ》", "外食《がいしょく》"], "explanation_ruby": "go shopping = ｜買い物《かいもの》に行《い》く。", "body_kana": "しゅうまつはははと<shopping>にでかけ、スーパーでしょくざいを、となりのみせでわたしのくつしたをかってかえった。"}, {"word": "sick", "meaning_jp": "病気の", "pos": "形", "body": "朝から熱が38度あり、<sick>で学校を休んだ。1日中布団で眠り、夕方にやっと熱が下がった。", "choices": ["病気の", "健康な", "元気な", "空腹の"], "correct_index": 0, "explanation": "be sick in bed = 病気で寝ている。", "id": "s2_273", "body_ruby": "朝《あさ》から熱《ねつ》が38度《ど》あり、<sick>で学校《がっこう》を休《やす》んだ。1日《にち》中《なか》布団《ふとん》で眠《ねむ》り、夕方《ゆうがた》にやっと熱《ねつ》が下《さ》がった。", "choices_ruby": ["病気《びょうき》の", "健康《けんこう》な", "元気《げんき》な", "空《そら》腹《はら》の"], "explanation_ruby": "be sick in bed = 病気《びょうき》で寝《ね》ている。", "body_kana": "あさからねつが38どあり、<sick>でがっこうをやすんだ。1日なかふとんでねむり、ゆうがたにやっとねつがさがった。"}, {"word": "side", "meaning_jp": "側、横", "pos": "名", "body": "横断歩道を渡って、通りの反対<side>にあるパン屋まで行った。こちら側からは焼きたての香りがする。", "choices": ["側", "中央", "屋上", "地下"], "correct_index": 0, "explanation": "side by side = 並んで。", "id": "s2_274", "body_ruby": "横断歩道《おうだんほどう》を渡《わた》って、通《とお》りの反対《はんたい》<side>にあるパン屋《や》まで行《い》った。こちら側《がわ》からは焼《や》きたての香《かお》りがする。", "choices_ruby": ["側《がわ》", "中央《ちゅうおう》", "屋上《おくじょう》", "地下《ちか》"], "explanation_ruby": "side by side = 並《なら》んで。", "body_kana": "おうだんほどうをわたって、とおりのはんたい<side>にあるパンやまでいった。こちらがわからはやきたてのかおりがする。"}, {"word": "sign", "meaning_jp": "標識、看板", "pos": "名", "body": "道の入口に「工事中につき通り抜けできません」という<sign>が立っていて、遠回りするしかなかった。", "choices": ["標識", "信号", "地図", "鏡"], "correct_index": 0, "explanation": "g は発音しない(サイン)。動詞では「署名する」。", "id": "s2_275", "body_ruby": "道《みち》の入口《いりぐち》に「工事中《こうじちゅう》につき通《とお》り抜《ぬ》けできません」という<sign>が立《た》っていて、遠回《とおまわ》りするしかなかった。", "choices_ruby": ["標識《ひょうしき》", "信号《しんごう》", "地図《ちず》", "鏡《かがみ》"], "explanation_ruby": "g は発音《はつおん》しない(サイン)。動詞《どうし》では「署名《しょめい》する」。", "body_kana": "みちのいりぐちに「こうじちゅうにつきとおりぬけできません」という<sign>がたっていて、とおまわりするしかなかった。"}, {"word": "silent", "meaning_jp": "静かな、無言の", "pos": "形", "body": "テストが配られると、それまでざわついていた教室が一瞬で<silent>になり、鉛筆の音だけが聞こえた。", "choices": ["静かな", "騒がしい", "明るい", "寒い"], "correct_index": 0, "explanation": "silence(静けさ)の形容詞。", "id": "s2_276", "body_ruby": "テストが配《くば》られると、それまでざわついていた教室《きょうしつ》が一瞬《いっしゅん》で<silent>になり、鉛筆《えんぴつ》の音《おと》だけが聞《き》こえた。", "choices_ruby": ["静《しず》かな", "騒《さわ》がしい", "明《あか》るい", "寒《さむ》い"], "explanation_ruby": "silence(静《しず》けさ)の形容詞《けいようし》。", "body_kana": "テストがくばられると、それまでざわついていたきょうしつがいっしゅんで<silent>になり、えんぴつのおとだけがきこえた。"}, {"word": "site", "meaning_jp": "場所、敷地", "pos": "名", "body": "ここは昔の城があった<site>で、今は石垣だけが残り、公園として整備されている。", "choices": ["場所", "時代", "人物", "費用"], "correct_index": 0, "explanation": "Webサイトの site も同じ語。campsite = キャンプ場。", "id": "s2_277", "body_ruby": "ここは昔《むかし》の城《しろ》があった<site>で、今《いま》は石垣《いしがき》だけが残《のこ》り、公園《こうえん》として整備《せいび》されている。", "choices_ruby": ["場所《ばしょ》", "時代《じだい》", "人物《じんぶつ》", "費用《ひよう》"], "explanation_ruby": "Webサイトの site も同《おな》じ語《ご》。campsite = キャンプ場《ば》。", "body_kana": "ここはむかしのしろがあった<site>で、いまはいしがきだけがのこり、こうえんとしてせいびされている。"}, {"word": "size", "meaning_jp": "大きさ、サイズ", "pos": "名", "body": "去年買った靴がきつくなったので、ひとつ上の<size>に買い替えた。足は1年で1センチ伸びていた。", "choices": ["大きさ", "色", "値段", "重さ"], "correct_index": 0, "explanation": "What size? = サイズはいくつ?", "id": "s2_278", "body_ruby": "去年《きょねん》買《か》った靴《くつ》がきつくなったので、ひとつ上《うえ》の<size>に買《か》い替《か》えた。足《あし》は1年《ねん》で1センチ伸《の》びていた。", "choices_ruby": ["大《おお》きさ", "色《いろ》", "値段《ねだん》", "重《おも》さ"], "explanation_ruby": "What size? = サイズはいくつ?", "body_kana": "きょねんかったくつがきつくなったので、ひとつうえの<size>にかいかえた。あしは1年で1センチのびていた。"}, {"word": "sleep", "meaning_jp": "眠る", "pos": "動", "body": "明日は朝5時起きなので、今夜はいつもより2時間早く布団に入って<sleep>することにした。", "choices": ["眠る", "起きる", "遊ぶ", "食べる"], "correct_index": 0, "explanation": "sleep-slept-slept。sleepy = 眠い。", "id": "s2_279", "body_ruby": "明日《あした》は朝《あさ》5時《じ》起《お》きなので、今夜《こんや》はいつもより2時間《じかん》早《はや》く布団《ふとん》に入《はい》って<sleep>することにした。", "choices_ruby": ["眠《ねむ》る", "起《お》きる", "遊《あそ》ぶ", "食《た》べる"], "explanation_ruby": "sleep-slept-slept。sleepy = 眠《ねむ》い。", "body_kana": "あしたはあさ5時おきなので、こんやはいつもより2時間はやくふとんにはいって<sleep>することにした。"}, {"word": "sleepy", "meaning_jp": "眠い", "pos": "形", "body": "昨夜遅くまで本を読んでいたせいで、5時間目の授業中は<sleepy>で、まぶたが何度も落ちかけた。", "choices": ["眠い", "元気な", "空腹な", "寒い"], "correct_index": 0, "explanation": "sleep(眠る)+ -y。", "id": "s2_280", "body_ruby": "昨夜《さくや》遅《おそ》くまで本《ほん》を読《よ》んでいたせいで、5時間目《じかんめ》の授業中《じゅぎょうちゅう》は<sleepy>で、まぶたが何度《なんど》も落《お》ちかけた。", "choices_ruby": ["眠《ねむ》い", "元気《げんき》な", "空《そら》腹《はら》な", "寒《さむ》い"], "explanation_ruby": "sleep(眠《ねむ》る)+ -y。", "body_kana": "さくやおそくまでほんをよんでいたせいで、5時間目のじゅぎょうちゅうは<sleepy>で、まぶたがなんどもおちかけた。"}, {"word": "slow", "meaning_jp": "遅い", "pos": "形", "body": "亀の歩みはとても<slow>で、廊下の端から端まで進むのに10分以上かかった。", "choices": ["遅い", "速い", "強い", "上手な"], "correct_index": 0, "explanation": "fast(速い)の対。slowly = ゆっくりと。", "id": "s2_281", "body_ruby": "亀《かめ》の歩《あゆ》みはとても<slow>で、廊下《ろうか》の端《はじ》から端《はじ》まで進《すす》むのに10分《ふん》以上《いじょう》かかった。", "choices_ruby": ["遅《おそ》い", "速《はや》い", "強《つよ》い", "上手《じょうず》な"], "explanation_ruby": "fast(速《はや》い)の対《つい》。slowly = ゆっくりと。", "body_kana": "かめのあゆみはとても<slow>で、ろうかのはじからはじまですすむのに10分いじょうかかった。"}, {"word": "smile", "meaning_jp": "ほほえむ、笑顔", "pos": "動/名", "body": "賞状を受け取った彼女は、緊張がほどけたのか、客席に向かってにっこり<smile>した。", "choices": ["ほほえむ", "泣く", "怒る", "驚く"], "correct_index": 0, "explanation": "声を出さない笑い。声を出すのは laugh。", "id": "s2_282", "body_ruby": "賞状《しょうじょう》を｜受け取《うけと》った彼女《かのじょ》は、緊張《きんちょう》がほどけたのか、客席《きゃくせき》に向《む》かってにっこり<smile>した。", "choices_ruby": ["ほほえむ", "泣《な》く", "怒《いか》る", "驚《おどろ》く"], "explanation_ruby": "声《こえ》を出《だ》さない笑《わら》い。声《こえ》を出《だ》すのは laugh。", "body_kana": "しょうじょうをうけとったかのじょは、きんちょうがほどけたのか、きゃくせきにむかってにっこり<smile>した。"}, {"word": "snow", "meaning_jp": "雪", "pos": "名", "body": "朝起きてカーテンを開けると、一晩で20センチの<snow>が積もり、町全体が白一色になっていた。", "choices": ["雪", "雨", "霜", "ひょう"], "correct_index": 0, "explanation": "snowman = 雪だるま、snowball = 雪玉。", "id": "s2_283", "body_ruby": "朝起《あさお》きてカーテンを開《ひら》けると、一晩《ひとばん》で20センチの<snow>が積《つ》もり、町全体《まちぜんたい》が白《しろ》一色《いっしょく》になっていた。", "choices_ruby": ["雪《ゆき》", "雨《あめ》", "霜《しも》", "ひょう"], "explanation_ruby": "snowman = 雪《ゆき》だるま、snowball = 雪玉《ゆきだま》。", "body_kana": "あさおきてカーテンをひらけると、ひとばんで20センチの<snow>がつもり、まちぜんたいがしろいっしょくになっていた。"}, {"word": "snowy", "meaning_jp": "雪の", "pos": "形", "body": "<snowy>な日の通学は、滑らないように一歩ずつ踏みしめて歩くので、いつもの倍の時間がかかる。", "choices": ["雪の", "晴れの", "曇りの", "嵐の"], "correct_index": 0, "explanation": "snow + -y。rainy、sunny の仲間。", "id": "s2_284", "body_ruby": "<snowy>な日《ひ》の通学《つうがく》は、滑《すべ》らないように一歩《いっぽ》ずつ踏《ふ》みしめて歩《ある》くので、いつもの倍《ばい》の時間《じかん》がかかる。", "choices_ruby": ["雪《ゆき》の", "晴《は》れの", "曇《くも》りの", "嵐《あらし》の"], "explanation_ruby": "snow + -y。rainy、sunny の仲間《なかま》。", "body_kana": "<snowy>なひのつうがくは、すべらないようにいっぽずつふみしめてあるくので、いつものばいのじかんがかかる。"}, {"word": "soldier", "meaning_jp": "兵士", "pos": "名", "body": "祖父の祖父は戦争で<soldier>として戦地に送られたと、仏壇の古い写真を前に祖父が話してくれた。", "choices": ["兵士", "医師", "商人", "農民"], "correct_index": 0, "explanation": "発音は「ソウルジャー」。army(軍隊)の一員。", "id": "s2_285", "body_ruby": "祖父《そふ》の祖父《そふ》は戦争《せんそう》で<soldier>として戦地《せんち》に送《おく》られたと、仏壇《ぶつだん》の古《ふる》い写真《しゃしん》を前《まえ》に祖父《そふ》が話《はな》してくれた。", "choices_ruby": ["兵士《へいし》", "医師《いし》", "商人《しょうにん》", "農民《のうみん》"], "explanation_ruby": "発音《はつおん》は「ソウルジャー」。army(軍隊《ぐんたい》)の一員《いちいん》。", "body_kana": "そふのそふはせんそうで<soldier>としてせんちにおくられたと、ぶつだんのふるいしゃしんをまえにそふがはなしてくれた。"}, {"word": "sound", "meaning_jp": "音", "pos": "名", "body": "夜の静けさの中、遠くから踏切の<sound>がかすかに聞こえてくる。カンカンという規則正しい響きだ。", "choices": ["音", "光", "匂い", "味"], "correct_index": 0, "explanation": "動詞では「〜に聞こえる」(Sounds good! = いいね!)。", "id": "s2_286", "body_ruby": "夜《よる》の静《しず》けさの中《なか》、遠《とお》くから踏切《ふみきり》の<sound>がかすかに聞《き》こえてくる。カンカンという規則正《きそくただ》しい響《ひび》きだ。", "choices_ruby": ["音《おと》", "光《ひかり》", "匂《にお》い", "味《あじ》"], "explanation_ruby": "動詞《どうし》では「〜に聞《き》こえる」(Sounds good! = いいね!)。", "body_kana": "よるのしずけさのなか、とおくからふみきりの<sound>がかすかにきこえてくる。カンカンというきそくただしいひびきだ。"}, {"word": "space", "meaning_jp": "宇宙、空間", "pos": "名", "body": "ロケットは大気圏を抜け、星がまたたく真っ暗な<space>へと飛び出していった。", "choices": ["宇宙", "海底", "地下", "森林"], "correct_index": 0, "explanation": "「すき間・空間」の意味も(parking space = 駐車スペース)。", "id": "s2_287", "body_ruby": "ロケットは大気圏《たいきけん》を抜《ぬ》け、星《ほし》がまたたく｜真っ暗《まっくら》な<space>へと｜飛び出《とびだ》していった。", "choices_ruby": ["宇宙《うちゅう》", "海底《かいてい》", "地下《ちか》", "森林《しんりん》"], "explanation_ruby": "「すき間《かん》・空《そら》間《かん》」の意味《いみ》も(parking space = 駐車《ちゅうしゃ》スペース)。", "body_kana": "ロケットはたいきけんをぬけ、ほしがまたたくまっくらな<space>へととびだしていった。"}, {"word": "spend", "meaning_jp": "(時間・お金を)使う", "pos": "動", "body": "夏休みの最終日は、宿題の追い込みに丸一日を<spend>した。朝9時から夜9時まで机の前にいた。", "choices": ["使う", "貯める", "稼ぐ", "数える"], "correct_index": 0, "explanation": "spend-spent-spent。時間にもお金にも使う。", "id": "s2_288", "body_ruby": "夏休《なつやす》みの最終日《さいしゅうび》は、宿題《しゅくだい》の｜追い込《おいこ》みに丸一日《まるいちにち》を<spend>した。朝《あさ》9時《じ》から夜《よる》9時《じ》まで机《つくえ》の前《まえ》にいた。", "choices_ruby": ["使《つか》う", "貯《た》める", "稼《かせ》ぐ", "数《かぞ》える"], "explanation_ruby": "spend-spent-spent。時間《じかん》にもお金《かね》にも使《つか》う。", "body_kana": "なつやすみのさいしゅうびは、しゅくだいのおいこみにまるいちにちを<spend>した。あさ9時からよる9時までつくえのまえにいた。"}, {"word": "spoke", "meaning_jp": "話した", "pos": "動", "body": "朝礼で校長先生が、創立100年の歴史について10分ほど<spoke>した。", "choices": ["話した", "歌った", "笑った", "歩いた"], "correct_index": 0, "explanation": "speak の過去形。speak-spoke-spoken。", "id": "s2_289", "body_ruby": "朝礼《ちょうれい》で校長先生《こうちょうせんせい》が、創立《そうりつ》100年《ねん》の歴史《れきし》について10分《ふん》ほど<spoke>した。", "choices_ruby": ["話《はな》した", "歌《うた》った", "笑《わら》った", "歩《ある》いた"], "explanation_ruby": "speak の過去形《かこけい》。speak-spoke-spoken。", "body_kana": "ちょうれいでこうちょうせんせいが、そうりつ100年のれきしについて10分ほど<spoke>した。"}, {"word": "spoken", "meaning_jp": "話される", "pos": "動", "body": "英語は世界の80以上の国で<spoken>されていて、母語でない人どうしの共通語にもなっている。", "choices": ["話される", "禁止される", "発明される", "翻訳される"], "correct_index": 0, "explanation": "speak の過去分詞。spoken language = 話し言葉。", "id": "s2_290", "body_ruby": "英語《えいご》は世界《せかい》の80以上《いじょう》の国《くに》で<spoken>されていて、母語《ぼご》でない人《にん》どうしの共通語《きょうつうご》にもなっている。", "choices_ruby": ["話《はな》される", "禁止《きんし》される", "発明《はつめい》される", "翻訳《ほんやく》される"], "explanation_ruby": "speak の過去分詞《かこぶんし》。spoken language = ｜話し言葉《はなしことば》。", "body_kana": "えいごはせかいの80いじょうのくにで<spoken>されていて、ぼごでないにんどうしのきょうつうごにもなっている。"}, {"word": "spread", "meaning_jp": "広がる、広げる", "pos": "動", "body": "うわさは1日で学年中に<spread>して、翌朝には隣のクラスの人まで話しかけてきた。", "choices": ["広がる", "消える", "縮む", "止まる"], "correct_index": 0, "explanation": "spread-spread-spread(無変化)。", "id": "s2_291", "body_ruby": "うわさは1日《にち》で学年《がくねん》中《なか》に<spread>して、翌朝《よくあさ》には隣《となり》のクラスの人《にん》まで話《はな》しかけてきた。", "choices_ruby": ["広《ひろ》がる", "消《き》える", "縮《ちぢ》む", "止《と》まる"], "explanation_ruby": "spread-spread-spread(無変化《むへんか》)。", "body_kana": "うわさは1日でがくねんなかに<spread>して、よくあさにはとなりのクラスのにんまではなしかけてきた。"}, {"word": "stadium", "meaning_jp": "スタ
