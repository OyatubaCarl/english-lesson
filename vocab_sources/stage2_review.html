<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordTacos Stage 2 ─ 400問レビュー</title>
<style>
:root {
  --bg: #FFF8EE;
  --paper: #FFFDF7;
  --ink: #2A1F14;
  --sub: #6B5A47;
  --accent: #C73E1D;
  --green: #4A7C59;
  --green-soft: #EAF4EC;
  --yellow: #E8B647;
  --border: #E6D5BC;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Hiragino Sans", "Hiragino Maru Gothic ProN", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  padding: 16px;
}
.wrap { max-width: 900px; margin: 0 auto; }
header {
  text-align: center;
  padding: 20px 0;
  border-bottom: 2px dashed var(--border);
  margin-bottom: 24px;
}
h1 { font-size: 1.8rem; }
h1 .taco { color: var(--accent); }
.subtitle { font-size: 0.85rem; color: var(--sub); margin-top: 4px; }
.controls {
  position: sticky;
  top: 0;
  background: var(--bg);
  padding: 12px 0;
  z-index: 100;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.95rem;
  font-family: inherit;
  background: var(--paper);
}
.search-box:focus { outline: none; border-color: var(--accent); }
.stats {
  font-size: 0.8rem;
  color: var(--sub);
  padding: 0 8px;
}
.filter-chip {
  padding: 6px 12px;
  font-size: 0.78rem;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  user-select: none;
}
.filter-chip.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.cards {
  display: grid;
  gap: 8px;
}
.card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.card-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.id {
  font-family: "SF Mono", monospace;
  font-size: 0.7rem;
  color: var(--sub);
}
.word {
  font-family: "Helvetica Neue", sans-serif;
  font-weight: 700;
  color: var(--accent);
  font-size: 1.1rem;
}
.pos {
  font-size: 0.65rem;
  background: var(--green);
  color: white;
  padding: 1px 6px;
  border-radius: 3px;
}
.meaning {
  font-size: 0.85rem;
  color: var(--sub);
}
.body {
  font-size: 0.95rem;
  line-height: 1.7;
  padding: 8px 10px;
  background: linear-gradient(180deg, #FFF7E8, #FFF1D6);
  border-left: 3px solid var(--yellow);
  border-radius: 0 6px 6px 0;
  margin-bottom: 6px;
}
.body .embed {
  display: inline-block;
  background: var(--accent);
  color: white;
  font-family: "Helvetica Neue", sans-serif;
  font-weight: 700;
  padding: 0 6px;
  border-radius: 4px;
  margin: 0 1px;
}
.choices-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 0.78rem;
  margin-top: 4px;
}
.choice-chip {
  background: white;
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 6px;
}
.choice-chip.correct {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--green);
  font-weight: 700;
}
.explanation {
  font-size: 0.78rem;
  color: var(--sub);
  margin-top: 4px;
  padding: 4px 8px;
  background: #FDF6E3;
  border-radius: 4px;
}
.hidden { display: none; }
.no-results {
  text-align: center;
  padding: 40px;
  color: var(--sub);
}
ruby rt { font-size: 0.45em; color: var(--sub); font-weight: 400; }
.embed ruby rt { color: rgba(255,255,255,0.92); }
body.no-ruby rt { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word<span class="taco">Tacos</span> ─ Stage 2 レビュー</h1>
    <div class="subtitle">中2範囲 全403問 / 単語・本文・選択肢・解説を一覧</div>
  </header>

  <div class="controls">
    <input type="text" class="search-box" id="search" placeholder="🔍 単語・意味・本文を検索(例: nose / 鼻 / 風邪)">
    <span class="stats" id="stats">─</span>
    <span class="filter-chip active" data-pos="all">全て</span>
    <span class="filter-chip" data-pos="名">名</span>
    <span class="filter-chip" data-pos="動">動</span>
    <span class="filter-chip" data-pos="形">形</span>
    <span class="filter-chip" data-pos="副">副</span>
    <span class="filter-chip active" id="ruby-chip">ふりがな</span>
  </div>

  <div class="cards" id="cards"></div>
  <div class="no-results hidden" id="no-results">該当する問題なし</div>
</div>

<script>
const DATA = [{"word": "a.m.", "meaning_jp": "午前", "pos": "副", "body": "目覚まし時計を6<a.m.>にセットした。鳴った時、外はまだ薄暗く、太陽が昇り始めたばかりだった。", "choices": ["午前", "午後", "深夜", "夕方"], "correct_index": 0, "explanation": "ラテン語 ante meridiem(正午の前)の略。午後は p.m.。", "id": "s2_001", "body_ruby": "目覚《めざ》まし時計《とけい》を6<a.m.>にセットした。鳴《な》った時《とき》、外《そと》はまだ薄暗《うすぐら》く、太陽《たいよう》が昇《のぼ》り始《はじ》めたばかりだった。", "choices_ruby": ["午前《ごぜん》", "午後《ごご》", "深夜《しんや》", "夕方《ゆうがた》"], "explanation_ruby": "ラテン語《ご》 ante meridiem(正午《しょうご》の前《まえ》)の略《りゃく》。午後《ごご》は p.m.。", "body_kana": "めざましとけいを6<a.m.>にセットした。なったとき、そとはまだうすぐらく、たいようがのぼりはじめたばかりだった。"}, {"word": "action", "meaning_jp": "行動", "pos": "名", "body": "計画を立てるだけでは何も変わらない。掃除でも勉強でも、まず<action>を起こすことが大切だと先生が言った。", "choices": ["行動", "計画", "休憩", "想像"], "correct_index": 0, "explanation": "act(動く)+ -ion。アクション映画の action も同じ。", "id": "s2_002", "body_ruby": "計画《けいかく》を立《た》てるだけでは何《なに》も変《か》わらない。掃除《そうじ》でも勉強《べんきょう》でも、まず<action>を起《お》こすことが大切《たいせつ》だと先生《せんせい》が言《い》った。", "choices_ruby": ["行動《こうどう》", "計画《けいかく》", "休憩《きゅうけい》", "想像《そうぞう》"], "explanation_ruby": "act(動《うご》く)+ -ion。アクション映画《えいが》の action も同《おな》じ。", "body_kana": "けいかくをたてるだけではなにもかわらない。そうじでもべんきょうでも、まず<action>をおこすことがたいせつだとせんせいがいった。"}, {"word": "actor", "meaning_jp": "俳優", "pos": "名", "body": "あの映画の主役を演じた<actor>は、悲しい場面で本当に涙を流していて、演技とは思えないほどだった。", "choices": ["俳優", "監督", "歌手", "作家"], "correct_index": 0, "explanation": "act(演じる)+ -or(人)。女優は actress とも。", "id": "s2_003", "body_ruby": "あの映画《えいが》の主役《しゅやく》を演《えん》じた<actor>は、悲《かな》しい場面《ばめん》で本当《ほんとう》に涙《なみだ》を流《なが》していて、演技《えんぎ》とは思《おも》えないほどだった。", "choices_ruby": ["俳優《はいゆう》", "監督《かんとく》", "歌手《かしゅ》", "作家《さっか》"], "explanation_ruby": "act(演《えん》じる)+ -or(人《にん》)。女優《じょゆう》は actress とも。", "body_kana": "あのえいがのしゅやくをえんじた<actor>は、かなしいばめんでほんとうになみだをながしていて、えんぎとはおもえないほどだった。"}, {"word": "addition", "meaning_jp": "足し算、追加", "pos": "名", "body": "算数で最初に習うのは、2+3=5のような<addition>だ。次に引き算、その後にかけ算を学ぶ。", "choices": ["足し算", "引き算", "かけ算", "割り算"], "correct_index": 0, "explanation": "add(加える)+ -ition。in addition = さらに。", "id": "s2_004", "body_ruby": "算数《さんすう》で最初《さいしょ》に習《なら》うのは、2+3=5のような<addition>だ。次《つぎ》に｜引き算《ひきざん》、その後《あと》にかけ算《ざん》を学《まな》ぶ。", "choices_ruby": ["｜足し算《たしざん》", "｜引き算《ひきざん》", "かけ算《ざん》", "｜割り算《わりざん》"], "explanation_ruby": "add(加《くわ》える)+ -ition。in addition = さらに。", "body_kana": "さんすうでさいしょにならうのは、2+3=5のような<addition>だ。つぎにひきざん、そのあとにかけざんをまなぶ。"}, {"word": "adult", "meaning_jp": "大人", "pos": "名", "body": "映画館の料金表には、子ども800円、<adult>1800円と書いてあった。18歳以上はこちらの料金になる。", "choices": ["大人", "子ども", "学生", "高齢者"], "correct_index": 0, "explanation": "child(子ども)の対。成長しきった人。", "id": "s2_005", "body_ruby": "映画館《えいがかん》の料金表《りょうきんひょう》には、子《こ》ども800円《えん》、<adult>1800円《えん》と書《か》いてあった。18歳《さい》以上《いじょう》はこちらの料金《りょうきん》になる。", "choices_ruby": ["大人《おとな》", "子《こ》ども", "学生《がくせい》", "高齢者《こうれいしゃ》"], "explanation_ruby": "child(子《こ》ども)の対《つい》。成長《せいちょう》しきった人《にん》。", "body_kana": "えいがかんのりょうきんひょうには、こども800円、<adult>1800円とかいてあった。18歳いじょうはこちらのりょうきんになる。"}, {"word": "afraid", "meaning_jp": "怖がって", "pos": "形", "body": "弟は雷が<afraid>で、ゴロゴロと音が鳴り始めると、急いで布団の中にもぐりこんでしまう。", "choices": ["怖がって", "好きで", "楽しみで", "得意で"], "correct_index": 0, "explanation": "be afraid of ~ = 〜を恐れる。I'm afraid ~ = 残念ながら〜。", "id": "s2_006", "body_ruby": "弟《おとうと》は雷《かみなり》が<afraid>で、ゴロゴロと音《おと》が鳴《な》り始《はじ》めると、急《いそ》いで布団《ふとん》の中《なか》にもぐりこんでしまう。", "choices_ruby": ["怖《こわ》がって", "好《す》きで", "楽《たの》しみで", "得意《とくい》で"], "explanation_ruby": "be afraid of ~ = 〜を恐《おそ》れる。I'm afraid ~ = 残念《ざんねん》ながら〜。", "body_kana": "おとうとはかみなりが<afraid>で、ゴロゴロとおとがなりはじめると、いそいでふとんのなかにもぐりこんでしまう。"}, {"word": "again", "meaning_jp": "もう一度", "pos": "副", "body": "1回目の逆上がりは失敗した。でも諦めずに<again>挑戦したら、2回目で初めて成功した。", "choices": ["もう一度", "初めて", "最後に", "たまに"], "correct_index": 0, "explanation": "Try again! = もう一度やってみて!", "id": "s2_007", "body_ruby": "1回《かい》目《め》の｜逆上がり《さかあがり》は失敗《しっぱい》した。でも諦《あきら》めずに<again>挑戦《ちょうせん》したら、2回《かい》目《め》で初《はじ》めて成功《せいこう》した。", "choices_ruby": ["もう一度《いちど》", "初《はじ》めて", "最後《さいご》に", "たまに"], "explanation_ruby": "Try again! = もう一度《いちど》やってみて!", "body_kana": "1回めのさかあがりはしっぱいした。でもあきらめずに<again>ちょうせんしたら、2回めではじめてせいこうした。"}, {"word": "agree", "meaning_jp": "賛成する", "pos": "動", "body": "文化祭の出し物を決める話し合いで、お化け屋敷という案に、クラス30人中28人が<agree>した。", "choices": ["賛成する", "反対する", "無視する", "迷う"], "correct_index": 0, "explanation": "agree with ~ = 〜に賛成。disagree(反対する)の対。", "id": "s2_008", "body_ruby": "文化祭《ぶんかさい》の｜出し物《だしもの》を決《き》める｜話し合《はなしあ》いで、お化《ば》け屋敷《やしき》という案《あん》に、クラス30人《にん》中《なか》28人《にん》が<agree>した。", "choices_ruby": ["賛成《さんせい》する", "反対《はんたい》する", "無視《むし》する", "迷《まよ》う"], "explanation_ruby": "agree with ~ = 〜に賛成《さんせい》。disagree(反対《はんたい》する)の対《つい》。", "body_kana": "ぶんかさいのだしものをきめるはなしあいで、おばけやしきというあんに、クラス30人なか28人が<agree>した。"}, {"word": "air", "meaning_jp": "空気", "pos": "名", "body": "朝の山の<air>は冷たくて澄んでいて、深呼吸すると胸の中まできれいになる気がした。", "choices": ["空気", "水", "土", "光"], "correct_index": 0, "explanation": "airport(空港)、air conditioner(エアコン)。", "id": "s2_009", "body_ruby": "朝《あさ》の山《やま》の<air>は冷《つめ》たくて澄《す》んでいて、深呼吸《しんこきゅう》すると胸《むね》の中《なか》まできれいになる気《き》がした。", "choices_ruby": ["空《そら》気《き》", "水《みず》", "土《つち》", "光《ひかり》"], "explanation_ruby": "airport(空《そら》港《みなと》)、air conditioner(エアコン)。", "body_kana": "あさのやまの<air>はつめたくてすんでいて、しんこきゅうするとむねのなかまできれいになるきがした。"}, {"word": "almost", "meaning_jp": "ほとんど、もう少しで", "pos": "副", "body": "テストは100点満点中98点で、<almost>満点だった。最後の1問だけ計算ミスをしてしまった。", "choices": ["もう少しで", "完全に", "全く〜ない", "ちょうど"], "correct_index": 0, "explanation": "完全には届かないが、すぐ近くまで。almost all = ほとんど全部。", "id": "s2_010", "body_ruby": "テストは100点《てん》満点《まんてん》中《なか》98点《てん》で、<almost>満点《まんてん》だった。最後《さいご》の1問《もん》だけ計算《けいさん》ミスをしてしまった。", "choices_ruby": ["もう少《すこ》しで", "完全《かんぜん》に", "全《まった》く〜ない", "ちょうど"], "explanation_ruby": "完全《かんぜん》には届《とど》かないが、すぐ近《ちか》くまで。almost all = ほとんど全部《ぜんぶ》。", "body_kana": "テストは100点まんてんなか98点で、<almost>まんてんだった。さいごの1問だけけいさんミスをしてしまった。"}, {"word": "amazing", "meaning_jp": "驚くべき、すごい", "pos": "形", "body": "体育祭で彼は、走り高跳びで自分の身長より高いバーを跳び越えた。観客全員が立ち上がるほど<amazing>な記録だった。", "choices": ["驚くべき", "普通の", "残念な", "退屈な"], "correct_index": 0, "explanation": "amaze(驚かせる)+ -ing。良い意味の驚きに使う。", "id": "s2_011", "body_ruby": "体育祭《たいいくさい》で彼《かれ》は、走《はし》り高跳《たかとび》びで自分《じぶん》の身長《しんちょう》より高《たか》いバーを跳《と》び越《こ》えた。観客《かんきゃく》全員《ぜんいん》が｜立ち上《たちあ》がるほど<amazing>な記録《きろく》だった。", "choices_ruby": ["驚《おどろ》くべき", "普通《ふつう》の", "残念《ざんねん》な", "退屈《たいくつ》な"], "explanation_ruby": "amaze(驚《おどろ》かせる)+ -ing。良《よ》い意味《いみ》の驚《おどろ》きに使《つか》う。", "body_kana": "たいいくさいでかれは、はしりたかとびびでじぶんのしんちょうよりたかいバーをとびこえた。かんきゃくぜんいんがたちあがるほど<amazing>なきろくだった。"}, {"word": "angry", "meaning_jp": "怒って", "pos": "形", "body": "弟が私のケーキを勝手に全部食べてしまったので、さすがに<angry>になって、声を荒げてしまった。", "choices": ["怒って", "嬉しくて", "悲しくて", "驚いて"], "correct_index": 0, "explanation": "get angry = 怒る。anger(怒り)の形容詞。", "id": "s2_012", "body_ruby": "弟《おとうと》が私《わたし》のケーキを勝手《かって》に全部《ぜんぶ》食《た》べてしまったので、さすがに<angry>になって、声《こえ》を荒《あら》げてしまった。", "choices_ruby": ["怒《いか》って", "嬉《うれ》しくて", "悲《かな》しくて", "驚《おどろ》いて"], "explanation_ruby": "get angry = 怒《いか》る。anger(怒《いか》り)の形容詞《けいようし》。", "body_kana": "おとうとがわたしのケーキをかってにぜんぶたべてしまったので、さすがに<angry>になって、こえをあらげてしまった。"}, {"word": "anytime", "meaning_jp": "いつでも", "pos": "副", "body": "「困ったことがあったら<anytime>電話してね。朝でも夜中でも構わないから」と祖母が言ってくれた。", "choices": ["いつでも", "一度だけ", "決して〜ない", "今だけ"], "correct_index": 0, "explanation": "any(どんな)+ time(時)。", "id": "s2_013", "body_ruby": "「困《こま》ったことがあったら<anytime>電話《でんわ》してね。朝《あさ》でも夜中《よなか》でも構《かま》わないから」と祖母《そぼ》が言《い》ってくれた。", "choices_ruby": ["いつでも", "一度《いちど》だけ", "決《けっ》して〜ない", "今《いま》だけ"], "explanation_ruby": "any(どんな)+ time(時《とき》)。", "body_kana": "「こまったことがあったら<anytime>でんわしてね。あさでもよなかでもかまわないから」とそぼがいってくれた。"}, {"word": "arrive", "meaning_jp": "到着する", "pos": "動", "body": "朝8時に家を出て、電車とバスを乗り継いで、10時ちょうどに目的地の博物館に<arrive>した。", "choices": ["到着する", "出発する", "通過する", "戻る"], "correct_index": 0, "explanation": "arrive at/in ~ = 〜に着く。leave(出発する)の対。", "id": "s2_014", "body_ruby": "朝《あさ》8時《じ》に家《いえ》を出《で》て、電車《でんしゃ》とバスを乗《の》り継《つ》いで、10時《じ》ちょうどに目的地《もくてきち》の博物館《はくぶつかん》に<arrive>した。", "choices_ruby": ["到着《とうちゃく》する", "出発《しゅっぱつ》する", "通過《つうか》する", "戻《もど》る"], "explanation_ruby": "arrive at/in ~ = 〜に着《つ》く。leave(出発《しゅっぱつ》する)の対《つい》。", "body_kana": "あさ8時にいえをでて、でんしゃとバスをのりついで、10時ちょうどにもくてきちのはくぶつかんに<arrive>した。"}, {"word": "astronaut", "meaning_jp": "宇宙飛行士", "pos": "名", "body": "彼の夢は<astronaut>になって、ロケットで宇宙ステーションに行き、地球を窓から眺めることだ。", "choices": ["宇宙飛行士", "パイロット", "科学者", "船長"], "correct_index": 0, "explanation": "astro(星)+ naut(船乗り)= 星の船乗り。", "id": "s2_015", "body_ruby": "彼《かれ》の夢《ゆめ》は<astronaut>になって、ロケットで宇宙《うちゅう》ステーションに行《い》き、地球《ちきゅう》を窓《まど》から眺《なが》めることだ。", "choices_ruby": ["宇宙飛行士《うちゅうひこうし》", "パイロット", "科学者《かがくしゃ》", "船長《せんちょう》"], "explanation_ruby": "astro(星《ほし》)+ naut(船乗《ふなの》り)= 星《ほし》の船乗《ふなの》り。", "body_kana": "かれのゆめは<astronaut>になって、ロケットでうちゅうステーションにいき、ちきゅうをまどからながめることだ。"}, {"word": "away", "meaning_jp": "離れて", "pos": "副", "body": "蹴ったボールが坂道を転がって、20メートルも<away>に行ってしまい、取りに走るのが大変だった。", "choices": ["離れて", "近くに", "手元に", "上に"], "correct_index": 0, "explanation": "far away = 遠く離れて。run away = 逃げる。", "id": "s2_016", "body_ruby": "蹴《け》ったボールが坂道《さかみち》を転《ころ》がって、20メートルも<away>に行《い》ってしまい、取《と》りに走《はし》るのが大変《たいへん》だった。", "choices_ruby": ["離《はな》れて", "近《ちか》くに", "手元《てもと》に", "上《うえ》に"], "explanation_ruby": "far away = 遠《とお》く離《はな》れて。run away = 逃《に》げる。", "body_kana": "けったボールがさかみちをころがって、20メートルも<away>にいってしまい、とりにはしるのがたいへんだった。"}, {"word": "baby", "meaning_jp": "赤ちゃん", "pos": "名", "body": "先月、いとこの家に<baby>が生まれた。まだ首もすわっていなくて、ミルクを飲んでは眠るのを繰り返している。", "choices": ["赤ちゃん", "子犬", "幼稚園児", "小学生"], "correct_index": 0, "explanation": "生まれて間もない子。baby car ではなく stroller(ベビーカー)。", "id": "s2_017", "body_ruby": "先月《せんげつ》、いとこの家《いえ》に<baby>が生《う》まれた。まだ首《くび》もすわっていなくて、ミルクを飲《の》んでは眠《ねむ》るのを｜繰り返《くりかえ》している。", "choices_ruby": ["赤《あか》ちゃん", "子犬《こいぬ》", "幼稚園児《ようちえんじ》", "小学生《しょうがくせい》"], "explanation_ruby": "生《う》まれて間《ま》もない子《こ》。baby car ではなく stroller(ベビーカー)。", "body_kana": "せんげつ、いとこのいえに<baby>がうまれた。まだくびもすわっていなくて、ミルクをのんではねむるのをくりかえしている。"}, {"word": "bad", "meaning_jp": "悪い", "pos": "形", "body": "今日は朝から雨で、傘も忘れて、テストも返ってきて30点だった。本当に<bad>な一日だった。", "choices": ["悪い", "良い", "楽しい", "普通の"], "correct_index": 0, "explanation": "good(良い)の対。bad-worse-worst と変化する。", "id": "s2_018", "body_ruby": "今日《きょう》は朝《あさ》から雨《あめ》で、傘《かさ》も忘《わす》れて、テストも返《かえ》ってきて30点《てん》だった。本当《ほんとう》に<bad>な一日《いちにち》だった。", "choices_ruby": ["悪《わる》い", "良《よ》い", "楽《たの》しい", "普通《ふつう》の"], "explanation_ruby": "good(良《よ》い)の対《つい》。bad-worse-worst と変化《へんか》する。", "body_kana": "きょうはあさからあめで、かさもわすれて、テストもかえってきて30点だった。ほんとうに<bad>ないちにちだった。"}, {"word": "balance", "meaning_jp": "バランス、釣り合い", "pos": "名", "body": "体操の平均台では、両腕を左右に広げて<balance>を取りながら、細い台の上をゆっくり歩く。", "choices": ["バランス", "スピード", "パワー", "リズム"], "correct_index": 0, "explanation": "keep one's balance = 体勢を保つ。", "id": "s2_019", "body_ruby": "体操《たいそう》の平均《へいきん》台《だい》では、両腕《りょううで》を左右《さゆう》に広《ひろ》げて<balance>を取《と》りながら、細《こま》い台《だい》の上《うえ》をゆっくり歩《ある》く。", "choices_ruby": ["バランス", "スピード", "パワー", "リズム"], "explanation_ruby": "keep one's balance = 体勢《たいせい》を保《たも》つ。", "body_kana": "たいそうのへいきんだいでは、りょううでをさゆうにひろげて<balance>をとりながら、こまいだいのうえをゆっくりあるく。"}, {"word": "bathroom", "meaning_jp": "浴室、トイレ", "pos": "名", "body": "家に帰ってすぐ、お湯をためた<bathroom>で1日の汗を流した。鏡が湯気で真っ白になった。", "choices": ["浴室", "台所", "寝室", "玄関"], "correct_index": 0, "explanation": "bath(風呂)+ room。アメリカではトイレの意味でも使う。", "id": "s2_020", "body_ruby": "家《いえ》に帰《かえ》ってすぐ、お湯《ゆ》をためた<bathroom>で1日《にち》の汗《あせ》を流《なが》した。鏡《かがみ》が湯気《ゆげ》で｜真っ白《まっしろ》になった。", "choices_ruby": ["浴室《よくしつ》", "台所《だいどころ》", "寝室《しんしつ》", "玄関《げんかん》"], "explanation_ruby": "bath(風呂《ふろ》)+ room。アメリカではトイレの意味《いみ》でも使《つか》う。", "body_kana": "いえにかえってすぐ、おゆをためた<bathroom>で1日のあせをながした。かがみがゆげでまっしろになった。"}, {"word": "beach", "meaning_jp": "浜辺", "pos": "名", "body": "夏休みに家族で海へ行き、白い砂の<beach>で貝殻を拾ったり、砂のお城を作ったりして遊んだ。", "choices": ["浜辺", "山頂", "草原", "森林"], "correct_index": 0, "explanation": "海と陸の境の砂浜。beach volleyball(ビーチバレー)。", "id": "s2_021", "body_ruby": "夏休《なつやす》みに家族《かぞく》で海《うみ》へ行《い》き、白《しろ》い砂《すな》の<beach>で貝殻《かいがら》を拾《ひろ》ったり、砂《すな》のお城《しろ》を作《つく》ったりして遊《あそ》んだ。", "choices_ruby": ["浜辺《はまべ》", "山頂《さんちょう》", "草原《そうげん》", "森林《しんりん》"], "explanation_ruby": "海《うみ》と陸《りく》の境《さかい》の砂浜《すなはま》。beach volleyball(ビーチバレー)。", "body_kana": "なつやすみにかぞくでうみへいき、しろいすなの<beach>でかいがらをひろったり、すなのおしろをつくったりしてあそんだ。"}, {"word": "became", "meaning_jp": "〜になった", "pos": "動", "body": "冷凍庫に入れておいたジュースが、ひと晩で凍ってシャーベットに<became>した。", "choices": ["〜になった", "〜を作った", "〜を売った", "〜を見た"], "correct_index": 0, "explanation": "become の過去形。become-became-become。", "id": "s2_022", "body_ruby": "冷凍庫《れいとうこ》に入《い》れておいたジュースが、ひと晩《ばん》で凍《こお》ってシャーベットに<became>した。", "choices_ruby": ["〜になった", "〜を作《つく》った", "〜を売《う》った", "〜を見《み》た"], "explanation_ruby": "become の過去形《かこけい》。become-became-become。", "body_kana": "れいとうこにいれておいたジュースが、ひとばんでこおってシャーベットに<became>した。"}, {"word": "become", "meaning_jp": "〜になる", "pos": "動", "body": "彼女の夢は、病気の動物を治す獣医に<become>することだ。そのために毎日理科を熱心に勉強している。", "choices": ["〜になる", "〜を辞める", "〜を手伝う", "〜を探す"], "correct_index": 0, "explanation": "変化して別の状態・職業になる。", "id": "s2_023", "body_ruby": "彼女《かのじょ》の夢《ゆめ》は、病気《びょうき》の動物《どうぶつ》を治《なお》す獣医《じゅうい》に<become>することだ。そのために毎日《まいにち》理科《りか》を熱心《ねっしん》に勉強《べんきょう》している。", "choices_ruby": ["〜になる", "〜を辞《や》める", "〜を手伝《てつだ》う", "〜を探《さが》す"], "explanation_ruby": "変化《へんか》して別《べつ》の状態《じょうたい》・職業《しょくぎょう》になる。", "body_kana": "かのじょのゆめは、びょうきのどうぶつをなおすじゅういに<become>することだ。そのためにまいにちりかをねっしんにべんきょうしている。"}, {"word": "bedroom", "meaning_jp": "寝室", "pos": "名", "body": "夜11時になると、私は2階の<bedroom>に上がり、ベッドに入って電気を消す。", "choices": ["寝室", "居間", "台所", "風呂場"], "correct_index": 0, "explanation": "bed + room。眠るための部屋。", "id": "s2_024", "body_ruby": "夜《よる》11時《じ》になると、私《わたし》は2階《かい》の<bedroom>に上《あ》がり、ベッドに入《はい》って電気《でんき》を消《け》す。", "choices_ruby": ["寝室《しんしつ》", "居間《いま》", "台所《だいどころ》", "風呂場《ふろば》"], "explanation_ruby": "bed + room。眠《ねむ》るための部屋《へや》。", "body_kana": "よる11時になると、わたしは2階の<bedroom>にあがり、ベッドにはいってでんきをけす。"}, {"word": "believe", "meaning_jp": "信じる", "pos": "動", "body": "「絶対に優勝できる」とキャプテンは言った。練習を毎日見てきた私たちは、その言葉を<believe>している。", "choices": ["信じる", "疑う", "忘れる", "笑う"], "correct_index": 0, "explanation": "believe in ~ = 〜の存在・価値を信じる。", "id": "s2_025", "body_ruby": "「絶対《ぜったい》に優勝《ゆうしょう》できる」とキャプテンは言《い》った。練習《れんしゅう》を毎日《まいにち》見《み》てきた私《わたし》たちは、その言葉《ことば》を<believe>している。", "choices_ruby": ["信《しん》じる", "疑《うたが》う", "忘《わす》れる", "笑《わら》う"], "explanation_ruby": "believe in ~ = 〜の存在《そんざい》・価値《かち》を信《しん》じる。", "body_kana": "「ぜったいにゆうしょうできる」とキャプテンはいった。れんしゅうをまいにちみてきたわたしたちは、そのことばを<believe>している。"}, {"word": "best", "meaning_jp": "最も良い", "pos": "形", "body": "彼は学年200人の中で<best>の成績を取った。2位に10点の差をつけての堂々の1位だった。", "choices": ["最も良い", "最も悪い", "平均の", "2番目の"], "correct_index": 0, "explanation": "good の最上級。good-better-best。", "id": "s2_026", "body_ruby": "彼《かれ》は学年《がくねん》200人《にん》の中《なか》で<best>の成績《せいせき》を取《と》った。2位《い》に10点《てん》の差《さ》をつけての堂々《どうどう》の1位《い》だった。", "choices_ruby": ["最《もっと》も良《よ》い", "最《もっと》も悪《わる》い", "平均《へいきん》の", "2番目《ばんめ》の"], "explanation_ruby": "good の最上級《さいじょうきゅう》。good-better-best。", "body_kana": "かれはがくねん200人のなかで<best>のせいせきをとった。2位に10点のさをつけてのどうどうの1位だった。"}, {"word": "better", "meaning_jp": "より良い", "pos": "形", "body": "昨日は熱が38度あったが、今日は37度まで下がって食欲も出てきた。体調は昨日より明らかに<better>だ。", "choices": ["より良い", "より悪い", "同じくらい", "最高の"], "correct_index": 0, "explanation": "good の比較級。feel better = 体調が良くなる。", "id": "s2_027", "body_ruby": "昨日《きのう》は熱《ねつ》が38度《ど》あったが、今日《きょう》は37度《ど》まで下《さ》がって食欲《しょくよく》も出《で》てきた。体調《たいちょう》は昨日《きのう》より明《あき》らかに<better>だ。", "choices_ruby": ["より良《よ》い", "より悪《わる》い", "同《おな》じくらい", "最高《さいこう》の"], "explanation_ruby": "good の比較《ひかく》級《きゅう》。feel better = 体調《たいちょう》が良《よ》くなる。", "body_kana": "きのうはねつが38どあったが、きょうは37どまでさがってしょくよくもでてきた。たいちょうはきのうよりあきらかに<better>だ。"}, {"word": "billion", "meaning_jp": "10億", "pos": "名", "body": "世界の人口は約8<billion>人と言われる。1億の80倍、日本の人口の60倍以上にあたる数だ。", "choices": ["10億", "100万", "1万", "1兆"], "correct_index": 0, "explanation": "million(100万)の1000倍。", "id": "s2_028", "body_ruby": "世界《せかい》の人口《じんこう》は約《やく》8<billion>人《にん》と言《い》われる。1億《おく》の80倍《ばい》、日本《にっぽん》の人口《じんこう》の60倍以上《ばいいじょう》にあたる数《かず》だ。", "choices_ruby": ["10億《おく》", "100万《まん》", "1万《まん》", "1兆《ちょう》"], "explanation_ruby": "million(100万《まん》)の1000倍《ばい》。", "body_kana": "せかいのじんこうはやく8<billion>にんといわれる。1おくの80ばい、にっぽんのじんこうの60ばいいじょうにあたるかずだ。"}, {"word": "bookcase", "meaning_jp": "本棚", "pos": "名", "body": "父の書斎には天井まで届く大きな<bookcase>があり、小説や図鑑が500冊以上並んでいる。", "choices": ["本棚", "机", "椅子", "引き出し"], "correct_index": 0, "explanation": "book + case(入れ物)。bookshelf とも言う。", "id": "s2_029", "body_ruby": "父《ちち》の書斎《しょさい》には天井《てんじょう》まで届《とど》く大《おお》きな<bookcase>があり、小説《しょうせつ》や図鑑《ずかん》が500冊《さつ》以上《いじょう》並《なら》んでいる。", "choices_ruby": ["本棚《ほんだな》", "机《つくえ》", "椅子《いす》", "｜引き出《ひきだ》し"], "explanation_ruby": "book + case(入《い》れ物《もの》)。bookshelf とも言《い》う。", "body_kana": "ちちのしょさいにはてんじょうまでとどくおおきな<bookcase>があり、しょうせつやずかんが500冊いじょうならんでいる。"}, {"word": "boring", "meaning_jp": "退屈な", "pos": "形", "body": "その映画は2時間ずっと同じ場面の繰り返しで、あまりに<boring>で途中で眠ってしまった。", "choices": ["退屈な", "面白い", "怖い", "感動的な"], "correct_index": 0, "explanation": "bore(退屈させる)+ -ing。interesting の対。", "id": "s2_030", "body_ruby": "その映画《えいが》は2時間《じかん》ずっと同《おな》じ場面《ばめん》の｜繰り返《くりかえ》しで、あまりに<boring>で途中《とちゅう》で眠《ねむ》ってしまった。", "choices_ruby": ["退屈《たいくつ》な", "面白《おもしろ》い", "怖《こわ》い", "感動的《かんどうてき》な"], "explanation_ruby": "bore(退屈《たいくつ》させる)+ -ing。interesting の対《つい》。", "body_kana": "そのえいがは2時間ずっとおなじばめんのくりかえしで、あまりに<boring>でとちゅうでねむってしまった。"}, {"word": "born", "meaning_jp": "生まれた", "pos": "動", "body": "私は2013年の春に、桜が満開の日にこの町の病院で<born>した、と母がよく話してくれる。", "choices": ["生まれた", "育った", "引っ越した", "入学した"], "correct_index": 0, "explanation": "be born = 生まれる。bear(産む)の過去分詞。", "id": "s2_031", "body_ruby": "私《わたし》は2013年《ねん》の春《はる》に、桜《さくら》が満開《まんかい》の日《にち》にこの町《まち》の病院《びょういん》で<born>した、と母《はは》がよく話《はな》してくれる。", "choices_ruby": ["生《う》まれた", "育《そだ》った", "｜引っ越《ひっこ》した", "入学《にゅうがく》した"], "explanation_ruby": "be born = 生《う》まれる。bear(産《う》む)の過去分詞《かこぶんし》。", "body_kana": "わたしは2013年のはるに、さくらがまんかいのにちにこのまちのびょういんで<born>した、とははがよくはなしてくれる。"}, {"word": "bother", "meaning_jp": "邪魔をする、悩ます", "pos": "動", "body": "宿題に集中したいのに、弟が5分おきに話しかけてきて<bother>するので、なかなか進まなかった。", "choices": ["邪魔をする", "手伝う", "応援する", "見守る"], "correct_index": 0, "explanation": "Don't bother me. = 邪魔しないで。", "id": "s2_032", "body_ruby": "宿題《しゅくだい》に集中《しゅうちゅう》したいのに、弟《おとうと》が5分《ふん》おきに話《はな》しかけてきて<bother>するので、なかなか進《すす》まなかった。", "choices_ruby": ["邪魔《じゃま》をする", "手伝《てつだ》う", "応援《おうえん》する", "見守《みまも》る"], "explanation_ruby": "Don't bother me. = 邪魔《じゃま》しないで。", "body_kana": "しゅくだいにしゅうちゅうしたいのに、おとうとが5分おきにはなしかけてきて<bother>するので、なかなかすすまなかった。"}, {"word": "break", "meaning_jp": "壊す、休憩", "pos": "動/名", "body": "うっかり落としたコップが床に当たって、粉々に<break>してしまった。破片を集めるのが大変だった。", "choices": ["壊れる", "直る", "増える", "光る"], "correct_index": 0, "explanation": "break-broke-broken。「休憩」の意味も(take a break)。", "id": "s2_033", "body_ruby": "うっかり落《お》としたコップが床《ゆか》に当《あ》たって、粉々《こなごな》に<break>してしまった。破片《はへん》を集《あつ》めるのが大変《たいへん》だった。", "choices_ruby": ["壊《こわ》れる", "直《なお》る", "増《ふ》える", "光《ひか》る"], "explanation_ruby": "break-broke-broken。「休憩《きゅうけい》」の意味《いみ》も(take a break)。", "body_kana": "うっかりおとしたコップがゆかにあたって、こなごなに<break>してしまった。はへんをあつめるのがたいへんだった。"}, {"word": "bright", "meaning_jp": "明るい", "pos": "形", "body": "カーテンを開けると、朝の<bright>な日差しが部屋いっぱいに差し込んで、思わず目を細めた。", "choices": ["明るい", "暗い", "静かな", "冷たい"], "correct_index": 0, "explanation": "dark(暗い)の対。「頭が良い」の意味もある。", "id": "s2_034", "body_ruby": "カーテンを開《ひら》けると、朝《あさ》の<bright>な日《ひ》差《さ》しが部屋《へや》いっぱいに差《さ》し込《こ》んで、思《おも》わず目《め》を細《ほそ》めた。", "choices_ruby": ["明《あか》るい", "暗《くら》い", "静《しず》かな", "冷《つめ》たい"], "explanation_ruby": "dark(暗《くら》い)の対《つい》。「頭《あたま》が良《よ》い」の意味《いみ》もある。", "body_kana": "カーテンをひらけると、あさの<bright>なひさしがへやいっぱいにさしこんで、おもわずめをほそめた。"}, {"word": "bring", "meaning_jp": "持ってくる", "pos": "動", "body": "明日の調理実習にはエプロンと三角巾を<bring>するように、家庭科の先生から連絡があった。", "choices": ["持ってくる", "置いていく", "捨てる", "借りる"], "correct_index": 0, "explanation": "bring-brought-brought。take(持っていく)の対。", "id": "s2_035", "body_ruby": "明日《あした》の調理《ちょうり》実習《じっしゅう》にはエプロンと三角巾《さんかくきん》を<bring>するように、家庭科《かていか》の先生《せんせい》から連絡《れんらく》があった。", "choices_ruby": ["持《も》ってくる", "置《お》いていく", "捨《す》てる", "借《か》りる"], "explanation_ruby": "bring-brought-brought。take(持《も》っていく)の対《つい》。", "body_kana": "あしたのちょうりじっしゅうにはエプロンとさんかくきんを<bring>するように、かていかのせんせいかられんらくがあった。"}, {"word": "British", "meaning_jp": "イギリスの", "pos": "形", "body": "紅茶を午後に楽しむ習慣や、2階建ての赤いバスは、<British>な文化としてよく知られている。", "choices": ["イギリスの", "フランスの", "アメリカの", "ドイツの"], "correct_index": 0, "explanation": "Britain(英国)+ -ish。イギリス人・英国英語も指す。", "id": "s2_036", "body_ruby": "紅茶《こうちゃ》を午後《ごご》に楽《たの》しむ習慣《しゅうかん》や、2階《かい》建《た》ての赤《あか》いバスは、<British>な文化《ぶんか》としてよく知《し》られている。", "choices_ruby": ["イギリスの", "フランスの", "アメリカの", "ドイツの"], "explanation_ruby": "Britain(英国《えいこく》)+ -ish。イギリス人《にん》・英国《えいこく》英語《えいご》も指《さ》す。", "body_kana": "こうちゃをごごにたのしむしゅうかんや、2階たてのあかいバスは、<British>なぶんかとしてよくしられている。"}, {"word": "broke", "meaning_jp": "壊した", "pos": "動", "body": "サッカーボールが窓に直撃して、ガラスを<broke>してしまった。父と一緒に謝りに行った。", "choices": ["壊した", "直した", "開けた", "拭いた"], "correct_index": 0, "explanation": "break の過去形。break-broke-broken。", "id": "s2_037", "body_ruby": "サッカーボールが窓《まど》に直撃《ちょくげき》して、ガラスを<broke>してしまった。父《ちち》と一緒《いっしょ》に謝《あやま》りに行《い》った。", "choices_ruby": ["壊《こわ》した", "直《なお》した", "開《ひら》けた", "拭《ぬぐ》いた"], "explanation_ruby": "break の過去形《かこけい》。break-broke-broken。", "body_kana": "サッカーボールがまどにちょくげきして、ガラスを<broke>してしまった。ちちといっしょにあやまりにいった。"}, {"word": "brought", "meaning_jp": "持ってきた", "pos": "動", "body": "彼は遠足に、家族4人分はありそうな大きなお菓子の袋を<brought>して、みんなに分けてくれた。", "choices": ["持ってきた", "忘れてきた", "落としてきた", "送ってきた"], "correct_index": 0, "explanation": "bring の過去形。bring-brought-brought。", "id": "s2_038", "body_ruby": "彼《かれ》は遠足《えんそく》に、家族《かぞく》4人《にん》分《ふん》はありそうな大《おお》きなお菓子《かし》の袋《ふくろ》を<brought>して、みんなに分《わ》けてくれた。", "choices_ruby": ["持《も》ってきた", "忘《わす》れてきた", "落《お》としてきた", "送《おく》ってきた"], "explanation_ruby": "bring の過去形《かこけい》。bring-brought-brought。", "body_kana": "かれはえんそくに、かぞく4人ふんはありそうなおおきなおかしのふくろを<brought>して、みんなにわけてくれた。"}, {"word": "build", "meaning_jp": "建てる", "pos": "動", "body": "空き地に重機が集まって、これから3階建ての新しい図書館を<build>する工事が始まるらしい。", "choices": ["建てる", "壊す", "売る", "飾る"], "correct_index": 0, "explanation": "build-built-built。building(建物)。", "id": "s2_039", "body_ruby": "空《あ》き地《ち》に重機《じゅうき》が集《あつ》まって、これから3階《かい》建《た》ての新《あたら》しい図書館《としょかん》を<build>する工事《こうじ》が始《はじ》まるらしい。", "choices_ruby": ["建《た》てる", "壊《こわ》す", "売《う》る", "飾《かざ》る"], "explanation_ruby": "build-built-built。building(建物《たてもの》)。", "body_kana": "あきちにじゅうきがあつまって、これから3階たてのあたらしいとしょかんを<build>するこうじがはじまるらしい。"}, {"word": "built", "meaning_jp": "建てた", "pos": "動", "body": "この神社は今から400年前に<built>されたもので、町でいちばん古い木造のお堂として大切に守られている。", "choices": ["建てられた", "壊された", "移された", "塗られた"], "correct_index": 0, "explanation": "build の過去形・過去分詞。", "id": "s2_040", "body_ruby": "この神社《じんじゃ》は今《いま》から400年《ねん》前《まえ》に<built>されたもので、町《まち》でいちばん古《ふる》い木造《もくぞう》のお堂《どう》として大切《たいせつ》に守《まも》られている。", "choices_ruby": ["建《た》てられた", "壊《こわ》された", "移《うつ》された", "塗《ぬ》られた"], "explanation_ruby": "build の過去形《かこけい》・過去分詞《かこぶんし》。", "body_kana": "このじんじゃはいまから400年まえに<built>されたもので、まちでいちばんふるいもくぞうのおどうとしてたいせつにまもられている。"}, {"word": "bury", "meaning_jp": "埋める", "pos": "動", "body": "飼い犬が骨をくわえて庭の隅に行き、前足で穴を掘って<bury>して、上から土をかけて隠した。", "choices": ["埋める", "掘り出す", "投げる", "洗う"], "correct_index": 0, "explanation": "発音は「ベリー」(berry と同じ)。", "id": "s2_041", "body_ruby": "飼《か》い犬《いぬ》が骨《ほね》をくわえて庭《にわ》の隅《すみ》に行《い》き、前足《まえあし》で穴《あな》を掘《ほ》って<bury>して、上《うえ》から土《つち》をかけて隠《かく》した。", "choices_ruby": ["埋《う》める", "掘《ほ》り出《だ》す", "投《な》げる", "洗《あら》う"], "explanation_ruby": "発音《はつおん》は「ベリー」(berry と同《おな》じ)。", "body_kana": "かいいぬがほねをくわえてにわのすみにいき、まえあしであなをほって<bury>して、うえからつちをかけてかくした。"}, {"word": "busy", "meaning_jp": "忙しい", "pos": "形", "body": "テスト前の1週間は、塾と部活と宿題が重なって、夜ご飯をゆっくり食べる時間もないほど<busy>だ。", "choices": ["忙しい", "暇な", "眠い", "元気な"], "correct_index": 0, "explanation": "free(暇な)の対。busy with ~ = 〜で忙しい。", "id": "s2_042", "body_ruby": "テスト前《まえ》の1週間《しゅうかん》は、塾《じゅく》と部活《ぶかつ》と宿題《しゅくだい》が重《かさ》なって、夜《よる》ご飯《めし》をゆっくり食《た》べる時間《じかん》もないほど<busy>だ。", "choices_ruby": ["忙《いそが》しい", "暇《ひま》な", "眠《ねむ》い", "元気《げんき》な"], "explanation_ruby": "free(暇《ひま》な)の対《つい》。busy with ~ = 〜で忙《いそが》しい。", "body_kana": "テストまえの1週間は、じゅくとぶかつとしゅくだいがかさなって、よるごめしをゆっくりたべるじかんもないほど<busy>だ。"}, {"word": "call", "meaning_jp": "呼ぶ、電話する", "pos": "動", "body": "夕飯ができたよ、と母が階段の下から大きな声で私の名前を<call>した。", "choices": ["呼ぶ", "書く", "消す", "数える"], "correct_index": 0, "explanation": "「電話する」の意味も。Call me! = 電話して!", "id": "s2_043", "body_ruby": "夕飯《ゆうはん》ができたよ、と母《はは》が階段《かいだん》の下《した》から大《おお》きな声《こえ》で私《わたし》の名前《なまえ》を<call>した。", "choices_ruby": ["呼《よ》ぶ", "書《か》く", "消《け》す", "数《かぞ》える"], "explanation_ruby": "「電話《でんわ》する」の意味《いみ》も。Call me! = 電話《でんわ》して!", "body_kana": "ゆうはんができたよ、とははがかいだんのしたからおおきなこえでわたしのなまえを<call>した。"}, {"word": "Cambodia", "meaning_jp": "カンボジア", "pos": "名", "body": "世界遺産のアンコールワットで有名な<Cambodia>は、タイとベトナムに挟まれた東南アジアの国だ。", "choices": ["カンボジア", "タイ", "ベトナム", "インド"], "correct_index": 0, "explanation": "首都はプノンペン。", "id": "s2_044", "body_ruby": "世界《せかい》遺産《いさん》のアンコールワットで有名《ゆうめい》な<Cambodia>は、タイとベトナムに挟《はさ》まれた東南《とうなん》アジアの国《くに》だ。", "choices_ruby": ["カンボジア", "タイ", "ベトナム", "インド"], "explanation_ruby": "首都《しゅと》はプノンペン。", "body_kana": "せかいいさんのアンコールワットでゆうめいな<Cambodia>は、タイとベトナムにはさまれたとうなんアジアのくにだ。"}, {"word": "card", "meaning_jp": "カード", "pos": "名", "body": "誕生日に友達から、表に花の絵、中にメッセージが書かれた手作りの<card>をもらって嬉しかった。", "choices": ["カード", "花束", "ケーキ", "本"], "correct_index": 0, "explanation": "birthday card、Christmas card など。", "id": "s2_045", "body_ruby": "誕生日《たんじょうび》に友達《ともだち》から、表《おもて》に花《はな》の絵《え》、中《なか》にメッセージが書《か》かれた手作《てづく》りの<card>をもらって嬉《うれ》しかった。", "choices_ruby": ["カード", "花束《はなたば》", "ケーキ", "本《ほん》"], "explanation_ruby": "birthday card、Christmas card など。", "body_kana": "たんじょうびにともだちから、おもてにはなのえ、なかにメッセージがかかれたてづくりの<card>をもらってうれしかった。"}, {"word": "care", "meaning_jp": "世話、気にかける", "pos": "名/動", "body": "祖母は庭のバラを毎朝<care>している。水をやり、枯れた葉を取り、虫がついていないか確かめる。", "choices": ["世話する", "放置する", "売る", "撮影する"], "correct_index": 0, "explanation": "take care of ~ = 〜の世話をする。Take care! = お大事に!", "id": "s2_046", "body_ruby": "祖母《そぼ》は庭《にわ》のバラを毎朝《まいあさ》<care>している。水《みず》をやり、枯《か》れた葉《は》を取《と》り、虫《むし》がついていないか確《たし》かめる。", "choices_ruby": ["世話《せわ》する", "放置《ほうち》する", "売《う》る", "撮影《さつえい》する"], "explanation_ruby": "take care of ~ = 〜の世話《せわ》をする。Take care! = お大事《だいじ》に!", "body_kana": "そぼはにわのバラをまいあさ<care>している。みずをやり、かれたはをとり、むしがついていないかたしかめる。"}, {"word": "caught", "meaning_jp": "捕まえた", "pos": "動", "body": "夏休みに川で、網を使って小さな魚を3匹<caught>した。バケツに入れてしばらく観察してから逃がした。", "choices": ["捕まえた", "逃がした", "見つけた", "育てた"], "correct_index": 0, "explanation": "catch の過去形。catch-caught-caught。", "id": "s2_047", "body_ruby": "夏休《なつやす》みに川《かわ》で、網《あみ》を使《つか》って小《ちい》さな魚《さかな》を3匹《ひき》<caught>した。バケツに入《い》れてしばらく観察《かんさつ》してから逃《に》がした。", "choices_ruby": ["捕《つか》まえた", "逃《に》がした", "見《み》つけた", "育《そだ》てた"], "explanation_ruby": "catch の過去形《かこけい》。catch-caught-caught。", "body_kana": "なつやすみにかわで、あみをつかってちいさなさかなを3匹<caught>した。バケツにいれてしばらくかんさつしてからにがした。"}, {"word": "century", "meaning_jp": "世紀", "pos": "名", "body": "今は21<century>だ。100年ごとの区切りで、2001年から2100年までがこの期間にあたる。", "choices": ["世紀", "年代", "季節", "時代劇"], "correct_index": 0, "explanation": "cent(100)が語源。100年=1世紀。", "id": "s2_048", "body_ruby": "今《いま》は21<century>だ。100年《ねん》ごとの区切《くぎ》りで、2001年《ねん》から2100年《ねん》までがこの期間《きかん》にあたる。", "choices_ruby": ["世紀《せいき》", "年代《ねんだい》", "季節《きせつ》", "時代劇《じだいげき》"], "explanation_ruby": "cent(100)が語源《ごげん》。100年《ねん》=1世紀《せいき》。", "body_kana": "いまは21<century>だ。100年ごとのくぎりで、2001年から2100年までがこのきかんにあたる。"}, {"word": "certainly", "meaning_jp": "確かに、もちろん", "pos": "副", "body": "「明日の試合、応援に来てくれる?」と聞くと、彼は「<certainly>、必ず行くよ」と迷わず即答した。", "choices": ["もちろん", "たぶん", "まさか", "ときどき"], "correct_index": 0, "explanation": "certain(確実な)+ -ly。丁寧な「はい、確かに」。", "id": "s2_049", "body_ruby": "「明日《あした》の試合《しあい》、応援《おうえん》に来《き》てくれる?」と聞《き》くと、彼《かれ》は「<certainly>、必《かなら》ず行《い》くよ」と迷《まよ》わず即答《そくとう》した。", "choices_ruby": ["もちろん", "たぶん", "まさか", "ときどき"], "explanation_ruby": "certain(確実《かくじつ》な)+ -ly。丁寧《ていねい》な「はい、確《たし》かに」。", "body_kana": "「あしたのしあい、おうえんにきてくれる?」ときくと、かれは「<certainly>、かならずいくよ」とまよわずそくとうした。"}, {"word": "chance", "meaning_jp": "機会、チャンス", "pos": "名", "body": "リレーの選手を決めるじゃんけんに負けて、出場の<chance>を逃した。次の体育祭まで1年待つしかない。", "choices": ["機会", "練習", "結果", "賞品"], "correct_index": 0, "explanation": "「偶然」の意味も(by chance = 偶然に)。", "id": "s2_050", "body_ruby": "リレーの選手《せんしゅ》を決《き》めるじゃんけんに負《ま》けて、出場《しゅつじょう》の<chance>を逃《のが》した。次《つぎ》の体育祭《たいいくさい》まで1年《ねん》待《ま》つしかない。", "choices_ruby": ["機会《きかい》", "練習《れんしゅう》", "結果《けっか》", "賞品《しょうひん》"], "explanation_ruby": "「偶然《ぐうぜん》」の意味《いみ》も(by chance = 偶然《ぐうぜん》に)。", "body_kana": "リレーのせんしゅをきめるじゃんけんにまけて、しゅつじょうの<chance>をのがした。つぎのたいいくさいまで1年まつしかない。"}, {"word": "chart", "meaning_jp": "図表", "pos": "名", "body": "理科の授業で、1か月の気温の変化を折れ線の<chart>にまとめた。上がり下がりがひと目で分かる。", "choices": ["図表", "作文", "写真", "地図"], "correct_index": 0, "explanation": "データを見やすく整理した図。music chart(ヒットチャート)も。", "id": "s2_051", "body_ruby": "理科《りか》の授業《じゅぎょう》で、1か月《かげつ》の気温《きおん》の変化《へんか》を｜折れ線《おれせん》の<chart>にまとめた。上《あ》がり下《さ》がりがひと目《め》で分《わ》かる。", "choices_ruby": ["図表《ずひょう》", "作文《さくぶん》", "写真《しゃしん》", "地図《ちず》"], "explanation_ruby": "データを見《み》やすく整理《せいり》した図《ず》。music chart(ヒットチャート)も。", "body_kana": "りかのじゅぎょうで、1かかげつのきおんのへんかをおれせんの<chart>にまとめた。あがりさがりがひとめでわかる。"}, {"word": "check", "meaning_jp": "確認する", "pos": "動", "body": "家を出る前に、ハンカチ・ティッシュ・鍵が揃っているか、カバンの中を<check>するのが毎朝の習慣だ。", "choices": ["確認する", "捨てる", "増やす", "隠す"], "correct_index": 0, "explanation": "「チェックする」。check-in(ホテルの受付)も同じ語。", "id": "s2_052", "body_ruby": "家《いえ》を出《で》る前《まえ》に、ハンカチ・ティッシュ・鍵《かぎ》が揃《そろ》っているか、カバンの中《なか》を<check>するのが毎朝《まいあさ》の習慣《しゅうかん》だ。", "choices_ruby": ["確認《かくにん》する", "捨《す》てる", "増《ふ》やす", "隠《かく》す"], "explanation_ruby": "「チェックする」。check-in(ホテルの受付《うけつけ》)も同《おな》じ語《ご》。", "body_kana": "いえをでるまえに、ハンカチ・ティッシュ・かぎがそろっているか、カバンのなかを<check>するのがまいあさのしゅうかんだ。"}, {"word": "children", "meaning_jp": "子どもたち", "pos": "名", "body": "公園の砂場では、5、6歳くらいの<children>が3人、バケツとスコップで山を作って遊んでいた。", "choices": ["子どもたち", "大人たち", "先生たち", "動物たち"], "correct_index": 0, "explanation": "child(子ども)の複数形。不規則変化。", "id": "s2_053", "body_ruby": "公園《こうえん》の砂場《すなば》では、5、6歳《さい》くらいの<children>が3人《にん》、バケツとスコップで山《やま》を作《つく》って遊《あそ》んでいた。", "choices_ruby": ["子《こ》どもたち", "大人《おとな》たち", "先生《せんせい》たち", "動物《どうぶつ》たち"], "explanation_ruby": "child(子《こ》ども)の複数形《ふくすうけい》。不規則《ふきそく》変化《へんか》。", "body_kana": "こうえんのすなばでは、5、6歳くらいの<children>が3人、バケツとスコップでやまをつくってあそんでいた。"}, {"word": "choice", "meaning_jp": "選択", "pos": "名", "body": "給食のデザートは、プリンかゼリーかフルーツの3つから1つを選ぶ。今日の私の<choice>はプリンだった。", "choices": ["選択", "注文", "予約", "交換"], "correct_index": 0, "explanation": "choose(選ぶ)の名詞形。make a choice = 選択する。", "id": "s2_054", "body_ruby": "給食《きゅうしょく》のデザートは、プリンかゼリーかフルーツの3つから1つを選《えら》ぶ。今日《きょう》の私《わたし》の<choice>はプリンだった。", "choices_ruby": ["選択《せんたく》", "注文《ちゅうもん》", "予約《よやく》", "交換《こうかん》"], "explanation_ruby": "choose(選《えら》ぶ)の名詞《めいし》形《かたち》。make a choice = 選択《せんたく》する。", "body_kana": "きゅうしょくのデザートは、プリンかゼリーかフルーツの3つから1つをえらぶ。きょうのわたしの<choice>はプリンだった。"}, {"word": "choose", "meaning_jp": "選ぶ", "pos": "動", "body": "本屋で1時間悩んだ末、棚に並んだ10冊の中から、表紙が一番気に入った1冊を<choose>した。", "choices": ["選ぶ", "戻す", "包む", "破る"], "correct_index": 0, "explanation": "choose-chose-chosen。choice(選択)の動詞形。", "id": "s2_055", "body_ruby": "本屋《ほんや》で1時間《じかん》悩《なや》んだ末《まつ》、棚《たな》に並《なら》んだ10冊《さつ》の中《なか》から、表紙《ひょうし》が一番《いちばん》気《き》に入《はい》った1冊《さつ》を<choose>した。", "choices_ruby": ["選《えら》ぶ", "戻《もど》す", "包《つつ》む", "破《やぶ》る"], "explanation_ruby": "choose-chose-chosen。choice(選択《せんたく》)の動詞形《どうしけい》。", "body_kana": "ほんやで1時間なやんだまつ、たなにならんだ10冊のなかから、ひょうしがいちばんきにはいった1冊を<choose>した。"}, {"word": "city", "meaning_jp": "都市", "pos": "名", "body": "祖父の住む村には信号が1つしかないが、私の住む<city>には高いビルが並び、電車も5路線走っている。", "choices": ["都市", "村", "森", "島"], "correct_index": 0, "explanation": "town(町)より大きい。city hall = 市役所。", "id": "s2_056", "body_ruby": "祖父《そふ》の住《す》む村《むら》には信号《しんごう》が1つしかないが、私《わたし》の住《す》む<city>には高《たか》いビルが並《なら》び、電車《でんしゃ》も5路線《ろせん》走《はし》っている。", "choices_ruby": ["都市《とし》", "村《むら》", "森《もり》", "島《しま》"], "explanation_ruby": "town(町《まち》)より大《おお》きい。city hall = 市役所《しやくしょ》。", "body_kana": "そふのすむむらにはしんごうが1つしかないが、わたしのすむ<city>にはたかいビルがならび、でんしゃも5ろせんはしっている。"}, {"word": "clear", "meaning_jp": "澄んだ、明らかな", "pos": "形", "body": "台風が過ぎた翌朝、空は雲ひとつなく<clear>で、遠くの山の稜線までくっきり見えた。", "choices": ["澄んだ", "曇った", "暗い", "騒がしい"], "correct_index": 0, "explanation": "「明確な」の意味も(clear answer = 明確な答え)。", "id": "s2_057", "body_ruby": "台風《たいふう》が過《す》ぎた翌朝《よくあさ》、空《そら》は雲《くも》ひとつなく<clear>で、遠《とお》くの山《やま》の稜線《りょうせん》までくっきり見《み》えた。", "choices_ruby": ["澄《す》んだ", "曇《くも》った", "暗《くら》い", "騒《さわ》がしい"], "explanation_ruby": "「明確《めいかく》な」の意味《いみ》も(clear answer = 明確《めいかく》な答《こた》え)。", "body_kana": "たいふうがすぎたよくあさ、そらはくもひとつなく<clear>で、とおくのやまのりょうせんまでくっきりみえた。"}, {"word": "clock", "meaning_jp": "時計(置き・掛け)", "pos": "名", "body": "教室の前の壁には丸い<clock>が掛かっていて、授業中つい何度もちらちら見てしまう。", "choices": ["時計", "カレンダー", "鏡", "地図"], "correct_index": 0, "explanation": "壁掛け・置き型。腕時計は watch。", "id": "s2_058", "body_ruby": "教室《きょうしつ》の前《まえ》の壁《かべ》には丸《まる》い<clock>が掛《か》かっていて、授業中《じゅぎょうちゅう》つい何度《なんど》もちらちら見《み》てしまう。", "choices_ruby": ["時計《とけい》", "カレンダー", "鏡《かがみ》", "地図《ちず》"], "explanation_ruby": "壁掛《かべか》け・置《お》き型《かた》。腕時計《うでどけい》は watch。", "body_kana": "きょうしつのまえのかべにはまるい<clock>がかかっていて、じゅぎょうちゅうついなんどもちらちらみてしまう。"}, {"word": "cloud", "meaning_jp": "雲", "pos": "名", "body": "青空に綿あめのような白い<cloud>がぽっかり浮かんでいて、形が犬に見えたり船に見えたりした。", "choices": ["雲", "星", "月", "虹"], "correct_index": 0, "explanation": "cloudy(曇った)の名詞。データの「クラウド」も同じ語。", "id": "s2_059", "body_ruby": "青《あお》空《そら》に綿《めん》あめのような白《しろ》い<cloud>がぽっかり浮《う》かんでいて、形《かたち》が犬《いぬ》に見《み》えたり船《ふね》に見《み》えたりした。", "choices_ruby": ["雲《くも》", "星《ほし》", "月《がつ》", "虹《にじ》"], "explanation_ruby": "cloudy(曇《くも》った)の名詞《めいし》。データの「クラウド」も同《おな》じ語《ご》。", "body_kana": "あおそらにめんあめのようなしろい<cloud>がぽっかりうかんでいて、かたちがいぬにみえたりふねにみえたりした。"}, {"word": "cloudy", "meaning_jp": "曇った", "pos": "形", "body": "天気予報によると、明日は一日中<cloudy>で、太陽は見えないが雨も降らないらしい。", "choices": ["曇った", "晴れた", "雨の", "雪の"], "correct_index": 0, "explanation": "cloud(雲)+ -y。sunny(晴れ)、rainy(雨)の仲間。", "id": "s2_060", "body_ruby": "天気予報《てんきよほう》によると、明日《あした》は一日中《いちにちじゅう》<cloudy>で、太陽《たいよう》は見《み》えないが雨《あめ》も降《ふ》らないらしい。", "choices_ruby": ["曇《くも》った", "晴《は》れた", "雨《あめ》の", "雪《ゆき》の"], "explanation_ruby": "cloud(雲《くも》)+ -y。sunny(晴《は》れ)、rainy(雨《あめ》)の仲間《なかま》。", "body_kana": "てんきよほうによると、あしたはいちにちじゅう<cloudy>で、たいようはみえないがあめもふらないらしい。"}, {"word": "coat", "meaning_jp": "コート", "pos": "名", "body": "12月に入って朝の気温が5度を下回ったので、クローゼットから厚手の<coat>を出して着て行った。", "choices": ["コート", "帽子", "手袋", "サンダル"], "correct_index": 0, "explanation": "防寒用の上着。raincoat(レインコート)。", "id": "s2_061", "body_ruby": "12月《がつ》に入《はい》って朝《あさ》の気温《きおん》が5度《ど》を下回《したまわ》ったので、クローゼットから厚手《あつで》の<coat>を出《だ》して着《き》て行《い》った。", "choices_ruby": ["コート", "帽子《ぼうし》", "手袋《てぶくろ》", "サンダル"], "explanation_ruby": "防寒《ぼうかん》用《よう》の上着《うわぎ》。raincoat(レインコート)。", "body_kana": "12月にはいってあさのきおんが5どをしたまわったので、クローゼットからあつでの<coat>をだしてきていった。"}, {"word": "cold", "meaning_jp": "寒い、冷たい", "pos": "形", "body": "今朝は氷点下2度まで下がり、池に氷が張るほど<cold>かった。息が白くなり、手がかじかんだ。", "choices": ["寒い", "暑い", "暖かい", "涼しい"], "correct_index": 0, "explanation": "hot(暑い)の対。「風邪」の意味も(catch a cold)。", "id": "s2_062", "body_ruby": "今朝《けさ》は氷点下《ひょうてんか》2度《ど》まで下《さ》がり、池《いけ》に氷《こおり》が張《は》るほど<cold>かった。息《いき》が白《しろ》くなり、手《て》がかじかんだ。", "choices_ruby": ["寒《さむ》い", "暑《あつ》い", "暖《あたた》かい", "涼《すず》しい"], "explanation_ruby": "hot(暑《あつ》い)の対《つい》。「風邪《かぜ》」の意味《いみ》も(catch a cold)。", "body_kana": "けさはひょうてんか2どまでさがり、いけにこおりがはるほど<cold>かった。いきがしろくなり、てがかじかんだ。"}, {"word": "comic", "meaning_jp": "漫画", "pos": "名", "body": "彼の部屋の本棚には、人気シリーズの<comic>が1巻から70巻まで全部そろっている。", "choices": ["漫画", "小説", "辞書", "新聞"], "correct_index": 0, "explanation": "comic book とも。日本の manga は世界共通語に。", "id": "s2_063", "body_ruby": "彼《かれ》の部屋《へや》の本棚《ほんだな》には、人気《にんき》シリーズの<comic>が1巻《かん》から70巻《かん》まで全部《ぜんぶ》そろっている。", "choices_ruby": ["漫画《まんが》", "小説《しょうせつ》", "辞書《じしょ》", "新聞《しんぶん》"], "explanation_ruby": "comic book とも。日本《にっぽん》の manga は世界共通《せかいきょうつう》語《ご》に。", "body_kana": "かれのへやのほんだなには、にんきシリーズの<comic>が1巻から70巻までぜんぶそろっている。"}, {"word": "common", "meaning_jp": "よくある、共通の", "pos": "形", "body": "「佐藤」は日本でとても<common>な名字で、私のクラスにも3人、学年全体では12人もいる。", "choices": ["よくある", "珍しい", "新しい", "高級な"], "correct_index": 0, "explanation": "rare(珍しい)の対。common sense = 常識。", "id": "s2_064", "body_ruby": "「佐藤《さとう》」は日本《にっぽん》でとても<common>な名字《みょうじ》で、私《わたし》のクラスにも3人《にん》、学年《がくねん》全体《ぜんたい》では12人《にん》もいる。", "choices_ruby": ["よくある", "珍《めずら》しい", "新《あたら》しい", "高級《こうきゅう》な"], "explanation_ruby": "rare(珍《めずら》しい)の対《つい》。common sense = 常識《じょうしき》。", "body_kana": "「さとう」はにっぽんでとても<common>なみょうじで、わたしのクラスにも3人、がくねんぜんたいでは12人もいる。"}, {"word": "communicate", "meaning_jp": "意思を伝え合う", "pos": "動", "body": "言葉が通じない国でも、身ぶり手ぶりと笑顔があれば、相手と<communicate>することはできる。", "choices": ["意思を伝え合う", "競争する", "無視する", "命令する"], "correct_index": 0, "explanation": "communication(コミュニケーション)の動詞形。", "id": "s2_065", "body_ruby": "言葉《ことば》が通《つう》じない国《くに》でも、身《み》ぶり手《て》ぶりと笑顔《えがお》があれば、相手《あいて》と<communicate>することはできる。", "choices_ruby": ["意思《いし》を伝《つた》え合《あ》う", "競争《きょうそう》する", "無視《むし》する", "命令《めいれい》する"], "explanation_ruby": "communication(コミュニケーション)の動詞形《どうしけい》。", "body_kana": "ことばがつうじないくにでも、みぶりてぶりとえがおがあれば、あいてと<communicate>することはできる。"}, {"word": "concert", "meaning_jp": "コンサート", "pos": "名", "body": "好きな歌手の<concert>に初めて行った。1万人の観客と一緒に歌った2時間は、あっという間だった。", "choices": ["コンサート", "映画", "美術展", "花火大会"], "correct_index": 0, "explanation": "音楽の生演奏会。live(ライブ)とも言う。", "id": "s2_066", "body_ruby": "好《す》きな歌手《かしゅ》の<concert>に初《はじ》めて行《い》った。1万人《まんにん》の観客《かんきゃく》と一緒《いっしょ》に歌《うた》った2時間《じかん》は、あっという間《かん》だった。", "choices_ruby": ["コンサート", "映画《えいが》", "美術展《びじゅつてん》", "花火大会《はなびたいかい》"], "explanation_ruby": "音楽《おんがく》の生演奏《なまえんそう》会《かい》。live(ライブ)とも言《い》う。", "body_kana": "すきなかしゅの<concert>にはじめていった。1まんにんのかんきゃくといっしょにうたった2時間は、あっというかんだった。"}, {"word": "conclusion", "meaning_jp": "結論", "pos": "名", "body": "1時間の話し合いの末、文化祭の出し物は劇にする、という<conclusion>にクラス全員でたどり着いた。", "choices": ["結論", "質問", "意見", "予想"], "correct_index": 0, "explanation": "conclude(締めくくる)の名詞形。in conclusion = 結論として。", "id": "s2_067", "body_ruby": "1時間《じかん》の｜話し合《はなしあ》いの末《まつ》、文化祭《ぶんかさい》の｜出し物《だしもの》は劇《げき》にする、という<conclusion>にクラス全員《ぜんいん》でたどり着《つ》いた。", "choices_ruby": ["結論《けつろん》", "質問《しつもん》", "意見《いけん》", "予想《よそう》"], "explanation_ruby": "conclude(締《し》めくくる)の名詞《めいし》形《かたち》。in conclusion = 結論《けつろん》として。", "body_kana": "1時間のはなしあいのまつ、ぶんかさいのだしものはげきにする、という<conclusion>にクラスぜんいんでたどりついた。"}, {"word": "continue", "meaning_jp": "続ける", "pos": "動", "body": "ピアノは5歳で始めて、辞めたくなった時期もあったが、今も週1回のレッスンを<continue>している。", "choices": ["続ける", "やめる", "始める", "休む"], "correct_index": 0, "explanation": "stop(やめる)の対。to be continued = つづく。", "id": "s2_068", "body_ruby": "ピアノは5歳《さい》で始《はじ》めて、辞《や》めたくなった時期《じき》もあったが、今《いま》も週《しゅう》1回《かい》のレッスンを<continue>している。", "choices_ruby": ["続《つづ》ける", "やめる", "始《はじ》める", "休《やす》む"], "explanation_ruby": "stop(やめる)の対《つい》。to be continued = つづく。", "body_kana": "ピアノは5歳ではじめて、やめたくなったじきもあったが、いまもしゅう1回のレッスンを<continue>している。"}, {"word": "convenience", "meaning_jp": "便利(さ)", "pos": "名", "body": "24時間開いていて、おにぎりも文房具も電池も買える。<convenience>ストアはその名の通りの店だ。", "choices": ["便利", "不便", "値段", "距離"], "correct_index": 0, "explanation": "convenient(便利な)の名詞形。コンビニの語源。", "id": "s2_069", "body_ruby": "24時間《じかん》開《ひら》いていて、おにぎりも文房具《ぶんぼうぐ》も電池《でんち》も買《か》える。<convenience>ストアはその名《めい》の通《とお》りの店《みせ》だ。", "choices_ruby": ["便利《べんり》", "不便《ふべん》", "値段《ねだん》", "距離《きょり》"], "explanation_ruby": "convenient(便利《べんり》な)の名詞《めいし》形《かたち》。コンビニの語源《ごげん》。", "body_kana": "24時間ひらいていて、おにぎりもぶんぼうぐもでんちもかえる。<convenience>ストアはそのめいのとおりのみせだ。"}, {"word": "convenient", "meaning_jp": "便利な", "pos": "形", "body": "新しい家は駅まで歩いて3分、スーパーまで1分で、買い物にも通学にもとても<convenient>だ。", "choices": ["便利な", "不便な", "高価な", "静かな"], "correct_index": 0, "explanation": "場所や道具が「使い勝手が良い」こと。", "id": "s2_070", "body_ruby": "新《あたら》しい家《いえ》は駅《えき》まで歩《ある》いて3分《ふん》、スーパーまで1分《ふん》で、｜買い物《かいもの》にも通学《つうがく》にもとても<convenient>だ。", "choices_ruby": ["便利《べんり》な", "不便《ふべん》な", "高価《こうか》な", "静《しず》かな"], "explanation_ruby": "場所《ばしょ》や道具《どうぐ》が「｜使い勝手《つかいがって》が良《よ》い」こと。", "body_kana": "あたらしいいえはえきまであるいて3分、スーパーまで1分で、かいものにもつうがくにもとても<convenient>だ。"}, {"word": "cool", "meaning_jp": "涼しい、かっこいい", "pos": "形", "body": "真夏の昼でも、木かげに入ると風が<cool>で気持ちいい。汗がすっとひいていく。", "choices": ["涼しい", "暑い", "寒い", "蒸し暑い"], "correct_index": 0, "explanation": "cold ほど寒くない心地よさ。「かっこいい」の意味も。", "id": "s2_071", "body_ruby": "真夏《まなつ》の昼《ひる》でも、木《き》かげに入《はい》ると風《かぜ》が<cool>で気持《きも》ちいい。汗《あせ》がすっとひいていく。", "choices_ruby": ["涼《すず》しい", "暑《あつ》い", "寒《さむ》い", "｜蒸し暑《むしあつ》い"], "explanation_ruby": "cold ほど寒《さむ》くない心地《ここち》よさ。「かっこいい」の意味《いみ》も。", "body_kana": "まなつのひるでも、きかげにはいるとかぜが<cool>できもちいい。あせがすっとひいていく。"}, {"word": "cup", "meaning_jp": "カップ", "pos": "名", "body": "寒い朝、母が温かいココアを白い<cup>に注いでくれた。両手で包むと指先まで温まった。", "choices": ["カップ", "皿", "鍋", "箸"], "correct_index": 0, "explanation": "取っ手付きの飲み物用の器。a cup of tea = 紅茶1杯。", "id": "s2_072", "body_ruby": "寒《さむ》い朝《あさ》、母《はは》が温《あたた》かいココアを白《しろ》い<cup>に注《そそ》いでくれた。両手《りょうて》で包《つつ》むと指先《ゆびさき》まで温《あたた》まった。", "choices_ruby": ["カップ", "皿《さら》", "鍋《なべ》", "箸《はし》"], "explanation_ruby": "取《と》っ手付《てつき》きの｜飲み物《のみもの》用《よう》の器《うつわ》。a cup of tea = 紅茶《こうちゃ》1杯《はい》。", "body_kana": "さむいあさ、ははがあたたかいココアをしろい<cup>にそそいでくれた。りょうてでつつむとゆびさきまであたたまった。"}, {"word": "cut", "meaning_jp": "切る", "pos": "動", "body": "調理実習で、包丁を使ってキャベツを細く<cut>した。指を切らないよう、猫の手で押さえた。", "choices": ["切る", "焼く", "煮る", "洗う"], "correct_index": 0, "explanation": "cut-cut-cut(無変化)。haircut = 散髪。", "id": "s2_073", "body_ruby": "調理《ちょうり》実習《じっしゅう》で、包丁《ほうちょう》を使《つか》ってキャベツを細《こま》く<cut>した。指《ゆび》を切《き》らないよう、猫《ねこ》の手《て》で押《お》さえた。", "choices_ruby": ["切《き》る", "焼《や》く", "煮《に》る", "洗《あら》う"], "explanation_ruby": "cut-cut-cut(無変化《むへんか》)。haircut = 散髪《さんぱつ》。", "body_kana": "ちょうりじっしゅうで、ほうちょうをつかってキャベツをこまく<cut>した。ゆびをきらないよう、ねこのてでおさえた。"}, {"word": "dancer", "meaning_jp": "ダンサー", "pos": "名", "body": "彼女はプロの<dancer>を目指して、週5日スタジオに通い、鏡の前で何時間もステップの練習をしている。", "choices": ["ダンサー", "歌手", "画家", "選手"], "correct_index": 0, "explanation": "dance(踊る)+ -er(人)。", "id": "s2_074", "body_ruby": "彼女《かのじょ》はプロの<dancer>を目指《めざ》して、週《しゅう》5日《にち》スタジオに通《かよ》い、鏡《かがみ》の前《まえ》で何時間《なんじかん》もステップの練習《れんしゅう》をしている。", "choices_ruby": ["ダンサー", "歌手《かしゅ》", "画家《がか》", "選手《せんしゅ》"], "explanation_ruby": "dance(踊《おど》る)+ -er(人《にん》)。", "body_kana": "かのじょはプロの<dancer>をめざして、しゅう5日スタジオにかよい、かがみのまえでなんじかんもステップのれんしゅうをしている。"}, {"word": "danger", "meaning_jp": "危険", "pos": "名", "body": "崖の手前に「この先<danger>、立入禁止」という赤い看板が立っていたので、引き返した。", "choices": ["危険", "安全", "近道", "休憩所"], "correct_index": 0, "explanation": "dangerous(危険な)の名詞形。safety(安全)の対。", "id": "s2_075", "body_ruby": "崖《がけ》の手前《てまえ》に「この先《さき》<danger>、立入禁止《たちいりきんし》」という赤《あか》い看板《かんばん》が立《た》っていたので、引《ひ》き返《かえ》した。", "choices_ruby": ["危険《きけん》", "安全《あんぜん》", "近道《ちかみち》", "休憩所《きゅうけいじょ》"], "explanation_ruby": "dangerous(危険《きけん》な)の名詞《めいし》形《かたち》。safety(安全《あんぜん》)の対《つい》。", "body_kana": "がけのてまえに「このさき<danger>、たちいりきんし」というあかいかんばんがたっていたので、ひきかえした。"}, {"word": "date", "meaning_jp": "日付", "pos": "名", "body": "プリントの右上に今日の<date>を書く欄がある。6月10日なら「6/10」と記入する。", "choices": ["日付", "名前", "点数", "教科"], "correct_index": 0, "explanation": "「デート」の意味も。What's the date? = 今日は何日?", "id": "s2_076", "body_ruby": "プリントの右上《みぎうえ》に今日《きょう》の<date>を書《か》く欄《らん》がある。6月《がつ》10日《にち》なら「6/10」と記入《きにゅう》する。", "choices_ruby": ["日付《ひづけ》", "名前《なまえ》", "点数《てんすう》", "教科《きょうか》"], "explanation_ruby": "「デート」の意味《いみ》も。What's the date? = 今日《きょう》は何日《なんにち》?", "body_kana": "プリントのみぎうえにきょうの<date>をかくらんがある。6月10日なら「6/10」ときにゅうする。"}, {"word": "decide", "meaning_jp": "決める", "pos": "動", "body": "サッカー部と野球部で1か月悩んだが、体験入部を経て、最終的にサッカー部に入ると<decide>した。", "choices": ["決める", "迷う", "忘れる", "断る"], "correct_index": 0, "explanation": "decision(決定)の動詞形。decide to ~ = 〜すると決める。", "id": "s2_077", "body_ruby": "サッカー部《ぶ》と野球部《やきゅうぶ》で1か月《かげつ》悩《なや》んだが、体験《たいけん》入部《にゅうぶ》を経《へ》て、最終的《さいしゅうてき》にサッカー部《ぶ》に入《はい》ると<decide>した。", "choices_ruby": ["決《き》める", "迷《まよ》う", "忘《わす》れる", "断《ことわ》る"], "explanation_ruby": "decision(決定《けってい》)の動詞形《どうしけい》。decide to ~ = 〜すると決《き》める。", "body_kana": "サッカーぶとやきゅうぶで1かかげつなやんだが、たいけんにゅうぶをへて、さいしゅうてきにサッカーぶにはいると<decide>した。"}, {"word": "deeply", "meaning_jp": "深く", "pos": "副", "body": "その映画のラストシーンに<deeply>感動して、エンドロールが終わっても席を立てなかった。", "choices": ["深く", "浅く", "軽く", "速く"], "correct_index": 0, "explanation": "deep(深い)+ -ly。心に強く響く様子。", "id": "s2_078", "body_ruby": "その映画《えいが》のラストシーンに<deeply>感動《かんどう》して、エンドロールが終《お》わっても席《せき》を立《た》てなかった。", "choices_ruby": ["深《ふか》く", "浅《あさ》く", "軽《かる》く", "速《はや》く"], "explanation_ruby": "deep(深《ふか》い)+ -ly。心《こころ》に強《つよ》く響《ひび》く様子《ようす》。", "body_kana": "そのえいがのラストシーンに<deeply>かんどうして、エンドロールがおわってもせきをたてなかった。"}, {"word": "delicious", "meaning_jp": "おいしい", "pos": "形", "body": "祖母が炊いてくれた栗ごはんは<delicious>で、おかわりを2回もしてしまった。", "choices": ["おいしい", "まずい", "辛い", "苦い"], "correct_index": 0, "explanation": "good より強い「とてもおいしい」。", "id": "s2_079", "body_ruby": "祖母《そぼ》が炊《た》いてくれた栗《くり》ごはんは<delicious>で、おかわりを2回《かい》もしてしまった。", "choices_ruby": ["おいしい", "まずい", "辛《つら》い", "苦《にが》い"], "explanation_ruby": "good より強《つよ》い「とてもおいしい」。", "body_kana": "そぼがたいてくれたくりごはんは<delicious>で、おかわりを2回もしてしまった。"}, {"word": "dentist", "meaning_jp": "歯医者", "pos": "名", "body": "甘いものを食べ過ぎて奥歯が痛くなり、<dentist>に行って虫歯を1本治療してもらった。", "choices": ["歯医者", "目医者", "外科医", "獣医"], "correct_index": 0, "explanation": "dent(歯)が語源。go to the dentist = 歯医者に行く。", "id": "s2_080", "body_ruby": "甘《あま》いものを食《た》べ過《す》ぎて奥歯《おくば》が痛《いた》くなり、<dentist>に行《い》って虫歯《むしば》を1本《ほん》治療《ちりょう》してもらった。", "choices_ruby": ["歯医者《はいしゃ》", "目医者《めいしゃ》", "外科医《げかい》", "獣医《じゅうい》"], "explanation_ruby": "dent(歯《は》)が語源《ごげん》。go to the dentist = 歯医者《はいしゃ》に行《い》く。", "body_kana": "あまいものをたべすぎておくばがいたくなり、<dentist>にいってむしばを1本ちりょうしてもらった。"}, {"word": "desk", "meaning_jp": "机", "pos": "名", "body": "自分の部屋の<desk>には、教科書を立てる棚と引き出しが3つ付いていて、毎晩そこで宿題をする。", "choices": ["机", "椅子", "ベッド", "棚"], "correct_index": 0, "explanation": "勉強・仕事用の台。食事用は table。", "id": "s2_081", "body_ruby": "自分《じぶん》の部屋《へや》の<desk>には、教科書《きょうかしょ》を立《た》てる棚《たな》と｜引き出《ひきだ》しが3つ付《つ》いていて、毎晩《まいばん》そこで宿題《しゅくだい》をする。", "choices_ruby": ["机《つくえ》", "椅子《いす》", "ベッド", "棚《たな》"], "explanation_ruby": "勉強《べんきょう》・仕事用《しごとよう》の台《だい》。食事用《しょくじよう》は table。", "body_kana": "じぶんのへやの<desk>には、きょうかしょをたてるたなとひきだしが3つついていて、まいばんそこでしゅくだいをする。"}, {"word": "die", "meaning_jp": "死ぬ", "pos": "動", "body": "3年間大切に育てた金魚が、ある朝水面に浮かんで<die>していた。庭に埋めて、小さな墓を作った。", "choices": ["死ぬ", "生まれる", "育つ", "逃げる"], "correct_index": 0, "explanation": "death(死)の動詞。live(生きる)の対。", "id": "s2_082", "body_ruby": "3年間《ねんかん》大切《たいせつ》に育《そだ》てた金魚《きんぎょ》が、ある朝《あさ》水面《すいめん》に浮《う》かんで<die>していた。庭《にわ》に埋《う》めて、小《ちい》さな墓《はか》を作《つく》った。", "choices_ruby": ["死《し》ぬ", "生《う》まれる", "育《そだ》つ", "逃《に》げる"], "explanation_ruby": "death(死《し》)の動詞《どうし》。live(生《い》きる)の対《つい》。", "body_kana": "3年間たいせつにそだてたきんぎょが、あるあさすいめんにうかんで<die>していた。にわにうめて、ちいさなはかをつくった。"}, {"word": "different", "meaning_jp": "違った", "pos": "形", "body": "双子の姉妹だが、姉は運動が得意で妹は絵が得意と、性格も趣味もまったく<different>だ。", "choices": ["違った", "同じ", "似ている", "普通の"], "correct_index": 0, "explanation": "same(同じ)の対。be different from ~ = 〜と異なる。", "id": "s2_083", "body_ruby": "双子《ふたご》の姉妹《しまい》だが、姉《あね》は運動《うんどう》が得意《とくい》で妹《いもうと》は絵《え》が得意《とくい》と、性格《せいかく》も趣味《しゅみ》もまったく<different>だ。", "choices_ruby": ["違《ちが》った", "同《おな》じ", "似《に》ている", "普通《ふつう》の"], "explanation_ruby": "same(同《おな》じ)の対《つい》。be different from ~ = 〜と異《こと》なる。", "body_kana": "ふたごのしまいだが、あねはうんどうがとくいでいもうとはえがとくいと、せいかくもしゅみもまったく<different>だ。"}, {"word": "difficult", "meaning_jp": "難しい", "pos": "形", "body": "最後の問題はクラスで2人しか解けなかったほど<difficult>で、先生も「正解した人はすごい」と言った。", "choices": ["難しい", "簡単な", "短い", "面白い"], "correct_index": 0, "explanation": "easy(簡単な)の対。hard と同じ意味。", "id": "s2_084", "body_ruby": "最後《さいご》の問題《もんだい》はクラスで2人《にん》しか解《と》けなかったほど<difficult>で、先生《せんせい》も「正解《せいかい》した人《にん》はすごい」と言《い》った。", "choices_ruby": ["難《むずか》しい", "簡単《かんたん》な", "短《みじか》い", "面白《おもしろ》い"], "explanation_ruby": "easy(簡単《かんたん》な)の対《つい》。hard と同《おな》じ意味《いみ》。", "body_kana": "さいごのもんだいはクラスで2人しかとけなかったほど<difficult>で、せんせいも「せいかいしたにんはすごい」といった。"}, {"word": "dining", "meaning_jp": "食事(用)の", "pos": "名", "body": "我が家では、朝食も夕食も家族そろって<dining>ルームの大きなテーブルで食べることにしている。", "choices": ["食事(用)の", "睡眠(用)の", "勉強(用)の", "入浴(用)の"], "correct_index": 0, "explanation": "dine(食事する)+ -ing。dining room = 食堂。", "id": "s2_085", "body_ruby": "｜我が家《わがや》では、朝食《ちょうしょく》も夕食《ゆうしょく》も家族《かぞく》そろって<dining>ルームの大《おお》きなテーブルで食《た》べることにしている。", "choices_ruby": ["食事《しょくじ》(用《よう》)の", "睡眠《すいみん》(用《よう》)の", "勉強《べんきょう》(用《よう》)の", "入浴《にゅうよく》(用《よう》)の"], "explanation_ruby": "dine(食事《しょくじ》する)+ -ing。dining room = 食堂《しょくどう》。", "body_kana": "わがやでは、ちょうしょくもゆうしょくもかぞくそろって<dining>ルームのおおきなテーブルでたべることにしている。"}, {"word": "direct", "meaning_jp": "直接の", "pos": "形", "body": "この電車は途中の駅に止まらず、乗り換えなしで空港まで行ける<direct>便だ。30分早く着く。", "choices": ["直接の", "遠回りの", "臨時の", "最終の"], "correct_index": 0, "explanation": "direction(方向)、director(監督)と同語源。", "id": "s2_086", "body_ruby": "この電車《でんしゃ》は途中《とちゅう》の駅《えき》に止《と》まらず、｜乗り換《のりか》えなしで空《そら》港《みなと》まで行《い》ける<direct>便《びん》だ。30分《ふん》早《はや》く着《つ》く。", "choices_ruby": ["直接《ちょくせつ》の", "遠回《とおまわ》りの", "臨時《りんじ》の", "最終《さいしゅう》の"], "explanation_ruby": "direction(方向《ほうこう》)、director(監督《かんとく》)と同語《どうご》源《げん》。", "body_kana": "このでんしゃはとちゅうのえきにとまらず、のりかえなしでそらみなとまでいける<direct>びんだ。30分はやくつく。"}, {"word": "director", "meaning_jp": "監督", "pos": "名", "body": "映画の<director>は、カメラの位置や俳優の演技に細かく指示を出し、作品全体を仕上げる責任者だ。", "choices": ["監督", "俳優", "観客", "脚本家"], "correct_index": 0, "explanation": "direct(指揮する)+ -or。映画監督・取締役。", "id": "s2_087", "body_ruby": "映画《えいが》の<director>は、カメラの位置《いち》や俳優《はいゆう》の演技《えんぎ》に細《こま》かく指示《しじ》を出《だ》し、作品全体《さくひんぜんたい》を仕上《しあ》げる責任者《せきにんしゃ》だ。", "choices_ruby": ["監督《かんとく》", "俳優《はいゆう》", "観客《かんきゃく》", "脚本家《きゃくほんか》"], "explanation_ruby": "direct(指揮《しき》する)+ -or。映画監督《えいがかんとく》・取締役《とりしまりやく》。", "body_kana": "えいがの<director>は、カメラのいちやはいゆうのえんぎにこまかくしじをだし、さくひんぜんたいをしあげるせきにんしゃだ。"}, {"word": "doctor", "meaning_jp": "医者", "pos": "名", "body": "高熱が3日下がらず病院へ行くと、<doctor>が聴診器を当てて喉を見て、薬を5日分出してくれた。", "choices": ["医者", "看護師", "薬剤師", "患者"], "correct_index": 0, "explanation": "Dr. と略す。「博士」の意味もある。", "id": "s2_088", "body_ruby": "高熱《こうねつ》が3日《にち》下《さ》がらず病院《びょういん》へ行《い》くと、<doctor>が聴診器《ちょうしんき》を当《あ》てて喉《のど》を見《み》て、薬《くすり》を5日《にち》分出《ぶんしゅつ》してくれた。", "choices_ruby": ["医者《いしゃ》", "看護《かんご》師《し》", "薬剤師《やくざいし》", "患者《かんじゃ》"], "explanation_ruby": "Dr. と略《りゃく》す。「博士《はかせ》」の意味《いみ》もある。", "body_kana": "こうねつが3日さがらずびょういんへいくと、<doctor>がちょうしんきをあててのどをみて、くすりを5日ぶんしゅつしてくれた。"}, {"word": "dolphin", "meaning_jp": "イルカ", "pos": "名", "body": "水族館のショーで、<dolphin>が水面から5メートルもジャンプして、輪を見事にくぐり抜けた。", "choices": ["イルカ", "クジラ", "サメ", "アザラシ"], "correct_index": 0, "explanation": "賢い海の哺乳類。鳴き声でコミュニケーションする。", "id": "s2_089", "body_ruby": "水族館《すいぞくかん》のショーで、<dolphin>が水面《すいめん》から5メートルもジャンプして、輪《わ》を見事《みごと》にくぐり抜《ぬ》けた。", "choices_ruby": ["イルカ", "クジラ", "サメ", "アザラシ"], "explanation_ruby": "賢《かしこ》い海《うみ》の哺乳類《ほにゅうるい》。｜鳴き声《なきごえ》でコミュニケーションする。", "body_kana": "すいぞくかんのショーで、<dolphin>がすいめんから5メートルもジャンプして、わをみごとにくぐりぬけた。"}, {"word": "dream", "meaning_jp": "夢", "pos": "名", "body": "昨夜は空を飛ぶ<dream>を見た。雲の上をどこまでも進んでいて、目覚ましの音で目が覚めてがっかりした。", "choices": ["夢", "本", "歌", "話"], "correct_index": 0, "explanation": "睡眠中の夢も、将来の夢も同じ語。", "id": "s2_090", "body_ruby": "昨夜《さくや》は空《そら》を飛《と》ぶ<dream>を見《み》た。雲《くも》の上《うえ》をどこまでも進《すす》んでいて、目覚《めざ》ましの音《おと》で目《め》が覚《さ》めてがっかりした。", "choices_ruby": ["夢《ゆめ》", "本《ほん》", "歌《うた》", "話《はなし》"], "explanation_ruby": "睡眠中《すいみんちゅう》の夢《ゆめ》も、将来《しょうらい》の夢《ゆめ》も同《おな》じ語《ご》。", "body_kana": "さくやはそらをとぶ<dream>をみた。くものうえをどこまでもすすんでいて、めざましのおとでめがさめてがっかりした。"}, {"word": "dress", "meaning_jp": "ドレス、服", "pos": "名", "body": "いとこの結婚式で、母は普段着ない薄い水色の<dress>を着て、髪も美容院でセットしてもらっていた。", "choices": ["ドレス", "制服", "パジャマ", "エプロン"], "correct_index": 0, "explanation": "女性用の正装ワンピース。動詞では「服を着る」。", "id": "s2_091", "body_ruby": "いとこの結婚式《けっこんしき》で、母《はは》は普段着《ふだんぎ》ない薄《うす》い水色《みずいろ》の<dress>を着《き》て、髪《かみ》も美容院《びよういん》でセットしてもらっていた。", "choices_ruby": ["ドレス", "制服《せいふく》", "パジャマ", "エプロン"], "explanation_ruby": "女性用《じょせいよう》の正装《せいそう》ワンピース。動詞《どうし》では「服《ふく》を着《き》る」。", "body_kana": "いとこのけっこんしきで、はははふだんぎないうすいみずいろの<dress>をきて、かみもびよういんでセットしてもらっていた。"}, {"word": "drugstore", "meaning_jp": "ドラッグストア、薬局", "pos": "名", "body": "風邪薬と絆創膏とシャンプーを買いに、駅前の<drugstore>へ行った。薬以外の日用品も売っている。", "choices": ["薬局", "本屋", "八百屋", "電器店"], "correct_index": 0, "explanation": "drug(薬)+ store(店)。", "id": "s2_092", "body_ruby": "風邪《かぜ》薬《くすり》と絆創膏《ばんそうこう》とシャンプーを買《か》いに、駅前《えきまえ》の<drugstore>へ行《い》った。薬《くすり》以外《いがい》の日《ひ》用品《ようひん》も売《う》っている。", "choices_ruby": ["薬局《やっきょく》", "本屋《ほんや》", "八百屋《やおや》", "電器店《でんきてん》"], "explanation_ruby": "drug(薬《くすり》)+ store(店《みせ》)。", "body_kana": "かぜくすりとばんそうこうとシャンプーをかいに、えきまえの<drugstore>へいった。くすりいがいのひようひんもうっている。"}, {"word": "earth", "meaning_jp": "地球", "pos": "名", "body": "宇宙から見た<earth>は青く輝いていて、表面の7割を占める海の色なのだと理科で習った。", "choices": ["地球", "月", "太陽", "火星"], "correct_index": 0, "explanation": "the Earth。「土・大地」の意味もある。", "id": "s2_093", "body_ruby": "宇宙《うちゅう》から見《み》た<earth>は青《あお》く輝《かがや》いていて、表面《ひょうめん》の7割《わり》を占《し》める海《うみ》の色《いろ》なのだと理科《りか》で習《なら》った。", "choices_ruby": ["地球《ちきゅう》", "月《がつ》", "太陽《たいよう》", "火星《かせい》"], "explanation_ruby": "the Earth。「土《つち》・大地《だいち》」の意味《いみ》もある。", "body_kana": "うちゅうからみた<earth>はあおくかがやいていて、ひょうめんの7わりをしめるうみのいろなのだとりかでならった。"}, {"word": "earthquake", "meaning_jp": "地震", "pos": "名", "body": "夜中に大きな<earthquake>があり、棚の本が床に落ちた。揺れは30秒ほどでおさまった。", "choices": ["地震", "台風", "洪水", "雷"], "correct_index": 0, "explanation": "earth(大地)+ quake(揺れる)。", "id": "s2_094", "body_ruby": "夜中《よなか》に大《おお》きな<earthquake>があり、棚《たな》の本《ほん》が床《ゆか》に落《お》ちた。揺《ゆ》れは30秒《びょう》ほどでおさまった。", "choices_ruby": ["地震《じしん》", "台風《たいふう》", "洪水《こうずい》", "雷《かみなり》"], "explanation_ruby": "earth(大地《だいち》)+ quake(揺《ゆ》れる)。", "body_kana": "よなかにおおきな<earthquake>があり、たなのほんがゆかにおちた。ゆれは30秒ほどでおさまった。"}, {"word": "easy", "meaning_jp": "簡単な", "pos": "形", "body": "今日の宿題は計算ドリル1ページだけで、10分で終わるほど<easy>だった。", "choices": ["簡単な", "難しい", "長い", "新しい"], "correct_index": 0, "explanation": "difficult(難しい)の対。Take it easy! = 気楽にね!", "id": "s2_095", "body_ruby": "今日《きょう》の宿題《しゅくだい》は計算《けいさん》ドリル1ページだけで、10分《ふん》で終《お》わるほど<easy>だった。", "choices_ruby": ["簡単《かんたん》な", "難《むずか》しい", "長《なが》い", "新《あたら》しい"], "explanation_ruby": "difficult(難《むずか》しい)の対《つい》。Take it easy! = 気楽《きらく》にね!", "body_kana": "きょうのしゅくだいはけいさんドリル1ページだけで、10分でおわるほど<easy>だった。"}, {"word": "empty", "meaning_jp": "空(から)の", "pos": "形", "body": "お菓子の箱を開けたら中は<empty>で、弟が最後の1枚まで食べてしまった後だった。", "choices": ["空の", "満杯の", "新品の", "重い"], "correct_index": 0, "explanation": "full(いっぱいの)の対。empty seat = 空席。", "id": "s2_096", "body_ruby": "お菓子《かし》の箱《はこ》を開《ひら》けたら中《なか》は<empty>で、弟《おとうと》が最後《さいご》の1枚《まい》まで食《た》べてしまった後《あと》だった。", "choices_ruby": ["空《そら》の", "満杯《まんぱい》の", "新品《しんぴん》の", "重《おも》い"], "explanation_ruby": "full(いっぱいの)の対《つい》。empty seat = 空席《くうせき》。", "body_kana": "おかしのはこをひらけたらなかは<empty>で、おとうとがさいごの1枚までたべてしまったあとだった。"}, {"word": "end", "meaning_jp": "終わり", "pos": "名", "body": "夏休みも8月31日でついに<end>を迎える。残った宿題を前に、初日からやればよかったと毎年思う。", "choices": ["終わり", "始まり", "途中", "延長"], "correct_index": 0, "explanation": "beginning(始まり)の対。the end = おしまい。", "id": "s2_097", "body_ruby": "夏休《なつやす》みも8月《がつ》31日《にち》でついに<end>を迎《むか》える。残《のこ》った宿題《しゅくだい》を前《まえ》に、初日《しょにち》からやればよかったと毎年《まいとし》思《おも》う。", "choices_ruby": ["終《お》わり", "始《はじ》まり", "途中《とちゅう》", "延長《えんちょう》"], "explanation_ruby": "beginning(始《はじ》まり)の対《つい》。the end = おしまい。", "body_kana": "なつやすみも8月31日でついに<end>をむかえる。のこったしゅくだいをまえに、しょにちからやればよかったとまいとしおもう。"}, {"word": "energy", "meaning_jp": "エネルギー、元気", "pos": "名", "body": "朝ごはんをしっかり食べると、午前中の授業も体育も乗り切る<energy>が体に湧いてくる。", "choices": ["エネルギー", "眠気", "病気", "時間"], "correct_index": 0, "explanation": "活動の源になる力。発音は「エナジー」。", "id": "s2_098", "body_ruby": "朝《あさ》ごはんをしっかり食《た》べると、午前中《ごぜんちゅう》の授業《じゅぎょう》も体育《たいいく》も｜乗り切《のりき》る<energy>が体《からだ》に湧《わ》いてくる。", "choices_ruby": ["エネルギー", "眠気《ねむけ》", "病気《びょうき》", "時間《じかん》"], "explanation_ruby": "活動《かつどう》の源《げん》になる力《ちから》。発音《はつおん》は「エナジー」。", "body_kana": "あさごはんをしっかりたべると、ごぜんちゅうのじゅぎょうもたいいくものりきる<energy>がからだにわいてくる。"}, {"word": "engineer", "meaning_jp": "エンジニア、技師", "pos": "名", "body": "橋やトンネルの設計をする<engineer>になりたくて、彼は数学と理科を特に頑張っている。", "choices": ["技師", "医師", "教師", "弁護士"], "correct_index": 0, "explanation": "engine(エンジン)+ -eer。技術の専門家。", "id": "s2_099", "body_ruby": "橋《はし》やトンネルの設計《せっけい》をする<engineer>になりたくて、彼《かれ》は数学《すうがく》と理科《りか》を特《とく》に頑張《がんば》っている。", "choices_ruby": ["技師《ぎし》", "医師《いし》", "教師《きょうし》", "弁護士《べんごし》"], "explanation_ruby": "engine(エンジン)+ -eer。技術《ぎじゅつ》の専門家《せんもんか》。", "body_kana": "はしやトンネルのせっけいをする<engineer>になりたくて、かれはすうがくとりかをとくにがんばっている。"}, {"word": "enough", "meaning_jp": "十分な", "pos": "形", "body": "遠足のおやつは300円まで。チョコとガムとあめを買ったら、ちょうど予算内に<enough>収まった。", "choices": ["十分に", "不足して", "余分に", "わずかに"], "correct_index": 0, "explanation": "必要な量に足りていること。発音は「イナフ」。", "id": "s2_100", "body_ruby": "遠足《えんそく》のおやつは300円《えん》まで。チョコとガムとあめを買《か》ったら、ちょうど予算《よさん》内《ない》に<enough>収《おさ》まった。", "choices_ruby": ["十分《じゅうぶん》に", "不足《ふそく》して", "余分《よぶん》に", "わずかに"], "explanation_ruby": "必要《ひつよう》な量《りょう》に足《た》りていること。発音《はつおん》は「イナフ」。", "body_kana": "えんそくのおやつは300円まで。チョコとガムとあめをかったら、ちょうどよさんないに<enough>おさまった。"}, {"word": "event", "meaning_jp": "行事、イベント", "pos": "名", "body": "体育祭、文化祭、合唱コンクール。2学期は大きな<event>が3つも続くので、毎週どこかで練習がある。", "choices": ["行事", "授業", "休暇", "試験"], "correct_index": 0, "explanation": "特別な催し。big event = 一大イベント。", "id": "s2_101", "body_ruby": "体育祭《たいいくさい》、文化祭《ぶんかさい》、合唱《がっしょう》コンクール。2学期《がっき》は大《おお》きな<event>が3つも続《つづ》くので、毎週《まいしゅう》どこかで練習《れんしゅう》がある。", "choices_ruby": ["行事《ぎょうじ》", "授業《じゅぎょう》", "休暇《きゅうか》", "試験《しけん》"], "explanation_ruby": "特別《とくべつ》な催《もよお》し。big event = 一大《いちだい》イベント。", "body_kana": "たいいくさい、ぶんかさい、がっしょうコンクール。2学期はおおきな<event>が3つもつづくので、まいしゅうどこかでれんしゅうがある。"}, {"word": "exam", "meaning_jp": "試験", "pos": "名", "body": "来週の月曜から3日間、5教科の期末<exam>がある。今週は部活も休みになり、放課後は皆まっすぐ帰る。", "choices": ["試験", "遠足", "面談", "発表会"], "correct_index": 0, "explanation": "examination の短縮形。entrance exam = 入学試験。", "id": "s2_102", "body_ruby": "来週《らいしゅう》の月曜《げつよう》から3日間《にちかん》、5教科《きょうか》の期末《きまつ》<exam>がある。今週《こんしゅう》は部活《ぶかつ》も休《やす》みになり、放課後《ほうかご》は皆《みな》まっすぐ帰《かえ》る。", "choices_ruby": ["試験《しけん》", "遠足《えんそく》", "面談《めんだん》", "発表会《はっぴょうかい》"], "explanation_ruby": "examination の短縮形《たんしゅくけい》。entrance exam = 入学試験《にゅうがくしけん》。", "body_kana": "らいしゅうのげつようから3日間、5きょうかのきまつ<exam>がある。こんしゅうはぶかつもやすみになり、ほうかごはみなまっすぐかえる。"}, {"word": "example", "meaning_jp": "例", "pos": "名", "body": "先生は新しい文法を説明した後、「<example>を3つ挙げるね」と言って、黒板に具体的な文を書いた。", "choices": ["例", "答え", "宿題", "理由"], "correct_index": 0, "explanation": "for example = 例えば。", "id": "s2_103", "body_ruby": "先生《せんせい》は新《あたら》しい文法《ぶんぽう》を説明《せつめい》した後《あと》、「<example>を3つ挙《あ》げるね」と言《い》って、黒板《こくばん》に具体的《ぐたいてき》な文《ぶん》を書《か》いた。", "choices_ruby": ["例《れい》", "答《こた》え", "宿題《しゅくだい》", "理由《りゆう》"], "explanation_ruby": "for example = 例《たと》えば。", "body_kana": "せんせいはあたらしいぶんぽうをせつめいしたあと、「<example>を3つあげるね」といって、こくばんにぐたいてきなぶんをかいた。"}, {"word": "excited", "meaning_jp": "わくわくした", "pos": "形", "body": "明日はずっと楽しみにしていた遊園地。<excited>しすぎて、夜ベッドに入ってもなかなか寝つけなかった。", "choices": ["わくわくした", "がっかりした", "退屈した", "ほっとした"], "correct_index": 0, "explanation": "人が「わくわくしている」状態。物事側は exciting。", "id": "s2_104", "body_ruby": "明日《あした》はずっと楽《たの》しみにしていた遊園地《ゆうえんち》。<excited>しすぎて、夜《よる》ベッドに入《はい》ってもなかなか寝《ね》つけなかった。", "choices_ruby": ["わくわくした", "がっかりした", "退屈《たいくつ》した", "ほっとした"], "explanation_ruby": "人《にん》が「わくわくしている」状態《じょうたい》。物事《ものごと》側《がわ》は exciting。", "body_kana": "あしたはずっとたのしみにしていたゆうえんち。<excited>しすぎて、よるベッドにはいってもなかなかねつけなかった。"}, {"word": "exciting", "meaning_jp": "わくわくさせる", "pos": "形", "body": "9回裏に逆転サヨナラホームランが出る、最後まで目が離せない<exciting>な試合だった。", "choices": ["わくわくさせる", "退屈な", "悲しい", "静かな"], "correct_index": 0, "explanation": "物事が「人をわくわくさせる」。人側は excited。", "id": "s2_105", "body_ruby": "9回《かい》裏《うら》に逆転《ぎゃくてん》サヨナラホームランが出《で》る、最後《さいご》まで目《め》が離《はな》せない<exciting>な試合《しあい》だった。", "choices_ruby": ["わくわくさせる", "退屈《たいくつ》な", "悲《かな》しい", "静《しず》かな"], "explanation_ruby": "物事《ものごと》が「人《にん》をわくわくさせる」。人《にん》側《がわ》は excited。", "body_kana": "9回うらにぎゃくてんサヨナラホームランがでる、さいごまでめがはなせない<exciting>なしあいだった。"}, {"word": "expensive", "meaning_jp": "高価な", "pos": "形", "body": "ほしいゲーム機は5万円もして、お年玉を全部合わせても足りないほど<expensive>だ。", "choices": ["高価な", "安い", "無料の", "中古の"], "correct_index": 0, "explanation": "cheap(安い)の対。expense(費用)の形容詞。", "id": "s2_106", "body_ruby": "ほしいゲーム機《き》は5万円《まんえん》もして、お年玉《としだま》を全部《ぜんぶ》合《あ》わせても足《た》りないほど<expensive>だ。", "choices_ruby": ["高価《こうか》な", "安《やす》い", "無料《むりょう》の", "中古《ちゅうこ》の"], "explanation_ruby": "cheap(安《やす》い)の対《つい》。expense(費用《ひよう》)の形容詞《けいようし》。", "body_kana": "ほしいゲームきは5まんえんもして、おとしだまをぜんぶあわせてもたりないほど<expensive>だ。"}, {"word": "explain", "meaning_jp": "説明する", "pos": "動", "body": "数学が得意な友達は、私が解けなかった問題の解き方を、図を描きながら順番に<explain>してくれた。", "choices": ["説明する", "出題する", "採点する", "暗記する"], "correct_index": 0, "explanation": "explanation(説明)の動詞形。", "id": "s2_107", "body_ruby": "数学《すうがく》が得意《とくい》な友達《ともだち》は、私《わたし》が解《と》けなかった問題《もんだい》の解《と》き方《ほう》を、図《ず》を描《えが》きながら順番《じゅんばん》に<explain>してくれた。", "choices_ruby": ["説明《せつめい》する", "出題《しゅつだい》する", "採点《さいてん》する", "暗記《あんき》する"], "explanation_ruby": "explanation(説明《せつめい》)の動詞形《どうしけい》。", "body_kana": "すうがくがとくいなともだちは、わたしがとけなかったもんだいのときほうを、ずをえがきながらじゅんばんに<explain>してくれた。"}, {"word": "famous", "meaning_jp": "有名な", "pos": "形", "body": "この温泉街は300年の歴史があり、全国から年間100万人が訪れるほど<famous>だ。", "choices": ["有名な", "無名の", "新しい", "静かな"], "correct_index": 0, "explanation": "be famous for ~ = 〜で有名。fame(名声)の形容詞。", "id": "s2_108", "body_ruby": "この温泉街《おんせんがい》は300年《ねん》の歴史《れきし》があり、全国《ぜんこく》から年間《ねんかん》100万人《まんにん》が訪《おとず》れるほど<famous>だ。", "choices_ruby": ["有名《ゆうめい》な", "無名《むめい》の", "新《あたら》しい", "静《しず》かな"], "explanation_ruby": "be famous for ~ = 〜で有名《ゆうめい》。fame(名声《めいせい》)の形容詞《けいようし》。", "body_kana": "このおんせんがいは300年のれきしがあり、ぜんこくからねんかん100まんにんがおとずれるほど<famous>だ。"}, {"word": "farmer", "meaning_jp": "農家(の人)", "pos": "名", "body": "近所の<farmer>は、朝5時から畑に出てトマトとナスを育て、収穫したものを直売所で売っている。", "choices": ["農家の人", "漁師", "大工", "店員"], "correct_index": 0, "explanation": "farm(農場)+ -er。", "id": "s2_109", "body_ruby": "近所《きんじょ》の<farmer>は、朝《あさ》5時《じ》から畑《はたけ》に出《で》てトマトとナスを育《そだ》て、収穫《しゅうかく》したものを直売《ちょくばい》所《ところ》で売《う》っている。", "choices_ruby": ["農家《のうか》の人《にん》", "漁師《りょうし》", "大工《だいく》", "店員《てんいん》"], "explanation_ruby": "farm(農場《のうじょう》)+ -er。", "body_kana": "きんじょの<farmer>は、あさ5時からはたけにでてトマトとナスをそだて、しゅうかくしたものをちょくばいところでうっている。"}, {"word": "fee", "meaning_jp": "料金", "pos": "名", "body": "美術館の入場<fee>は大人1200円だが、中学生は400円、小学生以下は無料だった。", "choices": ["料金", "時間", "場所", "順番"], "correct_index": 0, "explanation": "入場料・授業料などのお金。school fees = 学費。", "id": "s2_110", "body_ruby": "美術館《びじゅつかん》の入場《にゅうじょう》<fee>は大人《おとな》1200円《えん》だが、中学生《ちゅうがくせい》は400円《えん》、小学生以下《しょうがくせいいか》は無料《むりょう》だった。", "choices_ruby": ["料金《りょうきん》", "時間《じかん》", "場所《ばしょ》", "順番《じゅんばん》"], "explanation_ruby": "入場料《にゅうじょうりょう》・授業料《じゅぎょうりょう》などのお金《かね》。school fees = 学費《がくひ》。", "body_kana": "びじゅつかんのにゅうじょう<fee>はおとな1200円だが、ちゅうがくせいは400円、しょうがくせいいかはむりょうだった。"}, {"word": "feel", "meaning_jp": "感じる", "pos": "動", "body": "夜道を歩いていると、誰かに後ろから見られているように<feel>して、思わず振り返ってしまった。", "choices": ["感じる", "話す", "見る", "笑う"], "correct_index": 0, "explanation": "feel-felt-felt。feeling(感情)の動詞形。", "id": "s2_111", "body_ruby": "夜道《よみち》を歩《ある》いていると、誰《だれ》かに後《うし》ろから見《み》られているように<feel>して、思《おも》わず｜振り返《ふりかえ》ってしまった。", "choices_ruby": ["感《かん》じる", "話《はな》す", "見《み》る", "笑《わら》う"], "explanation_ruby": "feel-felt-felt。feeling(感情《かんじょう》)の動詞形《どうしけい》。", "body_kana": "よみちをあるいていると、だれかにうしろからみられているように<feel>して、おもわずふりかえってしまった。"}, {"word": "feeling", "meaning_jp": "気持ち", "pos": "名", "body": "卒業式では、嬉しさと寂しさが混ざった不思議な<feeling>になり、胸がいっぱいだった。", "choices": ["気持ち", "天気", "知識", "順位"], "correct_index": 0, "explanation": "feel(感じる)+ -ing。喜怒哀楽の心の動き。", "id": "s2_112", "body_ruby": "卒業式《そつぎょうしき》では、嬉《うれ》しさと寂《さび》しさが混《ま》ざった不思議《ふしぎ》な<feeling>になり、胸《むね》がいっぱいだった。", "choices_ruby": ["気持《きも》ち", "天気《てんき》", "知識《ちしき》", "順位《じゅんい》"], "explanation_ruby": "feel(感《かん》じる)+ -ing。喜怒哀楽《きどあいらく》の心《こころ》の動《うご》き。", "body_kana": "そつぎょうしきでは、うれしさとさびしさがまざったふしぎな<feeling>になり、むねがいっぱいだった。"}, {"word": "fight", "meaning_jp": "けんか、戦い", "pos": "名/動", "body": "ゲームの順番をめぐって弟と<fight>になり、母に「2人とも今日は禁止!」と取り上げられてしまった。", "choices": ["けんか", "約束", "相談", "協力"], "correct_index": 0, "explanation": "fight-fought-fought。応援の「ファイト」は和製用法。", "id": "s2_113", "body_ruby": "ゲームの順番《じゅんばん》をめぐって弟《おとうと》と<fight>になり、母《はは》に「2人《にん》とも今日《きょう》は禁止《きんし》!」と｜取り上《とりあ》げられてしまった。", "choices_ruby": ["けんか", "約束《やくそく》", "相談《そうだん》", "協力《きょうりょく》"], "explanation_ruby": "fight-fought-fought。応援《おうえん》の「ファイト」は和製《わせい》用法《ようほう》。", "body_kana": "ゲームのじゅんばんをめぐっておとうとと<fight>になり、ははに「2人ともきょうはきんし!」ととりあげられてしまった。"}, {"word": "film", "meaning_jp": "映画、フィルム", "pos": "名", "body": "祖父の若い頃のカメラは、撮った<film>を写真屋に持って行って現像するまで、写りが分からなかったそうだ。", "choices": ["フィルム", "電池", "レンズ", "三脚"], "correct_index": 0, "explanation": "イギリスでは「映画」の意味でもよく使う(= movie)。", "id": "s2_114", "body_ruby": "祖父《そふ》の若《わか》い頃《ごろ》のカメラは、撮《と》った<film>を写真屋《しゃしんや》に持《も》って行《い》って現像《げんぞう》するまで、写《うつ》りが分《わ》からなかったそうだ。", "choices_ruby": ["フィルム", "電池《でんち》", "レンズ", "三脚《さんきゃく》"], "explanation_ruby": "イギリスでは「映画《えいが》」の意味《いみ》でもよく使《つか》う(= movie)。", "body_kana": "そふのわかいごろのカメラは、とった<film>をしゃしんやにもっていってげんぞうするまで、うつりがわからなかったそうだ。"}, {"word": "final", "meaning_jp": "最終の", "pos": "形", "body": "私たちのチームはトーナメントを勝ち進み、ついに<final>戦まで来た。次に勝てば優勝だ。", "choices": ["最終の", "最初の", "練習の", "延長の"], "correct_index": 0, "explanation": "finally(ついに)の形容詞。決勝戦 = the final。", "id": "s2_115", "body_ruby": "私《わたし》たちのチームはトーナメントを勝《か》ち進《すす》み、ついに<final>戦《せん》まで来《き》た。次《つぎ》に勝《か》てば優勝《ゆうしょう》だ。", "choices_ruby": ["最終《さいしゅう》の", "最初《さいしょ》の", "練習《れんしゅう》の", "延長《えんちょう》の"], "explanation_ruby": "finally(ついに)の形容詞《けいようし》。決勝戦《けっしょうせん》 = the final。", "body_kana": "わたしたちのチームはトーナメントをかちすすみ、ついに<final>せんまできた。つぎにかてばゆうしょうだ。"}, {"word": "find", "meaning_jp": "見つける", "pos": "動", "body": "1週間前になくした消しゴムを、ロッカーの奥でようやく<find>した。ほこりを払ってまた使っている。", "choices": ["見つける", "なくす", "捨てる", "借りる"], "correct_index": 0, "explanation": "find-found-found。lose(なくす)の対。", "id": "s2_116", "body_ruby": "1週間《しゅうかん》前《まえ》になくした消《け》しゴムを、ロッカーの奥《おく》でようやく<find>した。ほこりを払《はら》ってまた使《つか》っている。", "choices_ruby": ["見《み》つける", "なくす", "捨《す》てる", "借《か》りる"], "explanation_ruby": "find-found-found。lose(なくす)の対《つい》。", "body_kana": "1週間まえになくしたけしゴムを、ロッカーのおくでようやく<find>した。ほこりをはらってまたつかっている。"}, {"word": "fish", "meaning_jp": "魚", "pos": "名", "body": "水族館の大水槽では、銀色の<fish>が何百匹も群れになって、同じ方向にゆったり泳いでいた。", "choices": ["魚", "鳥", "貝", "カニ"], "correct_index": 0, "explanation": "複数形も fish のまま。fishing = 釣り。", "id": "s2_117", "body_ruby": "水族館《すいぞくかん》の大水槽《だいすいそう》では、銀色《ぎんいろ》の<fish>が何百《なんびゃく》匹《ひき》も群《む》れになって、同《おな》じ方向《ほうこう》にゆったり泳《およ》いでいた。", "choices_ruby": ["魚《さかな》", "鳥《とり》", "貝《かい》", "カニ"], "explanation_ruby": "複数形《ふくすうけい》も fish のまま。fishing = 釣《つ》り。", "body_kana": "すいぞくかんのだいすいそうでは、ぎんいろの<fish>がなんびゃくひきもむれになって、おなじほうこうにゆったりおよいでいた。"}, {"word": "flash", "meaning_jp": "閃光、フラッシュ", "pos": "名", "body": "暗い体育館で集合写真を撮ったら、カメラの<flash>が一瞬光って、目の前が白くなった。", "choices": ["閃光", "音楽", "煙", "風"], "correct_index": 0, "explanation": "一瞬の強い光。flash of lightning = 稲妻。", "id": "s2_118", "body_ruby": "暗《くら》い体育館《たいいくかん》で集合写真《しゅうごうしゃしん》を撮《と》ったら、カメラの<flash>が一瞬《いっしゅん》光《ひか》って、｜目の前《めのまえ》が白《しろ》くなった。", "choices_ruby": ["閃光《せんこう》", "音楽《おんがく》", "煙《けむり》", "風《かぜ》"], "explanation_ruby": "一瞬《いっしゅん》の強《つよ》い光《ひかり》。flash of lightning = 稲妻《いなづま》。", "body_kana": "くらいたいいくかんでしゅうごうしゃしんをとったら、カメラの<flash>がいっしゅんひかって、めのまえがしろくなった。"}, {"word": "floor", "meaning_jp": "床、階", "pos": "名", "body": "牛乳をこぼしてしまい、<floor>が白い水たまりになったので、急いで雑巾で拭いた。", "choices": ["床", "天井", "壁", "窓"], "correct_index": 0, "explanation": "「階」の意味も(the first floor = 1階)。", "id": "s2_119", "body_ruby": "牛乳《ぎゅうにゅう》をこぼしてしまい、<floor>が白《しろ》い水《みず》たまりになったので、急《いそ》いで雑巾《ぞうきん》で拭《ぬぐ》いた。", "choices_ruby": ["床《ゆか》", "天井《てんじょう》", "壁《かべ》", "窓《まど》"], "explanation_ruby": "「階《かい》」の意味《いみ》も(the first floor = 1階《かい》)。", "body_kana": "ぎゅうにゅうをこぼしてしまい、<floor>がしろいみずたまりになったので、いそいでぞうきんでぬぐいた。"}, {"word": "force", "meaning_jp": "力", "pos": "名", "body": "台風の風の<force>はすさまじく、駅前の大きな看板が根元から倒れてしまった。", "choices": ["力", "音", "色", "形"], "correct_index": 0, "explanation": "物理的な力・強制力。forceful = 力強い。", "id": "s2_120", "body_ruby": "台風《たいふう》の風《かぜ》の<force>はすさまじく、駅前《えきまえ》の大《おお》きな看板《かんばん》が根元《ねもと》から倒《たお》れてしまった。", "choices_ruby": ["力《ちから》", "音《おと》", "色《いろ》", "形《かたち》"], "explanation_ruby": "物理的《ぶつりてき》な力《ちから》・強制力《きょうせいりょく》。forceful = 力強《ちからづよ》い。", "body_kana": "たいふうのかぜの<force>はすさまじく、えきまえのおおきなかんばんがねもとからたおれてしまった。"}, {"word": "forget", "meaning_jp": "忘れる", "pos": "動", "body": "今朝は急いでいて、玄関に置いておいた水筒をそのまま<forget>してきてしまった。一日中のどが渇いた。", "choices": ["忘れる", "覚える", "見つける", "運ぶ"], "correct_index": 0, "explanation": "forget-forgot-forgotten。remember(覚えている)の対。", "id": "s2_121", "body_ruby": "今朝《けさ》は急《いそ》いでいて、玄関《げんかん》に置《お》いておいた水筒《すいとう》をそのまま<forget>してきてしまった。一日中《いちにちじゅう》のどが渇《かわ》いた。", "choices_ruby": ["忘《わす》れる", "覚《おぼ》える", "見《み》つける", "運《はこ》ぶ"], "explanation_ruby": "forget-forgot-forgotten。remember(覚《おぼ》えている)の対《つい》。", "body_kana": "けさはいそいでいて、げんかんにおいておいたすいとうをそのまま<forget>してきてしまった。いちにちじゅうのどがかわいた。"}, {"word": "forgot", "meaning_jp": "忘れた", "pos": "動", "body": "友達の誕生日を完全に<forgot>していて、翌日に気づいて慌てて「おめでとう、1日遅れてごめん!」と謝った。", "choices": ["忘れた", "祝った", "覚えた", "調べた"], "correct_index": 0, "explanation": "forget の過去形。", "id": "s2_122", "body_ruby": "友達《ともだち》の誕生日《たんじょうび》を完全《かんぜん》に<forgot>していて、翌日《よくじつ》に気《き》づいて慌《あわ》てて「おめでとう、1日《にち》遅《おく》れてごめん!」と謝《あやま》った。", "choices_ruby": ["忘《わす》れた", "祝《いわ》った", "覚《おぼ》えた", "調《しら》べた"], "explanation_ruby": "forget の過去形《かこけい》。", "body_kana": "ともだちのたんじょうびをかんぜんに<forgot>していて、よくじつにきづいてあわてて「おめでとう、1日おくれてごめん!」とあやまった。"}, {"word": "free", "meaning_jp": "無料の、自由な", "pos": "形", "body": "この博物館は毎月第1日曜日だけ入場が<free>になるので、その日はいつも家族連れで混んでいる。", "choices": ["無料の", "有料の", "高額の", "予約制の"], "correct_index": 0, "explanation": "「自由な」の意味も(free time = 自由時間)。", "id": "s2_123", "body_ruby": "この博物館《はくぶつかん》は毎月第《まいげつだい》1日《にち》曜日《ようび》だけ入場《にゅうじょう》が<free>になるので、その日《ひ》はいつも家族連《かぞくづ》れで混《こ》んでいる。", "choices_ruby": ["無料《むりょう》の", "有料《ゆうりょう》の", "高額《こうがく》の", "予約制《よやくせい》の"], "explanation_ruby": "「自由《じゆう》な」の意味《いみ》も(free time = 自由時間《じゆうじかん》)。", "body_kana": "このはくぶつかんはまいげつだい1日ようびだけにゅうじょうが<free>になるので、そのひはいつもかぞくづれでこんでいる。"}, {"word": "fridge", "meaning_jp": "冷蔵庫", "pos": "名", "body": "部活から帰るとまず<fridge>を開けて、冷えた麦茶をコップに注いで一気に飲むのが夏の日課だ。", "choices": ["冷蔵庫", "戸棚", "炊飯器", "電子レンジ"], "correct_index": 0, "explanation": "refrigerator の短縮形。", "id": "s2_124", "body_ruby": "部活《ぶかつ》から帰《かえ》るとまず<fridge>を開《ひら》けて、冷《ひ》えた麦茶《むぎちゃ》をコップに注《そそ》いで一気《いっき》に飲《の》むのが夏《なつ》の日《ひ》課《か》だ。", "choices_ruby": ["冷蔵庫《れいぞうこ》", "戸棚《とだな》", "炊飯器《すいはんき》", "電子《でんし》レンジ"], "explanation_ruby": "refrigerator の短縮形《たんしゅくけい》。", "body_kana": "ぶかつからかえるとまず<fridge>をひらけて、ひえたむぎちゃをコップにそそいでいっきにのむのがなつのひかだ。"}, {"word": "front", "meaning_jp": "前、正面", "pos": "名", "body": "背の順で並ぶと、私はクラスで2番目に小さいので、いつも列のいちばん<front>の方になる。", "choices": ["前", "後ろ", "真ん中", "外側"], "correct_index": 0, "explanation": "back(後ろ)の対。in front of ~ = 〜の前に。", "id": "s2_125", "body_ruby": "背《せ》の順《じゅん》で並《なら》ぶと、私《わたし》はクラスで2番目《ばんめ》に小《ちい》さいので、いつも列《れつ》のいちばん<front>の方《ほう》になる。", "choices_ruby": ["前《まえ》", "後《うし》ろ", "｜真ん中《まんなか》", "外側《そとがわ》"], "explanation_ruby": "back(後《うし》ろ)の対《つい》。in front of ~ = 〜の前《まえ》に。", "body_kana": "せのじゅんでならぶと、わたしはクラスで2番目にちいさいので、いつもれつのいちばん<front>のほうになる。"}, {"word": "fruit", "meaning_jp": "果物", "pos": "名", "body": "食後のデザートに、りんご・バナナ・ぶどうを切って盛り合わせた<fruit>の皿が出てきた。", "choices": ["果物", "野菜", "肉", "菓子"], "correct_index": 0, "explanation": "vegetable(野菜)と対で覚える。", "id": "s2_126", "body_ruby": "食後《しょくご》のデザートに、りんご・バナナ・ぶどうを切《き》って盛《も》り合《あ》わせた<fruit>の皿《さら》が出《で》てきた。", "choices_ruby": ["果物《くだもの》", "野菜《やさい》", "肉《にく》", "菓子《かし》"], "explanation_ruby": "vegetable(野菜《やさい》)と対《つい》で覚《おぼ》える。", "body_kana": "しょくごのデザートに、りんご・バナナ・ぶどうをきってもりあわせた<fruit>のさらがでてきた。"}, {"word": "full", "meaning_jp": "いっぱいの", "pos": "形", "body": "食べ放題で調子に乗って5皿も食べたら、お腹が<full>になって、デザートが入らなかった。", "choices": ["いっぱいの", "空っぽの", "半分の", "少しの"], "correct_index": 0, "explanation": "empty(空の)の対。I'm full. = お腹いっぱい。", "id": "s2_127", "body_ruby": "食《た》べ放題《ほうだい》で調子《ちょうし》に乗《の》って5皿《さら》も食《た》べたら、お腹《なか》が<full>になって、デザートが入《い》らなかった。", "choices_ruby": ["いっぱいの", "空《そら》っぽの", "半分《はんぶん》の", "少《すこ》しの"], "explanation_ruby": "empty(空《そら》の)の対《つい》。I'm full. = お腹《なか》いっぱい。", "body_kana": "たべほうだいでちょうしにのって5さらもたべたら、おなかが<full>になって、デザートがいらなかった。"}, {"word": "future", "meaning_jp": "未来、将来", "pos": "名", "body": "<future>の自分へ、と書いたタイムカプセルの手紙を、20歳になったら開ける約束で校庭に埋めた。", "choices": ["未来", "過去", "現在", "昨日"], "correct_index": 0, "explanation": "past(過去)・present(現在)とセットで。in the future = 将来。", "id": "s2_128", "body_ruby": "<future>の自分《じぶん》へ、と書《か》いたタイムカプセルの手紙《てがみ》を、20歳《さい》になったら開《ひら》ける約束《やくそく》で校庭《こうてい》に埋《う》めた。", "choices_ruby": ["未来《みらい》", "過去《かこ》", "現在《げんざい》", "昨日《きのう》"], "explanation_ruby": "past(過去《かこ》)・present(現在《げんざい》)とセットで。in the future = 将来《しょうらい》。", "body_kana": "<future>のじぶんへ、とかいたタイムカプセルのてがみを、20歳になったらひらけるやくそくでこうていにうめた。"}, {"word": "game", "meaning_jp": "試合、ゲーム", "pos": "名", "body": "今日のサッカーの<game>は2対2のまま延長戦までもつれ、最後はPK戦でやっと決着がついた。", "choices": ["試合", "練習", "応援", "会議"], "correct_index": 0, "explanation": "スポーツの試合もテレビゲームも同じ語。", "id": "s2_129", "body_ruby": "今日《きょう》のサッカーの<game>は2対《つい》2のまま延長戦《えんちょうせん》までもつれ、最後《さいご》はPK戦《せん》でやっと決着《けっちゃく》がついた。", "choices_ruby": ["試合《しあい》", "練習《れんしゅう》", "応援《おうえん》", "会議《かいぎ》"], "explanation_ruby": "スポーツの試合《しあい》もテレビゲームも同《おな》じ語《ご》。", "body_kana": "きょうのサッカーの<game>は2つい2のままえんちょうせんまでもつれ、さいごはPKせんでやっとけっちゃくがついた。"}, {"word": "garden", "meaning_jp": "庭", "pos": "名", "body": "祖母の家の<garden>には、バラとひまわりが植えられ、隅には小さな池まで作ってある。", "choices": ["庭", "屋根", "車庫", "玄関"], "correct_index": 0, "explanation": "草花を育てる庭。gardening = 園芸。", "id": "s2_130", "body_ruby": "祖母《そぼ》の家《いえ》の<garden>には、バラとひまわりが植《う》えられ、隅《すみ》には小《ちい》さな池《いけ》まで作《つく》ってある。", "choices_ruby": ["庭《にわ》", "屋根《やね》", "車庫《しゃこ》", "玄関《げんかん》"], "explanation_ruby": "草花《くさばな》を育《そだ》てる庭《にわ》。gardening = 園芸《えんげい》。", "body_kana": "そぼのいえの<garden>には、バラとひまわりがうえられ、すみにはちいさないけまでつくってある。"}, {"word": "gave", "meaning_jp": "与えた", "pos": "動", "body": "誕生日に祖父が私に図書カードを<gave>した。さっそく本屋へ行って、前から読みたかった小説と交換した。", "choices": ["与えた", "返した", "売った", "見せた"], "correct_index": 0, "explanation": "give の過去形。give-gave-given。", "id": "s2_131", "body_ruby": "誕生日《たんじょうび》に祖父《そふ》が私《わたし》に図書《としょ》カードを<gave>した。さっそく本屋《ほんや》へ行《い》って、前《ぜん》から読《よ》みたかった小説《しょうせつ》と交換《こうかん》した。", "choices_ruby": ["与《あた》えた", "返《かえ》した", "売《う》った", "見《み》せた"], "explanation_ruby": "give の過去形《かこけい》。give-gave-given。", "body_kana": "たんじょうびにそふがわたしにとしょカードを<gave>した。さっそくほんやへいって、ぜんからよみたかったしょうせつとこうかんした。"}, {"word": "gift", "meaning_jp": "贈り物", "pos": "名", "body": "母の日の<gift>に、姉と2人でお金を出し合ってエプロンを買い、リボンをかけて手渡した。", "choices": ["贈り物", "手紙", "宿題", "おつり"], "correct_index": 0, "explanation": "present と同じ意味。「才能」の意味もある。", "id": "s2_132", "body_ruby": "母《はは》の日《ひ》の<gift>に、姉《あね》と2人《にん》でお金《かね》を出《だ》し合《あ》ってエプロンを買《か》い、リボンをかけて手渡《てわた》した。", "choices_ruby": ["｜贈り物《おくりもの》", "手紙《てがみ》", "宿題《しゅくだい》", "おつり"], "explanation_ruby": "present と同《おな》じ意味《いみ》。「才能《さいのう》」の意味《いみ》もある。", "body_kana": "ははのひの<gift>に、あねと2人でおかねをだしあってエプロンをかい、リボンをかけててわたした。"}, {"word": "global", "meaning_jp": "地球規模の", "pos": "形", "body": "気温の上昇は1つの国だけでは解決できない、世界中が関わる<global>な問題だと社会科で学んだ。", "choices": ["地球規模の", "個人的な", "一時的な", "地元だけの"], "correct_index": 0, "explanation": "globe(地球儀)+ -al。global warming = 地球温暖化。", "id": "s2_133", "body_ruby": "気温《きおん》の上昇《じょうしょう》は1つの国《くに》だけでは解決《かいけつ》できない、世界中《せかいじゅう》が関《かか》わる<global>な問題《もんだい》だと社会科《しゃかいか》で学《まな》んだ。", "choices_ruby": ["地球規模《ちきゅうきぼ》の", "個人的《こじんてき》な", "一時的《いちじてき》な", "地元《じもと》だけの"], "explanation_ruby": "globe(地球儀《ちきゅうぎ》)+ -al。global warming = 地球温暖化《ちきゅうおんだんか》。", "body_kana": "きおんのじょうしょうは1つのくにだけではかいけつできない、せかいじゅうがかかわる<global>なもんだいだとしゃかいかでまなんだ。"}, {"word": "glove", "meaning_jp": "手袋、グローブ", "pos": "名", "body": "雪が降った朝、毛糸の<glove>をはめて登校したのに、雪玉を作っていたら指先までびしょ濡れになった。", "choices": ["手袋", "帽子", "長靴", "マフラー"], "correct_index": 0, "explanation": "野球のグローブも同じ語。発音は「グラブ」に近い。", "id": "s2_134", "body_ruby": "雪《ゆき》が降《ふ》った朝《あさ》、毛糸《けいと》の<glove>をはめて登校《とうこう》したのに、雪玉《ゆきだま》を作《つく》っていたら指先《ゆびさき》までびしょ濡《ぬ》れになった。", "choices_ruby": ["手袋《てぶくろ》", "帽子《ぼうし》", "長靴《ながぐつ》", "マフラー"], "explanation_ruby": "野球《やきゅう》のグローブも同《おな》じ語《ご》。発音《はつおん》は「グラブ」に近《ちか》い。", "body_kana": "ゆきがふったあさ、けいとの<glove>をはめてとうこうしたのに、ゆきだまをつくっていたらゆびさきまでびしょぬれになった。"}, {"word": "grow", "meaning_jp": "育てる、育つ", "pos": "動", "body": "ベランダのプランターでミニトマトを<grow>している。種から芽が出て、2か月で実が赤くなった。", "choices": ["育てる", "枯らす", "食べる", "買う"], "correct_index": 0, "explanation": "grow-grew-grown。grow up = 成長する。", "id": "s2_135", "body_ruby": "ベランダのプランターでミニトマトを<grow>している。種《たね》から芽《め》が出《で》て、2か月《かげつ》で実《み》が赤《あか》くなった。", "choices_ruby": ["育《そだ》てる", "枯《か》らす", "食《た》べる", "買《か》う"], "explanation_ruby": "grow-grew-grown。grow up = 成長《せいちょう》する。", "body_kana": "ベランダのプランターでミニトマトを<grow>している。たねからめがでて、2かかげつでみがあかくなった。"}, {"word": "hall", "meaning_jp": "ホール、会館", "pos": "名", "body": "合唱コンクールは、市民<hall>の大きな舞台で行われる。客席は800席もあり、響きがまるで違う。", "
