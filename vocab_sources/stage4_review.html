あるの?」とほけんのせんせいがきいてくれて、ようやくなやみをはなせた。"}, {"word": "mayor", "meaning_jp": "市長", "pos": "名", "body": "新しい図書館の開館式で、<mayor>がテープカットをして、「市民の宝にしたい」とあいさつした。", "choices": ["市長", "校長", "社長", "大統領"], "correct_index": 0, "explanation": "市・町のトップ。", "id": "s4_317", "body_ruby": "新《あたら》しい図書館《としょかん》の開館《かいかん》式《しき》で、<mayor>がテープカットをして、「市民《しみん》の宝《たから》にしたい」とあいさつした。", "choices_ruby": ["市長《しちょう》", "校長《こうちょう》", "社長《しゃちょう》", "大統領《だいとうりょう》"], "explanation_ruby": "市《し》・町《まち》のトップ。", "body_kana": "あたらしいとしょかんのかいかんしきで、<mayor>がテープカットをして、「しみんのたからにしたい」とあいさつした。"}, {"word": "meal", "meaning_jp": "食事", "pos": "名", "body": "1日3回の<meal>のうち、わが家で全員がそろうのは夜だけだ。だから夕食の時間は大切にしている。", "choices": ["食事", "おやつ", "飲み物", "薬"], "correct_index": 0, "explanation": "朝食・昼食・夕食のひとまとまり。", "id": "s4_318", "body_ruby": "1日《にち》3回《かい》の<meal>のうち、わが家《いえ》で全員《ぜんいん》がそろうのは夜《よる》だけだ。だから夕食《ゆうしょく》の時間《じかん》は大切《たいせつ》にしている。", "choices_ruby": ["食事《しょくじ》", "おやつ", "｜飲み物《のみもの》", "薬《くすり》"], "explanation_ruby": "朝食《ちょうしょく》・昼食《ちゅうしょく》・夕食《ゆうしょく》のひとまとまり。", "body_kana": "1日3回の<meal>のうち、わがいえでぜんいんがそろうのはよるだけだ。だからゆうしょくのじかんはたいせつにしている。"}, {"word": "meat", "meaning_jp": "肉", "pos": "名", "body": "焼肉では、<meat>を網にのせ、両面に焼き色がついたらタレにくぐらせて頬張る。", "choices": ["肉", "野菜", "魚介", "豆腐"], "correct_index": 0, "explanation": "meet(会う)と同音。食用の肉。", "id": "s4_319", "body_ruby": "焼肉《やきにく》では、<meat>を網《あみ》にのせ、両面《りょうめん》に焼《や》き色《いろ》がついたらタレにくぐらせて頬張《ほおば》る。", "choices_ruby": ["肉《にく》", "野菜《やさい》", "魚介《ぎょかい》", "豆腐《とうふ》"], "explanation_ruby": "meet(会《あ》う)と同音《どうおん》。食用《しょくよう》の肉《にく》。", "body_kana": "やきにくでは、<meat>をあみにのせ、りょうめんにやきいろがついたらタレにくぐらせてほおばる。"}, {"word": "medal", "meaning_jp": "メダル", "pos": "名", "body": "マラソン大会の3位までには<medal>が授与される。首にかけてもらった銅色の円盤は、ずしりと重かった。", "choices": ["メダル", "賞状", "トロフィー", "花束"], "correct_index": 0, "explanation": "gold/silver/bronze medal = 金/銀/銅メダル。", "id": "s4_320", "body_ruby": "マラソン大会《たいかい》の3位《い》までには<medal>が授与《じゅよ》される。首《くび》にかけてもらった銅色《どういろ》の円盤《えんばん》は、ずしりと重《おも》かった。", "choices_ruby": ["メダル", "賞状《しょうじょう》", "トロフィー", "花束《はなたば》"], "explanation_ruby": "gold/silver/bronze medal = 金《きん》/銀《ぎん》/銅《どう》メダル。", "body_kana": "マラソンたいかいの3位までには<medal>がじゅよされる。くびにかけてもらったどういろのえんばんは、ずしりとおもかった。"}, {"word": "melt", "meaning_jp": "溶ける", "pos": "動", "body": "コーンの上のアイスが夏の日差しで<melt>して、急いでなめたが手首まで垂れてきた。", "choices": ["溶ける", "固まる", "膨らむ", "凍る"], "correct_index": 0, "explanation": "熱で固体が液体になること。雪解け = snowmelt。", "id": "s4_321", "body_ruby": "コーンの上《うえ》のアイスが夏《なつ》の日《ひ》差《さ》しで<melt>して、急《いそ》いでなめたが手首《てくび》まで垂《た》れてきた。", "choices_ruby": ["溶《と》ける", "固《かた》まる", "膨《ふく》らむ", "凍《こお》る"], "explanation_ruby": "熱《ねつ》で固体《こたい》が液体《えきたい》になること。雪解《ゆきど》け = snowmelt。", "body_kana": "コーンのうえのアイスがなつのひさしで<melt>して、いそいでなめたがてくびまでたれてきた。"}, {"word": "memory", "meaning_jp": "記憶、思い出", "pos": "名", "body": "修学旅行の<memory>の中でも、消灯後にこっそり語り合った夜のことは、写真には残っていない宝物だ。", "choices": ["思い出", "予定", "持ち物", "費用"], "correct_index": 0, "explanation": "remember(思い出す)と同語源。メモリーカードも。", "id": "s4_322", "body_ruby": "修学旅行《しゅうがくりょこう》の<memory>の中《なか》でも、消灯《しょうとう》後《のち》にこっそり語《かた》り合《あ》った夜《よる》のことは、写真《しゃしん》には残《のこ》っていない宝物《たからもの》だ。", "choices_ruby": ["｜思い出《おもいで》", "予定《よてい》", "｜持ち物《もちもの》", "費用《ひよう》"], "explanation_ruby": "remember(｜思い出《おもいだ》す)と同語《どうご》源《げん》。メモリーカードも。", "body_kana": "しゅうがくりょこうの<memory>のなかでも、しょうとうのちにこっそりかたりあったよるのことは、しゃしんにはのこっていないたからものだ。"}, {"word": "milk", "meaning_jp": "牛乳", "pos": "名", "body": "給食の<milk>は瓶から紙パックに変わったが、白い中身は今日も変わらず200ミリリットルだ。", "choices": ["牛乳", "水", "お茶", "ジュース"], "correct_index": 0, "explanation": "牛などの乳。milk tea = ミルクティー。", "id": "s4_323", "body_ruby": "給食《きゅうしょく》の<milk>は瓶《びん》から紙《かみ》パックに変《か》わったが、白《しろ》い中身《なかみ》は今日《きょう》も変《か》わらず200ミリリットルだ。", "choices_ruby": ["牛乳《ぎゅうにゅう》", "水《みず》", "お茶《ちゃ》", "ジュース"], "explanation_ruby": "牛《うし》などの乳《ちち》。milk tea = ミルクティー。", "body_kana": "きゅうしょくの<milk>はびんからかみパックにかわったが、しろいなかみはきょうもかわらず200ミリリットルだ。"}, {"word": "minister", "meaning_jp": "大臣", "pos": "名", "body": "ニュースで教育担当の<minister>が、新しい奨学金制度について記者の質問に答えていた。", "choices": ["大臣", "判事", "知事", "校長"], "correct_index": 0, "explanation": "Prime Minister = 総理大臣。", "id": "s4_324", "body_ruby": "ニュースで教育《きょういく》担当《たんとう》の<minister>が、新《あたら》しい奨学金《しょうがくきん》制度《せいど》について記者《きしゃ》の質問《しつもん》に答《こた》えていた。", "choices_ruby": ["大臣《だいじん》", "判事《はんじ》", "知事《ちじ》", "校長《こうちょう》"], "explanation_ruby": "Prime Minister = 総理大臣《そうりだいじん》。", "body_kana": "ニュースできょういくたんとうの<minister>が、あたらしいしょうがくきんせいどについてきしゃのしつもんにこたえていた。"}, {"word": "mirror", "meaning_jp": "鏡", "pos": "名", "body": "洗面所の<mirror>に映る自分の寝ぐせがあまりにひどく、水で押さえつけてから家を出た。", "choices": ["鏡", "窓", "写真", "画面"], "correct_index": 0, "explanation": "姿を映すもの。車のバックミラーも。", "id": "s4_325", "body_ruby": "洗面所《せんめんじょ》の<mirror>に映《うつ》る自分《じぶん》の寝《ね》ぐせがあまりにひどく、水《みず》で押《お》さえつけてから家《いえ》を出《で》た。", "choices_ruby": ["鏡《かがみ》", "窓《まど》", "写真《しゃしん》", "画面《がめん》"], "explanation_ruby": "姿《すがた》を映《うつ》すもの。車《くるま》のバックミラーも。", "body_kana": "せんめんじょの<mirror>にうつるじぶんのねぐせがあまりにひどく、みずでおさえつけてからいえをでた。"}, {"word": "missing", "meaning_jp": "行方不明の、欠けている", "pos": "形", "body": "パズルの最後の1ピースが<missing>で、ソファの下まで探したら、犬の寝床から出てきた。", "choices": ["見当たらない", "余っている", "壊れている", "新品の"], "correct_index": 0, "explanation": "miss(見失う)+ -ing。missing person = 行方不明者。", "id": "s4_326", "body_ruby": "パズルの最後《さいご》の1ピースが<missing>で、ソファの下《した》まで探《さが》したら、犬《いぬ》の寝《ね》床《ゆか》から出《で》てきた。", "choices_ruby": ["見当《みあ》たらない", "余《あま》っている", "壊《こわ》れている", "新品《しんぴん》の"], "explanation_ruby": "miss(見失《みうしな》う)+ -ing。missing person = 行方不明者《ゆくえふめいしゃ》。", "body_kana": "パズルのさいごの1ピースが<missing>で、ソファのしたまでさがしたら、いぬのねゆかからでてきた。"}, {"word": "mistook", "meaning_jp": "間違えた", "pos": "動", "body": "夕暮れの道で、電柱の影を人と<mistook>して、思わず会釈をしてしまった。", "choices": ["見間違えた", "見抜いた", "見送った", "見つめた"], "correct_index": 0, "explanation": "mistake の過去形。mistake-mistook-mistaken。", "id": "s4_327", "body_ruby": "夕暮《ゆうぐ》れの道《みち》で、電柱《でんちゅう》の影《かげ》を人《にん》と<mistook>して、思《おも》わず会釈《えしゃく》をしてしまった。", "choices_ruby": ["見間違《みまちが》えた", "見抜《みぬ》いた", "見送《みおく》った", "見《み》つめた"], "explanation_ruby": "mistake の過去形《かこけい》。mistake-mistook-mistaken。", "body_kana": "ゆうぐれのみちで、でんちゅうのかげをにんと<mistook>して、おもわずえしゃくをしてしまった。"}, {"word": "mix", "meaning_jp": "混ぜる", "pos": "動", "body": "ホットケーキの粉に卵と牛乳を<mix>して、だまがなくなるまで泡立て器でかき回した。", "choices": ["混ぜる", "分ける", "冷やす", "計る"], "correct_index": 0, "explanation": "mixture = 混合物。ミックスジュースの mix。", "id": "s4_328", "body_ruby": "ホットケーキの粉《こな》に卵《たまご》と牛乳《ぎゅうにゅう》を<mix>して、だまがなくなるまで｜泡立て器《あわたてき》でかき回《まわ》した。", "choices_ruby": ["混《ま》ぜる", "分《わ》ける", "冷《ひ》やす", "計《はか》る"], "explanation_ruby": "mixture = 混合物《こんごうぶつ》。ミックスジュースの mix。", "body_kana": "ホットケーキのこなにたまごとぎゅうにゅうを<mix>して、だまがなくなるまであわたてきでかきまわした。"}, {"word": "mommy", "meaning_jp": "ママ", "pos": "名", "body": "迷子の男の子が「<mommy>はどこ?」と泣いていたので、係の人と一緒に呼び出しカウンターへ連れて行った。", "choices": ["ママ", "パパ", "おばあちゃん", "先生"], "correct_index": 0, "explanation": "mother の幼児語。mom よりさらに幼い言い方。", "id": "s4_329", "body_ruby": "迷子《まいご》の｜男の子《おとこのこ》が「<mommy>はどこ?」と泣《な》いていたので、係《かかり》の人《にん》と一緒《いっしょ》に｜呼び出《よびだ》しカウンターへ連《つ》れて行《い》った。", "choices_ruby": ["ママ", "パパ", "おばあちゃん", "先生《せんせい》"], "explanation_ruby": "mother の幼児語《ようじご》。mom よりさらに幼《おさな》い｜言い方《いいかた》。", "body_kana": "まいごのおとこのこが「<mommy>はどこ?」とないていたので、かかりのにんといっしょによびだしカウンターへつれていった。"}, {"word": "Mt.", "meaning_jp": "〜山(Mountの略)", "pos": "名", "body": "英語の地図では、富士山は「<Mt.>フジ」と表記される。山の名前の前につける略語だ。", "choices": ["〜山", "〜川", "〜湖", "〜駅"], "correct_index": 0, "explanation": "Mount の略。Mt. Everest = エベレスト山。", "id": "s4_330", "body_ruby": "英語《えいご》の地図《ちず》では、富士山《ふじさん》は「<Mt.>フジ」と表記《ひょうき》される。山《やま》の名前《なまえ》の前《まえ》につける略語《りゃくご》だ。", "choices_ruby": ["〜山《やま》", "〜川《かわ》", "〜湖《みずうみ》", "〜駅《えき》"], "explanation_ruby": "Mount の略《りゃく》。Mt. Everest = エベレスト山《やま》。", "body_kana": "えいごのちずでは、ふじさんは「<Mt.>フジ」とひょうきされる。やまのなまえのまえにつけるりゃくごだ。"}, {"word": "Myanmar", "meaning_jp": "ミャンマー", "pos": "名", "body": "東南アジアの<Myanmar>は、金色に輝く仏塔が並ぶ国で、人々は今も僧侶への施しを大切にしている。", "choices": ["ミャンマー", "ネパール", "モンゴル", "フィリピン"], "correct_index": 0, "explanation": "旧称ビルマ。タイの西隣の国。", "id": "s4_331", "body_ruby": "東南《とうなん》アジアの<Myanmar>は、金色《きんいろ》に輝《かがや》く仏塔《ぶっとう》が並《なら》ぶ国《くに》で、人々《ひとびと》は今《いま》も僧侶《そうりょ》への施《ほどこ》しを大切《たいせつ》にしている。", "choices_ruby": ["ミャンマー", "ネパール", "モンゴル", "フィリピン"], "explanation_ruby": "旧称《きゅうしょう》ビルマ。タイの西隣《にしどなり》の国《くに》。", "body_kana": "とうなんアジアの<Myanmar>は、きんいろにかがやくぶっとうがならぶくにで、ひとびとはいまもそうりょへのほどこしをたいせつにしている。"}, {"word": "mysterious", "meaning_jp": "謎めいた", "pos": "形", "body": "ナスカの地上絵は、誰が何のために描いたのか今も分からない、<mysterious>な遺産だ。", "choices": ["謎めいた", "単純明快な", "新しい", "人工的なだけ"], "correct_index": 0, "explanation": "mystery(謎)+ -ous。", "id": "s4_332", "body_ruby": "ナスカの地上《ちじょう》絵《え》は、誰《だれ》が何《なん》のために描《えが》いたのか今《いま》も分《わ》からない、<mysterious>な遺産《いさん》だ。", "choices_ruby": ["謎《なぞ》めいた", "単純明快《たんじゅんめいかい》な", "新《あたら》しい", "人工的《じんこうてき》なだけ"], "explanation_ruby": "mystery(謎《なぞ》)+ -ous。", "body_kana": "ナスカのちじょうえは、だれがなんのためにえがいたのかいまもわからない、<mysterious>ないさんだ。"}, {"word": "mystery", "meaning_jp": "謎、ミステリー", "pos": "名", "body": "誰が花瓶を割ったのかは、結局<mystery>のままだった。犯人どころか目撃者すら現れなかった。", "choices": ["謎", "事実", "証拠", "結論"], "correct_index": 0, "explanation": "推理小説のジャンル名でもある。", "id": "s4_333", "body_ruby": "誰《だれ》が花《はな》瓶《びん》を割《さ》ったのかは、結局《けっきょく》<mystery>のままだった。犯人《はんにん》どころか目撃者《もくげきしゃ》すら現《あらわ》れなかった。", "choices_ruby": ["謎《なぞ》", "事実《じじつ》", "証拠《しょうこ》", "結論《けつろん》"], "explanation_ruby": "推理小説《すいりしょうせつ》のジャンル名《めい》でもある。", "body_kana": "だれがはなびんをさったのかは、けっきょく<mystery>のままだった。はんにんどころかもくげきしゃすらあらわれなかった。"}, {"word": "natural", "meaning_jp": "自然の", "pos": "形", "body": "この温泉は加熱も加水もしていない<natural>のお湯で、源泉から湧いたまま浴槽に注がれている。", "choices": ["天然の", "人工の", "輸入の", "再生の"], "correct_index": 0, "explanation": "nature(自然)+ -al。artificial(人工の)の対。", "id": "s4_334", "body_ruby": "この温泉《おんせん》は加熱《かねつ》も加水《かすい》もしていない<natural>のお湯《ゆ》で、源泉《げんせん》から湧《わ》いたまま浴槽《よくそう》に注《そそ》がれている。", "choices_ruby": ["天然《てんねん》の", "人工《じんこう》の", "輸入《ゆにゅう》の", "再生《さいせい》の"], "explanation_ruby": "nature(自然《しぜん》)+ -al。artificial(人工《じんこう》の)の対《つい》。", "body_kana": "このおんせんはかねつもかすいもしていない<natural>のおゆで、げんせんからわいたままよくそうにそそがれている。"}, {"word": "naughty", "meaning_jp": "いたずらな", "pos": "形", "body": "<naughty>な子猫は、トイレットペーパーを廊下の端まで転がして、得意げに座っていた。", "choices": ["いたずらな", "おとなしい", "臆病な", "眠たげな"], "correct_index": 0, "explanation": "子どもや動物のわんぱくぶりに使う。", "id": "s4_335", "body_ruby": "<naughty>な子猫《こねこ》は、トイレットペーパーを廊下《ろうか》の端《はじ》まで転《ころ》がして、得意《とくい》げに座《すわ》っていた。", "choices_ruby": ["いたずらな", "おとなしい", "臆病《おくびょう》な", "眠《ねむ》たげな"], "explanation_ruby": "子《こ》どもや動物《どうぶつ》のわんぱくぶりに使《つか》う。", "body_kana": "<naughty>なこねこは、トイレットペーパーをろうかのはじまでころがして、とくいげにすわっていた。"}, {"word": "neighbor", "meaning_jp": "隣人", "pos": "名", "body": "隣に越してきた<neighbor>が、あいさつにと手作りのクッキーを持って来てくれた。", "choices": ["隣人", "親戚", "同僚", "店員"], "correct_index": 0, "explanation": "neighborhood = 近所。イギリス式は neighbour。", "id": "s4_336", "body_ruby": "隣《となり》に越《こ》してきた<neighbor>が、あいさつにと手作《てづく》りのクッキーを持《も》って来《き》てくれた。", "choices_ruby": ["隣人《りんじん》", "親戚《しんせき》", "同僚《どうりょう》", "店員《てんいん》"], "explanation_ruby": "neighborhood = 近所《きんじょ》。イギリス式《しき》は neighbour。", "body_kana": "となりにこしてきた<neighbor>が、あいさつにとてづくりのクッキーをもってきてくれた。"}, {"word": "neither", "meaning_jp": "どちらも〜ない", "pos": "代/副", "body": "双子の兄弟に聞いたが、<neither>もいたずらの犯人ではなかった。真犯人は飼い猫だった。", "choices": ["どちらも〜ない", "両方とも〜だ", "どちらか一方", "全員"], "correct_index": 0, "explanation": "2つのどちらも否定。Me neither. = 私も(〜ない)。", "id": "s4_337", "body_ruby": "双子《ふたご》の兄弟《きょうだい》に聞《き》いたが、<neither>もいたずらの犯人《はんにん》ではなかった。真犯人《しんはんにん》は飼《か》い猫《ねこ》だった。", "choices_ruby": ["どちらも〜ない", "両方《りょうほう》とも〜だ", "どちらか一方《いっぽう》", "全員《ぜんいん》"], "explanation_ruby": "2つのどちらも否定《ひてい》。Me neither. = 私《わたし》も(〜ない)。", "body_kana": "ふたごのきょうだいにきいたが、<neither>もいたずらのはんにんではなかった。しんはんにんはかいねこだった。"}, {"word": "nest", "meaning_jp": "巣", "pos": "名", "body": "玄関の軒下にツバメが<nest>を作り、泥と枯れ草の器の中で、ヒナが3羽口を開けている。", "choices": ["巣", "餌", "羽", "卵の殻だけ"], "correct_index": 0, "explanation": "鳥や虫のすみか。", "id": "s4_338", "body_ruby": "玄関《げんかん》の軒下《のきした》にツバメが<nest>を作《つく》り、泥《どろ》と｜枯れ草《かれくさ》の器《うつわ》の中《なか》で、ヒナが3羽《わ》口《くち》を開《ひら》けている。", "choices_ruby": ["巣《す》", "餌《えさ》", "羽《はね》", "卵《たまご》の殻《から》だけ"], "explanation_ruby": "鳥《とり》や虫《むし》のすみか。", "body_kana": "げんかんののきしたにツバメが<nest>をつくり、どろとかれくさのうつわのなかで、ヒナが3羽くちをひらけている。"}, {"word": "newspaper", "meaning_jp": "新聞", "pos": "名", "body": "祖父は毎朝、<newspaper>を1面から順に読み、気になる記事をはさみで切り抜いてノートに貼る。", "choices": ["新聞", "雑誌", "手紙", "辞書"], "correct_index": 0, "explanation": "news(ニュース)+ paper(紙)。", "id": "s4_339", "body_ruby": "祖父《そふ》は毎朝《まいあさ》、<newspaper>を1面《めん》から順《じゅん》に読《よ》み、気《き》になる記事《きじ》をはさみで｜切り抜《きりぬ》いてノートに貼《は》る。", "choices_ruby": ["新聞《しんぶん》", "雑誌《ざっし》", "手紙《てがみ》", "辞書《じしょ》"], "explanation_ruby": "news(ニュース)+ paper(紙《かみ》)。", "body_kana": "そふはまいあさ、<newspaper>を1めんからじゅんによみ、きになるきじをはさみできりぬいてノートにはる。"}, {"word": "nineteenth", "meaning_jp": "19番目の", "pos": "形", "body": "<nineteenth>世紀、つまり1800年代に、写真や電話など現代につながる発明が次々と生まれた。", "choices": ["19番目の", "9番目の", "90番目の", "19個の"], "correct_index": 0, "explanation": "nineteen(19)+ -th。the 19th century = 19世紀。", "id": "s4_340", "body_ruby": "<nineteenth>世紀《せいき》、つまり1800年《ねん》代《だい》に、写真《しゃしん》や電話《でんわ》など現代《げんだい》につながる発明《はつめい》が次々《つぎつぎ》と生《う》まれた。", "choices_ruby": ["19番目《ばんめ》の", "9番目《ばんめ》の", "90番目《ばんめ》の", "19個《こ》の"], "explanation_ruby": "nineteen(19)+ -th。the 19th century = 19世紀《せいき》。", "body_kana": "<nineteenth>せいき、つまり1800年だいに、しゃしんやでんわなどげんだいにつながるはつめいがつぎつぎとうまれた。"}, {"word": "No.", "meaning_jp": "番号(numberの略)", "pos": "名", "body": "彼の背番号は<No.>10。エースナンバーを背負って、チームの攻撃を組み立てる。", "choices": ["番号", "名前", "日付", "値段"], "correct_index": 0, "explanation": "number の略。ラテン語 numero から。", "id": "s4_341", "body_ruby": "彼《かれ》の背番号《せばんごう》は<No.>10。エースナンバーを背負《せお》って、チームの攻撃《こうげき》を｜組み立《くみた》てる。", "choices_ruby": ["番号《ばんごう》", "名前《なまえ》", "日付《ひづけ》", "値段《ねだん》"], "explanation_ruby": "number の略《りゃく》。ラテン語《ご》 numero から。", "body_kana": "かれのせばんごうは<No.>10。エースナンバーをせおって、チームのこうげきをくみたてる。"}, {"word": "nod", "meaning_jp": "うなずく", "pos": "動", "body": "「分かった?」という先生の問いに、クラス全員が黙って<nod>した。声はなくても返事は伝わった。", "choices": ["うなずく", "首を横に振る", "手を挙げる", "立ち上がる"], "correct_index": 0, "explanation": "首を縦に振って同意を示すこと。", "id": "s4_342", "body_ruby": "「分《わ》かった?」という先生《せんせい》の問《と》いに、クラス全員《ぜんいん》が黙《だま》って<nod>した。声《こえ》はなくても返事《へんじ》は伝《つた》わった。", "choices_ruby": ["うなずく", "首《くび》を横《よこ》に振《ふ》る", "手《て》を挙《あ》げる", "｜立ち上《たちあ》がる"], "explanation_ruby": "首《くび》を縦《たて》に振《ふ》って同意《どうい》を示《しめ》すこと。", "body_kana": "「わかった?」というせんせいのといに、クラスぜんいんがだまって<nod>した。こえはなくてもへんじはつたわった。"}, {"word": "non-native", "meaning_jp": "母語話者でない", "pos": "形", "body": "英語を話す人の多くは、実は<non-native>のスピーカーだ。母語でない人どうしが英語で通じ合っている。", "choices": ["母語話者でない", "母語話者の", "無口な", "幼い"], "correct_index": 0, "explanation": "non-(〜でない)+ native。", "id": "s4_343", "body_ruby": "英語《えいご》を話《はな》す人《にん》の多《おお》くは、実《じつ》は<non-native>のスピーカーだ。母語《ぼご》でない人《にん》どうしが英語《えいご》で通《つう》じ合《あ》っている。", "choices_ruby": ["母語話者《ぼごわしゃ》でない", "母語話者《ぼごわしゃ》の", "無口《むくち》な", "幼《おさな》い"], "explanation_ruby": "non-(〜でない)+ native。", "body_kana": "えいごをはなすにんのおおくは、じつは<non-native>のスピーカーだ。ぼごでないにんどうしがえいごでつうじあっている。"}, {"word": "non-white", "meaning_jp": "白人でない", "pos": "形", "body": "かつてのアメリカには、<non-white>の人々がバスの席やレストランで差別される時代があった。", "choices": ["白人でない", "白人の", "若くない", "市民でない"], "correct_index": 0, "explanation": "non- + white。公民権運動の歴史で学ぶ語。", "id": "s4_344", "body_ruby": "かつてのアメリカには、<non-white>の人々《ひとびと》がバスの席《せき》やレストランで差別《さべつ》される時代《じだい》があった。", "choices_ruby": ["白人《はくじん》でない", "白人《はくじん》の", "若《わか》くない", "市民《しみん》でない"], "explanation_ruby": "non- + white。公民権運動《こうみんけんうんどう》の歴史《れきし》で学《まな》ぶ語《ご》。", "body_kana": "かつてのアメリカには、<non-white>のひとびとがバスのせきやレストランでさべつされるじだいがあった。"}, {"word": "north", "meaning_jp": "北", "pos": "名", "body": "方位磁針の赤い針は、いつも<north>を指す。地図を合わせれば、進むべき方角が分かる。", "choices": ["北", "南", "東", "西"], "correct_index": 0, "explanation": "south(南)の対。North Pole = 北極。", "id": "s4_345", "body_ruby": "方位《ほうい》磁針《じしん》の赤《あか》い針《はり》は、いつも<north>を指《さ》す。地図《ちず》を合《あ》わせれば、進《すす》むべき方角《ほうがく》が分《わ》かる。", "choices_ruby": ["北《きた》", "南《みなみ》", "東《ひがし》", "西《にし》"], "explanation_ruby": "south(南《みなみ》)の対《つい》。North Pole = 北極《ほっきょく》。", "body_kana": "ほういじしんのあかいはりは、いつも<north>をさす。ちずをあわせれば、すすむべきほうがくがわかる。"}, {"word": "northern", "meaning_jp": "北の、北部の", "pos": "形", "body": "日本の<northern>の地域、特に北海道では、梅雨がほとんどなく、夏もからりと涼しい。", "choices": ["北部の", "南部の", "東部の", "中央の"], "correct_index": 0, "explanation": "north + -ern。northern lights = オーロラ。", "id": "s4_346", "body_ruby": "日本《にっぽん》の<northern>の地域《ちいき》、特《とく》に北海道《ほっかいどう》では、梅雨《つゆ》がほとんどなく、夏《なつ》もからりと涼《すず》しい。", "choices_ruby": ["北部《ほくぶ》の", "南部《なんぶ》の", "東部《とうぶ》の", "中央《ちゅうおう》の"], "explanation_ruby": "north + -ern。northern lights = オーロラ。", "body_kana": "にっぽんの<northern>のちいき、とくにほっかいどうでは、つゆがほとんどなく、なつもからりとすずしい。"}, {"word": "notice", "meaning_jp": "気づく", "pos": "動", "body": "髪を10センチ切ったのに、父は3日間まったく<notice>しなかった。母は玄関で即座に当てた。", "choices": ["気づく", "忘れる", "ほめる", "笑う"], "correct_index": 0, "explanation": "名詞では「掲示・通知」。", "id": "s4_347", "body_ruby": "髪《かみ》を10センチ切《き》ったのに、父《ちち》は3日間《にちかん》まったく<notice>しなかった。母《はは》は玄関《げんかん》で即座《そくざ》に当《あ》てた。", "choices_ruby": ["気《き》づく", "忘《わす》れる", "ほめる", "笑《わら》う"], "explanation_ruby": "名詞《めいし》では「掲示《けいじ》・通知《つうち》」。", "body_kana": "かみを10センチきったのに、ちちは3日間まったく<notice>しなかった。はははげんかんでそくざにあてた。"}, {"word": "nun", "meaning_jp": "修道女", "pos": "名", "body": "映画に出てきた<nun>は、黒い修道服に身を包み、教会で孤児たちの世話をしていた。", "choices": ["修道女", "看護師", "教師", "女王"], "correct_index": 0, "explanation": "神に仕える女性。男性は monk(修道士)。", "id": "s4_348", "body_ruby": "映画《えいが》に出《で》てきた<nun>は、黒《くろ》い修道《しゅうどう》服《ふく》に身《み》を包《つつ》み、教会《きょうかい》で孤児《こじ》たちの世話《せわ》をしていた。", "choices_ruby": ["修道女《しゅうどうじょ》", "看護《かんご》師《し》", "教師《きょうし》", "女王《じょおう》"], "explanation_ruby": "神《かみ》に仕《つか》える女性《じょせい》。男性《だんせい》は monk(修道士《しゅうどうし》)。", "body_kana": "えいがにでてきた<nun>は、くろいしゅうどうふくにみをつつみ、きょうかいでこじたちのせわをしていた。"}, {"word": "nursery", "meaning_jp": "保育園、苗床", "pos": "名", "body": "母は弟を駅前の<nursery>に預けてから出勤する。お迎えは夕方6時、連絡帳に1日の様子が書かれている。", "choices": ["保育園", "小学校", "病院", "塾"], "correct_index": 0, "explanation": "nursery school = 保育園。nurse と同語源。", "id": "s4_349", "body_ruby": "母《はは》は弟《おとうと》を駅前《えきまえ》の<nursery>に預《あず》けてから出勤《しゅっきん》する。お迎《むか》えは夕方《ゆうがた》6時《じ》、連絡帳《れんらくちょう》に1日《にち》の様子《ようす》が書《か》かれている。", "choices_ruby": ["保育園《ほいくえん》", "小学校《しょうがっこう》", "病院《びょういん》", "塾《じゅく》"], "explanation_ruby": "nursery school = 保育園《ほいくえん》。nurse と同語《どうご》源《げん》。", "body_kana": "はははおとうとをえきまえの<nursery>にあずけてからしゅっきんする。おむかえはゆうがた6時、れんらくちょうに1日のようすがかかれている。"}, {"word": "ocean", "meaning_jp": "大洋、海", "pos": "名", "body": "太平洋は世界最大の<ocean>で、地球の表面の3分の1を占める。日本はその西の端に浮かぶ。", "choices": ["大洋", "湖", "川", "湾"], "correct_index": 0, "explanation": "sea より大きな海。the Pacific Ocean = 太平洋。", "id": "s4_350", "body_ruby": "太平洋《たいへいよう》は世界最大《せかいさいだい》の<ocean>で、地球《ちきゅう》の表面《ひょうめん》の3分《ふん》の1を占《し》める。日本《にっぽん》はその西《にし》の端《はじ》に浮《う》かぶ。", "choices_ruby": ["大洋《たいよう》", "湖《みずうみ》", "川《かわ》", "湾《わん》"], "explanation_ruby": "sea より大《おお》きな海《うみ》。the Pacific Ocean = 太平洋《たいへいよう》。", "body_kana": "たいへいようはせかいさいだいの<ocean>で、ちきゅうのひょうめんの3分の1をしめる。にっぽんはそのにしのはじにうかぶ。"}, {"word": "octopus", "meaning_jp": "タコ", "pos": "名", "body": "水槽の<octopus>は8本の足を器用に使い、ふた付きの瓶を開けて中のエサを取り出した。", "choices": ["タコ", "イカ", "クラゲ", "ヒトデ"], "correct_index": 0, "explanation": "octo(8)+ pus(足)。たこ焼きの具。", "id": "s4_351", "body_ruby": "水槽《すいそう》の<octopus>は8本《ほん》の足《あし》を器用《きよう》に使《つか》い、ふた付《つ》きの瓶《びん》を開《ひら》けて中《なか》のエサを｜取り出《とりだ》した。", "choices_ruby": ["タコ", "イカ", "クラゲ", "ヒトデ"], "explanation_ruby": "octo(8)+ pus(足《あし》)。たこ焼《や》きの具《ぐ》。", "body_kana": "すいそうの<octopus>は8本のあしをきようにつかい、ふたつきのびんをひらけてなかのエサをとりだした。"}, {"word": "official", "meaning_jp": "公式の", "pos": "形", "body": "うわさは色々流れたが、学校からの<official>な発表では、体育祭は予定どおり開催とのことだった。", "choices": ["公式の", "非公式の", "個人的な", "秘密の"], "correct_index": 0, "explanation": "office(役所)+ -ial。official website = 公式サイト。", "id": "s4_352", "body_ruby": "うわさは色々《いろいろ》流《なが》れたが、学校《がっこう》からの<official>な発表《はっぴょう》では、体育祭《たいいくさい》は予定《よてい》どおり開催《かいさい》とのことだった。", "choices_ruby": ["公式《こうしき》の", "非公式《ひこうしき》の", "個人的《こじんてき》な", "秘密《ひみつ》の"], "explanation_ruby": "office(役所《やくしょ》)+ -ial。official website = 公式《こうしき》サイト。", "body_kana": "うわさはいろいろながれたが、がっこうからの<official>なはっぴょうでは、たいいくさいはよていどおりかいさいとのことだった。"}, {"word": "opposite", "meaning_jp": "反対の", "pos": "形", "body": "「右」と言われたのに<opposite>の左へ曲がってしまい、集合場所からどんどん遠ざかっていた。", "choices": ["反対の", "同じ", "隣の", "斜めの"], "correct_index": 0, "explanation": "the opposite side = 反対側。", "id": "s4_353", "body_ruby": "「右《みぎ》」と言《い》われたのに<opposite>の左《ひだり》へ曲《ま》がってしまい、集合場所《しゅうごうばしょ》からどんどん遠《とお》ざかっていた。", "choices_ruby": ["反対《はんたい》の", "同《おな》じ", "隣《となり》の", "斜《なな》めの"], "explanation_ruby": "the opposite side = 反対側《はんたいがわ》。", "body_kana": "「みぎ」といわれたのに<opposite>のひだりへまがってしまい、しゅうごうばしょからどんどんとおざかっていた。"}, {"word": "orchestra", "meaning_jp": "オーケストラ", "pos": "名", "body": "80人の<orchestra>が一斉に音を出した瞬間、ホール全体が震えるようだった。指揮棒一本で音が止む。", "choices": ["オーケストラ", "合唱団", "応援団", "劇団"], "correct_index": 0, "explanation": "管弦楽団。バイオリンや管楽器の大編成。", "id": "s4_354", "body_ruby": "80人《にん》の<orchestra>が一斉《いっせい》に音《おと》を出《だ》した瞬間《しゅんかん》、ホール全体《ぜんたい》が震《ふる》えるようだった。指揮棒《しきぼう》一本《いっぽん》で音《おと》が止《と》む。", "choices_ruby": ["オーケストラ", "合唱団《がっしょうだん》", "応援団《おうえんだん》", "劇団《げきだん》"], "explanation_ruby": "管弦楽団《かんげんがくだん》。バイオリンや管楽器《かんがっき》の大編成《だいへんせい》。", "body_kana": "80人の<orchestra>がいっせいにおとをだしたしゅんかん、ホールぜんたいがふるえるようだった。しきぼういっぽんでおとがとむ。"}, {"word": "ordinary", "meaning_jp": "普通の", "pos": "形", "body": "その日は宿題をして夕飯を食べるだけの<ordinary>な一日のはずだった。流れ星を見るまでは。", "choices": ["普通の", "特別な", "最悪の", "記念すべき"], "correct_index": 0, "explanation": "special(特別な)の対。ordinary day = 平凡な日。", "id": "s4_355", "body_ruby": "その日《ひ》は宿題《しゅくだい》をして夕飯《ゆうはん》を食《た》べるだけの<ordinary>な一日《ついたち》のはずだった。｜流れ星《ながれぼし》を見《み》るまでは。", "choices_ruby": ["普通《ふつう》の", "特別《とくべつ》な", "最悪《さいあく》の", "記念《きねん》すべき"], "explanation_ruby": "special(特別《とくべつ》な)の対《つい》。ordinary day = 平凡《へいぼん》な日《ひ》。", "body_kana": "そのひはしゅくだいをしてゆうはんをたべるだけの<ordinary>なついたちのはずだった。ながれぼしをみるまでは。"}, {"word": "origin", "meaning_jp": "起源", "pos": "名", "body": "カレーライスの<origin>はインドだが、日本へはイギリス経由で伝わり、独自の進化を遂げた。", "choices": ["起源", "値段", "栄養", "辛さ"], "correct_index": 0, "explanation": "original(元の)の名詞形。始まり・由来。", "id": "s4_356", "body_ruby": "カレーライスの<origin>はインドだが、日本《にっぽん》へはイギリス経由《けいゆ》で伝《つた》わり、独自《どくじ》の進化《しんか》を遂《と》げた。", "choices_ruby": ["起源《きげん》", "値段《ねだん》", "栄養《えいよう》", "辛《つら》さ"], "explanation_ruby": "original(元《もと》の)の名詞《めいし》形《かたち》。始《はじ》まり・由来《ゆらい》。", "body_kana": "カレーライスの<origin>はインドだが、にっぽんへはイギリスけいゆでつたわり、どくじのしんかをとげた。"}, {"word": "original", "meaning_jp": "元の、独自の", "pos": "形", "body": "映画も良かったが、<original>の小説では主人公の心の声が細かく描かれ、結末の意味も少し違う。", "choices": ["原作の", "翻訳の", "続編の", "海賊版の"], "correct_index": 0, "explanation": "コピーや翻案の元になったもの。", "id": "s4_357", "body_ruby": "映画《えいが》も良《よ》かったが、<original>の小説《しょうせつ》では主人公《しゅじんこう》の心《こころ》の声《こえ》が細《こま》かく描《えが》かれ、結末《けつまつ》の意味《いみ》も少《すこ》し違《ちが》う。", "choices_ruby": ["原作《げんさく》の", "翻訳《ほんやく》の", "続編《ぞくへん》の", "海賊版《かいぞくばん》の"], "explanation_ruby": "コピーや翻案《ほんあん》の元《もと》になったもの。", "body_kana": "えいがもよかったが、<original>のしょうせつではしゅじんこうのこころのこえがこまかくえがかれ、けつまつのいみもすこしちがう。"}, {"word": "originally", "meaning_jp": "もともと", "pos": "副", "body": "この体育館は<originally>は倉庫だった建物で、改装の名残として壁に大きな搬入口が残っている。", "choices": ["もともと", "最終的に", "一時的に", "偶然に"], "correct_index": 0, "explanation": "original + -ly。元はと言えば。", "id": "s4_358", "body_ruby": "この体育館《たいいくかん》は<originally>は倉庫《そうこ》だった建物《たてもの》で、改装《かいそう》の名残《なごり》として壁《かべ》に大《おお》きな搬入《はんにゅう》口《くち》が残《のこ》っている。", "choices_ruby": ["もともと", "最終的《さいしゅうてき》に", "一時的《いちじてき》に", "偶然《ぐうぜん》に"], "explanation_ruby": "original + -ly。元《もと》はと言《い》えば。", "body_kana": "このたいいくかんは<originally>はそうこだったたてもので、かいそうのなごりとしてかべにおおきなはんにゅうくちがのこっている。"}, {"word": "oxygen", "meaning_jp": "酸素", "pos": "名", "body": "標高8000メートルでは空気中の<oxygen>が平地の3分の1しかなく、多くの登山家がボンベを背負う。", "choices": ["酸素", "水素", "窒素", "二酸化炭素"], "correct_index": 0, "explanation": "元素記号 O。呼吸に不可欠な気体。", "id": "s4_359", "body_ruby": "標高《ひょうこう》8000メートルでは空《そら》気《き》中《なか》の<oxygen>が平地《へいち》の3分《ふん》の1しかなく、多《おお》くの登山《とざん》家《いえ》がボンベを背負《せお》う。", "choices_ruby": ["酸素《さんそ》", "水素《すいそ》", "窒素《ちっそ》", "二酸化炭素《にさんかたんそ》"], "explanation_ruby": "元素《げんそ》記号《きごう》 O。呼吸《こきゅう》に不可欠《ふかけつ》な気体《きたい》。", "body_kana": "ひょうこう8000メートルではそらきなかの<oxygen>がへいちの3分の1しかなく、おおくのとざんいえがボンベをせおう。"}, {"word": "pack", "meaning_jp": "荷造りする", "pos": "動", "body": "旅行の前夜、スーツケースに3日分の着替えを<pack>した。お土産用の隙間も空けておいた。", "choices": ["荷造りする", "荷ほどきする", "捨てる", "洗濯する"], "correct_index": 0, "explanation": "unpack = 荷物を取り出す。backpack = リュック。", "id": "s4_360", "body_ruby": "旅行《りょこう》の前夜《ぜんや》、スーツケースに3日《にち》分《ふん》の着替《きが》えを<pack>した。お土産《みやげ》用《よう》の隙間《すきま》も空《あ》けておいた。", "choices_ruby": ["荷造《にづく》りする", "荷《か》ほどきする", "捨《す》てる", "洗濯《せんたく》する"], "explanation_ruby": "unpack = 荷物《にもつ》を｜取り出《とりだ》す。backpack = リュック。", "body_kana": "りょこうのぜんや、スーツケースに3日ふんのきがえを<pack>した。おみやげようのすきまもあけておいた。"}, {"word": "package", "meaning_jp": "小包、パッケージ", "pos": "名", "body": "海外の友人から<package>が届いた。箱を開けると、緩衝材の中からお菓子と手紙が出てきた。", "choices": ["小包", "はがき", "電報", "請求書"], "correct_index": 0, "explanation": "pack + -age。包まれた荷物。", "id": "s4_361", "body_ruby": "海外《かいがい》の友人《ゆうじん》から<package>が届《とど》いた。箱《はこ》を開《ひら》けると、緩衝材《かんしょうざい》の中《なか》からお菓子《かし》と手紙《てがみ》が出《で》てきた。", "choices_ruby": ["小包《こづつみ》", "はがき", "電報《でんぽう》", "請求書《せいきゅうしょ》"], "explanation_ruby": "pack + -age。包《つつ》まれた荷物《にもつ》。", "body_kana": "かいがいのゆうじんから<package>がとどいた。はこをひらけると、かんしょうざいのなかからおかしとてがみがでてきた。"}, {"word": "page", "meaning_jp": "ページ", "pos": "名", "body": "「教科書の42<page>を開いてください」と先生が言うと、教室に一斉に紙をめくる音が響いた。", "choices": ["ページ", "行", "章", "巻"], "correct_index": 0, "explanation": "本の1枚の面。turn the page = ページをめくる。", "id": "s4_362", "body_ruby": "「教科書《きょうかしょ》の42<page>を開《ひら》いてください」と先生《せんせい》が言《い》うと、教室《きょうしつ》に一斉《いっせい》に紙《かみ》をめくる音《おと》が響《ひび》いた。", "choices_ruby": ["ページ", "行《ぎょう》", "章《しょう》", "巻《かん》"], "explanation_ruby": "本《ほん》の1枚《まい》の面《めん》。turn the page = ページをめくる。", "body_kana": "「きょうかしょの42<page>をひらいてください」とせんせいがいうと、きょうしつにいっせいにかみをめくるおとがひびいた。"}, {"word": "pain", "meaning_jp": "痛み", "pos": "名", "body": "虫歯を放置していたら、夜中にずきずきと<pain>が走り、眠れないまま朝の歯医者に駆け込んだ。", "choices": ["痛み", "かゆみ", "しびれだけ", "眠気"], "correct_index": 0, "explanation": "painful = 痛い。体の痛みにも心の痛みにも。", "id": "s4_363", "body_ruby": "虫歯《むしば》を放置《ほうち》していたら、夜中《よなか》にずきずきと<pain>が走《はし》り、眠《ねむ》れないまま朝《あさ》の歯医者《はいしゃ》に駆《か》け込《こ》んだ。", "choices_ruby": ["痛《いた》み", "かゆみ", "しびれだけ", "眠気《ねむけ》"], "explanation_ruby": "painful = 痛《いた》い。体《からだ》の痛《いた》みにも心《こころ》の痛《いた》みにも。", "body_kana": "むしばをほうちしていたら、よなかにずきずきと<pain>がはしり、ねむれないままあさのはいしゃにかけこんだ。"}, {"word": "painter", "meaning_jp": "画家", "pos": "名", "body": "ゴッホは生前ほとんど絵が売れなかった<painter>だが、今では1枚に100億円の値がつく。", "choices": ["画家", "彫刻家", "作曲家", "詩人"], "correct_index": 0, "explanation": "paint(描く)+ -er。", "id": "s4_364", "body_ruby": "ゴッホは生前《せいぜん》ほとんど絵《え》が売《う》れなかった<painter>だが、今《いま》では1枚《まい》に100億円《おくえん》の値《あたい》がつく。", "choices_ruby": ["画家《がか》", "彫刻家《ちょうこくか》", "作曲家《さっきょくか》", "詩人《しじん》"], "explanation_ruby": "paint(描《えが》く)+ -er。", "body_kana": "ゴッホはせいぜんほとんどえがうれなかった<painter>だが、いまでは1枚に100おくえんのあたいがつく。"}, {"word": "painting", "meaning_jp": "絵画", "pos": "名", "body": "美術館のその<painting>の前だけ人だかりができていた。ガラス越しでも、ひまわりの黄色は鮮烈だった。", "choices": ["絵画", "彫刻", "写真", "書道"], "correct_index": 0, "explanation": "paint + -ing。oil painting = 油絵。", "id": "s4_365", "body_ruby": "美術館《びじゅつかん》のその<painting>の前《まえ》だけ人《にん》だかりができていた。ガラス越《こ》しでも、ひまわりの黄色《きいろ》は鮮烈《せんれつ》だった。", "choices_ruby": ["絵画《かいが》", "彫刻《ちょうこく》", "写真《しゃしん》", "書道《しょどう》"], "explanation_ruby": "paint + -ing。oil painting = 油絵《あぶらえ》。", "body_kana": "びじゅつかんのその<painting>のまえだけにんだかりができていた。ガラスこしでも、ひまわりのきいろはせんれつだった。"}, {"word": "pair", "meaning_jp": "一組、ペア", "pos": "名", "body": "新しい靴下を3<pair>買った。左右で1組と数えるので、全部で6枚になる。", "choices": ["一組", "一枚", "一箱", "一束"], "correct_index": 0, "explanation": "a pair of shoes = 靴1足。2つで1組のもの。", "id": "s4_366", "body_ruby": "新《あたら》しい靴下《くつした》を3<pair>買《か》った。左右《さゆう》で1組《くみ》と数《かぞ》えるので、全部《ぜんぶ》で6枚《まい》になる。", "choices_ruby": ["一組《ひとくみ》", "一枚《いちまい》", "一箱《ひとはこ》", "一束《ひとたば》"], "explanation_ruby": "a pair of shoes = 靴《くつ》1足《あし》。2つで1組《く》のもの。", "body_kana": "あたらしいくつしたを3<pair>かった。さゆうで1くみとかぞえるので、ぜんぶで6枚になる。"}, {"word": "palace", "meaning_jp": "宮殿", "pos": "名", "body": "ベルサイユの<palace>には、鏡張りの大広間や黄金の門があり、かつて王と王妃が暮らしていた。", "choices": ["宮殿", "教会", "城壁", "劇場"], "correct_index": 0, "explanation": "王族の住まい。Imperial Palace = 皇居。", "id": "s4_367", "body_ruby": "ベルサイユの<palace>には、鏡《かがみ》張《は》りの大広間《おおひろま》や黄金《おうごん》の門《もん》があり、かつて王《おう》と王妃《おうひ》が暮《く》らしていた。", "choices_ruby": ["宮殿《きゅうでん》", "教会《きょうかい》", "城壁《じょうへき》", "劇場《げきじょう》"], "explanation_ruby": "王族《おうぞく》の住《す》まい。Imperial Palace = 皇居《こうきょ》。", "body_kana": "ベルサイユの<palace>には、かがみはりのおおひろまやおうごんのもんがあり、かつておうとおうひがくらしていた。"}, {"word": "pale", "meaning_jp": "青ざめた、淡い", "pos": "形", "body": "船酔いした友人は、顔が<pale>になり、額に汗を浮かべてベンチにうずくまっていた。", "choices": ["青ざめた", "日焼けした", "紅潮した", "つやつやの"], "correct_index": 0, "explanation": "血の気が引いた顔色。pale blue = 淡い青。", "id": "s4_368", "body_ruby": "船酔《ふなよ》いした友人《ゆうじん》は、顔《かお》が<pale>になり、額《ひたい》に汗《あせ》を浮《う》かべてベンチにうずくまっていた。", "choices_ruby": ["青《あお》ざめた", "日焼《ひや》けした", "紅潮《こうちょう》した", "つやつやの"], "explanation_ruby": "｜血の気《ちのけ》が引《ひ》いた顔色《かおいろ》。pale blue = 淡《あわ》い青《あお》。", "body_kana": "ふなよいしたゆうじんは、かおが<pale>になり、ひたいにあせをうかべてベンチにうずくまっていた。"}, {"word": "palm", "meaning_jp": "手のひら、ヤシ", "pos": "名", "body": "カブトムシを<palm>にのせると、6本の足がくすぐったく、思ったよりずっしりと重かった。", "choices": ["手のひら", "手の甲", "ひじ", "かかと"], "correct_index": 0, "explanation": "l は発音しない(パーム)。ヤシの木も palm。", "id": "s4_369", "body_ruby": "カブトムシを<palm>にのせると、6本《ほん》の足《あし》がくすぐったく、思《おも》ったよりずっしりと重《おも》かった。", "choices_ruby": ["手《て》のひら", "手《て》の甲《こう》", "ひじ", "かかと"], "explanation_ruby": "l は発音《はつおん》しない(パーム)。ヤシの木《き》も palm。", "body_kana": "カブトムシを<palm>にのせると、6本のあしがくすぐったく、おもったよりずっしりとおもかった。"}, {"word": "pamphlet", "meaning_jp": "パンフレット", "pos": "名", "body": "高校の文化祭でもらった<pamphlet>には、校舎の地図と各教室の出し物が一覧で載っていた。", "choices": ["パンフレット", "チケット", "ポスター", "願書"], "correct_index": 0, "explanation": "薄い冊子の案内。", "id": "s4_370", "body_ruby": "高校《こうこう》の文化祭《ぶんかさい》でもらった<pamphlet>には、校舎《こうしゃ》の地図《ちず》と各《かく》教室《きょうしつ》の｜出し物《だしもの》が一覧《いちらん》で載《の》っていた。", "choices_ruby": ["パンフレット", "チケット", "ポスター", "願書《がんしょ》"], "explanation_ruby": "薄《うす》い冊子《さっし》の案内《あんない》。", "body_kana": "こうこうのぶんかさいでもらった<pamphlet>には、こうしゃのちずとかくきょうしつのだしものがいちらんでのっていた。"}, {"word": "panel", "meaning_jp": "パネル、板", "pos": "名", "body": "屋根に並んだ太陽光の<panel>が日差しを受けて、この家の電気の大半をまかなっている。", "choices": ["パネル", "アンテナ", "煙突", "雨どい"], "correct_index": 0, "explanation": "solar panel = 太陽光パネル。平らな板状のもの。", "id": "s4_371", "body_ruby": "屋根《やね》に並《なら》んだ太陽光《たいようこう》の<panel>が日差《ひざ》しを受《う》けて、この家《いえ》の電気《でんき》の大半《たいはん》をまかなっている。", "choices_ruby": ["パネル", "アンテナ", "煙突《えんとつ》", "雨《あめ》どい"], "explanation_ruby": "solar panel = 太陽光《たいようこう》パネル。平《たい》らな板状《いたじょう》のもの。", "body_kana": "やねにならんだたいようこうの<panel>がひざしをうけて、このいえのでんきのたいはんをまかなっている。"}, {"word": "paralyzed", "meaning_jp": "まひした", "pos": "形", "body": "その水泳選手は事故で足が<paralyzed>になったが、腕の力だけで泳ぎ、パラリンピックで金メダルを取った。", "choices": ["まひした", "回復した", "強化された", "疲れた"], "correct_index": 0, "explanation": "paralyze(まひさせる)の過去分詞。", "id": "s4_372", "body_ruby": "その水泳《すいえい》選手《せんしゅ》は事故《じこ》で足《あし》が<paralyzed>になったが、腕《うで》の力《ちから》だけで泳《およ》ぎ、パラリンピックで金《きん》メダルを取《と》った。", "choices_ruby": ["まひした", "回復《かいふく》した", "強化《きょうか》された", "疲《つか》れた"], "explanation_ruby": "paralyze(まひさせる)の過去分詞《かこぶんし》。", "body_kana": "そのすいえいせんしゅはじこであしが<paralyzed>になったが、うでのちからだけでおよぎ、パラリンピックできんメダルをとった。"}, {"word": "Paris", "meaning_jp": "パリ", "pos": "名", "body": "フランスの首都<Paris>には、エッフェル塔や凱旋門があり、芸術の都と呼ばれている。", "choices": ["パリ", "ロンドン", "ローマ", "ベルリン"], "correct_index": 0, "explanation": "セーヌ川沿いの街。ルーブル美術館も。", "id": "s4_373", "body_ruby": "フランスの首都《しゅと》<Paris>には、エッフェル塔《とう》や凱旋門《がいせんもん》があり、芸術《げいじゅつ》の都《みやこ》と呼《よ》ばれている。", "choices_ruby": ["パリ", "ロンドン", "ローマ", "ベルリン"], "explanation_ruby": "セーヌ川沿《かわぞ》いの街《まち》。ルーブル美術館《びじゅつかん》も。", "body_kana": "フランスのしゅと<Paris>には、エッフェルとうやがいせんもんがあり、げいじゅつのみやことよばれている。"}, {"word": "partner", "meaning_jp": "パートナー、相棒", "pos": "名", "body": "ダンスの授業では、<partner>と手を取り合ってステップを踏む。息が合わないと足を踏んでしまう。", "choices": ["相棒", "審判", "観客", "先生"], "correct_index": 0, "explanation": "一緒に組む相手。会社の共同経営者も。", "id": "s4_374", "body_ruby": "ダンスの授業《じゅぎょう》では、<partner>と手《て》を取《と》り合《あ》ってステップを踏《ふ》む。息《いき》が合《あ》わないと足《あし》を踏《ふ》んでしまう。", "choices_ruby": ["相棒《あいぼう》", "審判《しんぱん》", "観客《かんきゃく》", "先生《せんせい》"], "explanation_ruby": "一緒《いっしょ》に組《く》む相手《あいて》。会社《かいしゃ》の共同《きょうどう》経営者《けいえいしゃ》も。", "body_kana": "ダンスのじゅぎょうでは、<partner>とてをとりあってステップをふむ。いきがあわないとあしをふんでしまう。"}, {"word": "passport", "meaning_jp": "パスポート", "pos": "名", "body": "海外へ行くには<passport>が必要だ。空港の審査で顔写真のページを開いて提示する。", "choices": ["パスポート", "定期券", "免許証", "保険証"], "correct_index": 0, "explanation": "pass(通る)+ port(港)。国が発行する旅券。", "id": "s4_375", "body_ruby": "海外《かいがい》へ行《い》くには<passport>が必要《ひつよう》だ。空《そら》港《みなと》の審査《しんさ》で顔写真《かおじゃしん》のページを開《ひら》いて提示《ていじ》する。", "choices_ruby": ["パスポート", "定期券《ていきけん》", "免許証《めんきょしょう》", "保険証《ほけんしょう》"], "explanation_ruby": "pass(通《とお》る)+ port(港《みなと》)。国《くに》が発行《はっこう》する旅券《りょけん》。", "body_kana": "かいがいへいくには<passport>がひつようだ。そらみなとのしんさでかおじゃしんのページをひらいてていじする。"}, {"word": "peach", "meaning_jp": "もも", "pos": "名", "body": "山梨の<peach>は皮まで柔らかく、冷やしてかぶりつくと果汁がしたたり落ちた。", "choices": ["もも", "りんご", "なし", "かき"], "correct_index": 0, "explanation": "桃太郎は Peach Boy と訳されることも。", "id": "s4_376", "body_ruby": "山梨《やまなし》の<peach>は皮《かわ》まで柔《やわ》らかく、冷《ひ》やしてかぶりつくと果汁《かじゅう》がしたたり落《お》ちた。", "choices_ruby": ["もも", "りんご", "なし", "かき"], "explanation_ruby": "桃太郎《ももたろう》は Peach Boy と訳《やく》されることも。", "body_kana": "やまなしの<peach>はかわまでやわらかく、ひやしてかぶりつくとかじゅうがしたたりおちた。"}, {"word": "percent", "meaning_jp": "パーセント", "pos": "名", "body": "アンケートでは、回答者の85<percent>が「朝食を毎日食べる」と答えた。100人中85人にあたる。", "choices": ["パーセント", "人", "回", "歳"], "correct_index": 0, "explanation": "per(〜につき)+ cent(100)。百分率。", "id": "s4_377", "body_ruby": "アンケートでは、回答者《かいとうしゃ》の85<percent>が「朝食《ちょうしょく》を毎日《まいにち》食《た》べる」と答《こた》えた。100人《にん》中《なか》85人《にん》にあたる。", "choices_ruby": ["パーセント", "人《にん》", "回《かい》", "歳《さい》"], "explanation_ruby": "per(〜につき)+ cent(100)。百分率《ひゃくぶんりつ》。", "body_kana": "アンケートでは、かいとうしゃの85<percent>が「ちょうしょくをまいにちたべる」とこたえた。100人なか85人にあたる。"}, {"word": "perfectly", "meaning_jp": "完璧に", "pos": "副", "body": "リコーダーのテストで、彼女は最後の音まで<perfectly>に吹ききり、先生は満点をつけた。", "choices": ["完璧に", "部分的に", "適当に", "騒がしく"], "correct_index": 0, "explanation": "perfect + -ly。", "id": "s4_378", "body_ruby": "リコーダーのテストで、彼女《かのじょ》は最後《さいご》の音《おと》まで<perfectly>に吹《ふ》ききり、先生《せんせい》は満点《まんてん》をつけた。", "choices_ruby": ["完璧《かんぺき》に", "部分的《ぶぶんてき》に", "適当《てきとう》に", "騒《さわ》がしく"], "explanation_ruby": "perfect + -ly。", "body_kana": "リコーダーのテストで、かのじょはさいごのおとまで<perfectly>にふききり、せんせいはまんてんをつけた。"}, {"word": "Peru", "meaning_jp": "ペルー", "pos": "名", "body": "南米の<Peru>には、空中都市マチュピチュがあり、アンデスの山の尾根に石造りの遺跡が広がる。", "choices": ["ペルー", "ブラジル", "チリ", "メキシコ"], "correct_index": 0, "explanation": "首都はリマ。インカ帝国の中心地だった。", "id": "s4_379", "body_ruby": "南米《なんべい》の<Peru>には、空《そら》中都市《ちゅうとし》マチュピチュがあり、アンデスの山《やま》の尾根《おね》に石造《いしづく》りの遺跡《いせき》が広《ひろ》がる。", "choices_ruby": ["ペルー", "ブラジル", "チリ", "メキシコ"], "explanation_ruby": "首都《しゅと》はリマ。インカ帝国《ていこく》の中心地《ちゅうしんち》だった。", "body_kana": "なんべいの<Peru>には、そらちゅうとしマチュピチュがあり、アンデスのやまのおねにいしづくりのいせきがひろがる。"}, {"word": "pet", "meaning_jp": "ペット", "pos": "名", "body": "わが家の<pet>は、犬1匹と金魚3匹。世話の当番表が冷蔵庫に貼ってある。", "choices": ["ペット", "家畜", "野生動物", "ぬいぐるみ"], "correct_index": 0, "explanation": "愛玩動物。pet shop = ペットショップ。", "id": "s4_380", "body_ruby": "わが家《いえ》の<pet>は、犬《いぬ》1匹《ひき》と金魚《きんぎょ》3匹《ひき》。世話《せわ》の当番《とうばん》表《おもて》が冷蔵庫《れいぞうこ》に貼《は》ってある。", "choices_ruby": ["ペット", "家畜《かちく》", "野生《やせい》動物《どうぶつ》", "ぬいぐるみ"], "explanation_ruby": "愛玩動物《あいがんどうぶつ》。pet shop = ペットショップ。", "body_kana": "わがいえの<pet>は、いぬ1匹ときんぎょ3匹。せわのとうばんおもてがれいぞうこにはってある。"}, {"word": "pharmacist", "meaning_jp": "薬剤師", "pos": "名", "body": "処方箋を渡すと、<pharmacist>が薬を取りそろえ、飲み合わせと回数を丁寧に説明してくれた。", "choices": ["薬剤師", "医師", "看護師", "受付係"], "correct_index": 0, "explanation": "pharmacy(薬局)で働く専門家。", "id": "s4_381", "body_ruby": "処方箋《しょほうせん》を渡《わた》すと、<pharmacist>が薬《くすり》を取《と》りそろえ、飲《の》み合《あ》わせと回数《かいすう》を丁寧《ていねい》に説明《せつめい》してくれた。", "choices_ruby": ["薬剤師《やくざいし》", "医師《いし》", "看護《かんご》師《し》", "受付《うけつけ》係《かかり》"], "explanation_ruby": "pharmacy(薬局《やっきょく》)で働《はたら》く専門家《せんもんか》。", "body_kana": "しょほうせんをわたすと、<pharmacist>がくすりをとりそろえ、のみあわせとかいすうをていねいにせつめいしてくれた。"}, {"word": "photograph", "meaning_jp": "写真", "pos": "名", "body": "白黒の古い<photograph>には、開校当時の木造校舎と、袴姿の生徒たちが写っていた。", "choices": ["写真", "絵画", "地図", "彫刻"], "correct_index": 0, "explanation": "photo はこの略。photo(光)+ graph(描く)。", "id": "s4_382", "body_ruby": "白黒《しろくろ》の古《ふる》い<photograph>には、開校《かいこう》当時《とうじ》の木造《もくぞう》校舎《こうしゃ》と、袴姿《はかますがた》の生徒《せいと》たちが写《うつ》っていた。", "choices_ruby": ["写真《しゃしん》", "絵画《かいが》", "地図《ちず》", "彫刻《ちょうこく》"], "explanation_ruby": "photo はこの略《りゃく》。photo(光《ひかり》)+ graph(描《えが》く)。", "body_kana": "しろくろのふるい<photograph>には、かいこうとうじのもくぞうこうしゃと、はかますがたのせいとたちがうつっていた。"}, {"word": "photographer", "meaning_jp": "写真家", "pos": "名", "body": "卒業アルバムの<photographer>は、自然な笑顔を引き出すために、撮る直前に必ず一言ボケる。", "choices": ["写真家", "画家", "記者", "印刷屋"], "correct_index": 0, "explanation": "photograph + -er。プロのカメラマン。", "id": "s4_383", "body_ruby": "卒業《そつぎょう》アルバムの<photographer>は、自然《しぜん》な笑顔《えがお》を｜引き出《ひきだ》すために、撮《と》る直前《ちょくぜん》に必《かなら》ず一言《ひとこと》ボケる。", "choices_ruby": ["写真家《しゃしんか》", "画家《がか》", "記者《きしゃ》", "印刷屋《いんさつや》"], "explanation_ruby": "photograph + -er。プロのカメラマン。", "body_kana": "そつぎょうアルバムの<photographer>は、しぜんなえがおをひきだすために、とるちょくぜんにかならずひとことボケる。"}, {"word": "phrase", "meaning_jp": "フレーズ、句", "pos": "名", "body": "「ナイス・トゥー・ミート・ユー」は初対面のあいさつの定番の<phrase>で、まとまりごと覚えると会話で役立つ。", "choices": ["決まり文句", "単語1つ", "文法用語", "発音記号"], "correct_index": 0, "explanation": "複数の単語のまとまり。曲の一節にも使う。", "id": "s4_384", "body_ruby": "「ナイス・トゥー・ミート・ユー」は初対面《しょたいめん》のあいさつの定番《ていばん》の<phrase>で、まとまりごと覚《おぼ》えると会話《かいわ》で役立《やくた》つ。", "choices_ruby": ["決《き》まり文句《もんく》", "単語《たんご》1つ", "文法用語《ぶんぽうようご》", "発音記号《はつおんきごう》"], "explanation_ruby": "複数《ふくすう》の単語《たんご》のまとまり。曲《きょく》の一節《いっせつ》にも使《つか》う。", "body_kana": "「ナイス・トゥー・ミート・ユー」はしょたいめんのあいさつのていばんの<phrase>で、まとまりごとおぼえるとかいわでやくたつ。"}, {"word": "picnic", "meaning_jp": "ピクニック", "pos": "名", "body": "よく晴れた日曜、公園へ<picnic>に出かけ、芝生にシートを広げてサンドイッチを食べた。", "choices": ["ピクニック", "登山", "買い物", "映画鑑賞"], "correct_index": 0, "explanation": "屋外で食事を楽しむ外出。", "id": "s4_385", "body_ruby": "よく晴《は》れた日曜《にちよう》、公園《こうえん》へ<picnic>に出《で》かけ、芝生《しばふ》にシートを広《ひろ》げてサンドイッチを食《た》べた。", "choices_ruby": ["ピクニック", "登山《とざん》", "｜買い物《かいもの》", "映画鑑賞《えいがかんしょう》"], "explanation_ruby": "屋外《おくがい》で食事《しょくじ》を楽《たの》しむ外出《がいしゅつ》。", "body_kana": "よくはれたにちよう、こうえんへ<picnic>にでかけ、しばふにシートをひろげてサンドイッチをたべた。"}, {"word": "pink", "meaning_jp": "ピンク、桃色", "pos": "名/形", "body": "満開の桜並木は、空まで淡い<pink>に染めて、入学式の通学路を彩っていた。", "choices": ["桃色", "水色", "黄緑", "茶色"], "correct_index": 0, "explanation": "桜や桃の花の色。", "id": "s4_386", "body_ruby": "満開《まんかい》の桜《さくら》並木《なみき》は、空《そら》まで淡《あわ》い<pink>に染《そ》めて、入学式《にゅうがくしき》の通学路《つうがくろ》を彩《さい》っていた。", "choices_ruby": ["桃色《ももいろ》", "水色《みずいろ》", "黄緑《きみどり》", "茶色《ちゃいろ》"], "explanation_ruby": "桜《さくら》や桃《もも》の花《はな》の色《いろ》。", "body_kana": "まんかいのさくらなみきは、そらまであわい<pink>にそめて、にゅうがくしきのつうがくろをさいっていた。"}, {"word": "pizza", "meaning_jp": "ピザ", "pos": "名", "body": "宅配の<pizza>が届くと、箱を開けた瞬間にチーズの香りが広がり、8等分の取り合いが始まった。", "choices": ["ピザ", "パスタ", "グラタン", "リゾット"], "correct_index": 0, "explanation": "イタリア生まれの料理。発音は「ピーツァ」。", "id": "s4_387", "body_ruby": "宅配《たくはい》の<pizza>が届《とど》くと、箱《はこ》を開《ひら》けた瞬間《しゅんかん》にチーズの香《かお》りが広《ひろ》がり、8等分《とうぶん》の取《と》り合《あ》いが始《はじ》まった。", "choices_ruby": ["ピザ", "パスタ", "グラタン", "リゾット"], "explanation_ruby": "イタリア生《う》まれの料理《りょうり》。発音《はつおん》は「ピーツァ」。", "body_kana": "たくはいの<pizza>がとどくと、はこをひらけたしゅんかんにチーズのかおりがひろがり、8等分のとりあいがはじまった。"}, {"word": "playful", "meaning_jp": "遊び好きな、ふざけた", "pos": "形", "body": "<playful>な子犬は、ボールを投げるたびに全力で追いかけ、何度でも足元に持って戻ってくる。", "choices": ["遊び好きな", "無気力な", "攻撃的な", "眠たげな"], "correct_index": 0, "explanation": "play + -ful。じゃれっ気のある。", "id": "s4_388", "body_ruby": "<playful>な子犬《こいぬ》は、ボールを投《な》げるたびに全力《ぜんりょく》で追《お》いかけ、何度《なんど》でも足元《あしもと》に持《も》って戻《もど》ってくる。", "choices_ruby": ["遊《あそ》び好《す》きな", "無気力《むきりょく》な", "攻撃的《こうげきてき》な", "眠《ねむ》たげな"], "explanation_ruby": "play + -ful。じゃれっ気《き》のある。", "body_kana": "<playful>なこいぬは、ボールをなげるたびにぜんりょくでおいかけ、なんどでもあしもとにもってもどってくる。"}, {"word": "plus", "meaning_jp": "プラス、加えて", "pos": "前/名", "body": "本体価格<plus>消費税で、レジでの支払いは表示より1割ほど高くなる。", "choices": ["〜を加えて", "〜を引いて", "〜で割って", "〜を掛けて"], "correct_index": 0, "explanation": "minus(マイナス)の対。2 plus 3 is 5。", "id": "s4_389", "body_ruby": "本体価格《ほんたいかかく》<plus>消費税《しょうひぜい》で、レジでの支払《しはら》いは表示《ひょうじ》より1割《わり》ほど高《たか》くなる。", "choices_ruby": ["〜を加《くわ》えて", "〜を引《ひ》いて", "〜で割《さ》って", "〜を掛《か》けて"], "explanation_ruby": "minus(マイナス)の対《つい》。2 plus 3 is 5。", "body_kana": "ほんたいかかく<plus>しょうひぜいで、レジでのしはらいはひょうじより1わりほどたかくなる。"}, {"word": "pocket", "meaning_jp": "ポケット", "pos": "名", "body": "上着の<pocket>に手を入れると、去年の冬に入れたままの100円玉が出てきた。", "choices": ["ポケット", "袖", "襟", "ベルト"], "correct_index": 0, "explanation": "服の物入れ。pocket money = おこづかい。", "id": "s4_390", "body_ruby": "上着《うわぎ》の<pocket>に手《て》を入《い》れると、去年《きょねん》の冬《ふゆ》に入《い》れたままの100円《えん》玉《たま》が出《で》てきた。", "choices_ruby": ["ポケット", "袖《そで》", "襟《えり》", "ベルト"], "explanation_ruby": "服《ふく》の物《もの》入《い》れ。pocket money = おこづかい。", "body_kana": "うわぎの<pocket>にてをいれると、きょねんのふゆにいれたままの100円たまがでてきた。"}, {"word": "poem", "meaning_jp": "詩", "pos": "名", "body": "国語の授業で、夕焼けをテーマに4行の<poem>を書いた。短い言葉に気持ちを込めるのは難しい。", "choices": ["詩", "小説", "日記", "論文"], "correct_index": 0, "explanation": "poet = 詩人。poetry = 詩(総称)。", "id": "s4_391", "body_ruby": "国語《こくご》の授業《じゅぎょう》で、夕焼《ゆうや》けをテーマに4行《おこ》の<poem>を書《か》いた。短《みじか》い言葉《ことば》に気持《きも》ちを込《こ》めるのは難《むずか》しい。", "choices_ruby": ["詩《し》", "小説《しょうせつ》", "日記《にっき》", "論文《ろんぶん》"], "explanation_ruby": "poet = 詩人《しじん》。poetry = 詩《し》(総称《そうしょう》)。", "body_kana": "こくごのじゅぎょうで、ゆうやけをテーマに4おこの<poem>をかいた。みじかいことばにきもちをこめるのはむずかしい。"}, {"word": "political", "meaning_jp": "政治の", "pos": "形", "body": "選挙前のテレビ討論では、各党の<political>な主張がぶつかり、司会が何度も時間を区切った。", "choices": ["政治的な", "経済的な", "文化的な", "個人的な"], "correct_index": 0, "explanation": "politics(政治)+ -al。", "id": "s4_392", "body_ruby": "選挙《せんきょ》前《まえ》のテレビ討論《とうろん》では、各党《かくとう》の<political>な主張《しゅちょう》がぶつかり、司会《しかい》が何度《なんど》も時間《じかん》を区切《くぎ》った。", "choices_ruby": ["政治的《せいじてき》な", "経済的《けいざいてき》な", "文化的《ぶんかてき》な", "個人的《こじんてき》な"], "explanation_ruby": "politics(政治《せいじ》)+ -al。", "body_kana": "せんきょまえのテレビとうろんでは、かくとうの<political>なしゅちょうがぶつかり、しかいがなんどもじかんをくぎった。"}, {"word": "polo", "meaning_jp": "ポロ(シャツ)", "pos": "名", "body": "クールビズ期間は、襟付きの<polo>シャツでの勤務が認められ、父も白い1枚を愛用している。", "choices": ["ポロ", "セーター", "ジャージ", "浴衣"], "correct_index": 0, "explanation": "馬上競技ポロの選手が着たことが由来。", "id": "s4_393", "body_ruby": "クールビズ期間《きかん》は、襟《えり》付《つ》きの<polo>シャツでの勤務《きんむ》が認《みと》められ、父《ちち》も白《しろ》い1枚《まい》を愛用《あいよう》している。", "choices_ruby": ["ポロ", "セーター", "ジャージ", "浴衣《ゆかた》"], "explanation_ruby": "馬上《ばじょう》競技《きょうぎ》ポロの選手《せんしゅ》が着《き》たことが由来《ゆらい》。", "body_kana": "クールビズきかんは、えりつきの<polo>シャツでのきんむがみとめられ、ちちもしろい1枚をあいようしている。"}, {"word": "pond", "meaning_jp": "池", "pos": "名", "body": "公園の<pond>には鯉と亀がいて、パンくずを投げると水面が一気にざわめく。", "choices": ["池", "海", "川", "滝"], "correct_index": 0, "explanation": "lake(湖)より小さい水たまり。", "id": "s4_394", "body_ruby": "公園《こうえん》の<pond>には鯉《こい》と亀《かめ》がいて、パンくずを投《な》げると水面《すいめん》が一気《いっき》にざわめく。", "choices_ruby": ["池《いけ》", "海《うみ》", "川《かわ》", "滝《たき》"], "explanation_ruby": "lake(湖《みずうみ》)より小《ちい》さい水《みず》たまり。", "body_kana": "こうえんの<pond>にはこいとかめがいて、パンくずをなげるとすいめんがいっきにざわめく。"}, {"word": "poodle", "meaning_jp": "プードル", "pos": "名", "body": "トリミングしたての<poodle>は、巻き毛がふんわり丸く整えられ、ぬいぐるみのようだった。", "choices": ["プードル", "ペルシャ猫", "ウサギ", "ハムスター"], "correct_index": 0, "explanation": "巻き毛が特徴の犬種。トイプードルなど。", "id": "s4_395", "body_ruby": "トリミングしたての<poodle>は、｜巻き毛《まきげ》がふんわり丸《まる》く整《ととの》えられ、ぬいぐるみのようだった。", "choices_ruby": ["プードル", "ペルシャ猫《ねこ》", "ウサギ", "ハムスター"], "explanation_ruby": "｜巻き毛《まきげ》が特徴《とくちょ しょうです」とちいさなきかいをかかげた。"}, {"word": "programmer", "meaning_jp": "プログラマー", "pos": "名", "body": "ゲーム会社の<programmer>は、キャラクターの動きを1行ずつコードで書いて作っていると話してくれた。", "choices": ["プログラマー", "声優", "脚本家", "営業担当"], "correct_index": 0, "explanation": "program + -er。コンピュータに指示を書く人。", "id": "s4_411", "body_ruby": "ゲーム会社《かいしゃ》の<programmer>は、キャラクターの動《うご》きを1行《ぎょう》ずつコードで書《か》いて作《つく》っていると話《はな》してくれた。", "choices_ruby": ["プログラマー", "声優《せいゆう》", "脚本家《きゃくほんか》", "営業担当《えいぎょうたんとう》"], "explanation_ruby": "program + -er。コンピュータに指示《しじ》を書《か》く人《にん》。", "body_kana": "ゲームかいしゃの<programmer>は、キャラクターのうごきを1ぎょうずつコードでかいてつくっているとはなしてくれた。"}, {"word": "prop", "meaning_jp": "小道具", "pos": "名", "body": "劇で使う王冠の<prop>は、厚紙に金の折り紙を貼って作った。客席からは本物に見えたらしい。", "choices": ["小道具", "衣装", "台本", "照明"], "correct_index": 0, "explanation": "演劇・映画で使う道具。property の略。", "id": "s4_412", "body_ruby": "劇《げき》で使《つか》う王冠《おうかん》の<prop>は、厚紙《あつがみ》に金《きん》の｜折り紙《おりがみ》を貼《は》って作《つく》った。客席《きゃくせき》からは本物《ほんもの》に見《み》えたらしい。", "choices_ruby": ["小道具《こどうぐ》", "衣装《いしょう》", "台本《だいほん》", "照明《しょうめい》"], "explanation_ruby": "演劇《えんげき》・映画《えいが》で使《つか》う道具《どうぐ》。property の略《りゃく》。", "body_kana": "げきでつかうおうかんの<prop>は、あつがみにきんのおりがみをはってつくった。きゃくせきからはほんものにみえたらしい。"}, {"word": "proud", "meaning_jp": "誇りに思う", "pos": "形", "body": "妹が補助輪なしで自転車に乗れた日、教えた私まで<proud>な気持ちで胸がいっぱいになった。", "choices": ["誇らしい", "恥ずかしい", "悔しい", "不安な"], "correct_index": 0, "explanation": "be proud of ~ = 〜を誇りに思う。pride = 誇り。", "id": "s4_413", "body_ruby": "妹《いもうと》が補助《ほじょ》輪《わ》なしで自転車《じてんしゃ》に乗《の》れた日《にち》、教《おし》えた私《わたし》まで<proud>な気持《きも》ちで胸《むね》がいっぱいになった。", "choices_ruby": ["誇《ほこ》らしい", "恥《は》ずかしい", "悔《くや》しい", "不安《ふあん》な"], "explanation_ruby": "be proud of ~ = 〜を誇《ほこ》りに思《おも》う。pride = 誇《ほこ》り。", "body_kana": "いもうとがほじょわなしでじてんしゃにのれたにち、おしえたわたしまで<proud>なきもちでむねがいっぱいになった。"}, {"word": "pull", "meaning_jp": "引く", "pos": "動", "body": "ドアに「<pull>」と書いてあったのに押してしまい、ガタンと音だけが響いて開かなかった。", "choices": ["引く", "押す", "回す", "持ち上げる"], "correct_index": 0, "explanation": "push(押す)の対。", "id": "s4_414", "body_ruby": "ドアに「<pull>」と書《か》いてあったのに押《お》してしまい、ガタンと音《おと》だけが響《ひび》いて開《ひら》かなかった。", "choices_ruby": ["引《ひ》く", "押《お》す", "回《まわ》す", "持《も》ち上《あ》げる"], "explanation_ruby": "push(押《お》す)の対《つい》。", "body_kana": "ドアに「<pull>」とかいてあったのにおしてしまい、ガタンとおとだけがひびいてひらかなかった。"}, {"word": "quietly", "meaning_jp": "静かに", "pos": "副", "body": "赤ちゃんが寝ている部屋では、家族みんなが<quietly>に歩き、テレビの音量も2つ下げる。", "choices": ["静かに", "騒がしく", "素早く", "堂々と"], "correct_index": 0, "explanation": "quiet(静かな)+ -ly。", "id": "s4_415", "body_ruby": "赤《あか》ちゃんが寝《ね》ている部屋《へや》では、家族《かぞく》みんなが<quietly>に歩《ある》き、テレビの音量《おんりょう》も2つ下《さ》げる。", "choices_ruby": ["静《しず》かに", "騒《さわ》がしく", "素早《すばや》く", "堂々《どうどう》と"], "explanation_ruby": "quiet(静《しず》かな)+ -ly。", "body_kana": "あかちゃんがねているへやでは、かぞくみんなが<quietly>にあるき、テレビのおんりょうも2つさげる。"}, {"word": "quiz", "meaning_jp": "クイズ、小テスト", "pos": "名", "body": "英語の授業は毎回、単語の<quiz>から始まる。10問中8問正解しないと追試になる。", "choices": ["小テスト", "宿題", "予習", "遠足"], "correct_index": 0, "explanation": "test より小規模な確認問題。クイズ番組の quiz。", "id": "s4_416", "body_ruby": "英語《えいご》の授業《じゅぎょう》は毎回《まいかい》、単語《たんご》の<quiz>から始《はじ》まる。10問《もん》中《なか》8問《もん》正解《せいかい》しないと追試《ついし》になる。", "choices_ruby": ["小《しょう》テスト", "宿題《しゅくだい》", "予習《よしゅう》", "遠足《えんそく》"], "explanation_ruby": "test より小規模《しょうきぼ》な確認《かくにん》問題《もんだい》。クイズ番組《ばんぐみ》の quiz。", "body_kana": "えいごのじゅぎょうはまいかい、たんごの<quiz>からはじまる。10問なか8問せいかいしないとついしになる。"}, {"word": "radio", "meaning_jp": "ラジオ", "pos": "名", "body": "停電の夜、電池式の<radio>をつけると、ニュースの声が暗闇の部屋に流れて心強かった。", "choices": ["ラジオ", "テレビ", "新聞", "電話"], "correct_index": 0, "explanation": "音声放送。radio exercise = ラジオ体操。", "id": "s4_417", "body_ruby": "停電《ていでん》の夜《よる》、電池式《でんちしき》の<radio>をつけると、ニュースの声《こえ》が暗闇《くらやみ》の部屋《へや》に流《なが》れて心強《こころづよ》かった。", "choices_ruby": ["ラジオ", "テレビ", "新聞《しんぶん》", "電話《でんわ》"], "explanation_ruby": "音声《おんせい》放送《ほうそう》。radio exercise = ラジオ体操《たいそう》。", "body_kana": "ていでんのよる、でんちしきの<radio>をつけると、ニュースのこえがくらやみのへやにながれてこころづよかった。"}, {"word": "rainbow", "meaning_jp": "虹", "pos": "名", "body": "夕立のあと、空に大きな<rainbow>がかかり、7色のアーチが学校の真上まで伸びていた。", "choices": ["虹", "雷", "夕焼け", "オーロラ"], "correct_index": 0, "explanation": "rain(雨)+ bow(弓)。雨上がりの七色の弧。", "id": "s4_418", "body_ruby": "夕立《ゆうだち》のあと、空《そら》に大《おお》きな<rainbow>がかかり、7色《しょく》のアーチが学校《がっこう》の真上《まうえ》まで伸《の》びていた。", "choices_ruby": ["虹《にじ》", "雷《かみなり》", "夕焼《ゆうや》け", "オーロラ"], "explanation_ruby": "rain(雨《あめ》)+ bow(弓《ゆみ》)。雨上《あめあ》がりの七色《なないろ》の弧《こ》。", "body_kana": "ゆうだちのあと、そらにおおきな<rainbow>がかかり、7色のアーチががっこうのまうえまでのびていた。"}, {"word": "ramp", "meaning_jp": "スロープ、傾斜路", "pos": "名", "body": "図書館の入口には階段の横に<ramp>があり、車いすやベビーカーでも段差なく入れる。", "choices": ["スロープ", "エレベーター", "回転ドア", "手すりだけ"], "correct_index": 0, "explanation": "傾斜した通路。バリアフリーの基本設備。", "id": "s4_419", "body_ruby": "図書館《としょかん》の入口《いりぐち》には階段《かいだん》の横《よこ》に<ramp>があり、車《くるま》いすやベビーカーでも段差《だんさ》なく入《い》れる。", "choices_ruby": ["スロープ", "エレベーター", "回転《かいてん》ドア", "手《て》すりだけ"], "explanation_ruby": "傾斜《けいしゃ》した通路《つうろ》。バリアフリーの基本《きほん》設備《せつび》。", "body_kana": "としょかんのいりぐちにはかいだんのよこに<ramp>があり、くるまいすやベビーカーでもだんさなくいれる。"}, {"word": "rang", "meaning_jp": "鳴った", "pos": "動", "body": "終業のチャイムが<rang>した瞬間、教室の空気がゆるみ、一斉に机を片付ける音が始まった。", "choices": ["鳴った", "止まった", "壊れた", "光った"], "correct_index": 0, "explanation": "ring の過去形。ring-rang-rung。", "id": "s4_420", "body_ruby": "終業《しゅうぎょう》のチャイムが<rang>した瞬間《しゅんかん》、教室《きょうしつ》の空《そら》気《き》がゆるみ、一斉《いっせい》に机《つくえ》を片付《かたづ》ける音《おと》が始《はじ》まった。", "choices_ruby": ["鳴《な》った", "止《と》まった", "壊《こわ》れた", "光《ひか》った"], "explanation_ruby": "ring の過去形《かこけい》。ring-rang-rung。", "body_kana": "しゅうぎょうのチャイムが<rang>したしゅんかん、きょうしつのそらきがゆるみ、いっせいにつくえをかたづけるおとがはじまった。"}, {"word": "reading", "meaning_jp": "読書、読むこと", "pos": "名", "body": "朝の10分間<reading>の時間は、教室全体が静まり、ページをめくる音だけが聞こえる。", "choices": ["読書", "計算", "歌唱", "運動"], "correct_index": 0, "explanation": "read + -ing。4技能の一つ。", "id": "s4_421", "body_ruby": "朝《あさ》の10分間《ふんかん》<reading>の時間《じかん》は、教室《きょうしつ》全体《ぜんたい》が静《しず》まり、ページをめくる音《おと》だけが聞《き》こえる。", "choices_ruby": ["読書《どくしょ》", "計算《けいさん》", "歌唱《かしょう》", "運動《うんどう》"], "explanation_ruby": "read + -ing。4技能《ぎのう》の一《ひと》つ。", "body_kana": "あさの10分間<reading>のじかんは、きょうしつぜんたいがしずまり、ページをめくるおとだけがきこえる。"}, {"word": "recognize", "meaning_jp": "見分ける、認識する", "pos": "動", "body": "20年ぶりの同窓会でも、母は旧友を一瞬で<recognize>した。「面影は変わらないのよ」と笑った。", "choices": ["見分ける", "忘れる", "無視する", "間違える"], "correct_index": 0, "explanation": "re(再び)+ cognize(知る)。それと分かること。", "id": "s4_422", "body_ruby": "20年《ねん》ぶりの同窓会《どうそうかい》でも、母《はは》は旧友《きゅうゆう》を一瞬《いっしゅん》で<recognize>した。「面影《おもかげ》は変《か》わらないのよ」と笑《わら》った。", "choices_ruby": ["見分《みわ》ける", "忘《わす》れる", "無視《むし》する", "間違《まちが》える"], "explanation_ruby": "re(再《ふたた》び)+ cognize(知《し》る)。それと分《わ》かること。", "body_kana": "20年ぶりのどうそうかいでも、はははきゅうゆうをいっしゅんで<recognize>した。「おもかげはかわらないのよ」とわらった。"}, {"word": "regular", "meaning_jp": "規則正しい、通常の", "pos": "形", "body": "医者からは、夜ふかしをやめて<regular>な生活を送るように言われた。寝る時刻を毎日そろえるのだ。", "choices": ["規則正しい", "不規則な", "豪華な", "退屈な"], "correct_index": 0, "explanation": "regularly = 定期的に。レギュラーサイズの regular。", "id": "s4_423", "body_ruby": "医者《いしゃ》からは、夜《よる》ふかしをやめて<regular>な生活《せいかつ》を送《おく》るように言《い》われた。寝《ね》る時刻《じこく》を毎日《まいにち》そろえるのだ。", "choices_ruby": ["規則正《きそくただ》しい", "不規則《ふきそく》な", "豪華《ごうか》な", "退屈《たいくつ》な"], "explanation_ruby": "regularly = 定期的《ていきてき》に。レギュラーサイズの regular。", "body_kana": "いしゃからは、よるふかしをやめて<regular>なせいかつをおくるようにいわれた。ねるじこくをまいにちそろえるのだ。"}, {"word": "relax", "meaning_jp": "くつろぐ", "pos": "動", "body": "テストが全部終わった夜は、湯船に長くつかって<relax>した。肩の力が抜けていくのが分かった。", "choices": ["くつろぐ", "緊張する", "急ぐ", "我慢する"], "correct_index": 0, "explanation": "Relax! = 落ち着いて! relaxation = 休養。", "id": "s4_424", "body_ruby": "テストが全部《ぜんぶ》終《お》わった夜《よる》は、湯船《ゆぶね》に長《なが》くつかって<relax>した。肩《かた》の力《ちから》が抜《ぬ》けていくのが分《わ》かった。", "choices_ruby": ["くつろぐ", "緊張《きんちょう》する", "急《いそ》ぐ", "我慢《がまん》する"], "explanation_ruby": "Relax! = ｜落ち着《おちつ》いて! relaxation = 休養《きゅうよう》。", "body_kana": "テストがぜんぶおわったよるは、ゆぶねにながくつかって<relax>した。かたのちからがぬけていくのがわかった。"}, {"word": "release", "meaning_jp": "放す、発売する", "pos": "動", "body": "釣り上げた小さな魚は、針を外してそっと川へ<release>した。大きくなってまた会おう。", "choices": ["放す", "捕まえる", "焼く", "飾る"], "correct_index": 0, "explanation": "新曲の「リリース」も同じ語(世に放つ)。", "id": "s4_425", "body_ruby": "釣《つ》り上《あ》げた小《ちい》さな魚《さかな》は、針《はり》を外《はず》してそっと川《かわ》へ<release>した。大《おお》きくなってまた会《あ》おう。", "choices_ruby": ["放《はな》す", "捕《つか》まえる", "焼《や》く", "飾《かざ》る"], "explanation_ruby": "新曲《しんきょく》の「リリース」も同《おな》じ語《ご》(世《よ》に放《はな》つ)。", "body_kana": "つりあげたちいさなさかなは、はりをはずしてそっとかわへ<release>した。おおきくなってまたあおう。"}, {"word": "renewable", "meaning_jp": "再生可能な", "pos": "形", "body": "太陽光や風力のような<renewable>なエネルギーは、使っても太陽と風がある限り尽きることがない。", "choices": ["再生可能な", "使い切りの", "輸入頼みの", "高価なだけの"], "correct_index": 0, "explanation": "re(再び)+ new(新しく)+ -able(できる)。", "id": "s4_426", "body_ruby": "太陽光《たいようこう》や風力《ふうりょく》のような<renewable>なエネルギーは、使《つか》っても太陽《たいよう》と風《かぜ》がある限《かぎ》り尽《つ》きることがない。", "choices_ruby": ["再生可能《さいせいかのう》な", "使《つか》い切《き》りの", "輸入《ゆにゅう》頼《たの》みの", "高価《こうか》なだけの"], "explanation_ruby": "re(再《ふたた》び)+ new(新《あたら》しく)+ -able(できる)。", "body_kana": "たいようこうやふうりょくのような<renewable>なエネルギーは、つかってもたいようとかぜがあるかぎりつきることがない。"}, {"word": "reply", "meaning_jp": "返事(をする)", "pos": "名/動", "body": "招待状を送って1週間、全員から「行きます」の<reply>が届き、ようやく人数が確定した。", "choices": ["返事", "請求", "苦情", "宿題"], "correct_index": 0, "explanation": "answer と近い。メールの「返信」ボタンも reply。", "id": "s4_427", "body_ruby": "招待状《しょうたいじょう》を送《おく》って1週間《しゅうかん》、全員《ぜんいん》から「行《い》きます」の<reply>が届《とど》き、ようやく人数《にんずう》が確定《かくてい》した。", "choices_ruby": ["返事《へんじ》", "請求《せいきゅう》", "苦情《くじょう》", "宿題《しゅくだい》"], "explanation_ruby": "answer と近《ちか》い。メールの「返信《へんしん》」ボタンも reply。", "body_kana": "しょうたいじょうをおくって1週間、ぜんいんから「いきます」の<reply>がとどき、ようやくにんずうがかくていした。"}, {"word": "reporter", "meaning_jp": "記者、レポーター", "pos": "名", "body": "台風の中継で、<reporter>が風にあおられながら、海岸の様子をカメラに向かって伝えていた。", "choices": ["記者", "司会者", "気象予報士", "カメラマン"], "correct_index": 0, "explanation": "report(報告する)+ -er。現場から伝える人。", "id": "s4_428", "body_ruby": "台風《たいふう》の中継《ちゅうけい》で、<reporter>が風《かぜ》にあおられながら、海岸《かいがん》の様子《ようす》をカメラに向《む》かって伝《つた》えていた。", "choices_ruby": ["記者《きしゃ》", "司会者《しかいしゃ》", "気象《きしょう》予報《よほう》士《し》", "カメラマン"], "explanation_ruby": "report(報告《ほうこく》する)+ -er。現場《げんば》から伝《つた》える人《にん》。", "body_kana": "たいふうのちゅうけいで、<reporter>がかぜにあおられながら、かいがんのようすをカメラにむかってつたえていた。"}, {"word": "resource", "meaning_jp": "資源", "pos": "名", "body": "日本は石油などの<resource>の大半を輸入に頼っていて、タンカーが毎日中東から運んでくる。", "choices": ["資源", "技術", "人口", "文化"], "correct_index": 0, "explanation": "natural resources = 天然資源。", "id": "s4_429", "body_ruby": "日本《にっぽん》は石油《せきゆ》などの<resource>の大半《たいはん》を輸入《ゆにゅう》に頼《たよ》っていて、タンカーが毎日《まいにち》中東《ちゅうとう》から運《はこ》んでくる。", "choices_ruby": ["資源《しげん》", "技術《ぎじゅつ》", "人口《じんこう》", "文化《ぶんか》"], "explanation_ruby": "natural resources = 天然《てんねん》資源《しげん》。", "body_kana": "にっぽんはせきゆなどの<resource>のたいはんをゆにゅうにたよっていて、タンカーがまいにちちゅうとうからはこんでくる。"}, {"word": "responsible", "meaning_jp": "責任がある", "pos": "形", "body": "飼い主はペットの一生に<responsible>だ。可愛いだけでは済まない、10年以上続く約束になる。", "choices": ["責任がある", "無関係である", "反対である", "感謝している"], "correct_index": 0, "explanation": "responsibility = 責任。be responsible for ~。", "id": "s4_430", "body_ruby": "｜飼い主《かいぬし》はペットの一生《いっしょう》に<responsible>だ。可愛《かわ》いだけでは済《す》まない、10年《ねん》以上《いじょう》続《つづ》く約束《やくそく》になる。", "choices_ruby": ["責任《せきにん》がある", "無関係《むかんけい》である", "反対《はんたい》である", "感謝《かんしゃ》している"], "explanation_ruby": "responsibility = 責任《せきにん》。be responsible for ~。", "body_kana": "かいぬしはペットのいっしょうに<responsible>だ。かわいだけではすまない、10年いじょうつづくやくそくになる。"}, {"word": "rest", "meaning_jp": "休憩", "pos": "名", "body": "登山の途中、見晴らしのよい岩場で10分の<rest>を取り、水筒のお茶で喉を潤した。", "choices": ["休憩", "出発", "到着", "訓練"], "correct_index": 0, "explanation": "take a rest = 休憩する。「残り」の意味も。", "id": "s4_431", "body_ruby": "登山《とざん》の途中《とちゅう》、見晴《みは》らしのよい岩場《いわば》で10分《ふん》の<rest>を取《と》り、水筒《すいとう》のお茶《ちゃ》で喉《のど》を潤《うるお》した。", "choices_ruby": ["休憩《きゅうけい》", "出発《しゅっぱつ》", "到着《とうちゃく》", "訓練《くんれん》"], "explanation_ruby": "take a rest = 休憩《きゅうけい》する。「残《のこ》り」の意味《いみ》も。", "body_kana": "とざんのとちゅう、みはらしのよいいわばで10分の<rest>をとり、すいとうのおちゃでのどをうるおした。"}, {"word": "result", "meaning_jp": "結果", "pos": "名", "body": "模試の<result>が返ってきた。判定はBだったが、苦手だった数学が平均を超えていた。", "choices": ["結果", "予想", "問題", "願書"], "correct_index": 0, "explanation": "as a result = その結果。cause(原因)の対。", "id": "s4_432", "body_ruby": "模試《もし》の<result>が返《かえ》ってきた。判定《はんてい》はBだったが、苦手《にがて》だった数学《すうがく》が平均《へいきん》を超《こ》えていた。", "choices_ruby": ["結果《けっか》", "予想《よそう》", "問題《もんだい》", "願書《がんしょ》"], "explanation_ruby": "as a result = その結果《けっか》。cause(原因《げんいん》)の対《つい》。", "body_kana": "もしの<result>がかえってきた。はんていはBだったが、にがてだったすうがくがへいきんをこえていた。"}, {"word": "rhythm", "meaning_jp": "リズム", "pos": "名", "body": "ダンスの練習では、まず手拍子で<rhythm>をつかんでから、足のステップを合わせていく。", "choices": ["リズム", "歌詞", "音量", "楽器"], "correct_index": 0, "explanation": "つづりに母音字がない珍しい単語。拍子・調子。", "id": "s4_433", "body_ruby": "ダンスの練習《れんしゅう》では、まず手拍子《てびょうし》で<rhythm>をつかんでから、足《あし》のステップを合《あ》わせていく。", "choices_ruby": ["リズム", "歌詞《かし》", "音量《おんりょう》", "楽器《がっき》"], "explanation_ruby": "つづりに母音字《ぼいんじ》がない珍《めずら》しい単語《たんご》。拍子《ひょうし》・調子《ちょうし》。", "body_kana": "ダンスのれんしゅうでは、まずてびょうしで<rhythm>をつかんでから、あしのステップをあわせていく。"}, {"word": "rich", "meaning_jp": "金持ちの、豊かな", "pos": "形", "body": "その実業家は<rich>になっても通勤電車を使い続け、「お金の使いどころは別にある」と語った。", "choices": ["裕福な", "貧しい", "有名な", "若い"], "correct_index": 0, "explanation": "poor(貧しい)の対。「濃厚な」の意味も。", "id": "s4_434", "body_ruby": "その実業家《じつぎょうか》は<rich>になっても通勤《つうきん》電車《でんしゃ》を使《つか》い続《つづ》け、「お金《かね》の使《つか》いどころは別《べつ》にある」と語《かた》った。", "choices_ruby": ["裕福《ゆうふく》な", "貧《まず》しい", "有名《ゆうめい》な", "若《わか》い"], "explanation_ruby": "poor(貧《まず》しい)の対《つい》。「濃厚《のうこう》な」の意味《いみ》も。", "body_kana": "そのじつぎょうかは<rich>になってもつうきんでんしゃをつかいつづけ、「おかねのつかいどころはべつにある」とかたった。"}, {"word": "ridiculous", "meaning_jp": "ばかげた", "pos": "形", "body": "「宿題を犬に食べられた」という言い訳は<ridiculous>に聞こえたが、本当に紙くずが残っていた。", "choices": ["ばかげた", "もっともな", "感動的な", "科学的な"], "correct_index": 0, "explanation": "笑ってしまうほど非常識なこと。", "id": "s4_435", "body_ruby": "「宿題《しゅくだい》を犬《いぬ》に食《た》べられた」という｜言い訳《いいわけ》は<ridiculous>に聞《き》こえたが、本当《ほんとう》に紙《かみ》くずが残《のこ》っていた。", "choices_ruby": ["ばかげた", "もっともな", "感動的《かんどうてき》な", "科学的《かがくてき》な"], "explanation_ruby": "笑《わら》ってしまうほど非常識《ひじょうしき》なこと。", "body_kana": "「しゅくだいをいぬにたべられた」といういいわけは<ridiculous>にきこえたが、ほんとうにかみくずがのこっていた。"}, {"word": "ring", "meaning_jp": "指輪、鳴る", "pos": "名/動", "body": "母の左手の<ring>は、結婚のときに父が贈ったもので、20年たった今も毎日光っている。", "choices": ["指輪", "腕時計", "ネックレス", "イヤリング"], "correct_index": 0, "explanation": "輪の形のもの。電話が「鳴る」の意味も。", "id": "s4_436", "body_ruby": "母《はは》の左手《ひだりて》の<ring>は、結婚《けっこん》のときに父《ちち》が贈《おく》ったもので、20年《ねん》たった今《いま》も毎日《まいにち》光《ひか》っている。", "choices_ruby": ["指輪《ゆびわ》", "腕時計《うでどけい》", "ネックレス", "イヤリング"], "explanation_ruby": "輪《わ》の形《かたち》のもの。電話《でんわ》が「鳴《な》る」の意味《いみ》も。", "body_kana": "ははのひだりての<ring>は、けっこんのときにちちがおくったもので、20年たったいまもまいにちひかっている。"}, {"word": "roast", "meaning_jp": "(オーブンで)焼く、あぶる", "pos": "動", "body": "クリスマスには、丸ごとのチキンを2時間かけて<roast>する。皮がパリッと色づいたら完成だ。", "choices": ["あぶり焼きにする", "ゆでる", "蒸す", "漬ける"], "correct_index": 0, "explanation": "roast beef = ローストビーフ。じっくり焼く調理法。", "id": "s4_437", "body_ruby": "クリスマスには、丸《まる》ごとのチキンを2時間《じかん》かけて<roast>する。皮《かわ》がパリッと色《いろ》づいたら完成《かんせい》だ。", "choices_ruby": ["あぶり焼《や》きにする", "ゆでる", "蒸《む》す", "漬《つ》ける"], "explanation_ruby": "roast beef = ローストビーフ。じっくり焼《や》く調理法《ちょうりほう》。", "body_kana": "クリスマスには、まるごとのチキンを2時間かけて<roast>する。かわがパリッといろづいたらかんせいだ。"}, {"word": "rode", "meaning_jp": "乗った", "pos": "動", "body": "牧場の体験で、初めて馬に<rode>した。歩くたびに体が上下に揺れ、視線の高さに驚いた。", "choices": ["乗った", "降りた", "洗った", "育てた"], "correct_index": 0, "explanation": "ride の過去形。ride-rode-ridden。", "id": "s4_438", "body_ruby": "牧場《ぼくじょう》の体験《たいけん》で、初《はじ》めて馬《うま》に<rode>した。歩《ある》くたびに体《からだ》が上下《じょうげ》に揺《ゆ》れ、視線《しせん》の高《たか》さに驚《おどろ》いた。", "choices_ruby": ["乗《の》った", "降《お》りた", "洗《あら》った", "育《そだ》てた"], "explanation_ruby": "ride の過去形《かこけい》。ride-rode-ridden。", "body_kana": "ぼくじょうのたいけんで、はじめてうまに<rode>した。あるくたびにからだがじょうげにゆれ、しせんのたかさにおどろいた。"}, {"word": "Roman", "meaning_jp": "ローマの、ローマ人", "pos": "形/名", "body": "<Roman>の時代に作られた水道橋は、2000年たった今もスペインの街にそびえている。", "choices": ["古代ローマの", "ギリシャの", "エジプトの", "中世フランスの"], "correct_index": 0, "explanation": "Rome + -an。ローマ字 = Roman letters。", "id": "s4_439", "body_ruby": "<Roman>の時代《じだい》に作《つく》られた水道橋《すいどうばし》は、2000年《ねん》たった今《いま》もスペインの街《まち》にそびえている。", "choices_ruby": ["古代《こだい》ローマの", "ギリシャの", "エジプトの", "中世《ちゅうせい》フランスの"], "explanation_ruby": "Rome + -an。ローマ字《じ》 = Roman letters。", "body_kana": "<Roman>のじだいにつくられたすいどうばしは、2000年たったいまもスペインのまちにそびえている。"}, {"word": "Rome", "meaning_jp": "ローマ", "pos": "名", "body": "イタリアの首都<Rome>には、コロッセオなど古代の遺跡が街のあちこちに残っている。", "choices": ["ローマ", "パリ", "アテネ", "ロンドン"], "correct_index": 0, "explanation": "「ローマは一日にして成らず」のローマ。", "id": "s4_440", "body_ruby": "イタリアの首都《しゅと》<Rome>には、コロッセオなど古代《こだい》の遺跡《いせき》が街《まち》のあちこちに残《のこ》っている。", "choices_ruby": ["ローマ", "パリ", "アテネ", "ロンドン"], "explanation_ruby": "「ローマは一日《ついたち》にして成《な》らず」のローマ。", "body_kana": "イタリアのしゅと<Rome>には、コロッセオなどこだいのいせきがまちのあちこちにのこっている。"}, {"word": "rose", "meaning_jp": "バラ", "pos": "名", "body": "母の日に、真っ赤な<rose>を1本買って渡した。とげのところはリボンで巻いてもらった。", "choices": ["バラ", "ユリ", "ヒマワリ", "チューリップ"], "correct_index": 0, "explanation": "花の女王。rise(昇る)の過去形と同じつづり。", "id": "s4_441", "body_ruby": "｜母の日《ははのひ》に、｜真っ赤《まっか》な<rose>を1本《ほん》買《か》って渡《わた》した。とげのところはリボンで巻《ま》いてもらった。", "choices_ruby": ["バラ", "ユリ", "ヒマワリ", "チューリップ"], "explanation_ruby": "花《はな》の女王《じょおう》。rise(昇《のぼ》る)の過去形《かこけい》と同《おな》じつづり。", "body_kana": "ははのひに、まっかな<rose>を1本かってわたした。とげのところはリボンでまいてもらった。"}, {"word": "round", "meaning_jp": "丸い", "pos": "形", "body": "満月の夜、空に浮かぶ<round>な月を見て、弟は「ボールみたい」と指をさした。", "choices": ["丸い", "四角い", "細長い", "平らな"], "correct_index": 0, "explanation": "球や円の形。all year round = 一年中。", "id": "s4_442", "body_ruby": "満月《まんげつ》の夜《よる》、空《そら》に浮《う》かぶ<round>な月《がつ》を見《み》て、弟《おとうと》は「ボールみたい」と指《ゆび》をさした。", "choices_ruby": ["丸《まる》い", "四角《しかく》い", "細長《ほそなが》い", "平《たい》らな"], "explanation_ruby": "球《たま》や円《えん》の形《かたち》。all year round = 一年中《いちねんじゅう》。", "body_kana": "まんげつのよる、そらにうかぶ<round>ながつをみて、おとうとは「ボールみたい」とゆびをさした。"}, {"word": "runny", "meaning_jp": "鼻水の出る、ゆるい", "pos": "形", "body": "花粉の季節は、目のかゆみと<runny>な鼻に悩まされ、ポケットティッシュが手放せない。", "choices": ["鼻水が出る", "鼻づまりだけの", "熱っぽい", "せきが出る"], "correct_index": 0, "explanation": "run(流れる)+ -ny。runny nose = 鼻水。", "id": "s4_443", "body_ruby": "花粉《かふん》の季節《きせつ》は、目《め》のかゆみと<runny>な鼻《はな》に悩《なや》まされ、ポケットティッシュが手放《てばな》せない。", "choices_ruby": ["鼻水《はなみず》が出《で》る", "鼻《はな》づまりだけの", "熱《あつ》っぽい", "せきが出《で》る"], "explanation_ruby": "run(流《なが》れる)+ -ny。runny nose = 鼻水《はなみず》。", "body_kana": "かふんのきせつは、めのかゆみと<runny>なはなになやまされ、ポケットティッシュがてばなせない。"}, {"word": "sadness", "meaning_jp": "悲しみ", "pos": "名", "body": "ペットとの別れの<sadness>は、時間がたっても急に込み上げてくることがある。", "choices": ["悲しみ", "喜び", "怒り", "驚き"], "correct_index": 0, "explanation": "sad + -ness。happiness(幸福)の対。", "id": "s4_444", "body_ruby": "ペットとの別《わか》れの<sadness>は、時間《じかん》がたっても急《きゅう》に込《こ》み上《あ》げてくることがある。", "choices_ruby": ["悲《かな》しみ", "喜《よろこ》び", "怒《いか》り", "驚《おどろ》き"], "explanation_ruby": "sad + -ness。happiness(幸福《こうふく》)の対《つい》。", "body_kana": "ペットとのわかれの<sadness>は、じかんがたってもきゅうにこみあげてくることがある。"}, {"word": "safe", "meaning_jp": "安全な", "pos": "形", "body": "ヘルメットをかぶり、明るい道を選んで帰る。夜の自転車は、<safe>な行動の積み重ねが命を守る。", "choices": ["安全な", "危険な", "速い", "楽しい"], "correct_index": 0, "explanation": "dangerous(危険な)の対。safety = 安全。", "id": "s4_445", "body_ruby": "ヘルメットをかぶり、明《あか》るい道《みち》を選《えら》んで帰《かえ》る。夜《よる》の自転車《じてんしゃ》は、<safe>な行動《こうどう》の｜積み重《つみかさ》ねが命《いのち》を守《まも》る。", "choices_ruby": ["安全《あんぜん》な", "危険《きけん》な", "速《はや》い", "楽《たの》しい"], "explanation_ruby": "dangerous(危険《きけん》な)の対《つい》。safety = 安全《あんぜん》。", "body_kana": "ヘルメットをかぶり、あかるいみちをえらんでかえる。よるのじてんしゃは、<safe>なこうどうのつみかさねがいのちをまもる。"}, {"word": "safely", "meaning_jp": "無事に", "pos": "副", "body": "迷子になった子は、30分後に係員に連れられて<safely>に親のもとへ戻った。", "choices": ["無事に", "危うく", "こっそり", "遅れて"], "correct_index": 0, "explanation": "safe + -ly。", "id": "s4_446", "body_ruby": "迷子《まいご》になった子《こ》は、30分《ふん》後《のち》に係員《かかりいん》に連《つ》れられて<safely>に親《おや》のもとへ戻《もど》った。", "choices_ruby": ["無事《ぶじ》に", "危《あや》うく", "こっそり", "遅《おく》れて"], "explanation_ruby": "safe + -ly。", "body_kana": "まいごになったこは、30分のちにかかりいんにつれられて<safely>におやのもとへもどった。"}, {"word": "salad", "meaning_jp": "サラダ", "pos": "名", "body": "夕食の<salad>は、レタスとトマトときゅうりを刻んで、ドレッシングは食べる直前にかける。", "choices": ["サラダ", "スープ", "ステーキ", "デザート"], "correct_index": 0, "explanation": "生野菜の料理。potato salad = ポテトサラダ。", "id": "s4_447", "body_ruby": "夕食《ゆうしょく》の<salad>は、レタスとトマトときゅうりを刻《きざ》んで、ドレッシングは食《た》べる直前《ちょくぜん》にかける。", "choices_ruby": ["サラダ", "スープ", "ステーキ", "デザート"], "explanation_ruby": "生野菜《なまやさい》の料理《りょうり》。potato salad = ポテトサラダ。", "body_kana": "ゆうしょくの<salad>は、レタスとトマトときゅうりをきざんで、ドレッシングはたべるちょくぜんにかける。"}, {"word": "sale", "meaning_jp": "セール、販売", "pos": "名", "body": "デパートの冬の<sale>では、コートが半額になり、開店前から入口に行列ができていた。", "choices": ["安売り", "値上げ", "閉店", "開店"], "correct_index": 0, "explanation": "for sale = 売り物。on sale = セール中。", "id": "s4_448", "body_ruby": "デパートの冬《ふゆ》の<sale>では、コートが半額《はんがく》になり、開店前《かいてんまえ》から入口《いりぐち》に行列《ぎょうれつ》ができていた。", "choices_ruby": ["安売《やすう》り", "値上《ねあ》げ", "閉店《へいてん》", "開店《かいてん》"], "explanation_ruby": "for sale = ｜売り物《うりもの》。on sale = セール中《なか》。", "body_kana": "デパートのふゆの<sale>では、コートがはんがくになり、かいてんまえからいりぐちにぎょうれつができていた。"}, {"word": "salt", "meaning_jp": "塩", "pos": "名", "body": "スイカにひとつまみの<salt>をかけると、不思議と甘みが引き立つ。祖母直伝の食べ方だ。", "choices": ["塩", "砂糖", "酢", "油"], "correct_index": 0, "explanation": "salty = 塩辛い。sugar(砂糖)と対で覚える。", "id": "s4_449", "body_ruby": "スイカにひとつまみの<salt>をかけると、不思議《ふしぎ》と甘《あま》みが｜引き立《ひきた》つ。祖母《そぼ》直伝《じきでん》の｜食べ方《たべかた》だ。", "choices_ruby": ["塩《しお》", "砂糖《さとう》", "酢《す》", "油《あぶら》"], "explanation_ruby": "salty = 塩辛《しおから》い。sugar(砂糖《さとう》)と対《つい》で覚《おぼ》える。", "body_kana": "スイカにひとつまみの<salt>をかけると、ふしぎとあまみがひきたつ。そぼじきでんのたべかただ。"}, {"word": "scare", "meaning_jp": "怖がらせる", "pos": "動", "body": "ドアの陰から「わっ!」と飛び出して妹を<scare>したら、泣かれてしまい、母に叱られた。", "choices": ["怖がらせる", "笑わせる", "喜ばせる", "落ち着かせる"], "correct_index": 0, "explanation": "scary = 怖い。be scared = 怖がる。", "id": "s4_450", "body_ruby": "ドアの陰《かげ》から「わっ!」と｜飛び出《とびだ》して妹《いもうと》を<scare>したら、泣《な》かれてしまい、母《はは》に叱《しか》られた。", "choices_ruby": ["怖《こわ》がらせる", "笑《わら》わせる", "喜《よろこ》ばせる", "｜落ち着《おちつ》かせる"], "explanation_ruby": "scary = 怖《こわ》い。be scared = 怖《こわ》がる。", "body_kana": "ドアのかげから「わっ!」ととびだしていもうとを<scare>したら、なかれてしまい、ははにしかられた。"}, {"word": "scared", "meaning_jp": "怖がった", "pos": "形", "body": "お化け屋敷の出口で、弟は<scared>のあまり私の袖を握りしめたまま、しばらく離さなかった。", "choices": ["怖がった", "退屈した", "感動した", "眠くなった"], "correct_index": 0, "explanation": "be scared of ~ = 〜を怖がる。", "id": "s4_451", "body_ruby": "お化《ば》け屋敷《やしき》の出口《でぐち》で、弟《おとうと》は<scared>のあまり私《わたし》の袖《そで》を握《にぎ》りしめたまま、しばらく離《はな》さなかった。", "choices_ruby": ["怖《こわ》がった", "退屈《たいくつ》した", "感動《かんどう》した", "眠《ねむ》くなった"], "explanation_ruby": "be scared of ~ = 〜を怖《こわ》がる。", "body_kana": "おばけやしきのでぐちで、おとうとは<scared>のあまりわたしのそでをにぎりしめたまま、しばらくはなさなかった。"}, {"word": "scary", "meaning_jp": "怖い", "pos": "形", "body": "その映画は<scary>すぎて、見終わった夜はトイレに行くのにも勇気がいった。", "choices": ["怖い", "笑える", "悲しい", "爽快な"], "correct_index": 0, "explanation": "scare(怖がらせる)+ -y。怖がらせる側の性質。", "id": "s4_452", "body_ruby": "その映画《えいが》は<scary>すぎて、見終《みお》わった夜《よる》はトイレに行《い》くのにも勇気《ゆうき》がいった。", "choices_ruby": ["怖《こわ》い", "笑《わら》える", "悲《かな》しい", "爽快《そうかい》な"], "explanation_ruby": "scare(怖《こわ》がらせる)+ -y。怖《こわ》がらせる側《がわ》の性質《せいしつ》。", "body_kana": "そのえいがは<scary>すぎて、みおわったよるはトイレにいくのにもゆうきがいった。"}, {"word": "scenery", "meaning_jp": "景色", "pos": "名", "body": "列車の窓から見える<scenery>は、ビル街から田園、やがて海岸線へと移り変わっていった。", "choices": ["景色", "天気", "騒音", "運賃"], "correct_index": 0, "explanation": "scene(場面)の仲間。自然の眺め全体。", "id": "s4_453", "body_ruby": "列車《れっしゃ》の窓《まど》から見《み》える<scenery>は、ビル街《まち》から田園《でんえん》、やがて海岸線《かいがんせん》へと移《うつ》り変《か》わっていった。", "choices_ruby": ["景色《けしき》", "天気《てんき》", "騒音《そうおん》", "運賃《うんちん》"], "explanation_ruby": "scene(場面《ばめん》)の仲間《なかま》。自然《しぜん》の眺《なが》め全体《ぜんたい》。", "body_kana": "れっしゃのまどからみえる<scenery>は、ビルまちからでんえん、やがてかいがんせんへとうつりかわっていった。"}, {"word": "schedule", "meaning_jp": "予定(表)", "pos": "名", "body": "修学旅行の<schedule>では、2日目の午前が班別行動、午後は全員で寺の見学になっている。", "choices": ["予定表", "持ち物", "費用", "感想文"], "correct_index": 0, "explanation": "on schedule = 予定どおり。", "id": "s4_454", "body_ruby": "修学旅行《しゅうがくりょこう》の<schedule>では、2日《にち》目《め》の午前《ごぜん》が班《はん》別行動《べつこうどう》、午後《ごご》は全員《ぜんいん》で寺《てら》の見学《けんがく》になっている。", "choices_ruby": ["予定表《よていひょう》", "｜持ち物《もちもの》", "費用《ひよう》", "感想文《かんそうぶん》"], "explanation_ruby": "on schedule = 予定《よてい》どおり。", "body_kana": "しゅうがくりょこうの<schedule>では、2日めのごぜんがはんべつこうどう、ごごはぜんいんでてらのけんがくになっている。"}, {"word": "score", "meaning_jp": "得点", "pos": "名", "body": "前半終了時点の<score>は2対2の同点。勝負は後半の45分に持ち越された。", "choices": ["得点", "時間", "観客数", "天候"], "correct_index": 0, "explanation": "テストの点数にも試合の点にも使う。", "id": "s4_455", "body_ruby": "前半終了《ぜんはんしゅうりょう》時点《じてん》の<score>は2対《つい》2の同点《どうてん》。勝負《しょうぶ》は後半《こうはん》の45分《ふん》に｜持ち越《もちこ》された。", "choices_ruby": ["得点《とくてん》", "時間《じかん》", "観客数《かんきゃくすう》", "天候《てんこう》"], "explanation_ruby": "テストの点数《てんすう》にも試合《しあい》の点《てん》にも使《つか》う。", "body_kana": "ぜんはんしゅうりょうじてんの<score>は2つい2のどうてん。しょうぶはこうはんの45分にもちこされた。"}, {"word": "sculpture", "meaning_jp": "彫刻", "pos": "名", "body": "公園の中央にある<sculpture>は、巨大な石から彫り出された母子の像で、台座に作者の名がある。", "choices": ["彫刻", "絵画", "噴水", "花壇"], "correct_index": 0, "explanation": "石や木を彫って作る立体作品。", "id": "s4_456", "body_ruby": "公園《こうえん》の中央《ちゅうおう》にある<sculpture>は、巨大《きょだい》な石《いし》から彫《ほ》り出《だ》された母子《ぼし》の像《ぞう》で、台座《だいざ》に作者《さくしゃ》の名《めい》がある。", "choices_ruby": ["彫刻《ちょうこく》", "絵画《かいが》", "噴水《ふんすい》", "花壇《かだん》"], "explanation_ruby": "石《いし》や木《き》を彫《ほ》って作《つく》る立体《りったい》作品《さくひん》。", "body_kana": "こうえんのちゅうおうにある<sculpture>は、きょだいないしからほりだされたぼしのぞうで、だいざにさくしゃのめいがある。"}, {"word": "search", "meaning_jp": "探す、検索する", "pos": "動", "body": "なくしたイヤホンを求めて、部屋中を1時間<search>した。結局、洗濯前のポケットから出てきた。", "choices": ["探す", "片付ける", "飾る", "捨てる"], "correct_index": 0, "explanation": "search for ~ = 〜を探す。ネット検索も search。", "id": "s4_457", "body_ruby": "なくしたイヤホンを求《もと》めて、部屋《へや》中《なか》を1時間《じかん》<search>した。結局《けっきょく》、洗濯《せんたく》前《まえ》のポケットから出《で》てきた。", "choices_ruby": ["探《さが》す", "片付《かたづ》ける", "飾《かざ》る", "捨《す》てる"], "explanation_ruby": "search for ~ = 〜を探《さが》す。ネット検索《けんさく》も search。", "body_kana": "なくしたイヤホンをもとめて、へやなかを1時間<search>した。けっきょく、せんたくまえのポケットからでてきた。"}, {"word": "seed", "meaning_jp": "種", "pos": "名", "body": "アサガオの<seed>を5月にまくと、夏休みには毎朝、紫や青の花が咲くようになった。", "choices": ["種", "葉", "根", "肥料"], "correct_index": 0, "explanation": "植物の命の元。スポーツの「シード権」も同じ語。", "id": "s4_458", "body_ruby": "アサガオの<seed>を5月《がつ》にまくと、夏休《なつやす》みには毎朝《まいあさ》、紫《むらさき》や青《あお》の花《はな》が咲《さ》くようになった。", "choices_ruby": ["種《たね》", "葉《は》", "根《ね》", "肥料《ひりょう》"], "explanation_ruby": "植物《しょくぶつ》の命《いのち》の元《もと》。スポーツの「シード権《けん》」も同《おな》じ語《ご》。", "body_kana": "アサガオの<seed>を5月にまくと、なつやすみにはまいあさ、むらさきやあおのはながさくようになった。"}, {"word": "seem", "meaning_jp": "〜のように見える", "pos": "動", "body": "彼は「平気だよ」と笑ったが、声が小さくて、本当はつらいように<seem>した。", "choices": ["〜のように見える", "〜と断言する", "〜を証明する", "〜を否定する"], "correct_index": 0, "explanation": "seem to ~ = 〜するように思われる。", "id": "s4_459", "body_ruby": "彼《かれ》は「平気《へいき》だよ」と笑《わら》ったが、声《こえ》が小《ちい》さくて、本当《ほんとう》はつらいように<seem>した。", "choices_ruby": ["〜のように見《み》える", "〜と断言《だんげん》する", "〜を証明《しょうめい》する", "〜を否定《ひてい》する"], "explanation_ruby": "seem to ~ = 〜するように思《おも》われる。", "body_kana": "かれは「へいきだよ」とわらったが、こえがちいさくて、ほんとうはつらいように<seem>した。"}, {"word": "senior", "meaning_jp": "年上の(人)、上級生", "pos": "名/形", "body": "部活の<senior>たちが引退する日、後輩全員で色紙を渡し、最後のミーティングは涙で終わった。", "choices": ["上級生", "下級生", "同級生", "先生"], "correct_index": 0, "explanation": "junior(年下)の対。senior citizen = 高齢者。", "id": "s4_460", "body_ruby": "部活《ぶかつ》の<senior>たちが引退《いんたい》する日《にち》、後輩《こうはい》全員《ぜんいん》で色紙《しきし》を渡《わた》し、最後《さいご》のミーティングは涙《なみだ》で終《お》わった。", "choices_ruby": ["上級生《じょうきゅうせい》", "下級生《かきゅうせい》", "同級生《どうきゅうせい》", "先生《せんせい》"], "explanation_ruby": "junior(年下《としした》)の対《つい》。senior citizen = 高齢者《こうれいしゃ》。", "body_kana": "ぶかつの<senior>たちがいんたいするにち、こうはいぜんいんでしきしをわたし、さいごのミーティングはなみだでおわった。"}, {"word": "sense", "meaning_jp": "感覚", "pos": "名", "body": "犬の嗅覚は人間の数千倍ともいわれ、においの<sense>では人はとてもかなわない。", "choices": ["感覚", "体力", "記憶", "速さ"], "correct_index": 0, "explanation": "five senses = 五感。sense of humor = ユーモアのセンス。", "id": "s4_461", "body_ruby": "犬《いぬ》の嗅覚《きゅうかく》は人間《にんげん》の数千《すうせん》倍《ばい》ともいわれ、においの<sense>では人《にん》はとてもかなわない。", "choices_ruby": ["感覚《かんかく》", "体力《たいりょく》", "記憶《きおく》", "速《はや》さ"], "explanation_ruby": "five senses = 五感《ごかん》。sense of humor = ユーモアのセンス。", "body_kana": "いぬのきゅうかくはにんげんのすうせんばいともいわれ、においの<sense>ではにんはとてもかなわない。"}, {"word": "separate", "meaning_jp": "分ける、離す", "pos": "動", "body": "ごみは燃えるものとプラスチックに<separate>して、それぞれ決められた曜日に出す。", "choices": ["分ける", "混ぜる", "固める", "燃やす"], "correct_index": 0, "explanation": "separation = 分離。形容詞では「別々の」。", "id": "s4_462", "body_ruby": "ごみは燃《も》えるものとプラスチックに<separate>して、それぞれ決《き》められた曜日《ようび》に出《だ》す。", "choices_ruby": ["分《わ》ける", "混《ま》ぜる", "固《かた》める", "燃《も》やす"], "explanation_ruby": "separation = 分離《ぶんり》。形容詞《けいようし》では「別々《べつべつ》の」。", "body_kana": "ごみはもえるものとプラスチックに<separate>して、それぞれきめられたようびにだす。"}, {"word": "seventeenth", "meaning_jp": "17番目の", "pos": "形", "body": "<seventeenth>世紀の日本は江戸時代の始まりにあたり、1600年代の町や街道が整備されていった。", "choices": ["17番目の", "7番目の", "70番目の", "17個の"], "correct_index": 0, "explanation": "seventeen(17)+ -th。", "id": "s4_463", "body_ruby": "<seventeenth>世紀《せいき》の日本《にっぽん》は江戸時代《えどじだい》の始《はじ》まりにあたり、1600年《ねん》代《だい》の町《まち》や街道《かいどう》が整備《せいび》されていった。", "choices_ruby": ["17番目《ばんめ》の", "7番目《ばんめ》の", "70番目《ばんめ》の", "17個《こ》の"], "explanation_ruby": "seventeen(17)+ -th。", "body_kana": "<seventeenth>せいきのにっぽんはえどじだいのはじまりにあたり、1600年だいのまちやかいどうがせいびされていった。"}, {"word": "severe", "meaning_jp": "厳しい、深刻な", "pos": "形", "body": "今年の冬は<severe>な寒さが続き、水道管の凍結で断水する家が相次いだ。", "choices": ["厳しい", "穏やかな", "短い", "暖かい"], "correct_index": 0, "explanation": "程度がひどいこと。severe pain = 激痛。", "id": "s4_464", "body_ruby": "今年《ことし》の冬《ふゆ》は<severe>な寒《さむ》さが続《つづ》き、水道管《すいどうかん》の凍結《とうけつ》で断水《だんすい》する家《いえ》が相次《あいつ》いだ。", "choices_ruby": ["厳《きび》しい", "穏《おだ》やかな", "短《みじか》い", "暖《あたた》かい"], "explanation_ruby": "程度《ていど》がひどいこと。severe pain = 激痛《げきつう》。", "body_kana": "ことしのふゆは<severe>なさむさがつづき、すいどうかんのとうけつでだんすいするいえがあいついだ。"}, {"word": "shade", "meaning_jp": "日陰", "pos": "名", "body": "炎天下の公園で、大きな木の<shade>に入ると、体感の温度が5度は下がった気がした。", "choices": ["日陰", "日なた", "屋上", "水辺"], "correct_index": 0, "explanation": "光をさえぎってできる陰。shadow は形のある「影」。", "id": "s4_465", "body_ruby": "炎天下《えんてんか》の公園《こうえん》で、大《おお》きな木《き》の<shade>に入《はい》ると、体感《たいかん》の温度《おんど》が5度《ど》は下《さ》がった気《き》がした。", "choices_ruby": ["日陰《ひかげ》", "日《にち》なた", "屋上《おくじょう》", "水辺《すいへん》"], "explanation_ruby": "光《ひかり》をさえぎってできる陰《いん》。shadow は形《かたち》のある「影《かげ》」。", "body_kana": "えんてんかのこうえんで、おおきなきの<shade>にはいると、たいかんのおんどが5どはさがったきがした。"}, {"word": "shake", "meaning_jp": "振る、揺れる", "pos": "動", "body": "ドレッシングは油と酢が分離しているので、使う前によく<shake>してからかける。", "choices": ["振る", "注ぐ", "冷やす", "温める"], "correct_index": 0, "explanation": "shake hands = 握手する。shake-shook-shaken。", "id": "s4_466", "body_ruby": "ドレッシングは油《あぶら》と酢《す》が分離《ぶんり》しているので、使《つか》う前《まえ》によく<shake>してからかける。", "choices_ruby": ["振《ふ》る", "注《そそ》ぐ", "冷《ひ》やす", "温《あたた》める"], "explanation_ruby": "shake hands = 握手《あくしゅ》する。shake-shook-shaken。", "body_kana": "ドレッシングはあぶらとすがぶんりしているので、つかうまえによく<shake>してからかける。"}, {"word": "shelf", "meaning_jp": "棚", "pos": "名", "body": "本屋の新刊の<shelf>に、ずっと待っていた続編が平積みされていて、迷わずレジへ持っていった。", "choices": ["棚", "床", "袋", "箱"], "correct_index": 0, "explanation": "複数形は shelves。bookshelf = 本棚。", "id": "s4_467", "body_ruby": "本屋《ほんや》の新刊《しんかん》の<shelf>に、ずっと待《ま》っていた続編《ぞくへん》が平積《ひらづ》みされていて、迷《まよ》わずレジへ持《も》っていった。", "choices_ruby": ["棚《たな》", "床《ゆか》", "袋《ふくろ》", "箱《はこ》"], "explanation_ruby": "複数形《ふくすうけい》は shelves。bookshelf = 本棚《ほんだな》。", "body_kana": "ほんやのしんかんの<shelf>に、ずっとまっていたぞくへんがひらづみされていて、まよわずレジへもっていった。"}, {"word": "shiny", "meaning_jp": "ぴかぴかの", "pos": "形", "body": "磨き上げた革靴は<shiny>で、つま先に窓の光が映り込むほどだった。", "choices": ["ぴかぴかの", "くすんだ", "汚れた", "破れた"], "correct_index": 0, "explanation": "shine(輝く)+ -y。", "id": "s4_468", "body_ruby": "磨《みが》き上《あ》げた革靴《かわぐつ》は<shiny>で、つま先《さき》に窓《まど》の光《ひかり》が映《うつ》り込《こ》むほどだった。", "choices_ruby": ["ぴかぴかの", "くすんだ", "汚《よご》れた", "破《やぶ》れた"], "explanation_ruby": "shine(輝《かがや》く)+ -y。", "body_kana": "みがきあげたかわぐつは<shiny>で、つまさきにまどのひかりがうつりこむほどだった。"}, {"word": "ship", "meaning_jp": "船", "pos": "名", "body": "港には全長300メートルの<ship>が停泊していて、コンテナがクレーンで次々と積み込まれていた。", "choices": ["船", "飛行機", "列車", "トラック"], "correct_index": 0, "explanation": "boat より大型の船。spaceship = 宇宙船。", "id": "s4_469", "body_ruby": "港《みなと》には全長《ぜんちょう》300メートルの<ship>が停泊《ていはく》していて、コンテナがクレーンで次々《つぎつぎ》と積《つ》み込《こ》まれていた。", "choices_ruby": ["船《ふね》", "飛行機《ひこうき》", "列車《れっしゃ》", "トラック"], "explanation_ruby": "boat より大型《おおがた》の船《ふね》。spaceship = 宇宙船《うちゅうせん》。", "body_kana": "みなとにはぜんちょう300メートルの<ship>がていはくしていて、コンテナがクレーンでつぎつぎとつみこまれていた。"}, {"word": "shouldn't", "meaning_jp": "〜すべきでない", "pos": "助", "body": "「夜ふかしは<shouldn't>だよ」と母は言うが、その母は深夜ドラマを毎週欠かさず見ている。", "choices": ["〜すべきでない", "〜すべきだ", "〜してもよい", "〜したい"], "correct_index": 0, "explanation": "should not の短縮形。", "id": "s4_470", "body_ruby": "「夜《よる》ふかしは<shouldn't>だよ」と母《はは》は言《い》うが、その母《はは》は深夜《しんや》ドラマを毎週《まいしゅう》欠《か》かさず見《み》ている。", "choices_ruby": ["〜すべきでない", "〜すべきだ", "〜してもよい", "〜したい"], "explanation_ruby": "should not の短縮形《たんしゅくけい》。", "body_kana": "「よるふかしは<shouldn't>だよ」とはははいうが、そのはははしんやドラマをまいしゅうかかさずみている。"}, {"word": "shout", "meaning_jp": "叫ぶ", "pos": "動", "body": "ホームの端で転びそうな子を見て、駅員が「危ない!」と<shout>し、周りの大人が駆け寄った。", "choices": ["叫ぶ", "ささやく", "黙る", "歌う"], "correct_index": 0, "explanation": "大声を出すこと。", "id": "s4_471", "body_ruby": "ホームの端《はじ》で転《ころ》びそうな子《こ》を見《み》て、駅員《えきいん》が「危《あぶ》ない!」と<shout>し、周《まわ》りの大人《おとな》が駆《か》け寄《よ》った。", "choices_ruby": ["叫《さけ》ぶ", "ささやく", "黙《だま》る", "歌《うた》う"], "explanation_ruby": "大声《おおごえ》を出《だ》すこと。", "body_kana": "ホームのはじでころびそうなこをみて、えきいんが「あぶない!」と<shout>し、まわりのおとながかけよった。"}, {"word": "shower", "meaning_jp": "シャワー、にわか雨", "pos": "名", "body": "部活の後、汗を流しに熱い<shower>を浴びると、疲れが半分くらいお湯と一緒に流れていく。", "choices": ["シャワー", "湯船", "プール", "温泉"], "correct_index": 0, "explanation": "take a shower = シャワーを浴びる。「にわか雨」も。", "id": "s4_472", "body_ruby": "部活《ぶかつ》の後《あと》、汗《あせ》を流《なが》しに熱《あつ》い<shower>を浴《あ》びると、疲《つか》れが半分《はんぶん》くらいお湯《ゆ》と一緒《いっしょ》に流《なが》れていく。", "choices_ruby": ["シャワー", "湯船《ゆぶね》", "プール", "温泉《おんせん》"], "explanation_ruby": "take a shower = シャワーを浴《あ》びる。「にわか雨《あめ》」も。", "body_kana": "ぶかつのあと、あせをながしにあつい<shower>をあびると、つかれがはんぶんくらいおゆといっしょにながれていく。"}, {"word": "shut", "meaning_jp": "閉める", "pos": "動", "body": "強風で窓がバタンと<shut>して、その音に教室中が一斉に振り返った。", "choices": ["閉まる", "開く", "割れる", "曇る"], "correct_index": 0, "explanation": "shut-shut-shut(無変化)。close とほぼ同じ。", "id": "s4_473", "body_ruby": "強風《きょうふう》で窓《まど》がバタンと<shut>して、その音《おと》に教室《きょうしつ》中《なか》が一斉《いっせい》に｜振り返《ふりかえ》った。", "choices_ruby": ["閉《し》まる", "開《ひら》く", "割《わ》れる", "曇《くも》る"], "explanation_ruby": "shut-shut-shut(無変化《むへんか》)。close とほぼ同《おな》じ。", "body_kana": "きょうふうでまどがバタンと<shut>して、そのおとにきょうしつなかがいっせいにふりかえった。"}, {"word": "sigh", "meaning_jp": "ため息(をつく)", "pos": "名/動", "body": "テスト範囲の広さを見て、彼は深い<sigh>をひとつつき、それでもペンを握り直した。", "choices": ["ため息", "あくび", "くしゃみ", "笑い声"], "correct_index": 0, "explanation": "gh は発音しない(サイ)。落胆や安堵の息。", "id": "s4_474", "body_ruby": "テスト範囲《はんい》の広《ひろ》さを見《み》て、彼《かれ》は深《ふか》い<sigh>をひとつつき、それでもペンを握《にぎ》り直《なお》した。", "choices_ruby": ["ため息《いき》", "あくび", "くしゃみ", "笑《わら》い声《こえ》"], "explanation_ruby": "gh は発音《はつおん》しない(サイ)。落胆《らくたん》や安堵《あんど》の息《いき》。", "body_kana": "テストはんいのひろさをみて、かれはふかい<sigh>をひとつつき、それでもペンをにぎりなおした。"}, {"word": "sightseeing", "meaning_jp": "観光", "pos": "名", "body": "京都での自由行動は、班ごとに<sightseeing>の計画を立て、清水寺と金閣寺を1日で回った。", "choices": ["観光", "出張", "通学", "引っ越し"], "correct_index": 0, "explanation": "sight(名所)+ seeing(見ること)。", "id": "s4_475", "body_ruby": "京都《きょうと》での自由行動《じゆうこうどう》は、班《はん》ごとに<sightseeing>の計画《けいかく》を立《た》て、清水寺《きよみずでら》と金閣寺《きんかくじ》を1日《にち》で回《まわ》った。", "choices_ruby": ["観光《かんこう》", "出張《しゅっちょう》", "通学《つうがく》", "｜引っ越《ひっこ》し"], "explanation_ruby": "sight(名所《めいしょ》)+ seeing(見《み》ること)。", "body_kana": "きょうとでのじゆうこうどうは、はんごとに<sightseeing>のけいかくをたて、きよみずでらときんかくじを1日でまわった。"}, {"word": "similar", "meaning_jp": "似ている", "pos": "形", "body": "私と親友は好みがとても<similar>で、別々に買った筆箱が色違いの同じ商品だったこともある。", "choices": ["似ている", "正反対の", "無関係の", "同一の"], "correct_index": 0, "explanation": "be similar to ~ = 〜と似ている。", "id": "s4_476", "body_ruby": "私《わたし》と親友《しんゆう》は好《この》みがとても<similar>で、別々《べつべつ》に買《か》った筆箱《ふでばこ》が色《いろ》違《ちが》いの同《おな》じ商品《しょうひん》だったこともある。", "choices_ruby": ["似《に》ている", "正反対《せいはんたい》の", "無関係《むかんけい》の", "同一《どういつ》の"], "explanation_ruby": "be similar to ~ = 〜と似《に》ている。", "body_kana": "わたしとしんゆうはこのみがとても<similar>で、べつべつにかったふでばこがいろちがいのおなじしょうひんだったこともある。"}, {"word": "sincerely", "meaning_jp": "心から、敬具", "pos": "副", "body": "英語の手紙のいちばん最後には「<sincerely>」と書く。日本語の手紙の「敬具」にあたる結びの言葉だ。", "choices": ["心を込めて(敬具)", "拝啓", "追伸", "様"], "correct_index": 0, "explanation": "sincere(誠実な)+ -ly。手紙の結語の定番。", "id": "s4_477", "body_ruby": "英語《えいご》の手紙《てがみ》のいちばん最後《さいご》には「<sincerely>」と書《か》く。日本語《にほんご》の手紙《てがみ》の「敬具《けいぐ》」にあたる結《むす》びの言葉《ことば》だ。", "choices_ruby": ["心《こころ》を込《こ》めて(敬具《けいぐ》)", "拝啓《はいけい》", "追伸《ついしん》", "様《さま》"], "explanation_ruby": "sincere(誠実《せいじつ》な)+ -ly。手紙《てがみ》の結語《けつご》の定番《ていばん》。", "body_kana": "えいごのてがみのいちばんさいごには「<sincerely>」とかく。にほんごのてがみの「けいぐ」にあたるむすびのことばだ。"}, {"word": "singing", "meaning_jp": "歌うこと、歌声", "pos": "名", "body": "朝の教室に、音楽室から合唱部の<singing>が聞こえてくる。三部合唱のハーモニーが廊下に響く。", "choices": ["歌声", "楽器の音", "話し声", "足音"], "correct_index": 0, "explanation": "sing + -ing。", "id": "s4_478", "body_ruby": "朝《あさ》の教室《きょうしつ》に、音楽《おんがく》室《しつ》から合唱《がっしょう》部《ぶ》の<singing>が聞《き》こえてくる。三部《さんぶ》合唱《がっしょう》のハーモニーが廊下《ろうか》に響《ひび》く。", "choices_ruby": ["歌声《うたごえ》", "楽器《がっき》の音《おと》", "｜話し声《はなしごえ》", "足音《あしおと》"], "explanation_ruby": "sing + -ing。", "body_kana": "あさのきょうしつに、おんがくしつからがっしょうぶの<singing>がきこえてくる。さんぶがっしょうのハーモニーがろうかにひびく。"}, {"word": "single", "meaning_jp": "たった1つの、独身の", "pos": "形", "body": "彼は<single>のミスもなく、50問の計算を全問正解した。見直しを3回したそうだ。", "choices": ["たった1つの", "たくさんの", "半分の", "二重の"], "correct_index": 0, "explanation": "every single day = 毎日欠かさず。", "id": "s4_479", "body_ruby": "彼《かれ》は<single>のミスもなく、50問《もん》の計算《けいさん》を全問正解《ぜんもんせいかい》した。見直《みなお》しを3回《かい》したそうだ。", "choices_ruby": ["たった1つの", "たくさんの", "半分《はんぶん》の", "二重《にじゅう》の"], "explanation_ruby": "every single day = 毎日《まいにち》欠《か》かさず。", "body_kana": "かれは<single>のミスもなく、50問のけいさんをぜんもんせいかいした。みなおしを3回したそうだ。"}, {"word": "skillful", "meaning_jp": "熟練した、上手な", "pos": "形", "body": "屋台の職人は<skillful>な手つきで、たこ焼きを2本のきりだけでくるくると回し続けた。", "choices": ["熟練した", "不器用な", "初心者の", "雑な"], "correct_index": 0, "explanation": "skill(技術)+ -ful。", "id": "s4_480", "body_ruby": "屋台《やたい》の職人《しょくにん》は<skillful>な手《て》つきで、たこ焼《や》きを2本《ほん》のきりだけでくるくると回《まわ》し続《つづ》けた。", "choices_ruby": ["熟練《じゅくれん》した", "不器用《ぶきよう》な", "初心者《しょしんしゃ》の", "雑《ざつ》な"], "explanation_ruby": "skill(技術《ぎじゅつ》)+ -ful。", "body_kana": "やたいのしょくにんは<skillful>なてつきで、たこやきを2本のきりだけでくるくるとまわしつづけた。"}, {"word": "slowly", "meaning_jp": "ゆっくりと", "pos": "副", "body": "祖父は習字の筆を<slowly>に運び、一画一画に時間をかけて「忍」の字を書き上げた。", "choices": ["ゆっくりと", "素早く", "乱暴に", "適当に"], "correct_index": 0, "explanation": "slow(遅い)+ -ly。quickly(速く)の対。", "id": "s4_481", "body_ruby": "祖父《そふ》は習字《しゅうじ》の筆《ふで》を<slowly>に運《はこ》び、一画《いっかく》一画《いっかく》に時間《じかん》をかけて「忍《にん》」の字《じ》を｜書き上《かきあ》げた。", "choices_ruby": ["ゆっくりと", "素早《すばや》く", "乱暴《らんぼう》に", "適当《てきとう》に"], "explanation_ruby": "slow(遅《おそ》い)+ -ly。quickly(速《はや》く)の対《つい》。", "body_kana": "そふはしゅうじのふでを<slowly>にはこび、いっかくいっかくにじかんをかけて「にん」のじをかきあげた。"}, {"word": "smart", "meaning_jp": "賢い", "pos": "形", "body": "彼女はクラスでいちばん<smart>で、先生が出した難問にも、別解まで添えて答えてしまう。", "choices": ["賢い", "細い", "おしゃれなだけ", "速い"], "correct_index": 0, "explanation": "日本語の「スマート(細い)」とは意味が違う。", "id": "s4_482", "body_ruby": "彼女《かのじょ》はクラスでいちばん<smart>で、先生《せんせい
