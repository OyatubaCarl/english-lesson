ょうぐち》。", "body_kana": "<emergency>のときは、このあかいボタンをおすとでんしゃがとまる。「いたずらははんざいです」とちゅういがきがある。"}, {"word": "ending", "meaning_jp": "結末", "pos": "名", "body": "その映画の<ending>は予想外で、最後の3分で全ての謎が裏返り、館内がざわついた。", "choices": ["結末", "冒頭", "中盤", "予告"], "correct_index": 0, "explanation": "end + -ing。happy ending = ハッピーエンド。", "id": "s4_164", "body_ruby": "その映画《えいが》の<ending>は予想外《よそうがい》で、最後《さいご》の3分《ふん》で全《すべ》ての謎《なぞ》が裏《うら》返《かえ》り、館内《かんない》がざわついた。", "choices_ruby": ["結末《けつまつ》", "冒頭《ぼうとう》", "中盤《ちゅうばん》", "予告《よこく》"], "explanation_ruby": "end + -ing。happy ending = ハッピーエンド。", "body_kana": "そのえいがの<ending>はよそうがいで、さいごの3分ですべてのなぞがうらかえり、かんないがざわついた。"}, {"word": "entertainment", "meaning_jp": "娯楽、エンターテインメント", "pos": "名", "body": "映画、音楽、ゲーム。<entertainment>の世界は、人を楽しませる工夫であふれている。", "choices": ["娯楽", "労働", "義務", "勉強"], "correct_index": 0, "explanation": "entertain(楽しませる)の名詞形。", "id": "s4_165", "body_ruby": "映画《えいが》、音楽《おんがく》、ゲーム。<entertainment>の世界《せかい》は、人《にん》を楽《たの》しませる工夫《くふう》であふれている。", "choices_ruby": ["娯楽《ごらく》", "労働《ろうどう》", "義務《ぎむ》", "勉強《べんきょう》"], "explanation_ruby": "entertain(楽《たの》しませる)の名詞《めいし》形《かたち》。", "body_kana": "えいが、おんがく、ゲーム。<entertainment>のせかいは、にんをたのしませるくふうであふれている。"}, {"word": "entrance", "meaning_jp": "入口", "pos": "名", "body": "美術館の<entrance>でチケットを見せ、パンフレットを受け取ってから展示室へ進んだ。", "choices": ["入口", "出口", "屋上", "地下"], "correct_index": 0, "explanation": "enter(入る)の名詞形。entrance exam = 入学試験。", "id": "s4_166", "body_ruby": "美術館《びじゅつかん》の<entrance>でチケットを見《み》せ、パンフレットを｜受け取《うけと》ってから展示室《てんじしつ》へ進《すす》んだ。", "choices_ruby": ["入口《いりぐち》", "出口《でぐち》", "屋上《おくじょう》", "地下《ちか》"], "explanation_ruby": "enter(入《はい》る)の名詞《めいし》形《かたち》。entrance exam = 入学試験《にゅうがくしけん》。", "body_kana": "びじゅつかんの<entrance>でチケットをみせ、パンフレットをうけとってからてんじしつへすすんだ。"}, {"word": "environment", "meaning_jp": "環境", "pos": "名", "body": "レジ袋の有料化は、プラスチックごみを減らして<environment>を守るための取り組みのひとつだ。", "choices": ["環境", "経済", "教育", "交通"], "correct_index": 0, "explanation": "environmental = 環境の。自然環境・周囲の状況。", "id": "s4_167", "body_ruby": "レジ袋《ふくろ》の有料化《ゆうりょうか》は、プラスチックごみを減《へ》らして<environment>を守《まも》るための｜取り組《とりく》みのひとつだ。", "choices_ruby": ["環境《かんきょう》", "経済《けいざい》", "教育《きょういく》", "交通《こうつう》"], "explanation_ruby": "environmental = 環境《かんきょう》の。自然環境《しぜんかんきょう》・周囲《しゅうい》の状況《じょうきょう》。", "body_kana": "レジふくろのゆうりょうかは、プラスチックごみをへらして<environment>をまもるためのとりくみのひとつだ。"}, {"word": "equal", "meaning_jp": "等しい、平等な", "pos": "形", "body": "ケーキを4人で<equal>に分けるため、定規で測って90度ずつ切った。誰の分も同じ大きさだ。", "choices": ["等しい", "ばらばらの", "大きめの", "余った"], "correct_index": 0, "explanation": "equality = 平等。イコール(=)の語源。", "id": "s4_168", "body_ruby": "ケーキを4人《にん》で<equal>に分《わ》けるため、定規《じょうぎ》で測《はか》って90度《ど》ずつ切《き》った。誰《だれ》の分《ふん》も同《おな》じ大《おお》きさだ。", "choices_ruby": ["等《ひと》しい", "ばらばらの", "大《おお》きめの", "余《あま》った"], "explanation_ruby": "equality = 平等《びょうどう》。イコール(=)の語源《ごげん》。", "body_kana": "ケーキを4人で<equal>にわけるため、じょうぎではかって90どずつきった。だれのふんもおなじおおきさだ。"}, {"word": "era", "meaning_jp": "時代", "pos": "名", "body": "昭和、平成、令和。日本では天皇の代替わりごとに<era>の名前が変わり、硬貨にも刻まれる。", "choices": ["時代", "場所", "通貨", "法律"], "correct_index": 0, "explanation": "period より大きな区切りの時代。", "id": "s4_169", "body_ruby": "昭和《しょうわ》、平成《へいせい》、令和《れいわ》。日本《にっぽん》では天皇《てんのう》の代替《だいたい》わりごとに<era>の名前《なまえ》が変《か》わり、硬貨《こうか》にも刻《きざ》まれる。", "choices_ruby": ["時代《じだい》", "場所《ばしょ》", "通貨《つうか》", "法律《ほうりつ》"], "explanation_ruby": "period より大《おお》きな区切《くぎ》りの時代《じだい》。", "body_kana": "しょうわ、へいせい、れいわ。にっぽんではてんのうのだいたいわりごとに<era>のなまえがかわり、こうかにもきざまれる。"}, {"word": "Europe", "meaning_jp": "ヨーロッパ", "pos": "名", "body": "<Europe>にはフランス、ドイツ、イタリアなど40以上の国があり、多くの国が陸続きで国境を接する。", "choices": ["ヨーロッパ", "アジア", "アフリカ", "南米"], "correct_index": 0, "explanation": "European = ヨーロッパの。", "id": "s4_170", "body_ruby": "<Europe>にはフランス、ドイツ、イタリアなど40以上《いじょう》の国《くに》があり、多《おお》くの国《くに》が陸《りく》続《つづ》きで国境《こっきょう》を接《せっ》する。", "choices_ruby": ["ヨーロッパ", "アジア", "アフリカ", "南米《なんべい》"], "explanation_ruby": "European = ヨーロッパの。", "body_kana": "<Europe>にはフランス、ドイツ、イタリアなど40いじょうのくにがあり、おおくのくにがりくつづきでこっきょうをせっする。"}, {"word": "evacuation", "meaning_jp": "避難", "pos": "名", "body": "津波警報が出たら、ためらわず高台への<evacuation>を始める。1分の判断が命を分ける。", "choices": ["避難", "見物", "帰宅", "捜索"], "correct_index": 0, "explanation": "evacuate(避難する)の名詞形。evacuation site = 避難場所。", "id": "s4_171", "body_ruby": "津波《つなみ》警報《けいほう》が出《で》たら、ためらわず高台《たかだい》への<evacuation>を始《はじ》める。1分《ふん》の判断《はんだん》が命《いのち》を分《わ》ける。", "choices_ruby": ["避難《ひなん》", "見物《けんぶつ》", "帰宅《きたく》", "捜索《そうさく》"], "explanation_ruby": "evacuate(避難《ひなん》する)の名詞《めいし》形《かたち》。evacuation site = 避難場所《ひなんばしょ》。", "body_kana": "つなみけいほうがでたら、ためらわずたかだいへの<evacuation>をはじめる。1分のはんだんがいのちをわける。"}, {"word": "exactly", "meaning_jp": "正確に、ちょうど", "pos": "副", "body": "目覚ましをかけなくても、祖父は毎朝<exactly>5時に目が覚めるという。時計より正確だ。", "choices": ["ちょうど", "だいたい", "たまに", "遅れて"], "correct_index": 0, "explanation": "exact(正確な)+ -ly。Exactly! = その通り!", "id": "s4_172", "body_ruby": "目覚《めざ》ましをかけなくても、祖父《そふ》は毎朝《まいあさ》<exactly>5時《じ》に目《め》が覚《さ》めるという。時計《とけい》より正確《せいかく》だ。", "choices_ruby": ["ちょうど", "だいたい", "たまに", "遅《おく》れて"], "explanation_ruby": "exact(正確《せいかく》な)+ -ly。Exactly! = その通《とお》り!", "body_kana": "めざましをかけなくても、そふはまいあさ<exactly>5時にめがさめるという。とけいよりせいかくだ。"}, {"word": "excellent", "meaning_jp": "非常に優れた", "pos": "形", "body": "彼女の自由研究は、観察記録が3か月分そろった<excellent>な内容で、県の科学展に推薦された。", "choices": ["非常に優れた", "平凡な", "未完成の", "コピーした"], "correct_index": 0, "explanation": "good より上の褒め言葉。Excellent! = 素晴らしい!", "id": "s4_173", "body_ruby": "彼女《かのじょ》の自由研究《じゆうけんきゅう》は、観察《かんさつ》記録《きろく》が3か月《かげつ》分《ふん》そろった<excellent>な内容《ないよう》で、県《けん》の科学《かがく》展《てん》に推薦《すいせん》された。", "choices_ruby": ["非常《ひじょう》に優《まさ》れた", "平凡《へいぼん》な", "未完成《みかんせい》の", "コピーした"], "explanation_ruby": "good より上《うえ》の褒《ほ》め言葉《ことば》。Excellent! = 素晴《すば》らしい!", "body_kana": "かのじょのじゆうけんきゅうは、かんさつきろくが3かかげつふんそろった<excellent>なないようで、けんのかがくてんにすいせんされた。"}, {"word": "exhibition", "meaning_jp": "展覧会", "pos": "名", "body": "ゴッホの<exhibition>には、ひまわりの本物の絵を見ようと、開館前から長い列ができていた。", "choices": ["展覧会", "演奏会", "競技会", "講演会"], "correct_index": 0, "explanation": "exhibit(展示する)の名詞形。作品を見せる催し。", "id": "s4_174", "body_ruby": "ゴッホの<exhibition>には、ひまわりの本物《ほんもの》の絵《え》を見《み》ようと、開館《かいかん》前《ぜん》から長《なが》い列《れつ》ができていた。", "choices_ruby": ["展覧会《てんらんかい》", "演奏会《えんそうかい》", "競技会《きょうぎかい》", "講演会《こうえんかい》"], "explanation_ruby": "exhibit(展示《てんじ》する)の名詞《めいし》形《かたち》。作品《さくひん》を見《み》せる催《もよお》し。", "body_kana": "ゴッホの<exhibition>には、ひまわりのほんもののえをみようと、かいかんぜんからながいれつができていた。"}, {"word": "expression", "meaning_jp": "表現、表情", "pos": "名", "body": "「ヤバい」という言葉は便利だが、嬉しいのか困っているのか、<expression>としては曖昧だ。", "choices": ["表現", "発音", "文字", "翻訳"], "correct_index": 0, "explanation": "express(表現する)の名詞形。顔の「表情」も。", "id": "s4_175", "body_ruby": "「ヤバい」という言葉《ことば》は便利《べんり》だが、嬉《うれ》しいのか困《こま》っているのか、<expression>としては曖昧《あいまい》だ。", "choices_ruby": ["表現《ひょうげん》", "発音《はつおん》", "文字《もじ》", "翻訳《ほんやく》"], "explanation_ruby": "express(表現《ひょうげん》する)の名詞《めいし》形《かたち》。顔《かお》の「表情《ひょうじょう》」も。", "body_kana": "「ヤバい」ということばはべんりだが、うれしいのかこまっているのか、<expression>としてはあいまいだ。"}, {"word": "eyesight", "meaning_jp": "視力", "pos": "名", "body": "黒板の字がぼやけるので眼科へ行くと、<eyesight>が両目とも0.3まで下がっていた。", "choices": ["視力", "聴力", "体力", "記憶力"], "correct_index": 0, "explanation": "eye(目)+ sight(見ること)。", "id": "s4_176", "body_ruby": "黒板《こくばん》の字《じ》がぼやけるので眼科《がんか》へ行《い》くと、<eyesight>が両目《りょうめ》とも0.3まで下《さ》がっていた。", "choices_ruby": ["視力《しりょく》", "聴力《ちょうりょく》", "体力《たいりょく》", "記憶力《きおくりょく》"], "explanation_ruby": "eye(目《め》)+ sight(見《み》ること)。", "body_kana": "こくばんのじがぼやけるのでがんかへいくと、<eyesight>がりょうめとも0.3までさがっていた。"}, {"word": "facility", "meaning_jp": "施設", "pos": "名", "body": "この市民<facility>には、プール、図書室、音楽スタジオがそろっていて、中学生は無料で使える。", "choices": ["施設", "制度", "行事", "団体"], "correct_index": 0, "explanation": "特定の目的のための建物・設備。", "id": "s4_177", "body_ruby": "この市民《しみん》<facility>には、プール、図書室《としょしつ》、音楽《おんがく》スタジオがそろっていて、中学生《ちゅうがくせい》は無料《むりょう》で使《つか》える。", "choices_ruby": ["施設《しせつ》", "制度《せいど》", "行事《ぎょうじ》", "団体《だんたい》"], "explanation_ruby": "特定《とくてい》の目的《もくてき》のための建物《たてもの》・設備《せつび》。", "body_kana": "このしみん<facility>には、プール、としょしつ、おんがくスタジオがそろっていて、ちゅうがくせいはむりょうでつかえる。"}, {"word": "fact", "meaning_jp": "事実", "pos": "名", "body": "「ナポレオンは背が低かった」は有名な話だが、当時の平均身長と比べると低くないというのが<fact>らしい。", "choices": ["事実", "うわさ", "願望", "冗談"], "correct_index": 0, "explanation": "in fact = 実際は。意見(opinion)と区別される。", "id": "s4_178", "body_ruby": "「ナポレオンは背《せ》が低《ひく》かった」は有名《ゆうめい》な話《はなし》だが、当時《とうじ》の平均身長《へいきんしんちょう》と比《くら》べると低《ひく》くないというのが<fact>らしい。", "choices_ruby": ["事実《じじつ》", "うわさ", "願望《がんぼう》", "冗談《じょうだん》"], "explanation_ruby": "in fact = 実際《じっさい》は。意見《いけん》(opinion)と区別《くべつ》される。", "body_kana": "「ナポレオンはせがひくかった」はゆうめいなはなしだが、とうじのへいきんしんちょうとくらべるとひくくないというのが<fact>らしい。"}, {"word": "fade", "meaning_jp": "薄れる、色あせる", "pos": "動", "body": "お気に入りの青いTシャツは、3年間着て洗ううちに色が<fade>して、今では空色になった。", "choices": ["色あせる", "濃くなる", "縮む", "破れる"], "correct_index": 0, "explanation": "色・音・記憶が徐々に薄れること。fade out = 徐々に消える。", "id": "s4_179", "body_ruby": "お気《き》に入《い》りの青《あお》いTシャツは、3年間《ねんかん》着《き》て洗《あら》ううちに色《いろ》が<fade>して、今《いま》では空《そら》色《いろ》になった。", "choices_ruby": ["色《いろ》あせる", "濃《こ》くなる", "縮《ちぢ》む", "破《やぶ》れる"], "explanation_ruby": "色《いろ》・音《おと》・記憶《きおく》が徐々《じょじょ》に薄《うす》れること。fade out = 徐々《じょじょ》に消《き》える。", "body_kana": "おきにいりのあおいTシャツは、3年間きてあらううちにいろが<fade>して、いまではそらいろになった。"}, {"word": "faint", "meaning_jp": "かすかな、気を失う", "pos": "形/動", "body": "夜の山道で、遠くに<faint>な街の明かりが見えた。豆粒ほどの光だが、それだけで心強かった。", "choices": ["かすかな", "まぶしい", "巨大な", "騒がしい"], "correct_index": 0, "explanation": "弱々しくぼんやりした。動詞では「気絶する」。", "id": "s4_180", "body_ruby": "夜《よる》の山道《やまみち》で、遠《とお》くに<faint>な街《まち》の明《あ》かりが見《み》えた。豆粒《まめつぶ》ほどの光《ひかり》だが、それだけで心強《こころづよ》かった。", "choices_ruby": ["かすかな", "まぶしい", "巨大《きょだい》な", "騒《さわ》がしい"], "explanation_ruby": "弱々《よわよわ》しくぼんやりした。動詞《どうし》では「気絶《きぜつ》する」。", "body_kana": "よるのやまみちで、とおくに<faint>なまちのあかりがみえた。まめつぶほどのひかりだが、それだけでこころづよかった。"}, {"word": "fair", "meaning_jp": "公平な", "pos": "形", "body": "じゃんけんで決めるのが一番<fair>だ。強い人も先生の子も関係なく、勝つ確率はみんな同じになる。", "choices": ["公平な", "不正な", "厳しい", "面倒な"], "correct_index": 0, "explanation": "unfair(不公平な)の対。fair play = 正々堂々。", "id": "s4_181", "body_ruby": "じゃんけんで決《き》めるのが一番《いちばん》<fair>だ。強《つよ》い人《にん》も先生《せんせい》の子《こ》も関係《かんけい》なく、勝《か》つ確率《かくりつ》はみんな同《おな》じになる。", "choices_ruby": ["公平《こうへい》な", "不正《ふせい》な", "厳《きび》しい", "面倒《めんどう》な"], "explanation_ruby": "unfair(不公平《ふこうへい》な)の対《つい》。fair play = 正々堂々《せいせいどうどう》。", "body_kana": "じゃんけんできめるのがいちばん<fair>だ。つよいにんもせんせいのこもかんけいなく、かつかくりつはみんなおなじになる。"}, {"word": "farewell", "meaning_jp": "別れ、送別", "pos": "名", "body": "転任する先生の<farewell>の会で、クラス全員からの寄せ書きを渡すと、先生は涙ぐんだ。", "choices": ["送別", "歓迎", "祝勝", "反省"], "correct_index": 0, "explanation": "fare(行く)+ well(良く)= 道中ご無事で。", "id": "s4_182", "body_ruby": "転任《てんにん》する先生《せんせい》の<farewell>の会《かい》で、クラス全員《ぜんいん》からの｜寄せ書《よせが》きを渡《わた》すと、先生《せんせい》は涙《なみだ》ぐんだ。", "choices_ruby": ["送別《そうべつ》", "歓迎《かんげい》", "祝勝《しゅくしょう》", "反省《はんせい》"], "explanation_ruby": "fare(行《い》く)+ well(良《よ》く)= 道中《どうちゅう》ご無事《ぶじ》で。", "body_kana": "てんにんするせんせいの<farewell>のかいで、クラスぜんいんからのよせがきをわたすと、せんせいはなみだぐんだ。"}, {"word": "farm", "meaning_jp": "農場", "pos": "名", "body": "夏休みに北海道の<farm>に泊まり、朝5時から牛の乳しぼりとトマトの収穫を手伝った。", "choices": ["農場", "工場", "漁港", "オフィス"], "correct_index": 0, "explanation": "farmer = 農家の人。作物や家畜を育てる場所。", "id": "s4_183", "body_ruby": "夏休《なつやす》みに北海道《ほっかいどう》の<farm>に泊《と》まり、朝《あさ》5時《じ》から牛《うし》の乳《ちち》しぼりとトマトの収穫《しゅうかく》を手伝《てつだ》った。", "choices_ruby": ["農場《のうじょう》", "工場《こうじょう》", "漁港《ぎょこう》", "オフィス"], "explanation_ruby": "farmer = 農家《のうか》の人《にん》。作物《さくもつ》や家畜《かちく》を育《そだ》てる場所《ばしょ》。", "body_kana": "なつやすみにほっかいどうの<farm>にとまり、あさ5時からうしのちちしぼりとトマトのしゅうかくをてつだった。"}, {"word": "farming", "meaning_jp": "農業", "pos": "名", "body": "祖父は60年間<farming>を続け、田植えから稲刈りまで、季節の手順がすべて体に入っている。", "choices": ["農業", "漁業", "林業", "工業"], "correct_index": 0, "explanation": "farm + -ing。作物を育てる仕事。", "id": "s4_184", "body_ruby": "祖父《そふ》は60年間《ねんかん》<farming>を続《つづ》け、田植《たう》えから稲刈《いねか》りまで、季節《きせつ》の手順《てじゅん》がすべて体《からだ》に入《はい》っている。", "choices_ruby": ["農業《のうぎょう》", "漁業《ぎょぎょう》", "林業《りんぎょう》", "工業《こうぎょう》"], "explanation_ruby": "farm + -ing。作物《さくもつ》を育《そだ》てる仕事《しごと》。", "body_kana": "そふは60年間<farming>をつづけ、たうえからいねかりまで、きせつのてじゅんがすべてからだにはいっている。"}, {"word": "fate", "meaning_jp": "運命", "pos": "名", "body": "転校先で、幼稚園のときの親友と同じクラスになった。偶然というより<fate>を感じた再会だった。", "choices": ["運命", "計画", "努力", "偶然の失敗"], "correct_index": 0, "explanation": "人の力を超えた巡り合わせ。destiny と近い。", "id": "s4_185", "body_ruby": "転校先《てんこうさき》で、幼稚園《ようちえん》のときの親友《しんゆう》と同《おな》じクラスになった。偶然《ぐうぜん》というより<fate>を感《かん》じた再会《さいかい》だった。", "choices_ruby": ["運命《うんめい》", "計画《けいかく》", "努力《どりょく》", "偶然《ぐうぜん》の失敗《しっぱい》"], "explanation_ruby": "人《にん》の力《ちから》を超《こ》えた巡《めぐ》り合《あ》わせ。destiny と近《ちか》い。", "body_kana": "てんこうさきで、ようちえんのときのしんゆうとおなじクラスになった。ぐうぜんというより<fate>をかんじたさいかいだった。"}, {"word": "favor", "meaning_jp": "親切な行為、頼み", "pos": "名", "body": "「ひとつ<favor>をお願いしてもいい? 留守の間、金魚に餌をあげてほしいの」と隣人に頼まれた。", "choices": ["頼み", "命令", "苦情", "贈り物の値段"], "correct_index": 0, "explanation": "Do me a favor. = お願いがあるんだけど。", "id": "s4_186", "body_ruby": "「ひとつ<favor>をお願《ねが》いしてもいい? 留守《るす》の間《かん》、金魚《きんぎょ》に餌《えさ》をあげてほしいの」と隣人《りんじん》に頼《たの》まれた。", "choices_ruby": ["頼《たの》み", "命令《めいれい》", "苦情《くじょう》", "｜贈り物《おくりもの》の値段《ねだん》"], "explanation_ruby": "Do me a favor. = お願《ねが》いがあるんだけど。", "body_kana": "「ひとつ<favor>をおねがいしてもいい? るすのかん、きんぎょにえさをあげてほしいの」とりんじんにたのまれた。"}, {"word": "fence", "meaning_jp": "フェンス、柵", "pos": "名", "body": "ホームランボールは校庭の<fence>を越え、隣の畑まで飛んでいった。柵の高さは3メートルもあるのに。", "choices": ["柵", "屋根", "倉庫", "鉄棒"], "correct_index": 0, "explanation": "敷地を囲う仕切り。", "id": "s4_187", "body_ruby": "ホームランボールは校庭《こうてい》の<fence>を越《こ》え、隣《となり》の畑《はたけ》まで飛《と》んでいった。柵《さく》の高《たか》さは3メートルもあるのに。", "choices_ruby": ["柵《さく》", "屋根《やね》", "倉庫《そうこ》", "鉄棒《てつぼう》"], "explanation_ruby": "敷地《しきち》を囲《かこ》う仕切《しき》り。", "body_kana": "ホームランボールはこうていの<fence>をこえ、となりのはたけまでとんでいった。さくのたかさは3メートルもあるのに。"}, {"word": "fever", "meaning_jp": "熱", "pos": "名", "body": "朝から体がだるく、計ると38.5度の<fever>があった。今日は布団で安静にするしかない。", "choices": ["熱", "寒気だけ", "食欲", "湿疹"], "correct_index": 0, "explanation": "have a fever = 熱がある。", "id": "s4_188", "body_ruby": "朝《あさ》から体《からだ》がだるく、計《はか》ると38.5度《ど》の<fever>があった。今日《きょう》は布団《ふとん》で安静《あんせい》にするしかない。", "choices_ruby": ["熱《ねつ》", "寒気《さむけ》だけ", "食欲《しょくよく》", "湿疹《しっしん》"], "explanation_ruby": "have a fever = 熱《ねつ》がある。", "body_kana": "あさからからだがだるく、はかると38.5どの<fever>があった。きょうはふとんであんせいにするしかない。"}, {"word": "fiction", "meaning_jp": "フィクション、作り話", "pos": "名", "body": "この物語は<fiction>であり、実在の人物や団体とは関係ありません──映画の最後によく流れる一文だ。", "choices": ["作り話", "実話", "報道", "伝記"], "correct_index": 0, "explanation": "nonfiction(実話)の対。science fiction = SF。", "id": "s4_189", "body_ruby": "この物語《ものがたり》は<fiction>であり、実在《じつざい》の人物《じんぶつ》や団体《だんたい》とは関係《かんけい》ありません──映画《えいが》の最後《さいご》によく流《なが》れる一文《いちぶん》だ。", "choices_ruby": ["作《つく》り話《はなし》", "実話《じつわ》", "報道《ほうどう》", "伝記《でんき》"], "explanation_ruby": "nonfiction(実話《じつわ》)の対《つい》。science fiction = SF。", "body_kana": "このものがたりは<fiction>であり、じつざいのじんぶつやだんたいとはかんけいありません──えいがのさいごによくながれるいちぶんだ。"}, {"word": "fifteenth", "meaning_jp": "15番目の", "pos": "形", "body": "毎月の<fifteenth>の日は、おこづかいの日。カレンダーの15日に赤丸をつけて待っている。", "choices": ["15番目の", "5番目の", "50番目の", "15個の"], "correct_index": 0, "explanation": "fifteen(15)+ -th。序数。", "id": "s4_190", "body_ruby": "毎月《まいつき》の<fifteenth>の日《ひ》は、おこづかいの日《ひ》。カレンダーの15日《にち》に赤丸《あかまる》をつけて待《ま》っている。", "choices_ruby": ["15番目《ばんめ》の", "5番目《ばんめ》の", "50番目《ばんめ》の", "15個《こ》の"], "explanation_ruby": "fifteen(15)+ -th。序数《じょすう》。", "body_kana": "まいつきの<fifteenth>のひは、おこづかいのひ。カレンダーの15日にあかまるをつけてまっている。"}, {"word": "Finland", "meaning_jp": "フィンランド", "pos": "名", "body": "サンタクロースの村とオーロラで知られる<Finland>は、北欧にあり、冬は太陽がほとんど昇らない。", "choices": ["フィンランド", "オランダ", "スイス", "ポーランド"], "correct_index": 0, "explanation": "首都はヘルシンキ。サウナ発祥の国。", "id": "s4_191", "body_ruby": "サンタクロースの村《むら》とオーロラで知《し》られる<Finland>は、北欧《ほくおう》にあり、冬《ふゆ》は太陽《たいよう》がほとんど昇《のぼ》らない。", "choices_ruby": ["フィンランド", "オランダ", "スイス", "ポーランド"], "explanation_ruby": "首都《しゅと》はヘルシンキ。サウナ発祥《はっしょう》の国《くに》。", "body_kana": "サンタクロースのむらとオーロラでしられる<Finland>は、ほくおうにあり、ふゆはたいようがほとんどのぼらない。"}, {"word": "firewood", "meaning_jp": "薪", "pos": "名", "body": "キャンプ場で<firewood>を一束買い、なたで細く割ってから火をつけると、よく燃えた。", "choices": ["薪", "炭", "新聞紙", "ガスボンベ"], "correct_index": 0, "explanation": "fire + wood。燃やすための木。", "id": "s4_192", "body_ruby": "キャンプ場《ば》で<firewood>を一束《ひとたば》買《か》い、なたで細《こま》く割《さ》ってから火《ひ》をつけると、よく燃《も》えた。", "choices_ruby": ["薪《たきぎ》", "炭《すみ》", "新聞紙《しんぶんし》", "ガスボンベ"], "explanation_ruby": "fire + wood。燃《も》やすための木《き》。", "body_kana": "キャンプばで<firewood>をひとたばかい、なたでこまくさってからひをつけると、よくもえた。"}, {"word": "firework", "meaning_jp": "花火", "pos": "名", "body": "夏祭りの夜、1万発の<firework>が夜空に開き、腹に響く音と歓声が交互に続いた。", "choices": ["花火", "雷", "照明", "気球"], "correct_index": 0, "explanation": "fire + work。通常は複数形 fireworks。", "id": "s4_193", "body_ruby": "夏祭《なつまつ》りの夜《よる》、1万《まん》発《はつ》の<firework>が夜《よる》空《そら》に開《ひら》き、腹《はら》に響《ひび》く音《おと》と歓声《かんせい》が交互《こうご》に続《つづ》いた。", "choices_ruby": ["花火《はなび》", "雷《かみなり》", "照明《しょうめい》", "気球《ききゅう》"], "explanation_ruby": "fire + work。通常《つうじょう》は複数形《ふくすうけい》 fireworks。", "body_kana": "なつまつりのよる、1まんはつの<firework>がよるそらにひらき、はらにひびくおととかんせいがこうごにつづいた。"}, {"word": "fit", "meaning_jp": "合う", "pos": "動", "body": "去年の上履きはもう足に<fit>しなくなった。つま先が当たるので、1センチ大きいサイズに買い替えた。", "choices": ["合う", "破れる", "汚れる", "滑る"], "correct_index": 0, "explanation": "サイズが合うこと。fitness = 体の調子・フィットネス。", "id": "s4_194", "body_ruby": "去年《きょねん》の上履《うわば》きはもう足《あし》に<fit>しなくなった。つま先《さき》が当《あ》たるので、1センチ大《おお》きいサイズに買《か》い替《か》えた。", "choices_ruby": ["合《あ》う", "破《やぶ》れる", "汚《よご》れる", "滑《すべ》る"], "explanation_ruby": "サイズが合《あ》うこと。fitness = 体《からだ》の調子《ちょうし》・フィットネス。", "body_kana": "きょねんのうわばきはもうあしに<fit>しなくなった。つまさきがあたるので、1センチおおきいサイズにかいかえた。"}, {"word": "flew", "meaning_jp": "飛んだ", "pos": "動", "body": "強風で帽子が<flew>して、3軒先の庭まで追いかけるはめになった。", "choices": ["飛んだ", "落ちた", "破れた", "濡れた"], "correct_index": 0, "explanation": "fly の過去形。fly-flew-flown。", "id": "s4_195", "body_ruby": "強風《きょうふう》で帽子《ぼうし》が<flew>して、3軒《けん》先《さき》の庭《にわ》まで追《お》いかけるはめになった。", "choices_ruby": ["飛《と》んだ", "落《お》ちた", "破《やぶ》れた", "濡《ぬ》れた"], "explanation_ruby": "fly の過去形《かこけい》。fly-flew-flown。", "body_kana": "きょうふうでぼうしが<flew>して、3軒さきのにわまでおいかけるはめになった。"}, {"word": "flight", "meaning_jp": "飛行便、フライト", "pos": "名", "body": "沖縄行きの<flight>は午前10時発。搭乗口には1時間前までに着いておく必要がある。", "choices": ["飛行便", "切符売り場", "手荷物", "滑走路"], "correct_index": 0, "explanation": "fly(飛ぶ)の名詞形。flight attendant = 客室乗務員。", "id": "s4_196", "body_ruby": "沖縄《おきなわ》行《い》きの<flight>は午前《ごぜん》10時《じ》発《はつ》。搭乗口《とうじょうぐち》には1時間《じかん》前《まえ》までに着《つ》いておく必要《ひつよう》がある。", "choices_ruby": ["飛行便《ひこうびん》", "切符《きっぷ》｜売り場《うりば》", "手荷物《てにもつ》", "滑走路《かっそうろ》"], "explanation_ruby": "fly(飛《と》ぶ)の名詞《めいし》形《かたち》。flight attendant = 客室乗務員《きゃくしつじょうむいん》。", "body_kana": "おきなわいきの<flight>はごぜん10時はつ。とうじょうぐちには1時間まえまでについておくひつようがある。"}, {"word": "fluffy", "meaning_jp": "ふわふわの", "pos": "形", "body": "洗いたての毛布は<fluffy>で、顔をうずめると太陽の匂いがして、そのまま眠ってしまいそうだった。", "choices": ["ふわふわの", "ごわごわの", "湿った", "重い"], "correct_index": 0, "explanation": "fluff(綿毛)+ -y。パンケーキにも使う。", "id": "s4_197", "body_ruby": "洗《あら》いたての毛布《もうふ》は<fluffy>で、顔《かお》をうずめると太陽《たいよう》の匂《にお》いがして、そのまま眠《ねむ》ってしまいそうだった。", "choices_ruby": ["ふわふわの", "ごわごわの", "湿《しめ》った", "重《おも》い"], "explanation_ruby": "fluff(綿毛《わたげ》)+ -y。パンケーキにも使《つか》う。", "body_kana": "あらいたてのもうふは<fluffy>で、かおをうずめるとたいようのにおいがして、そのままねむってしまいそうだった。"}, {"word": "forest", "meaning_jp": "森", "pos": "名", "body": "<forest>の中は真夏でもひんやりして、木々の間から差す光が地面にまだら模様を作っていた。", "choices": ["森", "草原", "砂漠", "湿地"], "correct_index": 0, "explanation": "woods より大きく深い森。rainforest = 熱帯雨林。", "id": "s4_198", "body_ruby": "<forest>の中《なか》は真夏《まなつ》でもひんやりして、木々《きぎ》の間《かん》から差《さ》す光《ひかり》が地面《じめん》にまだら模様《もよう》を作《つく》っていた。", "choices_ruby": ["森《もり》", "草原《そうげん》", "砂漠《さばく》", "湿地《しっち》"], "explanation_ruby": "woods より大《おお》きく深《ふか》い森《もり》。rainforest = 熱帯雨林《ねったいうりん》。", "body_kana": "<forest>のなかはまなつでもひんやりして、きぎのかんからさすひかりがじめんにまだらもようをつくっていた。"}, {"word": "forever", "meaning_jp": "永遠に", "pos": "副", "body": "卒業アルバムの寄せ書きに、親友は「この3年間を<forever>忘れない」と書いてくれた。", "choices": ["永遠に", "しばらく", "たまに", "今だけ"], "correct_index": 0, "explanation": "for + ever。永久に・ずっと。", "id": "s4_199", "body_ruby": "卒業《そつぎょう》アルバムの｜寄せ書《よせが》きに、親友《しんゆう》は「この3年間《ねんかん》を<forever>忘《わす》れない」と書《か》いてくれた。", "choices_ruby": ["永遠《えいえん》に", "しばらく", "たまに", "今《いま》だけ"], "explanation_ruby": "for + ever。永久《えいきゅう》に・ずっと。", "body_kana": "そつぎょうアルバムのよせがきに、しんゆうは「この3年間を<forever>わすれない」とかいてくれた。"}, {"word": "fork", "meaning_jp": "フォーク", "pos": "名", "body": "スパゲッティは<fork>に麺をくるくる巻きつけて食べると、すすらずにきれいに口へ運べる。", "choices": ["フォーク", "箸", "スプーン", "ナイフ"], "correct_index": 0, "explanation": "先が分かれた食器。道の「分かれ道」の意味も。", "id": "s4_200", "body_ruby": "スパゲッティは<fork>に麺《めん》をくるくる巻《ま》きつけて食《た》べると、すすらずにきれいに口《くち》へ運《はこ》べる。", "choices_ruby": ["フォーク", "箸《はし》", "スプーン", "ナイフ"], "explanation_ruby": "先《さき》が分《わ》かれた食器《しょっき》。道《みち》の「分《わ》かれ道《みち》」の意味《いみ》も。", "body_kana": "スパゲッティは<fork>にめんをくるくるまきつけてたべると、すすらずにきれいにくちへはこべる。"}, {"word": "form", "meaning_jp": "形、書式", "pos": "名", "body": "申し込み<form>に名前と住所を記入し、最後に保護者のサイン欄を埋めて提出した。", "choices": ["記入用紙", "封筒", "切手", "印鑑"], "correct_index": 0, "explanation": "「形・フォーム」の意味も(走るフォームなど)。", "id": "s4_201", "body_ruby": "｜申し込《もうしこ》み<form>に名前《なまえ》と住所《じゅうしょ》を記入《きにゅう》し、最後《さいご》に保護者《ほごしゃ》のサイン欄《らん》を埋《う》めて提出《ていしゅつ》した。", "choices_ruby": ["記入《きにゅう》用紙《ようし》", "封筒《ふうとう》", "切手《きって》", "印鑑《いんかん》"], "explanation_ruby": "「形《かたち》・フォーム」の意味《いみ》も(走《はし》るフォームなど)。", "body_kana": "もうしこみ<form>になまえとじゅうしょをきにゅうし、さいごにほごしゃのサインらんをうめてていしゅつした。"}, {"word": "former", "meaning_jp": "前の、元の", "pos": "形", "body": "新しいコーチは<former>のオリンピック選手で、現役時代は銀メダルを獲得したそうだ。", "choices": ["元の", "未来の", "現役の", "架空の"], "correct_index": 0, "explanation": "former champion = 元チャンピオン。", "id": "s4_202", "body_ruby": "新《あたら》しいコーチは<former>のオリンピック選手《せんしゅ》で、現役時代《げんえきじだい》は銀《ぎん》メダルを獲得《かくとく》したそうだ。", "choices_ruby": ["元《もと》の", "未来《みらい》の", "現役《げんえき》の", "架空《かくう》の"], "explanation_ruby": "former champion = 元《もと》チャンピオン。", "body_kana": "あたらしいコーチは<former>のオリンピックせんしゅで、げんえきじだいはぎんメダルをかくとくしたそうだ。"}, {"word": "freedom", "meaning_jp": "自由", "pos": "名", "body": "夏休み最初の朝、宿題も時間割もない<freedom>を満喫して、昼まで布団でごろごろした。", "choices": ["自由", "義務", "規則", "束縛"], "correct_index": 0, "explanation": "free(自由な)+ -dom。freedom of speech = 言論の自由。", "id": "s4_203", "body_ruby": "夏休《なつやす》み最初《さいしょ》の朝《あさ》、宿題《しゅくだい》も時間割《じかんわり》もない<freedom>を満喫《まんきつ》して、昼《ひる》まで布団《ふとん》でごろごろした。", "choices_ruby": ["自由《じゆう》", "義務《ぎむ》", "規則《きそく》", "束縛《そくばく》"], "explanation_ruby": "free(自由《じゆう》な)+ -dom。freedom of speech = 言論《げんろん》の自由《じゆう》。", "body_kana": "なつやすみさいしょのあさ、しゅくだいもじかんわりもない<freedom>をまんきつして、ひるまでふとんでごろごろした。"}, {"word": "fresh", "meaning_jp": "新鮮な", "pos": "形", "body": "朝市の魚は<fresh>そのもので、目が澄み、エラは鮮やかな赤色をしていた。", "choices": ["新鮮な", "古い", "冷凍の", "干した"], "correct_index": 0, "explanation": "とれたて・できたて。fresh air = 新鮮な空気。", "id": "s4_204", "body_ruby": "朝市《あさいち》の魚《さかな》は<fresh>そのもので、目《め》が澄《す》み、エラは鮮《あざ》やかな赤色《せきしょく》をしていた。", "choices_ruby": ["新鮮《しんせん》な", "古《ふる》い", "冷凍《れいとう》の", "干《ほ》した"], "explanation_ruby": "とれたて・できたて。fresh air = 新鮮《しんせん》な空《そら》気《き》。", "body_kana": "あさいちのさかなは<fresh>そのもので、めがすみ、エラはあざやかなせきしょくをしていた。"}, {"word": "friendly", "meaning_jp": "親しみやすい", "pos": "形", "body": "隣の家の犬はとても<friendly>で、初対面の私にもしっぽを振って腹を見せてきた。", "choices": ["親しみやすい", "警戒心の強い", "臆病な", "攻撃的な"], "correct_index": 0, "explanation": "friend + -ly。人懐っこい。", "id": "s4_205", "body_ruby": "隣《となり》の家《いえ》の犬《いぬ》はとても<friendly>で、初対面《しょたいめん》の私《わたし》にもしっぽを振《ふ》って腹《はら》を見《み》せてきた。", "choices_ruby": ["親《した》しみやすい", "警戒心《けいかいしん》の強《つよ》い", "臆病《おくびょう》な", "攻撃的《こうげきてき》な"], "explanation_ruby": "friend + -ly。人《にん》懐《なつ》っこい。", "body_kana": "となりのいえのいぬはとても<friendly>で、しょたいめんのわたしにもしっぽをふってはらをみせてきた。"}, {"word": "fuel", "meaning_jp": "燃料", "pos": "名", "body": "長距離トラックは、出発前にタンクいっぱいの<fuel>を入れる。満タンで1000キロは走れるという。", "choices": ["燃料", "水", "空気", "貨物"], "correct_index": 0, "explanation": "ガソリン・軽油・薪など燃やすもの全般。", "id": "s4_206", "body_ruby": "長距離《ちょうきょり》トラックは、出発前《しゅっぱつまえ》にタンクいっぱいの<fuel>を入《い》れる。満《まん》タンで1000キロは走《はし》れるという。", "choices_ruby": ["燃料《ねんりょう》", "水《みず》", "空《そら》気《き》", "貨物《かもつ》"], "explanation_ruby": "ガソリン・軽油《けいゆ》・薪《たきぎ》など燃《も》やすもの全般《ぜんぱん》。", "body_kana": "ちょうきょりトラックは、しゅっぱつまえにタンクいっぱいの<fuel>をいれる。まんタンで1000キロははしれるという。"}, {"word": "fulfill", "meaning_jp": "果たす、実現する", "pos": "動", "body": "「優勝したら坊主になる」という約束を、キャプテンは本当に<fulfill>して、翌日丸刈りで現れた。", "choices": ["果たす", "破る", "忘れる", "延期する"], "correct_index": 0, "explanation": "full + fill = 満たす。約束・夢・役割を果たす。", "id": "s4_207", "body_ruby": "「優勝《ゆうしょう》したら坊主《ぼうず》になる」という約束《やくそく》を、キャプテンは本当《ほんとう》に<fulfill>して、翌日《よくじつ》丸刈《まるがり》りで現《あらわ》れた。", "choices_ruby": ["果《は》たす", "破《やぶ》る", "忘《わす》れる", "延期《えんき》する"], "explanation_ruby": "full + fill = 満《み》たす。約束《やくそく》・夢《ゆめ》・役割《やくわり》を果《は》たす。", "body_kana": "「ゆうしょうしたらぼうずになる」というやくそくを、キャプテンはほんとうに<fulfill>して、よくじつまるがりりであらわれた。"}, {"word": "funny", "meaning_jp": "おかしい、面白い", "pos": "形", "body": "彼のモノマネがあまりに<funny>で、給食の牛乳を吹き出しそうになった。", "choices": ["笑える", "悲しい", "怖い", "難しい"], "correct_index": 0, "explanation": "fun(楽しみ)+ -ny。笑いを誘うおかしさ。", "id": "s4_208", "body_ruby": "彼《かれ》のモノマネがあまりに<funny>で、給食《きゅうしょく》の牛乳《ぎゅうにゅう》を｜吹き出《ふきだ》しそうになった。", "choices_ruby": ["笑《わら》える", "悲《かな》しい", "怖《こわ》い", "難《むずか》しい"], "explanation_ruby": "fun(楽《たの》しみ)+ -ny。笑《わら》いを誘《さそ》うおかしさ。", "body_kana": "かれのモノマネがあまりに<funny>で、きゅうしょくのぎゅうにゅうをふきだしそうになった。"}, {"word": "furniture", "meaning_jp": "家具", "pos": "名", "body": "新居に運び込まれた<furniture>は、ベッド、机、本棚、ソファの4点。配置を決めるだけで半日かかった。", "choices": ["家具", "家電", "食器", "衣類"], "correct_index": 0, "explanation": "数えられない名詞。a piece of furniture = 家具1点。", "id": "s4_209", "body_ruby": "新居《しんきょ》に運《はこ》び込《こ》まれた<furniture>は、ベッド、机《つくえ》、本棚《ほんだな》、ソファの4点《てん》。配置《はいち》を決《き》めるだけで半日《はんにち》かかった。", "choices_ruby": ["家具《かぐ》", "家電《かでん》", "食器《しょっき》", "衣類《いるい》"], "explanation_ruby": "数《かぞ》えられない名詞《めいし》。a piece of furniture = 家具《かぐ》1点《てん》。", "body_kana": "しんきょにはこびこまれた<furniture>は、ベッド、つくえ、ほんだな、ソファの4点。はいちをきめるだけではんにちかかった。"}, {"word": "futon", "meaning_jp": "布団", "pos": "名", "body": "晴れた日に<futon>を干すと、夜には太陽の匂いがして、包まれた瞬間に眠気がやってくる。", "choices": ["布団", "ベッド", "ソファ", "枕だけ"], "correct_index": 0, "explanation": "日本語がそのまま英語になった語のひとつ。", "id": "s4_210", "body_ruby": "晴《は》れた日《にち》に<futon>を干《ほ》すと、夜《よる》には太陽《たいよう》の匂《にお》いがして、包《つつ》まれた瞬間《しゅんかん》に眠気《ねむけ》がやってくる。", "choices_ruby": ["布団《ふとん》", "ベッド", "ソファ", "枕《まくら》だけ"], "explanation_ruby": "日本語《にほんご》がそのまま英語《えいご》になった語《ご》のひとつ。", "body_kana": "はれたにちに<futon>をほすと、よるにはたいようのにおいがして、つつまれたしゅんかんにねむけがやってくる。"}, {"word": "garbage", "meaning_jp": "ごみ", "pos": "名", "body": "月曜と木曜は燃える<garbage>の収集日。8時までに出さないと、回収車は行ってしまう。", "choices": ["ごみ", "新聞", "荷物", "落とし物"], "correct_index": 0, "explanation": "garbage can = ごみ箱。trash とほぼ同じ。", "id": "s4_211", "body_ruby": "月曜《げつよう》と木曜《もくよう》は燃《も》える<garbage>の収集《しゅうしゅう》日《にち》。8時《じ》までに出《だ》さないと、回収車《かいしゅうしゃ》は行《い》ってしまう。", "choices_ruby": ["ごみ", "新聞《しんぶん》", "荷物《にもつ》", "｜落とし物《おとしもの》"], "explanation_ruby": "garbage can = ごみ箱《はこ》。trash とほぼ同《おな》じ。", "body_kana": "げつようともくようはもえる<garbage>のしゅうしゅうにち。8時までにださないと、かいしゅうしゃはいってしまう。"}, {"word": "gas", "meaning_jp": "ガス、ガソリン", "pos": "名", "body": "料理のとき、こんろの<gas>の火加減を調整する。青い炎が安定して出ていれば正常だ。", "choices": ["ガス", "電気", "水道", "灯油ストーブ"], "correct_index": 0, "explanation": "アメリカでは gasoline(ガソリン)の略でもある。", "id": "s4_212", "body_ruby": "料理《りょうり》のとき、こんろの<gas>の火加減《ひかげん》を調整《ちょうせい》する。青《あお》い炎《ほのお》が安定《あんてい》して出《で》ていれば正常《せいじょう》だ。", "choices_ruby": ["ガス", "電気《でんき》", "水道《すいどう》", "灯油《とうゆ》ストーブ"], "explanation_ruby": "アメリカでは gasoline(ガソリン)の略《りゃく》でもある。", "body_kana": "りょうりのとき、こんろの<gas>のひかげんをちょうせいする。あおいほのおがあんていしてでていればせいじょうだ。"}, {"word": "geese", "meaning_jp": "ガチョウ(複数)", "pos": "名", "body": "湖には30羽ほどの<geese>がV字の編隊を組んで飛来し、一斉に水面へ降り立った。", "choices": ["ガチョウの群れ", "1羽のガチョウ", "白鳥のヒナ", "アヒルの卵"], "correct_index": 0, "explanation": "goose の複数形。foot→feet と同じ母音変化。", "id": "s4_213", "body_ruby": "湖《みずうみ》には30羽《わ》ほどの<geese>がV字《じ》の編隊《へんたい》を組《く》んで飛来《ひらい》し、一斉《いっせい》に水面《すいめん》へ降《お》り立《た》った。", "choices_ruby": ["ガチョウの群《む》れ", "1羽《わ》のガチョウ", "白鳥《はくちょう》のヒナ", "アヒルの卵《たまご》"], "explanation_ruby": "goose の複数形《ふくすうけい》。foot→feet と同《おな》じ母音《ぼいん》変化《へんか》。", "body_kana": "みずうみには30羽ほどの<geese>がVじのへんたいをくんでひらいし、いっせいにすいめんへおりたった。"}, {"word": "generation", "meaning_jp": "世代", "pos": "名", "body": "祖父、父、私。3つの<generation>がそろう正月の食卓では、それぞれの子ども時代の話が出る。", "choices": ["世代", "性別", "血液型", "職業"], "correct_index": 0, "explanation": "約30年ごとの区切り。generation gap = 世代間の差。", "id": "s4_214", "body_ruby": "祖父《そふ》、父《ちち》、私《わたし》。3つの<generation>がそろう正月《しょうがつ》の食卓《しょくたく》では、それぞれの子《こ》ども時代《じだい》の話《はなし》が出《で》る。", "choices_ruby": ["世代《せだい》", "性別《せいべつ》", "血液型《けつえきがた》", "職業《しょくぎょう》"], "explanation_ruby": "約《やく》30年《ねん》ごとの区切《くぎ》り。generation gap = 世代間《せだいかん》の差《さ》。", "body_kana": "そふ、ちち、わたし。3つの<generation>がそろうしょうがつのしょくたくでは、それぞれのこどもじだいのはなしがでる。"}, {"word": "gentleman", "meaning_jp": "紳士", "pos": "名", "body": "雨の日、傘を持たない人にさっと自分の傘を差し出したその<gentleman>は、名乗らずに去っていった。", "choices": ["紳士", "少年", "商人", "兵士"], "correct_index": 0, "explanation": "gentle(優しい)+ man。礼儀正しい男性。", "id": "s4_215", "body_ruby": "雨《あめ》の日《ひ》、傘《かさ》を持《も》たない人《にん》にさっと自分《じぶん》の傘《かさ》を差《さ》し出《だ》したその<gentleman>は、名乗《なの》らずに去《さ》っていった。", "choices_ruby": ["紳士《しんし》", "少年《しょうねん》", "商人《しょうにん》", "兵士《へいし》"], "explanation_ruby": "gentle(優《やさ》しい)+ man。礼儀正《れいぎただ》しい男性《だんせい》。", "body_kana": "あめのひ、かさをもたないにんにさっとじぶんのかさをさしだしたその<gentleman>は、なのらずにさっていった。"}, {"word": "gentlemen", "meaning_jp": "紳士たち、皆様", "pos": "名", "body": "「レディース・アンド・<gentlemen>!」という司会の呼びかけで、会場の照明が落ち、ショーが始まった。", "choices": ["紳士たち", "子どもたち", "女性たち", "店員たち"], "correct_index": 0, "explanation": "gentleman の複数形。man→men の変化。", "id": "s4_216", "body_ruby": "「レディース・アンド・<gentlemen>!」という司会《しかい》の呼《よ》びかけで、会場《かいじょう》の照明《しょうめい》が落《お》ち、ショーが始《はじ》まった。", "choices_ruby": ["紳士《しんし》たち", "子《こ》どもたち", "女性《じょせい》たち", "店員《てんいん》たち"], "explanation_ruby": "gentleman の複数形《ふくすうけい》。man→men の変化《へんか》。", "body_kana": "「レディース・アンド・<gentlemen>!」というしかいのよびかけで、かいじょうのしょうめいがおち、ショーがはじまった。"}, {"word": "gesture", "meaning_jp": "身ぶり、ジェスチャー", "pos": "名", "body": "言葉の通じない国でも、食べる<gesture>をしながら店を指させば、「食事がしたい」は伝わった。", "choices": ["身ぶり", "発音", "筆談", "翻訳機"], "correct_index": 0, "explanation": "手や体の動きで伝えること。", "id": "s4_217", "body_ruby": "言葉《ことば》の通《つう》じない国《くに》でも、食《た》べる<gesture>をしながら店《みせ》を指《さ》させば、「食事《しょくじ》がしたい」は伝《つた》わった。", "choices_ruby": ["身《み》ぶり", "発音《はつおん》", "筆談《ひつだん》", "翻訳機《ほんやくき》"], "explanation_ruby": "手《て》や体《からだ》の動《うご》きで伝《つた》えること。", "body_kana": "ことばのつうじないくにでも、たべる<gesture>をしながらみせをささせば、「しょくじがしたい」はつたわった。"}, {"word": "Ghana", "meaning_jp": "ガーナ", "pos": "名", "body": "チョコレートの包み紙にも名前が載る<Ghana>は、西アフリカの国で、カカオ豆の生産が盛んだ。", "choices": ["ガーナ", "ケニア", "エジプト", "モロッコ"], "correct_index": 0, "explanation": "首都はアクラ。野口英世が研究した地でもある。", "id": "s4_218", "body_ruby": "チョコレートの包《つつ》み紙《かみ》にも名前《なまえ》が載《の》る<Ghana>は、西《にし》アフリカの国《くに》で、カカオ豆《まめ》の生産《せいさん》が盛《さか》んだ。", "choices_ruby": ["ガーナ", "ケニア", "エジプト", "モロッコ"], "explanation_ruby": "首都《しゅと》はアクラ。野口《のぐち》英世《ひでよ》が研究《けんきゅう》した地《ち》でもある。", "body_kana": "チョコレートのつつみかみにもなまえがのる<Ghana>は、にしアフリカのくにで、カカオまめのせいさんがさかんだ。"}, {"word": "given", "meaning_jp": "与えられた", "pos": "動", "body": "発表の準備に<given>された時間は1週間。班で手分けして、資料作りと練習を進めた。", "choices": ["与えられた", "奪われた", "売られた", "隠された"], "correct_index": 0, "explanation": "give の過去分詞。give-gave-given。", "id": "s4_219", "body_ruby": "発表《はっぴょう》の準備《じゅんび》に<given>された時間《じかん》は1週間《しゅうかん》。班《はん》で手分《てわ》けして、資料《しりょう》作《つく》りと練習《れんしゅう》を進《すす》めた。", "choices_ruby": ["与《あた》えられた", "奪《うば》われた", "売《う》られた", "隠《かく》された"], "explanation_ruby": "give の過去分詞《かこぶんし》。give-gave-given。", "body_kana": "はっぴょうのじゅんびに<given>されたじかんは1週間。はんでてわけして、しりょうつくりとれんしゅうをすすめた。"}, {"word": "glacier", "meaning_jp": "氷河", "pos": "名", "body": "アラスカの<glacier>は、青白い氷の塊が山から海へゆっくり流れ下り、先端が轟音とともに崩れ落ちる。", "choices": ["氷河", "火山", "砂丘", "温泉"], "correct_index": 0, "explanation": "万年雪が固まって流れる巨大な氷。", "id": "s4_220", "body_ruby": "アラスカの<glacier>は、青白《あおじろ》い氷《こおり》の塊《かたまり》が山《やま》から海《うみ》へゆっくり流《なが》れ下《くだ》り、先端《せんたん》が轟音《ごうおん》とともに崩《くず》れ落《お》ちる。", "choices_ruby": ["氷河《ひょうが》", "火山《かざん》", "砂丘《さきゅう》", "温泉《おんせん》"], "explanation_ruby": "万年《まんねん》雪《ゆき》が固《かた》まって流《なが》れる巨大《きょだい》な氷《こおり》。", "body_kana": "アラスカの<glacier>は、あおじろいこおりのかたまりがやまからうみへゆっくりながれくだり、せんたんがごうおんとともにくずれおちる。"}, {"word": "god", "meaning_jp": "神", "pos": "名", "body": "ギリシャ神話には、海の<god>ポセイドンや太陽神アポロンなど、個性豊かな神々が登場する。", "choices": ["神", "王", "戦士", "預言者"], "correct_index": 0, "explanation": "Oh my god! = なんてことだ!", "id": "s4_221", "body_ruby": "ギリシャ神話《しんわ》には、海《うみ》の<god>ポセイドンや太陽神《たいようしん》アポロンなど、個性《こせい》豊《ゆた》かな神々《かみがみ》が登場《とうじょう》する。", "choices_ruby": ["神《かみ》", "王《おう》", "戦士《せんし》", "預言者《よげんしゃ》"], "explanation_ruby": "Oh my god! = なんてことだ!", "body_kana": "ギリシャしんわには、うみの<god>ポセイドンやたいようしんアポロンなど、こせいゆたかなかみがみがとうじょうする。"}, {"word": "gold", "meaning_jp": "金", "pos": "名", "body": "オリンピックの<gold>メダルを噛むポーズは定番だが、実は中身のほとんどは銀でできているそうだ。", "choices": ["金", "銀", "銅", "鉄"], "correct_index": 0, "explanation": "golden = 金色の。silver(銀)、bronze(銅)と並ぶ。", "id": "s4_222", "body_ruby": "オリンピックの<gold>メダルを噛《か》むポーズは定番《ていばん》だが、実《じつ》は中身《なかみ》のほとんどは銀《ぎん》でできているそうだ。", "choices_ruby": ["金《きん》", "銀《ぎん》", "銅《どう》", "鉄《てつ》"], "explanation_ruby": "golden = 金色《きんいろ》の。silver(銀《ぎん》)、bronze(銅《どう》)と並《なら》ぶ。", "body_kana": "オリンピックの<gold>メダルをかむポーズはていばんだが、じつはなかみのほとんどはぎんでできているそうだ。"}, {"word": "gone", "meaning_jp": "行ってしまった、なくなった", "pos": "動/形", "body": "冷蔵庫に残しておいたプリンが<gone>していた。容器すら残っていない。犯人は聞くまでもない。", "choices": ["なくなって", "増えて", "凍って", "倒れて"], "correct_index": 0, "explanation": "go の過去分詞。be gone = なくなっている。", "id": "s4_223", "body_ruby": "冷蔵庫《れいぞうこ》に残《のこ》しておいたプリンが<gone>していた。容器《ようき》すら残《のこ》っていない。犯人《はんにん》は聞《き》くまでもない。", "choices_ruby": ["なくなって", "増《ふ》えて", "凍《こお》って", "倒《たお》れて"], "explanation_ruby": "go の過去分詞《かこぶんし》。be gone = なくなっている。", "body_kana": "れいぞうこにのこしておいたプリンが<gone>していた。ようきすらのこっていない。はんにんはきくまでもない。"}, {"word": "goodness", "meaning_jp": "善良さ", "pos": "名", "body": "落とした財布が、現金もカードもそのまま戻ってきた。拾った人の<goodness>に心から感謝した。", "choices": ["善良さ", "素早さ", "豊かさ", "厳しさ"], "correct_index": 0, "explanation": "good + -ness。My goodness! = まあ!(驚き)", "id": "s4_224", "body_ruby": "落《お》とした財布《さいふ》が、現金《げんきん》もカードもそのまま戻《もど》ってきた。拾《ひろ》った人《にん》の<goodness>に心《こころ》から感謝《かんしゃ》した。", "choices_ruby": ["善良《ぜんりょう》さ", "素早《すばや》さ", "豊《ゆた》かさ", "厳《きび》しさ"], "explanation_ruby": "good + -ness。My goodness! = まあ!(驚《おどろ》き)", "body_kana": "おとしたさいふが、げんきんもカードもそのままもどってきた。ひろったにんの<goodness>にこころからかんしゃした。"}, {"word": "goods", "meaning_jp": "商品、グッズ", "pos": "名", "body": "コンサート会場の売店には、タオルやキーホルダーなどの<goods>が並び、開演前から行列ができた。", "choices": ["商品", "チケット", "座席", "楽器"], "correct_index": 0, "explanation": "常に複数形。品物・グッズ。", "id": "s4_225", "body_ruby": "コンサート会場《かいじょう》の売店《ばいてん》には、タオルやキーホルダーなどの<goods>が並《なら》び、開演前《かいえんまえ》から行列《ぎょうれつ》ができた。", "choices_ruby": ["商品《しょうひん》", "チケット", "座席《ざせき》", "楽器《がっき》"], "explanation_ruby": "常《つね》に複数形《ふくすうけい》。品物《しなもの》・グッズ。", "body_kana": "コンサートかいじょうのばいてんには、タオルやキーホルダーなどの<goods>がならび、かいえんまえからぎょうれつができた。"}, {"word": "goose", "meaning_jp": "ガチョウ", "pos": "名", "body": "童話に出てくる<goose>は、金の卵を毎日1個ずつ産んで、欲張りな飼い主に裂かれてしまう。", "choices": ["ガチョウ", "ニワトリ", "七面鳥", "ダチョウ"], "correct_index": 0, "explanation": "複数形は geese。白くて首の長い水鳥。", "id": "s4_226", "body_ruby": "童話《どうわ》に出《で》てくる<goose>は、金《きん》の卵《たまご》を毎日《まいにち》1個《こ》ずつ産《う》んで、欲張《よくば》りな｜飼い主《かいぬし》に裂《さ》かれてしまう。", "choices_ruby": ["ガチョウ", "ニワトリ", "七面鳥《しちめんちょう》", "ダチョウ"], "explanation_ruby": "複数形《ふくすうけい》は geese。白《しろ》くて首《くび》の長《なが》い水鳥《みずとり》。", "body_kana": "どうわにでてくる<goose>は、きんのたまごをまいにち1個ずつうんで、よくばりなかいぬしにさかれてしまう。"}, {"word": "government", "meaning_jp": "政府", "pos": "名", "body": "<government>は来年度の予算案を発表した。教育と防災に使うお金が今年より増えるという。", "choices": ["政府", "会社", "学校", "銀行"], "correct_index": 0, "explanation": "govern(治める)+ -ment。国の運営機関。", "id": "s4_227", "body_ruby": "<government>は来年度《らいねんど》の予算案《よさんあん》を発表《はっぴょう》した。教育《きょういく》と防災《ぼうさい》に使《つか》うお金《かね》が今年《ことし》より増《ふ》えるという。", "choices_ruby": ["政府《せいふ》", "会社《かいしゃ》", "学校《がっこう》", "銀行《ぎんこう》"], "explanation_ruby": "govern(治《おさ》める)+ -ment。国《くに》の運営《うんえい》機関《きかん》。", "body_kana": "<government>はらいねんどのよさんあんをはっぴょうした。きょういくとぼうさいにつかうおかねがことしよりふえるという。"}, {"word": "granddaughter", "meaning_jp": "孫娘", "pos": "名", "body": "祖母は<granddaughter>の私のために、ひな人形を毎年欠かさず飾ってくれる。", "choices": ["孫娘", "息子", "姪", "いとこ"], "correct_index": 0, "explanation": "grand + daughter。男の孫は grandson。", "id": "s4_228", "body_ruby": "祖母《そぼ》は<granddaughter>の私《わたし》のために、ひな人形《にんぎょう》を毎年《まいとし》欠《か》かさず飾《かざ》ってくれる。", "choices_ruby": ["孫娘《まごむすめ》", "息子《むすこ》", "姪《めい》", "いとこ"], "explanation_ruby": "grand + daughter。男《おとこ》の孫《まご》は grandson。", "body_kana": "そぼは<granddaughter>のわたしのために、ひなにんぎょうをまいとしかかさずかざってくれる。"}, {"word": "grandson", "meaning_jp": "孫息子", "pos": "名", "body": "祖父は<grandson>の弟が生まれた日、病院で「跡継ぎだ」と泣いて喜んだと母から聞いた。", "choices": ["孫息子", "孫娘", "甥の友達", "長男"], "correct_index": 0, "explanation": "grand + son。女の孫は granddaughter。", "id": "s4_229", "body_ruby": "祖父《そふ》は<grandson>の弟《おとうと》が生《う》まれた日《にち》、病院《びょういん》で「跡継《あとつ》ぎだ」と泣《な》いて喜《よろこ》んだと母《はは》から聞《き》いた。", "choices_ruby": ["孫息子《まごむすこ》", "孫娘《まごむすめ》", "甥《おい》の友達《ともだち》", "長男《ちょうなん》"], "explanation_ruby": "grand + son。女《おんな》の孫《まご》は granddaughter。", "body_kana": "そふは<grandson>のおとうとがうまれたにち、びょういんで「あとつぎだ」とないてよろこんだとははからきいた。"}, {"word": "grass", "meaning_jp": "草、芝生", "pos": "名", "body": "サッカー場の<grass>は短く刈りそろえられ、裸足で歩くとちくちくと心地よかった。", "choices": ["芝生", "土", "砂", "落ち葉"], "correct_index": 0, "explanation": "glass(ガラス)とつづり違いに注意。", "id": "s4_230", "body_ruby": "サッカー場《ば》の<grass>は短《みじか》く刈《か》りそろえられ、裸足《はだし》で歩《ある》くとちくちくと心地《ここち》よかった。", "choices_ruby": ["芝生《しばふ》", "土《つち》", "砂《すな》", "｜落ち葉《おちば》"], "explanation_ruby": "glass(ガラス)とつづり違《ちが》いに注意《ちゅうい》。", "body_kana": "サッカーばの<grass>はみじかくかりそろえられ、はだしであるくとちくちくとここちよかった。"}, {"word": "Greece", "meaning_jp": "ギリシャ", "pos": "名", "body": "オリンピック発祥の地<Greece>には、パルテノン神殿など2500年前の建物が今も残っている。", "choices": ["ギリシャ", "イタリア", "エジプト", "トルコ"], "correct_index": 0, "explanation": "首都はアテネ。Greek = ギリシャの・ギリシャ語。", "id": "s4_231", "body_ruby": "オリンピック発祥《はっしょう》の地《ち》<Greece>には、パルテノン神殿《しんでん》など2500年《ねん》前《まえ》の建物《たてもの》が今《いま》も残《のこ》っている。", "choices_ruby": ["ギリシャ", "イタリア", "エジプト", "トルコ"], "explanation_ruby": "首都《しゅと》はアテネ。Greek = ギリシャの・ギリシャ語《ご》。", "body_kana": "オリンピックはっしょうのち<Greece>には、パルテノンしんでんなど2500年まえのたてものがいまものこっている。"}, {"word": "greet", "meaning_jp": "あいさつする", "pos": "動", "body": "登校時、校門に立つ校長先生が、生徒一人ひとりを「おはよう」と<greet>してくれる。", "choices": ["あいさつする", "無視する", "注意する", "呼び止める"], "correct_index": 0, "explanation": "greeting = あいさつ。", "id": "s4_232", "body_ruby": "登校時《とうこうじ》、校門《こうもん》に立《た》つ校長先生《こうちょうせんせい》が、生徒《せいと》一人《ひとり》ひとりを「おはよう」と<greet>してくれる。", "choices_ruby": ["あいさつする", "無視《むし》する", "注意《ちゅうい》する", "呼《よ》び止《や》める"], "explanation_ruby": "greeting = あいさつ。", "body_kana": "とうこうじ、こうもんにたつこうちょうせんせいが、せいとひとりひとりを「おはよう」と<greet>してくれる。"}, {"word": "greeting", "meaning_jp": "あいさつ", "pos": "名", "body": "年賀状は新年の<greeting>を伝える日本の習慣で、元日の朝に届くよう年内に投函する。", "choices": ["あいさつ", "請求", "命令", "報告"], "correct_index": 0, "explanation": "greet + -ing。greeting card = グリーティングカード。", "id": "s4_233", "body_ruby": "年賀状《ねんがじょう》は新年《しんねん》の<greeting>を伝《つた》える日本《にっぽん》の習慣《しゅうかん》で、元日《がんじつ》の朝《あさ》に届《とど》くよう年内《ねんない》に投函《とうかん》する。", "choices_ruby": ["あいさつ", "請求《せいきゅう》", "命令《めいれい》", "報告《ほうこく》"], "explanation_ruby": "greet + -ing。greeting card = グリーティングカード。", "body_kana": "ねんがじょうはしんねんの<greeting>をつたえるにっぽんのしゅうかんで、がんじつのあさにとどくようねんないにとうかんする。"}, {"word": "grin", "meaning_jp": "にやりと笑う", "pos": "動", "body": "サプライズの計画がばれていないと知った彼は、口の端を上げて<grin>しながら準備を続けた。", "choices": ["にやりと笑う", "大声で泣く", "眉をひそめる", "あくびをする"], "correct_index": 0, "explanation": "歯を見せてにっと笑うこと。", "id": "s4_234", "body_ruby": "サプライズの計画《けいかく》がばれていないと知《し》った彼《かれ》は、口《くち》の端《はじ》を上《あ》げて<grin>しながら準備《じゅんび》を続《つづ》けた。", "choices_ruby": ["にやりと笑《わら》う", "大声《おおごえ》で泣《な》く", "眉《まゆ》をひそめる", "あくびをする"], "explanation_ruby": "歯《は》を見《み》せてにっと笑《わら》うこと。", "body_kana": "サプライズのけいかくがばれていないとしったかれは、くちのはじをあげて<grin>しながらじゅんびをつづけた。"}, {"word": "guess", "meaning_jp": "推測する", "pos": "動", "body": "箱の中身を触らずに<guess>するゲームで、音と重さだけを頼りに「みかん!」と答えたら正解だった。", "choices": ["推測する", "確認する", "計測する", "報告する"], "correct_index": 0, "explanation": "Guess what! = ねえ聞いて!(当ててみて)", "id": "s4_235", "body_ruby": "箱《はこ》の中身《なかみ》を触《ふ》らずに<guess>するゲームで、音《おと》と重《おも》さだけを頼《たよ》りに「みかん!」と答《こた》えたら正解《せいかい》だった。", "choices_ruby": ["推測《すいそく》する", "確認《かくにん》する", "計測《けいそく》する", "報告《ほうこく》する"], "explanation_ruby": "Guess what! = ねえ聞《き》いて!(当《あ》ててみて)", "body_kana": "はこのなかみをふらずに<guess>するゲームで、おととおもさだけをたよりに「みかん!」とこたえたらせいかいだった。"}, {"word": "guide", "meaning_jp": "案内人、ガイド", "pos": "名", "body": "洞窟ツアーの<guide>は、ヘルメットのライトで足元を照らしながら、岩の名前と歴史を説明してくれた。", "choices": ["案内人", "観光客", "運転手", "売店の人"], "correct_index": 0, "explanation": "guidebook = 旅行案内書。動詞では「案内する」。", "id": "s4_236", "body_ruby": "洞窟《どうくつ》ツアーの<guide>は、ヘルメットのライトで足元《あしもと》を照《て》らしながら、岩《いわ》の名前《なまえ》と歴史《れきし》を説明《せつめい》してくれた。", "choices_ruby": ["案内人《あんないにん》", "観光客《かんこうきゃく》", "運転手《うんてんしゅ》", "売店《ばいてん》の人《にん》"], "explanation_ruby": "guidebook = 旅行《りょこう》案内書《あんないしょ》。動詞《どうし》では「案内《あんない》する」。", "body_kana": "どうくつツアーの<guide>は、ヘルメットのライトであしもとをてらしながら、いわのなまえとれきしをせつめいしてくれた。"}, {"word": "gun", "meaning_jp": "銃", "pos": "名", "body": "陸上の決勝は、スターターが構えた<gun>の音が鳴った瞬間、8人が一斉に飛び出した。", "choices": ["銃", "笛", "旗", "太鼓"], "correct_index": 0, "explanation": "スタートの号砲(本物の弾は入っていない)。", "id": "s4_237", "body_ruby": "陸《りく》上《うえ》の決勝《けっしょう》は、スターターが構《かま》えた<gun>の音《おと》が鳴《な》った瞬間《しゅんかん》、8人《にん》が一斉《いっせい》に｜飛び出《とびだ》した。", "choices_ruby": ["銃《じゅう》", "笛《ふえ》", "旗《はた》", "太鼓《たいこ》"], "explanation_ruby": "スタートの号砲《ごうほう》(本物《ほんもの》の弾《たま》は入《はい》っていない)。", "body_kana": "りくうえのけっしょうは、スターターがかまえた<gun>のおとがなったしゅんかん、8人がいっせいにとびだした。"}, {"word": "habitat", "meaning_jp": "生息地", "pos": "名", "body": "コアラの<habitat>はユーカリの森だが、開発と山火事でその面積は年々狭まっている。", "choices": ["生息地", "動物園", "餌の種類", "天敵"], "correct_index": 0, "explanation": "生き物が自然に暮らす場所。habit(習慣)と同語源。", "id": "s4_238", "body_ruby": "コアラの<habitat>はユーカリの森《もり》だが、開発《かいはつ》と山火事《やまかじ》でその面積《めんせき》は年々《ねんねん》狭《せば》まっている。", "choices_ruby": ["生息地《せいそくち》", "動物園《どうぶつえん》", "餌《えさ》の種類《しゅるい》", "天《てん》敵《てき》"], "explanation_ruby": "｜生き物《いきもの》が自然《しぜん》に暮《く》らす場所《ばしょ》。habit(習慣《しゅうかん》)と同語《どうご》源《げん》。", "body_kana": "コアラの<habitat>はユーカリのもりだが、かいはつとやまかじでそのめんせきはねんねんせばまっている。"}, {"word": "half", "meaning_jp": "半分", "pos": "名", "body": "残ったピザを弟と<half>ずつに分けた。1枚を2人で4切れずつ、きっちり同じ数だ。", "choices": ["半分", "全部", "4分の1", "3倍"], "correct_index": 0, "explanation": "複数形は halves。half an hour = 30分。", "id": "s4_239", "body_ruby": "残《のこ》ったピザを弟《おとうと》と<half>ずつに分《わ》けた。1枚《まい》を2人《にん》で4切《き》れずつ、きっちり同《おな》じ数《かず》だ。", "choices_ruby": ["半分《はんぶん》", "全部《ぜんぶ》", "4分《ふん》の1", "3倍《ばい》"], "explanation_ruby": "複数形《ふくすうけい》は halves。half an hour = 30分《ふん》。", "body_kana": "のこったピザをおとうとと<half>ずつにわけた。1枚を2人で4きれずつ、きっちりおなじかずだ。"}, {"word": "ham", "meaning_jp": "ハム", "pos": "名", "body": "サンドイッチに薄切りの<ham>とレタスを挟んだ。豚肉の塩気とパンの相性は間違いない。", "choices": ["ハム", "ジャム", "ツナ", "たまご"], "correct_index": 0, "explanation": "豚肉の加工食品。ham and eggs = ハムエッグ。", "id": "s4_240", "body_ruby": "サンドイッチに薄切《うすぎ》りの<ham>とレタスを挟《はさ》んだ。豚肉《ぶたにく》の塩気《しおけ》とパンの相性《あいしょう》は間違《まちが》いない。", "choices_ruby": ["ハム", "ジャム", "ツナ", "たまご"], "explanation_ruby": "豚肉《ぶたにく》の加工《かこう》食品《しょくひん》。ham and eggs = ハムエッグ。", "body_kana": "サンドイッチにうすぎりの<ham>とレタスをはさんだ。ぶたにくのしおけとパンのあいしょうはまちがいない。"}, {"word": "handle", "meaning_jp": "取っ手、対処する", "pos": "名/動", "body": "やかんが熱いときは、必ず<handle>の部分を持つ。本体に触れたら、やけどではすまない。", "choices": ["取っ手", "ふた", "底", "注ぎ口"], "correct_index": 0, "explanation": "hand(手)+ -le。車のハンドルは steering wheel。", "id": "s4_241", "body_ruby": "やかんが熱《あつ》いときは、必《かなら》ず<handle>の部分《ぶぶん》を持《も》つ。本体《ほんたい》に触《ふ》れたら、やけどではすまない。", "choices_ruby": ["取《と》っ手《て》", "ふた", "底《そこ》", "注《そそ》ぎ口《くち》"], "explanation_ruby": "hand(手《て》)+ -le。車《くるま》のハンドルは steering wheel。", "body_kana": "やかんがあついときは、かならず<handle>のぶぶんをもつ。ほんたいにふれたら、やけどではすまない。"}, {"word": "happiness", "meaning_jp": "幸福", "pos": "名", "body": "「<happiness>はお金で買えるか」という道徳の議論で、クラスの意見は真っ二つに割れた。", "choices": ["幸福", "知識", "健康", "時間"], "correct_index": 0, "explanation": "happy + -ness。幸せという状態。", "id": "s4_242", "body_ruby": "「<happiness>はお金《かね》で買《か》えるか」という道徳《どうとく》の議論《ぎろん》で、クラスの意見《いけん》は｜真っ二《まっぷた》つに割《わ》れた。", "choices_ruby": ["幸福《こうふく》", "知識《ちしき》", "健康《けんこう》", "時間《じかん》"], "explanation_ruby": "happy + -ness。幸《しあわ》せという状態《じょうたい》。", "body_kana": "「<happiness>はおかねでかえるか」というどうとくのぎろんで、クラスのいけんはまっぷたつにわれた。"}, {"word": "harvest", "meaning_jp": "収穫", "pos": "名", "body": "秋の<harvest>の時期、田んぼでは稲刈り機がうなり、軒先に新米の袋が積み上がった。", "choices": ["収穫", "種まき", "田植え", "草取り"], "correct_index": 0, "explanation": "実った作物を取り入れること。", "id": "s4_243", "body_ruby": "秋《あき》の<harvest>の時期《じき》、田《た》んぼでは稲刈《いねか》り機《き》がうなり、軒先《のきさき》に新米《しんまい》の袋《ふくろ》が積《つ》み上《あ》がった。", "choices_ruby": ["収穫《しゅうかく》", "種《たね》まき", "田植《たう》え", "草取《くさとり》り"], "explanation_ruby": "実《みの》った作物《さくもつ》を取《と》り入《い》れること。", "body_kana": "あきの<harvest>のじき、たんぼではいねかりきがうなり、のきさきにしんまいのふくろがつみあがった。"}, {"word": "hatred", "meaning_jp": "憎しみ", "pos": "名", "body": "戦争の語り部は「<hatred>は次の戦争を生む。だから私は憎まず、伝え続ける」と静かに語った。", "choices": ["憎しみ", "愛情", "尊敬", "好奇心"], "correct_index": 0, "explanation": "hate(憎む)の名詞形。love(愛)の対。", "id": "s4_244", "body_ruby": "戦争《せんそう》の語《かた》り部《ぶ》は「<hatred>は次《つぎ》の戦争《せんそう》を生《う》む。だから私《わたし》は憎《にく》まず、伝《つた》え続《つづ》ける」と静《しず》かに語《かた》った。", "choices_ruby": ["憎《にく》しみ", "愛情《あいじょう》", "尊敬《そんけい》", "好奇心《こうきしん》"], "explanation_ruby": "hate(憎《にく》む)の名詞《めいし》形《かたち》。love(愛《あい》)の対《つい》。", "body_kana": "せんそうのかたりぶは「<hatred>はつぎのせんそうをうむ。だからわたしはにくまず、つたえつづける」としずかにかたった。"}, {"word": "Hawaiian", "meaning_jp": "ハワイの", "pos": "形/名", "body": "<Hawaiian>の伝統料理ポキは、新鮮なマグロをしょうゆベースのたれであえた一品だ。", "choices": ["ハワイの", "メキシコの", "インドの", "韓国の"], "correct_index": 0, "explanation": "Hawaii + -an。アロハシャツはHawaiian shirt。", "id": "s4_245", "body_ruby": "<Hawaiian>の伝統料理《でんとうりょうり》ポキは、新鮮《しんせん》なマグロをしょうゆベースのたれであえた一品《いっぴん》だ。", "choices_ruby": ["ハワイの", "メキシコの", "インドの", "韓国《かんこく》の"], "explanation_ruby": "Hawaii + -an。アロハシャツはHawaiian shirt。", "body_kana": "<Hawaiian>のでんとうりょうりポキは、しんせんなマグロをしょうゆベースのたれであえたいっぴんだ。"}, {"word": "heal", "meaning_jp": "治す、癒える", "pos": "動", "body": "すりむいた膝は、1週間もすれば自然に<heal>する。かさぶたを剥がさず待つのがコツだ。", "choices": ["治る", "悪化する", "腫れる", "痛む"], "correct_index": 0, "explanation": "health(健康)と同語源。傷や心が癒えること。", "id": "s4_246", "body_ruby": "すりむいた膝《ひざ》は、1週間《しゅうかん》もすれば自然《しぜん》に<heal>する。かさぶたを剥《は》がさず待《ま》つのがコツだ。", "choices_ruby": ["治《なお》る", "悪化《あっか》する", "腫《は》れる", "痛《いた》む"], "explanation_ruby": "health(健康《けんこう》)と同語《どうご》源《げん》。傷《きず》や心《こころ》が癒《い》えること。", "body_kana": "すりむいたひざは、1週間もすればしぜんに<heal>する。かさぶたをはがさずまつのがコツだ。"}, {"word": "heart", "meaning_jp": "心臓、心", "pos": "名", "body": "全力疾走のあと、<heart>がドクドクと激しく打ち、胸に手を当てるとその速さがよく分かった。", "choices": ["心臓", "肺", "胃", "脳"], "correct_index": 0, "explanation": "心臓と「心」の両方。heart rate = 心拍数。", "id": "s4_247", "body_ruby": "全力疾走《ぜんりょくしっそう》のあと、<heart>がドクドクと激《はげ》しく打《う》ち、胸《むね》に手《て》を当《あ》てるとその速《はや》さがよく分《わ》かった。", "choices_ruby": ["心臓《しんぞう》", "肺《はい》", "胃《い》", "脳《のう》"], "explanation_ruby": "心臓《しんぞう》と「心《こころ》」の両方《りょうほう》。heart rate = 心拍数《しんぱくすう》。", "body_kana": "ぜんりょくしっそうのあと、<heart>がドクドクとはげしくうち、むねにてをあてるとそのはやさがよくわかった。"}, {"word": "heat", "meaning_jp": "熱、暑さ", "pos": "名", "body": "真夏のアスファルトの<heat>はすさまじく、犬の散歩は朝夕の涼しい時間にずらしている。", "choices": ["熱", "湿気", "光", "音"], "correct_index": 0, "explanation": "hot(熱い)の名詞形。動詞では「温める」。", "id": "s4_248", "body_ruby": "真夏《まなつ》のアスファルトの<heat>はすさまじく、犬《いぬ》の散歩《さんぽ》は朝夕《あさゆう》の涼《すず》しい時間《じかん》にずらしている。", "choices_ruby": ["熱《ねつ》", "湿気《しっけ》", "光《ひかり》", "音《おと》"], "explanation_ruby": "hot(熱《あつ》い)の名詞《めいし》形《かたち》。動詞《どうし》では「温《あたた》める」。", "body_kana": "まなつのアスファルトの<heat>はすさまじく、いぬのさんぽはあさゆうのすずしいじかんにずらしている。"}, {"word": "heater", "meaning_jp": "ヒーター、暖房器具", "pos": "名", "body": "冬の朝は、起きる30分前に<heater>のタイマーをセットしておくと、部屋が暖まっていて布団から出やすい。", "choices": ["暖房器具", "扇風機", "加湿器", "冷蔵庫"], "correct_index": 0, "explanation": "heat(熱)+ -er。部屋を暖める機械。", "id": "s4_249", "body_ruby": "冬《ふゆ》の朝《あさ》は、起《お》きる30分《ふん》前《まえ》に<heater>のタイマーをセットしておくと、部屋《へや》が暖《あたた》まっていて布団 瞬間、海と空の境目がオレンジ色に燃え、波の上に光の道ができた。", "choices": ["水平線", "頂上", "海底", "雲"], "correct_index": 0, "explanation": "空と海(陸)の境の線。", "id": "s4_257", "body_ruby": "夕日《ゆうひ》が<horizon>に沈《しず》む瞬間《しゅんかん》、海《うみ》と空《そら》の境目《さかいめ》がオレンジ色《いろ》に燃《も》え、波《なみ》の上《うえ》に光《ひかり》の道《みち》ができた。", "choices_ruby": ["水平線《すいへいせん》", "頂上《ちょうじょう》", "海底《かいてい》", "雲《くも》"], "explanation_ruby": "空《そら》と海《うみ》(陸《りく》)の境《さかい》の線《せん》。", "body_kana": "ゆうひが<horizon>にしずむしゅんかん、うみとそらのさかいめがオレンジいろにもえ、なみのうえにひかりのみちができた。"}, {"word": "hotel", "meaning_jp": "ホテル", "pos": "名", "body": "旅行の夜は、駅前の<hotel>に泊まった。部屋の窓から城のライトアップが見える絶好の立地だった。", "choices": ["ホテル", "病院", "学校", "駅舎"], "correct_index": 0, "explanation": "宿泊施設。check in = 宿泊手続きをする。", "id": "s4_258", "body_ruby": "旅行《りょこう》の夜《よる》は、駅前《えきまえ》の<hotel>に泊《と》まった。部屋《へや》の窓《まど》から城《しろ》のライトアップが見《み》える絶好《ぜっこう》の立地《りっち》だった。", "choices_ruby": ["ホテル", "病院《びょういん》", "学校《がっこう》", "駅舎《えきしゃ》"], "explanation_ruby": "宿泊施設《しゅくはくしせつ》。check in = 宿泊《しゅくはく》手続《てつづ》きをする。", "body_kana": "りょこうのよるは、えきまえの<hotel>にとまった。へやのまどからしろのライトアップがみえるぜっこうのりっちだった。"}, {"word": "huge", "meaning_jp": "巨大な", "pos": "形", "body": "水族館のジンベエザメは<huge>で、全長12メートル。隣を泳ぐダイバーが小魚のように見えた。", "choices": ["巨大な", "小型の", "細長い", "透明な"], "correct_index": 0, "explanation": "big よりはるかに大きい。", "id": "s4_259", "body_ruby": "水族館《すいぞくかん》のジンベエザメは<huge>で、全長《ぜんちょう》12メートル。隣《となり》を泳《およ》ぐダイバーが小魚《こざかな》のように見《み》えた。", "choices_ruby": ["巨大《きょだい》な", "小型《こがた》の", "細長《ほそなが》い", "透明《とうめい》な"], "explanation_ruby": "big よりはるかに大《おお》きい。", "body_kana": "すいぞくかんのジンベエザメは<huge>で、ぜんちょう12メートル。となりをおよぐダイバーがこざかなのようにみえた。"}, {"word": "human", "meaning_jp": "人間", "pos": "名/形", "body": "チンパンジーのDNAは<human>と98%以上同じだと、科学館の展示パネルに書かれていた。", "choices": ["人間", "機械", "植物", "魚類"], "correct_index": 0, "explanation": "human being = 人間。humanity = 人類・人間性。", "id": "s4_260", "body_ruby": "チンパンジーのDNAは<human>と98%以上《いじょう》同《おな》じだと、科学館《かがくかん》の展示《てんじ》パネルに書《か》かれていた。", "choices_ruby": ["人間《にんげん》", "機械《きかい》", "植物《しょくぶつ》", "魚類《ぎょるい》"], "explanation_ruby": "human being = 人間《にんげん》。humanity = 人類《じんるい》・人間性《にんげんせい》。", "body_kana": "チンパンジーのDNAは<human>と98%いじょうおなじだと、かがくかんのてんじパネルにかかれていた。"}, {"word": "humid", "meaning_jp": "湿気の多い", "pos": "形", "body": "日本の夏は気温だけでなく<humid>なのがつらい。洗濯物は乾かず、ノートの紙まで波打ってくる。", "choices": ["湿気の多い", "乾燥した", "涼しい", "風の強い"], "correct_index": 0, "explanation": "humidity = 湿度。じめじめした状態。", "id": "s4_261", "body_ruby": "日本《にっぽん》の夏《なつ》は気温《きおん》だけでなく<humid>なのがつらい。洗濯物《せんたくもの》は乾《かわ》かず、ノートの紙《かみ》まで波打《なみう》ってくる。", "choices_ruby": ["湿気《しっけ》の多《おお》い", "乾燥《かんそう》した", "涼《すず》しい", "風《かぜ》の強《つよ》い"], "explanation_ruby": "humidity = 湿度《しつど》。じめじめした状態《じょうたい》。", "body_kana": "にっぽんのなつはきおんだけでなく<humid>なのがつらい。せんたくものはかわかず、ノートのかみまでなみうってくる。"}, {"word": "hunt", "meaning_jp": "狩る", "pos": "動", "body": "ライオンの群れは、夜の闇にまぎれてシマウマを<hunt>する。成功率は2割ほどだという。", "choices": ["狩る", "飼う", "逃がす", "撮影する"], "correct_index": 0, "explanation": "hunter = 狩人。job hunting = 就職活動。", "id": "s4_262", "body_ruby": "ライオンの群《む》れは、夜《よる》の闇《やみ》にまぎれてシマウマを<hunt>する。成功率《せいこうりつ》は2割《わり》ほどだという。", "choices_ruby": ["狩《か》る", "飼《か》う", "逃《に》がす", "撮影《さつえい》する"], "explanation_ruby": "hunter = 狩人《かりうど》。job hunting = 就職活動《しゅうしょくかつどう》。", "body_kana": "ライオンのむれは、よるのやみにまぎれてシマウマを<hunt>する。せいこうりつは2わりほどだという。"}, {"word": "hunter", "meaning_jp": "狩人、ハンター", "pos": "名", "body": "クマが里に下りた冬、地元の<hunter>たちが猟銃を手に山へ入り、足跡を追った。", "choices": ["狩人", "農家", "登山家", "写真家"], "correct_index": 0, "explanation": "hunt(狩る)+ -er。", "id": "s4_263", "body_ruby": "クマが里《さと》に下《お》りた冬《ふゆ》、地元《じもと》の<hunter>たちが猟銃《りょうじゅう》を手《て》に山《やま》へ入《はい》り、足跡《そくせき》を追《お》った。", "choices_ruby": ["狩人《かりうど》", "農家《のうか》", "登山《とざん》家《いえ》", "写真家《しゃしんか》"], "explanation_ruby": "hunt(狩《か》る)+ -er。", "body_kana": "クマがさとにおりたふゆ、じもとの<hunter>たちがりょうじゅうをてにやまへはいり、そくせきをおった。"}, {"word": "husband", "meaning_jp": "夫", "pos": "名", "body": "「うちの<husband>は料理が得意なんですよ」と隣の奥さんが言うと、その夫は照れくさそうに笑った。", "choices": ["夫", "妻", "息子", "兄"], "correct_index": 0, "explanation": "wife(妻)の対。", "id": "s4_264", "body_ruby": "「うちの<husband>は料理《りょうり》が得意《とくい》なんですよ」と隣《となり》の奥《おく》さんが言《い》うと、その夫《おっと》は照《て》れくさそうに笑《わら》った。", "choices_ruby": ["夫《おっと》", "妻《つま》", "息子《むすこ》", "兄《あに》"], "explanation_ruby": "wife(妻《つま》)の対《つい》。", "body_kana": "「うちの<husband>はりょうりがとくいなんですよ」ととなりのおくさんがいうと、そのおっとはてれくさそうにわらった。"}, {"word": "hymn", "meaning_jp": "賛美歌", "pos": "名", "body": "教会の結婚式では、参列者全員で<hymn>を歌い、パイプオルガンの音が天井に響いた。", "choices": ["賛美歌", "国歌", "校歌", "子守歌"], "correct_index": 0, "explanation": "神をたたえる歌。n は発音しない(ヒム)。", "id": "s4_265", "body_ruby": "教会《きょうかい》の結婚式《けっこんしき》では、参列者《さんれつしゃ》全員《ぜんいん》で<hymn>を歌《うた》い、パイプオルガンの音《おと》が天井《てんじょう》に響《ひび》いた。", "choices_ruby": ["賛美歌《さんびか》", "国歌《こっか》", "校歌《こうか》", "子守歌《こもりうた》"], "explanation_ruby": "神《かみ》をたたえる歌《うた》。n は発音《はつおん》しない(ヒム)。", "body_kana": "きょうかいのけっこんしきでは、さんれつしゃぜんいんで<hymn>をうたい、パイプオルガンのおとがてんじょうにひびいた。"}, {"word": "ice", "meaning_jp": "氷", "pos": "名", "body": "真夏のジュースには<ice>をたっぷり入れる。カランと鳴る音だけで涼しく感じる。", "choices": ["氷", "塩", "砂糖", "炭酸"], "correct_index": 0, "explanation": "ice cream、iceberg(氷山)など複合語が多い。", "id": "s4_266", "body_ruby": "真夏《まなつ》のジュースには<ice>をたっぷり入《い》れる。カランと鳴《な》る音《おと》だけで涼《すず》しく感《かん》じる。", "choices_ruby": ["氷《こおり》", "塩《しお》", "砂糖《さとう》", "炭酸《たんさん》"], "explanation_ruby": "ice cream、iceberg(氷山《ひょうざん》)など複合語《ふくごうご》が多《おお》い。", "body_kana": "まなつのジュースには<ice>をたっぷりいれる。カランとなるおとだけですずしくかんじる。"}, {"word": "iced", "meaning_jp": "冷やした、氷入りの", "pos": "形", "body": "部活帰りに飲む<iced>のコーヒーは、グラスの外側まで水滴がついて、ひと口で生き返る心地がする。", "choices": ["氷で冷やした", "温めた", "凍らせて固めた", "薄めた"], "correct_index": 0, "explanation": "iced tea = アイスティー。ice + -ed。", "id": "s4_267", "body_ruby": "部活《ぶかつ》帰《かえ》りに飲《の》む<iced>のコーヒーは、グラスの外側《そとがわ》まで水滴《すいてき》がついて、ひと口《くち》で｜生き返《いきかえ》る心地《ここち》がする。", "choices_ruby": ["氷《こおり》で冷《ひ》やした", "温《あたた》めた", "凍《こお》らせて固《かた》めた", "薄《うす》めた"], "explanation_ruby": "iced tea = アイスティー。ice + -ed。", "body_kana": "ぶかつかえりにのむ<iced>のコーヒーは、グラスのそとがわまですいてきがついて、ひとくちでいきかえるここちがする。"}, {"word": "imagine", "meaning_jp": "想像する", "pos": "動", "body": "100年後の町を<imagine>して絵に描く授業で、私は空飛ぶスクールバスと海中トンネルを描いた。", "choices": ["想像する", "記録する", "測量する", "復元する"], "correct_index": 0, "explanation": "image(イメージ)の動詞形。imagination = 想像力。", "id": "s4_268", "body_ruby": "100年《ねん》後《のち》の町《まち》を<imagine>して絵《え》に描《えが》く授業《じゅぎょう》で、私《わたし》は空《そら》飛《と》ぶスクールバスと海中《かいちゅう》トンネルを描《えが》いた。", "choices_ruby": ["想像《そうぞう》する", "記録《きろく》する", "測量《そくりょう》する", "復元《ふくげん》する"], "explanation_ruby": "image(イメージ)の動詞形《どうしけい》。imagination = 想像力《そうぞうりょく》。", "body_kana": "100年のちのまちを<imagine>してえにえがくじゅぎょうで、わたしはそらとぶスクールバスとかいちゅうトンネルをえがいた。"}, {"word": "impressive", "meaning_jp": "印象的な", "pos": "形", "body": "1年生ながら3年生を相手に一歩も引かない彼のプレーは、観客にも相手チームにも<impressive>だった。", "choices": ["印象的な", "平凡な", "不快な", "地味な"], "correct_index": 0, "explanation": "impress(感銘を与える)+ -ive。", "id": "s4_269", "body_ruby": "1年生《ねんせい》ながら3年生《ねんせい》を相手《あいて》に一歩《いっぽ》も引《ひ》かない彼《かれ》のプレーは、観客《かんきゃく》にも相手《あいて》チームにも<impressive>だった。", "choices_ruby": ["印象的《いんしょうてき》な", "平凡《へいぼん》な", "不快《ふかい》な", "地味《じみ》な"], "explanation_ruby": "impress(感銘《かんめい》を与《あた》える)+ -ive。", "body_kana": "1年生ながら3年生をあいてにいっぽもひかないかれのプレーは、かんきゃくにもあいてチームにも<impressive>だった。"}, {"word": "including", "meaning_jp": "〜を含めて", "pos": "前", "body": "送料<including>で2,980円という表示だったので、追加の支払いはないと分かって安心した。", "choices": ["〜を含めて", "〜を除いて", "〜より安く", "〜とは別に"], "correct_index": 0, "explanation": "include(含む)の分詞。excluding(〜を除き)の対。", "id": "s4_270", "body_ruby": "送料《そうりょう》<including>で2,980円《えん》という表示《ひょうじ》だったので、追加《ついか》の支払《しはら》いはないと分《わ》かって安心《あんしん》した。", "choices_ruby": ["〜を含《ふく》めて", "〜を除《のぞ》いて", "〜より安《やす》く", "〜とは別《べつ》に"], "explanation_ruby": "include(含《ふく》む)の分詞《ぶんし》。excluding(〜を除《のぞ》き)の対《つい》。", "body_kana": "そうりょう<including>で2,980円というひょうじだったので、ついかのしはらいはないとわかってあんしんした。"}, {"word": "increase", "meaning_jp": "増える、増やす", "pos": "動", "body": "駅前に大学ができてから、この町の人口は5年で2割も<increase>した。新しいアパートも次々建っている。", "choices": ["増える", "減る", "止まる", "逆転する"], "correct_index": 0, "explanation": "decrease(減る)の対。", "id": "s4_271", "body_ruby": "駅前《えきまえ》に大学《だいがく》ができてから、この町《まち》の人口《じんこう》は5年《ねん》で2割《わり》も<increase>した。新《あたら》しいアパートも次々《つぎつぎ》建《た》っている。", "choices_ruby": ["増《ふ》える", "減《へ》る", "止《と》まる", "逆転《ぎゃくてん》する"], "explanation_ruby": "decrease(減《へ》る)の対《つい》。", "body_kana": "えきまえにだいがくができてから、このまちのじんこうは5年で2わりも<increase>した。あたらしいアパートもつぎつぎたっている。"}, {"word": "incredibly", "meaning_jp": "信じられないほど", "pos": "副", "body": "彼女の計算は<incredibly>速い。3桁のかけ算を、私が筆算を書き始める前に暗算で答えてしまう。", "choices": ["信じられないほど", "ほんの少し", "予想通りに", "ゆっくりと"], "correct_index": 0, "explanation": "in(否定)+ credible(信じられる)+ -ly。", "id": "s4_272", "body_ruby": "彼女《かのじょ》の計算《けいさん》は<incredibly>速《はや》い。3桁《けた》のかけ算《さん》を、私《わたし》が筆算《ひっさん》を｜書き始《かきはじ》める前《まえ》に暗算《あんざん》で答《こた》えてしまう。", "choices_ruby": ["信《しん》じられないほど", "ほんの少《すこ》し", "予想《よそう》通《とお》りに", "ゆっくりと"], "explanation_ruby": "in(否定《ひてい》)+ credible(信《しん》じられる)+ -ly。", "body_kana": "かのじょのけいさんは<incredibly>はやい。3けたのかけさんを、わたしがひっさんをかきはじめるまえにあんざんでこたえてしまう。"}, {"word": "indoors", "meaning_jp": "屋内で", "pos": "副", "body": "猛暑日の体育は、校庭ではなく<indoors>に変更され、体育館でバレーボールをした。", "choices": ["屋内で", "屋外で", "水中で", "山で"], "correct_index": 0, "explanation": "outdoors(屋外で)の対。", "id": "s4_273", "body_ruby": "猛暑日《もうしょび》の体育《たいいく》は、校庭《こうてい》ではなく<indoors>に変更《へんこう》され、体育館《たいいくかん》でバレーボールをした。", "choices_ruby": ["屋内《おくない》で", "屋外《おくがい》で", "水中《すいちゅう》で", "山《やま》で"], "explanation_ruby": "outdoors(屋外《おくがい》で)の対《つい》。", "body_kana": "もうしょびのたいいくは、こうていではなく<indoors>にへんこうされ、たいいくかんでバレーボールをした。"}, {"word": "industry", "meaning_jp": "産業", "pos": "名", "body": "この県は自動車の<industry>が盛んで、組み立て工場と部品メーカーで働く人が10万人を超える。", "choices": ["産業", "観光名所", "祭り", "方言"], "correct_index": 0, "explanation": "industrial = 産業の。製造業・〜業。", "id": "s4_274", "body_ruby": "この県《けん》は自動車《じどうしゃ》の<industry>が盛《さか》んで、｜組み立《くみた》て工場《こうじょう》と部品《ぶひん》メーカーで働《はたら》く人《にん》が10万人《まんにん》を超《こ》える。", "choices_ruby": ["産業《さんぎょう》", "観光名所《かんこうめいしょ》", "祭《まつ》り", "方言《ほうげん》"], "explanation_ruby": "industrial = 産業《さんぎょう》の。製造業《せいぞうぎょう》・〜業《ぎょう》。", "body_kana": "このけんはじどうしゃの<industry>がさかんで、くみたてこうじょうとぶひんメーカーではたらくにんが10まんにんをこえる。"}, {"word": "injury", "meaning_jp": "けが", "pos": "名", "body": "足首の<injury>が完治するまで3週間、彼は走るのを我慢して、上半身の筋トレだけ続けた。", "choices": ["けが", "病気", "疲れ", "緊張"], "correct_index": 0, "explanation": "injure(傷つける)の名詞形。スポーツのけがに多用。", "id": "s4_275", "body_ruby": "足首《あしくび》の<injury>が完治《かんち》するまで3週間《しゅうかん》、彼《かれ》は走《はし》るのを我慢《がまん》して、上半身《じょうはんしん》の筋《すじ》トレだけ続《つづ》けた。", "choices_ruby": ["けが", "病気《びょうき》", "疲《つか》れ", "緊張《きんちょう》"], "explanation_ruby": "injure(傷《きず》つける)の名詞《めいし》形《かたち》。スポーツのけがに多用《たよう》。", "body_kana": "あしくびの<injury>がかんちするまで3週間、かれははしるのをがまんして、じょうはんしんのすじトレだけつづけた。"}, {"word": "insect", "meaning_jp": "昆虫", "pos": "名", "body": "カブトムシやチョウなどの<insect>は、足が6本で体が3つの部分に分かれている。クモは足8本なので違う。", "choices": ["昆虫", "鳥", "魚", "ほ乳類"], "correct_index": 0, "explanation": "6本足の虫。bug よりかたい語。", "id": "s4_276", "body_ruby": "カブトムシやチョウなどの<insect>は、足《あし》が6本《ほん》で体《からだ》が3つの部分《ぶぶん》に分《わ》かれている。クモは足《あし》8本《ほん》なので違《ちが》う。", "choices_ruby": ["昆虫《こんちゅう》", "鳥《とり》", "魚《さかな》", "ほ乳類《にゅうるい》"], "explanation_ruby": "6本《ほん》足《あし》の虫《むし》。bug よりかたい語《ご》。", "body_kana": "カブトムシやチョウなどの<insect>は、あしが6本でからだが3つのぶぶんにわかれている。クモはあし8本なのでちがう。"}, {"word": "insult", "meaning_jp": "侮辱する", "pos": "動", "body": "相手の見た目を笑いのネタにするのは、本人にそのつもりがなくても人を<insult>する行為だ。", "choices": ["侮辱する", "尊重する", "励ます", "紹介する"], "correct_index": 0, "explanation": "人の誇りを傷つけること。", "id": "s4_277", "body_ruby": "相手《あいて》の｜見た目《みため》を笑《わら》いのネタにするのは、本人《ほんにん》にそのつもりがなくても人《にん》を<insult>する行為《こうい》だ。", "choices_ruby": ["侮辱《ぶじょく》する", "尊重《そんちょう》する", "励《はげ》ます", "紹介《しょうかい》する"], "explanation_ruby": "人《にん》の誇《ほこ》りを傷《きず》つけること。", "body_kana": "あいてのみためをわらいのネタにするのは、ほんにんにそのつもりがなくてもにんを<insult>するこういだ。"}, {"word": "introduce", "meaning_jp": "紹介する", "pos": "動", "body": "転校初日、担任の先生が私を教室の前で<introduce>してくれて、私は名前と前の学校を話した。", "choices": ["紹介する", "隠す", "比べる", "試験する"], "correct_index": 0, "explanation": "introduction = 紹介・導入。自己紹介 = introduce myself。", "id": "s4_278", "body_ruby": "転校初日《てんこうしょにち》、担任《たんにん》の先生《せんせい》が私《わたし》を教室《きょうしつ》の前《まえ》で<introduce>してくれて、私《わたし》は名前《なまえ》と前《まえ》の学校《がっこう》を話《はな》した。", "choices_ruby": ["紹介《しょうかい》する", "隠《かく》す", "比《くら》べる", "試験《しけん》する"], "explanation_ruby": "introduction = 紹介《しょうかい》・導入《どうにゅう》。自己紹介《じこしょうかい》 = introduce myself。", "body_kana": "てんこうしょにち、たんにんのせんせいがわたしをきょうしつのまえで<introduce>してくれて、わたしはなまえとまえのがっこうをはなした。"}, {"word": "Italian", "meaning_jp": "イタリア語、イタリアの", "pos": "名/形", "body": "<Italian>料理の店で、本場仕込みの窯焼きピザを食べた。生地の縁はもちもちで香ばしかった。", "choices": ["イタリアの", "フランスの", "ギリシャの", "トルコの"], "correct_index": 0, "explanation": "Italy + -an。パスタやピザの本場。", "id": "s4_279", "body_ruby": "<Italian>料理《りょうり》の店《みせ》で、本場《ほんば》仕込《しこ》みの窯《かま》焼《や》きピザを食《た》べた。生地《きじ》の縁《へり》はもちもちで香《こう》ばしかった。", "choices_ruby": ["イタリアの", "フランスの", "ギリシャの", "トルコの"], "explanation_ruby": "Italy + -an。パスタやピザの本場《ほんば》。", "body_kana": "<Italian>りょうりのみせで、ほんばしこみのかまやきピザをたべた。きじのへりはもちもちでこうばしかった。"}, {"word": "itchy", "meaning_jp": "かゆい", "pos": "形", "body": "蚊に刺された足首が<itchy>でたまらないが、かくと余計ひどくなるので、薬を塗って我慢した。", "choices": ["かゆい", "痛い", "冷たい", "しびれた"], "correct_index": 0, "explanation": "itch(かゆみ)+ -y。", "id": "s4_280", "body_ruby": "蚊《か》に刺《さ》された足首《あしくび》が<itchy>でたまらないが、かくと余計《よけい》ひどくなるので、薬《くすり》を塗《ぬ》って我慢《がまん》した。", "choices_ruby": ["かゆい", "痛《いた》い", "冷《つめ》たい", "しびれた"], "explanation_ruby": "itch(かゆみ)+ -y。", "body_kana": "かにさされたあしくびが<itchy>でたまらないが、かくとよけいひどくなるので、くすりをぬってがまんした。"}, {"word": "jacket", "meaning_jp": "ジャケット、上着", "pos": "名", "body": "朝晩が冷えてきたので、シャツの上に薄手の<jacket>を羽織って登校するようになった。", "choices": ["上着", "ズボン", "マフラー", "下着"], "correct_index": 0, "explanation": "前開きの上着。life jacket = 救命胴衣。", "id": "s4_281", "body_ruby": "朝晩《あさばん》が冷《ひ》えてきたので、シャツの上《うえ》に薄手《うすで》の<jacket>を羽織《はおり》って登校《とうこう》するようになった。", "choices_ruby": ["上着《うわぎ》", "ズボン", "マフラー", "下着《したぎ》"], "explanation_ruby": "前開《ぜんかい》きの上着《うわぎ》。life jacket = 救命《きゅうめい》胴衣《どうい》。", "body_kana": "あさばんがひえてきたので、シャツのうえにうすでの<jacket>をはおりってとうこうするようになった。"}, {"word": "Jones", "meaning_jp": "ジョーンズ(名字)", "pos": "名", "body": "ALTの<Jones>先生はウェールズの出身で、同じ名字の人が町に何十人もいると笑っていた。", "choices": ["英語圏の名字", "都市の名前", "曜日の名前", "教科の名前"], "correct_index": 0, "explanation": "英語圏でとても多い名字のひとつ。", "id": "s4_282", "body_ruby": "ALTの<Jones>先生《せんせい》はウェールズの出身《しゅっしん》で、同《おな》じ名字《みょうじ》の人《にん》が町《まち》に何十人《なんじゅうにん》もいると笑《わら》っていた。", "choices_ruby": ["英語圏《えいごけん》の名字《みょうじ》", "都市《とし》の名前《なまえ》", "曜日《ようび》の名前《なまえ》", "教科《きょうか》の名前《なまえ》"], "explanation_ruby": "英語圏《えいごけん》でとても多《おお》い名字《みょうじ》のひとつ。", "body_kana": "ALTの<Jones>せんせいはウェールズのしゅっしんで、おなじみょうじのにんがまちになんじゅうにんもいるとわらっていた。"}, {"word": "journalist", "meaning_jp": "ジャーナリスト、記者", "pos": "名", "body": "その<journalist>は紛争地に入り、現地の人々の声を記事にして世界へ伝え続けている。", "choices": ["記者", "小説家", "司会者", "編集長だけ"], "correct_index": 0, "explanation": "journal(新聞・日誌)+ -ist。報道に携わる人。", "id": "s4_283", "body_ruby": "その<journalist>は紛争《ふんそう》地《ち》に入《はい》り、現地《げんち》の人々《ひとびと》の声《こえ》を記事《きじ》にして世界《せかい》へ伝《つた》え続《つづ》けている。", "choices_ruby": ["記者《きしゃ》", "小説家《しょうせつか》", "司会者《しかいしゃ》", "編集長《へんしゅうちょう》だけ"], "explanation_ruby": "journal(新聞《しんぶん》・日誌《にっし》)+ -ist。報道《ほうどう》に携《たずさ》わる人《にん》。", "body_kana": "その<journalist>はふんそうちにはいり、げんちのひとびとのこえをきじにしてせかいへつたえつづけている。"}, {"word": "joy", "meaning_jp": "喜び", "pos": "名", "body": "初めて自転車に乗れた日の<joy>は今でも忘れない。世界が広がった気がして、日が暮れるまで走り回った。", "choices": ["喜び", "悲しみ", "怒り", "退屈"], "correct_index": 0, "explanation": "joyful = 喜びに満ちた。深い嬉しさ。", "id": "s4_284", "body_ruby": "初《はじ》めて自転車《じてんしゃ》に乗《の》れた日《にち》の<joy>は今《いま》でも忘《わす》れない。世界《せかい》が広《ひろ》がった気《き》がして、日《にち》が暮《く》れるまで走《はし》り回《まわ》った。", "choices_ruby": ["喜《よろこ》び", "悲《かな》しみ", "怒《いか》り", "退屈《たいくつ》"], "explanation_ruby": "joyful = 喜《よろこ》びに満《み》ちた。深《ふか》い嬉《うれ》しさ。", "body_kana": "はじめてじてんしゃにのれたにちの<joy>はいまでもわすれない。せかいがひろがったきがして、にちがくれるまではしりまわった。"}, {"word": "Judy", "meaning_jp": "ジュディ(女性の名前)", "pos": "名", "body": "ホームステイ先の<Judy>さんは、毎晩寝る前に「グッドナイト」と部屋まで声をかけてくれた。", "choices": ["女性の名前", "男性の名前", "犬種の名前", "町の名前"], "correct_index": 0, "explanation": "Judith の愛称。英語圏の女性名。", "id": "s4_285", "body_ruby": "ホームステイ先《さき》の<Judy>さんは、毎晩《まいばん》寝《ね》る前《まえ》に「グッドナイト」と部屋《へや》まで声《こえ》をかけてくれた。", "choices_ruby": ["女性《じょせい》の名前《なまえ》", "男性《だんせい》の名前《なまえ》", "犬種《けんしゅ》の名前《なまえ》", "町《まち》の名前《なまえ》"], "explanation_ruby": "Judith の愛称《あいしょう》。英語圏《えいごけん》の女性名《じょせいめい》。", "body_kana": "ホームステイさきの<Judy>さんは、まいばんねるまえに「グッドナイト」とへやまでこえをかけてくれた。"}, {"word": "kangaroo", "meaning_jp": "カンガルー", "pos": "名", "body": "オーストラリアの草原で、<kangaroo>が後ろ足で跳ねながら、おなかの袋に子どもを入れて移動していた。", "choices": ["カンガルー", "コアラ", "ラクダ", "シマウマ"], "correct_index": 0, "explanation": "袋で子を育てる有袋類の代表。", "id": "s4_286", "body_ruby": "オーストラリアの草原《そうげん》で、<kangaroo>が｜後ろ足《うしろあし》で跳《は》ねながら、おなかの袋《ふくろ》に子《こ》どもを入《い》れて移動《いどう》していた。", "choices_ruby": ["カンガルー", "コアラ", "ラクダ", "シマウマ"], "explanation_ruby": "袋《ふくろ》で子《こ》を育《そだ》てる有袋類《ゆうたいるい》の代表《だいひょう》。", "body_kana": "オーストラリアのそうげんで、<kangaroo>がうしろあしではねながら、おなかのふくろにこどもをいれていどうしていた。"}, {"word": "karaoke", "meaning_jp": "カラオケ", "pos": "名", "body": "テスト明けの放課後、友達と<karaoke>に行き、2時間で15曲をマイク片手に歌いきった。", "choices": ["カラオケ", "映画館", "ゲームセンター", "図書館"], "correct_index": 0, "explanation": "日本生まれの言葉が世界共通語になった例。", "id": "s4_287", "body_ruby": "テスト明《あ》けの放課後《ほうかご》、友達《ともだち》と<karaoke>に行《い》き、2時間《じかん》で15曲《きょく》をマイク片手《かたて》に歌《うた》いきった。", "choices_ruby": ["カラオケ", "映画館《えいがかん》", "ゲームセンター", "図書館《としょかん》"], "explanation_ruby": "日本《にっぽん》生《う》まれの言葉《ことば》が世界共通《せかいきょうつう》語《ご》になった例《れい》。", "body_kana": "テストあけのほうかご、ともだちと<karaoke>にいき、2時間で15曲をマイクかたてにうたいきった。"}, {"word": "kept", "meaning_jp": "保った、飼った", "pos": "動", "body": "祖母は嫁入り道具の鏡台を60年間<kept>していて、今も毎朝その前で髪を整える。", "choices": ["保管していた", "捨てていた", "売っていた", "壊していた"], "correct_index": 0, "explanation": "keep の過去形・過去分詞。keep-kept-kept。", "id": "s4_288", "body_ruby": "祖母《そぼ》は｜嫁入《よめい》り道具《どうぐ》の鏡台《きょうだい》を60年間《ねんかん》<kept>していて、今《いま》も毎朝《まいあさ》その前《まえ》で髪《かみ》を整《ととの》える。", "choices_ruby": ["保管《ほかん》していた", "捨《す》てていた", "売《う》っていた", "壊《こわ》していた"], "explanation_ruby": "keep の過去形《かこけい》・過去分詞《かこぶんし》。keep-kept-kept。", "body_kana": "そぼはよめいりどうぐのきょうだいを60年間<kept>していて、いまもまいあさそのまえでかみをととのえる。"}, {"word": "key", "meaning_jp": "鍵", "pos": "名", "body": "玄関の<key>をかばんの奥で探すうち、母が中からドアを開けてくれた。", "choices": ["鍵", "傘", "財布", "定期券"], "correct_index": 0, "explanation": "keyboard(鍵盤)、key point(要点)にも使う。", "id": "s4_289", "body_ruby": "玄関《げんかん》の<key>をかばんの奥《おく》で探《さが》すうち、母《はは》が中《なか》からドアを開《ひら》けてくれた。", "choices_ruby": ["鍵《かぎ》", "傘《かさ》", "財布《さいふ》", "定期券《ていきけん》"], "explanation_ruby": "keyboard(鍵盤《けんばん》)、key point(要点《ようてん》)にも使《つか》う。", "body_kana": "げんかんの<key>をかばんのおくでさがすうち、ははがなかからドアをひらけてくれた。"}, {"word": "keyhole", "meaning_jp": "鍵穴", "pos": "名", "body": "古い洋館の扉には大きな<keyhole>があり、覗き込むと向こうの部屋がわずかに見えた。", "choices": ["鍵穴", "取っ手", "蝶番", "呼び鈴"], "correct_index": 0, "explanation": "key + hole。鍵を差し込む穴。", "id": "s4_290", "body_ruby": "古《ふる》い洋館《ようかん》の扉《とびら》には大《おお》きな<keyhole>があり、覗《のぞ》き込《こ》むと向《む》こうの部屋《へや》がわずかに見《み》えた。", "choices_ruby": ["鍵穴《かぎあな》", "取《と》っ手《て》", "蝶番《ちょうつがい》", "呼《よ》び鈴《すず》"], "explanation_ruby": "key + hole。鍵《かぎ》を｜差し込《さしこ》む穴《あな》。", "body_kana": "ふるいようかんのとびらにはおおきな<keyhole>があり、のぞきこむとむこうのへやがわずかにみえた。"}, {"word": "kick", "meaning_jp": "蹴る", "pos": "動", "body": "ペナルティーエリアでボールを<kick>した瞬間、ゴール右上に吸い込まれ、スタンドが揺れた。", "choices": ["蹴る", "投げる", "打つ", "止める"], "correct_index": 0, "explanation": "足で打つこと。kickoff = 試合開始。", "id": "s4_291", "body_ruby": "ペナルティーエリアでボールを<kick>した瞬間《しゅんかん》、ゴール右上《みぎうえ》に｜吸い込《すいこ》まれ、スタンドが揺《ゆ》れた。", "choices_ruby": ["蹴《け》る", "投《な》げる", "打《う》つ", "止《や》める"], "explanation_ruby": "足《あし》で打《う》つこと。kickoff = 試合開始《しあいかいし》。", "body_kana": "ペナルティーエリアでボールを<kick>したしゅんかん、ゴールみぎうえにすいこまれ、スタンドがゆれた。"}, {"word": "kilogram", "meaning_jp": "キログラム", "pos": "名", "body": "新生児の体重はおよそ3<kilogram>。スイカ1玉とほぼ同じ重さだと聞くと、抱く手に実感がわく。", "choices": ["キログラム", "キロメートル", "リットル", "センチ"], "correct_index": 0, "explanation": "kg。1000グラム。kilo はギリシャ語で1000。", "id": "s4_292", "body_ruby": "新生児《しんせいじ》の体重《たいじゅう》はおよそ3<kilogram>。スイカ1玉《たま》とほぼ同《おな》じ重《おも》さだと聞《き》くと、抱《だ》く手《て》に実感《じっかん》がわく。", "choices_ruby": ["キログラム", "キロメートル", "リットル", "センチ"], "explanation_ruby": "kg。1000グラム。kilo はギリシャ語《ご》で1000。", "body_kana": "しんせいじのたいじゅうはおよそ3<kilogram>。スイカ1たまとほぼおなじおもさだときくと、だくてにじっかんがわく。"}, {"word": "king", "meaning_jp": "王", "pos": "名", "body": "チェスでは<king>を取られたら負けだ。最も大切な駒なのに、動きは1マスずつと意外に地味だ。", "choices": ["王", "女王", "騎士", "兵士"], "correct_index": 0, "explanation": "queen(女王)の対。kingdom = 王国。", "id": "s4_293", "body_ruby": "チェスでは<king>を取《と》られたら負《ま》けだ。最《もっと》も大切《たいせつ》な駒《こま》なのに、動《うご》きは1マスずつと意外《いがい》に地味《じみ》だ。", "choices_ruby": ["王《おう》", "女王《じょおう》", "騎士《きし》", "兵士《へいし》"], "explanation_ruby": "queen(女王《じょおう》)の対《つい》。kingdom = 王国《おうこく》。", "body_kana": "チェスでは<king>をとられたらまけだ。もっともたいせつなこまなのに、うごきは1マスずつといがいにじみだ。"}, {"word": "knock", "meaning_jp": "ノックする、叩く", "pos": "動", "body": "職員室のドアを2回<knock>して、「失礼します」と言ってから中に入った。", "choices": ["叩く", "開け放つ", "施錠する", "塗装する"], "corre "記録係", "応援係", "新入り"], "correct_index": 0, "explanation": "lead(導く)+ -er。leadership = 指導力。", "id": "s4_298", "body_ruby": "班《はん》の<leader>に選《えら》ばれた彼女《かのじょ》は、まず全員《ぜんいん》の意見《いけん》を聞《き》いてから、役割分担《やくわりぶんたん》を決《き》めた。", "choices_ruby": ["指導者《しどうしゃ》", "記録係《きろくがかり》", "応援《おうえん》係《かかり》", "｜新入《しんい》り"], "explanation_ruby": "lead(導《みちび》く)+ -er。leadership = 指導力《しどうりょく》。", "body_kana": "はんの<leader>にえらばれたかのじょは、まずぜんいんのいけんをきいてから、やくわりぶんたんをきめた。"}, {"word": "lemon", "meaning_jp": "レモン", "pos": "名", "body": "はちみつに輪切りの<lemon>を漬け込むと、部活の差し入れに最高の、甘酸っぱい一品になる。", "choices": ["レモン", "りんご", "もも", "メロン"], "correct_index": 0, "explanation": "黄色く酸っぱい柑橘類。", "id": "s4_299", "body_ruby": "はちみつに輪切《わぎ》りの<lemon>を漬《つ》け込《こ》むと、部活《ぶかつ》の差《さ》し入《い》れに最高《さいこう》の、甘酸《あまず》っぱい一品《いっぴん》になる。", "choices_ruby": ["レモン", "りんご", "もも", "メロン"], "explanation_ruby": "黄色《きいろ》く酸《す》っぱい柑橘類《かんきつるい》。", "body_kana": "はちみつにわぎりの<lemon>をつけこむと、ぶかつのさしいれにさいこうの、あまずっぱいいっぴんになる。"}, {"word": "lend", "meaning_jp": "貸す", "pos": "動", "body": "消しゴムを忘れた隣の席の子に、予備の1個を<lend>した。翌朝、お礼の飴と一緒に返ってきた。", "choices": ["貸す", "借りる", "もらう", "売る"], "correct_index": 0, "explanation": "borrow(借りる)の対。lend-lent-lent。", "id": "s4_300", "body_ruby": "消《け》しゴムを忘《わす》れた隣《となり》の席《せき》の子《こ》に、予備《よび》の1個《こ》を<lend>した。翌朝《よくあさ》、お礼《れい》の飴《あめ》と一緒《いっしょ》に返《かえ》ってきた。", "choices_ruby": ["貸《か》す", "借《か》りる", "もらう", "売《う》る"], "explanation_ruby": "borrow(借《か》りる)の対《つい》。lend-lent-lent。", "body_kana": "けしゴムをわすれたとなりのせきのこに、よびの1個を<lend>した。よくあさ、おれいのあめといっしょにかえってきた。"}, {"word": "limited", "meaning_jp": "限られた", "pos": "形", "body": "この駄菓子は地域<limited>の商品で、ここの県でしか売られていない。お土産に10個買った。", "choices": ["限定の", "無制限の", "輸入の", "売れ残りの"], "correct_index": 0, "explanation": "limit(制限)+ -ed。limited edition = 限定版。", "id": "s4_301", "body_ruby": "この駄菓子《だがし》は地域《ちいき》<limited>の商品《しょうひん》で、ここの県《けん》でしか売《う》られていない。お土産《みやげ》に10個《こ》買《か》った。", "choices_ruby": ["限定《げんてい》の", "無制限《むせいげん》の", "輸入《ゆにゅう》の", "売《う》れ残《のこ》りの"], "explanation_ruby": "limit(制限《せいげん》)+ -ed。limited edition = 限定版《げんていばん》。", "body_kana": "このだがしはちいき<limited>のしょうひんで、ここのけんでしかうられていない。おみや
