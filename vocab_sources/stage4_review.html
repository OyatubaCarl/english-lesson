<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordTacos Stage 4 ─ 624問レビュー</title>
<style>
:root {
  --bg: #FFF8EE;
  --paper: #FFFDF7;
  --ink: #2A1F14;
  --sub: #6B5A47;
  --accent: #C73E1D;
  --green: #4A7C59;
  --green-soft: #EAF4EC;
  --yellow: #E8B647;
  --border: #E6D5BC;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Hiragino Sans", "Hiragino Maru Gothic ProN", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  padding: 16px;
}
.wrap { max-width: 900px; margin: 0 auto; }
header {
  text-align: center;
  padding: 20px 0;
  border-bottom: 2px dashed var(--border);
  margin-bottom: 24px;
}
h1 { font-size: 1.8rem; }
h1 .taco { color: var(--accent); }
.subtitle { font-size: 0.85rem; color: var(--sub); margin-top: 4px; }
.controls {
  position: sticky;
  top: 0;
  background: var(--bg);
  padding: 12px 0;
  z-index: 100;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.95rem;
  font-family: inherit;
  background: var(--paper);
}
.search-box:focus { outline: none; border-color: var(--accent); }
.stats {
  font-size: 0.8rem;
  color: var(--sub);
  padding: 0 8px;
}
.filter-chip {
  padding: 6px 12px;
  font-size: 0.78rem;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  user-select: none;
}
.filter-chip.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.cards {
  display: grid;
  gap: 8px;
}
.card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.card-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.id {
  font-family: "SF Mono", monospace;
  font-size: 0.7rem;
  color: var(--sub);
}
.word {
  font-family: "Helvetica Neue", sans-serif;
  font-weight: 700;
  color: var(--accent);
  font-size: 1.1rem;
}
.pos {
  font-size: 0.65rem;
  background: var(--green);
  color: white;
  padding: 1px 6px;
  border-radius: 3px;
}
.meaning {
  font-size: 0.85rem;
  color: var(--sub);
}
.body {
  font-size: 0.95rem;
  line-height: 1.7;
  padding: 8px 10px;
  background: linear-gradient(180deg, #FFF7E8, #FFF1D6);
  border-left: 3px solid var(--yellow);
  border-radius: 0 6px 6px 0;
  margin-bottom: 6px;
}
.body .embed {
  display: inline-block;
  background: var(--accent);
  color: white;
  font-family: "Helvetica Neue", sans-serif;
  font-weight: 700;
  padding: 0 6px;
  border-radius: 4px;
  margin: 0 1px;
}
.choices-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 0.78rem;
  margin-top: 4px;
}
.choice-chip {
  background: white;
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 6px;
}
.choice-chip.correct {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--green);
  font-weight: 700;
}
.explanation {
  font-size: 0.78rem;
  color: var(--sub);
  margin-top: 4px;
  padding: 4px 8px;
  background: #FDF6E3;
  border-radius: 4px;
}
.hidden { display: none; }
.no-results {
  text-align: center;
  padding: 40px;
  color: var(--sub);
}
ruby rt { font-size: 0.45em; color: var(--sub); font-weight: 400; }
.embed ruby rt { color: rgba(255,255,255,0.92); }
body.no-ruby rt { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word<span class="taco">Tacos</span> ─ Stage 4 レビュー</h1>
    <div class="subtitle">中学発展範囲 全403問 / 単語・本文・選択肢・解説を一覧</div>
  </header>

  <div class="controls">
    <input type="text" class="search-box" id="search" placeholder="🔍 単語・意味・本文を検索(例: nose / 鼻 / 風邪)">
    <span class="stats" id="stats">─</span>
    <span class="filter-chip active" data-pos="all">全て</span>
    <span class="filter-chip" data-pos="名">名</span>
    <span class="filter-chip" data-pos="動">動</span>
    <span class="filter-chip" data-pos="形">形</span>
    <span class="filter-chip" data-pos="副">副</span>
    <span class="filter-chip active" id="ruby-chip">ふりがな</span>
  </div>

  <div class="cards" id="cards"></div>
  <div class="no-results hidden" id="no-results">該当する問題なし</div>
</div>

<script>
const DATA = [{"word": "add", "meaning_jp": "加える", "pos": "動", "body": "カレーの仕上げに、隠し味としてチョコレートをひとかけら<add>すると、味に深みが出る。", "choices": ["加える", "取り除く", "混ぜずに置く", "煮詰める"], "correct_index": 0, "explanation": "addition(足し算)の動詞形。add A to B = AをBに加える。", "id": "s4_001", "body_ruby": "カレーの仕上《しあ》げに、隠《かく》し味《あじ》としてチョコレートをひとかけら<add>すると、味《あじ》に深《ふか》みが出《で》る。", "choices_ruby": ["加《くわ》える", "｜取り除《とりのぞ》く", "混《ま》ぜずに置《お》く", "煮詰《につ》める"], "explanation_ruby": "addition(｜足し算《たしざん》)の動詞形《どうしけい》。add A to B = AをBに加《くわ》える。", "body_kana": "カレーのしあげに、かくしあじとしてチョコレートをひとかけら<add>すると、あじにふかみがでる。"}, {"word": "address", "meaning_jp": "住所", "pos": "名", "body": "引っ越しの知らせに、新しい<address>を書いたカードを同封した。郵便番号から番地まで間違いなく確かめた。", "choices": ["住所", "電話番号", "名前", "誕生日"], "correct_index": 0, "explanation": "メールアドレスの address も同じ語。", "id": "s4_002", "body_ruby": "｜引っ越《ひっこ》しの知《し》らせに、新《あたら》しい<address>を書《か》いたカードを同封《どうふう》した。郵便番号《ゆうびんばんごう》から番地《ばんち》まで間違《まちが》いなく確《たし》かめた。", "choices_ruby": ["住所《じゅうしょ》", "電話番号《でんわばんごう》", "名前《なまえ》", "誕生日《たんじょうび》"], "explanation_ruby": "メールアドレスの address も同《おな》じ語《ご》。", "body_kana": "ひっこしのしらせに、あたらしい<address>をかいたカードをどうふうした。ゆうびんばんごうからばんちまでまちがいなくたしかめた。"}, {"word": "adventure", "meaning_jp": "冒険", "pos": "名", "body": "地図を持たずに自転車で隣町まで行ってみた。小さな<adventure>だったが、知らない道はどきどきした。", "choices": ["冒険", "宿題", "日課", "儀式"], "correct_index": 0, "explanation": "未知のことに挑むわくわくする経験。", "id": "s4_003", "body_ruby": "地図《ちず》を持《も》たずに自転車《じてんしゃ》で隣町《となりまち》まで行《い》ってみた。小《ちい》さな<adventure>だったが、知《し》らない道《みち》はどきどきした。", "choices_ruby": ["冒険《ぼうけん》", "宿題《しゅくだい》", "日課《にっか》", "儀式《ぎしき》"], "explanation_ruby": "未知《みち》のことに挑《いど》むわくわくする経験《けいけん》。", "body_kana": "ちずをもたずにじてんしゃでとなりまちまでいってみた。ちいさな<adventure>だったが、しらないみちはどきどきした。"}, {"word": "advertisement", "meaning_jp": "広告", "pos": "名", "body": "電車の中づりの<advertisement>には、新発売のアイスの写真が大きく載っていて、つい売店を探した。", "choices": ["広告", "時刻表", "路線図", "注意書き"], "correct_index": 0, "explanation": "ad と略す。advertise = 宣伝する。", "id": "s4_004", "body_ruby": "電車《でんしゃ》の中《なか》づりの<advertisement>には、新発売《しんはつばい》のアイスの写真《しゃしん》が大《おお》きく載《の》っていて、つい売店《ばいてん》を探《さが》した。", "choices_ruby": ["広告《こうこく》", "時刻表《じこくひょう》", "路線図《ろせんず》", "注意書《ちゅういが》き"], "explanation_ruby": "ad と略《りゃく》す。advertise = 宣伝《せんでん》する。", "body_kana": "でんしゃのなかづりの<advertisement>には、しんはつばいのアイスのしゃしんがおおきくのっていて、ついばいてんをさがした。"}, {"word": "African-American", "meaning_jp": "アフリカ系アメリカ人", "pos": "名/形", "body": "キング牧師は<African-American>の公民権運動を率い、「私には夢がある」という演説で歴史を動かした。", "choices": ["アフリカ系アメリカ人", "ヨーロッパからの移民", "先住民", "アジア系の人々"], "correct_index": 0, "explanation": "アフリカにルーツを持つアメリカ人。", "id": "s4_005", "body_ruby": "キング牧師《ぼくし》は<African-American>の公民権運動《こうみんけんうんどう》を率《ひき》い、「私《わたし》には夢《ゆめ》がある」という演説《えんぜつ》で歴史《れきし》を動《うご》かした。", "choices_ruby": ["アフリカ系《けい》アメリカ人《にん》", "ヨーロッパからの移民《いみん》", "先住民《せんじゅうみん》", "アジア系《けい》の人々《ひとびと》"], "explanation_ruby": "アフリカにルーツを持《も》つアメリカ人《にん》。", "body_kana": "キングぼくしは<African-American>のこうみんけんうんどうをひきい、「わたしにはゆめがある」というえんぜつでれきしをうごかした。"}, {"word": "ahead", "meaning_jp": "前方に、先に", "pos": "副", "body": "マラソンの中継では、先頭の選手が2位に200メートルの差をつけて<ahead>を走っていた。", "choices": ["前方に", "後方に", "横に", "外側に"], "correct_index": 0, "explanation": "Go ahead. = どうぞ(お先に)。", "id": "s4_006", "body_ruby": "マラソンの中継《ちゅうけい》では、先頭《せんとう》の選手《せんしゅ》が2位《い》に200メートルの差《さ》をつけて<ahead>を走《はし》っていた。", "choices_ruby": ["前方《ぜんぽう》に", "後方《こうほう》に", "横《よこ》に", "外側《そとがわ》に"], "explanation_ruby": "Go ahead. = どうぞ(お先《さき》に)。", "body_kana": "マラソンのちゅうけいでは、せんとうのせんしゅが2位に200メートルのさをつけて<ahead>をはしっていた。"}, {"word": "airport", "meaning_jp": "空港", "pos": "名", "body": "初めての海外旅行の朝、出発の3時間前に<airport>に着いた。滑走路には大きな飛行機が並んでいた。", "choices": ["空港", "港", "駅", "バスターミナル"], "correct_index": 0, "explanation": "air(空)+ port(港)。", "id": "s4_007", "body_ruby": "初《はじ》めての海外旅行《かいがいりょこう》の朝《あさ》、出発《しゅっぱつ》の3時間《じかん》前《まえ》に<airport>に着《つ》いた。滑走路《かっそうろ》には大《おお》きな飛行機《ひこうき》が並《なら》んでいた。", "choices_ruby": ["空《そら》港《みなと》", "港《みなと》", "駅《えき》", "バスターミナル"], "explanation_ruby": "air(空《そら》)+ port(港《みなと》)。", "body_kana": "はじめてのかいがいりょこうのあさ、しゅっぱつの3時間まえに<airport>についた。かっそうろにはおおきなひこうきがならんでいた。"}, {"word": "album", "meaning_jp": "アルバム", "pos": "名", "body": "祖母の家の<album>には、セピア色になった家族写真が年代順に貼られ、余白に日付が書き込まれていた。", "choices": ["アルバム", "辞典", "家計簿", "手帳"], "correct_index": 0, "explanation": "写真帳。音楽の「アルバム」も同じ語。", "id": "s4_008", "body_ruby": "祖母《そぼ》の家《いえ》の<album>には、セピア色《いろ》になった家族《かぞく》写真《しゃしん》が年代順《ねんだいじゅん》に貼《は》られ、余白《よはく》に日付《ひづけ》が｜書き込《かきこ》まれていた。", "choices_ruby": ["アルバム", "辞典《じてん》", "家計簿《かけいぼ》", "手帳《てちょう》"], "explanation_ruby": "写真《しゃしん》帳《ちょう》。音楽《おんがく》の「アルバム」も同《おな》じ語《ご》。", "body_kana": "そぼのいえの<album>には、セピアいろになったかぞくしゃしんがねんだいじゅんにはられ、よはくにひづけがかきこまれていた。"}, {"word": "allow", "meaning_jp": "許可する", "pos": "動", "body": "この公園では犬の散歩は<allow>されているが、リードを外すことは禁止されている。", "choices": ["許可する", "禁止する", "推奨しない", "義務づける"], "correct_index": 0, "explanation": "allow A to ~ = Aが〜するのを許す。", "id": "s4_009", "body_ruby": "この公園《こうえん》では犬《いぬ》の散歩《さんぽ》は<allow>されているが、リードを外《はず》すことは禁止《きんし》されている。", "choices_ruby": ["許可《きょか》する", "禁止《きんし》する", "推奨《すいしょう》しない", "義務《ぎむ》づける"], "explanation_ruby": "allow A to ~ = Aが〜するのを許《ゆる》す。", "body_kana": "このこうえんではいぬのさんぽは<allow>されているが、リードをはずすことはきんしされている。"}, {"word": "alone", "meaning_jp": "ひとりで", "pos": "副/形", "body": "家族が出かけ、初めて夜まで<alone>で留守番をした。物音のたびに振り返ったが、無事にやり遂げた。", "choices": ["ひとりで", "みんなで", "交代で", "並んで"], "correct_index": 0, "explanation": "lonely(寂しい)と違い、単に「1人で」の事実。", "id": "s4_010", "body_ruby": "家族《かぞく》が出《で》かけ、初《はじ》めて夜《よる》まで<alone>で留守番《るすばん》をした。物音《ものおと》のたびに｜振り返《ふりかえ》ったが、無事《ぶじ》にやり遂《と》げた。", "choices_ruby": ["ひとりで", "みんなで", "交代《こうたい》で", "並《なら》んで"], "explanation_ruby": "lonely(寂《さび》しい)と違《ちが》い、単《たん》に「1人《にん》で」の事実《じじつ》。", "body_kana": "かぞくがでかけ、はじめてよるまで<alone>でるすばんをした。ものおとのたびにふりかえったが、ぶじにやりとげた。"}, {"word": "amaze", "meaning_jp": "驚嘆させる", "pos": "動", "body": "5歳の少年が暗算で4桁のかけ算を解き、テレビの審査員全員を<amaze>させた。", "choices": ["驚嘆させる", "退屈させる", "安心させる", "眠らせる"], "correct_index": 0, "explanation": "amazing(驚くべき)の動詞形。", "id": "s4_011", "body_ruby": "5歳《さい》の少年《しょうねん》が暗算《あんざん》で4桁《けた》のかけ算《さん》を解《と》き、テレビの審査員《しんさいん》全員《ぜんいん》を<amaze>させた。", "choices_ruby": ["驚嘆《きょうたん》させる", "退屈《たいくつ》させる", "安心《あんしん》させる", "眠《ねむ》らせる"], "explanation_ruby": "amazing(驚《おどろ》くべき)の動詞形《どうしけい》。", "body_kana": "5歳のしょうねんがあんざんで4けたのかけさんをとき、テレビのしんさいんぜんいんを<amaze>させた。"}, {"word": "America", "meaning_jp": "アメリカ", "pos": "名", "body": "自由の女神がそびえる<America>は、世界中から人が集まる多民族の国で、50の州からなる。", "choices": ["アメリカ", "イギリス", "オーストラリア", "カナダ"], "correct_index": 0, "explanation": "正式には the United States of America。", "id": "s4_012", "body_ruby": "自由《じゆう》の女神《めがみ》がそびえる<America>は、世界中《せかいじゅう》から人《にん》が集《あつ》まる多《た》民族《みんぞく》の国《くに》で、50の州《しゅう》からなる。", "choices_ruby": ["アメリカ", "イギリス", "オーストラリア", "カナダ"], "explanation_ruby": "正式《せいしき》には the United States of America。", "body_kana": "じゆうのめがみがそびえる<America>は、せかいじゅうからにんがあつまるたみんぞくのくにで、50のしゅうからなる。"}, {"word": "American", "meaning_jp": "アメリカ人、アメリカの", "pos": "名/形", "body": "ホームステイ先の<American>の家庭では、朝食にパンケーキが山のように積まれて出てきた。", "choices": ["アメリカの", "フランスの", "ロシアの", "中国の"], "correct_index": 0, "explanation": "America + -n。", "id": "s4_013", "body_ruby": "ホームステイ先《さき》の<American>の家庭《かてい》では、朝食《ちょうしょく》にパンケーキが山《やま》のように積《つ》まれて出《で》てきた。", "choices_ruby": ["アメリカの", "フランスの", "ロシアの", "中国《ちゅうごく》の"], "explanation_ruby": "America + -n。", "body_kana": "ホームステイさきの<American>のかていでは、ちょうしょくにパンケーキがやまのようにつまれてでてきた。"}, {"word": "ancient", "meaning_jp": "古代の", "pos": "形", "body": "エジプトの<ancient>のピラミッドは、4500年前に建てられたとは思えない精密さで石が積まれている。", "choices": ["古代の", "現代の", "未来の", "架空の"], "correct_index": 0, "explanation": "modern(現代の)の対。ancient Rome = 古代ローマ。", "id": "s4_014", "body_ruby": "エジプトの<ancient>のピラミッドは、4500年《ねん》前《まえ》に建《た》てられたとは思《おも》えない精密《せいみつ》さで石《いし》が積《つ》まれている。", "choices_ruby": ["古代《こだい》の", "現代《げんだい》の", "未来《みらい》の", "架空《かくう》の"], "explanation_ruby": "modern(現代《げんだい》の)の対《つい》。ancient Rome = 古代《こだい》ローマ。", "body_kana": "エジプトの<ancient>のピラミッドは、4500年まえにたてられたとはおもえないせいみつさでいしがつまれている。"}, {"word": "animation", "meaning_jp": "アニメーション", "pos": "名", "body": "1秒の映像に24枚の絵を使う<animation>の制作現場では、原画マンが1枚ずつ表情を描き分けていた。", "choices": ["アニメーション", "実写映画", "写真集", "人形劇"], "correct_index": 0, "explanation": "animate(命を吹き込む)の名詞形。", "id": "s4_015", "body_ruby": "1秒《びょう》の映像《えいぞう》に24枚《まい》の絵《え》を使《つか》う<animation>の制作《せいさく》現場《げんば》では、原画《げんが》マンが1枚《まい》ずつ表情《ひょうじょう》を描《えが》き分《わ》けていた。", "choices_ruby": ["アニメーション", "実写映画《じっしゃえいが》", "写真集《しゃしんしゅう》", "人形劇《にんぎょうげき》"], "explanation_ruby": "animate(命《いのち》を吹《ふ》き込《こ》む)の名詞《めいし》形《かたち》。", "body_kana": "1秒のえいぞうに24枚のえをつかう<animation>のせいさくげんばでは、げんがマンが1枚ずつひょうじょうをえがきわけていた。"}, {"word": "anime", "meaning_jp": "アニメ", "pos": "名", "body": "日本の<anime>は海外でも人気で、留学生のトムは日本語をアニメのセリフで覚えたと言っていた。", "choices": ["アニメ", "歌舞伎", "落語", "漫才"], "correct_index": 0, "explanation": "animation の日本式短縮形が世界共通語になった。", "id": "s4_016", "body_ruby": "日本《にっぽん》の<anime>は海外《かいがい》でも人気《にんき》で、留学生《りゅうがくせい》のトムは日本語《にほんご》をアニメのセリフで覚《おぼ》えたと言《い》っていた。", "choices_ruby": ["アニメ", "歌舞伎《かぶき》", "落語《らくご》", "漫才《まんざい》"], "explanation_ruby": "animation の日本式《にほんしき》短縮形《たんしゅくけい》が世界共通《せかいきょうつう》語《ご》になった。", "body_kana": "にっぽんの<anime>はかいがいでもにんきで、りゅうがくせいのトムはにほんごをアニメのセリフでおぼえたといっていた。"}, {"word": "anymore", "meaning_jp": "もはや(〜ない)", "pos": "副", "body": "小さい頃は毎日通った駄菓子屋に、中学生になってからは<anymore>行かなくなった。", "choices": ["もはや(〜ない)", "ますます", "いつも", "ときどき"], "correct_index": 0, "explanation": "否定文で「もう〜ない」。not ~ anymore。", "id": "s4_017", "body_ruby": "小《ちい》さい頃《ごろ》は毎日《まいにち》通《かよ》った駄菓子屋《だがしや》に、中学生《ちゅうがくせい》になってからは<anymore>行《い》かなくなった。", "choices_ruby": ["もはや(〜ない)", "ますます", "いつも", "ときどき"], "explanation_ruby": "否定文《ひていぶん》で「もう〜ない」。not ~ anymore。", "body_kana": "ちいさいごろはまいにちかよっただがしやに、ちゅうがくせいになってからは<anymore>いかなくなった。"}, {"word": "apartment", "meaning_jp": "アパート", "pos": "名", "body": "兄は大学の近くの<apartment>で一人暮らしを始めた。6畳一間に小さな台所がついている。", "choices": ["アパート", "一戸建て", "寮の食堂", "ホテル"], "correct_index": 0, "explanation": "集合住宅の一室。イギリスでは flat。", "id": "s4_018", "body_ruby": "兄《あに》は大学《だいがく》の近《ちか》くの<apartment>で一人《ひとり》暮《く》らしを始《はじ》めた。6畳《じょう》一間《ひとま》に小《ちい》さな台所《だいどころ》がついている。", "choices_ruby": ["アパート", "一戸建《いっこだ》て", "寮《りょう》の食堂《しょくどう》", "ホテル"], "explanation_ruby": "集合《しゅうごう》住宅《じゅうたく》の一室《いっしつ》。イギリスでは flat。", "body_kana": "あにはだいがくのちかくの<apartment>でひとりくらしをはじめた。6畳ひとまにちいさなだいどころがついている。"}, {"word": "apple", "meaning_jp": "りんご", "pos": "名", "body": "青森から届いた箱いっぱいの<apple>は、皮が真っ赤でずっしり重く、かじると蜜があふれた。", "choices": ["りんご", "みかん", "ぶどう", "もも"], "correct_index": 0, "explanation": "An apple a day keeps the doctor away.(1日1個で医者いらず)", "id": "s4_019", "body_ruby": "青森《あおもり》から届《とど》いた箱《はこ》いっぱいの<apple>は、皮《かわ》が｜真っ赤《まっか》でずっしり重《おも》く、かじると蜜《みつ》があふれた。", "choices_ruby": ["りんご", "みかん", "ぶどう", "もも"], "explanation_ruby": "An apple a day keeps the doctor away.(1日《にち》1個《こ》で医者《いしゃ》いらず)", "body_kana": "あおもりからとどいたはこいっぱいの<apple>は、かわがまっかでずっしりおもく、かじるとみつがあふれた。"}, {"word": "aquarium", "meaning_jp": "水族館", "pos": "名", "body": "<aquarium>の大水槽では、ジンベエザメが頭上をゆっくり横切り、観客から歓声が上がった。", "choices": ["水族館", "動物園", "植物園", "博物館"], "correct_index": 0, "explanation": "aqua(水)+ -rium(場所)。", "id": "s4_020", "body_ruby": "<aquarium>の大水《おおみず》槽《そう》では、ジンベエザメが頭上《ずじょう》をゆっくり横切《よこぎ》り、観客《かんきゃく》から歓声《かんせい》が上《あ》がった。", "choices_ruby": ["水族館《すいぞくかん》", "動物園《どうぶつえん》", "植物園《しょくぶつえん》", "博物館《はくぶつかん》"], "explanation_ruby": "aqua(水《みず》)+ -rium(場所《ばしょ》)。", "body_kana": "<aquarium>のおおみずそうでは、ジンベエザメがずじょうをゆっくりよこぎり、かんきゃくからかんせいがあがった。"}, {"word": "arena", "meaning_jp": "アリーナ、競技場", "pos": "名", "body": "コンサート会場の<arena>席は舞台と同じ高さのフロア席で、ステージまでの距離が一番近い。", "choices": ["アリーナ", "ロビー", "楽屋", "駐車場"], "correct_index": 0, "explanation": "屋内の大型競技場・イベント会場。", "id": "s4_021", "body_ruby": "コンサート会場《かいじょう》の<arena>席《せき》は舞台《ぶたい》と同《おな》じ高《たか》さのフロア席《せき》で、ステージまでの距離《きょり》が一番近《いちばんちか》い。", "choices_ruby": ["アリーナ", "ロビー", "楽屋《がくや》", "駐車場《ちゅうしゃじょう》"], "explanation_ruby": "屋内《おくない》の大型《おおがた》競技場《きょうぎじょう》・イベント会場《かいじょう》。", "body_kana": "コンサートかいじょうの<arena>せきはぶたいとおなじたかさのフロアせきで、ステージまでのきょりがいちばんちかい。"}, {"word": "artificial", "meaning_jp": "人工の", "pos": "形", "body": "この池は<artificial>のもので、100年前に農業用水のために人の手で掘られたと石碑にある。", "choices": ["人工の", "天然の", "野生の", "偶然の"], "correct_index": 0, "explanation": "natural(天然の)の対。artificial intelligence = AI。", "id": "s4_022", "body_ruby": "この池《いけ》は<artificial>のもので、100年《ねん》前《まえ》に農業用《のうぎょうよう》水《みず》のために人《にん》の手《て》で掘《ほ》られたと石碑《せきひ》にある。", "choices_ruby": ["人工《じんこう》の", "天然《てんねん》の", "野生《やせい》の", "偶然《ぐうぜん》の"], "explanation_ruby": "natural(天然《てんねん》の)の対《つい》。artificial intelligence = AI。", "body_kana": "このいけは<artificial>のもので、100年まえにのうぎょうようみずのためににんのてでほられたとせきひにある。"}, {"word": "assist", "meaning_jp": "手助けする", "pos": "動", "body": "サッカーで彼は得点こそしなかったが、3つのゴールすべてを絶妙なパスで<assist>した。", "choices": ["手助けする", "妨害する", "観戦する", "命令する"], "correct_index": 0, "explanation": "assistant = 助手。help よりやや formal。", "id": "s4_023", "body_ruby": "サッカーで彼《かれ》は得点《とくてん》こそしなかったが、3つのゴールすべてを絶妙《ぜつみょう》なパスで<assist>した。", "choices_ruby": ["手助《てだす》けする", "妨害《ぼうがい》する", "観戦《かんせん》する", "命令《めいれい》する"], "explanation_ruby": "assistant = 助手《じょしゅ》。help よりやや formal。", "body_kana": "サッカーでかれはとくてんこそしなかったが、3つのゴールすべてをぜつみょうなパスで<assist>した。"}, {"word": "attention", "meaning_jp": "注意、注目", "pos": "名", "body": "「皆さん、<attention>をお願いします」と委員長が手を叩くと、ざわついていた教室が静かになった。", "choices": ["注目", "拍手", "起立", "退室"], "correct_index": 0, "explanation": "pay attention to ~ = 〜に注意を払う。", "id": "s4_024", "body_ruby": "「皆《みな》さん、<attention>をお願《ねが》いします」と委員長《いいんちょう》が手《て》を叩《たた》くと、ざわついていた教室《きょうしつ》が静《しず》かになった。", "choices_ruby": ["注目《ちゅうもく》", "拍手《はくしゅ》", "起立《きりつ》", "退室《たいしつ》"], "explanation_ruby": "pay attention to ~ = 〜に注意《ちゅうい》を払《はら》う。", "body_kana": "「みなさん、<attention>をおねがいします」といいんちょうがてをたたくと、ざわついていたきょうしつがしずかになった。"}, {"word": "attract", "meaning_jp": "引きつける", "pos": "動", "body": "夜の街灯は虫を<attract>する。明かりの下には小さな羽虫が群がって渦を巻いていた。", "choices": ["引きつける", "追い払う", "見落とす", "数える"], "correct_index": 0, "explanation": "attractive = 魅力的な。attraction = 呼び物。", "id": "s4_025", "body_ruby": "夜《よる》の街灯《がいとう》は虫《むし》を<attract>する。明《あ》かりの下《した》には小《ちい》さな羽虫《はねむし》が群《むら》がって渦《うず》を巻《ま》いていた。", "choices_ruby": ["引《ひ》きつける", "追《お》い払《はら》う", "見落《みお》とす", "数《かぞ》える"], "explanation_ruby": "attractive = 魅力的《みりょくてき》な。attraction = ｜呼び物《よびもの》。", "body_kana": "よるのがいとうはむしを<attract>する。あかりのしたにはちいさなはねむしがむらがってうずをまいていた。"}, {"word": "audience", "meaning_jp": "観客、聴衆", "pos": "名", "body": "幕が下りると、500人の<audience>が一斉に立ち上がり、拍手は5分間鳴りやまなかった。", "choices": ["観客", "出演者", "係員", "記者"], "correct_index": 0, "explanation": "audio(音)と同語源。聞く人々。", "id": "s4_026", "body_ruby": "幕《まく》が下《お》りると、500人《にん》の<audience>が一斉《いっせい》に｜立ち上《たちあ》がり、拍手《はくしゅ》は5分間《ふんかん》鳴《な》りやまなかった。", "choices_ruby": ["観客《かんきゃく》", "出演者《しゅつえんしゃ》", "係員《かかりいん》", "記者《きしゃ》"], "explanation_ruby": "audio(音《おと》)と同語《どうご》源《げん》。聞《き》く人々《ひとびと》。", "body_kana": "まくがおりると、500人の<audience>がいっせいにたちあがり、はくしゅは5分間なりやまなかった。"}, {"word": "backyard", "meaning_jp": "裏庭", "pos": "名", "body": "アメリカの友人の家の<backyard>は広く、家の後ろでバーベキューもバスケもできるほどだった。", "choices": ["裏庭", "屋上", "玄関先", "地下室"], "correct_index": 0, "explanation": "back(後ろ)+ yard(庭)。", "id": "s4_027", "body_ruby": "アメリカの友人《ゆうじん》の家《いえ》の<backyard>は広《ひろ》く、家《いえ》の後《あと》ろでバーベキューもバスケもできるほどだった。", "choices_ruby": ["裏庭《うらにわ》", "屋上《おくじょう》", "玄関先《げんかんさき》", "地下室《ちかしつ》"], "explanation_ruby": "back(後《うし》ろ)+ yard(庭《にわ》)。", "body_kana": "アメリカのゆうじんのいえの<backyard>はひろく、いえのあとろでバーベキューもバスケもできるほどだった。"}, {"word": "bake", "meaning_jp": "(オーブンで)焼く", "pos": "動", "body": "週末に母とクッキーを<bake>した。オーブンから甘い香りが漂い、焼き上がりの20分が待ち遠しかった。", "choices": ["オーブンで焼く", "油で揚げる", "蒸す", "ゆでる"], "correct_index": 0, "explanation": "bakery = パン屋。直火でなくオーブンで焼く。", "id": "s4_028", "body_ruby": "週末《しゅうまつ》に母《はは》とクッキーを<bake>した。オーブンから甘《あま》い香《かお》りが漂《ただよ》い、焼《や》き上《あ》がりの20分《ふん》が｜待ち遠《まちどお》しかった。", "choices_ruby": ["オーブンで焼《や》く", "油《あぶら》で揚《あ》げる", "蒸《む》す", "ゆでる"], "explanation_ruby": "bakery = パン屋《や》。直火《じかび》でなくオーブンで焼《や》く。", "body_kana": "しゅうまつにははとクッキーを<bake>した。オーブンからあまいかおりがただよい、やきあがりの20分がまちどおしかった。"}, {"word": "balloon", "meaning_jp": "風船", "pos": "名", "body": "開店記念でもらった赤い<balloon>が手から離れ、青空に小さくなるまで見送るしかなかった。", "choices": ["風船", "旗", "シャボン玉", "紙飛行機"], "correct_index": 0, "explanation": "hot-air balloon = 熱気球。", "id": "s4_029", "body_ruby": "開店《かいてん》記念《きねん》でもらった赤《あか》い<balloon>が手《て》から離《はな》れ、青《あお》空《そら》に小《ちい》さくなるまで見送《みおく》るしかなかった。", "choices_ruby": ["風船《ふうせん》", "旗《はた》", "シャボン玉《たま》", "紙飛行機《かみひこうき》"], "explanation_ruby": "hot-air balloon = 熱気球《ねっききゅう》。", "body_kana": "かいてんきねんでもらったあかい<balloon>がてからはなれ、あおそらにちいさくなるまでみおくるしかなかった。"}, {"word": "bamboo", "meaning_jp": "竹", "pos": "名", "body": "裏山の<bamboo>の林は、まっすぐな緑の幹が天に伸び、春にはタケノコがあちこちに顔を出す。", "choices": ["竹", "杉", "松", "桜"], "correct_index": 0, "explanation": "パンダの主食。bamboo shoot = タケノコ。", "id": "s4_030", "body_ruby": "裏山《うらやま》の<bamboo>の林《はやし》は、まっすぐな緑《みどり》の幹《かん》が天《てん》に伸《の》び、春《はる》にはタケノコがあちこちに顔《かお》を出《だ》す。", "choices_ruby": ["竹《たけ》", "杉《すぎ》", "松《まつ》", "桜《さくら》"], "explanation_ruby": "パンダの主食《しゅしょく》。bamboo shoot = タケノコ。", "body_kana": "うらやまの<bamboo>のはやしは、まっすぐなみどりのかんがてんにのび、はるにはタケノコがあちこちにかおをだす。"}, {"word": "banana", "meaning_jp": "バナナ", "pos": "名", "body": "マラソンの給水所では、水と一緒に半分に切った<banana>が配られ、走りながら皮をむいて食べた。", "choices": ["バナナ", "りんご", "オレンジ", "ぶどう"], "correct_index": 0, "explanation": "エネルギー補給の定番果物。", "id": "s4_031", "body_ruby": "マラソンの給水所《きゅうすいじょ》では、水《みず》と一緒《いっしょ》に半分《はんぶん》に切《き》った<banana>が配《くば》られ、走《はし》りながら皮《かわ》をむいて食《た》べた。", "choices_ruby": ["バナナ", "りんご", "オレンジ", "ぶどう"], "explanation_ruby": "エネルギー補給《ほきゅう》の定番《ていばん》果物《くだもの》。", "body_kana": "マラソンのきゅうすいじょでは、みずといっしょにはんぶんにきった<banana>がくばられ、はしりながらかわをむいてたべた。"}, {"word": "band", "meaning_jp": "バンド、楽団", "pos": "名", "body": "文化祭のステージで、3年生の<band>がギターとドラムで演奏を始めると、体育館は総立ちになった。", "choices": ["バンド", "合唱団", "演劇部", "応援団"], "correct_index": 0, "explanation": "音楽グループ。「帯・ゴムバンド」の意味も。", "id": "s4_032", "body_ruby": "文化祭《ぶんかさい》のステージで、3年生《ねんせい》の<band>がギターとドラムで演奏《えんそう》を始《はじ》めると、体育館《たいいくかん》は総立《そうだ》ちになった。", "choices_ruby": ["バンド", "合唱団《がっしょうだん》", "演劇部《えんげきぶ》", "応援団《おうえんだん》"], "explanation_ruby": "音楽《おんがく》グループ。「帯《おび》・ゴムバンド」の意味《いみ》も。", "body_kana": "ぶんかさいのステージで、3年生の<band>がギターとドラムでえんそうをはじめると、たいいくかんはそうだちになった。"}, {"word": "barrier", "meaning_jp": "障壁、バリア", "pos": "名", "body": "駅の段差をなくすスロープ工事が終わり、車いすの人の移動を妨げていた<barrier>がひとつ消えた。", "choices": ["障壁", "近道", "目印", "装飾"], "correct_index": 0, "explanation": "barrier-free = 障壁のない(バリアフリー)。", "id": "s4_033", "body_ruby": "駅《えき》の段差《だんさ》をなくすスロープ工事《こうじ》が終《お》わり、車《くるま》いすの人《にん》の移動《いどう》を妨《さまた》げていた<barrier>がひとつ消《き》えた。", "choices_ruby": ["障壁《しょうへき》", "近道《ちかみち》", "目印《めじるし》", "装飾《そうしょく》"], "explanation_ruby": "barrier-free = 障壁《しょうへき》のない(バリアフリー)。", "body_kana": "えきのだんさをなくすスロープこうじがおわり、くるまいすのにんのいどうをさまたげていた<barrier>がひとつきえた。"}, {"word": "bear", "meaning_jp": "クマ", "pos": "名", "body": "登山道の入口に「<bear>出没注意」の看板があり、私たちは鈴を鳴らしながら歩いた。", "choices": ["クマ", "シカ", "イノシシ", "サル"], "correct_index": 0, "explanation": "teddy bear = クマのぬいぐるみ。「耐える」の動詞も。", "id": "s4_034", "body_ruby": "登山道《とざんどう》の入口《いりぐち》に「<bear>出没《しゅつぼつ》注意《ちゅうい》」の看板《かんばん》があり、私《わたし》たちは鈴《すず》を鳴《な》らしながら歩《ある》いた。", "choices_ruby": ["クマ", "シカ", "イノシシ", "サル"], "explanation_ruby": "teddy bear = クマのぬいぐるみ。「耐《た》える」の動詞《どうし》も。", "body_kana": "とざんどうのいりぐちに「<bear>しゅつぼつちゅうい」のかんばんがあり、わたしたちはすずをならしながらあるいた。"}, {"word": "beauty", "meaning_jp": "美しさ", "pos": "名", "body": "満開の桜並木の<beauty>に、外国人観光客が足を止め、しばらく言葉もなく見上げていた。", "choices": ["美しさ", "長さ", "高さ", "新しさ"], "correct_index": 0, "explanation": "beautiful(美しい)の名詞形。", "id": "s4_035", "body_ruby": "満開《まんかい》の桜《さくら》並木《なみき》の<beauty>に、外国人《がいこくじん》観光客《かんこうきゃく》が足《あし》を止《と》め、しばらく言葉《ことば》もなく見上《みあ》げていた。", "choices_ruby": ["美《うつく》しさ", "長《なが》さ", "高《たか》さ", "新《あたら》しさ"], "explanation_ruby": "beautiful(美《うつく》しい)の名詞《めいし》形《かたち》。", "body_kana": "まんかいのさくらなみきの<beauty>に、がいこくじんかんこうきゃくがあしをとめ、しばらくことばもなくみあげていた。"}, {"word": "beef", "meaning_jp": "牛肉", "pos": "名", "body": "すき焼きには薄切りの<beef>を使う。鍋に広げると、すぐに色が変わって甘い香りが立った。", "choices": ["牛肉", "豚肉", "鶏肉", "魚"], "correct_index": 0, "explanation": "pork = 豚肉、chicken = 鶏肉と区別。", "id": "s4_036", "body_ruby": "すき焼《や》きには薄切《うすぎ》りの<beef>を使《つか》う。鍋《なべ》に広《ひろ》げると、すぐに色《いろ》が変《か》わって甘《あま》い香《かお》りが立《た》った。", "choices_ruby": ["牛肉《ぎゅうにく》", "豚肉《ぶたにく》", "鶏肉《とりにく》", "魚《さかな》"], "explanation_ruby": "pork = 豚肉《ぶたにく》、chicken = 鶏肉《とりにく》と区別《くべつ》。", "body_kana": "すきやきにはうすぎりの<beef>をつかう。なべにひろげると、すぐにいろがかわってあまいかおりがたった。"}, {"word": "belong", "meaning_jp": "所属する", "pos": "動", "body": "私は美術部に<belong>している。部員は12人で、週3回、放課後に部室で絵を描く。", "choices": ["所属する", "退部する", "見学する", "設立する"], "correct_index": 0, "explanation": "belong to ~ = 〜に所属する・〜のものである。", "id": "s4_037", "body_ruby": "私《わたし》は美術部《びじゅつぶ》に<belong>している。部員《ぶいん》は12人《にん》で、週《しゅう》3回《かい》、放課後《ほうかご》に部室《ぶしつ》で絵《え》を描《えが》く。", "choices_ruby": ["所属《しょぞく》する", "退部《たいぶ》する", "見学《けんがく》する", "設立《せつりつ》する"], "explanation_ruby": "belong to ~ = 〜に所属《しょぞく》する・〜のものである。", "body_kana": "わたしはびじゅつぶに<belong>している。ぶいんは12人で、しゅう3回、ほうかごにぶしつでえをえがく。"}, {"word": "bench", "meaning_jp": "ベンチ", "pos": "名", "body": "公園の木陰の<bench>に腰かけて、ふたりで分けたアイスを食べながら部活の話をした。", "choices": ["ベンチ", "ブランコ", "すべり台", "鉄棒"], "correct_index": 0, "explanation": "数人がけの長椅子。野球の「ベンチ」も。", "id": "s4_038", "body_ruby": "公園《こうえん》の木陰《こかげ》の<bench>に腰《こし》かけて、ふたりで分《わ》けたアイスを食《た》べながら部活《ぶかつ》の話《はなし》をした。", "choices_ruby": ["ベンチ", "ブランコ", "すべり台《だい》", "鉄棒《てつぼう》"], "explanation_ruby": "数人《すうにん》がけの長椅子《ながいす》。野球《やきゅう》の「ベンチ」も。", "body_kana": "こうえんのこかげの<bench>にこしかけて、ふたりでわけたアイスをたべながらぶかつのはなしをした。"}, {"word": "blackboard", "meaning_jp": "黒板", "pos": "名", "body": "日直の仕事は、授業のあとに<blackboard>を消すこと。チョークの粉で袖が白くなる。", "choices": ["黒板", "掲示板", "窓", "教卓"], "correct_index": 0, "explanation": "black + board。白いのは whiteboard。", "id": "s4_039", "body_ruby": "日直《にっちょく》の仕事《しごと》は、授業《じゅぎょう》のあとに<blackboard>を消《け》すこと。チョークの粉《こな》で袖《そで》が白《しろ》くなる。", "choices_ruby": ["黒板《こくばん》", "掲示板《けいじばん》", "窓《まど》", "教卓《きょうたく》"], "explanation_ruby": "black + board。白《しろ》いのは whiteboard。", "body_kana": "にっちょくのしごとは、じゅぎょうのあとに<blackboard>をけすこと。チョークのこなでそでがしろくなる。"}, {"word": "blew", "meaning_jp": "吹いた", "pos": "動", "body": "誕生日ケーキのろうそくを、彼は一息で全部<blew>して消した。13本の煙が立ちのぼった。", "choices": ["吹いた", "ともした", "数えた", "並べた"], "correct_index": 0, "explanation": "blow の過去形。blow-blew-blown。", "id": "s4_040", "body_ruby": "誕生日《たんじょうび》ケーキのろうそくを、彼《かれ》は一息《ひといき》で全部《ぜんぶ》<blew>して消《け》した。13本《ほん》の煙《けむり》が立《た》ちのぼった。", "choices_ruby": ["吹《ふ》いた", "ともした", "数《かぞ》えた", "並《なら》べた"], "explanation_ruby": "blow の過去形《かこけい》。blow-blew-blown。", "body_kana": "たんじょうびケーキのろうそくを、かれはひといきでぜんぶ<blew>してけした。13本のけむりがたちのぼった。"}, {"word": "blind", "meaning_jp": "目の見えない", "pos": "形", "body": "<blind>の人が白い杖で点字ブロックをたどって歩けるよう、ブロックの上に物を置いてはいけない。", "choices": ["目の見えない", "耳の聞こえない", "声の出ない", "歩けない"], "correct_index": 0, "explanation": "視覚に障害があること。blind spot = 死角。", "id": "s4_041", "body_ruby": "<blind>の人《にん》が白《しろ》い杖《つえ》で点字《てんじ》ブロックをたどって歩《ある》けるよう、ブロックの上《うえ》に物《もの》を置《お》いてはいけない。", "choices_ruby": ["目《め》の見《み》えない", "耳《みみ》の聞《き》こえない", "声《こえ》の出《で》ない", "歩《ある》けない"], "explanation_ruby": "視覚《しかく》に障害《しょうがい》があること。blind spot = 死角《しかく》。", "body_kana": "<blind>のにんがしろいつえでてんじブロックをたどってあるけるよう、ブロックのうえにものをおいてはいけない。"}, {"word": "block", "meaning_jp": "区画、ブロック", "pos": "名", "body": "「郵便局はここから2<block>先です」と教わり、交差点を2つ越えると、たしかに赤いポストが見えた。", "choices": ["区画", "信号", "歩道橋", "バス停"], "correct_index": 0, "explanation": "街の1区画。「妨げる」という動詞の意味も。", "id": "s4_042", "body_ruby": "「郵便局《ゆうびんきょく》はここから2<block>先《さき》です」と教《おそ》わり、交差点《こうさてん》を2つ越《こ》えると、たしかに赤《あか》いポストが見《み》えた。", "choices_ruby": ["区画《くかく》", "信号《しんごう》", "歩道橋《ほどうきょう》", "バス停《てい》"], "explanation_ruby": "街《まち》の1区画《くかく》。「妨《さまた》げる」という動詞《どうし》の意味《いみ》も。", "body_kana": "「ゆうびんきょくはここから2<block>さきです」とおそわり、こうさてんを2つこえると、たしかにあかいポストがみえた。"}, {"word": "blow", "meaning_jp": "吹く", "pos": "動", "body": "海からの風が強く<blow>して、さしていた傘が一瞬で裏返った。帽子も飛ばされそうだった。", "choices": ["吹く", "降る", "照る", "鳴る"], "correct_index": 0, "explanation": "blow-blew-blown。風や息が吹くこと。", "id": "s4_043", "body_ruby": "海《うみ》からの風《かぜ》が強《つよ》く<blow>して、さしていた傘《かさ》が一瞬《いっしゅん》で裏返《うらかえ》った。帽子《ぼうし》も飛《と》ばされそうだった。", "choices_ruby": ["吹《ふ》く", "降《ふ》る", "照《て》る", "鳴《な》る"], "explanation_ruby": "blow-blew-blown。風《かぜ》や息《いき》が吹《ふ》くこと。", "body_kana": "うみからのかぜがつよく<blow>して、さしていたかさがいっしゅんでうらかえった。ぼうしもとばされそうだった。"}, {"word": "blueberry", "meaning_jp": "ブルーベリー", "pos": "名", "body": "農園で<blueberry>狩りをした。紫色に熟した小さな実を、口に入れると甘酸っぱさが広がった。", "choices": ["ブルーベリー", "いちご", "さくらんぼ", "ラズベリー"], "correct_index": 0, "explanation": "blue(青)+ berry(小さな実)。目に良いとされる。", "id": "s4_044", "body_ruby": "農園《のうえん》で<blueberry>狩《か》りをした。紫色《むらさきいろ》に熟《じゅく》した小《ちい》さな実《み》を、口《くち》に入《い》れると甘酸《あまず》っぱさが広《ひろ》がった。", "choices_ruby": ["ブルーベリー", "いちご", "さくらんぼ", "ラズベリー"], "explanation_ruby": "blue(青《あお》)+ berry(小《ちい》さな実《み》)。目《め》に良《よ》いとされる。", "body_kana": "のうえんで<blueberry>かりをした。むらさきいろにじゅくしたちいさなみを、くちにいれるとあまずっぱさがひろがった。"}, {"word": "blush", "meaning_jp": "赤面する", "pos": "動", "body": "全校集会で突然名前を呼ばれて表彰され、彼は耳まで真っ赤に<blush>しながら壇上に上がった。", "choices": ["赤面する", "青ざめる", "笑い出す", "泣き出す"], "correct_index": 0, "explanation": "恥ずかしさで顔が赤くなること。", "id": "s4_045", "body_ruby": "全校《ぜんこう》集会《しゅうかい》で突然《とつぜん》名前《なまえ》を呼《よ》ばれて表彰《ひょうしょう》され、彼《かれ》は耳《みみ》まで｜真っ赤《まっか》に<blush>しながら壇上《だんじょう》に上《あ》がった。", "choices_ruby": ["赤面《せきめん》する", "青《あお》ざめる", "笑《わら》い出《だ》す", "｜泣き出《なきだ》す"], "explanation_ruby": "恥《は》ずかしさで顔《かお》が赤《あか》くなること。", "body_kana": "ぜんこうしゅうかいでとつぜんなまえをよばれてひょうしょうされ、かれはみみまでまっかに<blush>しながらだんじょうにあがった。"}, {"word": "board", "meaning_jp": "板、揭示板", "pos": "名", "body": "廊下の<board>には、合唱コンクールの結果と来週の時間割の変更が貼り出されていた。", "choices": ["掲示板", "窓ガラス", "ロッカー", "蛇口"], "correct_index": 0, "explanation": "板状のもの。「乗り込む」という動詞の意味も。", "id": "s4_046", "body_ruby": "廊下《ろうか》の<board>には、合唱《がっしょう》コンクールの結果《けっか》と来週《らいしゅう》の時間割《じかんわり》の変更《へんこう》が貼《は》り出《だ》されていた。", "choices_ruby": ["掲示板《けいじばん》", "窓《まど》ガラス", "ロッカー", "蛇口《じゃぐち》"], "explanation_ruby": "板状《いたじょう》のもの。「乗《の》り込《こ》む」という動詞《どうし》の意味《いみ》も。", "body_kana": "ろうかの<board>には、がっしょうコンクールのけっかとらいしゅうのじかんわりのへんこうがはりだされていた。"}, {"word": "boil", "meaning_jp": "ゆでる、沸かす", "pos": "動", "body": "そうめんは、たっぷりの湯で2分だけ<boil>して、すぐ冷水でしめるのがおいしさのコツだ。", "choices": ["ゆでる", "焼く", "揚げる", "蒸らす"], "correct_index": 0, "explanation": "boiled egg = ゆで卵。boiling water = 熱湯。", "id": "s4_047", "body_ruby": "そうめんは、たっぷりの湯《ゆ》で2分《ふん》だけ<boil>して、すぐ冷水《ひやみず》でしめるのがおいしさのコツだ。", "choices_ruby": ["ゆでる", "焼《や》く", "揚《あ》げる", "蒸《じょう》らす"], "explanation_ruby": "boiled egg = ゆで卵《たまご》。boiling water = 熱湯《ねっとう》。", "body_kana": "そうめんは、たっぷりのゆで2分だけ<boil>して、すぐひやみずでしめるのがおいしさのコツだ。"}, {"word": "braille", "meaning_jp": "点字", "pos": "名", "body": "缶ビールのふたには<braille>の突起がついていて、指先で触れるとお酒だと分かるようになっている。", "choices": ["点字", "バーコード", "印鑑", "暗号"], "correct_index": 0, "explanation": "考案者ルイ・ブライユの名前から。指で読む文字。", "id": "s4_048", "body_ruby": "缶《かん》ビールのふたには<braille>の突起《とっき》がついていて、指先《ゆびさき》で触《ふ》れるとお酒《さけ》だと分《わ》かるようになっている。", "choices_ruby": ["点字《てんじ》", "バーコード", "印鑑《いんかん》", "暗号《あんごう》"], "explanation_ruby": "考案者《こうあんしゃ》ルイ・ブライユの名前《なまえ》から。指《ゆび》で読《よ》む文字《もじ》。", "body_kana": "かんビールのふたには<braille>のとっきがついていて、ゆびさきでふれるとおさけだとわかるようになっている。"}, {"word": "branch", "meaning_jp": "枝", "pos": "名", "body": "台風の翌朝、公園には折れた<branch>が散乱し、太いものは大人の腕ほどもあった。", "choices": ["枝", "根", "幹", "葉"], "correct_index": 0, "explanation": "木の枝。会社の「支店」の意味も。", "id": "s4_049", "body_ruby": "台風《たいふう》の翌朝《よくあさ》、公園《こうえん》には折《お》れた<branch>が散乱《さんらん》し、太《ふと》いものは大人《おとな》の腕《うで》ほどもあった。", "choices_ruby": ["枝《えだ》", "根《ね》", "幹《かん》", "葉《は》"], "explanation_ruby": "木《き》の枝《えだ》。会社《かいしゃ》の「支店《してん》」の意味《いみ》も。", "body_kana": "たいふうのよくあさ、こうえんにはおれた<branch>がさんらんし、ふといものはおとなのうでほどもあった。"}, {"word": "brave", "meaning_jp": "勇敢な", "pos": "形", "body": "燃える家から隣人を助け出した高校生のニュースが流れた。自分の危険を顧みない<brave>な行動だった。", "choices": ["勇敢な", "臆病な", "慎重な", "無謀なだけの"], "correct_index": 0, "explanation": "bravery = 勇敢さ。courage(勇気)と近い。", "id": "s4_050", "body_ruby": "燃《も》える家《いえ》から隣人《りんじん》を助《たす》け出《だ》した高校生《こうこうせい》のニュースが流《なが》れた。自分《じぶん》の危険《きけん》を顧《かえり》みない<brave>な行動《こうどう》だった。", "choices_ruby": ["勇敢《ゆうかん》な", "臆病《おくびょう》な", "慎重《しんちょう》な", "無謀《むぼう》なだけの"], "explanation_ruby": "bravery = 勇敢《ゆうかん》さ。courage(勇気《ゆうき》)と近《ちか》い。", "body_kana": "もえるいえからりんじんをたすけだしたこうこうせいのニュースがながれた。じぶんのきけんをかえりみない<brave>なこうどうだった。"}, {"word": "bread", "meaning_jp": "パン", "pos": "名", "body": "朝は焼きたての<bread>にバターを塗って食べる。トースターから出した瞬間の香りがたまらない。", "choices": ["パン", "ごはん", "麺", "シリアル"], "correct_index": 0, "explanation": "数えられない名詞。a slice of bread = パン1枚。", "id": "s4_051", "body_ruby": "朝《あさ》は焼《や》きたての<bread>にバターを塗《ぬ》って食《た》べる。トースターから出《だ》した瞬間《しゅんかん》の香《かお》りがたまらない。", "choices_ruby": ["パン", "ごはん", "麺《めん》", "シリアル"], "explanation_ruby": "数《かぞ》えられない名詞《めいし》。a slice of bread = パン1枚《まい》。", "body_kana": "あさはやきたての<bread>にバターをぬってたべる。トースターからだしたしゅんかんのかおりがたまらない。"}, {"word": "bridge", "meaning_jp": "橋", "pos": "名", "body": "川の両岸を結ぶ赤い<bridge>を渡ると、対岸の商店街まで歩いて5分で行ける。", "choices": ["橋", "トンネル", "堤防", "桟橋の柱"], "correct_index": 0, "explanation": "川や谷をまたぐ建造物。", "id": "s4_052", "body_ruby": "川《かわ》の両岸《りょうがん》を結《むす》ぶ赤《あか》い<bridge>を渡《わた》ると、対岸《たいがん》の商店街《しょうてんがい》まで歩《ある》いて5分《ふん》で行《い》ける。", "choices_ruby": ["橋《はし》", "トンネル", "堤防《ていぼう》", "桟橋《さんばし》の柱《はしら》"], "explanation_ruby": "川《かわ》や谷《たに》をまたぐ建造物《けんぞうぶつ》。", "body_kana": "かわのりょうがんをむすぶあかい<bridge>をわたると、たいがんのしょうてんがいまであるいて5分でいける。"}, {"word": "brightness", "meaning_jp": "明るさ", "pos": "名", "body": "夜にスマホを見るときは、画面の<brightness>を下げると目が疲れにくい。", "choices": ["明るさ", "大きさ", "重さ", "音量"], "correct_index": 0, "explanation": "bright(明るい)+ -ness。", "id": "s4_053", "body_ruby": "夜《よる》にスマホを見《み》るときは、画面《がめん》の<brightness>を下《さ》げると目《め》が疲《つか》れにくい。", "choices_ruby": ["明《あか》るさ", "大《おお》きさ", "重《おも》さ", "音量《おんりょう》"], "explanation_ruby": "bright(明《あか》るい)+ -ness。", "body_kana": "よるにスマホをみるときは、がめんの<brightness>をさげるとめがつかれにくい。"}, {"word": "broaden", "meaning_jp": "広げる", "pos": "動", "body": "海外の人と話す経験は、ものの見方を<broaden>してくれる。「当たり前」が国によって違うと知れるからだ。", "choices": ["広げる", "狭める", "固定する", "閉ざす"], "correct_index": 0, "explanation": "broad(広い)+ -en(〜にする)。視野を広げる。", "id": "s4_054", "body_ruby": "海外《かいがい》の人《にん》と話《はな》す経験《けいけん》は、ものの見方《みかた》を<broaden>してくれる。「｜当たり前《あたりまえ》」が国《くに》によって違《ちが》うと知《し》れるからだ。", "choices_ruby": ["広《ひろ》げる", "狭《せば》める", "固定《こてい》する", "閉《と》ざす"], "explanation_ruby": "broad(広《ひろ》い)+ -en(〜にする)。視野《しや》を広《ひろ》げる。", "body_kana": "かいがいのにんとはなすけいけんは、もののみかたを<broaden>してくれる。「あたりまえ」がくにによってちがうとしれるからだ。"}, {"word": "bubble", "meaning_jp": "泡", "pos": "名", "body": "炭酸水をコップに注ぐと、小さな<bubble>が次々と底から立ちのぼり、表面ではじけた。", "choices": ["泡", "氷", "湯気", "しずく"], "correct_index": 0, "explanation": "bubble gum = 風船ガム。", "id": "s4_055", "body_ruby": "炭酸水《たんさんすい》をコップに注《そそ》ぐと、小《ちい》さな<bubble>が次々《つぎつぎ》と底《そこ》から立《た》ちのぼり、表面《ひょうめん》ではじけた。", "choices_ruby": ["泡《あわ》", "氷《こおり》", "湯気《ゆげ》", "しずく"], "explanation_ruby": "bubble gum = 風船《ふうせん》ガム。", "body_kana": "たんさんすいをコップにそそぐと、ちいさな<bubble>がつぎつぎとそこからたちのぼり、ひょうめんではじけた。"}, {"word": "builder", "meaning_jp": "建築業者", "pos": "名", "body": "新しい家の工事現場では、<builder>たちがヘルメット姿で柱を組み、3か月で骨組みが完成した。", "choices": ["建築業者", "設計士だけ", "不動産屋", "引っ越し業者"], "correct_index": 0, "explanation": "build(建てる)+ -er。建てる人・会社。", "id": "s4_056", "body_ruby": "新《あたら》しい家《いえ》の工事現場《こうじげんば》では、<builder>たちがヘルメット姿《すがた》で柱《はしら》を組《く》み、3か月《かげつ》で骨組《ほねぐ》みが完成《かんせい》した。", "choices_ruby": ["建築業《けんちくぎょう》者《もの》", "設計士《せっけいし》だけ", "不動産屋《ふどうさんや》", "｜引っ越《ひっこ》し業者《ぎょうしゃ》"], "explanation_ruby": "build(建《た》てる)+ -er。建《た》てる人《にん》・会社《かいしゃ》。", "body_kana": "あたらしいいえのこうじげんばでは、<builder>たちがヘルメットすがたではしらをくみ、3かかげつでほねぐみがかんせいした。"}, {"word": "bump", "meaning_jp": "ぶつかる", "pos": "動", "body": "暗い廊下を歩いていて、柱に思いきり肩を<bump>してしまった。あざになるかと思った。", "choices": ["ぶつかる", "すり抜ける", "寄りかかる", "見つける"], "correct_index": 0, "explanation": "bump into ~ = 〜にぶつかる・偶然出会う。", "id": "s4_057", "body_ruby": "暗《くら》い廊下《ろうか》を歩《ある》いていて、柱《はしら》に思《おも》いきり肩《かた》を<bump>してしまった。あざになるかと思《おも》った。", "choices_ruby": ["ぶつかる", "すり抜《ぬ》ける", "寄《よ》りかかる", "見《み》つける"], "explanation_ruby": "bump into ~ = 〜にぶつかる・偶然《ぐうぜん》出会《であ》う。", "body_kana": "くらいろうかをあるいていて、はしらにおもいきりかたを<bump>してしまった。あざになるかとおもった。"}, {"word": "burn", "meaning_jp": "燃える、焦がす", "pos": "動", "body": "キャンプファイヤーの薪が勢いよく<burn>して、炎が2メートルの高さまで上がった。", "choices": ["燃える", "消える", "湿る", "凍る"], "correct_index": 0, "explanation": "burn-burned/burnt。やけど = burn(名詞)。", "id": "s4_058", "body_ruby": "キャンプファイヤーの薪《たきぎ》が勢《いきお》いよく<burn>して、炎《ほのお》が2メートルの高《たか》さまで上《あ》がった。", "choices_ruby": ["燃《も》える", "消《き》える", "湿《しめ》る", "凍《こお》る"], "explanation_ruby": "burn-burned/burnt。やけど = burn(名詞《めいし》)。", "body_kana": "キャンプファイヤーのたきぎがいきおいよく<burn>して、ほのおが2メートルのたかさまであがった。"}, {"word": "butter", "meaning_jp": "バター", "pos": "名", "body": "熱いトーストに<butter>をのせると、じわっと溶けて染み込み、塩気と香りが広がった。", "choices": ["バター", "ジャム", "はちみつ", "チーズ"], "correct_index": 0, "explanation": "牛乳から作る乳製品。", "id": "s4_059", "body_ruby": "熱《あつ》いトーストに<butter>をのせると、じわっと溶《と》けて染《そ》み込《こ》み、塩気《しおけ》と香《かお》りが広《ひろ》がった。", "choices_ruby": ["バター", "ジャム", "はちみつ", "チーズ"], "explanation_ruby": "牛乳《ぎゅうにゅう》から作《つく》る乳製品《にゅうせいひん》。", "body_kana": "あついトーストに<butter>をのせると、じわっととけてそみこみ、しおけとかおりがひろがった。"}, {"word": "button", "meaning_jp": "ボタン", "pos": "名", "body": "エレベーターの「閉」の<button>を押したつもりが「開」で、ドアの前でしばらく気まずかった。", "choices": ["ボタン", "レバー", "ハンドル", "ペダル"], "correct_index": 0, "explanation": "服のボタンも機械のボタンも同じ語。", "id": "s4_060", "body_ruby": "エレベーターの「閉《へい》」の<button>を押《お》したつもりが「開《かい》」で、ドアの前《まえ》でしばらく気《き》まずかった。", "choices_ruby": ["ボタン", "レバー", "ハンドル", "ペダル"], "explanation_ruby": "服《ふく》のボタンも機械《きかい》のボタンも同《おな》じ語《ご》。", "body_kana": "エレベーターの「へい」の<button>をおしたつもりが「かい」で、ドアのまえでしばらくきまずかった。"}, {"word": "buzzer", "meaning_jp": "ブザー", "pos": "名", "body": "試合終了の<buzzer>が鳴った瞬間に放たれたシュートが決まり、会場は大歓声に包まれた。", "choices": ["ブザー", "笛", "太鼓", "鐘"], "correct_index": 0, "explanation": "buzz(ブーという音)+ -er。buzzer beater = 終了間際の得点。", "id": "s4_061", "body_ruby": "試合終了《しあいしゅうりょう》の<buzzer>が鳴《な》った瞬間《しゅんかん》に放《はな》たれたシュートが決《き》まり、会場《かいじょう》は大歓声《だいかんせい》に包《つつ》まれた。", "choices_ruby": ["ブザー", "笛《ふえ》", "太鼓《たいこ》", "鐘《かね》"], "explanation_ruby": "buzz(ブーという音《おと》)+ -er。buzzer beater = 終了間際《しゅうりょうまぎわ》の得点《とくてん》。", "body_kana": "しあいしゅうりょうの<buzzer>がなったしゅんかんにはなたれたシュートがきまり、かいじょうはだいかんせいにつつまれた。"}, {"word": "cacao", "meaning_jp": "カカオ", "pos": "名", "body": "チョコレートの原料の<cacao>は、赤道近くの国で育つ豆で、収穫後に発酵させてから出荷される。", "choices": ["カカオ", "コーヒー", "大豆", "ピーナッツ"], "correct_index": 0, "explanation": "cacao 豆を加工すると cocoa(ココア)になる。", "id": "s4_062", "body_ruby": "チョコレートの原料《げんりょう》の<cacao>は、赤道《せきどう》近《ちか》くの国《くに》で育《そだ》つ豆《まめ》で、収穫《しゅうかく》後《のち》に発酵《はっこう》させてから出荷《しゅっか》される。", "choices_ruby": ["カカオ", "コーヒー", "大豆《だいず》", "ピーナッツ"], "explanation_ruby": "cacao 豆《まめ》を加工《かこう》すると cocoa(ココア)になる。", "body_kana": "チョコレートのげんりょうの<cacao>は、せきどうちかくのくにでそだつまめで、しゅうかくのちにはっこうさせてからしゅっかされる。"}, {"word": "cafeteria", "meaning_jp": "食堂、カフェテリア", "pos": "名", "body": "大学の<cafeteria>は、トレーを持って好きなおかずを選ぶ方式で、日替わり定食は400円だった。", "choices": ["食堂", "図書室", "売店", "保健室"], "correct_index": 0, "explanation": "セルフ式の食堂。school cafeteria = 学食。", "id": "s4_063", "body_ruby": "大学《だいがく》の<cafeteria>は、トレーを持《も》って好《す》きなおかずを選《えら》ぶ方式《ほうしき》で、日替《ひが》わり定食《ていしょく》は400円《えん》だった。", "choices_ruby": ["食堂《しょくどう》", "図書室《としょしつ》", "売店《ばいてん》", "保健室《ほけんしつ》"], "explanation_ruby": "セルフ式《しき》の食堂《しょくどう》。school cafeteria = 学食《がくしょく》。", "body_kana": "だいがくの<cafeteria>は、トレーをもってすきなおかずをえらぶほうしきで、ひがわりていしょくは400円だった。"}, {"word": "calmly", "meaning_jp": "落ち着いて", "pos": "副", "body": "火災報知器が鳴っても、先生は<calmly>に避難経路を指示し、全員が3分で校庭に整列できた。", "choices": ["落ち着いて", "慌てて", "大声で", "嫌々"], "correct_index": 0, "explanation": "calm(冷静な)+ -ly。", "id": "s4_064", "body_ruby": "火災報知器《かさいほうちき》が鳴《な》っても、先生《せんせい》は<calmly>に避難《ひなん》経路《けいろ》を指示《しじ》し、全員《ぜんいん》が3分《ふん》で校庭《こうてい》に整列《せいれつ》できた。", "choices_ruby": ["｜落ち着《おちつ》いて", "慌《あわ》てて", "大声《おおごえ》で", "嫌々《いやいや》"], "explanation_ruby": "calm(冷静《れいせい》な)+ -ly。", "body_kana": "かさいほうちきがなっても、せんせいは<calmly>にひなんけいろをしじし、ぜんいんが3分でこうていにせいれつできた。"}, {"word": "camp", "meaning_jp": "キャンプ", "pos": "名", "body": "夏の<camp>では、川沿いにテントを張り、飯ごうでご飯を炊いて、夜は星空の下で眠った。", "choices": ["キャンプ", "ホテル泊", "日帰り遠足", "合宿所"], "correct_index": 0, "explanation": "campfire = キャンプファイヤー。", "id": "s4_065", "body_ruby": "夏《なつ》の<camp>では、川沿《かわぞ》いにテントを張《は》り、飯《めし》ごうでご飯《めし》を炊《た》いて、夜《よる》は星《ほし》空《そら》の下《した》で眠《ねむ》った。", "choices_ruby": ["キャンプ", "ホテル泊《はく》", "日帰《ひがえ》り遠足《えんそく》", "合宿所《がっしゅくじょ》"], "explanation_ruby": "campfire = キャンプファイヤー。", "body_kana": "なつの<camp>では、かわぞいにテントをはり、めしごうでごめしをたいて、よるはほしそらのしたでねむった。"}, {"word": "Canada", "meaning_jp": "カナダ", "pos": "名", "body": "メープルシロップと紅葉で有名な<Canada>は、アメリカの北にあり、国旗にはカエデの葉が描かれている。", "choices": ["カナダ", "アメリカ", "ロシア", "ノルウェー"], "correct_index": 0, "explanation": "首都はオタワ。世界で2番目に広い国。", "id": "s4_066", "body_ruby": "メープルシロップと紅葉《こうよう》で有名《ゆうめい》な<Canada>は、アメリカの北《きた》にあり、国旗《こっき》にはカエデの葉《は》が描《えが》かれている。", "choices_ruby": ["カナダ", "アメリカ", "ロシア", "ノルウェー"], "explanation_ruby": "首都《しゅと》はオタワ。世界《せかい》で2番目《ばんめ》に広《ひろ》い国《くに》。", "body_kana": "メープルシロップとこうようでゆうめいな<Canada>は、アメリカのきたにあり、こっきにはカエデのはがえがかれている。"}, {"word": "capital", "meaning_jp": "首都", "pos": "名", "body": "フランスの<capital>はパリ、イタリアはローマ。国の政治の中心となる都市をこう呼ぶ。", "choices": ["首都", "港町", "観光地", "工業都市"], "correct_index": 0, "explanation": "「大文字」「資本」の意味もある多義語。", "id": "s4_067", "body_ruby": "フランスの<capital>はパリ、イタリアはローマ。国《くに》の政治《せいじ》の中心《ちゅうしん》となる都市《とし》をこう呼《よ》ぶ。", "choices_ruby": ["首都《しゅと》", "港町《みなとまち》", "観光地《かんこうち》", "工業都市《こうぎょうとし》"], "explanation_ruby": "「大文字《おおもじ》」「資本《しほん》」の意味《いみ》もある多義《たぎ》語《ご》。", "body_kana": "フランスの<capital>はパリ、イタリアはローマ。くにのせいじのちゅうしんとなるとしをこうよぶ。"}, {"word": "captain", "meaning_jp": "キャプテン、主将", "pos": "名", "body": "新しい<captain>に選ばれた彼女は、「声を出すことから変えよう」と最初のミーティングで宣言した。", "choices": ["主将", "補欠", "応援団", "審判"], "correct_index": 0, "explanation": "チームの長。船長・機長も captain。", "id": "s4_068", "body_ruby": "新《あたら》しい<captain>に選《えら》ばれた彼女《かのじょ》は、「声《こえ》を出《だ》すことから変《か》えよう」と最初《さいしょ》のミーティングで宣言《せんげん》した。", "choices_ruby": ["主将《しゅしょう》", "補欠《ほけつ》", "応援団《おうえんだん》", "審判《しんぱん》"], "explanation_ruby": "チームの長《ちょう》。船長《せんちょう》・機長《きちょう》も captain。", "body_kana": "あたらしい<captain>にえらばれたかのじょは、「こえをだすことからかえよう」とさいしょのミーティングでせんげんした。"}, {"word": "cardboard", "meaning_jp": "段ボール", "pos": "名", "body": "引っ越しの荷物は<cardboard>の箱で30個になった。本だけで5箱を占めている。", "choices": ["段ボール", "プラスチック", "木材", "ブリキ"], "correct_index": 0, "explanation": "card(厚紙)+ board(板)。", "id": "s4_069", "body_ruby": "｜引っ越《ひっこ》しの荷物《にもつ》は<cardboard>の箱《はこ》で30個《こ》になった。本《ほん》だけで5箱《はこ》を占《し》めている。", "choices_ruby": ["段《だん》ボール", "プラスチック", "木材《もくざい》", "ブリキ"], "explanation_ruby": "card(厚紙《あつがみ》)+ board(板《いた》)。", "body_kana": "ひっこしのにもつは<cardboard>のはこで30個になった。ほんだけで5はこをしめている。"}, {"word": "career", "meaning_jp": "経歴、職業", "pos": "名", "body": "その投手は20年の<career>で300勝を挙げ、引退試合では敵チームのファンまで総立ちで見送った。", "choices": ["経歴", "年齢", "性格", "出身地"], "correct_index": 0, "explanation": "仕事の道のり。career education = キャリア教育。", "id": "s4_070", "body_ruby": "その投手《とうしゅ》は20年《ねん》の<career>で300勝《しょう》を挙《あ》げ、引退試合《いんたいじあい》では敵《てき》チームのファンまで総立《そうだ》ちで見送《みおく》った。", "choices_ruby": ["経歴《けいれき》", "年齢《ねんれい》", "性格《せいかく》", "出身地《しゅっしんち》"], "explanation_ruby": "仕事《しごと》の道《みち》のり。career education = キャリア教育《きょういく》。", "body_kana": "そのとうしゅは20年の<career>で300しょうをあげ、いんたいじあいではてきチームのファンまでそうだちでみおくった。"}, {"word": "carefully", "meaning_jp": "注意深く", "pos": "副", "body": "理科の実験では、薬品をスポイトで一滴ずつ<carefully>に加え、色の変化を記録した。", "choices": ["注意深く", "乱暴に", "急いで", "適当に"], "correct_index": 0, "explanation": "careful(注意深い)+ -ly。", "id": "s4_071", "body_ruby": "理科《りか》の実験《じっけん》では、薬品《やくひん》をスポイトで一滴《いってき》ずつ<carefully>に加《くわ》え、色《いろ》の変化《へんか》を記録《きろく》した。", "choices_ruby": ["注意深《ちゅういぶか》く", "乱暴《らんぼう》に", "急《いそ》いで", "適当《てきとう》に"], "explanation_ruby": "careful(注意深《ちゅういぶ t_index": 0, "explanation": "cheese + hamburger の合成語。", "id": "s4_083", "body_ruby": "注文《ちゅうもん》した<cheeseburger>は、パテの上《うえ》でチェダーがとろけ、包《つつ》み紙《かみ》まで香《こう》ばしい匂《にお》いがした。", "choices_ruby": ["チーズバーガー", "ホットドッグ", "サンドイッチ", "ピザ"], "explanation_ruby": "cheese + hamburger の合成語《ごうせいご》。", "body_kana": "ちゅうもんした<cheeseburger>は、パテのうえでチェダーがとろけ、つつみかみまでこうばしいにおいがした。"}, {"word": "chef", "meaning_jp": "シェフ、料理長", "pos": "名", "body": "オープンキッチンの<chef>は、フライパンの炎を立ち上げながら、手際よく3皿を同時に仕上げた。", "choices": ["シェフ", "店長", "配達員", "ソムリエ"], "correct_index": 0, "explanation": "フランス語由来。レストランの料理人。", "id": "s4_084", "body_ruby": "オープンキッチンの<chef>は、フライパンの炎《ほのお》を｜立ち上《たちあ》げながら、手際《てぎわ》よく3皿《さら》を同時《どうじ》に仕上《しあ》げた。", "choices_ruby": ["シェフ", "店長《てんちょう》", "配達員《はいたついん》", "ソムリエ"], "explanation_ruby": "フランス語《ご》由来《ゆらい》。レストランの料理人《りょうりにん》。", "body_kana": "オープンキッチンの<chef>は、フライパンのほのおをたちあげながら、てぎわよく3さらをどうじにしあげた。"}, {"word": "chess", "meaning_jp": "チェス", "pos": "名", "body": "<chess>は白と黒の駒を交互に動かし、相手のキングを追い詰めたら勝ちという世界的なボードゲームだ。", "choices": ["チェス", "将棋", "囲碁", "オセロ"], "correct_index": 0, "explanation": "西洋の盤上ゲーム。checkmate = 王手詰み。", "id": "s4_085", "body_ruby": "<chess>は白《しろ》と黒《くろ》の駒《こま》を交互《こうご》に動《うご》かし、相手《あいて》のキングを｜追い詰《おいつ》めたら勝《か》ちという世界的《せかいてき》なボードゲームだ。", "choices_ruby": ["チェス", "将棋《しょうぎ》", "囲碁《いご》", "オセロ"], "explanation_ruby": "西洋《せいよう》の盤上《ばんじょう》ゲーム。checkmate = 王手《おうて》詰《つ》み。", "body_kana": "<chess>はしろとくろのこまをこうごにうごかし、あいてのキングをおいつめたらかちというせかいてきなボードゲームだ。"}, {"word": "chest", "meaning_jp": "胸", "pos": "名", "body": "ゴール直前、心臓が<chest>の中で激しく打っているのが分かるほど、全力で走り抜けた。", "choices": ["胸", "背中", "腹", "腰"], "correct_index": 0, "explanation": "胸部。「たんす(chest of drawers)」の意味も。", "id": "s4_086", "body_ruby": "ゴール直前《ちょくぜん》、心臓《しんぞう》が<chest>の中《なか》で激《はげ》しく打《う》っているのが分《わ》かるほど、全力《ぜんりょく》で走《はし》り抜《ぬ》けた。", "choices_ruby": ["胸《むね》", "背中《せなか》", "腹《はら》", "腰《こし》"], "explanation_ruby": "胸部《きょうぶ》。「たんす(chest of drawers)」の意味《いみ》も。", "body_kana": "ゴールちょくぜん、しんぞうが<chest>のなかではげしくうっているのがわかるほど、ぜんりょくではしりぬけた。"}, {"word": "childhood", "meaning_jp": "子ども時代", "pos": "名", "body": "祖母は<c  "短い意見・感想。動詞では「論評する」。", "id": "s4_102", "body_ruby": "投稿《とうこう》した動画《どうが》に「編集《へんしゅう》が上手《じょうず》!」という<comment>が10件《けん》もついて、画面《がめん》を何度《なんど》も見返《みかえ》した。", "choices_ruby": ["コメント", "広告《こうこく》", "通知《つうち》音《おと》", "再生《さいせい》回数《かいすう》"], "explanation_ruby": "短《みじか》い意見《いけん》・感想《かんそう》。動詞《どうし》では「論評《ろんぴょう》する」。", "body_kana": "とうこうしたどうがに「へんしゅうがじょうず!」という<comment>が10けんもついて、がめんをなんどもみかえした。"}, {"word": "community", "meaning_jp": "地域社会、コミュニティ", "pos": "名", "body": "夏祭りや清掃活動を通じて、この<community>では子どもからお年寄りまで顔見知りが多い。", "choices": ["地域社会", "個人", "外国", "会社だけ"], "correct_index": 0, "explanation": "common(共通の)と同語源。共に暮らす人々の集まり。", "id": "s4_103", "body_ruby": "夏祭《なつまつ》りや清掃活動《せいそうかつどう》を通《つう》じて、この<community>では子《こ》どもからお年寄《としよ》りまで顔見知《かおみし》りが多《おお》い。", "choices_ruby": ["地域社会《ちいきしゃかい》", "個人《こじん》", "外国《がいこく》", "会社《かいしゃ》だけ"], "explanation_ruby": "common(共通《きょうつう》の)と同語《どうご》源《げん》。共《とも》に暮《く》らす人々《ひとびと》の集《あつ》まり。", "body_kana": "なつまつりやせいそうかつどうをつうじて、この<community>ではこどもからおとしよりまでかおみしりがおおい。"}, {"word": "company", "meaning_jp": "会社", "pos": "名", "body": "父の勤める<company>は自動車の部品を作っていて、社員は300人ほどいるそうだ。", "choices": ["会社", "学校", "病院", "役所"], "correct_index": 0, "explanation": "「仲間・同伴」の意味もある(keep company)。", "id": "s4_104", "body_ruby": "父《ちち》の勤《つと》める<company>は自動車《じどうしゃ》の部品《ぶひん》を作《つく》っていて、社員《しゃいん》は300人《にん》ほどいるそうだ。", "choices_ruby": ["会社《かいしゃ》", "学校《がっこう》", "病院《びょういん》", "役所《やくしょ》"], "explanation_ruby": "「仲間《なかま》・同伴《どうはん》」の意味《いみ》もある(keep company)。", "body_kana": "ちちのつとめる<company>はじどうしゃのぶひんをつくっていて、しゃいんは300人ほどいるそうだ。"}, {"word": "compartment", "meaning_jp": "区切られた空間、コンパートメント", "pos": "名", "body": "寝台列車の<compartment>は4人用の個室で、扉を閉めると向かい合わせの座席が夜にはベッドになる。", "choices": ["個室", "通路", "運転席", "デッキ"], "correct_index": 0, "explanation": "仕切られた区画。筆箱の仕切りにも使う。", "id": "s4_105", "body_ruby": "寝台列車《しんだいれっしゃ》の<compartment>は4人《にん》用《よう》の個室《こしつ》で、扉《とびら》を閉《し》めると向《む》かい合《あ》わせの座席《ざせき》が夜《よる》にはベッドになる。", "choices_ruby": ["個室《こしつ》", "通路《つうろ》", "運転席《うんてんせき》", "デッキ"], "explanation_ruby": "仕切《しき》られた区画《くかく》。筆箱《ふでばこ》の仕切《しき》りにも使《つか》う。", "body_kana": "しんだいれっしゃの<compartment>は4人ようのこしつで、とびらをしめるとむかいあわせのざせきがよるにはベッドになる。"}, {"word": "complain", "meaning_jp": "不平を言う", "pos": "動", "body": "弟は「ぼくの分のケーキが小さい」と<complain>したが、測ってみるとどちらも同じ大きさだった。", "choices": ["不平を言う", "感謝する", "自慢する", "謝る"], "correct_index": 0, "explanation": "complaint = 苦情。", "id": "s4_106", "body_ruby": "弟《おとうと》は「ぼくの分《ふん》のケーキが小《ちい》さい」と<complain>したが、測《はか》ってみるとどちらも同《おな》じ大《おお》きさだった。", "choices_ruby": ["不平《ふへい》を言《い》う", "感謝《かんしゃ》する", "自慢《じまん》する", "謝《あやま》る"], "explanation_ruby": "complaint = 苦情《くじょう》。", "body_kana": "おとうとは「ぼくのふんのケーキがちいさい」と<complain>したが、はかってみるとどちらもおなじおおきさだった。"}, {"word": "condition", "meaning_jp": "状態、調子", "pos": "名", "body": "中古で買った自転車は10年前のものだが、整備が行き届いていて<condition>は驚くほど良かった。", "choices": ["状態", "値段", "色", "重さ"], "correct_index": 0, "explanation": "体調・物の状態。「条件」の意味も。", "id": "s4_107", "body_ruby": "中古《ちゅうこ》で買《か》った自転車《じてんしゃ》は10年《ねん》前《まえ》のものだが、整備《せいび》が行《い》き届《とど》いていて<condition>は驚《おどろ》くほど良《よ》かった。", "choices_ruby": ["状態《じょうたい》", "値段《ねだん》", "色《いろ》", "重《おも》さ"], "explanation_ruby": "体調《たいちょう》・物《もの》の状態《じょうたい》。「条件《じょうけん》」の意味《いみ》も。", "body_kana": "ちゅうこでかったじてんしゃは10年まえのものだが、せいびがいきとどいていて<condition>はおどろくほどよかった。"}, {"word": "conditioner", "meaning_jp": "コンディショナー、調整装置", "pos": "名", "body": "シャンプーの後に<conditioner>をなじませてから流すと、髪の指通りがなめらかになる。", "choices": ["コンディショナー", "石けん", "歯みがき粉", "化粧水"], "correct_index": 0, "explanation": "air conditioner = エアコン(空気の調整装置)。", "id": "s4_108", "body_ruby": "シャンプーの後《あと》に<conditioner>をなじませてから流《なが》すと、髪《かみ》の指《ゆび》通《とお》りがなめらかになる。", "choices_ruby": ["コンディショナー", "石《いし》けん", "歯《は》みがき粉《こな》", "化粧水《けしょうすい》"], "explanation_ruby": "air conditioner = エアコン(空《そら》気《き》の調整《ちょうせい》装置《そうち》)。", "body_kana": "シャンプーのあとに<conditioner>をなじませてからながすと、かみのゆびとおりがなめらかになる。"}, {"word": "condominium", "meaning_jp": "分譲マンション", "pos": "名", "body": "駅前に20階建ての<condominium>が完成し、各部屋が販売されて、入居の引っ越しトラックが続いた。", "choices": ["分譲マンション", "一戸建て", "オフィスビル", "ホテル"], "correct_index": 0, "explanation": "condo と略す。購入する集合住宅。", "id": "s4_109", "body_ruby": "駅前《えきまえ》に20階《かい》建《た》ての<condominium>が完成《かんせい》し、各《かく》部屋《へや》が販売《はんばい》されて、入居《にゅうきょ》の｜引っ越《ひっこ》しトラックが続《つづ》いた。", "choices_ruby": ["分譲《ぶんじょう》マンション", "一戸建《いっこだ》て", "オフィスビル", "ホテル"], "explanation_ruby": "condo と略《りゃく》す。購入《こうにゅう》する集合《しゅうごう》住宅《じゅうたく》。", "body_kana": "えきまえに20階たての<condominium>がかんせいし、かくへやがはんばいされて、にゅうきょのひっこしトラックがつづいた。"}, {"word": "contest", "meaning_jp": "コンテスト、競技会", "pos": "名", "body": "写真<contest>に応募した夕焼けの一枚が、3000点の中から入選の50点に選ばれた。", "choices": ["コンテスト", "授業", "展示だけの会", "練習会"], "correct_index": 0, "explanation": "優劣を競う催し。speech contest = 弁論大会。", "id": "s4_110", "body_ruby": "写真《しゃしん》<contest>に応募《おうぼ》した夕焼《ゆうや》けの一枚《いちまい》が、3000点《てん》の中《なか》から入選《にゅうせん》の50点《てん》に選《えら》ばれた。", "choices_ruby": ["コンテスト", "授業《じゅぎょう》", "展示《てんじ》だけの会《かい》", "練習会《れんしゅうかい》"], "explanation_ruby": "優劣《ゆうれつ》を競《きそ》う催《もよお》し。speech contest = 弁論大会《べんろんたいかい》。", "body_kana": "しゃしん<contest>におうぼしたゆうやけのいちまいが、3000点のなかからにゅうせんの50点にえらばれた。"}, {"word": "control", "meaning_jp": "制御する、コントロール", "pos": "動/名", "body": "ドローンを初めて<control>したが、風にあおられて思った方向に進まず、着陸だけで5分かかった。", "choices": ["操縦する", "見学する", "撮影する", "修理する"], "correct_index": 0, "explanation": "remote control = リモコン(遠隔操作)。", "id": "s4_111", "body_ruby": "ドローンを初《はじ》めて<control>したが、風《かぜ》にあおられて思《おも》った方向《ほうこう》に進《すす》まず、着《ちゃく》陸《りく》だけで5分《ふん》かかった。", "choices_ruby": ["操縦《そうじゅう》する", "見学《けんがく》する", "撮影《さつえい》する", "修理《しゅうり》する"], "explanation_ruby": "remote control = リモコン(遠隔操作《えんかくそうさ》)。", "body_kana": "ドローンをはじめて<control>したが、かぜにあおられておもったほうこうにすすまず、ちゃくりくだけで5分かかった。"}, {"word": "cooking", "meaning_jp": "料理", "pos": "名", "body": "土曜の昼は私が<cooking>の当番で、レパートリーはチャーハンと焼きそばの2つだけだ。", "choices": ["料理", "洗濯", "掃除", "買い出し"], "correct_index": 0, "explanation": "cook(料理する)+ -ing。", "id": "s4_112", "body_ruby": "土曜《どよう》の昼《ひる》は私《わたし》が<cooking>の当番《とうばん》で、レパートリーはチャーハンと焼《や》きそばの2つだけだ。", "choices_ruby": ["料理《りょうり》", "洗濯《せんたく》", "掃除《そうじ》", "｜買い出《かいだ》し"], "explanation_ruby": "cook(料理《りょうり》する)+ -ing。", "body_kana": "どようのひるはわたしが<cooking>のとうばんで、レパートリーはチャーハンとやきそばの2つだけだ。"}, {"word": "corner", "meaning_jp": "角", "pos": "名", "body": "「2つ目の<corner>を右に曲がると花屋があります」と教わったとおり、角を曲がると店が見えた。", "choices": ["角", "坂", "橋", "踏切"], "correct_index": 0, "explanation": "道の曲がり角・部屋の隅。サッカーのコーナーキックも。", "id": "s4_113", "body_ruby": "「2つ目《め》の<corner>を右《みぎ》に曲《ま》がると花屋《はなや》があります」と教《おそ》わったとおり、角《かど》を曲《ま》がると店《みせ》が見《み》えた。", "choices_ruby": ["角《かく》", "坂《さか》", "橋《はし》", "踏切《ふみきり》"], "explanation_ruby": "道《みち》の曲《ま》がり角《かく》・部屋《へや》の隅《すみ》。サッカーのコーナーキックも。", "body_kana": "「2つめの<corner>をみぎにまがるとはなやがあります」とおそわったとおり、かどをまがるとみせがみえた。"}, {"word": "cost", "meaning_jp": "費用、(費用が)かかる", "pos": "名/動", "body": "文化祭の飾り付けにかかった<cost>は全部で8000円。材料費のレシートを集計して会計係に出した。", "choices": ["費用", "時間割", "人数", "感想"], "correct_index": 0, "explanation": "cost-cost-cost。It costs 500 yen. = 500円かかる。", "id": "s4_114", "body_ruby": "文化祭《ぶんかさい》の飾《かざ》り付《つ》けにかかった<cost>は全部《ぜんぶ》で8000円《えん》。材料費《ざいりょうひ》のレシートを集計《しゅうけい》して会計《かいけい》係《かかり》に出《だ》した。", "choices_ruby": ["費用《ひよう》", "時間割《じかんわり》", "人数《にんずう》", "感想《かんそう》"], "explanation_ruby": "cost-cost-cost。It costs 500 yen. = 500円《えん》かかる。", "body_kana": "ぶんかさいのかざりつけにかかった<cost>はぜんぶで8000円。ざいりょうひのレシートをしゅうけいしてかいけいかかりにだした。"}, {"word": "cotton", "meaning_jp": "綿", "pos": "名", "body": "このTシャツは<cotton>100%で、肌ざわりが柔らかく、汗もよく吸ってくれる。", "choices": ["綿", "絹", "羊毛", "ナイロン"], "correct_index": 0, "explanation": "綿花から作る天然素材。cotton candy = 綿あめ。", "id": "s4_115", "body_ruby": "このTシャツは<cotton>100%で、肌《はだ》ざわりが柔《やわ》らかく、汗《あせ》もよく吸《す》ってくれる。", "choices_ruby": ["綿《めん》", "絹《きぬ》", "羊毛《ようもう》", "ナイロン"], "explanation_ruby": "綿花《めんか》から作《つく》る天然《てんねん》素材《そざい》。cotton candy = 綿《めん》あめ。", "body_kana": "このTシャツは<cotton>100%で、はだざわりがやわらかく、あせもよくすってくれる。"}, {"word": "cough", "meaning_jp": "せき(をする)", "pos": "名/動", "body": "風邪のひき始めで、夜中に<cough>が止まらず、のどあめをなめてようやく眠れた。", "choices": ["せき", "くしゃみ", "鼻水", "頭痛"], "correct_index": 0, "explanation": "発音は「コフ」。gh を f と読む仲間(laugh, enough)。", "id": "s4_116", "body_ruby": "風邪《かぜ》のひき始《はじ》めで、夜中《よなか》に<cough>が止《と》まらず、のどあめをなめてようやく眠《ねむ》れた。", "choices_ruby": ["せき", "くしゃみ", "鼻水《はなみず》", "頭痛《ずつう》"], "explanation_ruby": "発音《はつおん》は「コフ」。gh を f と読《よ》む仲間《なかま》(laugh, enough)。", "body_kana": "かぜのひきはじめで、よなかに<cough>がとまらず、のどあめをなめてようやくねむれた。"}, {"word": "count", "meaning_jp": "数える", "pos": "動", "body": "募金箱を開けて、集まった小銭を1枚ずつ<count>したら、全部で12,480円になった。", "choices": ["数える", "磨く", "両替する", "寄付する"], "correct_index": 0, "explanation": "countdown = 秒読み。Count me in! = 私も入れて!", "id": "s4_117", "body_ruby": "募金《ぼきん》箱《はこ》を開《ひら》けて、集《あつ》まった小銭《こぜに》を1枚《まい》ずつ<count>したら、全部《ぜんぶ》で12,480円《えん》になった。", "choices_ruby": ["数《かぞ》える", "磨《みが》く", "両替《りょうがえ》する", "寄付《きふ》する"], "explanation_ruby": "countdown = 秒読《びょうよ》み。Count me in! = 私《わたし》も入《い》れて!", "body_kana": "ぼきんはこをひらけて、あつまったこぜにを1枚ずつ<count>したら、ぜんぶで12,480円になった。"}, {"word": "cover", "meaning_jp": "覆う", "pos": "動", "body": "夜のうちに降った雪が校庭全体を<cover>して、朝には足跡ひとつない白一面になっていた。", "choices": ["覆う", "溶かす", "掘り起こす", "照らす"], "correct_index": 0, "explanation": "本の「カバー」も同じ語(表紙を覆うもの)。", "id": "s4_118", "body_ruby": "夜《よる》のうちに降《ふ》った雪《ゆき》が校庭《こうてい》全体《ぜんたい》を<cover>して、朝《あさ》には足跡《そくせき》ひとつない白《しろ》一面《いちめん》になっていた。", "choices_ruby": ["覆《おお》う", "溶《と》かす", "掘《ほ》り起《お》こす", "照《て》らす"], "explanation_ruby": "本《ほん》の「カバー」も同《おな》じ語《ご》(表紙《ひょうし》を覆《おお》うもの)。", "body_kana": "よるのうちにふったゆきがこうていぜんたいを<cover>して、あさにはそくせきひとつないしろいちめんになっていた。"}, {"word": "cow", "meaning_jp": "牛", "pos": "名", "body": "牧場の<cow>は白黒のまだら模様で、1頭から1日20リットル以上の乳がしぼれるそうだ。", "choices": ["牛", "馬", "ヤギ", "羊"], "correct_index": 0, "explanation": "乳牛・雌牛。cowboy = カウボーイ。", "id": "s4_119", "body_ruby": "牧場《ぼくじょう》の<cow>は白黒《しろくろ》のまだら模様《もよう》で、1頭《あたま》から1日《にち》20リットル以上《いじょう》の乳《ちち》がしぼれるそうだ。", "choices_ruby": ["牛《うし》", "馬《うま》", "ヤギ", "羊《ひつじ》"], "explanation_ruby": "乳牛《にゅうぎゅう》・雌牛《めうし》。cowboy = カウボーイ。", "body_kana": "ぼくじょうの<cow>はしろくろのまだらもようで、1あたまから1日20リットルいじょうのちちがしぼれるそうだ。"}, {"word": "cracker", "meaning_jp": "クラッカー", "pos": "名", "body": "薄くて塩味の<cracker>にチーズをのせると、パリッとした食感と相性が抜群だった。", "choices": ["クラッカー", "ケーキ", "プリン", "チョコレート"], "correct_index": 0, "explanation": "crack(パリッと割れる)+ -er。お祝いのクラッカーも。", "id": "s4_120", "body_ruby": "薄《うす》くて塩味《しおあじ》の<cracker>にチーズをのせると、パリッとした食感《しょっかん》と相性《あいしょう》が抜群《ばつぐん》だった。", "choices_ruby": ["クラッカー", "ケーキ", "プリン", "チョコレート"], "explanation_ruby": "crack(パリッと割《わ》れる)+ -er。お祝《いわ》いのクラッカーも。", "body_kana": "うすくてしおあじの<cracker>にチーズをのせると、パリッとしたしょっかんとあいしょうがばつぐんだった。"}, {"word": "craftsperson", "meaning_jp": "職人", "pos": "名", "body": "輪島塗の<craftsperson>は、漆を100回以上塗り重ねて、1つの椀を半年かけて仕上げる。", "choices": ["職人", "観光客", "経営者", "評論家"], "correct_index": 0, "explanation": "craft(工芸)+ person。craftsman の性別を問わない形。", "id": "s4_121", "body_ruby": "輪《わ》島《しま》塗《ぬり》の<craftsperson>は、漆《うるし》を100回《かい》以上《いじょう》塗《ぬ》り重《おも》ねて、1つの椀《わん》を半年《はんとし》かけて仕上《しあ》げる。", "choices_ruby": ["職人《しょくにん》", "観光客《かんこうきゃく》", "経営者《けいえいしゃ》", "評論家《ひょうろんか》"], "explanation_ruby": "craft(工芸《こうげい》)+ person。craftsman の性別《せいべつ》を問《と》わない形《かたち》。", "body_kana": "わしまぬりの<craftsperson>は、うるしを100回いじょうぬりおもねて、1つのわんをはんとしかけてしあげる。"}, {"word": "create", "meaning_jp": "創造する", "pos": "動", "body": "彼は段ボールと輪ゴムだけで、ビー玉が3分間転がり続ける巨大な装置を<create>した。", "choices": ["創造する", "破壊する", "複製する", "輸入する"], "correct_index": 0, "explanation": "creative = 創造的な。creator = 創作者。", "id": "s4_122", "body_ruby": "彼《かれ》は段《だん》ボールと輪《わ》ゴムだけで、ビー玉《たま》が3分間《ふんかん》転《ころ》がり続《つづ》ける巨大《きょだい》な装置《そうち》を<create>した。", "choices_ruby": ["創造《そうぞう》する", "破壊《はかい》する", "複製《ふくせい》する", "輸入《ゆにゅう》する"], "explanation_ruby": "creative = 創造的《そうぞうてき》な。creator = 創作《そうさく》者《もの》。", "body_kana": "かれはだんボールとわゴムだけで、ビーたまが3分間ころがりつづけるきょだいなそうちを<create>した。"}, {"word": "cross", "meaning_jp": "渡る、横切る", "pos": "動", "body": "信号が青になってから、左右を確認して横断歩道を<cross>する。これは小学1年で最初に習うことだ。", "choices": ["渡る", "戻る", "止まる", "走り抜けるだけ"], "correct_index": 0, "explanation": "crossing = 横断歩道・踏切。十字(クロス)から。", "id": "s4_123", "body_ruby": "信号《しんごう》が青《あお》になってから、左右《さゆう》を確認《かくにん》して横断歩道《おうだんほどう》を<cross>する。これは小学《しょうがく》1年《ねん》で最初《さいしょ》に習《なら》うことだ。", "choices_ruby": ["渡《わた》る", "戻《もど》る", "止《と》まる", "走《はし》り抜《ぬ》けるだけ"], "explanation_ruby": "crossing = 横断歩道《おうだんほどう》・踏切《ふみきり》。十字《じゅうじ》(クロス)から。", "body_kana": "しんごうがあおになってから、さゆうをかくにんしておうだんほどうを<cross>する。これはしょうがく1年でさいしょにならうことだ。"}, {"word": "crowded", "meaning_jp": "混雑した", "pos": "形", "body": "朝8時の電車は<crowded>で、つり革どころか手すりにもつかまれないほど人が詰まっていた。", "choices": ["混雑した", "がらがらの", "新しい", "遅れた"], "correct_index": 0, "explanation": "crowd(群衆)+ -ed。be crowded with ~ = 〜で混み合う。", "id": "s4_124", "body_ruby": "朝《あさ》8時《じ》の電車《でんしゃ》は<crowded>で、つり革《かわ》どころか手《て》すりにもつかまれないほど人《にん》が詰《つ》まっていた。", "choices_ruby": ["混雑《こんざつ》した", "がらがらの", "新《あたら》しい", "遅《おく》れた"], "explanation_ruby": "crowd(群衆《ぐんしゅう》)+ -ed。be crowded with ~ = 〜で混《こ》み合《あ》う。", "body_kana": "あさ8時のでんしゃは<crowded>で、つりかわどころかてすりにもつかまれないほどにんがつまっていた。"}, {"word": "cushion", "meaning_jp": "クッション", "pos": "名", "body": "床に座るときは、お気に入りの丸い<cushion>を敷く。ふわふわで、長時間座ってもおしりが痛くならない。", "choices": ["クッション", "毛布", "枕カバー", "カーテン"], "correct_index": 0, "explanation": "衝撃を和らげるもの全般にも使う。", "id": "s4_125", "body_ruby": "床《ゆか》に座《すわ》るときは、お気《き》に入《い》りの丸《まる》い<cushion>を敷《し》く。ふわふわで、長時間《ちょうじかん》座《すわ》ってもおしりが痛《いた》くならない。", "choices_ruby": ["クッション", "毛布《もうふ》", "枕《まくら》カバー", "カーテン"], "explanation_ruby": "衝撃《しょうげき》を和《やわ》らげるもの全般《ぜんぱん》にも使《つか》う。", "body_kana": "ゆかにすわるときは、おきにいりのまるい<cushion>をしく。ふわふわで、ちょうじかんすわってもおしりがいたくならない。"}, {"word": "customer", "meaning_jp": "客", "pos": "名", "body": "開店セールの朝、店の前には100人を超える<customer>が列を作り、開店と同時になだれ込んだ。", "choices": ["客", "店員", "警備員", "配達員"], "correct_index": 0, "explanation": "店で買い物をする人。custom(習慣)から「常連」が原義。", "id": "s4_126", "body_ruby": "開店《かいてん》セールの朝《あさ》、店《みせ》の前《まえ》には100人《にん》を超《こ》える<customer>が列《れつ》を作《つく》り、開店《かいてん》と同時《どうじ》になだれ込《こ》んだ。", "choices_ruby": ["客《きゃく》", "店員《てんいん》", "警備員《けいびいん》", "配達員《はいたついん》"], "explanation_ruby": "店《みせ》で｜買い物《かいもの》をする人《にん》。custom(習慣《しゅうかん》)から「常連《じょうれん》」が原義《げんぎ》。", "body_kana": "かいてんセールのあさ、みせのまえには100人をこえる<customer>がれつをつくり、かいてんとどうじになだれこんだ。"}, {"word": "cycling", "meaning_jp": "サイクリング", "pos": "名", "body": "日曜の朝、川沿いの道を20キロ<cycling>した。ペダルをこぐたび、川風が頬を抜けて気持ちよかった。", "choices": ["サイクリング", "ジョギング", "水泳", "登山"], "correct_index": 0, "explanation": "cycle(自転車)+ -ing。自転車で走ること。", "id": "s4_127", "body_ruby": "日曜《にちよう》の朝《あさ》、川沿《かわぞ》いの道《みち》を20キロ<cycling>した。ペダルをこぐたび、川風《かわかぜ》が頬《ほお》を抜《ぬ》けて気持《きも》ちよかった。", "choices_ruby": ["サイクリング", "ジョギング", "水泳《すいえい》", "登山《とざん》"], "explanation_ruby": "cycle(自転車《じてんしゃ》)+ -ing。自転車《じてんしゃ》で走《はし》ること。", "body_kana": "にちようのあさ、かわぞいのみちを20キロ<cycling>した。ペダルをこぐたび、かわかぜがほおをぬけてきもちよかった。"}, {"word": "dad", "meaning_jp": "お父さん", "pos": "名", "body": "「<dad>、キャッチボールしよう」と誘うと、父は新聞を置いてグローブを2つ持ってきた。", "choices": ["お父さん", "お母さん", "おじいちゃん", "先生"], "correct_index": 0, "explanation": "father のくだけた呼び方。daddy はさらに幼い言い方。", "id": "s4_128", "body_ruby": "「<dad>、キャッチボールしよう」と誘《さそ》うと、父《ちち》は新聞《しんぶん》を置《お》いてグローブを2つ持《も》ってきた。", "choices_ruby": ["お父《とう》さん", "お母《かあ》さん", "おじいちゃん", "先生《せんせい》"], "explanation_ruby": "father のくだけた｜呼び方《よびかた》。daddy はさらに幼《おさな》い｜言い方《いいかた》。", "body_kana": "「<dad>、キャッチボールしよう」とさそうと、ちちはしんぶんをおいてグローブを2つもってきた。"}, {"word": "dangerous", "meaning_jp": "危険な", "pos": "形", "body": "雨で増水した川に近づくのは<dangerous>だ。昨日まで歩けた中州が、今日は濁流に沈んでいる。", "choices": ["危険な", "安全な", "退屈な", "便利な"], "correct_index": 0, "explanation": "danger(危険)+ -ous。", "id": "s4_129", "body_ruby": "雨《あめ》で増水《ぞうすい》した川《かわ》に近《ちか》づくのは<dangerous>だ。昨日《きのう》まで歩《ある》けた中州《なかす》が、今日《きょう》は濁流《だくりゅう》に沈《しず》んでいる。", "choices_ruby": ["危険《きけん》な", "安全《あんぜん》な", "退屈《たいくつ》な", "便利《べんり》な"], "explanation_ruby": "danger(危険《きけん》)+ -ous。", "body_kana": "あめでぞうすいしたかわにちかづくのは<dangerous>だ。きのうまであるけたなかすが、きょうはだくりゅうにしずんでいる。"}, {"word": "dead", "meaning_jp": "死んでいる", "pos": "形", "body": "道端で動かないセミを見つけた。<dead>かと思って拾おうとした瞬間、激しく羽ばたいて飛んでいった。", "choices": ["死んでいる", "生きている", "眠そうな", "元気な"], "correct_index": 0, "explanation": "die(死ぬ)の形容詞。alive(生きている)の対。", "id": "s4_130", "body_ruby": "道端《みちばた》で動《うご》かないセミを見《み》つけた。<dead>かと思《おも》って拾《ひろ》おうとした瞬間《しゅんかん》、激《はげ》しく羽《はね》ばたいて飛《と》んでいった。", "choices_ruby": ["死《し》んでいる", "生《い》きている", "眠《ねむ》そうな", "元気《げんき》な"], "explanation_ruby": "die(死《し》ぬ)の形容詞《けいようし》。alive(生《い》きている)の対《つい》。", "body_kana": "みちばたでうごかないセミをみつけた。<dead>かとおもってひろおうとしたしゅんかん、はげしくはねばたいてとんでいった。"}, {"word": "decision", "meaning_jp": "決定", "pos": "名", "body": "部活を続けるか受験勉強に専念するか、1週間悩んだ末の<decision>を、今日顧問の先生に伝えた。", "choices": ["決定", "質問", "うわさ", "命令"], "correct_index": 0, "explanation": "decide(決める)の名詞形。make a decision = 決断する。", "id": "s4_131", "body_ruby": "部活《ぶかつ》を続《つづ》けるか受験勉強《じゅけんべんきょう》に専念《せんねん》するか、1週間《しゅうかん》悩《なや》んだ末《まつ》の<decision>を、今日《きょう》顧問《こもん》の先生《せんせい》に伝《つた》えた。", "choices_ruby": ["決定《けってい》", "質問《しつもん》", "うわさ", "命令《めいれい》"], "explanation_ruby": "decide(決《き》める)の名詞《めいし》形《かたち》。make a decision = 決断《けつだん》する。", "body_kana": "ぶかつをつづけるかじゅけんべんきょうにせんねんするか、1週間なやんだまつの<decision>を、きょうこもんのせんせいにつたえた。"}, {"word": "deep", "meaning_jp": "深い", "pos": "形", "body": "このプールは一番<deep>なところで水深5メートルあり、底に沈んだコインが小さく見える。", "choices": ["深い", "浅い", "広い", "温かい"], "correct_index": 0, "explanation": "shallow(浅い)の対。deep breath = 深呼吸。", "id": "s4_132", "body_ruby": "このプールは一番《いちばん》<deep>なところで水深《すいしん》5メートルあり、底《そこ》に沈《しず》んだコインが小《ちい》さく見《み》える。", "choices_ruby": ["深《ふか》い", "浅《あさ》い", "広《ひろ》い", "温《あたた》かい"], "explanation_ruby": "shallow(浅《あさ》い)の対《つい》。deep breath = 深呼吸《しんこきゅう》。", "body_kana": "このプールはいちばん<deep>なところですいしん5メートルあり、そこにしずんだコインがちいさくみえる。"}, {"word": "democracy", "meaning_jp": "民主主義", "pos": "名", "body": "選挙で代表を選び、多数決で物事を決める<democracy>の仕組みを、公民の授業で学んだ。", "choices": ["民主主義", "独裁", "王政", "無政府状態"], "correct_index": 0, "explanation": "demos(民衆)+ cracy(支配)。国民が主権を持つ。", "id": "s4_133", "body_ruby": "選挙《せんきょ》で代表《だいひょう》を選《えら》び、多数決《たすうけつ》で物事《ものごと》を決《き》める<democracy>の仕組《しく》みを、公民《こうみん》の授業《じゅぎょう》で学《まな》んだ。", "choices_ruby": ["民主主義《みんしゅしゅぎ》", "独裁《どくさい》", "王政《おうせい》", "無政府状態《むせいふじょうたい》"], "explanation_ruby": "demos(民衆《みんしゅう》)+ cracy(支配《しはい》)。国民《こくみん》が主権《しゅけん》を持《も》つ。", "body_kana": "せんきょでだいひょうをえらび、たすうけつでものごとをきめる<democracy>のしくみを、こうみんのじゅぎょうでまなんだ。"}, {"word": "demonstration", "meaning_jp": "実演、デモ", "pos": "名", "body": "新しい掃除機の<demonstration>では、店員が小麦粉をまいて、その場で吸い取って見せた。", "choices": ["実演", "在庫処分", "抽選会", "修理"], "correct_index": 0, "explanation": "demonstrate(実演する)の名詞形。略して demo。", "id": "s4_134", "body_ruby": "新《あたら》しい掃除機《そうじき》の<demonstration>では、店員《てんいん》が小麦粉《こむぎこ》をまいて、その場《ば》で吸《す》い取《と》って見《み》せた。", "choices_ruby": ["実演《じつえん》", "在庫処分《ざいこしょぶん》", "抽選会《ちゅうせんかい》", "修理《しゅうり》"], "explanation_ruby": "demonstrate(実演《じつえん》する)の名詞《めいし》形《かたち》。略《りゃく》して demo。", "body_kana": "あたらしいそうじきの<demonstration>では、てんいんがこむぎこをまいて、そのばですいとってみせた。"}, {"word": "despair", "meaning_jp": "絶望", "pos": "名", "body": "全財産を火事で失った主人公は、一度は<despair>に沈むが、仲間の助けで再び立ち上がる。", "choices": ["絶望", "希望", "喜び", "怒り"], "correct_index": 0, "explanation": "hope(希望)の対。de(否定)+ spair(希望)。", "id": "s4_135", "body_ruby": "全財産《ぜんざいさん》を火事《かじ》で失《う》った主人公《しゅじんこう》は、一度《いちど》は<despair>に沈《しず》むが、仲間《なかま》の助《たす》けで再《ふたた》び｜立ち上《たちあ》がる。", "choices_ruby": ["絶望《ぜつぼう》", "希望《きぼう》", "喜《よろこ》び", "怒《いか》り"], "explanation_ruby": "hope(希望《きぼう》)の対《つい》。de(否定《ひてい》)+ spair(希望《きぼう》)。", "body_kana": "ぜんざいさんをかじでうったしゅじんこうは、いちどは<despair>にしずむが、なかまのたすけでふたたびたちあがる。"}, {"word": "diary", "meaning_jp": "日記", "pos": "名", "body": "寝る前に3行だけ<diary>をつけている。1年前のページを読み返すと、悩みの小ささに笑ってしまう。", "choices": ["日記", "教科書", "辞書", "地図帳"], "correct_index": 0, "explanation": "keep a diary = 日記をつける。", "id": "s4_136", "body_ruby": "寝《ね》る前《まえ》に3行《ぎょう》だけ<diary>をつけている。1年《ねん》前《まえ》のページを｜読み返《よみかえ》すと、悩《なや》みの小《ちい》ささに笑《わら》ってしまう。", "choices_ruby": ["日記《にっき》", "教科書《きょうかしょ》", "辞書《じしょ》", "地図帳《ちずちょう》"], "explanation_ruby": "keep a diary = 日記《にっき》をつける。", "body_kana": "ねるまえに3ぎょうだけ<diary>をつけている。1年まえのページをよみかえすと、なやみのちいささにわらってしまう。"}, {"word": "difference", "meaning_jp": "違い", "pos": "名", "body": "双子の姉妹の<difference>は、ほくろの位置だけ。担任の先生も1学期の間は見分けられなかった。", "choices": ["違い", "共通点", "関係", "距離"], "correct_index": 0, "explanation": "different(違う)の名詞形。", "id": "s4_137", "body_ruby": "双子《ふたご》の姉妹《しまい》の<difference>は、ほくろの位置《いち》だけ。担任《たんにん》の先生《せんせい》も1学期《がっき》の間《かん》は見分《みわ》けられなかった。", "choices_ruby": ["違《ちが》い", "共通点《きょうつうてん》", "関係《かんけい》", "距離《きょり》"], "explanation_ruby": "different(違《ちが》う)の名詞《めいし》形《かたち》。", "body_kana": "ふたごのしまいの<difference>は、ほくろのいちだけ。たんにんのせんせいも1学期のかんはみわけられなかった。"}, {"word": "differently", "meaning_jp": "異なって", "pos": "副", "body": "同じ夕焼けでも、画家と気象予報士では<differently>に見えるらしい。片や色彩、片や明日の天気だ。", "choices": ["異なって", "同じように", "正確に", "ぼんやりと"], "correct_index": 0, "explanation": "different + -ly。", "id": "s4_138", "body_ruby": "同《おな》じ夕焼《ゆうや》けでも、画家《がか》と気象《きしょう》予報《よほう》士《し》では<differently>に見《み》えるらしい。片《かた》や色彩《しきさい》、片《かた》や明日《あした》の天気《てんき》だ。", "choices_ruby": ["異《こと》なって", "同《おな》じように", "正確《せいかく》に", "ぼんやりと"], "explanation_ruby": "different + -ly。", "body_kana": "おなじゆうやけでも、がかときしょうよほうしでは<differently>にみえるらしい。かたやしきさい、かたやあしたのてんきだ。"}, {"word": "dinosaur", "meaning_jp": "恐竜", "pos": "名", "body": "博物館の<dinosaur>の骨格標本は首だけで5メートルあり、1億年前の地球を想像させた。", "choices": ["恐竜", "マンモス", "クジラ", "ワニ"], "correct_index": 0, "explanation": "ギリシャ語で「恐ろしいトカゲ」が語源。", "id": "s4_139", "body_ruby": "博物館《はくぶつかん》の<dinosaur>の骨格《こっかく》標本《ひょうほん》は首《くび》だけで5メートルあり、1億年《おくねん》前《まえ》の地球《ちきゅう》を想像《そうぞう》させた。", "choices_ruby": ["恐竜《きょうりゅう》", "マンモス", "クジラ", "ワニ"], "explanation_ruby": "ギリシャ語《ご》で「恐《おそ》ろしいトカゲ」が語源《ごげん》。", "body_kana": "はくぶつかんの<dinosaur>のこっかくひょうほんはくびだけで5メートルあり、1おくねんまえのちきゅうをそうぞうさせた。"}, {"word": "disagree", "meaning_jp": "意見が合わない", "pos": "動", "body": "文化祭の出し物について、私は劇、彼はお化け屋敷と<disagree>したが、最後は投票で決めることにした。", "choices": ["意見が合わない", "賛成する", "黙り込む", "妥協する"], "correct_index": 0, "explanation": "dis(否定)+ agree(同意する)。", "id": "s4_140", "body_ruby": "文化祭《ぶんかさい》の｜出し物《だしもの》について、私《わたし》は劇《げき》、彼《かれ》はお化《ば》け屋敷《やしき》と<disagree>したが、最後《さいご》は投票《とうひょう》で決《き》めることにした。", "choices_ruby": ["意見《いけん》が合《あ》わない", "賛成《さんせい》する", "黙《だま》り込《こ》む", "妥協《だきょう》する"], "explanation_ruby": "dis(否定《ひてい》)+ agree(同意《どうい》する)。", "body_kana": "ぶんかさいのだしものについて、わたしはげき、かれはおばけやしきと<disagree>したが、さいごはとうひょうできめることにした。"}, {"word": "disaster", "meaning_jp": "災害", "pos": "名", "body": "地震や台風などの<disaster>に備えて、わが家では水と缶詰を3日分、玄関の棚に置いている。", "choices": ["災害", "祝日", "行事", "渋滞"], "correct_index": 0, "explanation": "natural disaster = 自然災害。", "id": "s4_141", "body_ruby": "地震《じしん》や台風《たいふう》などの<disaster>に備《そな》えて、わが家《いえ》では水《みず》と缶詰《かんづめ》を3日《にち》分《ふん》、玄関《げんかん》の棚《たな》に置《お》いている。", "choices_ruby": ["災害《さいがい》", "祝日《しゅくじつ》", "行事《ぎょうじ》", "渋滞《じゅうたい》"], "explanation_ruby": "natural disaster = 自然災害《しぜんさいがい》。", "body_kana": "じしんやたいふうなどの<disaster>にそなえて、わがいえではみずとかんづめを3日ふん、げんかんのたなにおいている。"}, {"word": "discount", "meaning_jp": "割引", "pos": "名", "body": "閉店30分前のパン屋では、全品30%の<discount>になり、トレーを持つ手が自然と早くなる。", "choices": ["割引", "値上げ", "売り切れ", "新発売"], "correct_index": 0, "explanation": "dis(減らす)+ count(数える)。", "id": "s4_142", "body_ruby": "閉店《へいてん》30分《ふん》前《まえ》のパン屋《や》では、全品《ぜんぴん》30%の<discount>になり、トレーを持《も》つ手《て》が自然《しぜん》と早《はや》くなる。", "choices_ruby": ["割引《わりびき》", "値上《ねあ》げ", "｜売り切《うりき》れ", "新発売《しんはつばい》"], "explanation_ruby": "dis(減《へ》らす)+ count(数《かぞ》える)。", "body_kana": "へいてん30分まえのパンやでは、ぜんぴん30%の<discount>になり、トレーをもつてがしぜんとはやくなる。"}, {"word": "discover", "meaning_jp": "発見する", "pos": "動", "body": "理科の自由研究で、近所の川に絶滅危惧種の魚がすんでいることを<discover>し、市の研究所に報告した。", "choices": ["発見する", "隠す", "捕まえて飼う", "放流する"], "correct_index": 0, "explanation": "dis(取り除く)+ cover(覆い)= 覆いを外す。", "id": "s4_143", "body_ruby": "理科《りか》の自由研究《じゆうけんきゅう》で、近所《きんじょ》の川《かわ》に絶滅《ぜつめつ》危惧《きぐ》種《しゅ》の魚《さかな》がすんでいることを<discover>し、市《し》の研究所《けんきゅうしょ》に報告《ほうこく》した。", "choices_ruby": ["発見《はっけん》する", "隠《かく》す", "捕《つか》まえて飼《か》う", "放流《ほうりゅう》する"], "explanation_ruby": "dis(｜取り除《とりのぞ》く)+ cover(覆《おお》い)= 覆《おお》いを外《はず》す。", "body_kana": "りかのじゆうけんきゅうで、きんじょのかわにぜつめつきぐしゅのさかながすんでいることを<discover>し、しのけんきゅうしょにほうこくした。"}, {"word": "disease", "meaning_jp": "病気", "pos": "名", "body": "手洗いとうがいは、ウイルスによる<disease>から体を守る、いちばん簡単で効果的な方法だ。", "choices": ["病気", "けが", "疲労", "空腹"], "correct_index": 0, "explanation": "sickness より医学的な語。heart disease = 心臓病。", "id": "s4_144", "body_ruby": "手洗《てあら》いとうがいは、ウイルスによる<disease>から体《からだ》を守《まも》る、いちばん簡単《かんたん》で効果的《こうかてき》な方法《ほうほう》だ。", "choices_ruby": ["病気《びょうき》", "けが", "疲労《ひろう》", "空《そら》腹《はら》"], "explanation_ruby": "sickness より医学的《いがくてき》な語《ご》。heart disease = 心臓病《しんぞうびょう》。", "body_kana": "てあらいとうがいは、ウイルスによる<disease>からからだをまもる、いちばんかんたんでこうかてきなほうほうだ。"}, {"word": "dish", "meaning_jp": "皿、料理", "pos": "名", "body": "夕食後の<dish>洗いは私の担当だ。油もののお皿は、お湯で2度洗いするときれいになる。", "choices": ["皿", "鍋", "コップ", "箸"], "correct_index": 0, "explanation": "「一品の料理」の意味も(main dish = 主菜)。", "id": "s4_145", "body_ruby": "夕食《ゆうしょく》後《のち》の<dish>洗《あら》いは私《わたし》の担当《たんとう》だ。油《あぶら》もののお皿《さら》は、お湯《ゆ》で2度《ど》洗《あら》いするときれいになる。", "choices_ruby": ["皿《さら》", "鍋《なべ》", "コップ", "箸《はし》"], "explanation_ruby": "「一品《いっぴん》の料理《りょうり》」の意味《いみ》も(main dish = 主菜《しゅさい》)。", "body_kana": "ゆうしょくのちの<dish>あらいはわたしのたんとうだ。あぶらもののおさらは、おゆで2どあらいするときれいになる。"}, {"word": "displaced", "meaning_jp": "住む場所を追われた", "pos": "形", "body": "内戦で家を失い<displaced>となった人々が、国境近くのキャンプで支援物資の到着を待っていた。", "choices": ["住む場所を追われた", "旅行中の", "引っ越し好きの", "留学中の"], "correct_index": 0, "explanation": "dis + place(場所)。displaced people = 避難民。", "id": "s4_146", "body_ruby": "内戦《ないせん》で家《いえ》を失《うしな》い<displaced>となった人々《ひとびと》が、国境《こっきょう》近《ちか》くのキャンプで支援《しえん》物資《ぶっし》の到着《とうちゃく》を待《ま》っていた。", "choices_ruby": ["住《す》む場所《ばしょ》を追《お》われた", "旅行中《りょこうちゅう》の", "｜引っ越《ひっこ》し好《す》きの", "留学中《りゅうがくちゅう》の"], "explanation_ruby": "dis + place(場所《ばしょ》)。displaced people = ｜避難民《ひなんみん》。", "body_kana": "ないせんでいえをうしない<displaced>となったひとびとが、こっきょうちかくのキャンプでしえんぶっしのとうちゃくをまっていた。"}, {"word": "donut", "meaning_jp": "ドーナツ", "pos": "名", "body": "揚げたての<donut>は、真ん中に穴のあいた輪の形で、砂糖をまぶした表面がまだ温かかった。", "choices": ["ドーナツ", "クロワッサン", "ベーグルの皮", "ホットケーキ"], "correct_index": 0, "explanation": "doughnut ともつづる。dough(生地)+ nut。", "id": "s4_147", "body_ruby": "揚《あ》げたての<donut>は、｜真ん中《まんなか》に穴《あな》のあいた輪《わ》の形《かたち》で、砂糖《さとう》をまぶした表面《ひょうめん》がまだ温《あたた》かかった。", "choices_ruby": ["ドーナツ", "クロワッサン", "ベーグルの皮《かわ》", "ホットケーキ"], "explanation_ruby": "doughnut ともつづる。dough(生地《きじ》)+ nut。", "body_kana": "あげたての<donut>は、まんなかにあなのあいたわのかたちで、さとうをまぶしたひょうめんがまだあたたかかった。"}, {"word": "dot", "meaning_jp": "点", "pos": "名", "body": "ウェブサイトの住所にある「.」の記号は、ピリオドではなく<dot>と読むのだと先生が教えてくれた。", "choices": ["点", "線", "丸枠", "矢印"], "correct_index": 0, "explanation": "小さな点。水玉模様 = polka dots。", "id": "s4_148", "body_ruby": "ウェブサイトの住所《じゅうしょ》にある「.」の記号《きごう》は、ピリオドではなく<dot>と読《よ》むのだと先生《せんせい》が教《おし》えてくれた。", "choices_ruby": ["点《てん》", "線《せん》", "丸枠《まるわく》", "矢印《やじるし》"], "explanation_ruby": "小《ちい》さな点《てん》。水玉模様《みずたまもよう》 = polka dots。", "body_kana": "ウェブサイトのじゅうしょにある「.」のきごうは、ピリオドではなく<dot>とよむのだとせんせいがおしえてくれた。"}, {"word": "downstairs", "meaning_jp": "階下へ、1階で", "pos": "副", "body": "朝、母が<downstairs>から「ごはんできたよ」と呼ぶ声で、2階の自分の部屋から駆け下りた。", "choices": ["階下で", "屋上で", "庭で", "玄関の外で"], "correct_index": 0, "explanation": "down + stairs(階段)。upstairs(階上へ)の対。", "id": "s4_149", "body_ruby": "朝《あさ》、母《はは》が<downstairs>から「ごはんできたよ」と呼《よ》ぶ声《こえ》で、2階《かい》の自分《じぶん》の部屋《へや》から駆《か》け下《くだ》りた。", "choices_ruby": ["階下《かいか》で", "屋上《おくじょう》で", "庭《にわ》で", "玄関《げんかん》の外《そと》で"], "explanation_ruby": "down + stairs(階段《かいだん》)。upstairs(階上《かいじょう》へ)の対《つい》。", "body_kana": "あさ、ははが<downstairs>から「ごはんできたよ」とよぶこえで、2階のじぶんのへやからかけくだりた。"}, {"word": "drama", "meaning_jp": "ドラマ、劇", "pos": "名", "body": "毎週火曜の夜9時は、家族そろって医療<drama>を見る。続きが気になって1週間が長く感じる。", "choices": ["ドラマ", "ニュース", "クイズ番組", "天気予報"], "correct_index": 0, "explanation": "dramatic = 劇的な。演劇・テレビドラマ。", "id": "s4_150", "body_ruby": "毎週《まいしゅう》火曜《かよう》の夜《よる》9時《じ》は、家族《かぞく》そろって医療《いりょう》<drama>を見《み》る。続《つづ》きが気《き》になって1週間《しゅうかん》が長《なが》く感《かん》じる。", "choices_ruby": ["ドラマ", "ニュース", "クイズ番組《ばんぐみ》", "天気予報《てんきよほう》"], "explanation_ruby": "dramatic = 劇的《げきてき》な。演劇《えんげき》・テレビドラマ。", "body_kana": "まいしゅうかようのよる9時は、かぞくそろっていりょう<drama>をみる。つづきがきになって1週間がながくかんじる。"}, {"word": "dressed", "meaning_jp": "服を着た", "pos": "形", "body": "面接の日、彼は紺のスーツにきちんと<dressed>して、鏡の前でネクタイを3回結び直した。", "choices": ["服を着た", "裸足の", "寝起きの", "帽子だけの"], "correct_index": 0, "explanation": "get dressed = 服を着る。be dressed in ~ = 〜を着ている。", "id": "s4_151", "body_ruby": "面接《めんせつ》の日《ひ》、彼《かれ》は紺《こん》のスーツにきちんと<dressed>して、鏡《かがみ》の前《まえ》でネクタイを3回《かい》結《むす》び直《なお》した。", "choices_ruby": ["服《ふく》を着《き》た", "裸足《はだし》の", "寝起《ねお》きの", "帽子《ぼうし》だけの"], "explanation_ruby": "get dressed = 服《ふく》を着《き》る。be dressed in ~ = 〜を着《き》ている。", "body_kana": "めんせつのひ、かれはこんのスーツにきちんと<dressed>して、かがみのまえでネクタイを3回むすびなおした。"}, {"word": "driftwood", "meaning_jp": "流木", "pos": "名", "body": "台風の後の浜辺には、波に運ばれてきた<driftwood>が打ち上げられ、白く乾いた木肌が光っていた。", "choices": ["流木", "貝殻", "海藻", "軽石"], "correct_index": 0, "explanation": "drift(漂う)+ wood(木)。海や川を漂った木。", "id": "s4_152", "body_ruby": "台風《たいふう》の後《あと》の浜辺《はまべ》には、波《なみ》に運《はこ》ばれてきた<driftwood>が｜打ち上《うちあ》げられ、白《しろ》く乾《かわ》いた木肌《きはだ》が光《ひか》っていた。", "choices_ruby": ["流木《りゅうぼく》", "貝殻《かいがら》", "海藻《かいそう》", "軽石《かるいし》"], "explanation_ruby": "drift(漂《ただよ》う)+ wood(木《き》)。海《うみ》や川《かわ》を漂《ただよ》った木《き》。", "body_kana": "たいふうのあとのはまべには、なみにはこばれてきた<driftwood>がうちあげられ、しろくかわいたきはだがひかっていた。"}, {"word": "drill", "meaning_jp": "訓練、ドリル", "pos": "名", "body": "避難<drill>では、放送の合図で机の下に隠れ、揺れが収まった想定で校庭へ整列した。", "choices": ["訓練", "本番", "見学", "休憩"], "correct_index": 0, "explanation": "fire drill = 避難訓練。工具・計算ドリルも同じ語。", "id": "s4_153", "body_ruby": "避難《ひなん》<drill>では、放送《ほうそう》の合図《あいず》で机《つくえ》の下《した》に隠《かく》れ、揺《ゆ》れが収《おさ》まった想定《そうてい》で校庭《こうてい》へ整列《せいれつ》した。", "choices_ruby": ["訓練《くんれん》", "本番《ほんばん》", "見学《けんがく》", "休憩《きゅうけい》"], "explanation_ruby": "fire drill = 避難訓練《ひなんくんれん》。工具《こうぐ》・計算《けいさん》ドリルも同《おな》じ語《ご》。", "body_kana": "ひなん<drill>では、ほうそうのあいずでつくえのしたにかくれ、ゆれがおさまったそうていでこうていへせいれつした。"}, {"word": "driveway", "meaning_jp": "(家の)車道、私道", "pos": "名", "body": "アメリカの家には、道路から車庫まで続く<driveway>があり、子どもがチョークで絵を描いて遊んでいた。", "choices": ["家の私道", "高速道路", "歩道橋", "踏切"], "correct_index": 0, "explanation": "drive + way。敷地内の車用通路。", "id": "s4_154", "body_ruby": "アメリカの家《いえ》には、道路《どうろ》から車庫《しゃこ》まで続《つづ》く<driveway>があり、子《こ》どもがチョークで絵《え》を描《えが》いて遊《あそ》んでいた。", "choices_ruby": ["家《いえ》の私道《しどう》", "高速道路《こうそくどうろ》", "歩道橋《ほどうきょう》", "踏切《ふみきり》"], "explanation_ruby": "drive + way。敷地内《しきちない》の車用《くるまよう》通路《つうろ》。", "body_kana": "アメリカのいえには、どうろからしゃこまでつづく<driveway>があり、こどもがチョークでえをえがいてあそんでいた。"}, {"word": "duck", "meaning_jp": "カモ、アヒル", "pos": "名", "body": "池の<duck>の親子が一列に並んで泳ぎ、先頭の親が曲がると、ヒナたちも順番に曲がった。", "choices": ["カモ", "ハト", "スズメ", "カラス"], "correct_index": 0, "explanation": "水鳥。「ひょいとかがむ」という動詞の意味も。", "id": "s4_155", "body_ruby": "池《いけ》の<duck>の親子《おやこ》が一列《いちれつ》に並《なら》んで泳《およ》ぎ、先頭《せんとう》の親《おや》が曲《ま》がると、ヒナたちも順番《じゅんばん》に曲《ま》がった。", "choices_ruby": ["カモ", "ハト", "スズメ", "カラス"], "explanation_ruby": "水鳥《みずとり》。「ひょいとかがむ」という動詞《どうし》の意味《いみ》も。", "body_kana": "いけの<duck>のおやこがいちれつにならんでおよぎ、せんとうのおやがまがると、ヒナたちもじゅんばんにまがった。"}, {"word": "DVD", "meaning_jp": "DVD", "pos": "名", "body": "祖父の家で、私が生まれた日の映像を<DVD>で見た。円盤をプレーヤーに入れると、若い両親が映った。", "choices": ["DVD", "カセットテープ", "レコード", "フィルム"], "correct_index": 0, "explanation": "映像を記録する円盤。digital versatile disc の略。", "id": "s4_156", "body_ruby": "祖父《そふ》の家《いえ》で、私《わたし》が生《う》まれた日《にち》の映像《えいぞう》を<DVD>で見《み》た。円盤《えんばん》をプレーヤーに入《い》れると、若《わか》い両親《りょうしん》が映《うつ》った。", "choices_ruby": ["DVD", "カセットテープ", "レコード", "フィルム"], "explanation_ruby": "映像《えいぞう》を記録《きろく》する円盤《えんばん》。digital versatile disc の略《りゃく》。", "body_kana": "そふのいえで、わたしがうまれたにちのえいぞうを<DVD>でみた。えんばんをプレーヤーにいれると、わかいりょうしんがうつった。"}, {"word": "east", "meaning_jp": "東", "pos": "名", "body": "初日の出を見るなら、太陽が昇る<east>の空が開けた場所がいい。海岸の堤防は毎年人で埋まる。", "choices": ["東", "西", "南", "北"], "correct_index": 0, "explanation": "west(西)の対。日はeastから昇りwestに沈む。", "id": "s4_157", "body_ruby": "｜初日の出《はつひので》を見《み》るなら、太陽《たいよう》が昇《のぼ》る<east>の空《そら》が開《ひら》けた場所《ばしょ》がいい。海岸《かいがん》の堤防《ていぼう》は毎年《まいとし》人《にん》で埋《う》まる。", "choices_ruby": ["東《ひがし》", "西《にし》", "南《みなみ》", "北《きた》"], "explanation_ruby": "west(西《にし》)の対《つい》。日《にち》はeastから昇《のぼ》りwestに沈《しず》む。", "body_kana": "はつひのでをみるなら、たいようがのぼる<east>のそらがひらけたばしょがいい。かいがんのていぼうはまいとしにんでうまる。"}, {"word": "eastern", "meaning_jp": "東の、東部の", "pos": "形", "body": "アメリカの<eastern>の地域にはニューヨークやワシントンがあり、西海岸とは3時間の時差がある。", "choices": ["東部の", "西部の", "南部の", "中央の"], "correct_index": 0, "explanation": "east + -ern。western(西の)の対。", "id": "s4_158", "body_ruby": "アメリカの<eastern>の地域《ちいき》にはニューヨークやワシントンがあり、西海岸《にしかいがん》とは3時間《じかん》の時差《じさ》がある。", "choices_ruby": ["東部《とうぶ》の", "西部《せいぶ》の", "南部《なんぶ》の", "中央《ちゅうおう》の"], "explanation_ruby": "east + -ern。western(西《にし》の)の対《つい》。", "body_kana": "アメリカの<eastern>のちいきにはニューヨークやワシントンがあり、にしかいがんとは3時間のじさがある。"}, {"word": "efficient", "meaning_jp": "効率的な", "pos": "形", "body": "皿洗いは、ため水で予洗いしてから流すのが<efficient>だ。水道代も時間も半分で済む。", "choices": ["効率的な", "無駄の多い", "高価な", "危険な"], "correct_index": 0, "explanation": "efficiency = 効率。少ない労力で成果を出すこと。", "id": "s4_159", "body_ruby": "皿洗《さらあら》いは、ため水《みず》で予洗《よせん》いしてから流《なが》すのが<efficient>だ。水道代《すいどうだい》も時間《じかん》も半分《はんぶん》で済《す》む。", "choices_ruby": ["効率的《こうりつてき》な", "無駄《むだ》の多《おお》い", "高価《こうか》な", "危険《きけん》な"], "explanation_ruby": "efficiency = 効率《こうりつ》。少《すく》ない労力《ろうりょく》で成果《せいか》を出《だ》すこと。", "body_kana": "さらあらいは、ためみずでよせんいしてからながすのが<efficient>だ。すいどうだいもじかんもはんぶんですむ。"}, {"word": "eighteenth", "meaning_jp": "18番目の", "pos": "形", "body":
