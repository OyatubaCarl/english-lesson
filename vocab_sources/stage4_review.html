》が出《だ》した難問《なんもん》にも、別解《べっかい》まで添《そ》えて答《こた》えてしまう。", "choices_ruby": ["賢《かしこ》い", "細《こま》い", "おしゃれなだけ", "速《はや》い"], "explanation_ruby": "日本語《にほんご》の「スマート(細《こま》い)」とは意味《いみ》が違《ちが》う。", "body_kana": "かのじょはクラスでいちばん<smart>で、せんせいがだしたなんもんにも、べっかいまでそえてこたえてしまう。"}, {"word": "smog", "meaning_jp": "スモッグ", "pos": "名", "body": "工場の煙と車の排気ガスが混ざった<smog>が街を覆い、遠くのビルがかすんで見えた。", "choices": ["スモッグ", "霧", "黄砂", "花粉"], "correct_index": 0, "explanation": "smoke(煙)+ fog(霧)の合成語。大気汚染の一種。", "id": "s4_483", "body_ruby": "工場《こうじょう》の煙《けむり》と車《くるま》の排気《はいき》ガスが混《ま》ざった<smog>が街《まち》を覆《おお》い、遠《とお》くのビルがかすんで見《み》えた。", "choices_ruby": ["スモッグ", "霧《きり》", "黄砂《こうさ》", "花粉《かふん》"], "explanation_ruby": "smoke(煙《けむり》)+ fog(霧《きり》)の合成語《ごうせいご》。大気汚染《たいきおせん》の一種《いっしゅ》。", "body_kana": "こうじょうのけむりとくるまのはいきガスがまざった<smog>がまちをおおい、とおくのビルがかすんでみえた。"}, {"word": "smoke", "meaning_jp": "煙", "pos": "名", "body": "サンマを焼いていたら台所に<smoke>が立ちこめて、火災報知器が鳴る前に慌てて換気扇を回した。", "choices": ["煙", "湯気", "ほこり", "におい"], "correct_index": 0, "explanation": "動詞では「たばこを吸う」。No smoking = 禁煙。", "id": "s4_484", "body_ruby": "サンマを焼《や》いていたら台所《だいどころ》に<smoke>が立《た》ちこめて、火災報知器《かさいほうちき》が鳴《な》る前《まえ》に慌《あわ》てて換気扇《かんきせん》を回《まわ》した。", "choices_ruby": ["煙《けむり》", "湯気《ゆげ》", "ほこり", "におい"], "explanation_ruby": "動詞《どうし》では「たばこを吸《す》う」。No smoking = 禁煙《きんえん》。", "body_kana": "サンマをやいていたらだいどころに<smoke>がたちこめて、かさいほうちきがなるまえにあわててかんきせんをまわした。"}, {"word": "snake", "meaning_jp": "ヘビ", "pos": "名", "body": "草むらで<snake>がするすると体をくねらせて横切り、私たちは足を止めて通り過ぎるのを待った。", "choices": ["ヘビ", "トカゲ", "カエル", "ミミズ"], "correct_index": 0, "explanation": "足のない爬虫類。", "id": "s4_485", "body_ruby": "草《くさ》むらで<snake>がするすると体《からだ》をくねらせて横切《よこぎ》り、私《わたし》たちは足《あし》を止《と》めて通《とお》り過《す》ぎるのを待《ま》った。", "choices_ruby": ["ヘビ", "トカゲ", "カエル", "ミミズ"], "explanation_ruby": "足《あし》のない爬虫類《はちゅうるい》。", "body_kana": "くさむらで<snake>がするするとからだをくねらせてよこぎり、わたしたちはあしをとめてとおりすぎるのをまった。"}, {"word": "sneaker", "meaning_jp": "スニーカー", "pos": "名", "body": "新しい<sneaker>をおろした日は、わざと遠回りして帰った。靴ひもを結ぶたびに嬉しくなる。", "choices": ["スニーカー", "革靴", "長靴", "サンダル"], "correct_index": 0, "explanation": "sneak(忍び歩く)+ -er。音のしない運動靴が由来。", "id": "s4_486", "body_ruby": "新《あたら》しい<sneaker>をおろした日《にち》は、わざと遠回《とおまわ》りして帰《かえ》った。靴《くつ》ひもを結《むす》ぶたびに嬉《うれ》しくなる。", "choices_ruby": ["スニーカー", "革靴《かわぐつ》", "長靴《ながぐつ》", "サンダル"], "explanation_ruby": "sneak(忍《しの》び歩《ある》く)+ -er。音《おと》のしない運動靴《うんどうぐつ》が由来《ゆらい》。", "body_kana": "あたらしい<sneaker>をおろしたにちは、わざととおまわりしてかえった。くつひもをむすぶたびにうれしくなる。"}, {"word": "sock", "meaning_jp": "靴下", "pos": "名", "body": "洗濯のたびに<sock>が片方だけ行方不明になる。わが家の七不思議のひとつだ。", "choices": ["靴下", "手袋", "帽子", "マフラー"], "correct_index": 0, "explanation": "通常は複数形 socks で使う。", "id": "s4_487", "body_ruby": "洗濯《せんたく》のたびに<sock>が片方《かたほう》だけ行方不明《ゆくえふめい》になる。わが家《いえ》の七不思議《ななふしぎ》のひとつだ。", "choices_ruby": ["靴下《くつした》", "手袋《てぶくろ》", "帽子《ぼうし》", "マフラー"], "explanation_ruby": "通常《つうじょう》は複数形《ふくすうけい》 socks で使《つか》う。", "body_kana": "せんたくのたびに<sock>がかたほうだけゆくえふめいになる。わがいえのななふしぎのひとつだ。"}, {"word": "sofa", "meaning_jp": "ソファ", "pos": "名", "body": "休日の午後、<sofa>に深く沈み込んで本を読んでいると、いつの間にか眠ってしまっていた。", "choices": ["ソファ", "ベッド", "座布団", "ハンモック"], "correct_index": 0, "explanation": "背もたれのある長椅子。couch とも言う。", "id": "s4_488", "body_ruby": "休日《きゅうじつ》の午後《ごご》、<sofa>に深《ふか》く沈《しず》み込《こ》んで本《ほん》を読《よ》んでいると、いつの間《ま》にか眠《ねむ》ってしまっていた。", "choices_ruby": ["ソファ", "ベッド", "座布団《ざぶとん》", "ハンモック"], "explanation_ruby": "背《せ》もたれのある長椅子《ながいす》。couch とも言《い》う。", "body_kana": "きゅうじつのごご、<sofa>にふかくしずみこんでほんをよんでいると、いつのまにかねむってしまっていた。"}, {"word": "soft", "meaning_jp": "柔らかい", "pos": "形", "body": "つきたての餅は<soft>で、伸ばすといくらでも伸び、きなこをまぶすと最高だった。", "choices": ["柔らかい", "硬い", "冷たい", "苦い"], "correct_index": 0, "explanation": "hard(硬い)の対。soft cream = ソフトクリーム。", "id": "s4_489", "body_ruby": "つきたての餅《もち》は<soft>で、伸《の》ばすといくらでも伸《の》び、きなこをまぶすと最高《さいこう》だった。", "choices_ruby": ["柔《やわ》らかい", "硬《かた》い", "冷《つめ》たい", "苦《にが》い"], "explanation_ruby": "hard(硬《かた》い)の対《つい》。soft cream = ソフトクリーム。", "body_kana": "つきたてのもちは<soft>で、のばすといくらでものび、きなこをまぶすとさいこうだった。"}, {"word": "softball", "meaning_jp": "ソフトボール", "pos": "名", "body": "体育の<softball>では、野球より大きく柔らかいボールを使い、下手投げのピッチャーから打つ。", "choices": ["ソフトボール", "野球", "テニス", "ドッジボール"], "correct_index": 0, "explanation": "soft + ball。野球に似た球技。", "id": "s4_490", "body_ruby": "体育《たいいく》の<softball>では、野球《やきゅう》より大《おお》きく柔《やわ》らかいボールを使《つか》い、下手《へた》投《な》げのピッチャーから打《う》つ。", "choices_ruby": ["ソフトボール", "野球《やきゅう》", "テニス", "ドッジボール"], "explanation_ruby": "soft + ball。野球《やきゅう》に似《に》た球技《きゅうぎ》。", "body_kana": "たいいくの<softball>では、やきゅうよりおおきくやわらかいボールをつかい、へたなげのピッチャーからうつ。"}, {"word": "solar", "meaning_jp": "太陽の", "pos": "形", "body": "屋根の<solar>パネルが作った電気で、この家は昼間の電力をほぼ自給している。", "choices": ["太陽の", "風力の", "水力の", "原子力の"], "correct_index": 0, "explanation": "solar system = 太陽系。sun のラテン語形から。", "id": "s4_491", "body_ruby": "屋根《やね》の<solar>パネルが作《つく》った電気《でんき》で、この家《いえ》は昼間《ひるま》の電力《でんりょく》をほぼ自給《じきゅう》している。", "choices_ruby": ["太陽《たいよう》の", "風力《ふうりょく》の", "水力《すいりょく》の", "原子力《げんしりょく》の"], "explanation_ruby": "solar system = 太陽系《たいようけい》。sun のラテン語形《ごけい》から。", "body_kana": "やねの<solar>パネルがつくったでんきで、このいえはひるまのでんりょくをほぼじきゅうしている。"}, {"word": "sold", "meaning_jp": "売られた", "pos": "動", "body": "限定100個のプリンは、開店から30分ですべて<sold>されて、ケースには完売の札が立った。", "choices": ["売られた", "作られた", "捨てられた", "隠された"], "correct_index": 0, "explanation": "sell の過去形・過去分詞。sold out = 売り切れ。", "id": "s4_492", "body_ruby": "限定《げんてい》100個《こ》のプリンは、開店《かいてん》から30分《ふん》ですべて<sold>されて、ケースには完売《かんばい》の札《ふだ》が立《た》った。", "choices_ruby": ["売《う》られた", "作《つく》られた", "捨《す》てられた", "隠《かく》された"], "explanation_ruby": "sell の過去形《かこけい》・過去分詞《かこぶんし》。sold out = ｜売り切《うりき》れ。", "body_kana": "げんてい100個のプリンは、かいてんから30分ですべて<sold>されて、ケースにはかんばいのふだがたった。"}, {"word": "solve", "meaning_jp": "解く、解決する", "pos": "動", "body": "最後の難問を<solve>できたのは、クラスで彼女ひとりだった。黒板の解き方に拍手が起きた。", "choices": ["解く", "出題する", "写す", "諦める"], "correct_index": 0, "explanation": "solution = 解決策。問題や謎を解くこと。", "id": "s4_493", "body_ruby": "最後《さいご》の難問《なんもん》を<solve>できたのは、クラスで彼女《かのじょ》ひとりだった。黒板《こくばん》の解《と》き方《ほう》に拍手《はくしゅ》が起《お》きた。", "choices_ruby": ["解《と》く", "出題《しゅつだい》する", "写《うつ》す", "諦《あきら》める"], "explanation_ruby": "solution = 解決策《かいけつさく》。問題《もんだい》や謎《なぞ》を解《と》くこと。", "body_kana": "さいごのなんもんを<solve>できたのは、クラスでかのじょひとりだった。こくばんのときほうにはくしゅがおきた。"}, {"word": "sore", "meaning_jp": "痛い、ひりひりする", "pos": "形", "body": "久しぶりの筋トレの翌朝、太ももが<sore>で、階段を降りるたびに顔をしかめた。", "choices": ["痛い", "軽い", "冷たい", "かゆい"], "correct_index": 0, "explanation": "使いすぎ・炎症の痛み。sore throat = のどの痛み。", "id": "s4_494", "body_ruby": "久《ひさ》しぶりの筋《すじ》トレの翌朝《よくあさ》、太《ふと》ももが<sore>で、階段《かいだん》を降《お》りるたびに顔《かお》をしかめた。", "choices_ruby": ["痛《いた》い", "軽《かる》い", "冷《つめ》たい", "かゆい"], "explanation_ruby": "使《つか》いすぎ・炎症《えんしょう》の痛《いた》み。sore throat = のどの痛《いた》み。", "body_kana": "ひさしぶりのすじトレのよくあさ、ふとももが<sore>で、かいだんをおりるたびにかおをしかめた。"}, {"word": "sort", "meaning_jp": "種類、分類する", "pos": "名/動", "body": "図書室の返却本は、ラベルの色ごとに<sort>してから、それぞれの棚に戻していく。", "choices": ["分類する", "重ねるだけ", "持ち帰る", "修理する"], "correct_index": 0, "explanation": "kind(種類)と近い。a sort of ~ = 一種の〜。", "id": "s4_495", "body_ruby": "図書室《としょしつ》の返却《へんきゃく》本《ほん》は、ラベルの色《いろ》ごとに<sort>してから、それぞれの棚《たな》に戻《もど》していく。", "choices_ruby": ["分類《ぶんるい》する", "重《かさ》ねるだけ", "｜持ち帰《もちかえ》る", "修理《しゅうり》する"], "explanation_ruby": "kind(種類《しゅるい》)と近《ちか》い。a sort of ~ = 一種《いっしゅ》の〜。", "body_kana": "としょしつのへんきゃくほんは、ラベルのいろごとに<sort>してから、それぞれのたなにもどしていく。"}, {"word": "soup", "meaning_jp": "スープ", "pos": "名", "body": "寒い朝の温かいコーン<soup>は、マグカップを持つ手から先に温めてくれる。", "choices": ["スープ", "サラダ", "パン", "ゼリー"], "correct_index": 0, "explanation": "miso soup = 味噌汁。", "id": "s4_496", "body_ruby": "寒《さむ》い朝《あさ》の温《あたた》かいコーン<soup>は、マグカップを持《も》つ手《て》から先《さき》に温《あたた》めてくれる。", "choices_ruby": ["スープ", "サラダ", "パン", "ゼリー"], "explanation_ruby": "miso soup = 味噌汁《みそしる》。", "body_kana": "さむいあさのあたたかいコーン<soup>は、マグカップをもつてからさきにあたためてくれる。"}, {"word": "south", "meaning_jp": "南", "pos": "名", "body": "渡り鳥は冬が近づくと、暖かい<south>の地方へ向けて、編隊を組んで飛び立っていく。", "choices": ["南", "北", "東", "西"], "correct_index": 0, "explanation": "north(北)の対。South Pole = 南極。", "id": "s4_497", "body_ruby": "｜渡り鳥《わたりどり》は冬《ふゆ》が近《ちか》づくと、暖《あたた》かい<south>の地方《ちほう》へ向《む》けて、編隊《へんたい》を組《く》んで飛《と》び立《た》っていく。", "choices_ruby": ["南《みなみ》", "北《きた》", "東《ひがし》", "西《にし》"], "explanation_ruby": "north(北《きた》)の対《つい》。South Pole = 南極《なんきょく》。", "body_kana": "わたりどりはふゆがちかづくと、あたたかい<south>のちほうへむけて、へんたいをくんでとびたっていく。"}, {"word": "southern", "meaning_jp": "南の、南部の", "pos": "形", "body": "日本の<southern>の島々、沖縄や奄美では、1月でも上着なしで過ごせる日がある。", "choices": ["南部の", "北部の", "東部の", "西部の"], "correct_index": 0, "explanation": "south + -ern。発音は「サザン」。", "id": "s4_498", "body_ruby": "日本《にっぽん》の<southern>の島々《しまじま》、沖縄《おきなわ》や奄美《あまみ》では、1月《がつ》でも上着《うわぎ》なしで過《す》ごせる日《にち》がある。", "choices_ruby": ["南部《なんぶ》の", "北部《ほくぶ》の", "東部《とうぶ》の", "西部《せいぶ》の"], "explanation_ruby": "south + -ern。発音《はつおん》は「サザン」。", "body_kana": "にっぽんの<southern>のしまじま、おきなわやあまみでは、1月でもうわぎなしですごせるにちがある。"}, {"word": "southwest", "meaning_jp": "南西", "pos": "名", "body": "台風は沖縄の<southwest>の海上で発生し、南と西の間の方角から日本列島へ近づいてきた。", "choices": ["南西", "北東", "南東", "北西"], "correct_index": 0, "explanation": "south(南)+ west(西)。", "id": "s4_499", "body_ruby": "台風《たいふう》は沖縄《おきなわ》の<southwest>の海上《かいじょう》で発生《はっせい》し、南《みなみ》と西《にし》の間《ま》の方角《ほうがく》から日本《にっぽん》列《れつ》島《しま》へ近《ちか》づいてきた。", "choices_ruby": ["南西《なんせい》", "北東《ほくとう》", "南東《なんとう》", "北西《ほくせい》"], "explanation_ruby": "south(南《みなみ》)+ west(西《にし》)。", "body_kana": "たいふうはおきなわの<southwest>のかいじょうではっせいし、みなみとにしのまのほうがくからにっぽんれつしまへちかづいてきた。"}, {"word": "soybean", "meaning_jp": "大豆", "pos": "名", "body": "豆腐も味噌もしょうゆも、原料は同じ<soybean>だ。畑の肉と呼ばれるほどたんぱく質が豊富だ。", "choices": ["大豆", "小麦", "米", "とうもろこし"], "correct_index": 0, "explanation": "soy(しょうゆ)+ bean(豆)。soy sauce = しょうゆ。", "id": "s4_500", "body_ruby": "豆腐《とうふ》も味噌《みそ》もしょうゆも、原料《げんりょう》は同《おな》じ<soybean>だ。畑《はたけ》の肉《にく》と呼《よ》ばれるほどたんぱく質《しつ》が豊富《ほうふ》だ。", "choices_ruby": ["大豆《だいず》", "小麦《こむぎ》", "米《こめ》", "とうもろこし"], "explanation_ruby": "soy(しょうゆ)+ bean(豆《まめ》)。soy sauce = しょうゆ。", "body_kana": "とうふもみそもしょうゆも、げんりょうはおなじ<soybean>だ。はたけのにくとよばれるほどたんぱくしつがほうふだ。"}, {"word": "speaker", "meaning_jp": "話す人、スピーカー", "pos": "名", "body": "英語の<speaker>は世界に15億人いるといわれ、その大半は英語を母語としない人たちだ。", "choices": ["話す人", "聞く人", "書く人", "読む人"], "correct_index": 0, "explanation": "speak + -er。音を出す機械のスピーカーも。", "id": "s4_501", "body_ruby": "英語《えいご》の<speaker>は世界《せかい》に15億《おく》人《にん》いるといわれ、その大半《たいはん》は英語《えいご》を母語《ぼご》としない人《にん》たちだ。", "choices_ruby": ["話《はな》す人《にん》", "聞《き》く人《にん》", "書《か》く人《にん》", "読《よ》む人《にん》"], "explanation_ruby": "speak + -er。音《おと》を出《だ》す機械《きかい》のスピーカーも。", "body_kana": "えいごの<speaker>はせかいに15おくにんいるといわれ、そのたいはんはえいごをぼごとしないにんたちだ。"}, {"word": "spell", "meaning_jp": "つづる", "pos": "動", "body": "電話で名前を伝えるとき、ローマ字のつづりを1文字ずつ<spell>して確認してもらった。", "choices": ["つづる", "発音する", "翻訳する", "消す"], "correct_index": 0, "explanation": "spelling = つづり。How do you spell it?", "id": "s4_502", "body_ruby": "電話《でんわ》で名前《なまえ》を伝《つた》えるとき、ローマ字《じ》のつづりを1文字《もじ》ずつ<spell>して確認《かくにん》してもらった。", "choices_ruby": ["つづる", "発音《はつおん》する", "翻訳《ほんやく》する", "消《け》す"], "explanation_ruby": "spelling = つづり。How do you spell it?", "body_kana": "でんわでなまえをつたえるとき、ローマじのつづりを1もじずつ<spell>してかくにんしてもらった。"}, {"word": "spoon", "meaning_jp": "スプーン", "pos": "名", "body": "カレーは<spoon>ですくって食べる。福神漬けまで残さず集められる、丸いくぼみが便利だ。", "choices": ["スプーン", "フォーク", "箸", "ナイフ"], "correct_index": 0, "explanation": "a spoonful of ~ = スプーン1杯の〜。", "id": "s4_503", "body_ruby": "カレーは<spoon>ですくって食《た》べる。福神漬《ふくじんづけ》けまで残《のこ》さず集《あつ》められる、丸《まる》いくぼみが便利《べんり》だ。", "choices_ruby": ["スプーン", "フォーク", "箸《はし》", "ナイフ"], "explanation_ruby": "a spoonful of ~ = スプーン1杯《はい》の〜。", "body_kana": "カレーは<spoon>ですくってたべる。ふくじんづけけまでのこさずあつめられる、まるいくぼみがべんりだ。"}, {"word": "square", "meaning_jp": "正方形、広場", "pos": "名", "body": "折り紙は1辺15センチの<square>の紙で、4つの角と辺の長さがすべて等しい。", "choices": ["正方形", "円", "三角形", "長方形"], "correct_index": 0, "explanation": "町の「広場」の意味も(Times Square)。", "id": "s4_504", "body_ruby": "｜折り紙《おりがみ》は1辺《へん》15センチの<square>の紙《かみ》で、4つの角《かく》と辺《へん》の長《なが》さがすべて等《ひと》しい。", "choices_ruby": ["正方形《せいほうけい》", "円《えん》", "三角形《さんかくけい》", "長方形《ちょうほうけい》"], "explanation_ruby": "町《まち》の「広場《ひろば》」の意味《いみ》も(Times Square)。", "body_kana": "おりがみは1へん15センチの<square>のかみで、4つのかくとへんのながさがすべてひとしい。"}, {"word": "stage", "meaning_jp": "舞台、ステージ", "pos": "名", "body": "幕が上がり、照明を浴びた<stage>に立つと、客席は暗くてほとんど見えなかった。", "choices": ["舞台", "客席", "楽屋", "受付"], "correct_index": 0, "explanation": "「段階」の意味も(first stage = 第1段階)。", "id": "s4_505", "body_ruby": "幕《まく》が上《あ》がり、照明《しょうめい》を浴《あ》びた<stage>に立《た》つと、客席《きゃくせき》は暗《くら》くてほとんど見《み》えなかった。", "choices_ruby": ["舞台《ぶたい》", "客席《きゃくせき》", "楽屋《がくや》", "受付《うけつけ》"], "explanation_ruby": "「段階《だんかい》」の意味《いみ》も(first stage = 第《だい》1段階《だんかい》)。", "body_kana": "まくがあがり、しょうめいをあびた<stage>にたつと、きゃくせきはくらくてほとんどみえなかった。"}, {"word": "stair", "meaning_jp": "階段(の一段)", "pos": "名", "body": "エレベーターが点検中で、20階まで<stair>で上った。最後の5階分は無言になった。", "choices": ["階段", "廊下", "坂道", "はしご"], "correct_index": 0, "explanation": "通常は複数形 stairs。upstairs/downstairs。", "id": "s4_506", "body_ruby": "エレベーターが点検《てんけん》中《なか》で、20階《かい》まで<stair>で上《あ》った。最後《さいご》の5階《かい》分《ふん》は無言《むごん》になった。", "choices_ruby": ["階段《かいだん》", "廊下《ろうか》", "坂道《さかみち》", "はしご"], "explanation_ruby": "通常《つうじょう》は複数形《ふくすうけい》 stairs。upstairs/downstairs。", "body_kana": "エレベーターがてんけんなかで、20階まで<stair>であった。さいごの5階ふんはむごんになった。"}, {"word": "starvation", "meaning_jp": "飢餓", "pos": "名", "body": "世界では今も、食料不足による<starvation>で多くの子どもの命が失われている。", "choices": ["飢餓", "肥満", "病気", "貧富の差"], "correct_index": 0, "explanation": "starve(飢える)の名詞形。", "id": "s4_507", "body_ruby": "世界《せかい》では今《いま》も、食料《しょくりょう》不足《ふそく》による<starvation>で多《おお》くの子《こ》どもの命《いのち》が失《うしな》われている。", "choices_ruby": ["飢餓《きが》", "肥満《ひまん》", "病気《びょうき》", "貧富《ひんぷ》の差《さ》"], "explanation_ruby": "starve(飢《う》える)の名詞《めいし》形《かたち》。", "body_kana": "せかいではいまも、しょくりょうふそくによる<starvation>でおおくのこどものいのちがうしなわれている。"}, {"word": "stationery", "meaning_jp": "文房具", "pos": "名", "body": "新学期の前に<stationery>をそろえた。ノート5冊、ペン3本、消しゴム2個で千円ちょうどだった。", "choices": ["文房具", "教科書", "制服", "かばん"], "correct_index": 0, "explanation": "stationery shop = 文具店。station(駅)と区別。", "id": "s4_508", "body_ruby": "新学期《しんがっき》の前《まえ》に<stationery>をそろえた。ノート5冊《さつ》、ペン3本《ほん》、消《け》しゴム2個《こ》で千円《せんえん》ちょうどだった。", "choices_ruby": ["文房具《ぶんぼうぐ》", "教科書《きょうかしょ》", "制服《せいふく》", "かばん"], "explanation_ruby": "stationery shop = 文具店《ぶんぐてん》。station(駅《えき》)と区別《くべつ》。", "body_kana": "しんがっきのまえに<stationery>をそろえた。ノート5冊、ペン3本、けしゴム2個でせんえんちょうどだった。"}, {"word": "stew", "meaning_jp": "シチュー", "pos": "名", "body": "寒い夜の<stew>は、肉とじゃがいもをことこと煮込んで、とろみのあるルーが体を温めてくれる。", "choices": ["シチュー", "サラダ", "天ぷら", "そば"], "correct_index": 0, "explanation": "煮込み料理。beef stew = ビーフシチュー。", "id": "s4_509", "body_ruby": "寒《さむ》い夜《よる》の<stew>は、肉《にく》とじゃがいもをことこと煮込《にこみ》んで、とろみのあるルーが体《からだ》を温《あたた》めてくれる。", "choices_ruby": ["シチュー", "サラダ", "天《てん》ぷら", "そば"], "explanation_ruby": "煮込《にこ》み料理《りょうり》。beef stew = ビーフシチュー。", "body_kana": "さむいよるの<stew>は、にくとじゃがいもをことことにこみんで、とろみのあるルーがからだをあたためてくれる。"}, {"word": "stomach", "meaning_jp": "胃、おなか", "pos": "名", "body": "食べ放題で調子に乗ったら、<stomach>がぱんぱんになり、帰り道は前かがみで歩いた。", "choices": ["胃", "心臓", "肺", "のど"], "correct_index": 0, "explanation": "ch は「ク」と読む(スタマック)。", "id": "s4_510", "body_ruby": "食《た》べ放題《ほうだい》で調子《ちょうし》に乗《の》ったら、<stomach>がぱんぱんになり、｜帰り道《かえりみち》は前《ぜん》かがみで歩《ある》いた。", "choices_ruby": ["胃《い》", "心臓《しんぞう》", "肺《はい》", "のど"], "explanation_ruby": "ch は「ク」と読《よ》む(スタマック)。", "body_kana": "たべほうだいでちょうしにのったら、<stomach>がぱんぱんになり、かえりみちはぜんかがみであるいた。"}, {"word": "stomachache", "meaning_jp": "腹痛", "pos": "名", "body": "かき氷を一気に食べたせいで<stomachache>になり、保健室で湯たんぽを借りて温めた。", "choices": ["腹痛", "頭痛", "歯痛", "筋肉痛"], "correct_index": 0, "explanation": "stomach(胃)+ ache(痛み)。", "id": "s4_511", "body_ruby": "かき氷《こおり》を一気《いっき》に食《た》べたせいで<stomachache>になり、保健室《ほけんしつ》で湯《ゆ》たんぽを借《か》りて温《あたた》めた。", "choices_ruby": ["腹痛《ふくつう》", "頭痛《ずつう》", "歯痛《はいた》", "筋肉痛《きんにくつう》"], "explanation_ruby": "stomach(胃《い》)+ ache(痛《いた》み)。", "body_kana": "かきこおりをいっきにたべたせいで<stomachache>になり、ほけんしつでゆたんぽをかりてあたためた。"}, {"word": "storytelling", "meaning_jp": "読み聞かせ、語り", "pos": "名", "body": "図書委員は週に一度、昼休みに低学年向けの<storytelling>をする。絵本を見せながら声色も変える。", "choices": ["読み聞かせ", "計算練習", "合唱", "掃除"], "correct_index": 0, "explanation": "story(物語)+ telling(語ること)。", "id": "s4_512", "body_ruby": "図書《としょ》委員《いいん》は週《しゅう》に一度《いちど》、昼休《ひるやす》みに低学年《ていがくねん》向《む》けの<storytelling>をする。絵本《えほん》を見《み》せながら声色《こわいろ》も変《か》える。", "choices_ruby": ["読《よ》み聞《き》かせ", "計算練習《けいさんれんしゅう》", "合唱《がっしょう》", "掃除《そうじ》"], "explanation_ruby": "story(物語《ものがたり》)+ telling(語《かた》ること)。", "body_kana": "としょいいんはしゅうにいちど、ひるやすみにていがくねんむけの<storytelling>をする。えほんをみせながらこわいろもかえる。"}, {"word": "strange", "meaning_jp": "奇妙な", "pos": "形", "body": "夜中の台所から<strange>な物音がして恐る恐る見に行くと、猫が戸棚を開けようとしていた。", "choices": ["奇妙な", "普通の", "心地よい", "懐かしい"], "correct_index": 0, "explanation": "stranger = 見知らぬ人。", "id": "s4_513", "body_ruby": "夜中《よなか》の台所《だいどころ》から<strange>な物音《ものおと》がして恐《おそ》る恐《おそ》る見《み》に行《い》くと、猫《ねこ》が戸棚《とだな》を開《ひら》けようとしていた。", "choices_ruby": ["奇妙《きみょう》な", "普通《ふつう》の", "心地《ここち》よい", "懐《なつ》かしい"], "explanation_ruby": "stranger = 見知《みし》らぬ人《にん》。", "body_kana": "よなかのだいどころから<strange>なものおとがしておそるおそるみにいくと、ねこがとだなをひらけようとしていた。"}, {"word": "stream", "meaning_jp": "小川", "pos": "名", "body": "山道沿いの<stream>は浅くて流れが速く、手をひたすと夏でも切れるように冷たかった。", "choices": ["小川", "大河", "湖", "海"], "correct_index": 0, "explanation": "river より小さい流れ。動画の「配信」も stream。", "id": "s4_514", "body_ruby": "山道《やまみち》沿《そ》いの<stream>は浅《あさ》くて流《なが》れが速《はや》く、手《て》をひたすと夏《なつ》でも切《き》れるように冷《つめ》たかった。", "choices_ruby": ["小川《おがわ》", "大河《たいが》", "湖《みずうみ》", "海《うみ》"], "explanation_ruby": "river より小《ちい》さい流《なが》れ。動画《どうが》の「配信《はいしん》」も stream。", "body_kana": "やまみちそいの<stream>はあさくてながれがはやく、てをひたすとなつでもきれるようにつめたかった。"}, {"word": "strive", "meaning_jp": "努力する、励む", "pos": "動", "body": "そのパン職人は「昨日より1ミリでもうまく」を合言葉に、50年間<strive>し続けている。", "choices": ["努力する", "休憩する", "引退する", "自慢する"], "correct_index": 0, "explanation": "strive for ~ = 〜を目指して励む。", "id": "s4_515", "body_ruby": "そのパン職人《しょくにん》は「昨日《きのう》より1ミリでもうまく」を合言葉《あいことば》に、50年間《ねんかん》<strive>し続《つづ》けている。", "choices_ruby": ["努力《どりょく》する", "休憩《きゅうけい》する", "引退《いんたい》する", "自慢《じまん》する"], "explanation_ruby": "strive for ~ = 〜を目指《めざ》して励《はげ》む。", "body_kana": "そのパンしょくにんは「きのうより1ミリでもうまく」をあいことばに、50年間<strive>しつづけている。"}, {"word": "stroller", "meaning_jp": "ベビーカー", "pos": "名", "body": "<stroller>に乗った赤ちゃんが、すれ違いざまにこちらへ手を振ってくれて、思わず振り返した。", "choices": ["ベビーカー", "車いす", "三輪車", "買い物カート"], "correct_index": 0, "explanation": "stroll(ぶらぶら歩く)+ -er。英国では pram。", "id": "s4_516", "body_ruby": "<stroller>に乗《の》った赤《あか》ちゃんが、すれ違《ちが》いざまにこちらへ手《て》を振《ふ》ってくれて、思《おも》わず振《ふ》り返《かえ》した。", "choices_ruby": ["ベビーカー", "車《くるま》いす", "三輪車《さんりんしゃ》", "｜買い物《かいもの》カート"], "explanation_ruby": "stroll(ぶらぶら歩《ある》く)+ -er。英国《えいこく》では pram。", "body_kana": "<stroller>にのったあかちゃんが、すれちがいざまにこちらへてをふってくれて、おもわずふりかえした。"}, {"word": "suburb", "meaning_jp": "郊外", "pos": "名", "body": "祖父母は都心の喧騒を離れ、畑つきの家がある<suburb>に引っ越した。駅まではバスで15分かかる。", "choices": ["郊外", "都心", "離島", "山頂"], "correct_index": 0, "explanation": "sub(下・近く)+ urb(都市)。都市の周辺部。", "id": "s4_517", "body_ruby": "祖父母《そふぼ》は都心《としん》の喧騒《けんそう》を離《はな》れ、畑《はたけ》つきの家《いえ》がある<suburb>に｜引っ越《ひっこ》した。駅《えき》まではバスで15分《ふん》かかる。", "choices_ruby": ["郊外《こうがい》", "都心《としん》", "離島《りとう》", "山頂《さんちょう》"], "explanation_ruby": "sub(下《した》・近《ちか》く)+ urb(都市《とし》)。都市《とし》の周辺部《しゅうへんぶ》。", "body_kana": "そふぼはとしんのけんそうをはなれ、はたけつきのいえがある<suburb>にひっこした。えきまではバスで15分かかる。"}, {"word": "subway", "meaning_jp": "地下鉄", "pos": "名", "body": "<subway>の駅は地下3階にあり、長いエスカレーターを降りると、トンネルを走る電車が来た。", "choices": ["地下鉄", "新幹線", "路面電車", "モノレール"], "correct_index": 0, "explanation": "sub(下)+ way(道)。イギリスでは underground。", "id": "s4_518", "body_ruby": "<subway>の駅《えき》は地下《ちか》3階《かい》にあり、長《なが》いエスカレーターを降《お》りると、トンネルを走《はし》る電車《でんしゃ》が来《き》た。", "choices_ruby": ["地下鉄《ちかてつ》", "新幹線《しんかんせん》", "路面電車《ろめんでんしゃ》", "モノレール"], "explanation_ruby": "sub(下《した》)+ way(道《みち》)。イギリスでは underground。", "body_kana": "<subway>のえきはちか3階にあり、ながいエスカレーターをおりると、トンネルをはしるでんしゃがきた。"}, {"word": "successful", "meaning_jp": "成功した", "pos": "形", "body": "初めての文化祭ライブは<successful>で、アンコールの声に応えてもう1曲演奏した。", "choices": ["成功した", "失敗した", "中止された", "延期された"], "correct_index": 0, "explanation": "success(成功)+ -ful。", "id": "s4_519", "body_ruby": "初《はじ》めての文化祭《ぶんかさい》ライブは<successful>で、アンコールの声《こえ》に応《こた》えてもう1曲《きょく》演奏《えんそう》した。", "choices_ruby": ["成功《せいこう》した", "失敗《しっぱい》した", "中止《ちゅうし》された", "延期《えんき》された"], "explanation_ruby": "success(成功《せいこう》)+ -ful。", "body_kana": "はじめてのぶんかさいライブは<successful>で、アンコールのこえにこたえてもう1曲えんそうした。"}, {"word": "suffer", "meaning_jp": "苦しむ", "pos": "動", "body": "祖父は若い頃、戦後の食糧難で<suffer>した経験から、今も米粒ひとつ残さず食べる。", "choices": ["苦しむ", "楽しむ", "栄える", "忘れる"], "correct_index": 0, "explanation": "suffer from ~ = 〜に苦しむ。", "id": "s4_520", "body_ruby": "祖父《そふ》は若《わか》い頃《ごろ》、戦後《せんご》の食糧難《しょくりょうなん》で<suffer>した経験《けいけん》から、今《いま》も米粒《こめつぶ》ひとつ残《のこ》さず食《た》べる。", "choices_ruby": ["苦《くる》しむ", "楽《たの》しむ", "栄《さか》える", "忘《わす》れる"], "explanation_ruby": "suffer from ~ = 〜に苦《くる》しむ。", "body_kana": "そふはわかいごろ、せんごのしょくりょうなんで<suffer>したけいけんから、いまもこめつぶひとつのこさずたべる。"}, {"word": "sunlight", "meaning_jp": "日光", "pos": "名", "body": "カーテンを開けると、朝の<sunlight>が部屋いっぱいに差し込み、ほこりがきらきらと舞って見えた。", "choices": ["日光", "月光", "電灯", "炎"], "correct_index": 0, "explanation": "sun(太陽)+ light(光)。", "id": "s4_521", "body_ruby": "カーテンを開《ひら》けると、朝《あさ》の<sunlight>が部屋《へや》いっぱいに｜差し込《さしこ》み、ほこりがきらきらと舞《ま》って見《み》えた。", "choices_ruby": ["日光《にっこう》", "月光《げっこう》", "電灯《でんとう》", "炎《ほのお》"], "explanation_ruby": "sun(太陽《たいよう》)+ light(光《ひかり》)。", "body_kana": "カーテンをひらけると、あさの<sunlight>がへやいっぱいにさしこみ、ほこりがきらきらとまってみえた。"}, {"word": "sunset", "meaning_jp": "夕日、日没", "pos": "名", "body": "水平線に沈む<sunset>が海をオレンジ色に染め、浜辺の人々はみなスマホを構えていた。", "choices": ["夕日", "朝日", "虹", "星空"], "correct_index": 0, "explanation": "sun + set(沈む)。sunrise(日の出)の対。", "id": "s4_522", "body_ruby": "水平線《すいへいせん》に沈《しず》む<sunset>が海《うみ》をオレンジ色《いろ》に染《そ》め、浜辺《はまべ》の人々《ひとびと》はみなスマホを構《かま》えていた。", "choices_ruby": ["夕日《ゆうひ》", "朝日《あさひ》", "虹《にじ》", "星《ほし》空《そら》"], "explanation_ruby": "sun + set(沈《しず》む)。sunrise(｜日の出《ひので》)の対《つい》。", "body_kana": "すいへいせんにしずむ<sunset>がうみをオレンジいろにそめ、はまべのひとびとはみなスマホをかまえていた。"}, {"word": "surprise", "meaning_jp": "驚き、驚かせる", "pos": "名/動", "body": "誕生日の朝、机の上に姉からの<surprise>のプレゼントが置いてあった。まったく気づかなかった。", "choices": ["驚き", "宿題", "請求書", "予定表"], "correct_index": 0, "explanation": "surprise party = サプライズパーティー。", "id": "s4_523", "body_ruby": "誕生日《たんじょうび》の朝《あさ》、机《つくえ》の上《うえ》に姉《あね》からの<surprise>のプレゼントが置《お》いてあった。まったく気《き》づかなかった。", "choices_ruby": ["驚《おどろ》き", "宿題《しゅくだい》", "請求書《せいきゅうしょ》", "予定表《よていひょう》"], "explanation_ruby": "surprise party = サプライズパーティー。", "body_kana": "たんじょうびのあさ、つくえのうえにあねからの<surprise>のプレゼントがおいてあった。まったくきづかなかった。"}, {"word": "surround", "meaning_jp": "囲む", "pos": "動", "body": "その城は深い堀と高い石垣が<surround>していて、敵が簡単には近づけない造りになっている。", "choices": ["囲む", "貫く", "支える", "飾る"], "correct_index": 0, "explanation": "surroundings = 周囲の環境。", "id": "s4_524", "body_ruby": "その城《しろ》は深《ふか》い堀《ほり》と高《たか》い石垣《いしがき》が<surround>していて、敵《てき》が簡単《かんたん》には近《ちか》づけない造《つく》りになっている。", "choices_ruby": ["囲《かこ》む", "貫《つらぬ》く", "支《ささ》える", "飾《かざ》る"], "explanation_ruby": "surroundings = 周囲《しゅうい》の環境《かんきょう》。", "body_kana": "そのしろはふかいほりとたかいいしがきが<surround>していて、てきがかんたんにはちかづけないつくりになっている。"}, {"word": "survival", "meaning_jp": "生存、サバイバル", "pos": "名", "body": "砂漠での<survival>には、まず水の確保が欠かせない。人は水なしでは数日しかもたない。", "choices": ["生き残ること", "観光", "競争", "祝賀"], "correct_index": 0, "explanation": "survive(生き残る)の名詞形。", "id": "s4_525", "body_ruby": "砂漠《さばく》での<survival>には、まず水《みず》の確保《かくほ》が欠《か》かせない。人《にん》は水《みず》なしでは数日《すうじつ》しかもたない。", "choices_ruby": ["｜生き残《いきのこ》ること", "観光《かんこう》", "競争《きょうそう》", "祝賀《しゅくが》"], "explanation_ruby": "survive(｜生き残《いきのこ》る)の名詞《めいし》形《かたち》。", "body_kana": "さばくでの<survival>には、まずみずのかくほがかかせない。にんはみずなしではすうじつしかもたない。"}, {"word": "swallow", "meaning_jp": "飲み込む、ツバメ", "pos": "動/名", "body": "錠剤が苦手な弟は、薬を<swallow>するのに水をコップ2杯も使う。", "choices": ["飲み込む", "吐き出す", "噛み砕く", "なめる"], "correct_index": 0, "explanation": "鳥のツバメも同じつづり。", "id": "s4_526", "body_ruby": "錠剤《じょうざい》が苦手《にがて》な弟《おとうと》は、薬《くすり》を<swallow>するのに水《みず》をコップ2杯《はい》も使《つか》う。", "choices_ruby": ["｜飲み込《のみこ》む", "｜吐き出《はきだ》す", "噛《か》み砕《くだ》く", "なめる"], "explanation_ruby": "鳥《とり》のツバメも同《おな》じつづり。", "body_kana": "じょうざいがにがてなおとうとは、くすりを<swallow>するのにみずをコップ2杯もつかう。"}, {"word": "sweet", "meaning_jp": "甘い", "pos": "形", "body": "もぎたての桃はびっくりするほど<sweet>で、砂糖など入れていないのにデザートそのものだった。", "choices": ["甘い", "苦い", "辛い", "酸っぱい"], "correct_index": 0, "explanation": "sweets = 甘いお菓子。", "id": "s4_527", "body_ruby": "もぎたての桃《もも》はびっくりするほど<sweet>で、砂糖《さとう》など入《い》れていないのにデザートそのものだった。", "choices_ruby": ["甘《あま》い", "苦《にが》い", "辛《つら》い", "酸《す》っぱい"], "explanation_ruby": "sweets = 甘《あま》いお菓子《かし》。", "body_kana": "もぎたてのももはびっくりするほど<sweet>で、さとうなどいれていないのにデザートそのものだった。"}, {"word": "swimming", "meaning_jp": "水泳", "pos": "名", "body": "夏の体育は<swimming>の授業だ。25メートルを泳ぎきるのが1学期の目標になっている。", "choices": ["水泳", "陸上", "球技", "体操"], "correct_index": 0, "explanation": "swim + -ming。swimming pool = プール。", "id": "s4_528", "body_ruby": "夏《なつ》の体育《たいいく》は<swimming>の授業《じゅぎょう》だ。25メートルを泳《およ》ぎきるのが1学期《がっき》の目標《もくひょう》になっている。", "choices_ruby": ["水泳《すいえい》", "陸《りく》上《うえ》", "球技《きゅうぎ》", "体操《たいそう》"], "explanation_ruby": "swim + -ming。swimming pool = プール。", "body_kana": "なつのたいいくは<swimming>のじゅぎょうだ。25メートルをおよぎきるのが1学期のもくひょうになっている。"}, {"word": "sword", "meaning_jp": "剣、刀", "pos": "名", "body": "博物館に展示された武士の<sword>は、刃が鏡のように磨かれ、700年前のものとは思えなかった。", "choices": ["刀", "弓", "槍", "盾"], "correct_index": 0, "explanation": "w は発音しない(ソード)。", "id": "s4_529", "body_ruby": "博物館《はくぶつかん》に展示《てんじ》された武士《ぶし》の<sword>は、刃《は》が鏡《かがみ》のように磨《みが》かれ、700年《ねん》前《まえ》のものとは思《おも》えなかった。", "choices_ruby": ["刀《かたな》", "弓《ゆみ》", "槍《やり》", "盾《たて》"], "explanation_ruby": "w は発音《はつおん》しない(ソード)。", "body_kana": "はくぶつかんにてんじされたぶしの<sword>は、はがかがみのようにみがかれ、700年まえのものとはおもえなかった。"}, {"word": "symbol", "meaning_jp": "象徴、シンボル", "pos": "名", "body": "ハトは平和の<symbol>とされ、式典では白いハトが一斉に空へ放たれた。", "choices": ["象徴", "原因", "結果", "条件"], "correct_index": 0, "explanation": "意味を代表するしるし。記号の意味も。", "id": "s4_530", "body_ruby": "ハトは平和《へいわ》の<symbol>とされ、式典《しきてん》では白《しろ》いハトが一斉《いっせい》に空《そら》へ放《はな》たれた。", "choices_ruby": ["象徴《しょうちょう》", "原因《げんいん》", "結果《けっか》", "条件《じょうけん》"], "explanation_ruby": "意味《いみ》を代表《だいひょう》するしるし。記号《きごう》の意味《いみ》も。", "body_kana": "ハトはへいわの<symbol>とされ、しきてんではしろいハトがいっせいにそらへはなたれた。"}, {"word": "system", "meaning_jp": "仕組み、システム", "pos": "名", "body": "この図書館は、バーコードをかざすだけで貸し出しが終わる<system>になっていて、行列ができない。", "choices": ["仕組み", "建物", "蔵書", "職員"], "correct_index": 0, "explanation": "組み合わさって働く全体の仕組み。", "id": "s4_531", "body_ruby": "この図書館《としょかん》は、バーコードをかざすだけで｜貸し出《かしだ》しが終《お》わる<system>になっていて、行列《ぎょうれつ》ができない。", "choices_ruby": ["仕組《しく》み", "建物《たてもの》", "蔵書《ぞうしょ》", "職員《しょくいん》"], "explanation_ruby": "｜組み合《くみあ》わさって働《はたら》く全体《ぜんたい》の仕組《しく》み。", "body_kana": "このとしょかんは、バーコードをかざすだけでかしだしがおわる<system>になっていて、ぎょうれつができない。"}, {"word": "T-shirt", "meaning_jp": "Tシャツ", "pos": "名", "body": "クラス全員でおそろいの<T-shirt>を作った。背中には全員の名前がプリントされている。", "choices": ["Tシャツ", "ワイシャツ", "セーター", "ジャージ"], "correct_index": 0, "explanation": "広げるとT字形になることから。", "id": "s4_532", "body_ruby": "クラス全員《ぜんいん》でおそろいの<T-shirt>を作《つく》った。背中《せなか》には全員《ぜんいん》の名前《なまえ》がプリントされている。", "choices_ruby": ["Tシャツ", "ワイシャツ", "セーター", "ジャージ"], "explanation_ruby": "広《ひろ》げるとT字形《じけい》になることから。", "body_kana": "クラスぜんいんでおそろいの<T-shirt>をつくった。せなかにはぜんいんのなまえがプリントされている。"}, {"word": "Tanzania", "meaning_jp": "タンザニア", "pos": "名", "body": "アフリカ最高峰キリマンジャロがそびえる<Tanzania>では、サバンナの動物を見るサファリが人気だ。", "choices": ["タンザニア", "エジプト", "モロッコ", "ガーナ"], "correct_index": 0, "explanation": "アフリカ東部の国。セレンゲティ国立公園も有名。", "id": "s4_533", "body_ruby": "アフリカ最高峰《さいこうほう》キリマンジャロがそびえる<Tanzania>では、サバンナの動物《どうぶつ》を見《み》るサファリが人気《にんき》だ。", "choices_ruby": ["タンザニア", "エジプト", "モロッコ", "ガーナ"], "explanation_ruby": "アフリカ東部《とうぶ》の国《くに》。セレンゲティ国立公園《こくりつこうえん》も有名《ゆうめい》。", "body_kana": "アフリカさいこうほうキリマンジャロがそびえる<Tanzania>では、サバンナのどうぶつをみるサファリがにんきだ。"}, {"word": "teammate", "meaning_jp": "チームメイト", "pos": "名", "body": "リレーでバトンを落としたとき、<teammate>たちは責めるどころか「切り替えよう」と声をかけてくれた。", "choices": ["チームの仲間", "対戦相手", "審判", "観客"], "correct_index": 0, "explanation": "team + mate(仲間)。classmate と同じ作り。", "id": "s4_534", "body_ruby": "リレーでバトンを落《お》としたとき、<teammate>たちは責《せ》めるどころか「｜切り替《きりか》えよう」と声《こえ》をかけてくれた。", "choices_ruby": ["チームの仲間《なかま》", "対戦相手《たいせんあいて》", "審判《しんぱん》", "観客《かんきゃく》"], "explanation_ruby": "team + mate(仲間《なかま》)。classmate と同《おな》じ作《つく》り。", "body_kana": "リレーでバトンをおとしたとき、<teammate>たちはせめるどころか「きりかえよう」とこえをかけてくれた。"}, {"word": "tear", "meaning_jp": "涙", "pos": "名", "body": "卒業式の答辞の途中、読み上げる声が震え、彼女の頬を<tear>が伝った。", "choices": ["涙", "汗", "雨", "笑顔"], "correct_index": 0, "explanation": "in tears = 泣いて。「破る」(発音テア)の意味も。", "id": "s4_535", "body_ruby": "卒業式《そつぎょうしき》の答辞《とうじ》の途中《とちゅう》、｜読み上《よみあ》げる声《こえ》が震《ふる》え、彼女《かのじょ》の頬《ほお》を<tear>が伝《つた》った。", "choices_ruby": ["涙《なみだ》", "汗《あせ》", "雨《あめ》", "笑顔《えがお》"], "explanation_ruby": "in tears = 泣《な》いて。「破《やぶ》る」(発音《はつおん》テア)の意味《いみ》も。", "body_kana": "そつぎょうしきのとうじのとちゅう、よみあげるこえがふるえ、かのじょのほおを<tear>がつたった。"}, {"word": "technology", "meaning_jp": "技術、テクノロジー", "pos": "名", "body": "翻訳の<technology>の進歩で、スマホをかざすだけで外国語のメニューが日本語で読めるようになった。", "choices": ["技術", "芸術", "伝統", "自然"], "correct_index": 0, "explanation": "科学を応用した技術。IT = information technology。", "id": "s4_536", "body_ruby": "翻訳《ほんやく》の<technology>の進歩《しんぽ》で、スマホをかざすだけで外国語《がいこくご》のメニューが日本語《にほんご》で読《よ》めるようになった。", "choices_ruby": ["技術《ぎじゅつ》", "芸術《げいじゅつ》", "伝統《でんとう》", "自然《しぜん》"], "explanation_ruby": "科学《かがく》を応用《おうよう》した技術《ぎじゅつ》。IT = information technology。", "body_kana": "ほんやくの<technology>のしんぽで、スマホをかざすだけでがいこくごのメニューがにほんごでよめるようになった。"}, {"word": "telescope", "meaning_jp": "望遠鏡", "pos": "名", "body": "<telescope>をのぞくと、肉眼では点にしか見えない土星に、くっきりと環があるのが分かった。", "choices": ["望遠鏡", "顕微鏡", "双眼鏡なしの目", "虫めがね"], "correct_index": 0, "explanation": "tele(遠く)+ scope(見る道具)。", "id": "s4_537", "body_ruby": "<telescope>をのぞくと、肉眼《にくがん》では点《てん》にしか見《み》えない土星《どせい》に、くっきりと環《わ》があるのが分《わ》かった。", "choices_ruby": ["望遠鏡《ぼうえんきょう》", "顕微鏡《けんびきょう》", "双眼鏡《そうがんきょう》なしの目《め》", "虫《むし》めがね"], "explanation_ruby": "tele(遠《とお》く)+ scope(見《み》る道具《どうぐ》)。", "body_kana": "<telescope>をのぞくと、にくがんではてんにしかみえないどせいに、くっきりとわがあるのがわかった。"}, {"word": "temperature", "meaning_jp": "温度、気温", "pos": "名", "body": "今日の最高<temperature>は35度の予想で、ニュースはこまめな水分補給を呼びかけていた。", "choices": ["気温", "湿度", "気圧", "風速"], "correct_index": 0, "explanation": "take one's temperature = 体温を測る。", "id": "s4_538", "body_ruby": "今日《きょう》の最高《さいこう》<temperature>は35度《ど》の予想《よそう》で、ニュースはこまめな水分《すいぶん》補給《ほきゅう》を呼《よ》びかけていた。", "choices_ruby": ["気温《きおん》", "湿度《しつど》", "気圧《きあつ》", "風速《ふうそく》"], "explanation_ruby": "take one's temperature = 体温《たいおん》を測《はか》る。", "body_kana": "きょうのさいこう<temperature>は35どのよそうで、ニュースはこまめなすいぶんほきゅうをよびかけていた。"}, {"word": "tender", "meaning_jp": "柔らかい、優しい", "pos": "形", "body": "3時間煮込んだ肉は<tender>で、箸で持ち上げるだけでほろりと崩れた。", "choices": ["柔らかい", "硬い", "生焼けの", "冷めた"], "correct_index": 0, "explanation": "肉の柔らかさや、心の優しさに使う。", "id": "s4_539", "body_ruby": "3時間《じかん》煮込《にこみ》んだ肉《にく》は<tender>で、箸《はし》で持《も》ち上《あ》げるだけでほろりと崩《くず》れた。", "choices_ruby": ["柔《やわ》らかい", "硬《かた》い", "生《なま》焼《や》けの", "冷《さ》めた"], "explanation_ruby": "肉《にく》の柔《やわ》らかさや、心《こころ》の優《やさ》しさに使《つか》う。", "body_kana": "3時間にこみんだにくは<tender>で、はしでもちあげるだけでほろりとくずれた。"}, {"word": "Thai", "meaning_jp": "タイの、タイ語", "pos": "形/名", "body": "<Thai>料理の店で、トムヤムクンを注文した。辛さと酸っぱさと香草の香りが一度に押し寄せた。", "choices": ["タイの", "ベトナムの", "インドの", "中国の"], "correct_index": 0, "explanation": "Thailand(タイ)の形容詞。", "id": "s4_540", "body_ruby": "<Thai>料理《りょうり》の店《みせ》で、トムヤムクンを注文《ちゅうもん》した。辛《つら》さと酸《す》っぱさと香草《こうそう》の香《かお》りが一度《いちど》に押《お》し寄《よ》せた。", "choices_ruby": ["タイの", "ベトナムの", "インドの", "中国《ちゅうごく》の"], "explanation_ruby": "Thailand(タイ)の形容詞《けいようし》。", "body_kana": "<Thai>りょうりのみせで、トムヤムクンをちゅうもんした。つらさとすっぱさとこうそうのかおりがいちどにおしよせた。"}, {"word": "Thailand", "meaning_jp": "タイ", "pos": "名", "body": "東南アジアの<Thailand>は微笑みの国と呼ばれ、金色の寺院と象が観光の目玉になっている。", "choices": ["タイ", "ベトナム", "マレーシア", "インドネシア"], "correct_index": 0, "explanation": "首都はバンコク。", "id": "s4_541", "body_ruby": "東南《とうなん》アジアの<Thailand>は微笑《ほほえ》みの国《くに》と呼《よ》ばれ、金色《きんいろ》の寺院《じいん》と象《ぞう》が観光《かんこう》の目玉《めだま》になっている。", "choices_ruby": ["タイ", "ベトナム", "マレーシア", "インドネシア"], "explanation_ruby": "首都《しゅと》はバンコク。", "body_kana": "とうなんアジアの<Thailand>はほほえみのくにとよばれ、きんいろのじいんとぞうがかんこうのめだまになっている。"}, {"word": "theater", "meaning_jp": "劇場、映画館", "pos": "名", "body": "<theater>の客席が暗くなり、スクリーンに予告編が映ると、ポップコーンの手が自然に止まった。", "choices": ["映画館", "体育館", "美術館", "水族館"], "correct_index": 0, "explanation": "movie theater = 映画館。演劇の劇場も。", "id": "s4_542", "body_ruby": "<theater>の客席《きゃくせき》が暗《くら》くなり、スクリーンに予告編《よこくへん》が映《うつ》ると、ポップコーンの手《て》が自然《しぜん》に止《と》まった。", "choices_ruby": ["映画館《えいがかん》", "体育館《たいいくかん》", "美術館《びじゅつかん》", "水族館《すいぞくかん》"], "explanation_ruby": "movie theater = 映画館《えいがかん》。演劇《えんげき》の劇場《げきじょう》も。", "body_kana": "<theater>のきゃくせきがくらくなり、スクリーンによこくへんがうつると、ポップコーンのてがしぜんにとまった。"}, {"word": "thin", "meaning_jp": "薄い、細い", "pos": "形", "body": "クレープの生地は<thin>に焼くのがコツで、向こうが透けるくらいに広げると軽い食感になる。", "choices": ["薄い", "厚い", "重い", "硬い"], "correct_index": 0, "explanation": "thick(厚い)の対。人には「やせた」。", "id": "s4_543", "body_ruby": "クレープの生地《きじ》は<thin>に焼《や》くのがコツで、向《む》こうが透《す》けるくらいに広《ひろ》げると軽《かる》い食感《しょっかん》になる。", "choices_ruby": ["薄《うす》い", "厚《あつ》い", "重《おも》い", "硬《かた》い"], "explanation_ruby": "thick(厚《あつ》い)の対《つい》。人《にん》には「やせた」。", "body_kana": "クレープのきじは<thin>にやくのがコツで、むこうがすけるくらいにひろげるとかるいしょっかんになる。"}, {"word": "threw", "meaning_jp": "投げた", "pos": "動", "body": "彼は最終回に140キロの速球を<threw>して、空振り三振で試合を締めくくった。", "choices": ["投げた", "打った", "捕った", "蹴った"], "correct_index": 0, "explanation": "throw の過去形。throw-threw-thrown。", "id": "s4_544", "body_ruby": "彼《かれ》は最終回《さいしゅうかい》に140キロの速球《そっきゅう》を<threw>して、空《そら》振《ふ》り三振《さんしん》で試合《しあい》を締《し》めくくった。", "choices_ruby": ["投《な》げた", "打《う》った", "捕《とら》った", "蹴《け》った"], "explanation_ruby": "throw の過去形《かこけい》。throw-threw-thrown。", "body_kana": "かれはさいしゅうかいに140キロのそっきゅうを<threw>して、そらふりさんしんでしあいをしめくくった。"}, {"word": "throat", "meaning_jp": "のど", "pos": "名", "body": "応援合戦で叫びすぎて<throat>がかれてしまい、翌日は声がかすれて出なかった。", "choices": ["のど", "鼻", "耳", "目"], "correct_index": 0, "explanation": "sore throat = のどの痛み。", "id": "s4_545", "body_ruby": "応援《おうえん》合戦《かっせん》で叫《さけ》びすぎて<throat>がかれてしまい、翌日《よくじつ》は声《こえ》がかすれて出《で》なかった。", "choices_ruby": ["のど", "鼻《はな》", "耳《みみ》", "目《め》"], "explanation_ruby": "sore throat = のどの痛《いた》み。", "body_kana": "おうえんかっせんでさけびすぎて<throat>がかれてしまい、よくじつはこえがかすれてでなかった。"}, {"word": "thrown", "meaning_jp": "投げられた", "pos": "動", "body": "式の最後に、卒業生の帽子が一斉に空へ<thrown>されて、青空に黒い弧をいくつも描いた。", "choices": ["投げられた", "落とされた", "燃やされた", "配られた"], "correct_index": 0, "explanation": "throw の過去分詞。", "id": "s4_546", "body_ruby": "式《しき》の最後《さいご》に、卒業生《そつぎょうせい》の帽子《ぼうし》が一斉《いっせい》に空《そら》へ<thrown>されて、青《あお》空《そら》に黒《くろ》い弧《こ》をいくつも描《えが》いた。", "choices_ruby": ["投《な》げられた", "落《お》とされた", "燃《も》やされた", "配《くば》られた"], "explanation_ruby": "throw の過去分詞《かこぶんし》。", "body_kana": "しきのさいごに、そつぎょうせいのぼうしがいっせいにそらへ<thrown>されて、あおそらにくろいこをいくつもえがいた。"}, {"word": "tightly", "meaning_jp": "きつく、しっかりと", "pos": "副", "body": "靴ひもを<tightly>に結び直してから、スタートラインに立った。ゆるんだままでは全力で走れない。", "choices": ["きつく", "ゆるく", "適当に", "ほどいて"], "correct_index": 0, "explanation": "tight(きつい)+ -ly。", "id": "s4_547", "body_ruby": "靴《くつ》ひもを<tightly>に結《むす》び直《なお》してから、スタートラインに立《た》った。ゆるんだままでは全力《ぜんりょく》で走《はし》れない。", "choices_ruby": ["きつく", "ゆるく", "適当《てきとう》に", "ほどいて"], "explanation_ruby": "tight(きつい)+ -ly。", "body_kana": "くつひもを<tightly>にむすびなおしてから、スタートラインにたった。ゆるんだままではぜんりょくではしれない。"}, {"word": "timing", "meaning_jp": "タイミング", "pos": "名", "body": "大縄跳びは入る<timing>がすべてだ。縄が地面を打つ音に合わせて、ひとりずつ飛び込んでいく。", "choices": ["タイミング", "人数", "場所", "服装"], "correct_index": 0, "explanation": "time + -ing。ちょうどよい瞬間。", "id": "s4_548", "body_ruby": "大縄《おおなわ》跳《と》びは入《はい》る<timing>がすべてだ。縄《なわ》が地面《じめん》を打《う》つ音《おと》に合《あ》わせて、ひとりずつ｜飛び込《とびこ》んでいく。", "choices_ruby": ["タイミング", "人数《にんずう》", "場所《ばしょ》", "服装《ふくそう》"], "explanation_ruby": "time + -ing。ちょうどよい瞬間《しゅんかん》。", "body_kana": "おおなわとびははいる<timing>がすべてだ。なわがじめんをうつおとにあわせて、ひとりずつとびこんでいく。"}, {"word": "title", "meaning_jp": "題名、タイトル", "pos": "名", "body": "読書感想文の<title>を「ぼくと100年前の友達」にしたら、先生が「読みたくなる題だね」と言った。", "choices": ["題名", "著者", "値段", "ページ数"], "correct_index": 0, "explanation": "本・映画・曲の名前。チャンピオンの「タイトル」も。", "id": "s4_549", "body_ruby": "読書感想文《どくしょかんそうぶん》の<title>を「ぼくと100年《ねん》前《まえ》の友達《ともだち》」にしたら、先生《せんせい》が「読《よ》みたくなる題《だい》だね」と言《い》った。", "choices_ruby": ["題名《だいめい》", "著者《ちょしゃ》", "値段《ねだん》", "ページ数《かず》"], "explanation_ruby": "本《ほん》・映画《えいが》・曲《きょく》の名前《なまえ》。チャンピオンの「タイトル」も。", "body_kana": "どくしょかんそうぶんの<title>を「ぼくと100年まえのともだち」にしたら、せんせいが「よみたくなるだいだね」といった。"}, {"word": "toast", "meaning_jp": "トースト", "pos": "名", "body": "朝食の<toast>は、こんがり焼けた表面にバターを塗り、はちみつを少し垂らすのが定番だ。", "choices": ["トースト", "おにぎり", "シリアル", "ゆで卵"], "correct_index": 0, "explanation": "焼いたパン。乾杯の「トースト」も同じ語。", "id": "s4_550", "body_ruby": "朝食《ちょうしょく》の<toast>は、こんがり焼《や》けた表面《ひょうめん》にバターを塗《ぬ》り、はちみつを少《すこ》し垂《た》らすのが定番《ていばん》だ。", "choices_ruby": ["トースト", "おにぎり", "シリアル", "ゆで卵《たまご》"], "explanation_ruby": "焼《や》いたパン。乾杯《かんぱい》の「トースト」も同《おな》じ語《ご》。", "body_kana": "ちょうしょくの<toast>は、こんがりやけたひょうめんにバターをぬり、はちみつをすこしたらすのがていばんだ。"}, {"word": "tongue", "meaning_jp": "舌", "pos": "名", "body": "熱いスープを勢いよく飲んで<tongue>をやけどしてしまい、しばらく味がよく分からなかった。", "choices": ["舌", "唇", "歯", "のど"], "correct_index": 0, "explanation": "発音は「タン」。mother tongue = 母語。", "id": "s4_551", "body_ruby": "熱《あつ》いスープを勢《いきお》いよく飲《の》んで<tongue>をやけどしてしまい、しばらく味《あじ》がよく分《わ》からなかった。", "choices_ruby": ["舌《した》", "唇《くちびる》", "歯《は》", "のど"], "explanation_ruby": "発音《はつおん》は「タン」。mother tongue = 母語《ぼご》。", "body_kana": "あついスープをいきおいよくのんで<tongue>をやけどしてしまい、しばらくあじがよくわからなかった。"}, {"word": "tonight", "meaning_jp": "今夜", "pos": "副/名", "body": "<tonight>は十五夜なので、夕食の後に家族で月見団子を持って縁側に集まる予定だ。", "choices": ["今夜", "昨夜", "明朝", "毎晩"], "correct_index": 0, "explanation": "to + night。今日の夜。", "id": "s4_552", "body_ruby": "<tonight>は十五夜《じゅうごや》なので、夕食《ゆうしょく》の後《あと》に家族《かぞく》で月見《つきみ》団子《だんご》を持《も》って縁側《えんがわ》に集《あつ》まる予定《よてい》だ。", "choices_ruby": ["今夜《こんや》", "昨夜《さくや》", "明朝《みょうちょう》", "毎晩《まいばん》"], "explanation_ruby": "to + night。今日《きょう》の夜《よる》。", "body_kana": "<tonight>はじゅうごやなので、ゆうしょくのあとにかぞくでつきみだんごをもってえんがわにあつまるよていだ。"}, {"word": "tool", "meaning_jp": "道具", "pos": "名", "body": "棚の組み立てには、ドライバーと六角レンチの2つの<tool>が必要だと説明書にあった。", "choices": ["道具", "材料", "部品", "設計図"], "correct_index": 0, "explanation": "作業に使う器具。toolbox = 道具箱。", "id": "s4_553", "body_ruby": "棚《たな》の｜組み立《くみた》てには、ドライバーと六角《ろっかく》レンチの2つの<tool>が必要《ひつよう》だと説明書《せつめいしょ》にあった。", "choices_ruby": ["道具《どうぐ》", "材料《ざいりょう》", "部品《ぶひん》", "設計図《せっけいず》"], "explanation_ruby": "作業《さぎょう》に使《つか》う器具《きぐ》。toolbox = 道具箱《どうぐばこ》。", "body_kana": "たなのくみたてには、ドライバーとろっかくレンチの2つの<tool>がひつようだとせつめいしょにあった。"}, {"word": "toothache", "meaning_jp": "歯痛", "pos": "名", "body": "冷たい水がしみる<toothache>を我慢していたら悪化して、結局3回も歯医者に通うことになった。", "choices": ["歯痛", "頭痛", "腹痛", "肩こり"], "correct_index": 0, "explanation": "tooth(歯)+ ache(痛み)。", "id": "s4_554", "body_ruby": "冷《つめ》たい水《みず》がしみる<toothache>を我慢《がまん》していたら悪化《あっか》して、結局《けっきょく》3回《かい》も歯医者《はいしゃ》に通《かよ》うことになった。", "choices_ruby": ["歯痛《はいた》", "頭痛《ずつう》", "腹痛《ふくつう》", "肩《かた》こり"], "explanation_ruby": "tooth(歯《は》)+ ache(痛《いた》み)。", "body_kana": "つめたいみずがしみる<toothache>をがまんしていたらあっかして、けっきょく3回もはいしゃにかようことになった。"}, {"word": "toothbrush", "meaning_jp": "歯ブラシ", "pos": "名", "body": "歯医者さんに、毛先の開いた<toothbrush>は磨けていないので月に1回は交換するよう言われた。", "choices": ["歯ブラシ", "くし", "綿棒", "タオル"], "correct_index": 0, "explanation": "tooth + brush。", "id": "s4_555", "body_ruby": "歯医者《はいしゃ》さんに、毛先《けさき》の開《ひら》いた<toothbrush>は磨《みが》けていないので月《がつ》に1回《かい》は交換《こうかん》するよう言《い》われた。", "choices_ruby": ["歯《は》ブラシ", "くし", "綿棒《めんぼう》", "タオル"], "explanation_ruby": "tooth + brush。", "body_kana": "はいしゃさんに、けさきのひらいた<toothbrush>はみがけていないのでがつに1回はこうかんするよういわれた。"}, {"word": "total", "meaning_jp": "合計", "pos": "名/形", "body": "レシートの<total>は2,980円。ひとつずつの値段を足し算すると、確かにその金額になった。", "choices": ["合計", "割引", "税金", "おつり"], "correct_index": 0, "explanation": "in total = 合計で。totally = 完全に。", "id": "s4_556", "body_ruby": "レシートの<total>は2,980円《えん》。ひとつずつの値段《ねだん》を｜足し算《たしざん》すると、確《たし》かにその金額《きんがく》になった。", "choices_ruby": ["合計《ごうけい》", "割引《わりびき》", "税金《ぜいきん》", "おつり"], "explanation_ruby": "in total = 合計《ごうけい》で。totally = 完全《かんぜん》に。", "body_kana": "レシートの<total>は2,980円。ひとつずつのねだんをたしざんすると、たしかにそのきんがくになった。"}, {"word": "tough", "meaning_jp": "大変な、たくましい", "pos": "形", "body": "夏合宿の最終日は、山道10キロ走という<tough>なメニューで、全員が膝に手をついてゴールした。", "choices": ["過酷な", "楽な", "短い", "退屈な"], "correct_index": 0, "explanation": "発音は「タフ」。難しい・頑丈な。", "id": "s4_557", "body_ruby": "夏合宿《なつがっしゅく》の最終日《さいしゅうび》は、山道《やまみち》10キロ走《はし》という<tough>なメニューで、全員《ぜんいん》が膝《ひざ》に手《て》をついてゴールした。", "choices_ruby": ["過酷《かこく》な", "楽《らく》な", "短《みじか》い", "退屈《たいくつ》な"], "explanation_ruby": "発音《はつおん》は「タフ」。難《むずか》しい・頑丈《がんじょう》な。", "body_kana": "なつがっしゅくのさいしゅうびは、やまみち10キロはしという<tough>なメニューで、ぜんいんがひざにてをついてゴールした。"}, {"word": "towel", "meaning_jp": "タオル", "pos": "名", "body": "プールから上がると、まず<towel>で頭をごしごし拭く。体に残った水滴は意外と冷える。", "choices": ["タオル", "せっけん", "くし", "上着"], "correct_index": 0, "explanation": "bath towel = バスタオル。", "id": "s4_558", "body_ruby": "プールから上《あ》がると、まず<towel>で頭《あたま》をごしごし拭《ふ》く。体《からだ》に残《のこ》った水滴《すいてき》は意外《いがい》と冷《ひ》える。", "choices_ruby": ["タオル", "せっけん", "くし", "上着《うわぎ》"], "explanation_ruby": "bath towel = バスタオル。", "body_kana": "プールからあがると、まず<towel>であたまをごしごしふく。からだにのこったすいてきはいがいとひえる。"}, {"word": "tower", "meaning_jp": "塔、タワー", "pos": "名", "body": "東京の<tower>は高さ333メートル。展望台から見下ろすと、車が豆粒のように流れていた。", "choices": ["塔", "橋", "ドーム", "トンネル"], "correct_index": 0, "explanation": "Tokyo Tower、Eiffel Tower など。", "id": "s4_559", "body_ruby": "東京《とうきょう》の<tower>は高《たか》さ333メートル。展望台《てんぼうだい》から見下《みお》ろすと、車《くるま》が豆粒《まめつぶ》のように流《なが》れていた。", "choices_ruby": ["塔《とう》", "橋《はし》", "ドーム", "トンネル"], "explanation_ruby": "Tokyo Tower、Eiffel Tower など。", "body_kana": "とうきょうの<tower>はたかさ333メートル。てんぼうだいからみおろすと、くるまがまめつぶのようにながれていた。"}, {"word": "trade", "meaning_jp": "貿易、交換", "pos": "名/動", "body": "日本は資源を輸入し工業製品を輸出する<trade>で発展してきた。港には巨大なコンテナ船が並ぶ。", "choices": ["貿易", "農業", "観光", "祭り"], "correct_index": 0, "explanation": "国と国の売り買い。カードの「トレード」も。", "id": "s4_560", "body_ruby": "日本《にっぽん》は資源《しげん》を輸入《ゆにゅう》し工業製品《こうぎょうせいひん》を輸出《ゆしゅつ》する<trade>で発展《はってん》してきた。港《みなと》には巨大《きょだい》なコンテナ船《ふね》が並《なら》ぶ。", "choices_ruby": ["貿易《ぼうえき》", "農業《のうぎょう》", "観光《かんこう》", "祭《まつ》り"], "explanation_ruby": "国《くに》と国《くに》の｜売り買《うりか》い。カードの「トレード」も。", "body_kana": "にっぽんはしげんをゆにゅうしこうぎょうせいひんをゆしゅつする<trade>ではってんしてきた。みなとにはきょだいなコンテナふねがならぶ。"}, {"word": "tradition", "meaning_jp": "伝統", "pos": "名", "body": "大みそかに年越しそばを食べるのは、江戸時代から続く日本の<tradition>だと言われる。", "choices": ["伝統", "流行", "発明", "事件"], "correct_index": 0, "explanation": "traditional = 伝統的な。代々受け継がれる習わし。", "id": "s4_561", "body_ruby": "大《おお》みそかに年越《としこ》しそばを食《た》べるのは、江戸時代《えどじだい》から続《つづ》く日本《にっぽん》の<tradition>だと言《い》われる。", "choices_ruby": ["伝統《でんとう》", "流行《りゅうこう》", "発明《はつめい》", "事件《じけん》"], "explanation_ruby": "traditional = 伝統的《でんとうてき》な。代々《だいだい》｜受け継《うけつ》がれる習《なら》わし。", "body_kana": "おおみそかにとしこしそばをたべるのは、えどじだいからつづくにっぽんの<tradition>だといわれる。"}, {"word": "traffic", "meaning_jp": "交通(量)", "pos": "名", "body": "連休初日の高速道路は<traffic>が集中し、30キロの渋滞で、車は歩く速さでしか進まなかった。", "choices": ["交通", "天気", "騒音", "観光"], "correct_index": 0, "explanation": "traffic light = 信号機。traffic jam = 渋滞。", "id": "s4_562", "body_ruby": "連休《れんきゅう》初日《しょにち》の高速道路《こうそくどうろ》は<traffic>が集中《しゅうちゅう》し、30キロの渋滞《じゅうたい》で、車《くるま》は歩《ある》く速《はや》さでしか進《すす》まなかった。", "choices_ruby": ["交通《こうつう》", "天気《てんき》", "騒音《そうおん》", "観光《かんこう》"], "explanation_ruby": "traffic light = 信号機《しんごうき》。traffic jam = 渋滞《じゅうたい》。", "body_kana": "れんきゅうしょにちのこうそくどうろは<traffic>がしゅうちゅうし、30キロのじゅうたいで、くるまはあるくはやさでしかすすまなかった。"}, {"word": "trainer", "meaning_jp": "トレーナー、調教師", "pos": "名", "body": "イルカの<trainer>が手を上げると、2頭が同時にジャンプして、輪を見事にくぐり抜けた。", "choices": ["調教師", "獣医", "飼育員の見習い", "観客"], "correct_index": 0, "explanation": "train(訓練する)+ -er。スポーツジムの指導者も。", "id": "s4_563", "body_ruby": "イルカの<trainer>が手《て》を上《あ》げると、2頭《あたま》が同時《どうじ》にジャンプして、輪《わ》を見事《みごと》にくぐり抜《ぬ》けた。", "choices_ruby": ["調教師《ちょうきょうし》", "獣医《じゅうい》", "飼育員《しいくいん》の見習《みなら》い", "観客《かんきゃく》"], "explanation_ruby": "train(訓練《くんれん》する)+ -er。スポーツジムの指導者《しどうしゃ》も。", "body_kana": "イルカの<trainer>がてをあげると、2あたまがどうじにジャンプして、わをみごとにくぐりぬけた。"}, {"word": "translate", "meaning_jp": "翻訳する", "pos": "動", "body": "海外の絵本を日本語に<translate>する仕事では、言葉だけでなく文化の違いまで言い換える工夫がいる。", "choices": ["翻訳する", "朗読する", "印刷する", "製本する"], "correct_index": 0, "explanation": "translation = 翻訳。translator = 翻訳者。", "id": "s4_564", "body_ruby": "海外《かいがい》の絵本《えほん》を日本語《にほんご》に<translate>する仕事《しごと》では、言葉《ことば》だけでなく文化《ぶんか》の違《ちが》いまで｜言い換《いいか》える工夫《くふう》がいる。", "choices_ruby": ["翻訳《ほんやく》する", "朗読《ろうどく》する", "印刷《いんさつ》する", "製本《せいほん》する"], "explanation_ruby": "translation = 翻訳《ほんやく》。translator = 翻訳者《ほんやくしゃ》。", "body_kana": "かいがいのえほんをにほんごに<translate>するしごとでは、ことばだけでなくぶんかのちがいまでいいかえるくふうがいる。"}, {"word": "transportation", "meaning_jp": "交通機関、輸送", "pos": "名", "body": "この島の<transportation>は1日3便のフェリーだけで、欠航すると本土へ渡る手段がなくなる。", "choices": ["交通手段", "通信手段", "産業", "発電方法"], "correct_index": 0, "explanation": "transport(輸送する)の名詞形。", "id": "s4_565", "body_ruby": "この島《しま》の<transportation>は1日《にち》3便《びん》のフェリーだけで、欠航《けっこう》すると本土《ほんど》へ渡《わた》る手段《しゅだん》がなくなる。", "choices_ruby": ["交通手段《こうつうしゅだん》", "通信手段《つうしんしゅだん》", "産業《さんぎょう》", "発電《はつでん》方法《ほうほう》"], "explanation_ruby": "transport(輸送《ゆそう》する)の名詞《めいし》形《かたち》。", "body_kana": "このしまの<transportation>は1日3びんのフェリーだけで、けっこうするとほんどへわたるしゅだんがなくなる。"}, {"word": "trap", "meaning_jp": "わな", "pos": "名", "body": "畑を荒らすイノシシ対策に、餌を仕掛けた檻の<trap>が設置され、1週間後に1頭かかった。", "choices": ["わな", "囲い", "かかし", "肥料"], "correct_index": 0, "explanation": "獲物を捕らえる仕掛け。", "id": "s4_566", "body_ruby": "畑《はたけ》を荒《あ》らすイノシシ対策《たいさく》に、餌《えさ》を仕掛《しか》けた檻《おり》の<trap>が設置《せっち》され、1週間《しゅうかん》後《のち》に1頭《あたま》かかった。", "choices_ruby": ["わな", "囲《かこ》い", "かかし", "肥料《ひりょう》"], "explanation_ruby": "獲物《えもの》を捕《と》らえる仕掛《しか》け。", "body_kana": "はたけをあらすイノシシたいさくに、えさをしかけたおりの<trap>がせっちされ、1週間のちに1あたまかかった。"}, {"word": "traveling", "meaning_jp": "旅行(すること)", "pos": "名", "body": "祖母の趣味は<traveling>で、47都道府県をすべて回り、今は2周目の旅の計画を立てている。", "choices": ["旅行", "読書", "編み物", "園芸"], "correct_index": 0, "explanation": "travel + -ing。バスケの反則名でもある。", "id": "s4_567", "body_ruby": "祖母《そぼ》の趣味《しゅみ》は<traveling>で、47都道府県《とどうふけん》をすべて回《まわ》り、今《いま》は2周目《しゅうめ》の旅《たび》の計画《けいかく》を立《た》てている。", "choices_ruby": ["旅行《りょこう》", "読書《どくしょ》", "編《あ》み物《もの》", "園芸《えんげい》"], "explanation_ruby": "travel + -ing。バスケの反則《はんそく》名《めい》でもある。", "body_kana": "そぼのしゅみは<traveling>で、47とどうふけんをすべてまわり、いまは2しゅうめのたびのけいかくをたてている。"}, {"word": "treasure", "meaning_jp": "宝物", "pos": "名", "body": "物語の海賊たちは、<treasure>の地図を奪い合い、金貨の眠る島を目指して航海する。", "choices": ["宝物", "武器", "食料", "薬"], "correct_index": 0, "explanation": "treasure hunt = 宝探し。大切なもの全般にも。", "id": "s4_568", "body_ruby": "物語《ものがたり》の海賊《かいぞく》たちは、<treasure>の地図《ちず》を｜奪い合《うばいあ》い、金貨《きんか》の眠《ねむ》る島《しま》を目指《めざ》して航海《こうかい》する。", "choices_ruby": ["宝物《たからもの》", "武器《ぶき》", "食料《しょくりょう》", "薬《くすり》"], "explanation_ruby": "treasure hunt = 宝《たから》探《さが》し。大切《たいせつ》なもの全般《ぜんぱん》にも。", "body_kana": "ものがたりのかいぞくたちは、<treasure>のちずをうばいあい、きんかのねむるしまをめざしてこうかいする。"}, {"word": "trophy", "meaning_jp": "トロフィー", "pos": "名", "body": "優勝チームには、金色に輝く<trophy>が手渡され、キャプテンがそれを高々と掲げた。", "choices": ["トロフィー", "賞状", "メダル", "花束"], "correct_index": 0, "explanation": "優勝の記念品。杯の形が多い。", "id": "s4_569", "body_ruby": "優勝《ゆうしょう》チームには、金色《きんいろ》に輝《かがや》く<trophy>が手渡《てわた》され、キャプテンがそれを高々《たかだか》と掲《かか》げた。", "choices_ruby": ["トロフィー", "賞状《しょうじょう》", "メダル", "花束《はなたば》"], "explanation_ruby": "優勝《ゆうしょう》の記念品《きねんひん》。杯《はい》の形《かたち》が多《おお》い。", "body_kana": "ゆうしょうチームには、きんいろにかがやく<trophy>がてわたされ、キャプテンがそれをたかだかとかかげた。"}, {"word": "truly", "meaning_jp": "本当に、心から", "pos": "副", "body": "助けてもらったお礼を、形だけでなく<truly>に伝えたくて、手紙を書いて直接渡した。", "choices": ["心から", "形式的に", "嫌々", "冗談で"], "correct_index": 0, "explanation": "true(本当の)+ -ly。", "id": "s4_570", "body_ruby": "助《たす》けてもらったお礼《れい》を、形《かたち》だけでなく<truly>に伝《つた》えたくて、手紙《てがみ》を書《か》いて直接《ちょくせつ》渡《わた》した。", "choices_ruby": ["心《こころ》から", "形式的《けいしきてき》に", "嫌々《いやいや》", "冗談《じょうだん》で"], "explanation_ruby": "true(本当《ほんとう》の)+ -ly。", "body_kana": "たすけてもらったおれいを、かたちだけでなく<truly>につたえたくて、てがみをかいてちょくせつわたした。"}, {"word": "trust", "meaning_jp": "信頼する", "pos": "動/名", "body": "約束を10年間守り続けてきた友人だから、今回も彼の言葉を<trust>している。", "choices": ["信頼する", "疑う", "無視する", "試す"], "correct_index": 0, "explanation": "believe より深い信頼。Trust me. = 任せて。", "id": "s4_571", "body_ruby": "約束《やくそく》を10年間《ねんかん》守《まも》り続《つづ》けてきた友人《ゆうじん》だから、今回《こんかい》も彼《かれ》の言葉《ことば》を<trust>している。", "choices_ruby": ["信頼《しんらい》する", "疑《うたが》う", "無視《むし》する", "試《ため》す"], "explanation_ruby": "believe より深《ふか》い信頼《しんらい》。Trust me. = 任《まか》せて。", "body_kana": "やくそくを10年間まもりつづけてきたゆうじんだから、こんかいもかれのことばを<trust>している。"}, {"word": "tube", "meaning_jp": "チューブ、管", "pos": "名", "body": "絵の具の<tube>を後ろから巻き上げるように絞ると、最後の一滴まで無駄なく使える。", "choices": ["チューブ", "瓶", "缶", "袋"], "correct_index": 0, "explanation": "細長い管状の容器。地下鉄(英)も tube。", "id": "s4_572", "body_ruby": "｜絵の具《えのぐ》の<tube>を後《うし》ろから｜巻き上《まきあ》げるように絞《しぼ》ると、最後《さいご》の一滴《いってき》まで無駄《むだ》なく使《つか》える。", "choices_ruby": ["チューブ", "瓶《びん》", "缶《かん》", "袋《ふくろ》"], "explanation_ruby": "細長《ほそなが》い管状《かんじょう》の容器《ようき》。地下鉄《ちかてつ》(英《えい》)も tube。", "body_kana": "えのぐの<tube>をうしろからまきあげるようにしぼると、さいごのいってきまでむだなくつかえる。"}, {"word": "tuna", "meaning_jp": "マグロ", "pos": "名", "body": "市場のせりでは、体長2メートルの<tuna>が並び、一番の大物には数百万円の値がついた。", "choices": ["マグロ", "サケ", "タイ", "イワシ"], "correct_index": 0, "explanation": "発音は「トゥーナ」。tuna salad = ツナサラダ。", "id": "s4_573", "body_ruby": "市場《しじょう》のせりでは、体長《たいちょう》2メートルの<tuna>が並《なら》び、一番《いちばん》の大物《おおもの》には数百万《すうひゃくまん》円《えん》の値《あたい》がついた。", "choices_ruby": ["マグロ", "サケ", "タイ", "イワシ"], "explanation_ruby": "発音《はつおん》は「トゥーナ」。tuna salad = ツナサラダ。", "body_kana": "しじょうのせりでは、たいちょう2メートルの<tuna>がならび、いちばんのおおものにはすうひゃくまんえんのあたいがついた。"}, {"word": "turkey", "meaning_jp": "七面鳥", "pos": "名", "body": "アメリカの感謝祭では、丸焼きの<turkey>が食卓の主役で、家族が切り分けを囲んで集まる。", "choices": ["七面鳥", "ニワトリ", "アヒル", "ガチョウ"], "correct_index": 0, "explanation": "国名トルコ(Turkey)と同じつづり。", "id": "s4_574", "body_ruby": "アメリカの感謝祭《かんしゃさい》では、丸焼《まるやき》きの<turkey>が食卓《しょくたく》の主役《しゅやく》で、家族《かぞく》が｜切り分《きりわ》けを囲《かこ》んで集《あつ》まる。", "choices_ruby": ["七面鳥《しちめんちょう》", "ニワトリ", "アヒル", "ガチョウ"], "explanation_ruby": "国名《こくめい》トルコ(Turkey)と同《おな》じつづり。", "body_kana": "アメリカのかんしゃさいでは、まるやききの<turkey>がしょくたくのしゅやくで、かぞくがきりわけをかこんであつまる。"}, {"word": "turning", "meaning_jp": "曲がること、転換", "pos": "名", "body": "あの試合の逆転劇が、チームにとって大きな<turning>ポイントになり、そこから10連勝が始まった。", "choices": ["転換", "終了", "開始", "中断"], "correct_index": 0, "explanation": "turn + -ing。turning point = 転機。", "id": "s4_575", "body_ruby": "あの試合《しあい》の逆転劇《ぎゃくてんげき》が、チームにとって大《おお》きな<turning>ポイントになり、そこから10連勝《れんしょう》が始《はじ》まった。", "choices_ruby": ["転換《てんかん》", "終了《しゅうりょう》", "開始《かいし》", "中断《ちゅうだん》"], "explanation_ruby": "turn + -ing。turning point = 転機《てんき》。", "body_kana": "あのしあいのぎゃくてんげきが、チームにとっておおきな<turning>ポイントになり、そこから10れんしょうがはじまった。"}, {"word": "twenty-first", "meaning_jp": "21番目の", "pos": "形", "body": "<twenty-first>世紀は2001年に始まった。20世紀の次、私たちが生きている100年間だ。", "choices": ["21番目の", "12番目の", "20番目の", "21個の"], "correct_index": 0, "explanation": "twenty + first。21st と略記する。", "id": "s4_576", "body_ruby": "<twenty-first>世紀《せいき》は2001年《ねん》に始《はじ》まった。20世紀《せいき》の次《つぎ》、私《わたし》たちが生《い》きている100年間《ねんかん》だ。", "choices_ruby": ["21番目《ばんめ》の", "12番目《ばんめ》の", "20番目《ばんめ》の", "21個《こ》の"], "explanation_ruby": "twenty + first。21st と略記《りゃくき》する。", "body_kana": "<twenty-first>せいきは2001年にはじまった。20せいきのつぎ、わたしたちがいきている100年間だ。"}, {"word": "twenty-second", "meaning_jp": "22番目の", "pos": "形", "body": "11月の<twenty-second>の日は「いい夫婦の日」と呼ばれる。11と22の語呂合わせだ。", "choices": ["22番目の", "2番目の", "20番目の", "22個の"], "correct_index": 0, "explanation": "twenty + second。22nd と略記。", "id": "s4_577", "body_ruby": "11月《がつ》の<twenty-second>の日《ひ》は「いい夫婦《ふうふ》の日《ひ》」と呼《よ》ばれる。11と22の語呂《ごろ》合《あ》わせだ。", "choices_ruby": ["22番目《ばんめ》の", "2番目《ばんめ》の", "20番目《ばんめ》の", "22個《こ》の"], "explanation_ruby": "twenty + second。22nd と略記《りゃくき》。", "body_kana": "11月の<twenty-second>のひは「いいふうふのひ」とよばれる。11と22のごろあわせだ。"}, {"word": "twenty-third", "meaning_jp": "23番目の", "pos": "形", "body": "11月の<twenty-third>の日は勤労感謝の日で、23日が平日なら学校も休みになる。", "choices": ["23番目の", "3番目の", "30番目の", "23個の"], "correct_index": 0, "explanation": "twenty + third。23rd と略記。", "id": "s4_578", "body_ruby": "11月《がつ》の<twenty-third>の日《ひ》は勤労感謝《きんろうかんしゃ》の日《ひ》で、23日《にち》が平日《へいじつ》なら学校《がっこう》も休《やす》みになる。", "choices_ruby": ["23番目《ばんめ》の", "3番目《ばんめ》の", "30番目《ばんめ》の", "23個《こ》の"], "explanation_ruby": "twenty + third。23rd と略記《りゃくき》。", "body_kana": "11月の<twenty-third>のひはきんろうかんしゃのひで、23日がへいじつならがっこうもやすみになる。"}, {"word": "twenty-fourth", "meaning_jp": "24番目の", "pos": "形", "body": "12月の<twenty-fourth>の夜はクリスマスイブ。25日の前日にあたるこの晩に、靴下を枕元に下げた。", "choices": ["24番目の", "4番目の", "14番目の", "24個の"], "correct_index": 0, "explanation": "twenty + fourth。24th と略記。", "id": "s4_579", "body_ruby": "12月《がつ》の<twenty-fourth>の夜《よる》はクリスマスイブ。25日《にち》の前日《ぜんじつ》にあたるこの晩《ばん》に、靴下《くつした》を枕元《まくらもと》に下《さ》げた。", "choices_ruby": ["24番目《ばんめ》の", "4番目《ばんめ》の", "14番目《ばんめ》の", "24個《こ》の"], "explanation_ruby": "twenty + fourth。24th と略記《りゃくき》。", "body_kana": "12月の<twenty-fourth>のよるはクリスマスイブ。25日のぜんじつにあたるこのばんに、くつしたをまくらもとにさげた。"}, {"word": "twenty-fifth", "meaning_jp": "25番目の", "pos": "形", "body": "12月の<twenty-fifth>の朝、つまりイブの翌朝に、枕元の靴下へプレゼントが届いていた。", "choices": ["25番目の", "5番目の", "15番目の", "25個の"], "correct_index": 0, "explanation": "twenty + fifth。25th と略記。", "id": "s4_580", "body_ruby": "12月《がつ》の<twenty-fifth>の朝《あさ》、つまりイブの翌朝《よくあさ》に、枕元《まくらもと》の靴下《くつした》へプレゼントが届《とど》いていた。", "choices_ruby": ["25番目《ばんめ》の", "5番目《ばんめ》の", "15番目《ばんめ》の", "25個《こ》の"], "explanation_ruby": "twenty + fifth。25th と略記《りゃくき》。", "body_kana": "12月の<twenty-fifth>のあさ、つまりイブのよくあさに、まくらもとのくつしたへプレゼントがとどいていた。"}, {"word": "twenty-sixth", "meaning_jp": "26番目の", "pos": "形", "body": "マラソン大会で彼は<twenty-sixth>でゴールした。出場50人のちょうど真ん中あたりの順位だ。", "choices": ["26番目の", "6番目の", "16番目の", "26個の"], "correct_index": 0, "explanation": "twenty + sixth。26th と略記。", "id": "s4_581", "body_ruby": "マラソン大会《た nd", "meaning_jp": "地下(の)", "pos": "形/名", "body": "この駅の<underground>の通路は迷路のようで、出口を間違えると反対側の街区に出てしまう。", "choices": ["地下の", "屋上の", "海上の", "空中の"], "correct_index": 0, "explanation": "under(下)+ ground(地面)。ロンドンの地下鉄の呼び名。", "id": "s4_589", "body_ruby": "この駅《えき》の<underground>の通路《つうろ》は迷路《めいろ》のようで、出口《でぐち》を間違《まちが》えると反対側《はんたいがわ》の街区《がいく》に出《で》てしまう。", "choices_ruby": ["地下《ちか》の", "屋上《おくじょう》の", "海上《かいじょう》の", "空《そら》中《なか》の"], "explanation_ruby": "under(下《した》)+ ground(地面《じめん》)。ロンドンの地下鉄《ちかてつ》の｜呼び名《よびな》。", "body_kana": "このえきの<underground>のつうろはめいろのようで、でぐちをまちがえるとはんたいがわのがいくにでてしまう。"}, {"word": "unicycle", "meaning_jp": "一輪車", "pos": "名", "body": "休み時間の校庭では、<unicycle>に乗った子たちが、1つの車輪でバランスを取りながら走り回る。", "choices": ["一輪車", "二輪車", "三輪車", "竹馬"], "correct_index": 0, "explanation": "uni(1つ)+ cycle(輪)。bicycle は2輪。", "id": "s4_590", "body_ruby": "｜休み時間《やすみじかん》の校庭《こうてい》では、<unicycle>に乗《の》った子《こ》たちが、1つの車輪《しゃりん》でバランスを取《と》りながら走《はし》り回《まわ》る。", "choices_ruby": ["一輪《いちりん》車《くるま》", "二輪車《にりんしゃ》", "三輪車《さんりんしゃ》", "竹馬《たけうま》"], "explanation_ruby": "uni(1つ)+ cycle(輪《わ》)。bicycle は2輪《わ》。", "body_kana": "やすみじかんのこうていでは、<unicycle>にのったこたちが、1つのしゃりんでバランスをとりながらはしりまわる。"}, {"word": "unique", "meaning_jp": "独特の、唯一の", "pos": "形", "body": "彼の自由研究のテーマは「セミの抜け殻の地図づくり」。誰ともかぶらない<unique>な発想だった。", "choices": ["独特の", "ありふれた", "伝統的な", "流行の"], "correct_index": 0, "explanation": "uni(1つ)が語源。世界に1つだけの。", "id": "s4_591", "body_ruby": "彼《かれ》の自由研究《じゆうけんきゅう》のテーマは「セミの抜《ぬ》け殻《から》の地図《ちず》づくり」。誰《だれ》ともかぶらない<unique>な発想《はっそう》だった。", "choices_ruby": ["独特《どくとく》の", "ありふれた", "伝統的《でんとうてき》な", "流行《りゅうこう》の"], "explanation_ruby": "uni(1つ)が語源《ごげん》。世界《せかい》に1つだけの。", "body_kana": "かれのじゆうけんきゅうのテーマは「セミのぬけからのちずづくり」。だれともかぶらない<unique>なはっそうだった。"}, {"word": "unplug", "meaning_jp": "プラグを抜く", "pos": "動", "body": "雷が近づいてきたので、パソコンの電源コードを<unplug>して、コンセントから外しておいた。", "choices": ["プラグを抜く", "差し込む", "充電する", "修理する"], "correct_index": 0, "explanation": "un(逆)+ plug(差し込む)。", "id": "s4_592", "body_ruby": "雷《かみなり》が近《ちか》づいてきたので、パソコンの電源《でんげん》コードを<unplug>して、コンセントから外《はず》しておいた。", "choices_ruby": ["プラ 国。首都はカラカス。", "id": "s4_596", "body_ruby": "南米《なんべい》の<Venezuela>には、落差《らくさ》979メートルと世界一《せかいいち》を誇《ほこ》るエンジェルフォールという滝《たき》がある。", "choices_ruby": ["ベネズエラ", "ブラジル", "ペルー", "アルゼンチン"], "explanation_ruby": "南《みなみ》アメリカ北部《ほくぶ》の国《くに》。首都《しゅと》はカラカス。", "body_kana": "なんべいの<Venezuela>には、らくさ979メートルとせかいいちをほこるエンジェルフォールというたきがある。"}, {"word": "Vietnam", "meaning_jp": "ベトナム", "pos": "名", "body": "東南アジアの<Vietnam>は、フォーという米の麺料理や、アオザイという民族衣装で知られる。", "choices": ["ベトナム", "タイ", "カンボジア", "ラオス"], "correct_index": 0, "explanation": "首都はハノイ。南北に細長い国。", "id": "s4_597", "body_ruby": "東南《とうなん》アジアの<Vietnam>は、フォーという米《こめ》の麺《めん》料理《りょうり》や、アオザイという民族衣装《みんぞくいしょう》で知《し》られる。", "choices_ruby": ["ベトナム", "タイ", "カンボジア", "ラオス"], "explanation_ruby": "首都《しゅと》はハノイ。南北《なんぼく》に細長《ほそなが》い国《くに》。", "body_kana": "とうなんアジアの<Vietnam>は、フォーというこめのめんりょうりや、アオザイというみんぞくいしょうでしられる。"}, {"word": "view", "meaning_jp": "眺め", "pos": "名", "body": "ホテルの部屋からの<view>は最高で、窓いっぱいに海と夕日が広がっていた。", "choices": ["眺め", "値段", "広さ", "設備"], "correct_index": 0, "explanation": "a room with a view = 眺めのよい部屋。", "id": "s4_598", "body_ruby": "ホテルの部屋《へや》からの<view>は最高《さいこう》で、窓《まど》いっぱいに海《うみ》と夕日《ゆうひ》が広《ひろ》がっていた。", "choices_ruby": ["眺《なが》め", "値段《ねだん》", "広《ひろ》さ", "設備《せつび》"], "explanation_ruby": "a room with a view = 眺《なが》めのよい部屋《へや》。", "body_kana": "ホテルのへやからの<view>はさいこうで、まどいっぱいにうみとゆうひがひろがっていた。"}, {"word": "vinegar", "meaning_jp": "酢", "pos": "名", "body": "すし飯は、炊きたてのご飯に<vinegar>と砂糖と塩を混ぜて作る。うちわであおぐと、つやが出る。", "choices": ["酢", "油", "みりん", "だし"], "correct_index": 0, "explanation": "酸っぱい調味料。", "id": "s4_599", "body_ruby": "すし飯《めし》は、炊《た》きたてのご飯《めし》に<vinegar>と砂糖《さとう》と塩《しお》を混《ま》ぜて作《つく》る。うちわであおぐと、つやが出《で》る。", "choices_ruby": ["酢《す》", "油《あぶら》", "みりん", "だし"], "explanation_ruby": "酸《す》っぱい調味料《ちょうみりょう》。", "body_kana": "すしめしは、たきたてのごめしに<vinegar>とさとうとしおをまぜてつくる。うちわであおぐと、つやがでる。"}, {"word": "volume", "meaning_jp": "音量、体積、巻", "pos": "名", "body": "イヤホンの<volume>を上げすぎると耳をいためるので、外の音が少し聞こえる大きさにしている。", "choices": ["音量", "画質", "電池残量", "周波数"], "correct_index": 0, "explanation": "音量・体積・本の巻数など「量」を表す。", "id": "s4_600 "歌《うた》う", "笑《わら》う"], "explanation_ruby": "shout(叫《さけ》ぶ)の対《つい》。ひそひそ声《こえ》で話《はな》す。", "body_kana": "としょしつでは、どうしてもはなすひつようがあるときだけ、みみもとで<whisper>するのがマナーだ。"}, {"word": "whole", "meaning_jp": "全体の", "pos": "形", "body": "誕生日には、ケーキを切り分けずに<whole>のまま1台買ってもらい、家族で好きなだけ切った。", "choices": ["丸ごとの", "半分の", "一切れの", "残りの"], "correct_index": 0, "explanation": "the whole world = 全世界。hole(穴)と同音。", "id": "s4_612", "body_ruby": "誕生日《たんじょうび》には、ケーキを｜切り分《きりわ》けずに<whole>のまま1台《だい》買《か》ってもらい、家族《かぞく》で好《す》きなだけ切《き》った。", "choices_ruby": ["丸《まる》ごとの", "半分《はんぶん》の", "一切《いっさい》れの", "残《のこ》りの"], "explanation_ruby": "the whole world = 全世界《ぜんせかい》。hole(穴《あな》)と同音《どうおん》。", "body_kana": "たんじょうびには、ケーキをきりわけずに<whole>のまま1台かってもらい、かぞくですきなだけきった。"}, {"word": "wife", "meaning_jp": "妻", "pos": "名", "body": "「これは<wife>が作った弁当なんです」と先生は嬉しそうに、卵焼きの入った弁当箱を見せた。", "choices": ["妻", "夫", "娘", "母"], "correct_index": 0, "explanation": "husband(夫)の対。複数形は wives。", "id": "s4_613", "body_ruby": "「これは<wife>が作《つく》った弁当《べんとう》なんです」と先生《せんせい》は嬉《うれ》しそうに、卵焼《たまごや》きの入《はい》った弁当箱《べんとうばこ》を見《み》せた。", "choices_ruby": ["妻《つま》", "夫《おっと》", "娘《むすめ》", "母《はは》"], "explanation_ruby": "husband(夫《おっと》)の対《つい》。複数形《ふくすうけい》は wives。", "body_kana": "「これは<wife>がつくったべんとうなんです」とせんせいはうれしそうに、たまごやきのはいったべんとうばこをみせた。"}, {"word": "wildcat", "meaning_jp": "ヤマネコ", "pos": "名", "body": "西表島の<wildcat>は、飼い猫に似ているが、れっきとした野生動物で、推定100頭ほどしかいない。", "choices": ["ヤマネコ", "飼い猫", "タヌキ", "キツネ"], "correct_index": 0, "explanation": "wild(野生の)+ cat。イリオモテヤマネコなど。", "id": "s4_614", "body_ruby": "西表《いりおもて》島《しま》の<wildcat>は、飼《か》い猫《ねこ》に似《に》ているが、れっきとした野生《やせい》動物《どうぶつ》で、推定《すいてい》100頭《あたま》ほどしかいない。", "choices_ruby": ["ヤマネコ", "飼《か》い猫《ねこ》", "タヌキ", "キツネ"], "explanation_ruby": "wild(野生《やせい》の)+ cat。イリオモテヤマネコなど。", "body_kana": "いりおもてしまの<wildcat>は、かいねこににているが、れっきとしたやせいどうぶつで、すいてい100あたまほどしかいない。"}, {"word": "wilderness", "meaning_jp": "手つかずの自然、荒野", "pos": "名", "body": "アラスカの<wilderness>には道路も電線もなく、見渡す限り人の手が入っていない森と川が広がる。", "choices": ["手つかずの自然", "大都会", "農地", "住宅街"], "correct_index": 0, "explanation": "wild + -erness。人が住まない自然のままの土地。", function escapeHTML(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderBody(s) {
  return escapeHTML(s)
    .replace(/｜([^《》｜]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>')
    .replace(/([一-龯々〆ヶ]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>')
    .replace(/&lt;(.+?)&gt;/g, '<span class="embed">$1</span>');
}

const cardsDiv = document.getElementById("cards");
const noResults = document.getElementById("no-results");
const statsEl = document.getElementById("stats");
const searchEl = document.getElementById("search");

DATA.forEach((q, i) => {
  const div = document.createElement("div");
  div.className = "card";
  div.dataset.word = q.word.toLowerCase();
  div.dataset.meaning = q.meaning_jp.toLowerCase();
  div.dataset.body = q.body.toLowerCase();
  div.dataset.pos = q.pos;
  div.dataset.idx = i + 1;
  div.innerHTML = `
    <div class="card-head">
      <span class="id">#${String(i+1).padStart(3,'0')}</span>
      <span class="word">${escapeHTML(q.word)}</span>
      <span class="pos">${escapeHTML(q.pos)}</span>
      <span class="meaning">${escapeHTML(q.meaning_jp)}</span>
    </div>
    <div class="body">${renderBody(q.body_ruby || q.body)}</div>
    <div class="choices-row">
      ${q.choices.map((c, idx) => `<span class="choice-chip ${idx === q.correct_index ? 'correct' : ''}">${"ABCD"[idx]}. ${renderBody((q.choices_ruby || q.choices)[idx] || c)}</span>`).join("")}
    </div>
    ${q.explanation ? `<div class="explanation">💡 ${renderBody(q.explanation_ruby || q.explanation)}</div>` : ''}
  `;
  cardsDiv.appendChild(div);
});

let currentPos = "all";

function filter() {
  const q = searchEl.value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll(".card").forEach(card => {
    const matchPos = currentPos === "all" || card.dataset.pos.includes(currentPos);
    const matchQuery = !q || card.dataset.word.includes(q) || card.dataset.meaning.includes(q) || card.dataset.body.includes(q);
    if (matchPos && matchQuery) {
      card.classList.remove("hidden");
      visible++;
    } else {
      card.classList.add("hidden");
    }
  });
  statsEl.textContent = visible + " / " + DATA.length;
  noResults.classList.toggle("hidden", visible > 0);
}

searchEl.addEventListener("input", filter);
document.querySelectorAll(".filter-chip[data-pos]").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".filter-chip[data-pos]").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentPos = chip.dataset.pos;
    filter();
  });
});
// ふりがな表示切替
document.getElementById("ruby-chip").addEventListener("click", function() {
  document.body.classList.toggle("no-ruby");
  this.classList.toggle("active", !document.body.classList.contains("no-ruby"));
});
filter();
</script>
